<!DOCTYPE html>
<!-- @dsCard group="Components" name="Testimonial on navy" subtitle="Italic serif quote, gold attribution" viewport="700x280" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GFC — Testimonial</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: var(--gfc-navy); font-family: var(--font-sans); }
  .card { max-width: 620px; }
  .mark { font-family: var(--font-serif); font-size: 80px; line-height: 0.5; color: var(--gfc-gold-light); display: block; margin-bottom: 6px; }
  .quote { font-family: var(--font-serif); font-size: 28px; line-height: 1.3; color: #fff; font-weight: 400; font-style: italic; margin: 0 0 20px; }
  .who { font-size: 14px; color: var(--gfc-gold-light); letter-spacing: 0.04em; }
  .who strong { font-weight: 600; color: #fff; font-style: normal; letter-spacing: 0; }
</style>
</head>
<body>
  <div class="card">
    <span class="mark">"</span>
    <p class="quote">My mother doesn't like to be alone and we were traveling. Godwins Family Care stepped in to care for her — they were amazing.</p>
    <div class="who"><strong>Summer</strong> · Family member of GFCLLC client</div>
  </div>
</body>
</html>
