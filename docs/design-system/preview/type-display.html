<!DOCTYPE html>
<!-- @dsCard group="Type" name="Display type" subtitle="Cormorant Garamond display + headlines" viewport="700x320" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GFC — Type / Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: var(--gfc-cream); }
  .row { padding: 14px 0; border-bottom: 1px solid var(--gfc-line); }
  .row:last-child { border: 0; }
  .meta { font: 600 11px var(--font-sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--gfc-ink-muted); margin-bottom: 6px; }
  .specimen-display { font-family: var(--font-serif); font-weight: 500; font-size: 64px; line-height: 1.05; letter-spacing: -0.01em; color: var(--gfc-navy); margin: 0; }
  .specimen-h1 { font-family: var(--font-serif); font-weight: 500; font-size: 44px; line-height: 1.1; color: var(--gfc-navy); margin: 0; }
  .specimen-h3 { font-family: var(--font-serif); font-weight: 600; font-size: 26px; color: var(--gfc-navy); margin: 0; }
</style>
</head>
<body>
  <div class="row">
    <div class="meta">Display · Cormorant Garamond · 64/68 · 500</div>
    <p class="specimen-display">Compassionate Care.</p>
  </div>
  <div class="row">
    <div class="meta">H1 · Cormorant Garamond · 44/48 · 500</div>
    <p class="specimen-h1">A reliable clinical partner for your family.</p>
  </div>
  <div class="row" style="border:0;">
    <div class="meta">H3 · Cormorant Garamond · 26/32 · 600</div>
    <p class="specimen-h3">Behavioral Support &amp; Cognitive Wellness</p>
  </div>
</body>
</html>
