<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Semantic colors" subtitle="Success, danger, info, highlight" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GFC — Semantic Colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--gfc-cream); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 16px; background: #fff; border-radius: 12px; box-shadow: var(--shadow-sm); }
  .dot { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; }
  .body { flex: 1; }
  .name { font-weight: 600; font-size: 14px; color: var(--gfc-navy); }
  .hex { font-size: 12px; color: var(--gfc-ink-muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .role { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gfc-ink-muted); margin-bottom: 2px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="row"><div class="dot" style="background: #3F7A5C;"></div><div class="body"><div class="role">Success</div><div class="name">Sage Green</div><div class="hex">#3F7A5C</div></div></div>
    <div class="row"><div class="dot" style="background: #B5462E;"></div><div class="body"><div class="role">Danger</div><div class="name">Brick</div><div class="hex">#B5462E</div></div></div>
    <div class="row"><div class="dot" style="background: #0A4F66;"></div><div class="body"><div class="role">Info</div><div class="name">Navy Soft</div><div class="hex">#0A4F66</div></div></div>
    <div class="row"><div class="dot" style="background: #C9A44A;"></div><div class="body"><div class="role">Highlight</div><div class="name">Gold</div><div class="hex">#C9A44A</div></div></div>
  </div>
</body>
</html>
