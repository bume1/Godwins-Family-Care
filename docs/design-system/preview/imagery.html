<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Imagery direction" subtitle="Warm, natural, in-home photography" viewport="700x250" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GFC — Imagery</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px; background: var(--gfc-cream); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: 1.1fr 0.9fr 0.8fr; gap: 12px; height: 220px; }
  .img { background-size: cover; background-position: center; border-radius: 14px; position: relative; overflow: hidden; }
  .lab { position: absolute; left: 12px; bottom: 12px; background: rgba(3, 61, 80, 0.85); color: #fff; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; font-weight: 600; }
</style>
</head>
<body>
  <div class="grid">
    <div class="img" style="background-image: url('../assets/photo-couple-walking.jpg');"><span class="lab">Lifestyle</span></div>
    <div class="img" style="background-image: url('../assets/photo-bp-checkup.jpg');"><span class="lab">In-home care</span></div>
    <div class="img" style="background-image: url('../assets/team-bethel.webp');"><span class="lab">Team portrait</span></div>
  </div>
</body>
</html>
