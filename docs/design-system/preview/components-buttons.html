<!DOCTYPE html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Pill primary, gold, outline, ghost" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GFC — Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: var(--gfc-cream); font-family: var(--font-sans); }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
  .row:last-child { margin-bottom: 0; }
  .lab { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gfc-ink-muted); font-weight: 600; width: 100%; margin-bottom: 4px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 26px;
    border-radius: 999px;
    font: 600 16px/1 var(--font-sans);
    letter-spacing: 0.04em;
    border: 0; cursor: pointer; text-decoration: none;
    transition: all 200ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .btn-primary { background: var(--gfc-navy); color: #fff; }
  .btn-primary:hover { background: var(--gfc-navy-deep); }
  .btn-gold { background: var(--gfc-gold); color: var(--gfc-navy); }
  .btn-gold:hover { background: #b89139; }
  .btn-outline { background: transparent; color: var(--gfc-navy); box-shadow: inset 0 0 0 1.5px var(--gfc-navy); }
  .btn-outline:hover { background: var(--gfc-navy); color: #fff; }
  .btn-ghost { background: transparent; color: var(--gfc-navy); padding: 14px 18px; }
  .btn-ghost:hover { color: var(--gfc-gold); }
  .btn-sm { padding: 10px 18px; font-size: 14px; }
</style>
</head>
<body>
  <div class="row">
    <span class="lab">Primary actions</span>
    <button class="btn btn-primary">Schedule consultation</button>
    <button class="btn btn-gold">Call (404) 913-6705</button>
    <button class="btn btn-outline">Learn more</button>
    <button class="btn btn-ghost">View services →</button>
  </div>
  <div class="row">
    <span class="lab">Small / inline</span>
    <button class="btn btn-primary btn-sm">Submit referral</button>
    <button class="btn btn-gold btn-sm">Get brochure</button>
    <button class="btn btn-outline btn-sm">Read more</button>
  </div>
</body>
</html>
