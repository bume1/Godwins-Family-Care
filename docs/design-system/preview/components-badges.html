<!DOCTYPE html>
<!-- @dsCard group="Components" name="Badges" subtitle="Pill badges across surface variants" viewport="700x120" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GFC — Badges</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: var(--gfc-cream); font-family: var(--font-sans); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  .row:last-child { margin-bottom: 0; }
  .lab { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gfc-ink-muted); font-weight: 600; width: 100%; margin-bottom: 4px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .b-gold { background: var(--gfc-gold-pale); color: #7a5e1b; }
  .b-navy { background: var(--gfc-navy); color: #fff; }
  .b-outline { background: transparent; color: var(--gfc-navy); box-shadow: inset 0 0 0 1.5px var(--gfc-navy); }
  .b-success { background: rgba(63, 122, 92, 0.14); color: #2d5a43; }
  .b-cream { background: var(--gfc-cream-warm); color: var(--gfc-navy); box-shadow: inset 0 0 0 1px var(--gfc-line); }
  .dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; }
</style>
</head>
<body>
  <div class="row">
    <span class="lab">Pills &amp; badges</span>
    <span class="badge b-gold">Specialty Tier</span>
    <span class="badge b-navy">Physician-Owned</span>
    <span class="badge b-outline">FNP-Led</span>
    <span class="badge b-cream">Cobb County</span>
    <span class="badge b-success"><span class="dot"></span>Accepting clients</span>
  </div>
</body>
</html>
