<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Godwins Family Care — Staff Onboarding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.1.0/dist/tabler-icons.min.css">
  <script src="/gfc-time.js"></script>
  <script>window.GFC_TIME && window.GFC_TIME.installDefaultTimeZone();</script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <link rel="icon" type="image/png" href="/brand/logo-mark-transparent.png">
  <style>
    :root{--navy:#033D50;--navy-deep:#022A38;--navy-soft:#0A4F66;--gold:#C9A44A;--gold-light:#F5CD85;--gold-pale:#F1E2BE;
      --cream:#FAF7F2;--cream-warm:#F2EBDD;--ink:#1B2A33;--mut:#4F6470;--line:#E1D9C9;--green:#3F7A5C;--red:#B5462E;--amber:#C98A1A;--grey:#9AA5AB}
    *{box-sizing:border-box}
    body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
    h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;color:var(--navy);margin:0;line-height:1.15}
    h1{font-size:34px} h2{font-size:24px} h3{font-size:20px}
    a{color:var(--navy)}
    button{font-family:inherit}
    /* The sidebar navy is painted on the whole row, so it runs the full height of a long page. */
    .shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh;background:linear-gradient(90deg,var(--navy) 230px,transparent 230px)}
    .side{background:var(--navy);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh}
    .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
    .brand img{width:38px;height:38px}
    .brand b{font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1.05;color:#fff}
    .nav button{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;color:#fff;padding:11px 12px;border-radius:10px;font-size:15px;cursor:pointer;text-align:left}
    .nav button.on{background:#9A7A33}
    .nav button:hover:not(.on){background:var(--navy-soft)}
    .nav i{font-size:20px}
    .main{padding:22px 28px 60px;max-width:1400px}
    .top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
    .sub{color:var(--mut);font-family:'Cormorant Garamond',serif;font-size:19px;margin-top:4px}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
    .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:14px;align-items:center}
    .stat .ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px}
    .stat .n{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;color:var(--navy);line-height:1}
    .stat .l{font-size:14px;color:var(--ink)} .stat .s{font-size:12.5px;color:var(--mut)}
    .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
    .card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
    .card-h h2{font-size:22px;border-bottom:2px solid var(--gold);padding-bottom:4px}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
    td{padding:10px 8px;border-bottom:1px solid #F1ECE1;vertical-align:middle}
    tr.click{cursor:pointer} tr.click:hover td{background:var(--cream)}
    .pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
    .p-NOT_STARTED{background:#F3F1EC;color:var(--mut);border:1px solid var(--line)}
    .p-IN_PROGRESS{background:#E6EEF2;color:var(--navy)}
    .p-SUBMITTED{background:#F8EED7;color:#7A5A12}
    .p-RETURNED{background:#FBE9E5;color:var(--red)}
    .p-COMPLETE{background:#E7F1EB;color:var(--green)}
    .p-EXPIRED{background:#FCF1DA;color:#8A5F0F}
    .p-NOT_APPLICABLE{background:#EEF0F1;color:var(--grey)}
    .p-her{background:var(--navy);color:#fff}
    .p-office{background:#FFF6E2;color:#7A5A12;border:1px solid var(--gold-light)}
    .chip{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11.5px;color:var(--mut);background:var(--cream)}
    .chip.legal{border-color:#B9CED6;color:var(--navy);background:#EEF4F6}
    .bar{height:8px;background:#EFE8DA;border-radius:6px;overflow:hidden}
    .bar>span{display:block;height:100%;background:#A97E2B;border-radius:6px}
    .btn{border-radius:9px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--navy);background:var(--navy);color:#fff;display:inline-flex;gap:7px;align-items:center}
    .btn.gold{background:#A97E2B;border-color:#A97E2B}
    .btn.ghost{background:#fff;color:var(--navy)}
    .btn.warn{background:#fff;color:var(--red);border-color:var(--red)}
    .btn.sm{padding:6px 10px;font-size:13px}
    .btn[disabled]{opacity:.5;cursor:not-allowed}
    .tabs{display:flex;gap:6px;flex-wrap:wrap}
    .tabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 13px;font-size:14px;cursor:pointer;color:var(--navy)}
    .tabs button.on{background:#A97E2B;border-color:#A97E2B;color:#fff}
    .phases{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}
    .ph{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;cursor:pointer;text-align:left}
    .ph.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-pale)}
    .ph .num{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:1.5px solid var(--navy);color:var(--navy);margin-bottom:6px}
    .ph.done .num{background:var(--green);border-color:var(--green);color:#fff}
    .ph b{display:block;font-size:13.5px;color:var(--navy)} .ph small{color:var(--mut);font-size:12px}
    .item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid #F1ECE1;cursor:pointer}
    .item:last-child{border-bottom:0}
    .item .dot{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px}
    .item .t{flex:1;min-width:0} .item .t b{font-weight:500}
    .item .meta{font-size:12.5px;color:var(--mut)}
    .grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
    .drawer-bg{position:fixed;inset:0;background:rgba(2,42,56,.35);z-index:20}
    .drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:#fff;z-index:21;padding:22px;overflow:auto;box-shadow:-8px 0 30px rgba(0,0,0,.12)}
    .steps{border-left:2px solid var(--line);margin:10px 0 14px 10px;padding-left:16px}
    .step{position:relative;padding:6px 0 12px}
    .step:before{content:'';position:absolute;left:-23px;top:9px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--line)}
    .step.done:before{background:var(--green);border-color:var(--green)}
    .err{background:#FBE9E5;border:1px solid #EBC3B8;color:var(--red);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
    .ok{background:#E7F1EB;border:1px solid #BCD9C7;color:var(--green);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
    .note{background:var(--cream);border:1.5px dashed var(--gold);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--mut);margin:8px 0}
    input,textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
    label.f{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--mut);margin:10px 0 4px}
    .legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--mut)}
    .legend span{display:inline-flex;gap:6px;align-items:center}
    .sw{width:12px;height:12px;border-radius:50%;display:inline-block}
    .line-card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
    .line-card h3{font-size:18px}
    /* her view: phone first */
    .me{max-width:640px;margin:0 auto;padding:18px 16px 90px}
    .ring{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;color:var(--navy)}
    .next{background:#FFF8EA;border:1px solid var(--gold-light);border-radius:14px;padding:14px;margin:12px 0;display:flex;gap:12px;align-items:center}
    .acc{border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:10px;overflow:hidden}
    .acc-h{display:flex;gap:12px;align-items:center;padding:14px;cursor:pointer}
    .acc-b{padding:0 14px 10px}
    .bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 10px;z-index:10}
    .bottom button{background:none;border:0;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mut);cursor:pointer;min-width:64px;min-height:44px}
    .bottom button.on{color:#A97E2B} .bottom i{font-size:22px}
    @media (max-width:1100px){.grid2{grid-template-columns:1fr}.phases{grid-template-columns:repeat(3,1fr)}}
    @media (max-width:820px){.shell{grid-template-columns:1fr;background:none}.side{position:static;height:auto;display:flex;align-items:center;gap:6px;overflow-x:auto;padding:10px}.brand{padding:0 6px 0 0}.brand b{display:none}.nav{display:flex;gap:4px}.nav button{white-space:nowrap;padding:8px 10px}.main{padding:16px}.phases{grid-template-columns:repeat(2,1fr)}.hide-sm{display:none}}
  </style>
</head>
<body>
<div id="root"></div>
<script src="/session-guard.js"></script>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const getToken = () => localStorage.getItem('admin_token') || localStorage.getItem('unified_token') || localStorage.getItem('portal_token');

const call = async (path, opts = {}) => {
  const isForm = opts.body instanceof FormData;
  const res = await fetch(path, {
    method: opts.method || 'GET',
    headers: Object.assign({ Authorization: `Bearer ${getToken()}` }, isForm ? {} : { 'Content-Type': 'application/json' }),
    body: opts.body ? (isForm ? opts.body : JSON.stringify(opts.body)) : undefined
  });
  let data = null;
  try { data = await res.json(); } catch (e) { /* empty */ }
  if (!res.ok) {
    const err = new Error((data && data.error) || `Request failed (${res.status})`);
    err.code = data && data.code; err.status = res.status;
    throw err;
  }
  return data;
};

// A file opens through the app with the token in the HEADER, never the URL.
const openFile = async (path, name) => {
  const res = await fetch(path, { headers: { Authorization: `Bearer ${getToken()}` } });
  if (!res.ok) throw new Error('That file could not be opened.');
  const blob = await res.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name || 'document'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};

const TZ = window.GFC_TIME && window.GFC_TIME.PRACTICE_TIMEZONE;
const fmtDate = (iso) => {
  if (!iso) return '';
  const d = new Date(/^\d{4}-\d{2}-\d{2}$/.test(iso) ? `${iso}T12:00:00Z` : iso);
  return isNaN(d.getTime()) ? String(iso) : d.toLocaleDateString('en-US', { timeZone: TZ || undefined, month: 'short', day: 'numeric', year: 'numeric' });
};

// One vocabulary for status, the legend, and the pills.
const STATUS = {
  NOT_STARTED: { label: 'Not Started', sw: '#fff', border: '#9AA5AB', icon: '' },
  IN_PROGRESS: { label: 'In Progress', sw: '#033D50', icon: '' },
  SUBMITTED: { label: 'With the Office', sw: '#A97E2B', icon: 'ti-clock' },
  RETURNED: { label: 'Returned', sw: '#B5462E', icon: 'ti-arrow-back-up' },
  COMPLETE: { label: 'Complete', sw: '#3F7A5C', icon: 'ti-check' },
  EXPIRED: { label: 'Renewal Due', sw: '#C98A1A', icon: 'ti-refresh' },
  NOT_APPLICABLE: { label: 'Not Applicable', sw: '#C9CED1', icon: 'ti-minus' }
};
const ACTION_WORD = { SUBMIT: 'Sends', SIGN: 'Signs', ACKNOWLEDGE: 'Acknowledges', COMPLETE: 'Completes', VERIFY: 'Verifies',
  RECORD: 'Records', PROVISION: 'Sets up', EXECUTE: 'Issues', OBSERVE: 'Observes and signs off' };
const done = (s) => s === 'COMPLETE' || s === 'NOT_APPLICABLE';

const Pill = ({ status }) => <span className={`pill p-${status}`}>{STATUS[status] ? STATUS[status].label : status}</span>;

// Whose turn it is, from the viewer's side: "Waiting on You" only on her own
// screen; the office reads her name.
const Turn = ({ item, subjectName, viewerIsSubject }) => {
  if (done(item.status) || !item.next) return null;
  if (item.next.hers) {
    return <span className="pill p-her"><i className="ti ti-user" />{viewerIsSubject ? 'Waiting on You' : `Waiting on ${String(subjectName || 'Her').split(' ')[0]}`}</span>;
  }
  return <span className="pill p-office"><i className="ti ti-building" />Waiting on Office</span>;
};

// The document's own classification phrase, never ours. Items the source
// does not classify show no chip.
const Chips = ({ item }) => (item.classifications || []).length === 0 ? null : (
  <span style={{ display: 'inline-flex', gap: 4, flexWrap: 'wrap' }}>
    {Array.from(new Set(item.classifications.map(c => c.phrase))).map(p => {
      const legal = item.classifications.some(c => c.phrase === p && c.legal);
      return <span key={p} className={`chip ${legal ? 'legal' : ''}`}>{p}</span>;
    })}
  </span>
);

const Dot = ({ status }) => {
  const s = STATUS[status] || STATUS.NOT_STARTED;
  return <span className="dot" style={{ background: status === 'NOT_STARTED' ? '#fff' : s.sw, border: status === 'NOT_STARTED' ? '2px solid #9AA5AB' : 'none', color: '#fff' }}>
    {s.icon && <i className={`ti ${s.icon}`} />}
  </span>;
};

const Legend = () => (
  <div className="legend">
    {Object.entries(STATUS).map(([k, s]) => (
      <span key={k}><span className="sw" style={{ background: s.sw, border: k === 'NOT_STARTED' ? '2px solid #9AA5AB' : 'none' }} />{s.label}</span>
    ))}
  </div>
);

const pct = (t) => t && t.counts.items ? Math.round((t.counts.complete / t.counts.items) * 100) : 0;

// Every route spelled out in full, her door and the office's. The repo's
// orphan-route guard reads these, and a path assembled from a variable is a
// path it cannot see.
const PATHS = {
  step: (w, i, n) => w.office ? `/api/onboarding/admin/people/${w.userId}/items/${i}/steps/${n}` : `/api/onboarding/me/items/${i}/steps/${n}`,
  ack: (w, i, a) => w.office ? `/api/onboarding/admin/people/${w.userId}/items/${i}/acknowledgments/${a}` : `/api/onboarding/me/items/${i}/acknowledgments/${a}`,
  files: (w, i) => w.office ? `/api/onboarding/admin/people/${w.userId}/items/${i}/files` : `/api/onboarding/me/items/${i}/files`,
  file: (w, i, f) => w.office ? `/api/onboarding/admin/people/${w.userId}/items/${i}/files/${f}` : `/api/onboarding/me/items/${i}/files/${f}`,
  notes: (w, i) => w.office ? `/api/onboarding/admin/people/${w.userId}/items/${i}/notes` : `/api/onboarding/me/items/${i}/notes`,
  moduleComplete: (w, m) => w.office ? `/api/onboarding/admin/people/${w.userId}/modules/${m}/complete` : `/api/onboarding/me/modules/${m}/complete`,
  returnStep: (w, i) => `/api/onboarding/admin/people/${w.userId}/items/${i}/return`,
  notApplicable: (w, i) => `/api/onboarding/admin/people/${w.userId}/items/${i}/not-applicable`,
  determination: (w, d) => `/api/onboarding/admin/people/${w.userId}/determinations/${d}`,
  expiry: (w, i) => w.office ? `/api/onboarding/admin/people/${w.userId}/items/${i}/expiry` : `/api/onboarding/me/items/${i}/expiry`,
  renew: (w, i) => w.office ? `/api/onboarding/admin/people/${w.userId}/items/${i}/renew` : `/api/onboarding/me/items/${i}/renew`,
  recheck: (w, m) => w.office ? `/api/onboarding/admin/people/${w.userId}/modules/${m}/recheck` : `/api/onboarding/me/modules/${m}/recheck`,
  recurring: (w, r) => `/api/onboarding/admin/people/${w.userId}/recurring/${r}`,
  courseCert: (w, col, c) => w.office ? `/api/onboarding/admin/people/${w.userId}/courses/${col}/${c}/certificate` : `/api/onboarding/me/courses/${col}/${c}/certificate`,
  courseCertFile: (w, col, c, f) => w.office ? `/api/onboarding/admin/people/${w.userId}/courses/${col}/${c}/certificate/${f}` : `/api/onboarding/me/courses/${col}/${c}/certificate/${f}`,
  courseReturn: (w, col, c) => `/api/onboarding/admin/people/${w.userId}/courses/${col}/${c}/return`
};

// ---- Care Courses training (caregivers, owner 2026-11-09) --------------------
// Care Courses has no link to a single video, so each collection links its
// page; each course is proven by its certificate, uploaded here.
const CourseCollection = ({ col, base, office, onChanged }) => {
  const [busy, setBusy] = useState(''); const [msg, setMsg] = useState(''); const [err, setErr] = useState('');
  const send = async (courseId, file) => {
    if (!file) return;
    setBusy(courseId); setErr(''); setMsg('');
    try {
      const fd = new FormData(); fd.append('file', file);
      await call(PATHS.courseCert(base, col.id, courseId), { method: 'POST', body: fd });
      setMsg('Certificate received.'); await onChanged();
    } catch (e) { setErr(e.message); } finally { setBusy(''); }
  };
  const sendBack = async (courseId) => {
    const reason = window.prompt('Why is this certificate being sent back?');
    if (!reason) return;
    try { await call(PATHS.courseReturn(base, col.id, courseId), { method: 'POST', body: { reason } }); await onChanged(); } catch (e) { setErr(e.message); }
  };
  return (
    <div className="card">
      <div className="card-h"><h3 style={{ margin: 0 }}>{col.title}</h3><span>{col.totalHours ? `${col.hoursDone} of ${col.totalHours} hours · ` : ''}{col.coursesDone} of {col.coursesTotal} courses</span></div>
      <div className="bar"><span style={{ width: `${Math.round((col.totalHours ? col.hoursDone / col.totalHours : col.coursesDone / col.coursesTotal) * 100)}%` }} /></div>
      <p style={{ fontSize: 14, margin: '10px 0' }}>
        Take each course on Care Courses, then upload its certificate of completion here.
        {col.beforeClientHours ? ` The first ${col.beforeClientHours} hours are needed before you serve a client; the rest within ${col.withinMonths} months.` : col.cycle === 'initial' ? ' Required for every caregiver.' : ` This is your ${col.cycle} annual training.`}
      </p>
      {col.beforeClientHours && <div className={col.readyForClients ? 'ok' : 'note'}>{col.readyForClients ? `${col.beforeClientHours} hours done: ready to serve clients on this requirement.` : `${col.beforeClientHours - col.hoursDone > 0 ? (col.beforeClientHours - col.hoursDone) : 0} more hours before serving clients.`}</div>}
      {col.url && <a className="btn gold sm" href={col.url} target="_blank" rel="noopener noreferrer"><i className="ti ti-external-link" />Open the Courses</a>}
      {err && <div className="err">{err}</div>}{msg && <div className="ok">{msg}</div>}
      <div style={{ marginTop: 10 }}>
        {col.courses.map(c => (
          <div key={c.id} className="item" style={{ cursor: 'default', alignItems: 'flex-start' }}>
            <span className="dot" style={{ width: 22, height: 22, borderRadius: '50%', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', background: c.done ? 'var(--green)' : '#fff', color: '#fff', border: c.done ? 'none' : '1.5px solid #9AA5AB', flex: 'none' }}>{c.done && <i className="ti ti-check" />}</span>
            <div className="t" style={{ flex: 1 }}>
              <b>{c.title}</b>
              <div className="meta">{c.hours ? `${c.hours} ${c.hours === 1 ? 'hour' : 'hours'}` : 'Care Courses module'}{c.done ? ` · certificate on file ${fmtDate(c.at)}` : ''}</div>
              {c.url && <a href={c.url} target="_blank" rel="noopener noreferrer" style={{ fontSize: 13 }}><i className="ti ti-external-link" /> Open this course</a>}
              {c.returned && <div className="err" style={{ marginTop: 4 }}>Sent back: {c.returned.reason}</div>}
              {c.files.map(f => <div key={f.id} style={{ fontSize: 13 }}><a href="#" onClick={e => { e.preventDefault(); openFile(PATHS.courseCertFile(base, col.id, c.id, f.id), f.name).catch(x => setErr(x.message)); }}>{f.name}</a></div>)}
            </div>
            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', justifyContent: 'flex-end' }}>
              <label className="btn ghost sm" style={{ cursor: 'pointer' }}>
                {busy === c.id ? 'Uploading…' : (c.done ? 'Replace' : 'Upload Certificate')}
                <input type="file" accept="application/pdf,image/jpeg,image/png" style={{ display: 'none' }} disabled={!!busy} onChange={e => send(c.id, e.target.files[0])} />
              </label>
              {office && c.done && <button className="btn ghost sm" onClick={() => sendBack(c.id)}>Send Back</button>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
};

// ---- renewals and re-checks (both views) ------------------------------------
// Owner, 2026-11-08: nothing lapses unnoticed after the first ninety days.
const EXPIRY_PILL = { EXPIRED: ['p-RETURNED', 'Expired'], SOON: ['p-EXPIRED', 'Expires Soon'], OK: ['p-COMPLETE', 'Current'], NO_DATE: ['p-NOT_STARTED', 'No Date Yet'] };
const RECUR_PILL = { OVERDUE: ['p-RETURNED', 'Overdue'], SOON: ['p-EXPIRED', 'Due Soon'], OK: ['p-COMPLETE', 'On Track'], NO_START: ['p-NOT_STARTED', 'Needs a Start Date'], ON_EVENT: ['p-NOT_APPLICABLE', 'When It Happens'] };

const ExpiryRow = ({ x, base, onChanged, onError }) => {
  const [date, setDate] = useState(x.expiry.on || '');
  const pill = EXPIRY_PILL[x.expiry.status] || ['', ''];
  const save = async () => { try { await call(PATHS.expiry(base, x.id), { method: 'PUT', body: { expiresOn: date } }); await onChanged(); } catch (e) { onError(e.message); } };
  const renew = async () => {
    if (!window.confirm('Start the renewal? The item opens again for the new document. The old record is kept.')) return;
    try { await call(PATHS.renew(base, x.id), { method: 'POST', body: {} }); await onChanged(); } catch (e) { onError(e.message); }
  };
  return (
    <div className="item" style={{ cursor: 'default', flexWrap: 'wrap' }}>
      <div className="t" style={{ minWidth: 180 }}><b>{x.expiry.what}</b>
        <div className="meta">{x.expiry.on ? `Expires ${fmtDate(`${x.expiry.on}T12:00:00Z`)}${x.expiry.daysLeft >= 0 ? ` · ${x.expiry.daysLeft} days left` : ''}` : 'Expiration date not recorded'}{x.renewals ? ` · renewed ${x.renewals}×` : ''}</div></div>
      <input type="date" value={date} onChange={e => setDate(e.target.value)} style={{ maxWidth: 160 }} />
      <button className="btn sm ghost" disabled={!date || date === x.expiry.on} onClick={save}>Save Date</button>
      {(x.expiry.status === 'EXPIRED' || x.expiry.status === 'SOON') && <button className="btn sm" onClick={renew}>Start Renewal</button>}
      <span className={`pill ${pill[0]}`}>{pill[1]}</span>
    </div>
  );
};

const RecurringRow = ({ r, base, onChanged, onError }) => {
  const [date, setDate] = useState('');
  const pill = RECUR_PILL[r.status] || ['', ''];
  const record = async () => { try { await call(PATHS.recurring(base, r.id), { method: 'POST', body: { doneOn: date } }); setDate(''); await onChanged(); } catch (e) { onError(e.message); } };
  return (
    <div className="item" style={{ cursor: 'default', flexWrap: 'wrap' }}>
      <div className="t" style={{ minWidth: 200 }}><b>{r.requirement}</b>
        <div className="meta">{r.interval}{r.nextDue ? ` · next due ${fmtDate(`${r.nextDue}T12:00:00Z`)}` : ''}{r.lastDoneOn ? ` · last done ${fmtDate(`${r.lastDoneOn}T12:00:00Z`)}${r.lastDoneBy ? ` by ${r.lastDoneBy}` : ''}` : ''}</div></div>
      <input type="date" value={date} onChange={e => setDate(e.target.value)} style={{ maxWidth: 160 }} />
      <button className="btn sm" disabled={!date} onClick={record}>Record Done</button>
      <span className={`pill ${pill[0]}`}>{pill[1]}</span>
    </div>
  );
};

const Renewals = ({ track, base, office, onChanged }) => {
  const [err, setErr] = useState('');
  const r = track.renewals || { items: [], recurring: [] };
  return (
    <div>
      {err && <div className="err">{err}</div>}
      <h3 style={{ margin: '0 0 6px' }}>Expiring Credentials</h3>
      <div className="note">Warns 60 days before a document expires. Starting a renewal opens the item again for the new document; the old record is kept.{office && r.basis ? ` ${r.basis}` : ''}</div>
      {r.items.map(x => <ExpiryRow key={x.id} x={x} base={base} onChanged={onChanged} onError={setErr} />)}
      {office && <>
        <h3 style={{ margin: '16px 0 6px' }}>Recurring Duties</h3>
        <div className="note">Counted from the last time each was recorded done, or from the start date.</div>
        {r.recurring.map(x => <RecurringRow key={x.id} r={x} base={base} onChanged={onChanged} onError={setErr} />)}
      </>}
    </div>

// Spaced re-checks (Training Library TRN-406): a knowledge module comes back
// at days 3, 10, 30 and 90. While check questions are off, a re-check is
// reviewing the module again.
const Rechecks = ({ track, base, onChanged }) => {
  const [err, setErr] = useState('');
  const due = track.modules.filter(m => m.rechecks && m.rechecks.dueNow.length);
  if (!due.length) return null;
  const record = async (m) => { try { await call(PATHS.recheck(base, m.id), { method: 'POST', body: { day: m.rechecks.dueNow[0] } }); await onChanged(); } catch (e) { setErr(e.message); } };
  return (
    <div className="card">
      <h3>Refreshers Due</h3>
      <div className="note">A quick second look at training you finished, so it sticks.</div>
      {err && <div className="err">{err}</div>}
      {due.map(m => (
        <div key={m.id} className="item" style={{ cursor: 'default' }}>
          <div className="t"><b>{m.title}</b><div className="meta">Day {m.rechecks.dueNow[0]} refresher</div></div>
          <button className="btn sm" onClick={() => record(m)}>I Reviewed This Again</button>
        </div>
      ))}
    </div>
  );
};

// ---- the item drawer (both views) -------------------------------------------
const ItemDrawer = ({ item, track, base, office, viewerIsSubject, onClose, onChanged }) => {
  const [busy, setBusy] = useState(false); const [err, setErr] = useState(''); const [ok, setOk] = useState('');
  const [verify, setVerify] = useState({ source: '', verifiedOn: '' });
  const [reason, setReason] = useState(''); const [naReason, setNaReason] = useState(''); const [note, setNote] = useState('');
  const [ackVersion, setAckVersion] = useState({});
  const subject = track.person && track.person.name;
  const run = async (fn, msg) => {
    setBusy(true); setErr(''); setOk('');
    try { await fn(); setOk(msg); await onChanged(); } catch (e) { setErr(e.message); } finally { setBusy(false); }
  };
  const doStep = (s) => run(() => call(PATHS.step(base, item.id, s.index), { method: 'POST',
    body: s.action === 'VERIFY' ? verify : {} }), 'Recorded.');

    const fd = new FormData(); fd.append('file', file);

  // A verification never comes before what it verifies (the server refuses
  // it), so its form appears only once the step before it is done.

    <>

        {item.returned && <div className="err"><b>Returned:</b> {item.returned.reason}</div>}
        {item.notApplicable && <div className="note">Marked not applicable by {item.notApplicable.byName}: {item.notApplicable.reason}</div>}
        {err && <div className="err">{err}</div>}{ok && <div className="ok">{ok}</div>}

        {item.acknowledgments ? (
          <div>
            <label className="f">Documents to acknowledge</label>
            {item.acknowledgments.map(a => (
              <div key={a.id} className="line-card">
                <div style={{ display: 'flex', justifyContent: 'space-between', gap: 8, flexWrap: 'wrap' }}>
                  <b>{a.title}</b>
                  <span>{a.required === 'Current' ? 'Current version' : `v${a.required}`}</span>
                </div>
                {a.links.map((l, i) => <div key={l}><a href={l} target="_blank" rel="noopener">Open document{a.links.length > 1 ? ` ${i + 1}` : ''}</a></div>)}
                {a.current && <div className="meta" style={{ color: 'var(--green)' }}><i className="ti ti-check" /> Acknowledged{a.filedBy === 'OFFICE_ON_BEHALF' ? ' · filed by the office for you' : ''}</div>}
                {a.stale && <div className="err">Signed v{a.signed} · v{a.required} needed</div>}
                {!a.current && !office && <button className="btn sm" disabled={busy} onClick={() => run(() => call(PATHS.ack(base, item.id, a.id), { method: 'POST', body: {} }), 'Acknowledged.')}>Acknowledge</button>}
                {!a.current && office && (
                  <div style={{ display: 'flex', gap: 6, marginTop: 6 }}>
                    <input placeholder={`Version signed (default ${a.required})`} value={ackVersion[a.id] || ''} onChange={e => setAckVersion(Object.assign({}, ackVersion, { [a.id]: e.target.value }))} />
                    <button className="btn sm" disabled={busy} onClick={() => run(() => call(PATHS.ack(base, item.id, a.id), { method: 'POST', body: { version: ackVersion[a.id] || '' } }), 'Filed for her.')}>File For Her</button>
                  </div>
                )}
              </div>
            ))}
          </div>
        ) : (
          <div>
            {item.steps.length > 0 && <label className="f">Steps</label>}
            <div className="steps">
              {item.steps.map(s => (
                <div key={s.index} className={`step ${s.done ? 'done' : ''}`}>
                  <div><b>{s.hers ? (viewerIsSubject ? 'You' : (subject || 'New hire')) : s.actorLabel}</b> {ACTION_WORD[s.action].toLowerCase()}</div>
                  {s.done && <div className="meta" style={{ fontSize: 12.5, color: 'var(--mut)' }}>
                    {fmtDate(s.at)} · {s.filedBy === 'OFFICE_ON_BEHALF' ? (viewerIsSubject ? `Filed by ${s.byName} for you` : `Filed by ${s.byName} on her behalf`) : s.byName}
                    {s.source && ` · Checked: ${s.source} on ${fmtDate(s.verifiedOn)}`}
                  </div>}
                  {office && s.actorBasis && s.actorBasis !== 'STATED' && <div className="meta" style={{ fontSize: 11.5, color: 'var(--grey)' }}>{s.actorBasis === 'OWNER_CONFIRMED' ? 'Role confirmed by the owner' : 'Role inferred, not yet confirmed'}</div>}
                  {canAct(s) && s.action === 'VERIFY' && (
                    <div style={{ marginTop: 6 }}>
                      <input placeholder="Source checked (e.g. Nursys)" value={verify.source} onChange={e => setVerify(Object.assign({}, verify, { source: e.target.value }))} />
                      <input type="date" style={{ marginTop: 6 }} value={verify.verifiedOn} onChange={e => setVerify(Object.assign({}, verify, { verifiedOn: e.target.value }))} />
                      <button className="btn sm" style={{ marginTop: 6 }} disabled={busy} onClick={() => doStep(s)}>Verify</button>
                    </div>
                  )}
                  {canAct(s) && s.action !== 'VERIFY' && s.action !== 'SUBMIT' && (
                    <button className="btn sm" style={{ marginTop: 6 }} disabled={busy} onClick={() => doStep(s)}>{s.hers && office ? 'Mark Done For Her' : 'Mark Done'}</button>

                  {canAct(s) && s.action === 'SUBMIT' && (
                    <div style={{ marginTop: 6, display: 'flex', gap: 6, flexWrap: 'wrap' }}>

                      <button className="btn sm ghost" disabled={busy} onClick={() => doStep(s)}>{office ? 'Mark Sent For Her' : 'Mark Sent'}</button>
                    </div>
                  )}
                  {office && s.hers && s.done && (
                    <div style={{ marginTop: 6, display: 'flex', gap: 6 }}>
                      <input placeholder="Reason, so she knows what to fix" value={reason} onChange={e => setReason(e.target.value)} />
                      <button className="btn sm warn" disabled={busy} onClick={() => run(() => call(PATHS.returnStep(base, item.id), { method: 'POST', body: { step: s.index, reason } }), 'Returned to her.')}>Return</button>
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>
        )}

        {item.link && <div style={{ margin: '6px 0 10px' }}><a className="btn gold sm" href={item.link.url} target="_blank" rel="noopener noreferrer"><i className="ti ti-external-link" />{item.link.label}</a></div>}

        {item.packet && item.packet.length > 0 && (
          <div><label className="f">From the welcome packet</label>
            <div style={{ fontSize: 13, color: 'var(--mut)', marginBottom: 6 }}>These come from the caregiver's welcome packet and update on their own. Review uploads on the Caregivers screen.</div>
            <ul style={{ margin: '4px 0 10px', paddingLeft: 18, fontSize: 14 }}>{item.packet.map(r => (
              <li key={r.kind}>{r.title}{' '}<b style={{ color: r.status === 'complete' ? 'var(--ok, #2f6b4f)' : 'var(--mut)' }}>{({ complete: 'Done', in_review: 'Waiting on review', in_progress: 'Scheduled', rejected: 'Sent back', missing: r.required ? 'Not yet' : 'Not needed' })[r.status] || r.status}</b></li>
            ))}</ul></div>
        )}

        {item.elements && item.elements.length > 0 && (
          <div><label className="f">What is checked</label>
            <ul style={{ margin: '4px 0 10px', paddingLeft: 18, fontSize: 14 }}>{item.elements.map(e => <li key={e.row}>{e.row}</li>)}</ul></div>
        )}

        {item.files.length > 0 && (
          <div><label className="f">Files</label>
            {item.files.map(f => (
              <div key={f.id} style={{ display: 'flex', justifyContent: 'space-between', gap: 8, padding: '4px 0', fontSize: 14 }}>
                <a href="#" onClick={e => { e.preventDefault(); openFile(PATHS.file(base, item.id, f.id), f.name).catch(x => setErr(x.message)); }}>{f.name}</a>
                <span className="meta" style={{ color: 'var(--mut)', fontSize: 12.5 }}>{fmtDate(f.uploadedAt)}{f.filedBy === 'OFFICE_ON_BEHALF' ? ` · filed by ${f.uploadedByName}` : ''}</span>
              </div>
            ))}
          </div>
        )}

        {item.carriedOver && item.carriedOver.length > 0 && (
          <div className="note"><b>Done in the earlier checklist:</b>
            {item.carriedOver.map(c => <div key={c.oldId}>{c.title} · {c.status === 'complete' ? 'complete' : c.status}{c.byName ? ` · ${c.byName}` : ''}{c.at ? ` · ${fmtDate(c.at)}` : ''}</div>)}
            {office && <div style={{ marginTop: 4 }}>Confirm the step above to carry it into this checklist.</div>}
          </div>
        )}

        <label className="f">Notes</label>
        {item.notes.map(n => <div key={n.id} style={{ fontSize: 14, padding: '4px 0', borderBottom: '1px solid #F1ECE1' }}><b>{n.byName}</b> <span style={{ color: 'var(--mut)', fontSize: 12 }}>{fmtDate(n.at)}</span><div>{n.text}</div></div>)}
        <textarea rows={2} placeholder="Add a note" value={note} onChange={e => setNote(e.target.value)} style={{ marginTop: 6 }} />
        <button className="btn sm ghost" style={{ marginTop: 6 }} disabled={busy || !note.trim()} onClick={() => run(() => call(PATHS.notes(base, item.id), { method: 'POST', body: { text: note } }).then(() => setNote('')), 'Note added.')}>Add Note</button>

        {office && !item.notApplicable && !done(item.status) && (
          <div style={{ marginTop: 16 }}>
            <label className="f">Does not apply to her</label>

              <button className="btn sm ghost" disabled={busy} onClick={() => run(() => call(PATHS.notApplicable(base, item.id), { method: 'POST', body: { reason: naReason } }), 'Marked not applicable.')}>Mark Not Applicable</button>
            </div>

// ---- Phase 5: readiness, grouped under GFC's service lines -------------------
const Readiness = ({ track, base, office, onChanged }) => {
  const [open, setOpen] = useState(null);
  const [form, setForm] = useState({ conditionsConfirmed: [], approvedScope: '', payer: '' });
  const [err, setErr] = useState('');
  const lines = [];
  track.determinations.forEach(d => {
    let g = lines.find(l => l.id === d.serviceLine);
    if (!g) { g = { id: d.serviceLine, label: d.serviceLineLabel, gates: [] }; lines.push(g); }
    g.gates.push(d);
  });
  if (!lines.length) return <div className="note">No service lines are set for this person yet.</div>;
  const submit = async (d) => {
    setErr('');
    try { await call(PATHS.determination(base, d.id), { method: 'POST', body: form }); setOpen(null); await onChanged(); }
    catch (e) { setErr(e.message + (e.code === 'DETERMINATION_NOT_READY' ? ' Training still to finish first.' : '')); }
  };
  return lines.map(l => (
    <div key={l.id} className="line-card">
      <h3>{l.label}</h3>
      {l.gates.map(d => {
        const isOpen = d.perPayer ? d.openedPayers.length > 0 : !!d.opened;
        return (
          <div key={d.id} style={{ borderTop: '1px solid #F1ECE1', paddingTop: 10, marginTop: 10 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', gap: 8, flexWrap: 'wrap' }}>
              <b>{d.label}</b>
              {isOpen ? <span className="pill p-COMPLETE">Opened</span> : d.eligible ? <span className="pill p-SUBMITTED">Ready to Open</span> : <span className="pill p-NOT_STARTED">Not Ready</span>}
            </div>
            {d.perPayer && d.openedPayers.map(o => <div key={o.payer} className="meta" style={{ fontSize: 13, color: 'var(--mut)' }}>{o.payer}: opened by {o.reviewedBy.name} on {fmtDate(o.at)} · {o.approvedScope}</div>)}
            {!d.perPayer && d.opened && <div style={{ fontSize: 13, color: 'var(--mut)' }}>Opened by {d.opened.reviewedBy.name} on {fmtDate(d.opened.at)} · Scope: {d.opened.approvedScope}</div>}
            {!isOpen && d.outstandingModules.length > 0 && <div style={{ fontSize: 13, color: 'var(--mut)' }}>Training to finish first: {d.outstandingModules.length} module{d.outstandingModules.length === 1 ? '' : 's'}</div>}
            {d.openItem === 'NON_PRESCRIBING_PROTOCOL' && office && <div className="note">Waiting on counsel: whether exams can run under a non-prescribing protocol. Until then she works under a filed protocol agreement.</div>}
            {office && (!isOpen || d.perPayer) && open !== d.id && <button className="btn sm" style={{ marginTop: 6 }} onClick={() => { setOpen(d.id); setForm({ conditionsConfirmed: [], approvedScope: '', payer: '' }); }}>{d.perPayer && isOpen ? 'Open Another Payer' : 'Record Determination'}</button>}
            {office && open === d.id && (
              <div style={{ marginTop: 8 }}>
                {err && <div className="err">{err}</div>}
                {d.conditions.map(c => (
                  <label key={c} style={{ display: 'flex', gap: 8, alignItems: 'flex-start', fontSize: 14, margin: '6px 0' }}>
                    <input type="checkbox" style={{ width: 'auto', marginTop: 3 }} checked={form.conditionsConfirmed.includes(c)}
                      onChange={e => setForm(Object.assign({}, form, { conditionsConfirmed: e.target.checked ? form.conditionsConfirmed.concat([c]) : form.conditionsConfirmed.filter(x => x !== c) }))} />{c}
                  </label>
                ))}
                {d.perPayer && <><label className="f">Payer</label><input value={form.payer} onChange={e => setForm(Object.assign({}, form, { payer: e.target.value }))} /></>}
                <label className="f">Approved scope</label>
                <textarea rows={2} value={form.approvedScope} onChange={e => setForm(Object.assign({}, form, { approvedScope: e.target.value }))} />
                <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>
                  <button className="btn sm" onClick={() => submit(d)}>Open Service Line</button>
                  <button className="btn sm ghost" onClick={() => setOpen(null)}>Cancel</button>
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  ));
};

// ---- Training (both views) --------------------------------------------------

          <div><i>{q.prompt}</i></div>
          {shown[i] ? <div style={{ marginTop: 4 }}><b>Answer:</b> {q.answer}{q.source ? <span style={{ color: 'var(--mut)' }}> ({q.source})</span> : ''}</div>
            : <button className="btn sm ghost" style={{ marginTop: 4 }} onClick={() => setShown(Object.assign({}, shown, { [i]: true }))}>Show Answer</button>}
        </div>
      ))}
      {!m.complete && !m.underReview && (office
        ? <button className="btn sm" style={{ marginTop: 6 }} onClick={complete}>Sign Off</button>
        : selfAttest ? <button className="btn sm" style={{ marginTop: 6 }} onClick={complete}>I Completed This</button>
          : <div style={{ fontSize: 13, color: 'var(--mut)', marginTop: 4 }}>The {HOST[m.host] || 'office'} signs this off.</div>)}
    </div>
  );
};

const LINE_CHOICES = [

const CHAPTER_CHOICES = [['A', 'Caregiver, employed (companion, PCA or licensed nursing)'], ['B', 'Registered nurse, employed (private home care)'], ['C', 'Clinician (NP, MD, PA), employed'], ['D', 'Clinician (NP, PA), contracted only (1099)'], ['E', 'Clinician, hybrid: employed (W-2) and contracted for exams (1099)'], ['F', 'Admin team and non-clinical staff (office, clinical operations, care coordination)'], ['G', 'Community Care Liaison (remote business development)'], ['H', 'Student or extern on an educational placement (unpaid)'], ['R1', 'Supervising (delegating) physician, Georgia']];
const Setup = ({ userId, inputs, onSaved }) => {
  const [f, setF] = useState(Object.assign({ serviceLines: [], credentials: [], startDate: '', chapter: 'C', workState: 'GA' }, inputs || {}));

// ---- OFFICE: training library -------------------------------------------------
const Library = () => {
  const [d, setD] = useState(null); const [err, setErr] = useState(''); const [refs, setRefs] = useState({}); const [ok, setOk] = useState('');
  const load = useCallback(async () => { try { setD(await call('/api/onboarding/admin/library')); } catch (e) { setErr(e.message); } }, []);
  useEffect(() => { load(); }, [load]);
  const review = async (m, confirm) => {
    setErr(''); setOk('');
    const body = confirm ? { confirmedManualRefs: String(refs[m.id] != null ? refs[m.id] : (m.proposedManualRefs || []).join(', ')).split(',').map(x => x.trim()).filter(Boolean) } : {};
    try { await call(`/api/onboarding/admin/library/${m.id}/review`, { method: 'POST', body }); setOk(`${m.title}: recorded.`); await load(); } catch (e) { setErr(e.message); }
  };
  if (!d) return err ? <div className="err">{err}</div> : <div className="note">Loading…</div>;
  const order = { FLAGGED: 0, PENDING: 1, CHANGES_UNKNOWN: 2, CLEARED_NO_OVERLAP: 3, CURRENT: 4 };
  const mods = d.modules.slice().sort((a, b) => (order[a.flag.status] ?? 9) - (order[b.flag.status] ?? 9));
  return (
    <div className="card">
      <div className="card-h"><h2>Training Library</h2><span>Clinical manual {d.manual.version ? `v${d.manual.version}` : '(could not be read)'}</span></div>
      {err && <div className="err">{err}</div>}{ok && <div className="ok">{ok}</div>}
      {/* Off until the SOPs behind the questions are written (owner, 2026-11-08). */}
      <label style={{ display: 'flex', gap: 8, alignItems: 'center', margin: '4px 0 12px', fontSize: 14 }}>
        <input type="checkbox" checked={!!(d.settings && d.settings.checkQuestionsForStaff)}
          onChange={async (e) => { try { await call('/api/onboarding/admin/settings', { method: 'PUT', body: { checkQuestionsForStaff: e.target.checked } }); await load(); } catch (x) { setErr(x.message); } }} />
        Show training check questions to staff {d.settings && d.settings.checkQuestionsForStaff ? '(on)' : '(off until the SOPs are written)'}
      </label>
      <table><thead><tr><th>Module</th><th>Status</th><th>Manual sections</th><th></th></tr></thead><tbody>
        {mods.map(m => (
          <tr key={m.id}>
            <td><b>{m.title}</b><div style={{ fontSize: 12.5, color: 'var(--mut)' }}>Phase {m.phaseNumber} · {m.phaseLabel}</div></td>
            <td>{m.flag.status === 'FLAGGED' ? <span className="pill p-RETURNED">Flagged · {m.flag.hits.join(', ')}</span>
              : m.flag.status === 'PENDING' ? <span className="pill p-SUBMITTED">Pending</span>
              : m.flag.status === 'CHANGES_UNKNOWN' ? <span className="pill p-EXPIRED">Check Needed</span>
              : <span className="pill p-COMPLETE">Current</span>}
              {m.plannedSop && <div style={{ fontSize: 12, color: 'var(--mut)' }}>SOP still to write</div>}</td>
            <td style={{ minWidth: 180 }}>{m.manualRefs.length ? m.manualRefs.join(', ')
              : <input value={refs[m.id] != null ? refs[m.id] : (m.proposedManualRefs || []).join(', ')} onChange={e => setRefs(Object.assign({}, refs, { [m.id]: e.target.value }))} placeholder="e.g. 18.1" />}</td>
            <td style={{ whiteSpace: 'nowrap' }}>
              {m.flag.status === 'FLAGGED' && <button className="btn sm" onClick={() => review(m, false)}>Mark Reviewed</button>}
              {m.flag.status === 'PENDING' && <button className="btn sm" onClick={() => review(m, true)}>Confirm Sections</button>}
            </td>
          </tr>))}
      </tbody></table>
    </div>
  );
};

// One row of her checklist. At module scope: a component declared inside
// another is a new identity every render and remounts.
const ItemRow = ({ i, onOpen }) => (
  <div className="item" onClick={() => onOpen(i.id)}>
    <Dot status={i.status} /><div className="t"><b>{i.title}</b>{i.status === 'SUBMITTED' && <div className="meta">With the office</div>}{i.returned && <div className="meta" style={{ color: 'var(--red)' }}>{i.returned.reason}</div>}</div>
    <i className="ti ti-chevron-right" />
  </div>
);

const Stat = ({ icon, bg, color, n, l, s }) => (
  <div className="stat"><span className="ic" style={{ background: bg, color }}><i className={`ti ${icon}`} /></span>
    <div><div className="n">{n}</div><div className="l">{l}</div><div className="s">{s}</div></div></div>
);

// ---- HER VIEW (phone first) ----------------------------------------------------
const Mine = ({ viewer, track, onChanged }) => {
  const [tab, setTab] = useState('home'); const [openPhase, setOpenPhase] = useState(null); const [openItem, setOpenItem] = useState(null);
  const base = { office: false, userId: null };
  const t = track;
  const first = String(viewer.name || '').split(' ')[0];
  const returned = t.items.filter(i => i.status === 'RETURNED');
  // What is hers NOW follows the phases: her current phase, and Credentialing
  // too once she reaches the offer, because the Playbook starts it on the day
  // she signs. A Phase 4 task listed while she is in Phase 1 is noise.
  const current = (t.phases.find(x => !x.complete) || t.phases[t.phases.length - 1]).number;
  const reachable = (i) => {
    const n = (t.phases.find(x => x.id === i.phase) || {}).number || 99;
    return n <= current || (current >= 2 && (t.phases.find(x => x.id === i.phase) || {}).separateRecord === 'CREDENTIALING');
  };
  const mine = t.items.filter(i => i.waitingOnHer && i.status !== 'RETURNED' && reachable(i));
  const next = returned[0] || mine[0] || null;
  const p = pct(t);
  const phasesDone = t.phases.filter(x => x.complete).length;
  const item = openItem && t.items.find(i => i.id === openItem);
  const hour = Number(new Date().toLocaleString('en-US', { timeZone: TZ || undefined, hour: 'numeric', hour12: false }));
  const greet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  return (
    <div className="me">
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>
        <img src="/brand/logo-mark-transparent.png" alt="" style={{ width: 34, height: 34 }} />
        <b style={{ fontFamily: 'Cormorant Garamond, serif', fontSize: 20, color: 'var(--navy)' }}>Godwins Family Care</b>
      </div>
      {tab === 'home' && <>
        <h1>{greet}, {first}.</h1>
        <div className="sub">Your onboarding at GFC</div>
        <div className="card" style={{ display: 'flex', gap: 14, alignItems: 'center', marginTop: 12 }}>
          <div className="ring" style={{ background: `conic-gradient(#A97E2B ${p * 3.6}deg, #EFE8DA 0)` }}><div style={{ background: '#fff', width: 66, height: 66, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{p}%</div></div>
          <div><h3>Your Progress</h3><div style={{ color: 'var(--mut)' }}>{phasesDone} of {t.phases.length} phases complete</div></div>
        </div>
        {next ? (
          <div className="next" onClick={() => setOpenItem(next.id)} style={{ cursor: 'pointer' }}>
            <i className="ti ti-arrow-right-circle" style={{ fontSize: 28, color: '#A97E2B' }} />
            <div style={{ flex: 1 }}><b>{next.status === 'RETURNED' ? 'Fix and send again' : 'Your next step'}</b><div>{next.title}</div></div>
            <button className="btn gold sm">Open</button>
          </div>
        ) : <div className="ok">Nothing is waiting on you right now. The office is working on the rest.</div>}
        {returned.length > 0 && <div className="card"><h3>Sent Back to You</h3>{returned.map(i => <ItemRow key={i.id} i={i} onOpen={setOpenItem} />)}</div>}
        {mine.length > 0 && <div className="card"><h3>Waiting on You</h3>{mine.slice(0, 6).map(i => <ItemRow key={i.id} i={i} onOpen={setOpenItem} />)}</div>}
        {t.renewals && t.renewals.items.some(x => x.expiry.status === 'EXPIRED' || x.expiry.status === 'SOON') && (
          <div className="card"><h3>Renewals Coming Up</h3>
            <Renewals track={{ renewals: { items: t.renewals.items.filter(x => x.expiry.status === 'EXPIRED' || x.expiry.status === 'SOON'), recurring: [] } }} base={base} office={false} onChanged={onChanged} />
          </div>
        )}
        <Rechecks track={t} base={base} onChanged={onChanged} />
      </>}
      {tab === 'checklist' && <>
        <h2 style={{ marginBottom: 10 }}>Your Milestones</h2>
        {t.phases.map(ph => {
          const its = t.items.filter(i => i.phase === ph.id);
          const doneN = its.filter(i => done(i.status)).length;
          const isOpen = openPhase === ph.id;
          return (
            <div key={ph.id} className="acc">
              <div className="acc-h" onClick={() => setOpenPhase(isOpen ? null : ph.id)}>
                <span className="dot" style={{ width: 30, height: 30, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', background: ph.complete ? 'var(--green)' : '#fff', color: ph.complete ? '#fff' : 'var(--navy)', border: ph.complete ? 'none' : '1.5px solid var(--navy)', fontWeight: 700 }}>{ph.complete ? <i className="ti ti-check" /> : ph.number}</span>
                <div style={{ flex: 1 }}><b style={{ color: 'var(--navy)' }}>Phase {ph.number} · {ph.label}</b><div style={{ fontSize: 13, color: 'var(--mut)' }}>{ph.plainWhen}</div></div>
                {its.length > 0 && <span style={{ fontSize: 13, color: 'var(--mut)' }}>{doneN} of {its.length}</span>}
                <i className={`ti ti-chevron-${isOpen ? 'up' : 'down'}`} />
              </div>
              {isOpen && <div className="acc-b">
                {its.length === 0 && ph.readiness && <Readiness track={t} base={base} office={false} onChanged={onChanged} />}
                {its.length === 0 && !ph.readiness && <div className="note">Nothing here for you to do.</div>}
                {its.map(i => <ItemRow key={i.id} i={i} onOpen={setOpenItem} />)}
              </div>}
            </div>
          );
        })}
      </>}
      {tab === 'training' && <>
        <h2 style={{ marginBottom: 10 }}>Your Training</h2>
        {(t.trainingCourses || []).map(col => <CourseCollection key={col.id} col={col} base={base} office={false} onChanged={onChanged} />)}
        <Rechecks track={t} base={base} onChanged={onChanged} />
        {t.checks && !t.checks.ok && <div className="note">Some check questions could not be loaded just now.</div>}
        {t.modules.length > 0 && t.modules.filter(m => !m.complete && m.available).length === 0 && <div className="ok">No training waiting right now.</div>}
        {t.modules.filter(m => !m.complete).slice(0, 8).map(m => <ModuleCard key={m.id} m={m} checks={t.checks && t.checks.byModule} base={base} office={false} onChanged={onChanged} />)}
        {t.modules.filter(m => m.complete).length > 0 && <><h3 style={{ margin: '14px 0 6px' }}>Completed</h3>{t.modules.filter(m => m.complete).map(m => <ModuleCard key={m.id} m={m} checks={t.checks && t.checks.byModule} base={base} office={false} onChanged={onChanged} />)}</>}
      </>}
      {tab === 'documents' && <>
        <h2 style={{ marginBottom: 10 }}>Your Documents</h2>
        {t.items.filter(i => i.files.length).length === 0 && <div className="note">Nothing filed yet.</div>}
        {t.items.filter(i => i.files.length).map(i => (
          <div key={i.id} className="card"><b>{i.title}</b>
            {i.files.map(f => <div key={f.id} style={{ fontSize: 14, marginTop: 4 }}><a href="#" onClick={e => { e.preventDefault(); openFile(PATHS.file(base, i.id, f.id), f.name); }}>{f.name}</a> <span style={{ color: 'var(--mut)', fontSize: 12.5 }}>{fmtDate(f.uploadedAt)}{f.filedBy === 'OFFICE_ON_BEHALF' ? ` · filed by ${f.uploadedByName} for you` : ''}</span></div>)}
          </div>))}
      </>}
      <div className="bottom">
        {[['home', 'Home', 'ti-home'], ['checklist', 'Milestones', 'ti-list-check'], ['training', 'Training', 'ti-school'], ['documents', 'Documents', 'ti-file-text']].filter(([k]) => k !== 'training' || t.modules.length > 0 || (t.trainingCourses || []).length > 0).map(([k, l, ic]) =>
          <button key={k} className={tab === k ? 'on' : ''} onClick={() => setTab(k)}><i className={`ti ${ic}`} />{l}</button>)}
      </div>
      {item && <ItemDrawer item={item} track={t} base={base} office={false} viewerIsSubject onClose={() => setOpenItem(null)} onChanged={onChanged} />}
    </div>
  );
};

// ---- the shell ---------------------------------------------------------------
const OfficeShell = ({ viewer, mineTrack, onChanged }) => {
  const [view, setView] = useState('overview'); const [person, setPerson] = useState(null);
  const open = (id) => { setPerson(id); setView('person'); };
  return (
    <div className="shell">
      <aside className="side">
        <div className="brand"><img src="/brand/logo-mark-white-transparent.png" alt="" /><b>Godwins<br />Family Care</b></div>
        <nav className="nav">
          <button className={view === 'overview' || view === 'person' ? 'on' : ''} onClick={() => { setView('overview'); setPerson(null); }}><i className="ti ti-layout-dashboard" />Onboarding</button>
          <button className={view === 'library' ? 'on' : ''} onClick={() => setView('library')}><i className="ti ti-school" />Training Library</button>
          {mineTrack && <button className={view === 'mine' ? 'on' : ''} onClick={() => setView('mine')}><i className="ti ti-user" />My Onboarding</button>}
          <button onClick={() => { window.location.href = '/admin'; }}><i className="ti ti-arrow-left" />Admin Hub</button>
        </nav>
      </aside>
      <main className="main">
        {view !== 'mine' && <div className="top">
          <div><h1>Staff Onboarding</h1><div className="sub">Collaborative onboarding for a ready, credentialed and compliant care team.</div></div>
          <div style={{ color: 'var(--mut)' }}>{new Date().toLocaleDateString('en-US', { timeZone: TZ || undefined, weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })}</div>
        </div>}
        {view === 'overview' && <Overview onOpen={open} />}
        {view === 'person' && person && <Person userId={person} onBack={() => { setView('overview'); setPerson(null); }} />}
        {view === 'library' && <Library />}
        {view === 'mine' && mineTrack && <Mine viewer={viewer} track={mineTrack} onChanged={onChanged} />}
      </main>
    </div>
  );
};

const App = () => {
  const [d, setD] = useState(null); const [err, setErr] = useState('');
  const load = useCallback(async () => {
    try { setD(await call('/api/onboarding/me')); setErr(''); }
    catch (e) { setErr(e.status === 403 ? 'Onboarding is for GFC staff.' : e.message); }
  }, []);
  useEffect(() => { load(); }, [load]);
  if (err) return <div className="me"><div className="err">{err}</div></div>;
  if (!d) return <div className="me"><div className="note">Loading…</div></div>;
  if (d.viewer.isOffice) return <OfficeShell viewer={d.viewer} mineTrack={d.started ? d.track : null} onChanged={load} />;
  if (!d.started) return <div className="me"><h1>Welcome, {String(d.viewer.name || '').split(' ')[0]}.</h1><div className="note" style={{ marginTop: 12 }}>The office has not started your onboarding yet. You will see your checklist here once they do.</div></div>;
  return <Mine viewer={d.viewer} track={d.track} onChanged={load} />;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
