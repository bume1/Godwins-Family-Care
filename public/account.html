<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Godwins Family Care — Your Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/gfc-time.js"></script>
  <script>window.GFC_TIME && window.GFC_TIME.installDefaultTimeZone();</script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <link rel="icon" type="image/png" href="/brand/logo-mark-transparent.png">
  <style>
    /* YOUR OWN ACCOUNT (owner, "Fix all", 2026-11-06).
       Five things a signed-in person could do only by calling an API by hand:
       see their two-factor state, get fresh recovery codes, see where their
       account is signed in, disconnect their own OpenEMR sign-in, and change
       their password voluntarily (the change-password route existed but was
       only reachable from login.html's FORCED change).
       One page for every role, because every role has an account. Each card
       asks the server whether it applies and hides itself when it does not —
       a control that is going to answer 403 is worse than no control. */
    :root{--navy:#033D50;--navy-d:#022A38;--gold:#F5CD85;--goldd:#C9A44A;
          --cream:#FAF7F2;--cream-d:#efe9db;--ink:#2b2b28;--mut:#7a746a;
          --red:#A32D2D;--green:#0f6e56;--line:#e5ddcb}
    *{box-sizing:border-box;margin:0;padding:0;font-family:'DM Sans',system-ui,sans-serif}
    body{background:var(--cream-d);color:var(--ink);font-size:15px;line-height:1.55}
    .hdr{background:var(--navy);color:var(--cream);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .hdr .t{font-family:'Cormorant Garamond',serif;font-size:23px;font-weight:600}
    .hdr a{color:var(--gold);text-decoration:none;font-size:14px;font-weight:600}
    .wrap{max-width:780px;margin:0 auto;padding:20px 18px 70px}
    .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px 19px;margin-bottom:14px}
    .card h2{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--navy);margin-bottom:3px}
    .card .sub{color:var(--mut);font-size:13.5px;margin-bottom:13px}
    .mu{color:var(--mut);font-size:14px}
    .err{background:#fdeeee;border:1px solid #f3c9c9;color:var(--red);border-radius:10px;padding:11px 14px;margin:10px 0;font-size:14px}
    .ok{background:#f2f8f6;border:1px solid #b8ddd0;color:var(--green);border-radius:10px;padding:11px 14px;margin:10px 0;font-size:14px}
    .note{background:var(--cream);border:1.5px dashed var(--goldd);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:14px;color:var(--mut)}
    .note b{color:var(--navy)}
    label.f{display:block;font-size:12px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
    input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
    .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px;margin-bottom:11px}
    .btn{border-radius:8px;padding:10px 15px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--navy);background:var(--navy);color:#fff;font-family:inherit}
    .btn.ghost{background:#fff;color:var(--navy)}
    .btn.warn{border-color:var(--red);background:#fff;color:var(--red)}
    .btn[disabled]{opacity:.5;cursor:not-allowed}
    .fact{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid #f1ece1;font-size:14px}
    .fact:last-child{border-bottom:none}
    .fact span:first-child{color:var(--mut)}
    .chip{display:inline-block;border-radius:12px;padding:2px 9px;font-size:11.5px;font-weight:700;background:#eef3f0;color:var(--green)}
    .chip.w{background:#fdf3dd;color:#8a6a1e}
    .chip.r{background:#fdeeee;color:var(--red)}
    .codes{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:13px;margin:10px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}
    table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px}
    th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
    td{padding:7px 9px;border-bottom:1px solid #f1ece1;vertical-align:top}
    tr:last-child td{border-bottom:none}
  </style>
</head>
<body>
<div id="root"></div>
<script src="/session-guard.js"></script>
<script type="text/babel" src="/account-cards.js"></script>
<script type="text/babel">
const { useState, useEffect } = React;

const getToken = () =>
  localStorage.getItem('admin_token') || localStorage.getItem('unified_token')
  || localStorage.getItem('portal_token');

// Staff have one account area: My GFC → My Profile. A staff member who lands
// here is sent there; clients and family, who have no My GFC, stay. The
// server answers who is staff (/api/my/profile refuses everyone else).
const App = () => {
  const [stay, setStay] = useState(false);
  useEffect(() => {
    fetch('/api/my/profile', { headers: { Authorization: `Bearer ${getToken()}` } })
      .then(r => { if (r.ok) window.location.replace('/my#account'); else setStay(true); })
      .catch(() => setStay(true));
  }, []);
  return (
    <div>
      <div className="hdr">
        <span className="t">Your Account</span>
        <a href="/login">Sign out</a>
      </div>
      <div className="wrap">
        {stay ? <window.GFCAccount.AccountCards /> : <p className="mu">Loading…</p>}
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
