                  {s.done ? [s.by, s.at && new Date(s.at).toLocaleString()].filter(Boolean).join(' · ') || 'Done' : (s.by || 'Pending')}
                </div>
              </div>
              <div className="flex items-center gap-1.5 shrink-0">
                {canEdit && s.kind === 'manual' && !data.activated && (
                  <button className="btn btn-ghost !py-1 !px-2 text-xs" disabled={busy === s.key} onClick={() => mark(s.key, !s.done)}>
                    {s.done ? 'Un-mark' : 'Mark done'}
                  </button>
                )}
                <span className={`badge ${s.done ? 'bg-success-50 text-success-600' : 'bg-gray-100 text-gray-500'}`}>{s.done ? 'Done' : 'Pending'}</span>
              </div>
            </div>
          ))}
          {msg && <p className={`text-sm mt-3 ${msg.ok ? 'text-success-600' : 'text-danger-600'}`}>{msg.text}</p>}
          {canEdit ? (
            !data.activated && (
              <button className="btn btn-primary mt-3" disabled={!data.allDone || busy === 'activate'} onClick={activate}>
                {busy === 'activate' ? 'Activating…' : 'ACTIVATE IHPC enrollment'}
              </button>
            )
          ) : (
            <p className="text-xs text-gray-400 mt-3">Read-only — an admin or clinician activates IHPC enrollment.</p>
          )}
          <p className="text-xs text-gray-400 mt-2">Payer verification is manual until B1 (Availity eligibility) lands. Records/ROI, initial visit, care plan, and consents derive from the record and cannot be hand-set.</p>
        </Section>
      );
    };

    // ── Place of service (Session 4.12 Scope F1, owner-directed 2026-09-23) ──
    // WHERE this patient is seen and WHAT KIND of visit it is. Both decide the
    // place of service on the claim, which is why the owner's 4.5 rule — "a
    // clinician never sees or chooses a POS" — puts both here, on the
    // enrollment record, under the admin gate, rather than on the chart. The
    // facility half MOVED here from the clinician's chart in this change; the
    // encounter type is new.
    //
    // The screen names no encounter type of its own. The list is served, and a
    // page that restates it drifts from the validator that refuses an option
    // it no longer knows — the rule the consent registry and the competency
    // catalog already follow.
    const PlaceOfServiceCard = ({ clientId, canEdit }) => {
      const [data, setData] = useState(null);
      const [err, setErr] = useState('');
      const [busy, setBusy] = useState('');
      const [msg, setMsg] = useState(null);
      const load = useCallback(() => {
        api.placeOfService(clientId).then(d => { setData(d); setErr(''); }).catch(e => setErr(e.message));
      }, [clientId]);
      useEffect(() => { load(); }, [load]);

      if (err) return <Section title="Place of service"><div className="text-sm text-danger-600">{err}</div></Section>;
      if (!data) return <Section title="Place of service"><div className="text-sm text-gray-400">Loading…</div></Section>;

      const save = (what, fn) => {
        setBusy(what); setMsg(null);
        fn().then(r => { setMsg({ ok: true, text: [r.message, ...(r.warnings || [])].join(' ') }); load(); })
          .catch(e => setMsg({ ok: false, text: e.message }))
          .finally(() => setBusy(''));
      };
      const assigned = !!data.facilityId;
      const agree = data.agreement || { ok: true };
      // Assigned-but-no-POS and not-assigned-at-all are different problems with
      // different fixes, and the POS one is not fixed on this screen at all —
      // it lives on the facility record in OpenEMR. They never share a message.
      const posMissing = assigned && !data.posCode;
      const notService = assigned && data.serviceLocation === false;

      return (
        <Section title="Place of service">
          <div className="flex items-center justify-between mb-3">
            <p className="text-xs text-gray-500 max-w-md">
              What this patient&rsquo;s visits bill as. A clinician sees this resolved on the chart and cannot change it —
              it decides the place of service on the claim.
            </p>
            {assigned && !posMissing && !notService && agree.ok
              ? <span className="badge bg-success-50 text-success-600 shrink-0">POS {data.posCode}</span>
              : <span className="badge bg-warning-50 text-warning-600 shrink-0">Blocks signing</span>}
          </div>

          {data.degraded && (
            <p className="text-xs text-warning-600 mb-3">
              {data.reason}. The assignment below is what is on file; it could not be checked against OpenEMR.
            </p>
          )}

          <div className="text-sm mb-1 font-medium">Where care happens</div>
          <div className="text-xs text-gray-500 mb-2">
            {assigned
              ? <>Assigned to <b>{data.facilityName || `facility ${data.facilityId}`}</b>{data.posCode ? <> &middot; place of service <b>{data.posCode}</b></> : null}.</>
              : <b className="text-warning-600">Not assigned to an OpenEMR facility, so this patient&rsquo;s visits cannot be signed.</b>}
          </div>
          {posMissing && (
            <p className="text-xs text-warning-600 mb-2">
              &ldquo;{data.facilityName}&rdquo; has no place-of-service code on its record in OpenEMR. Set it on the facility
              (Administration &rarr; Facilities) &mdash; it cannot be set from here, and visits stay unsignable until it is.
            </p>
          )}
          {notService && (
            <p className="text-xs text-warning-600 mb-2">
              &ldquo;{data.facilityName}&rdquo; is not marked as a Service Location in OpenEMR, so no encounter can be assigned there.
              Tick Service Location on the facility record.
            </p>
          )}
          {canEdit && !data.degraded && (
            <div className="flex flex-wrap items-end gap-2 mb-4">
              <select className="inp flex-1 min-w-[240px]" value={data.facilityId || ''} disabled={busy === 'facility'}
                onChange={e => save('facility', () => api.assignFacility(clientId, e.target.value))}>
                <option value="">&mdash; not assigned &mdash;</option>
                {data.facilities.map(f => (
                  <option key={f.id} value={f.id}>
                    {f.name}{f.posCode ? ` · POS ${f.posCode}` : ' · no POS'}{f.serviceLocation ? '' : ' · not a service location'}
                  </option>
                ))}
              </select>
            </div>
          )}

          <div className="text-sm mb-1 font-medium">Where this patient is usually seen</div>
          <div className="text-xs text-gray-500 mb-2">
            {data.usualLocation
              ? <>Usually seen at <b>{data.usualLocationLabel}</b>. This is a <b>default</b> &mdash; every booking confirms it and can change it for that visit.</>
              : <>Not set. Every booking will have to say where the visit happens before it can be saved.</>}
          </div>
          {canEdit && (
            <div className="flex flex-wrap items-end gap-2">
              <select className="inp flex-1 min-w-[240px]" value={data.usualLocation || ''} disabled={busy === 'type'}
                onChange={e => save('type', () => api.setUsualLocation(clientId, e.target.value))}>
                <option value="">&mdash; not set &mdash;</option>
                {data.locations.map(l => (
                  <option key={l.key} value={l.key}>{l.label}{l.pos ? ` · POS ${l.pos}` : ' · place of service from the facility record'}</option>
                ))}
              </select>
            </div>
          )}
          {/* What the visit IS lives on the visit, not here. Said plainly so
              nobody looks for the appointment type on this screen. */}
          <p className="text-xs text-gray-400 mt-2">
            The kind of visit and whether it is in person or by video are chosen at booking and on the note,
            not here. Those decide which codes apply; this decides the place of service.
          </p>

          {!agree.ok && (
            <p className="text-sm text-danger-600 mt-3"><b>These two disagree.</b> {agree.error}</p>
          )}
          {msg && <p className={`text-sm mt-3 ${msg.ok ? 'text-success-600' : 'text-danger-600'}`}>{msg.text}</p>}
          {!canEdit && <p className="text-xs text-gray-400 mt-3">Read-only &mdash; an admin sets both of these.</p>}
          {data.billingFacilityName && (
            <p className="text-xs text-gray-400 mt-2">
              Billing entity (who bills, not where care happened): {data.billingFacilityName}.
              {data.billingFacilityWarning ? ` ${data.billingFacilityWarning}` : ''}
            </p>
          )}
        </Section>
      );
    };

    const DetailView = ({ clientId, user, onBack }) => {
      // THREE answers, because the API gives three shapes of "may write here",
      // and each is asked once so no control can drift from the route behind
      // it. A screen that offers what the server will refuse is worse than a
      // read-only one.
      //   canEdit             — the workflow writes: approve, service line,
      //                         documents, paper signature, place of service.
      //                         ADMIN ONLY (place of service is an owner rule:
      //                         a clinician never sees or chooses a POS).
      //   canEditSubmission   — correcting the submission itself. Admin OR
      //                         clinician, and answered BY THE SERVER on the
      //                         record it just served rather than inferred
      //                         here from a login stored in this browser
      //                         months ago.
      //   canEditChecklist    — the clinical enrollment sequence (mark a step,
      //                         activate IHPC). Its routes are
      //                         `requireClinicalWrite` — admin OR any licensed
      //                         clinician — so the button was answering 403
      //                         for a provider who could see it and not use
      //                         it. Matched to that gate rather than left on
      //                         the admin-only `canEdit`.
      const canEdit = isAdminRole(user);
      const canEditChecklist = canEdit || !!(user && user.hasClinicalAccess);
      const [client, setClient] = useState(null);
      const [loading, setLoading] = useState(true);
      const [err, setErr] = useState('');
      const [busy, setBusy] = useState(false);
      const [followUpItems, setFollowUpItems] = useState([]);
      const [showFollowUp, setShowFollowUp] = useState(false);
      const [approveErr, setApproveErr] = useState(null);
      const [overrideReason, setOverrideReason] = useState('');
      const [lineOpen, setLineOpen] = useState(false);
      const [lineChoice, setLineChoice] = useState('');
      const [lineResult, setLineResult] = useState(null);
      // Deliberately NOT `err`: that one REPLACES the whole detail view, so a
      // failed download would blank the client's record to show a sentence.
      const [downloadErr, setDownloadErr] = useState('');

      const load = useCallback(() => {
        setLoading(true); setErr('');
        api.detail(clientId).then(d => setClient(d.client)).catch(e => setErr(e.message)).finally(() => setLoading(false));
      }, [clientId]);
      const canEditSubmission = !!(client && client.canEdit);
      useEffect(() => { load(); }, [load]);

      const doReview = () => { setBusy(true); api.review(clientId).then(load).catch(e => setErr(e.message)).finally(() => setBusy(false)); };
      const doApprove = (override) => {
        setBusy(true); setApproveErr(null);
        api.approve(clientId, override).then(() => { setOverrideReason(''); load(); }).catch(e => {
          if (e.status === 409 && e.data) setApproveErr(e.data);
          else setErr(e.message);
        }).finally(() => setBusy(false));
      };
      const submitFollowUp = () => {
        if (!followUpItems.length) return;
        setBusy(true);
        api.followUp(clientId, followUpItems).then(() => { setShowFollowUp(false); setFollowUpItems([]); load(); }).catch(e => setErr(e.message)).finally(() => setBusy(false));
      };
      const toggleFollowUpItem = (key) => setFollowUpItems(items => items.includes(key) ? items.filter(i => i !== key) : [...items, key]);

      const submitServiceLine = () => {
        if (!lineChoice || lineChoice === client.serviceLineResolved) return;
        setBusy(true); setLineResult(null);
        api.setServiceLine(clientId, lineChoice)
          .then(r => { setLineResult(r); setLineOpen(false); load(); })
          .catch(e => setErr(e.message))
          .finally(() => setBusy(false));
      };

      if (loading) return <div className="text-center text-gray-400 py-16">Loading…</div>;
      if (err) return <div className="bg-danger-50 text-danger-600 text-sm rounded-lg px-4 py-3">{err}</div>;
      if (!client) return null;

      return (
        <div>
          <button className="btn btn-ghost mb-4" onClick={onBack}>← Back to list</button>
          <div className="flex items-start justify-between flex-wrap gap-4 mb-6">
            <div>
              <h1 className="font-serif text-3xl text-primary-500 font-semibold">{client.name}</h1>
              <div className="flex items-center gap-2 mt-2 flex-wrap">
                <span className={`badge ${STATE_BADGE[client.reviewState] || 'bg-gray-100 text-gray-600'}`}>{STATE_LABEL[client.reviewState] || client.reviewState}</span>
                <span className="badge bg-gray-100 text-gray-600">{client.serviceLine || 'Service line —'}</span>
                <span className="badge bg-gray-100 text-gray-600">{client.careTierLabel || 'Care tier —'}</span>
                <span className="badge bg-gray-100 text-gray-600">{client.source === 'offline' ? 'Offline-onboarded' : 'In-app'}</span>
              </div>
            </div>
            {/* The workflow writes are admin-only at the API. A button that is
                going to answer 403 is worse than no button, so anyone else is
                TOLD which of the two states they are in rather than left
                guessing why nothing works. */}
            <div className="flex gap-2 flex-wrap">
              {canEdit ? (
                <React.Fragment>
                  <button className="btn btn-ghost" disabled={busy} onClick={doReview}>Mark as reviewed</button>
                  <button className="btn btn-ghost" disabled={busy} onClick={() => setShowFollowUp(v => !v)}>Request follow-up</button>
                  <button className="btn btn-ghost" disabled={busy} onClick={() => { setLineChoice(client.serviceLineResolved || 'PHC'); setLineOpen(v => !v); }}>Change service line</button>
                  <button className="btn btn-primary" disabled={busy} onClick={() => doApprove(null)}>Approve enrollment</button>
                </React.Fragment>
              ) : (
                <span className="badge bg-gray-100 text-gray-600">
                  {canEditSubmission
                    ? 'You can correct this submission — approving and the service line are an admin’s'
                    : 'Read-only — an admin or clinician makes changes here'}
                </span>
              )}
            </div>
          </div>

          {approveErr && (
            <div className="bg-danger-50 text-danger-600 text-sm rounded-lg px-4 py-3 mb-4">
              <strong>Cannot approve — missing items:</strong>
              <ul className="list-disc ml-5 mt-1">
                {(approveErr.missingConsents || []).map(m => <li key={m}>{m}</li>)}
                {(approveErr.missingFields || []).map(m => <li key={m}>{m}</li>)}
              </ul>
              {/* The override, offered only after the refusal. Enrolling is what
                  unlocks scheduling now, so an urgent start needs a documented
                  way through — otherwise it happens on the user form instead,
                  where nothing records why. */}
              {approveErr.overridable && (
                <div className="mt-3 pt-3 border-t border-danger-200">
                  <div className="text-gray-700">
                    You can approve anyway. The reason is stored on the record with what was
                    outstanding, and the client is told their file is not yet complete.
                  </div>
                  <input
                    className="input mt-2 w-full"
                    value={overrideReason}
                    onChange={e => setOverrideReason(e.target.value)}
                    placeholder="Why is this being approved with items outstanding?" />
                  <button className="btn btn-ghost mt-2" disabled={busy || !overrideReason.trim()}
                    onClick={() => doApprove(overrideReason.trim())}>
                    Approve with this reason
                  </button>
                </div>
              )}
            </div>
          )}

          {/* And once it happened, it stays visible. An override that fades on
              the next page load is the silent approval it replaced. */}
          {client.enrollmentApproval && client.enrollmentApproval.override && (
            <div className="bg-warning-50 text-warning-600 text-sm rounded-lg px-4 py-3 mb-4">
              <strong>Approved with items outstanding.</strong>
              <div className="mt-1">
                {client.enrollmentApproval.approvedByName} — “{client.enrollmentApproval.override.reason}”
              </div>
              <ul className="list-disc ml-5 mt-1">
                {(client.enrollmentApproval.override.missingConsents || []).map(m => <li key={m}>{m}</li>)}
                {(client.enrollmentApproval.override.missingFields || []).map(m => <li key={m}>{m}</li>)}
              </ul>
            </div>
          )}

          {client.consentReaffirmRequired && (
            <div className="bg-warning-50 text-warning-600 text-sm rounded-lg px-4 py-3 mb-4">
              <strong>Re-signature required — service agreement lane split.</strong>
              <div className="mt-1">{client.consentReaffirmRequired.note}</div>
              <ul className="list-disc ml-5 mt-1">{(client.consentReaffirmRequired.titles || []).map(t => <li key={t}>{t}</li>)}</ul>
            </div>
          )}
          {client.consentActionRequired && (
            <div className="bg-warning-50 text-warning-600 text-sm rounded-lg px-4 py-3 mb-4">
              <strong>{client.consentActionRequired.reason === 'service_line_changed'
                ? `Service line changed ${client.consentActionRequired.from} → ${client.consentActionRequired.to}.`
                : 'Rate changed after signature.'}</strong>
              <div className="mt-1">These consents are now outstanding:</div>
              <ul className="list-disc ml-5 mt-1">{(client.consentActionRequired.titles || []).map(t => <li key={t}>{t}</li>)}</ul>
            </div>
          )}
          {client.review && (
            <div className="text-xs text-gray-500 mb-4">Reviewed by {client.review.reviewerName} on {new Date(client.review.reviewedAt).toLocaleString()}</div>
          )}
          {/* Scope E2 — the internal review banner belongs here, in the staff
              view, and NOT across the header of the client's own packet. */}
          {client.reviewBanner && <div className="text-xs text-gray-400 mb-4">{client.reviewBanner}</div>}
          {client.followUp && (
            <div className="bg-warning-50 text-warning-600 text-sm rounded-lg px-4 py-3 mb-4">
              <strong>Follow-up requested</strong> by {client.followUp.requestedByName} on {new Date(client.followUp.requestedAt).toLocaleDateString()}:
              <ul className="list-disc ml-5 mt-1">{(client.followUp.itemLabels || []).map(l => <li key={l}>{l}</li>)}</ul>
            </div>
          )}

          {lineResult && (
            <div className="bg-success-50 text-success-600 text-sm rounded-lg px-4 py-3 mb-4">
              <strong>{lineResult.message}</strong>
              {!!(lineResult.added || []).length && (
                <div className="mt-1">Now awaiting signature: {lineResult.added.length} document(s). The client sees them at their next portal login.</div>
              )}
              {!!(lineResult.retained || []).length && (
                <div className="mt-1">Kept on file (signed, no longer required): {lineResult.retained.length} document(s).</div>
              )}
            </div>
          )}

          {lineOpen && (
            <Section title="Change service line">
              <p className="text-sm text-gray-500 mb-3">
                The service line decides which paperwork this client owes. Home care and
                medical care are signed at different visits, so adding medical care here
                queues the medical packet rather than reopening what is already signed.
                A document already signed is never unsigned by this change.
              </p>
              <div className="space-y-2">
                {[
                  { value: 'PHC',  label: 'Home care only (PHC)',  hint: 'Personal care services. Home-care packet only.' },
                  { value: 'IHPC', label: 'Medical care only (IHPC)', hint: 'In-home primary care. Medical packet only.' },
                  { value: 'BOTH', label: 'Both', hint: 'Home-care packet first, then the medical packet at a later visit.' }
                ].map(opt => (
                  <label key={opt.value} className={`flex items-start gap-2 text-sm border rounded-lg px-3 py-2 cursor-pointer ${lineChoice === opt.value ? 'border-primary-500 bg-primary-50' : 'border-gray-200'}`}>
                    <input type="radio" name="serviceLine" className="mt-1" checked={lineChoice === opt.value} onChange={() => setLineChoice(opt.value)} />
                    <span>
                      <span className="font-medium">{opt.label}</span>
                      {client.serviceLineResolved === opt.value && <span className="badge bg-gray-100 text-gray-500 ml-2">Current</span>}
                      <span className="block text-xs text-gray-500">{opt.hint}</span>
                    </span>
                  </label>
                ))}
              </div>
              <button className="btn btn-primary mt-3" disabled={busy || !lineChoice || lineChoice === client.serviceLineResolved} onClick={submitServiceLine}>
                Save service line
              </button>
              {!!(client.serviceLineHistory || []).length && (
                <div className="text-xs text-gray-500 mt-4">
                  <div className="font-medium text-gray-600 mb-1">History</div>
                  {client.serviceLineHistory.slice().reverse().map((h, i) => (
                    <div key={i}>{h.from} → {h.to} by {h.byName} on {new Date(h.at).toLocaleDateString()}</div>
                  ))}
                </div>
              )}
            </Section>
          )}

          {showFollowUp && (
            <Section title="Request follow-up — select outstanding items">
              <div className="grid grid-cols-2 gap-2">
                {client.missing.consents.concat(client.missing.fields).map(label => (
                  <label key={label} className="flex items-center gap-2 text-sm">
                    <input type="checkbox" checked={followUpItems.includes(label)} onChange={() => toggleFollowUpItem(label)} />
                    {label}
                  </label>
                ))}
                {client.missing.consents.length === 0 && client.missing.fields.length === 0 && (
                  <span className="text-sm text-gray-500">No outstanding items detected — enrollment appears complete.</span>
                )}
              </div>
              {(client.missing.fieldBlocks || []).length > 0 && (
                <p className="text-xs text-gray-500 mt-3">
                  Missing data blocking a signature: {client.missing.fieldBlocks.map(f => `${f.label} → ${f.blocks.join(', ')}`).join(' · ')}
                </p>
              )}
              <button className="btn btn-primary mt-3" disabled={busy || !followUpItems.length} onClick={submitFollowUp}>Send follow-up notice</button>
            </Section>
          )}

          {/* One editor, full width, for the whole submission. It renders
              nothing at all for a viewer who may not write, and the read cards
              below still show them everything. */}
          {canEditSubmission && (
            <Section title="Enrollment submission">
              <SubmissionEditor client={client} canEdit={canEditSubmission} onSaved={load} />
            </Section>
          )}

          {/* IHPC/BOTH only — a PHC-only client never has clinical readiness
              to track. The server enforces the same line check on the routes
              underneath; this just keeps the section off a client it can
              never apply to. */}
          {(client.serviceLineResolved === 'IHPC' || client.serviceLineResolved === 'BOTH') && (
            <>
              <PlaceOfServiceCard clientId={clientId} canEdit={canEdit} />
              <ClinicalEnrollmentChecklist clientId={clientId} canEdit={canEditChecklist} onActivated={load} />
            </>
          )}

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <Section title="Client">
              <dl className="text-sm space-y-1.5">
                <div className="flex justify-between"><dt className="text-gray-500">Date of birth</dt><dd>{(client.intake.dob || client.dob) || '—'}{client.age != null ? ` (age ${client.age})` : ''}</dd></div>
                <div className="flex justify-between"><dt className="text-gray-500">Email</dt><dd>{client.email || '—'}</dd></div>
                <div className="flex justify-between"><dt className="text-gray-500">Gender</dt><dd>{client.intake.gender || '—'}</dd></div>
                <div className="flex justify-between"><dt className="text-gray-500">Primary language</dt><dd>{client.intake.primaryLanguage || '—'}</dd></div>
                <div className="flex justify-between"><dt className="text-gray-500">Phone</dt><dd>{(client.intake.phone || client.phone) || '—'}</dd></div>
                <div className="flex justify-between gap-4"><dt className="text-gray-500">Address</dt><dd className="text-right">{(() => {
                  const a = client.intake.address || {};
                  const line = [a.line1, a.line2].filter(Boolean).join(', ');
                  const rest = [a.city, [a.state, a.zip].filter(Boolean).join(' ')].filter(Boolean).join(', ');
                  return [line, rest].filter(Boolean).join(' · ') || '—';
                })()}</dd></div>
              </dl>
            </Section>

            {/* Everything a consent or the face sheet prints that no card on
                this page used to show — so a reader can check it, and the
                checklist's "missing" line has somewhere to point. */}
            <Section title="Medical and emergency">
              <dl className="text-sm space-y-1.5">
                <div className="flex justify-between gap-4"><dt className="text-gray-500">Allergies</dt><dd className="text-right">{client.intake.allergies || '—'}</dd></div>
                <div className="flex justify-between gap-4"><dt className="text-gray-500">Advance directive</dt><dd className="text-right">{(client.intake.advanceDirective && client.intake.advanceDirective.status) || '—'}</dd></div>
                <div className="flex justify-between gap-4"><dt className="text-gray-500">Notify first</dt><dd className="text-right">{client.intake.crisisNotify || '—'}</dd></div>
                <div className="flex justify-between gap-4"><dt className="text-gray-500">Primary care provider</dt><dd className="text-right">{(client.intake.medicalTeam && (client.intake.medicalTeam.pcpName || client.intake.medicalTeam.pcpPractice)) || '—'}</dd></div>
                <div className="flex justify-between gap-4"><dt className="text-gray-500">Pharmacy</dt><dd className="text-right">{(client.intake.medicalTeam && client.intake.medicalTeam.preferredPharmacy) || '—'}</dd></div>
                <div className="flex justify-between gap-4"><dt className="text-gray-500">Preferred hospital</dt><dd className="text-right">{(client.intake.medicalTeam && client.intake.medicalTeam.preferredHospital) || '—'}</dd></div>
              </dl>
              <p className="lbl font-semibold text-sm mt-4 mb-1">Emergency contacts</p>
              {(client.intake.emergencyContacts || []).filter(c => c && c.name).length ? (
                <div className="space-y-1.5 text-sm">
                  {(client.intake.emergencyContacts || []).filter(c => c && c.name).map((c, n) => (
                    <div key={n}>{c.name}{c.relationship ? ` — ${c.relationship}` : ''}{c.phone ? ` · ${c.phone}` : ''}</div>
                  ))}
                </div>
              ) : <span className="text-sm text-gray-400">None on file</span>}
            </Section>

            <Section title="Primary contact">
              {client.intake.primaryContact && client.intake.primaryContact.name ? (
                <dl className="text-sm space-y-1.5">
                  <div className="flex justify-between"><dt className="text-gray-500">Name</dt><dd>{client.intake.primaryContact.name}</dd></div>
                  <div className="flex justify-between"><dt className="text-gray-500">Relationship</dt><dd>{client.intake.primaryContact.relationship || '—'}</dd></div>
                  <div className="flex justify-between"><dt className="text-gray-500">Phone</dt><dd>{client.intake.primaryContact.phone || '—'}</dd></div>
                  <div className="flex justify-between"><dt className="text-gray-500">Email</dt><dd>{client.intake.primaryContact.email || '—'}</dd></div>
                </dl>
              ) : <span className="text-sm text-gray-400">Not on file — set it under Enrollment submission → Edit submission</span>}
            </Section>

            <Section title="Consents">
              {downloadErr && <div className="bg-danger-50 text-danger-600 text-sm rounded-lg px-4 py-2 mb-3">{downloadErr}</div>}
              <p className="text-xs text-gray-400 mb-2">
                Outstanding: {client.consents.filter(c => c.outstanding).length === 0
                  ? 'none'
                  : client.consents.filter(c => c.outstanding).map(c => `${c.title} (${c.laneLabel})`).join(' · ')}
                {client.packetZipUrl && <span> · <button type="button" className="text-primary-500 underline"
                  onClick={() => { setDownloadErr(''); openDocument(client.packetZipUrl, { asDownload: 'enrollment-packet.zip' }).catch(e => setDownloadErr(e.message)); }}>download all signed copies</button></span>}
              </p>
              {(() => {
                // Grouped by the visit each packet is signed at, so a BOTH
                // client's list reads as two packets and not one long column.
                const groups = [
                  { stage: 'homecare', label: 'Home-care packet — signed at intake' },
                  { stage: 'medical',  label: 'Medical packet — signed when medical care is added' }
                ];
                const rows = client.consents || [];
                const retained = rows.filter(c => c.retained);
                return (
                  <div className="space-y-4">
                    {groups.map(g => {
                      const items = rows.filter(c => !c.retained && (c.stage || 'homecare') === g.stage);
                      if (!items.length) return null;
                      const done = items.filter(c => c.satisfied || c.status === 'na').length;
                      return (
                        <div key={g.stage}>
                          <div className="flex items-center justify-between mb-2">
                            <div className="text-xs uppercase tracking-wide text-gray-500 font-medium">{g.label}</div>
                            <span className="badge bg-gray-100 text-gray-500">{done}/{items.length}</span>
                          </div>
                          <div className="space-y-2">{items.map(c => <ConsentRow key={c.type} c={c} onDone={load} canEdit={canEdit} onDownloadError={setDownloadErr} />)}</div>
                        </div>
                      );
                    })}
                    {!!retained.length && (
                      <div>
                        <div className="text-xs uppercase tracking-wide text-gray-500 font-medium mb-2">
                          Signed previously — no longer required on this service line
                        </div>
                        <div className="space-y-2">{retained.map(c => <ConsentRow key={c.type} c={c} onDone={load} canEdit={canEdit} onDownloadError={setDownloadErr} />)}</div>
                      </div>
                    )}
                  </div>
                );
              })()}
            </Section>

            {/* Scope B2 — the agreed rate the home care money documents print. */}
            <Section title="Agreed rate">
              <RateEditor client={client} canEdit={isAdminRole(user)} onSaved={load} />
            </Section>

            <Section title="Medications">
              {client.medications.length ? (
                <div className="space-y-2 text-sm">
                  {client.medications.map((m, i) => (
                    <div key={i} className="border-b border-gray-100 pb-1.5 last:border-0">
                      <strong>{m.name}</strong> — {[m.dose, m.route, m.frequency].filter(Boolean).join(' · ') || '—'}
                    </div>
                  ))}
                </div>
              ) : <span className="text-sm text-gray-400">None on file</span>}
            </Section>

            <Section title="Payer / insurance">
              {client.payer && Object.keys(client.payer).length ? (
                <dl className="text-sm space-y-1.5">
                  {Object.entries(client.payer).filter(([, v]) => v).map(([k, v]) => (
                    <div key={k} className="flex justify-between"><dt className="text-gray-500 capitalize">{k.replace(/([A-Z])/g, ' $1')}</dt><dd>{String(v)}</dd></div>
                  ))}
                </dl>
              ) : <span className="text-sm text-gray-400">Not on file</span>}
            </Section>

            <Section title="Files">
              <div className="text-sm space-y-1.5">
                <div>Advance directive: {client.files.advanceDirective ? <a className="text-primary-500 underline" href={client.files.advanceDirective} target="_blank" rel="noreferrer">View</a> : '—'}</div>
                <div>Insurance card: {client.files.insuranceCard ? <a className="text-primary-500 underline" href={client.files.insuranceCard} target="_blank" rel="noreferrer">View</a> : '—'}</div>
                <div>Enrollment packet: {client.files.enrollmentPacket && client.files.enrollmentPacket.url ? <a className="text-primary-500 underline" href={client.files.enrollmentPacket.url} target="_blank" rel="noreferrer">View</a> : '—'}</div>
                {client.files.offlinePacketUrls.length > 0 && (
                  <div>
                    Offline packet scans:
                    <ul className="list-disc ml-5 mt-1">
                      {client.files.offlinePacketUrls.map((u, i) => <li key={i}><a className="text-primary-500 underline" href={u} target="_blank" rel="noreferrer">Scan {i + 1}</a></li>)}
                    </ul>
                  </div>
                )}
              </div>
            </Section>

            <div className="lg:col-span-2">
              <DocumentExchange clientId={clientId} canEdit={canEdit} isAdmin={isAdminRole(user)} />
            </div>
          </div>
        </div>
      );
    };

    // ── Add offline-onboarded patient (full page, admin only) ──
    // FIELD ORDER MIRRORS THE PAPER FACE SHEET, section for section (Scope G1):
    // Client · Representative · Emergency Contacts · Medical Contacts ·
    // Advance Directive · Payment and Insurance · Access and Safety. Someone is
    // holding packet 1 Document 1 and typing it in; they should read straight
    // down the page, not hunt up and down a PDF.
    const emptyOffline = {
      // 1 · Client
      firstName: '', lastName: '', preferredName: '', dob: '', gender: '',
      address: { line1: '', city: '', state: 'GA', zip: '' },
      phone: '', email: '', primaryLanguage: '', livesWith: '',
      serviceLine: 'PHC', careTier: 'A1',
      // 2 · Representative
      primaryContact: { name: '', relationship: '', phone: '', email: '', preferredChannel: '' },
      responsibleParty: { name: '', relationship: '', phone: '' },
      // 3 · Emergency contacts
      emergencyContacts: [{ name: '', relationship: '', phone: '' }],
      crisisNotify: '',
      // 4 · Medical contacts
      medicalTeam: { pcpName: '', pcpPractice: '', pcpPhone: '', preferredHospital: '', preferredPharmacy: '', pharmacyPhone: '' },
      allergies: '',
      medications: [{ name: '', dose: '', route: '', frequency: '', prescriber: '', pharmacy: '' }],
      // 5 · Advance directive
      advanceDirective: { status: '' },
      // 6 · Payment and insurance
      payer: { type: '' },
      ltc: { carrier: '', policyNum: '', policyHolder: '' },
      hourlyRate: '', dailyMinimumHours: '', rateEffectiveDate: '',
      // 7 · Access and safety
      entryInstructions: '', homeSafetyNotes: ''
    };

    const CARE_TIERS = [
      ['A1', 'A1 · Essential ADL'], ['A2', 'A2 · Comprehensive ADL & IADL'],
      ['A3', 'A3 · IADL-Forward Support'], ['A4', 'A4 · Behavioral Support & Cognitive Wellness'],
      ['B', 'Track B · Skilled Nursing']
    ];

    // The consent list used to be hardcoded here as CONSENT_DEFS_BY_LINE, a
    // second source of truth beside the server registry — and the two had
    // ALREADY DRIFTED: `monitoring` existed server-side with scope 'both' and in
    // neither array here, so offline onboarding could not record the monitoring
    // choice at all. Worse, the BOTH lane was built with
    //   new Map([...PHC, ...IHPC])
    // which dedupes by key, collapsing the service agreement that appeared in
    // both arrays into one entry — a dual-lane client was shown ONE agreement.
    // Both defects are gone with the array: the registry is fetched from the
    // server and rendered as it arrives.

    const OfflineOnboardForm = ({ onDone, onCancel }) => {
      const [form, setForm] = useState(emptyOffline);
      const [consents, setConsents] = useState({});
      const [files, setFiles] = useState([]);
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState('');
      // The registry, fetched. Never a local copy (Scope F1).
      const [registry, setRegistry] = useState({ consentDefs: [], reviewBanner: '' });
      const [registryErr, setRegistryErr] = useState('');

      useEffect(() => {
        let live = true;
        setRegistryErr('');
        api.consentRegistry(form.serviceLine)
          .then(r => { if (live) setRegistry(r); })
          .catch(e => { if (live) { setRegistry({ consentDefs: [], reviewBanner: '' }); setRegistryErr(e.message || 'Could not load the consent registry.'); } });
        return () => { live = false; };
      }, [form.serviceLine]);

      const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
      const setNested = (k, k2, v) => setForm(f => ({ ...f, [k]: { ...f[k], [k2]: v } }));
      const consentDefs = registry.consentDefs || [];
      const isPhc = form.serviceLine === 'PHC' || form.serviceLine === 'BOTH';

      const setConsentChoice = (type, status) => setConsents(c => ({ ...c, [type]: { ...(c[type] || {}), status } }));
      const setConsentDate = (type, signedAt) => setConsents(c => ({ ...c, [type]: { ...(c[type] || {}), signedAt } }));

      const addMed = () => setForm(f => ({ ...f, medications: [...f.medications, { name: '', dose: '', route: '', frequency: '', prescriber: '', pharmacy: '' }] }));
      const setMed = (i, k, v) => setForm(f => { const m = [...f.medications]; m[i] = { ...m[i], [k]: v }; return { ...f, medications: m }; });
      const addEC = () => setForm(f => ({ ...f, emergencyContacts: [...f.emergencyContacts, { name: '', relationship: '', phone: '' }] }));
      const setEC = (i, k, v) => setForm(f => { const e = [...f.emergencyContacts]; e[i] = { ...e[i], [k]: v }; return { ...f, emergencyContacts: e }; });

      const submit = () => {
        if (!form.firstName || !form.lastName || !form.dob) { setErr('First name, last name, and date of birth are required.'); return; }
        if (!consentDefs.length) { setErr('The consent registry did not load, so the checklist would be recorded incomplete. Refresh and try again.'); return; }
        setBusy(true); setErr('');
        const fd = new FormData();
        // careTier is a Track A/B home care concept — never send one for an
        // IHPC-only patient (Scope G3).
        const payload = { ...form, careTier: isPhc ? form.careTier : null, consents };
        fd.append('payload', JSON.stringify(payload));
        files.forEach(f => fd.append('files', f));
        api.createOffline(fd).then(res => {
          // Drive upload is best-effort server-side and fails silently there
          // by design (dev without Drive configured); a mismatch here is the
          // only place that gets reported back to the person who attached them.
          const filed = (res.offlinePacketDriveUrls || []).length;
          if (files.length > 0 && filed < files.length) {
            alert(`${filed} of ${files.length} packet scan(s) filed to Drive. The client record was still created — re-upload the missing scan(s) from the client's detail page once Drive is reachable.`);
          }
          onDone(res.clientId);
        }).catch(e => setErr(e.message)).finally(() => setBusy(false));
      };

      const signedCount = Object.values(consents).filter(c => c.status === 'signed_offline').length;

      return (
        <div>
          <button className="btn btn-ghost mb-4" onClick={onCancel}>← Back to list</button>
          <h1 className="font-serif text-3xl text-primary-500 font-semibold mb-1">Add offline-onboarded patient</h1>
          <p className="text-sm text-gray-500 mb-2">Keyed from the paper packet. The sections below run in the same order as the Client Information Face Sheet, so you can work straight down it.</p>
          {registry.reviewBanner && <p className="text-xs text-gray-400 mb-6">{registry.reviewBanner}</p>}
          {err && <div className="bg-danger-50 text-danger-600 text-sm rounded-lg px-4 py-3 mb-4">{err}</div>}

          <Section title="Packet scans">
            <input type="file" multiple accept=".pdf,.jpg,.jpeg,.png" onChange={e => setFiles(Array.from(e.target.files || []))} />
            <p className="text-xs text-gray-400 mt-2">PDF or image, 10 MB per file. Uploaded to the "GFC Offline Intake Packets" Drive folder.</p>
            {files.length > 0 && <p className="text-xs text-gray-600 mt-1">{files.length} file(s) selected.</p>}
          </Section>

          <Section title="1 · Client">
            <div className="grid grid-cols-3 gap-3 mb-3">
              <div><label className="label">First name *</label><input className="input" value={form.firstName} onChange={e => set('firstName', e.target.value)} /></div>
              <div><label className="label">Last name *</label><input className="input" value={form.lastName} onChange={e => set('lastName', e.target.value)} /></div>
              <div><label className="label">Preferred name</label><input className="input" value={form.preferredName} onChange={e => set('preferredName', e.target.value)} /></div>
              <div><label className="label">Date of birth *</label><input className="input" type="date" value={form.dob} onChange={e => set('dob', e.target.value)} /></div>
              <div><label className="label">Gender</label><input className="input" value={form.gender} onChange={e => set('gender', e.target.value)} /></div>
              <div><label className="label">Phone</label><input className="input" value={form.phone} onChange={e => set('phone', e.target.value)} /></div>
            </div>
            <div className="grid grid-cols-4 gap-3 mb-3">
              <div><label className="label">Address line 1</label><input className="input" value={form.address.line1} onChange={e => setNested('address', 'line1', e.target.value)} /></div>
              <div><label className="label">City</label><input className="input" value={form.address.city} onChange={e => setNested('address', 'city', e.target.value)} /></div>
              <div><label className="label">State</label><input className="input" value={form.address.state} onChange={e => setNested('address', 'state', e.target.value)} /></div>
              <div><label className="label">Zip</label><input className="input" value={form.address.zip} onChange={e => setNested('address', 'zip', e.target.value)} /></div>
            </div>
            <div className="grid grid-cols-3 gap-3 mb-3">
              <div><label className="label">Primary language</label><input className="input" value={form.primaryLanguage} onChange={e => set('primaryLanguage', e.target.value)} /></div>
              <div><label className="label">Lives with</label><input className="input" value={form.livesWith} onChange={e => set('livesWith', e.target.value)} /></div>
              <div><label className="label">Portal email (optional)</label><input className="input" type="email" value={form.email} onChange={e => set('email', e.target.value)} placeholder="Blank = no portal login" /></div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="label">Service line</label>
                <select className="input" value={form.serviceLine} onChange={e => set('serviceLine', e.target.value)}>
                  <option value="PHC">Private Home Care</option><option value="IHPC">In-Home Primary Care</option><option value="BOTH">Both</option>
                </select>
              </div>
              {isPhc ? (
                <div>
                  <label className="label">Care tier</label>
                  <select className="input" value={form.careTier} onChange={e => set('careTier', e.target.value)}>
                    {CARE_TIERS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                  </select>
                </div>
              ) : (
                <div>
                  <label className="label">Care tier</label>
                  <p className="text-xs text-gray-400 mt-2">Track A/B placement is a home care concept. An In-Home Primary Care patient does not have one.</p>
                </div>
              )}
            </div>
          </Section>

          <Section title="2 · Representative">
            <p className="lbl font-semibold text-sm mb-2">Primary contact</p>
            <div className="grid grid-cols-4 gap-3 mb-3">
              <input className="input" placeholder="Name" value={form.primaryContact.name} onChange={e => setNested('primaryContact', 'name', e.target.value)} />
              <input className="input" placeholder="Relationship" value={form.primaryContact.relationship} onChange={e => setNested('primaryContact', 'relationship', e.target.value)} />
              <input className="input" placeholder="Phone" value={form.primaryContact.phone} onChange={e => setNested('primaryContact', 'phone', e.target.value)} />
              <input className="input" placeholder="Email" value={form.primaryContact.email} onChange={e => setNested('primaryContact', 'email', e.target.value)} />
            </div>
            <p className="lbl font-semibold text-sm mt-4 mb-2">Responsible party <span className="font-normal text-gray-400">— only if someone other than the client is accepting financial responsibility</span></p>
            <div className="grid grid-cols-3 gap-3">
              <input className="input" placeholder="Name" value={form.responsibleParty.name} onChange={e => setNested('responsibleParty', 'name', e.target.value)} />
              <input className="input" placeholder="Relationship" value={form.responsibleParty.relationship} onChange={e => setNested('responsibleParty', 'relationship', e.target.value)} />
              <input className="input" placeholder="Phone" value={form.responsibleParty.phone} onChange={e => setNested('responsibleParty', 'phone', e.target.value)} />
            </div>
          </Section>

          <Section title="3 · Emergency contacts">
            {form.emergencyContacts.map((e, i) => (
              <div className="grid grid-cols-3 gap-3 mb-2" key={i}>
                <input className="input" placeholder="Name" value={e.name} onChange={ev => setEC(i, 'name', ev.target.value)} />
                <input className="input" placeholder="Relationship" value={e.relationship} onChange={ev => setEC(i, 'relationship', ev.target.value)} />
                <input className="input" placeholder="Phone" value={e.phone} onChange={ev => setEC(i, 'phone', ev.target.value)} />
              </div>
            ))}
            <button className="btn btn-ghost text-sm mt-1" onClick={addEC}>+ Add another emergency contact</button>
            <div className="mt-4">
              <label className="label">Notify first in a crisis</label>
              <input className="input" placeholder="Name & phone" value={form.crisisNotify} onChange={e => set('crisisNotify', e.target.value)} />
              <p className="text-xs text-gray-400 mt-1">Heads the call order printed on the Emergency &amp; Crisis Protocol the caregiver carries.</p>
            </div>
          </Section>

          <Section title="4 · Medical contacts">
            <div className="grid grid-cols-3 gap-3 mb-3">
              <div><label className="label">Primary care provider</label><input className="input" value={form.medicalTeam.pcpName} onChange={e => setNested('medicalTeam', 'pcpName', e.target.value)} /></div>
              <div><label className="label">PCP practice</label><input className="input" value={form.medicalTeam.pcpPractice} onChange={e => setNested('medicalTeam', 'pcpPractice', e.target.value)} /></div>
              <div><label className="label">PCP phone</label><input className="input" value={form.medicalTeam.pcpPhone} onChange={e => setNested('medicalTeam', 'pcpPhone', e.target.value)} /></div>
              <div><label className="label">Preferred hospital</label><input className="input" value={form.medicalTeam.preferredHospital} onChange={e => setNested('medicalTeam', 'preferredHospital', e.target.value)} /></div>
              <div><label className="label">Preferred pharmacy</label><input className="input" value={form.medicalTeam.preferredPharmacy} onChange={e => setNested('medicalTeam', 'preferredPharmacy', e.target.value)} /></div>
              <div><label className="label">Pharmacy phone</label><input className="input" value={form.medicalTeam.pharmacyPhone} onChange={e => setNested('medicalTeam', 'pharmacyPhone', e.target.value)} /></div>
            </div>
            <p className="lbl font-semibold text-sm mt-4 mb-2">Allergies</p>
            <textarea className="input" rows="2" value={form.allergies} onChange={e => set('allergies', e.target.value)} placeholder="Or 'none known'" />
            <p className="lbl font-semibold text-sm mt-5 mb-2">Medications</p>
            {form.medications.map((m, i) => (
              <div className="grid grid-cols-3 gap-3 mb-2" key={i}>
                <input className="input" placeholder="Name" value={m.name} onChange={e => setMed(i, 'name', e.target.value)} />
                <input className="input" placeholder="Dose" value={m.dose} onChange={e => setMed(i, 'dose', e.target.value)} />
                <input className="input" placeholder="Frequency" value={m.frequency} onChange={e => setMed(i, 'frequency', e.target.value)} />
              </div>
            ))}
            <button className="btn btn-ghost text-sm mt-1" onClick={addMed}>+ Add another medication</button>
          </Section>

          <Section title="5 · Advance directive">
            <label className="label">On file</label>
            <select className="input" value={form.advanceDirective.status} onChange={e => setNested('advanceDirective', 'status', e.target.value)}>
              <option value="">Not recorded</option>
              <option value="Yes — copy provided">Yes — copy provided</option>
              <option value="Yes — will provide">Yes — will provide</option>
              <option value="No">No</option>
            </select>
            <p className="text-xs text-gray-400 mt-1">Printed on the Emergency Response and Personal Care Aide Scope documents.</p>
          </Section>

          <Section title="6 · Payment and insurance">
            <div className="grid grid-cols-3 gap-3 mb-3">
              <div><label className="label">Payer type</label><input className="input" placeholder="Private pay, Medicaid, LTC insurance…" value={form.payer.type} onChange={e => setNested('payer', 'type', e.target.value)} /></div>
              <div><label className="label">LTC carrier</label><input className="input" value={form.ltc.carrier} onChange={e => setNested('ltc', 'carrier', e.target.value)} /></div>
              <div><label className="label">LTC policy number</label><input className="input" value={form.ltc.policyNum} onChange={e => setNested('ltc', 'policyNum', e.target.value)} /></div>
            </div>
            {isPhc && (
              <React.Fragment>
                <p className="lbl font-semibold text-sm mt-4 mb-2">Agreed rate <span className="font-normal text-gray-400">— off the paper Financial Agreement</span></p>
                <div className="grid grid-cols-3 gap-3">
                  <div><label className="label">Hourly rate ($)</label><input className="input" type="number" min="0" step="0.01" value={form.hourlyRate} onChange={e => set('hourlyRate', e.target.value)} /></div>
                  <div><label className="label">Daily minimum (hours)</label><input className="input" type="number" min="0" step="0.5" value={form.dailyMinimumHours} onChange={e => set('dailyMinimumHours', e.target.value)} /></div>
                  <div><label className="label">Effective</label><input className="input" type="date" value={form.rateEffectiveDate} onChange={e => set('rateEffectiveDate', e.target.value)} /></div>
                </div>
                <p className="text-xs text-gray-400 mt-1">Both home care money documents print this table. Leave it out and the client is blocked at their first in-app signature.</p>
              </React.Fragment>
            )}
          </Section>

          <Section title="7 · Access and safety">
            <label className="label">Entry instructions for responders</label>
            <input className="input mb-3" placeholder="Lockbox code, side door, key with neighbour…" value={form.entryInstructions} onChange={e => set('entryInstructions', e.target.value)} />
            <label className="label">Home safety notes</label>
            <textarea className="input" rows="2" placeholder="Pets, firearms, stairs, oxygen, hoarding…" value={form.homeSafetyNotes} onChange={e => set('homeSafetyNotes', e.target.value)} />
          </Section>

          <Section title="8 · Consent checklist">
            <p className="text-sm text-gray-500 mb-3">One status per document — a paper client may well have signed eight of nine. The list comes from the server registry and branches on the service line above.</p>
            {registryErr && <div className="bg-danger-50 text-danger-600 text-sm rounded-lg px-4 py-3 mb-3">{registryErr}</div>}
            {!consentDefs.length && !registryErr && <p className="text-sm text-gray-400">Loading the consent registry…</p>}
            <div className="space-y-3">
              {consentDefs.map(def => {
                const entry = consents[def.type] || {};
                const laneLabel = def.scope === 'phc' ? 'Home care' : def.scope === 'ihpc' ? 'Primary care' : 'Both lanes';
                // An inactive consent was never on the paper packet, so "signed
                // on paper" is not one of its options (Scope E1/F4).
                const options = def.inactive ? ['optin_recorded', 'pending', 'na'] : ['signed_offline', 'pending', 'na'];
                const optionLabel = (opt) => opt === 'signed_offline' ? 'Signed on paper'
                  : opt === 'optin_recorded' ? 'Opted in'
                  : opt === 'pending' ? 'Not on paper — will request in-app' : 'N/A';
                return (
                  <div key={def.type} className="border-b border-gray-100 pb-3 last:border-0">
                    <div className="flex items-baseline gap-2 mb-1.5">
                      <span className="font-medium text-sm">{def.title}</span>
                      <span className="text-xs text-gray-400">{laneLabel}{def.paperSource ? ` · ${def.paperSource}` : ''}{def.required ? '' : ' · optional'}</span>
                    </div>
                    <div className="flex items-center gap-4 text-sm flex-wrap">
                      {options.map(opt => (
                        <label key={opt} className="flex items-center gap-1.5">
                          <input type="radio" name={`consent-${def.type}`} checked={(entry.status || 'pending') === opt} onChange={() => setConsentChoice(def.type, opt)} />
                          {optionLabel(opt)}
                        </label>
                      ))}
                      {entry.status === 'signed_offline' && (
                        <input className="input" style={{ width: 160 }} type="date" value={entry.signedAt || ''} onChange={e => setConsentDate(def.type, e.target.value)} placeholder="Date signed" />
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </Section>

          <Section title="9 · Confirm and create">
            <p className="text-sm text-gray-600 mb-4">
              Will create <strong>{form.firstName} {form.lastName}</strong> ({form.serviceLine}{isPhc ? `, ${form.careTier}` : ''}) with source <code>legacy_offline</code> and enrollment status <code>intake_complete</code>.
              {' '}{signedCount} of {consentDefs.filter(d => d.required).length} required consent(s) marked signed on paper.
            </p>
            <button className="btn btn-primary" disabled={busy} onClick={submit}>{busy ? 'Creating…' : 'Create client record'}</button>
          </Section>
        </div>
      );
    };

    // ── App shell ─────────────────────────────────────────────────────
    const App = () => {
      const [token, setToken] = useState(getToken);
      const [user, setUser] = useState(getStoredUser);
      const [view, setView] = useState(() => {
        const deepLinkId = new URLSearchParams(window.location.search).get('client');
        return deepLinkId ? { page: 'detail', id: deepLinkId } : { page: 'list' };
      });

      if (!token || !user) return <LoginScreen onLogin={(t, u) => { setToken(t); setUser(u); }} />;
      if (!isStaff(user)) {
        return (
          <div className="min-h-screen flex items-center justify-center px-4">
            <div className="card p-8 max-w-sm text-center">
              <h1 className="font-serif text-xl text-primary-500 font-semibold mb-2">Access restricted</h1>
              <p className="text-sm text-gray-500">This area is for enrollment staff (admin, clinical, or case manager roles) only.</p>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-6xl mx-auto px-4 lg:px-8 py-8">
          {view.page === 'list' && (
            <ListView user={user} onOpen={id => setView({ page: 'detail', id })} onAddOffline={() => setView({ page: 'offline' })} />
          )}
          {view.page === 'detail' && (
            <DetailView clientId={view.id} user={user} onBack={() => setView({ page: 'list' })} />
          )}
          {view.page === 'offline' && (
            <OfflineOnboardForm onCancel={() => setView({ page: 'list' })} onDone={id => setView({ page: 'detail', id })} />
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
