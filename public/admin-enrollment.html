      ['A1', 'A1 · Essential ADL'], ['A2', 'A2 · Comprehensive ADL & IADL'],
      ['A3', 'A3 · IADL-Forward Support'], ['A4', 'A4 · Behavioral Support & Cognitive Wellness'],
      ['B', 'Track B · Skilled Nursing']
    ];

    // The consent list used to be hardcoded here as CONSENT_DEFS_BY_LINE, a
    // second source of truth beside the server registry — and the two had
    // ALREADY DRIFTED: `monitoring` existed server-side with scope 'both' and in
    // neither array here, so offline onboarding could not record the monitoring
    // choice at all. Worse, the BOTH lane was built with
    //   new Map([...PHC, ...IHPC])
    // which dedupes by key, collapsing the service agreement that appeared in
    // both arrays into one entry — a dual-lane client was shown ONE agreement.
    // Both defects are gone with the array: the registry is fetched from the
    // server and rendered as it arrives.

    const OfflineOnboardForm = ({ onDone, onCancel }) => {
      const [form, setForm] = useState(emptyOffline);
      const [consents, setConsents] = useState({});
      const [files, setFiles] = useState([]);
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState('');
      // The registry, fetched. Never a local copy (Scope F1).
      const [registry, setRegistry] = useState({ consentDefs: [], reviewBanner: '' });
      const [registryErr, setRegistryErr] = useState('');

      useEffect(() => {
        let live = true;
        setRegistryErr('');
        api.consentRegistry(form.serviceLine)
          .then(r => { if (live) setRegistry(r); })
          .catch(e => { if (live) { setRegistry({ consentDefs: [], reviewBanner: '' }); setRegistryErr(e.message || 'Could not load the consent registry.'); } });
        return () => { live = false; };
      }, [form.serviceLine]);

      const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
      const setNested = (k, k2, v) => setForm(f => ({ ...f, [k]: { ...f[k], [k2]: v } }));
      const consentDefs = registry.consentDefs || [];
      const isPhc = form.serviceLine === 'PHC' || form.serviceLine === 'BOTH';

      const setConsentChoice = (type, status) => setConsents(c => ({ ...c, [type]: { ...(c[type] || {}), status } }));
      const setConsentDate = (type, signedAt) => setConsents(c => ({ ...c, [type]: { ...(c[type] || {}), signedAt } }));

      const addMed = () => setForm(f => ({ ...f, medications: [...f.medications, { name: '', dose: '', route: '', frequency: '', prescriber: '', pharmacy: '' }] }));
      const setMed = (i, k, v) => setForm(f => { const m = [...f.medications]; m[i] = { ...m[i], [k]: v }; return { ...f, medications: m }; });
      const addEC = () => setForm(f => ({ ...f, emergencyContacts: [...f.emergencyContacts, { name: '', relationship: '', phone: '' }] }));
      const setEC = (i, k, v) => setForm(f => { const e = [...f.emergencyContacts]; e[i] = { ...e[i], [k]: v }; return { ...f, emergencyContacts: e }; });

      const submit = () => {
        if (!form.firstName || !form.lastName || !form.dob) { setErr('First name, last name, and date of birth are required.'); return; }
        if (!consentDefs.length) { setErr('The consent registry did not load, so the checklist would be recorded incomplete. Refresh and try again.'); return; }
        setBusy(true); setErr('');
        const fd = new FormData();
        // careTier is a Track A/B home care concept — never send one for an
        // IHPC-only patient (Scope G3).
        const payload = { ...form, careTier: isPhc ? form.careTier : null, consents };
        fd.append('payload', JSON.stringify(payload));
        files.forEach(f => fd.append('files', f));
        api.createOffline(fd).then(res => {
          // Drive upload is best-effort server-side and fails silently there
          // by design (dev without Drive configured); a mismatch here is the
          // only place that gets reported back to the person who attached them.
          const filed = (res.offlinePacketDriveUrls || []).length;
          if (files.length > 0 && filed < files.length) {
            alert(`${filed} of ${files.length} packet scan(s) filed to Drive. The client record was still created — re-upload the missing scan(s) from the client's detail page once Drive is reachable.`);
          }
          onDone(res.clientId);
        }).catch(e => setErr(e.message)).finally(() => setBusy(false));
      };

      const signedCount = Object.values(consents).filter(c => c.status === 'signed_offline').length;

      return (
        <div>
          <button className="btn btn-ghost mb-4" onClick={onCancel}>← Back to list</button>
          <h1 className="font-serif text-3xl text-primary-500 font-semibold mb-1">Add offline-onboarded patient</h1>
          <p className="text-sm text-gray-500 mb-2">Keyed from the paper packet. The sections below run in the same order as the Client Information Face Sheet, so you can work straight down it.</p>
          {registry.reviewBanner && <p className="text-xs text-gray-400 mb-6">{registry.reviewBanner}</p>}
          {err && <div className="bg-danger-50 text-danger-600 text-sm rounded-lg px-4 py-3 mb-4">{err}</div>}

          <Section title="Packet scans">
            <input type="file" multiple accept=".pdf,.jpg,.jpeg,.png" onChange={e => setFiles(Array.from(e.target.files || []))} />
            <p className="text-xs text-gray-400 mt-2">PDF or image, 10 MB per file. Uploaded to the "GFC Offline Intake Packets" Drive folder.</p>
            {files.length > 0 && <p className="text-xs text-gray-600 mt-1">{files.length} file(s) selected.</p>}
          </Section>

          <Section title="1 · Client">
            <div className="grid grid-cols-3 gap-3 mb-3">
              <div><label className="label">First name *</label><input className="input" value={form.firstName} onChange={e => set('firstName', e.target.value)} /></div>
              <div><label className="label">Last name *</label><input className="input" value={form.lastName} onChange={e => set('lastName', e.target.value)} /></div>
              <div><label className="label">Preferred name</label><input className="input" value={form.preferredName} onChange={e => set('preferredName', e.target.value)} /></div>
              <div><label className="label">Date of birth *</label><input className="input" type="date" value={form.dob} onChange={e => set('dob', e.target.value)} /></div>
              <div><label className="label">Gender</label><input className="input" value={form.gender} onChange={e => set('gender', e.target.value)} /></div>
              <div><label className="label">Phone</label><input className="input" value={form.phone} onChange={e => set('phone', e.target.value)} /></div>
            </div>
            <div className="grid grid-cols-4 gap-3 mb-3">
              <div><label className="label">Address line 1</label><input className="input" value={form.address.line1} onChange={e => setNested('address', 'line1', e.target.value)} /></div>
              <div><label className="label">City</label><input className="input" value={form.address.city} onChange={e => setNested('address', 'city', e.target.value)} /></div>
              <div><label className="label">State</label><input className="input" value={form.address.state} onChange={e => setNested('address', 'state', e.target.value)} /></div>
              <div><label className="label">Zip</label><input className="input" value={form.address.zip} onChange={e => setNested('address', 'zip', e.target.value)} /></div>
            </div>
            <div className="grid grid-cols-3 gap-3 mb-3">
              <div><label className="label">Primary language</label><input className="input" value={form.primaryLanguage} onChange={e => set('primaryLanguage', e.target.value)} /></div>
              <div><label className="label">Lives with</label><input className="input" value={form.livesWith} onChange={e => set('livesWith', e.target.value)} /></div>
              <div><label className="label">Portal email (optional)</label><input className="input" type="email" value={form.email} onChange={e => set('email', e.target.value)} placeholder="Blank = no portal login" /></div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="label">Service line</label>
                <select className="input" value={form.serviceLine} onChange={e => set('serviceLine', e.target.value)}>
                  <option value="PHC">Private Home Care</option><option value="IHPC">In-Home Primary Care</option><option value="BOTH">Both</option>
                </select>
              </div>
              {isPhc ? (
                <div>
                  <label className="label">Care tier</label>
                  <select className="input" value={form.careTier} onChange={e => set('careTier', e.target.value)}>
                    {CARE_TIERS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                  </select>
                </div>
              ) : (
                <div>
                  <label className="label">Care tier</label>
                  <p className="text-xs text-gray-400 mt-2">Track A/B placement is a home care concept. An In-Home Primary Care patient does not have one.</p>
                </div>
              )}
            </div>
          </Section>

          <Section title="2 · Representative">
            <p className="lbl font-semibold text-sm mb-2">Primary contact</p>
            <div className="grid grid-cols-4 gap-3 mb-3">
              <input className="input" placeholder="Name" value={form.primaryContact.name} onChange={e => setNested('primaryContact', 'name', e.target.value)} />
              <input className="input" placeholder="Relationship" value={form.primaryContact.relationship} onChange={e => setNested('primaryContact', 'relationship', e.target.value)} />
              <input className="input" placeholder="Phone" value={form.primaryContact.phone} onChange={e => setNested('primaryContact', 'phone', e.target.value)} />
              <input className="input" placeholder="Email" value={form.primaryContact.email} onChange={e => setNested('primaryContact', 'email', e.target.value)} />
            </div>
            <p className="lbl font-semibold text-sm mt-4 mb-2">Responsible party <span className="font-normal text-gray-400">— only if someone other than the client is accepting financial responsibility</span></p>
            <div className="grid grid-cols-3 gap-3">
              <input className="input" placeholder="Name" value={form.responsibleParty.name} onChange={e => setNested('responsibleParty', 'name', e.target.value)} />
              <input className="input" placeholder="Relationship" value={form.responsibleParty.relationship} onChange={e => setNested('responsibleParty', 'relationship', e.target.value)} />
              <input className="input" placeholder="Phone" value={form.responsibleParty.phone} onChange={e => setNested('responsibleParty', 'phone', e.target.value)} />
            </div>
          </Section>

          <Section title="3 · Emergency contacts">
            {form.emergencyContacts.map((e, i) => (
              <div className="grid grid-cols-3 gap-3 mb-2" key={i}>
                <input className="input" placeholder="Name" value={e.name} onChange={ev => setEC(i, 'name', ev.target.value)} />
                <input className="input" placeholder="Relationship" value={e.relationship} onChange={ev => setEC(i, 'relationship', ev.target.value)} />
                <input className="input" placeholder="Phone" value={e.phone} onChange={ev => setEC(i, 'phone', ev.target.value)} />
              </div>
            ))}
            <button className="btn btn-ghost text-sm mt-1" onClick={addEC}>+ Add another emergency contact</button>
            <div className="mt-4">
              <label className="label">Notify first in a crisis</label>
              <input className="input" placeholder="Name & phone" value={form.crisisNotify} onChange={e => set('crisisNotify', e.target.value)} />
              <p className="text-xs text-gray-400 mt-1">Heads the call order printed on the Emergency &amp; Crisis Protocol the caregiver carries.</p>
            </div>
          </Section>

          <Section title="4 · Medical contacts">
            <div className="grid grid-cols-3 gap-3 mb-3">
              <div><label className="label">Primary care provider</label><input className="input" value={form.medicalTeam.pcpName} onChange={e => setNested('medicalTeam', 'pcpName', e.target.value)} /></div>
              <div><label className="label">PCP practice</label><input className="input" value={form.medicalTeam.pcpPractice} onChange={e => setNested('medicalTeam', 'pcpPractice', e.target.value)} /></div>
              <div><label className="label">PCP phone</label><input className="input" value={form.medicalTeam.pcpPhone} onChange={e => setNested('medicalTeam', 'pcpPhone', e.target.value)} /></div>
              <div><label className="label">Preferred hospital</label><input className="input" value={form.medicalTeam.preferredHospital} onChange={e => setNested('medicalTeam', 'preferredHospital', e.target.value)} /></div>
              <div><label className="label">Preferred pharmacy</label><input className="input" value={form.medicalTeam.preferredPharmacy} onChange={e => setNested('medicalTeam', 'preferredPharmacy', e.target.value)} /></div>
              <div><label className="label">Pharmacy phone</label><input className="input" value={form.medicalTeam.pharmacyPhone} onChange={e => setNested('medicalTeam', 'pharmacyPhone', e.target.value)} /></div>
            </div>
            <p className="lbl font-semibold text-sm mt-4 mb-2">Allergies</p>
            <textarea className="input" rows="2" value={form.allergies} onChange={e => set('allergies', e.target.value)} placeholder="Or 'none known'" />
            <p className="lbl font-semibold text-sm mt-5 mb-2">Medications</p>
            {form.medications.map((m, i) => (
              <div className="grid grid-cols-3 gap-3 mb-2" key={i}>
                <input className="input" placeholder="Name" value={m.name} onChange={e => setMed(i, 'name', e.target.value)} />
                <input className="input" placeholder="Dose" value={m.dose} onChange={e => setMed(i, 'dose', e.target.value)} />
                <input className="input" placeholder="Frequency" value={m.frequency} onChange={e => setMed(i, 'frequency', e.target.value)} />
              </div>
            ))}
            <button className="btn btn-ghost text-sm mt-1" onClick={addMed}>+ Add another medication</button>
          </Section>

          <Section title="5 · Advance directive">
            <label className="label">On file</label>
            <select className="input" value={form.advanceDirective.status} onChange={e => setNested('advanceDirective', 'status', e.target.value)}>
              <option value="">Not recorded</option>
              <option value="Yes — copy provided">Yes — copy provided</option>
              <option value="Yes — will provide">Yes — will provide</option>
              <option value="No">No</option>
            </select>
            <p className="text-xs text-gray-400 mt-1">Printed on the Emergency Response and Personal Care Aide Scope documents.</p>
          </Section>

          <Section title="6 · Payment and insurance">
            <div className="grid grid-cols-3 gap-3 mb-3">
              <div><label className="label">Payer type</label><input className="input" placeholder="Private pay, Medicaid, LTC insurance…" value={form.payer.type} onChange={e => setNested('payer', 'type', e.target.value)} /></div>
              <div><label className="label">LTC carrier</label><input className="input" value={form.ltc.carrier} onChange={e => setNested('ltc', 'carrier', e.target.value)} /></div>
              <div><label className="label">LTC policy number</label><input className="input" value={form.ltc.policyNum} onChange={e => setNested('ltc', 'policyNum', e.target.value)} /></div>
            </div>
            {isPhc && (
              <React.Fragment>
                <p className="lbl font-semibold text-sm mt-4 mb-2">Agreed rate <span className="font-normal text-gray-400">— off the paper Financial Agreement</span></p>
                <div className="grid grid-cols-3 gap-3">
                  <div><label className="label">Hourly rate ($)</label><input className="input" type="number" min="0" step="0.01" value={form.hourlyRate} onChange={e => set('hourlyRate', e.target.value)} /></div>
                  <div><label className="label">Daily minimum (hours)</label><input className="input" type="number" min="0" step="0.5" value={form.dailyMinimumHours} onChange={e => set('dailyMinimumHours', e.target.value)} /></div>
                  <div><label className="label">Effective</label><input className="input" type="date" value={form.rateEffectiveDate} onChange={e => set('rateEffectiveDate', e.target.value)} /></div>
                </div>
                <p className="text-xs text-gray-400 mt-1">Both home care money documents print this table. Leave it out and the client is blocked at their first in-app signature.</p>
              </React.Fragment>
            )}
          </Section>

          <Section title="7 · Access and safety">
            <label className="label">Entry instructions for responders</label>
            <input className="input mb-3" placeholder="Lockbox code, side door, key with neighbour…" value={form.entryInstructions} onChange={e => set('entryInstructions', e.target.value)} />
            <label className="label">Home safety notes</label>
            <textarea className="input" rows="2" placeholder="Pets, firearms, stairs, oxygen, hoarding…" value={form.homeSafetyNotes} onChange={e => set('homeSafetyNotes', e.target.value)} />
          </Section>

          <Section title="8 · Consent checklist">
            <p className="text-sm text-gray-500 mb-3">One status per document — a paper client may well have signed eight of nine. The list comes from the server registry and branches on the service line above.</p>
            {registryErr && <div className="bg-danger-50 text-danger-600 text-sm rounded-lg px-4 py-3 mb-3">{registryErr}</div>}
            {!consentDefs.length && !registryErr && <p className="text-sm text-gray-400">Loading the consent registry…</p>}
            <div className="space-y-3">
              {consentDefs.map(def => {
                const entry = consents[def.type] || {};
                const laneLabel = def.scope === 'phc' ? 'Home care' : def.scope === 'ihpc' ? 'Primary care' : 'Both lanes';
                // An inactive consent was never on the paper packet, so "signed
                // on paper" is not one of its options (Scope E1/F4).
                const options = def.inactive ? ['optin_recorded', 'pending', 'na'] : ['signed_offline', 'pending', 'na'];
                const optionLabel = (opt) => opt === 'signed_offline' ? 'Signed on paper'
                  : opt === 'optin_recorded' ? 'Opted in'
                  : opt === 'pending' ? 'Not on paper — will request in-app' : 'N/A';
                return (
                  <div key={def.type} className="border-b border-gray-100 pb-3 last:border-0">
                    <div className="flex items-baseline gap-2 mb-1.5">
                      <span className="font-medium text-sm">{def.title}</span>
                      <span className="text-xs text-gray-400">{laneLabel}{def.paperSource ? ` · ${def.paperSource}` : ''}{def.required ? '' : ' · optional'}</span>
                    </div>
                    <div className="flex items-center gap-4 text-sm flex-wrap">
                      {options.map(opt => (
                        <label key={opt} className="flex items-center gap-1.5">
                          <input type="radio" name={`consent-${def.type}`} checked={(entry.status || 'pending') === opt} onChange={() => setConsentChoice(def.type, opt)} />
                          {optionLabel(opt)}
                        </label>
                      ))}
                      {entry.status === 'signed_offline' && (
                        <input className="input" style={{ width: 160 }} type="date" value={entry.signedAt || ''} onChange={e => setConsentDate(def.type, e.target.value)} placeholder="Date signed" />
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </Section>

          <Section title="9 · Confirm and create">
            <p className="text-sm text-gray-600 mb-4">
              Will create <strong>{form.firstName} {form.lastName}</strong> ({form.serviceLine}{isPhc ? `, ${form.careTier}` : ''}) with source <code>legacy_offline</code> and enrollment status <code>intake_complete</code>.
              {' '}{signedCount} of {consentDefs.filter(d => d.required).length} required consent(s) marked signed on paper.
            </p>
            <button className="btn btn-primary" disabled={busy} onClick={submit}>{busy ? 'Creating…' : 'Create client record'}</button>
          </Section>
        </div>
      );
    };

    // ── App shell ─────────────────────────────────────────────────────
    const App = () => {
      const [token, setToken] = useState(getToken);
      const [user, setUser] = useState(getStoredUser);
      const [view, setView] = useState(() => {
        const deepLinkId = new URLSearchParams(window.location.search).get('client');
        return deepLinkId ? { page: 'detail', id: deepLinkId } : { page: 'list' };
      });

      if (!token || !user) return <LoginScreen onLogin={(t, u) => { setToken(t); setUser(u); }} />;
      if (!isStaff(user)) {
        return (
          <div className="min-h-screen flex items-center justify-center px-4">
            <div className="card p-8 max-w-sm text-center">
              <h1 className="font-serif text-xl text-primary-500 font-semibold mb-2">Access restricted</h1>
              <p className="text-sm text-gray-500">This area is for enrollment staff (admin, clinical, or case manager roles) only.</p>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-6xl mx-auto px-4 lg:px-8 py-8">
          {view.page === 'list' && (
            <ListView user={user} onOpen={id => setView({ page: 'detail', id })} onAddOffline={() => setView({ page: 'offline' })} />
          )}
          {view.page === 'detail' && (
            <DetailView clientId={view.id} user={user} onBack={() => setView({ page: 'list' })} />
          )}
          {view.page === 'offline' && (
            <OfflineOnboardForm onCancel={() => setView({ page: 'list' })} onDone={id => setView({ page: 'detail', id })} />
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
