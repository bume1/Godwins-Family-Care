<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Godwins Family Care — Clinician Onboarding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.1.0/dist/tabler-icons.min.css">
  <!-- Eastern on both sides (owner rule, 2026-09-16), before any of the page's
       own scripts can format a date. -->
  <script src="/gfc-time.js"></script>
  <script>window.GFC_TIME && window.GFC_TIME.installDefaultTimeZone();</script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <script src="/session-guard.js"></script>
  <link rel="icon" type="image/png" href="/brand/logo-mark-transparent.png">
  <style>
    :root{
      --navy:#033D50; --navy-d:#022A38; --gold:#F5CD85; --gold-d:#C9A44A;
      --cream:#FAF7F2; --cream-d:#efe9db; --ink:#1a2a32; --mut:#41555f;
      --red:#A32D2D; --amber:#8a6400; --green:#0f6e56; --line:#e5ddcb;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',system-ui,sans-serif;background:var(--cream);color:var(--ink);
      font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
    h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;line-height:1.2}
    .wrap{max-width:1180px;margin:0 auto;padding:0 16px 72px}
    header.top{background:var(--navy);color:#fff;padding:18px 0 16px}
    header.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:0}
    .brand{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px}
    .brand b{color:var(--gold);font-weight:600}
    .spacer{flex:1}

    /* THE ONBOARDING HERO. Deliberately the same mechanism as the caregiver
       welcome packet's (`.whero` in caregiver.html): a photo on navy under a
       navy gradient, gold rule, Cormorant headline. The two front doors into
       this company should not look like two different companies.

       THE PHOTO IS ONE FILE, /banners/banner-clinician.jpg. Replacing that file
       changes the hero; no code moves. If it is ever missing the navy ground
       and the gradient still carry the headline, so a broken image is a plain
       banner rather than a broken page.

       Full bleed, with the TEXT held to the page's own column, or on a wide
       screen the headline floats away from the cards it introduces. */
    .whero{position:relative;background:var(--navy);overflow:hidden}
    .whero .img{position:absolute;inset:0;background-size:cover;background-position:center 30%}
    .whero .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,61,80,.44) 0%,rgba(3,61,80,.70) 55%,rgba(2,42,56,.93) 100%)}
    .whero .inner{position:relative;max-width:1180px;margin:0 auto;padding:34px 16px 22px;
      min-height:180px;display:flex;flex-direction:column;justify-content:flex-end}
    .whero .rule{width:56px;height:3px;background:var(--gold);border-radius:2px;margin-bottom:12px}
    .whero h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;color:var(--cream);
      font-size:30px;line-height:1.12;letter-spacing:.2px}
    .whero p{color:rgba(250,247,242,.86);font-size:15px;margin-top:8px;max-width:52ch}
    @media(min-width:700px){
      .whero .inner{padding:52px 16px 30px;min-height:248px}
      .whero h1{font-size:42px}
      .whero p{font-size:16px}
    }
    .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 20px}
    .tab{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 16px;
      font-size:14px;font-weight:600;color:var(--mut);cursor:pointer}
    .tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
    .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
    .card h2{font-size:22px;margin-bottom:4px}
    .card h3{font-size:18px;margin-bottom:8px}
    .sub{color:var(--mut);font-size:14px}
    .row{display:flex;gap:12px;align-items:flex-start}
    .grid{display:grid;gap:12px}
    @media(min-width:760px){.grid.two{grid-template-columns:1fr 1fr}
      .grid.three{grid-template-columns:repeat(3,1fr)}}
    .btn{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:9px 16px;
      font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
    .btn.gold{background:var(--gold);color:var(--navy-d)}
    .btn.sm{padding:6px 12px;font-size:13px}
    .pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;
      border:1px solid var(--line);background:var(--cream);color:var(--mut)}
    .pill.you{background:#fff4dd;border-color:var(--gold-d);color:#6b4e00}
    .pill.us{background:#e8f1f4;border-color:#9dc0cc;color:var(--navy)}
    .pill.out{background:#f1eef8;border-color:#c0b3dd;color:#4a3a73}
    .pill.ok{background:#e7f4ef;border-color:#8fc9b4;color:var(--green)}
    .pill.bad{background:#fbeaea;border-color:#dba9a9;color:var(--red)}
    .pill.warn{background:#fdf3dd;border-color:#d9bd79;color:var(--amber)}
    .item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;margin-bottom:8px}
    .item.done{background:#fcfdfc;border-color:#d9e8e1}
    .item .t{font-weight:600}
    .item .d{color:var(--mut);font-size:14px;margin-top:3px}
    .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
    .gate{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
    .gate.open{border-color:#8fc9b4;background:#f6fbf9}
    .gate.eligible{border-color:var(--gold-d);background:#fffdf6}
    .gate h4{font-size:15px;font-weight:700;margin-bottom:2px}
    .banner{border-radius:12px;padding:14px 16px;margin-bottom:16px;border:1px solid}
    .banner.amber{background:#fdf6e5;border-color:#d9bd79;color:#5a4300}
    .banner.info{background:#eef5f7;border-color:#9dc0cc;color:var(--navy)}
    .banner.bad{background:#fbeaea;border-color:#dba9a9;color:#6d1f1f}
    label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:4px}
    input[type=text],input[type=date],select,textarea{width:100%;border:1px solid var(--line);
      border-radius:10px;padding:9px 11px;font-family:inherit;font-size:15px;background:#fff;color:var(--ink)}
    textarea{min-height:72px;resize:vertical}
    .chk{display:flex;align-items:flex-start;gap:8px;font-weight:500;color:var(--ink);
      font-size:15px;margin-bottom:6px;cursor:pointer}
    .chk input{margin-top:4px;width:16px;height:16px;flex:0 0 auto}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
    th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
    tr.clk{cursor:pointer} tr.clk:hover{background:var(--cream)}
    .empty{color:var(--mut);padding:14px 0}
    .bar{height:8px;background:var(--cream-d);border-radius:999px;overflow:hidden;margin:8px 0}
    .bar i{display:block;height:100%;background:var(--navy)}
    .reveal{background:var(--cream);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
    .err{color:var(--red);font-size:14px;margin-top:8px;font-weight:600}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;
const API = '';

// The same token handoff every other GFC surface uses. A Bearer header never
// inlines a localStorage read (build-enforced, PR #113).
const getToken = () =>
  localStorage.getItem('portal_token') || localStorage.getItem('unified_token') || localStorage.getItem('admin_token');

const api = async (path, opts = {}) => {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${getToken()}`, ...(opts.headers || {}) }
  });
  let data = null;
  try { data = await res.json(); } catch (e) { /* empty body */ }
  if (!res.ok) {
    const err = new Error((data && data.error) || `Request failed (${res.status})`);
    err.code = data && data.code; err.status = res.status; err.data = data;
    throw err;
  }
  return data;
};

const fmtDate = (v) => {
  if (!v) return '—';
  const s = String(v);
  // A bare YYYY-MM-DD read at midday so it is the same calendar day in Georgia.
  const d = /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s + 'T12:00:00Z') : new Date(s);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
};

// ---- small shared pieces (module scope: a component declared inside another
// remounts on every keystroke and the caret dies — test/react_input_focus) ----
const Pill = ({ kind, children }) => <span className={`pill ${kind || ''}`}>{children}</span>;

// The banner over a clinician's own onboarding. It greets by first name where
// we have one, which is all this screen ever needs: everything else about them
// is what the checklist below is for.
//
// It renders on HER OWN view only. The office looking at somebody else's track
// is doing credentialing work, not being welcomed to the company.
const OnboardingHero = ({ firstName }) => (
  <div className="whero">
    <div className="img" style={{ backgroundImage: 'url(/banners/banner-clinician.jpg)' }}></div>
    <div className="scrim"></div>
    <div className="inner">
      <div className="rule"></div>
      <h1>Welcome to Godwins Family Care</h1>
      <p>
        {firstName ? `We are glad you are here, ${firstName}. ` : 'We are glad you are here. '}
        This is everything it takes to get you seeing patients, in the order it happens.
        We will tell you what is waiting on you and what is waiting on us.
      </p>
    </div>
  </div>
);

// WHO IS WAITING. The office needs the named internal owner, because that is
// how work gets chased; a clinician needs to know whether it is hers or ours,
// and "Credentialing Owner" tells her nothing she can act on. The server does
// not send her `ownerRoleLabel` at all, so the fallback IS her wording rather
// than a second rule that could drift from the first.
const OwnerPill = ({ waitingOn, waitingOnYou, ownerRoleLabel }) => {
  if (waitingOnYou) return <Pill kind="you">You</Pill>;
  if (waitingOn === 'clinician') return <Pill kind="you">Clinician</Pill>;
  if (waitingOn === 'gfc' || waitingOn === 'selfPaced') {
    return <Pill kind="us">{ownerRoleLabel || 'The office'}</Pill>;
  }
  if (waitingOn === 'outside') return <Pill kind="out">A board or contractor</Pill>;
  return null;
};

const StatusPill = ({ status }) => {
  const map = {
    complete: ['ok', 'Done'], not_applicable: ['ok', 'Not needed'],
    submitted: ['warn', 'With the office'], expired: ['bad', 'Due again'],
    waiting: ['', 'Not yet'], in_progress: ['warn', 'Started'],
    not_started: ['', 'To do']
  };
  const [k, t] = map[status] || ['', status];
  return <Pill kind={k}>{t}</Pill>;
};

const Progress = ({ done, total }) => (
  <div>
    <div className="bar"><i style={{ width: `${total ? Math.round((done / total) * 100) : 0}%` }} /></div>
    <div className="sub">{done} of {total} done</div>
  </div>
);

// ---- GATES ----------------------------------------------------------------
// A GATE. `office` is the audience; `canOpen` is a capability. They are not the
// same question and are deliberately separate props: the office reads a gate it
// is not yet allowed to sign open, and conflating the two would hand the
// clinician's wording to a credentialing screen the first time a permission
// narrowed.
const GateCard = ({ gate, onOpen, canOpen, office }) => {
  const [scope, setScope] = useState('');
  const [busy, setBusy] = useState(false);
  const cls = gate.opened ? 'gate open' : (gate.eligible ? 'gate eligible' : 'gate');
  // Gate CODES are the playbook's vocabulary and the office works in them.
  // A clinician gets the gate's own title, because "Waiting on G0 and G_MD
  // first" is a sentence about our data model, not about her week.
  const waitingOnGates = office
    ? (gate.blockedByGates || [])
    : (gate.blockedByGateTitles || gate.blockedByGates || []);
  return (
    <div className={cls}>
      <h4>{gate.title}</h4>
      <div className="sub">{gate.opens}</div>
      <div className="meta">
        {gate.opened
          ? <Pill kind="ok">Open since {fmtDate(gate.openedAt)}</Pill>
          : gate.eligible
            ? <Pill kind="warn">{office ? 'Ready to sign open' : 'Everything is in'}</Pill>
            : <Pill>Not yet</Pill>}
      </div>
      {gate.opened && gate.openedBy && (
        <div className="sub" style={{ marginTop: 6 }}>Signed open by {gate.openedBy}</div>
      )}
      {!gate.opened && gate.waitingOnSupervisor && (
        <div className="sub" style={{ marginTop: 8, color: 'var(--amber)', fontWeight: 600 }}>
          {gate.waitingOnSupervisor.reason}
        </div>
      )}
      {!gate.opened && gate.eligible && !office && (
        <div className="sub" style={{ marginTop: 6 }}>
          Nothing is waiting on you here. The office signs this one open.
        </div>
      )}
      {!gate.opened && waitingOnGates.length > 0 && (
        <div className="sub" style={{ marginTop: 6 }}>
          Waiting on {waitingOnGates.join(' and ')} first.
        </div>
      )}
      {!gate.opened && gate.blockedBy.length > 0 && (
        <details style={{ marginTop: 8 }}>
          <summary className="sub" style={{ cursor: 'pointer', fontWeight: 600 }}>
            {gate.blockedBy.length} still outstanding
          </summary>
          <div style={{ marginTop: 8 }}>
            {gate.blockedBy.map(b => (
              <div key={b.id} className="sub" style={{ padding: '3px 0' }}>
                {office && <strong>{b.id} </strong>}{b.title}{' '}
                <OwnerPill waitingOn={b.waitingOn} ownerRoleLabel={b.ownerRole} />
              </div>
            ))}
          </div>
        </details>
      )}
      {canOpen && gate.eligible && !gate.opened && (
        <div style={{ marginTop: 10 }}>
          <label>Approved scope (optional)</label>
          <textarea value={scope} onChange={e => setScope(e.target.value)}
            placeholder="What this gate approves, in your words." />
          <button className="btn gold sm" style={{ marginTop: 8 }} disabled={busy}
            onClick={async () => { setBusy(true); try { await onOpen(gate.id, scope); } finally { setBusy(false); } }}>
            Sign Gate Open
          </button>
        </div>
      )}
    </div>
  );
};

// ---- ONE CHECKLIST ITEM ---------------------------------------------------
// ONE CHECKLIST ITEM. `mode` is the AUDIENCE, not a style: the office reads
// this as a credentialing file and needs the item's id, the evidence to file
// and the gates it blocks; the clinician reads it as a thing to do. The fields
// the office-only rows draw from are not even sent to her (see forClinician in
// routes/clinicianOnboarding.js) — these guards are the second layer, so that
// a field restored to her payload still does not render as admin vocabulary.
const ItemRow = ({ row, mode, onSubmit, onRecord, onUpload }) => {
  const [open, setOpen] = useState(false);
  const [note, setNote] = useState(row.note || '');
  const [verifiedAt, setVerifiedAt] = useState(row.verifiedAt || '');
  const [source, setSource] = useState(row.verify ? row.verify.label : '');
  const [expiresAt, setExpiresAt] = useState('');
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const fileRef = useRef(null);
  const done = row.status === 'complete' || row.status === 'not_applicable';
  const office = mode === 'office';
  const hers = row.waitingOn === 'clinician' || row.owner === 'clinician' || row.owner === 'selfPaced';

  const run = async (fn) => {
    setErr(null); setBusy(true);
    try { await fn(); setOpen(false); }
    catch (e) { setErr(e.message); }
    finally { setBusy(false); }
  };

  return (
    <div className={`item${done ? ' done' : ''}`}>
      <div className="row">
        <div style={{ flex: 1 }}>
          <div className="t">
            {office && <span className="sub" style={{ fontWeight: 700 }}>{row.id}&nbsp;&nbsp;</span>}
            {row.title}
          </div>
          {row.detail && <div className="d">{row.detail}</div>}
          {office && row.proof && !done && <div className="d"><strong>Proof:</strong> {row.proof}</div>}
          <div className="meta">
            <StatusPill status={row.status} />
            {!done && <OwnerPill waitingOn={row.waitingOn} waitingOnYou={row.waitingOnYou} ownerRoleLabel={row.ownerRoleLabel} />}
            {office && (row.gates || []).length > 0 && <Pill>Blocks {row.gates.join(', ')}</Pill>}
            {office && row.verify && <Pill>Checked at {row.verify.label}</Pill>}
            {row.repeats !== 'once' && <Pill>{row.repeatsLabel}</Pill>}
            {row.dueAt && <Pill kind={row.overdue ? 'bad' : ''}>Due {fmtDate(row.dueAt)}</Pill>}
          </div>
          {done && (
            <div className="sub" style={{ marginTop: 6 }}>
              {row.verifiedAt
                ? <>Checked {fmtDate(row.verifiedAt)}{row.verifiedBy ? ` by ${row.verifiedBy}` : ''}{row.note ? ` · ${row.note}` : ''}</>
                : <>Completed {fmtDate(row.completedAt)}{row.completedBy ? ` by ${row.completedBy}` : ''}</>}
            </div>
          )}
          {row.proofFiles.length > 0 && (
            <div className="sub" style={{ marginTop: 4 }}>
              {row.proofFiles.length} file{row.proofFiles.length === 1 ? '' : 's'} attached
            </div>
          )}
          {row.blockedByItems.length > 0 && (
            <div className="sub" style={{ marginTop: 4 }}>Starts after {row.blockedByItems.join(', ')}.</div>
          )}
        </div>
        <div>
          {mode === 'clinician' && hers && !done && (
            <button className="btn sm" onClick={() => setOpen(!open)}>Mark Done</button>
          )}
          {mode === 'office' && (
            <button className="btn ghost sm" onClick={() => setOpen(!open)}>Record</button>
          )}
        </div>
      </div>

      {open && mode === 'clinician' && (
        <div style={{ marginTop: 12, borderTop: '1px solid var(--line)', paddingTop: 12 }}>
          <div className="grid two">
            <div>
              <label>Anything we should know (optional)</label>
              <input type="text" value={note} onChange={e => setNote(e.target.value)} />
            </div>
            {row.repeats === 'on_expiration' && (
              <div>
                <label>Expires</label>
                <input type="date" value={expiresAt} onChange={e => setExpiresAt(e.target.value)} />
              </div>
            )}
          </div>
          <div className="meta" style={{ marginTop: 10 }}>
            <input ref={fileRef} type="file" accept=".pdf,.jpg,.jpeg,.png" style={{ fontSize: 14 }} />
            <button className="btn ghost sm" disabled={busy}
              onClick={() => run(async () => {
                const f = fileRef.current && fileRef.current.files && fileRef.current.files[0];
                if (!f) throw new Error('Choose a file first.');
                await onUpload(row.id, f);
              })}>Attach File</button>
            <button className="btn sm" disabled={busy}
              onClick={() => run(() => onSubmit(row.id, { note, expiresAt }))}>Save</button>
          </div>
          {row.verify && (
            <div className="sub" style={{ marginTop: 8 }}>
              The office checks this against {row.verify.label}, so it will show as
              with the office until they have.
            </div>
          )}
          {err && <div className="err">{err}</div>}
        </div>
      )}

      {open && mode === 'office' && (
        <div style={{ marginTop: 12, borderTop: '1px solid var(--line)', paddingTop: 12 }}>
          <div className="grid three">
            {row.verify && (
              <>
                <div>
                  <label>Date checked</label>
                  <input type="date" value={verifiedAt} onChange={e => setVerifiedAt(e.target.value)} />
                </div>
                <div>
                  <label>Source checked</label>
                  <input type="text" value={source} onChange={e => setSource(e.target.value)}
                    placeholder={row.verify.label} />
                </div>
              </>
            )}
            {row.repeats === 'on_expiration' && (
              <div>
                <label>Expires</label>
                <input type="date" value={expiresAt} onChange={e => setExpiresAt(e.target.value)} />
              </div>
            )}
          </div>
          <div style={{ marginTop: 10 }}>
            <label>Note</label>
            <input type="text" value={note} onChange={e => setNote(e.target.value)} />
          </div>
          {row.verify && row.verify.url && (
            <div className="sub" style={{ marginTop: 8 }}>
              <a href={row.verify.url} target="_blank" rel="noopener noreferrer">
                Open {row.verify.label}
              </a> in a new tab, then record what you saw. The app does not check it for you.
            </div>
          )}
          <div className="meta" style={{ marginTop: 10 }}>
            <button className="btn sm" disabled={busy}
              onClick={() => run(() => onRecord(row.id, { status: 'complete', verifiedAt, source, note, expiresAt }))}>
              Mark Verified
            </button>
            <button className="btn ghost sm" disabled={busy}
              onClick={() => run(() => onRecord(row.id, { status: 'submitted', note }))}>
              Waiting On Us
            </button>
            <button className="btn ghost sm" disabled={busy}
              onClick={() => run(() => onRecord(row.id, { status: 'not_applicable', note }))}>
              Not Needed
            </button>
            <button className="btn ghost sm" disabled={busy}
              onClick={() => run(() => onRecord(row.id, { status: 'not_started', note }))}>
              Reopen
            </button>
          </div>
          {err && <div className="err">{err}</div>}
        </div>
      )}
    </div>
  );
};

// ---- CHECKLIST ------------------------------------------------------------
const Checklist = ({ track, mode, onSubmit, onRecord, onUpload }) => {
  const [filter, setFilter] = useState(mode === 'clinician' ? 'mine' : 'open');
  const rows = track.rows.filter(r => {
    if (filter === 'mine') return r.waitingOn === 'clinician' && r.status !== 'complete' && r.status !== 'not_applicable';
    if (filter === 'us') return (r.waitingOn === 'gfc' || r.waitingOn === 'selfPaced') && r.status !== 'complete' && r.status !== 'not_applicable';
    if (filter === 'open') return r.status !== 'complete' && r.status !== 'not_applicable';
    if (filter === 'done') return r.status === 'complete' || r.status === 'not_applicable';
    return true;
  });
  const blocks = [];
  rows.forEach(r => {
    let b = blocks.find(x => x.block === r.block);
    if (!b) { b = { block: r.block, title: r.blockTitle, rows: [] }; blocks.push(b); }
    b.rows.push(r);
  });
  const btn = (k, label) => (
    <button key={k} className={`tab${filter === k ? ' on' : ''}`} onClick={() => setFilter(k)}>{label}</button>
  );
  return (
    <div>
      <div className="tabs">
        {mode === 'clinician' && btn('mine', `Yours (${track.counts.waitingOnClinician})`)}
        {btn('open', `Outstanding (${track.counts.total - track.counts.done})`)}
        {mode === 'office' && btn('us', `Ours (${track.counts.waitingOnGfc})`)}
        {btn('done', `Done (${track.counts.done})`)}
        {btn('all', `Everything (${track.counts.total})`)}
      </div>
      {blocks.length === 0 && <div className="empty">Nothing here. </div>}
      {blocks.map(b => (
        <div key={b.block} className="card">
          <h3>{b.title}</h3>
          {b.rows.map(r => (
            <ItemRow key={r.id} row={r} mode={mode}
              onSubmit={onSubmit} onRecord={onRecord} onUpload={onUpload} />
          ))}
        </div>
      ))}
    </div>
  );
};

// ---- DOCUMENTS ------------------------------------------------------------
const DocRow = ({ res, onSign, onNoAccess }) => {
  const [name, setName] = useState('');
  const [open, setOpen] = useState(false);
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const signable = ['SIGN', 'ACKNOWLEDGE', 'ATTEST_WITH_CHECKS'].includes(res.action);
  return (
    <div className={`item${res.signedAt && !res.stale ? ' done' : ''}`}>
      <div className="row">
        <div style={{ flex: 1 }}>
          <div className="t">{res.title} <span className="sub">{res.version}</span></div>
          <div className="d">{res.actionLabel}</div>
          {res.note && <div className="d" style={{ color: 'var(--amber)' }}>{res.note}</div>}
          <div className="meta">
            {!res.available && <Pill kind="bad">Cannot open</Pill>}
            {res.signedAt && !res.stale && <Pill kind="ok">Signed {fmtDate(res.signedAt)}</Pill>}
            {res.stale && res.signedAt && <Pill kind="warn">New version — sign again</Pill>}
            {res.required && !res.signedAt && signable && <Pill kind="warn">Needs your signature</Pill>}
            {res.countersign && <Pill>Countersigned by the Clinical Director</Pill>}
          </div>
          {!res.available && <div className="sub" style={{ marginTop: 6 }}>{res.unavailableMessage}</div>}
        </div>
        <div className="meta" style={{ marginTop: 0 }}>
          {res.url && <a className="btn ghost sm" href={res.url} target="_blank" rel="noopener noreferrer">Open</a>}
          {signable && res.available && (!res.signedAt || res.stale) && (
            <button className="btn sm" onClick={() => setOpen(!open)}>Sign</button>
          )}
        </div>
      </div>
      {open && (
        <div style={{ marginTop: 12, borderTop: '1px solid var(--line)', paddingTop: 12 }}>
          <label>Type your full name to sign</label>
          <input type="text" value={name} onChange={e => setName(e.target.value)} />
          <div className="sub" style={{ marginTop: 6 }}>
            Your signature records that you signed {res.title} version {res.version}.
          </div>
          <div className="meta" style={{ marginTop: 10 }}>
            <button className="btn sm" disabled={busy || !name.trim()}
              onClick={async () => {
                setErr(null); setBusy(true);
                try { await onSign(res.id, name); setOpen(false); }
                catch (e) { setErr(e.message); } finally { setBusy(false); }
              }}>Sign It</button>
            <button className="btn ghost sm" onClick={() => onNoAccess(res.id)}>It Will Not Open</button>
          </div>
          {err && <div className="err">{err}</div>}
        </div>
      )}
    </div>
  );
};

// ---- TRAINING -------------------------------------------------------------
// A TRAINING MODULE, AS THE CLINICIAN SEES IT. This card renders on her own
// screen only — the office reads training as a table in OfficeDetail, which is
// where the "check questions not written" backlog belongs. So nothing here
// needs a mode: anything the office alone cares about simply is not drawn.
const ModuleCard = ({ mod, onComplete }) => {
  const [open, setOpen] = useState(false);
  const [shown, setShown] = useState({});
  const [scored, setScored] = useState({});
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const allScored = (mod.checkCount === 0) || Object.keys(scored).length >= mod.checkCount;
  return (
    <div className={`item${mod.status === 'complete' ? ' done' : ''}`}>
      <div className="row">
        <div style={{ flex: 1 }}>
          <div className="t">{mod.title}</div>
          {mod.detail && <div className="d">{mod.detail}</div>}
          <div className="meta">
            <Pill>{mod.formatLabel}</Pill>
            {mod.minutes && <Pill>{mod.minutes >= 120 ? `${Math.round(mod.minutes / 60)} hours` : `${mod.minutes} min`}</Pill>}
            <Pill>{mod.signoffLabel}</Pill>
            {mod.status === 'complete' && <Pill kind="ok">Done {fmtDate(mod.completedAt)}</Pill>}
            {mod.status === 'redo' && <Pill kind="warn">Review this again</Pill>}
            {mod.locked && <Pill>Locked</Pill>}
          </div>
        </div>
        <div>
          {!mod.locked && mod.status !== 'complete' && (
            <button className="btn sm" onClick={() => setOpen(!open)}>Start</button>
          )}
        </div>
      </div>
      {open && (
        <div style={{ marginTop: 12, borderTop: '1px solid var(--line)', paddingTop: 12 }}>
          {mod.checkCount === 0 && (
            <div className="sub">
              Nothing to answer on this one. Work through it, then mark it done.
            </div>
          )}
          {(mod.checks || []).map((c, i) => (
            <div key={i} style={{ marginBottom: 12 }}>
              <div style={{ fontWeight: 600 }}>{c.prompt}</div>
              {!shown[i] && (
                <button className="btn ghost sm" style={{ marginTop: 6 }}
                  onClick={() => setShown({ ...shown, [i]: true })}>Show The Answer</button>
              )}
              {shown[i] && (
                <div className="reveal">
                  <div>{c.answer}</div>
                  <div className="sub" style={{ marginTop: 4 }}>{c.source}</div>
                  <div className="meta">
                    <button className={`btn sm${scored[i] === true ? '' : ' ghost'}`}
                      onClick={() => setScored({ ...scored, [i]: true })}>I Had That</button>
                    <button className={`btn sm${scored[i] === false ? '' : ' ghost'}`}
                      onClick={() => setScored({ ...scored, [i]: false })}>I Did Not</button>
                  </div>
                </div>
              )}
            </div>
          ))}
          <button className="btn" disabled={busy || !allScored}
            onClick={async () => {
              setErr(null); setBusy(true);
              try {
                await onComplete(mod.id, (mod.checks || []).map((c, i) => ({
                  prompt: c.prompt, correct: scored[i] === true
                })));
                setOpen(false);
              } catch (e) { setErr(e.message); } finally { setBusy(false); }
            }}>Mark Module Done</button>
          {!allScored && <div className="sub" style={{ marginTop: 6 }}>Answer each question first.</div>}
          {err && <div className="err">{err}</div>}
        </div>
      )}
    </div>
  );
};

const RecheckCard = ({ due, onAnswer }) => {
  const [shown, setShown] = useState(false);
  return (
    <div className="item">
      <div className="t">{due.moduleTitle}</div>
      <div className="sub">Day {due.day} check-back</div>
      {(due.checks || []).slice(0, 1).map((c, i) => (
        <div key={i} style={{ marginTop: 8 }}>
          <div style={{ fontWeight: 600 }}>{c.prompt}</div>
          {!shown && <button className="btn ghost sm" style={{ marginTop: 6 }}
            onClick={() => setShown(true)}>Show The Answer</button>}
          {shown && (
            <div className="reveal">
              <div>{c.answer}</div>
              <div className="sub" style={{ marginTop: 4 }}>{c.source}</div>
              <div className="meta">
                <button className="btn sm" onClick={() => onAnswer(due.moduleId, due.day, true)}>I Had That</button>
                <button className="btn ghost sm" onClick={() => onAnswer(due.moduleId, due.day, false)}>I Did Not</button>
              </div>
              <div className="sub" style={{ marginTop: 6 }}>
                Saying you missed it puts the module back on your list. That is the point of it.
              </div>
            </div>
          )}
        </div>
      ))}
    </div>
  );
};

// ---- PRIVILEGES -----------------------------------------------------------
const PrivilegeList = ({ priv, meta, inputs, mode, onGenerate, onDecide, onCoSign }) => {
  const [allow, setAllow] = useState({});
  const [version, setVersion] = useState('');
  const [reasons, setReasons] = useState({});
  const [coName, setCoName] = useState('');
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const applicable = [];
  (meta.privilegeCategories || []).forEach(c => {
    (c.privileges || []).forEach(p => {
      const needAddon = p.requiresAddon || c.requiresAddon;
      const needLane = p.requiresLane || c.requiresLane;
      if (needAddon && !(inputs.addons || []).includes(needAddon)) return;
      if (needLane && !(inputs.lanes || []).includes(needLane)) return;
      applicable.push({ ...p, category: c.id, categoryTitle: c.title });
    });
  });

  if (!priv.exists) {
    if (mode !== 'office') {
      return <div className="card"><h3>Privileges</h3><div className="empty">
        Your privilege list is drawn up from your protocol agreement once it is on file.
      </div></div>;
    }
    return (
      <div className="card">
        <h3>Privileges</h3>
        <div className="sub" style={{ marginBottom: 10 }}>
          Tick what the protocol agreement allows. The list is generated at that full
          scope and can then be narrowed, never widened. Nothing reads the agreement
          for you, because a wrong guess here grants something no physician agreed to.
        </div>
        <div>
          <label>Protocol agreement version</label>
          <input type="text" value={version} onChange={e => setVersion(e.target.value)}
            placeholder="e.g. 2026-11 executed" />
        </div>
        <div style={{ marginTop: 12 }}>
          {(meta.privilegeCategories || []).map(c => {
            const rows = applicable.filter(p => p.category === c.id);
            if (!rows.length) return null;
            return (
              <div key={c.id} style={{ marginBottom: 12 }}>
                <div style={{ fontWeight: 700, fontSize: 14 }}>{c.title}</div>
                {rows.map(p => (
                  <label key={p.id} className="chk">
                    <input type="checkbox" checked={!!allow[p.id]}
                      onChange={e => setAllow({ ...allow, [p.id]: e.target.checked })} />
                    <span>{p.title}{p.defaultNotGranted ? ' (withheld by default)' : ''}</span>
                  </label>
                ))}
              </div>
            );
          })}
        </div>
        <button className="btn" disabled={busy}
          onClick={async () => {
            setErr(null); setBusy(true);
            try {
              await onGenerate(Object.keys(allow).filter(k => allow[k]), version);
            } catch (e) { setErr(e.message); } finally { setBusy(false); }
          }}>Generate Privilege List</button>
        {err && <div className="err">{err}</div>}
      </div>
    );
  }

  return (
    <div className="card">
      <h3>Privileges</h3>
      <div className="meta">
        <Pill kind="ok">{priv.counts.granted} granted</Pill>
        <Pill kind="warn">{priv.counts.narrowed} narrowed</Pill>
        <Pill>{priv.counts.notInAgreement} not in the agreement</Pill>
        {priv.coSignedAt
          ? <Pill kind="ok">Co-signed {fmtDate(priv.coSignedAt)} by {priv.coSignedBy}</Pill>
          : <Pill kind="warn">Not co-signed</Pill>}
        {priv.review.review && <Pill kind="bad">Needs review</Pill>}
      </div>
      {priv.agreement && (
        <div className="sub" style={{ marginTop: 6 }}>
          Mapped from protocol agreement {priv.agreement.version} on {fmtDate(priv.agreement.mappedAt)}
          {priv.agreement.mappedByName ? ` by ${priv.agreement.mappedByName}` : ''}.
        </div>
      )}
      <div className="sub" style={{ marginTop: 6 }}>
        Focused review: the first {priv.focusedReview.days} days, or the first
        {' '}{priv.focusedReview.encountersPerPrivilege} encounters on any new privilege.
      </div>
      {(priv.byCategory || []).map(c => (
        <div key={c.id} style={{ marginTop: 14 }}>
          <div style={{ fontWeight: 700, fontSize: 14 }}>{c.title}</div>
          {c.rows.map(r => (
            <div key={r.id} className="item" style={{ marginTop: 6 }}>
              <div className="row">
                <div style={{ flex: 1 }}>
                  <div className="t">{r.title}</div>
                  <div className="meta">
                    {r.status === 'granted' && <Pill kind="ok">Granted</Pill>}
                    {r.status === 'narrowed' && <Pill kind="warn">Withheld</Pill>}
                    {r.status === 'not_in_agreement' && <Pill>Not in the agreement</Pill>}
                  </div>
                  {r.reason && <div className="d">{r.reason}</div>}
                </div>
                {mode === 'office' && !priv.coSignedAt && r.status !== 'not_in_agreement' && (
                  <div style={{ minWidth: 220 }}>
                    {r.status === 'granted' ? (
                      <>
                        <input type="text" placeholder="Why withhold it?"
                          value={reasons[r.id] || ''}
                          onChange={e => setReasons({ ...reasons, [r.id]: e.target.value })} />
                        <button className="btn ghost sm" style={{ marginTop: 6 }}
                          onClick={() => onDecide(r.id, 'narrowed', reasons[r.id] || '')}>Withhold</button>
                      </>
                    ) : (
                      <button className="btn ghost sm"
                        onClick={() => onDecide(r.id, 'granted', '')}>Grant</button>
                    )}
                  </div>
                )}
              </div>
            </div>
          ))}
        </div>
      ))}
      {mode === 'office' && !priv.coSignedAt && priv.reviewedAt && (
        <div style={{ marginTop: 16, borderTop: '1px solid var(--line)', paddingTop: 12 }}>
          <label>Supervising physician co-signature — type the full name</label>
          <input type="text" value={coName} onChange={e => setCoName(e.target.value)} />
          <button className="btn gold" style={{ marginTop: 8 }} disabled={!coName.trim()}
            onClick={() => onCoSign(coName)}>Co-Sign The List</button>
        </div>
      )}
      {mode === 'office' && !priv.reviewedAt && (
        <div className="sub" style={{ marginTop: 12 }}>
          The Clinical Director reviews the list before it can be co-signed.
        </div>
      )}
    </div>
  );
};

// ---- THE CLINICIAN'S OWN WIZARD -------------------------------------------
const MyWizard = ({ data, meta, reload, firstName }) => {
  const [tab, setTab] = useState('now');
  const { track, training, resources, privileges } = data;

  const submitItem = async (id, body) => {
    const d = await api(`/api/clinician-onboarding/me/items/${id}`, { method: 'PUT', body: JSON.stringify(body) });
    reload(d);
  };
  const uploadProof = async (id, file) => {
    const fd = new FormData(); fd.append('file', file);
    const res = await fetch(`/api/clinician-onboarding/me/items/${id}/proof`, {
      method: 'POST', headers: { Authorization: `Bearer ${getToken()}` }, body: fd
    });
    const d = await res.json();
    if (!res.ok) throw new Error(d && d.error ? d.error : 'Upload failed.');
    reload(d);
  };
  const sign = async (resId, typedName) => {
    const d = await api(`/api/clinician-onboarding/me/resources/${resId}/sign`,
      { method: 'POST', body: JSON.stringify({ typedName }) });
    reload(d);
  };
  const noAccess = async (resId) => {
    const d = await api(`/api/clinician-onboarding/me/resources/${resId}/no-access`, { method: 'POST' });
    reload(d);
  };
  const completeModule = async (id, answers) => {
    const d = await api(`/api/clinician-onboarding/me/training/${id}`,
      { method: 'PUT', body: JSON.stringify({ answers }) });
    reload(d);
  };
  const answerRecheck = async (id, day, correct) => {
    const d = await api(`/api/clinician-onboarding/me/training/${id}/recheck`,
      { method: 'POST', body: JSON.stringify({ day, correct }) });
    reload(d);
  };

  if (!track.defined.defined) {
    return (
      <div>
        <OnboardingHero firstName={firstName} />
        <div className="card" style={{ marginTop: 20 }}>
        <div className="banner info">
          {track.defined.message} The office sets this up, and your checklist appears
          here as soon as they have. Nothing is waiting on you yet.
        </div>
        </div>
      </div>
    );
  }

  const openGate = Object.values(track.gates).find(g => g.opened);
  return (
    <div>
      <OnboardingHero firstName={firstName} />
      <div className="card" style={{ marginTop: 20 }}>
        <h2>Your onboarding</h2>
        <div className="sub">
          {track.counts.waitingOnClinician} waiting on you · {track.counts.waitingOnGfc} with the
          office · {track.counts.waitingOnOutside} with a board or contractor
        </div>
        <Progress done={track.counts.done} total={track.counts.total} />
        {track.counts.expired > 0 && (
          <div className="banner bad" style={{ marginTop: 12 }}>
            {track.counts.expired} thing{track.counts.expired === 1 ? '' : 's'} on your file
            {track.counts.expired === 1 ? ' has' : ' have'} come round again.
          </div>
        )}
      </div>

      <div className="card">
        <h3>What unlocks when</h3>
        <div className="grid two" style={{ marginTop: 10 }}>
          {Object.values(track.gates).map(g => <GateCard key={g.id} gate={g} canOpen={false} office={false} />)}
        </div>
        {data.supervisor && (
          <div className="sub" style={{ marginTop: 12 }}>
            Your supervising physician is {data.supervisor.name || 'not set yet'}
            {data.supervisor.physicianReady ? ' and is signed off.' : ' and is not signed off yet.'}
          </div>
        )}
      </div>

      <div className="tabs">
        <button className={`tab${tab === 'now' ? ' on' : ''}`} onClick={() => setTab('now')}>Up Next</button>
        <button className={`tab${tab === 'list' ? ' on' : ''}`} onClick={() => setTab('list')}>Checklist</button>
        <button className={`tab${tab === 'train' ? ' on' : ''}`} onClick={() => setTab('train')}>Training</button>
        <button className={`tab${tab === 'docs' ? ' on' : ''}`} onClick={() => setTab('docs')}>Documents</button>
        <button className={`tab${tab === 'priv' ? ' on' : ''}`} onClick={() => setTab('priv')}>Privileges</button>
      </div>

      {tab === 'now' && (
        <div>
          {training.rechecksDue.length > 0 && (
            <div className="card">
              <h3>Quick check-back</h3>
              <div className="sub">One or two questions from something you have already done.</div>
              <div style={{ marginTop: 10 }}>
                {training.rechecksDue.map(d => (
                  <RecheckCard key={d.moduleId + d.day} due={d} onAnswer={answerRecheck} />
                ))}
              </div>
            </div>
          )}
          <div className="card">
            <h3>Waiting on you</h3>
            {track.rows.filter(r => r.waitingOnYou && r.status !== 'complete').slice(0, 6).length === 0
              ? <div className="empty">Nothing right now. </div>
              : track.rows.filter(r => r.waitingOnYou && r.status !== 'complete').slice(0, 6).map(r => (
                <ItemRow key={r.id} row={r} mode="clinician"
                  onSubmit={submitItem} onUpload={uploadProof} />
              ))}
          </div>
          <div className="card">
            <h3>Next training</h3>
            {training.upNext.length === 0
              ? <div className="empty">Nothing queued.</div>
              : training.upNext.map(m => <ModuleCard key={m.id} mod={m} onComplete={completeModule} />)}
          </div>
          <div className="card">
            <h3>With the office</h3>
            <div className="sub">Nothing for you to do here. It is listed so you can see it is moving.</div>
            <div style={{ marginTop: 10 }}>
              {track.rows.filter(r => (r.waitingOn === 'gfc' || r.waitingOn === 'outside')
                && r.status !== 'complete').slice(0, 8).map(r => (
                <div key={r.id} className="item">
                  <div className="t">{r.title}</div>
                  <div className="meta">
                    <OwnerPill waitingOn={r.waitingOn} ownerRoleLabel={r.ownerRoleLabel} />
                    <StatusPill status={r.status} />
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {tab === 'list' && <Checklist track={track} mode="clinician"
        onSubmit={submitItem} onUpload={uploadProof} />}

      {tab === 'train' && (
        <div>
          {training.byPhase.map(p => (
            <div key={p.phase} className="card">
              <h3>{p.title}</h3>
              <div className="sub">{p.when}</div>
              <div style={{ marginTop: 10 }}>
                {p.modules.map(m => <ModuleCard key={m.id} mod={m} onComplete={completeModule} />)}
              </div>
            </div>
          ))}
        </div>
      )}

      {tab === 'docs' && (
        <div>
          {resources.byStep.map(s => (
            <div key={s.step} className="card">
              <h3>{s.title}</h3>
              {s.resources.map(r => (
                <DocRow key={r.id} res={r} onSign={sign} onNoAccess={noAccess} />
              ))}
            </div>
          ))}
        </div>
      )}

      {tab === 'priv' && <PrivilegeList priv={privileges} meta={meta}
        inputs={track.inputs} mode="clinician" />}
    </div>
  );
};

// ---- THE OFFICE -----------------------------------------------------------
const InputsForm = ({ inputs, meta, candidates, onSave }) => {
  const [v, setV] = useState({
    roles: inputs.roles || [], relationship: inputs.relationship || '',
    lanes: inputs.lanes || [], addons: inputs.addons || [],
    contractors: (inputs.contractors || []).join(', '),
    payers: (inputs.payers || []).map(p => `${p.id}:${p.name}`).join(', '),
    supervisorUserId: inputs.supervisorUserId || ''
  });
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const toggle = (key, val) => setV(s => ({
    ...s, [key]: s[key].includes(val) ? s[key].filter(x => x !== val) : s[key].concat([val])
  }));
  const isNp = v.roles.includes('NP');
  return (
    <div className="card">
      <h3>The four things that build this track</h3>
      <div className="sub">
        Change one and the checklist is rebuilt. Items already completed stay in the
        record; open items from something you untick disappear.
      </div>
      <div className="grid two" style={{ marginTop: 14 }}>
        <div>
          <label>What are they?</label>
          {(meta.roles || []).map(r => (
            <label key={r.value} className="chk">
              <input type="checkbox" checked={v.roles.includes(r.value)}
                onChange={() => toggle('roles', r.value)} />
              <span>{r.label}</span>
            </label>
          ))}
        </div>
        <div>
          <label>How are they paid?</label>
          <select value={v.relationship} onChange={e => setV({ ...v, relationship: e.target.value })}>
            <option value="">Choose one</option>
            {(meta.relationships || []).map(r => <option key={r.value} value={r.value}>{r.label}</option>)}
          </select>
          {isNp && (
            <div style={{ marginTop: 14 }}>
              <label>What work do they do?</label>
              {(meta.lanes || []).map(l => (
                <label key={l.value} className="chk">
                  <input type="checkbox" checked={v.lanes.includes(l.value)}
                    onChange={() => toggle('lanes', l.value)} />
                  <span>{l.label}</span>
                </label>
              ))}
            </div>
          )}
        </div>
      </div>
      <div style={{ marginTop: 14 }}>
        <label>Anything extra?</label>
        <div className="grid two">
          {(meta.addons || []).map(a => (
            <label key={a.value} className="chk">
              <input type="checkbox" checked={v.addons.includes(a.value)}
                onChange={() => toggle('addons', a.value)} />
              <span>{a.label}</span>
            </label>
          ))}
        </div>
      </div>
      <div className="grid two" style={{ marginTop: 14 }}>
        <div>
          <label>Supervising physician</label>
          <select value={v.supervisorUserId}
            onChange={e => setV({ ...v, supervisorUserId: e.target.value })}>
            <option value="">Not set</option>
            {(candidates || []).map(c => <option key={c.userId} value={c.userId}>{c.name}</option>)}
          </select>
          <div className="sub" style={{ marginTop: 4 }}>
            Patient visits stay locked until this physician is signed off.
          </div>
        </div>
        <div>
          <label>Exam contractors (comma separated codes)</label>
          <input type="text" value={v.contractors}
            onChange={e => setV({ ...v, contractors: e.target.value })} placeholder="VES, LSGS" />
          <div style={{ marginTop: 10 }}>
            <label>Payers (id:name, comma separated)</label>
            <input type="text" value={v.payers}
              onChange={e => setV({ ...v, payers: e.target.value })}
              placeholder="medicare:Original Medicare" />
          </div>
        </div>
      </div>
      <button className="btn" style={{ marginTop: 14 }} disabled={busy}
        onClick={async () => {
          setErr(null); setBusy(true);
          try {
            await onSave({
              roles: v.roles, relationship: v.relationship || null,
              lanes: v.lanes, addons: v.addons,
              contractors: v.contractors.split(',').map(s => s.trim()).filter(Boolean),
              payers: v.payers.split(',').map(s => s.trim()).filter(Boolean).map(s => {
                const [id, ...rest] = s.split(':');
                return { id: id.trim(), name: (rest.join(':') || id).trim() };
              }),
              supervisorUserId: v.supervisorUserId || null
            });
          } catch (e) { setErr(e.message); } finally { setBusy(false); }
        }}>Save Track</button>
      {err && <div className="err">{err}</div>}
    </div>
  );
};

// The append-only credentialing record: who signed a gate open, what had
// cleared at the time, who verified what against which source. The playbook
// calls the gate-opening record the credentialing committee decision, so it
// needs somewhere a person can actually read it.
const EVENT_LABELS = {
  inputs_changed: 'Track settings changed',
  item_recorded: 'Item recorded',
  gate_opened: 'Gate signed open',
  payer_gate_opened: 'Payer billing opened',
  privileges_generated: 'Privilege list generated',
  privilege_decided: 'Privilege decided',
  privileges_co_signed: 'Privilege list co-signed'
};

const CredentialingHistory = ({ userId }) => {
  const [events, setEvents] = useState(null);
  const [err, setErr] = useState(null);
  useEffect(() => {
    let live = true;
    api(`/api/clinician-onboarding/admin/${userId}/events`)
      .then(d => { if (live) setEvents(d.events || []); })
      .catch(e => { if (live) setErr(e.message); });
    return () => { live = false; };
  }, [userId]);
  if (err) return <div className="card"><div className="banner bad">{err}</div></div>;
  if (!events) return <div className="card"><div className="empty">Loading…</div></div>;
  return (
    <div className="card">
      <h3>Credentialing history</h3>
      <div className="sub">
        Append-only. Every gate signed open carries who signed it and what had
        cleared at the time, which is the record an auditor asks for.
      </div>
      {events.length === 0
        ? <div className="empty">Nothing recorded yet.</div>
        : <table style={{ marginTop: 10 }}>
            <thead><tr><th>When</th><th>What</th><th>Who</th><th>Detail</th></tr></thead>
            <tbody>
              {events.map(e => (
                <tr key={e.id}>
                  <td>{fmtDate(e.at)}</td>
                  <td>{EVENT_LABELS[e.type] || e.type}</td>
                  <td>{e.byName || '—'}</td>
                  <td>
                    {e.gateId && <Pill>{e.gateId}</Pill>}
                    {e.itemId && <Pill>{e.itemId}</Pill>}
                    {e.privilegeId && <Pill>{e.privilegeId}</Pill>}
                    {e.payerId && <Pill>{e.payerId}</Pill>}
                    {e.source && <> checked at {e.source}</>}
                    {e.verifiedAt && <> on {fmtDate(e.verifiedAt)}</>}
                    {e.status && <> — {e.status}</>}
                    {e.agreementVersion && <> from agreement {e.agreementVersion}</>}
                    {Array.isArray(e.cleared) && e.cleared.length > 0 && (
                      <div className="sub">{e.cleared.length} items had cleared</div>
                    )}
                    {e.scope && <div className="sub">Scope: {e.scope}</div>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>}
    </div>
  );
};

const OfficeDetail = ({ userId, meta, onBack }) => {
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  const [tab, setTab] = useState('list');
  const load = useCallback(async () => {
    try { setData(await api(`/api/clinician-onboarding/admin/${userId}`)); }
    catch (e) { setErr(e.message); }
  }, [userId]);
  useEffect(() => { load(); }, [load]);

  if (err) return <div className="banner bad">{err}</div>;
  if (!data) return <div className="card"><div className="empty">Loading…</div></div>;
  const { track, training, resources, privileges } = data;

  const saveInputs = async (body) => setData(await api(
    `/api/clinician-onboarding/admin/${userId}/inputs`, { method: 'PUT', body: JSON.stringify(body) }));
  const record = async (id, body) => setData(await api(
    `/api/clinician-onboarding/admin/${userId}/items/${id}`, { method: 'PUT', body: JSON.stringify(body) }));
  const openGate = async (gateId, scope) => setData(await api(
    `/api/clinician-onboarding/admin/${userId}/gates/${gateId}/open`,
    { method: 'POST', body: JSON.stringify({ scope }) }));
  const generatePriv = async (allowances, agreementVersion) => setData(await api(
    `/api/clinician-onboarding/admin/${userId}/privileges/generate`,
    { method: 'POST', body: JSON.stringify({ allowances, agreementVersion }) }));
  const decide = async (privilegeId, status, reason) => setData(await api(
    `/api/clinician-onboarding/admin/${userId}/privileges/${privilegeId}`,
    { method: 'PUT', body: JSON.stringify({ status, reason }) }));
  const coSign = async (typedName) => setData(await api(
    `/api/clinician-onboarding/admin/${userId}/privileges/co-sign`,
    { method: 'POST', body: JSON.stringify({ typedName }) }));

  return (
    <div>
      <button className="btn ghost sm" onClick={onBack}>Back To Roster</button>
      <div className="card" style={{ marginTop: 12 }}>
        <h2>{data.userName}</h2>
        {track.defined.defined
          ? <><div className="sub">{track.counts.done} of {track.counts.total} done ·
            {' '}{track.counts.waitingOnGfc} with us · {track.counts.waitingOnClinician} with them</div>
            <Progress done={track.counts.done} total={track.counts.total} /></>
          : <div className="banner amber" style={{ marginTop: 10 }}>{track.defined.message}</div>}
      </div>

      <InputsForm inputs={track.inputs} meta={meta}
        candidates={data.supervisorCandidates} onSave={saveInputs} />

      {track.defined.defined && (
        <div className="card">
          <h3>Gates</h3>
          <div className="sub">
            A gate opens when a person signs it open. The signature, what had cleared
            and the approved scope are the credentialing record.
          </div>
          <div className="grid two" style={{ marginTop: 12 }}>
            {Object.values(track.gates).map(g => (
              <GateCard key={g.id} gate={g} canOpen office onOpen={openGate} />
            ))}
          </div>
          {(data.payerGates || []).length > 0 && (
            <div style={{ marginTop: 14 }}>
              <h3>Billing, one payer at a time</h3>
              {data.payerGates.map(p => (
                <div key={p.payerId} className="item">
                  <div className="row">
                    <div style={{ flex: 1 }}>
                      <div className="t">{p.payerName}</div>
                      <div className="meta">
                        {p.opened ? <Pill kind="ok">Open {fmtDate(p.openedAt)}</Pill>
                          : p.eligible ? <Pill kind="warn">Ready</Pill> : <Pill>Not yet</Pill>}
                        {p.blockedBy.map(b => <Pill key={b.id}>{b.id}</Pill>)}
                      </div>
                    </div>
                    {p.eligible && !p.opened && (
                      <button className="btn gold sm" onClick={async () => setData(await api(
                        `/api/clinician-onboarding/admin/${userId}/payer-gates/${p.payerId}/open`,
                        { method: 'POST', body: JSON.stringify({}) }))}>Open</button>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {track.defined.defined && (
        <>
          <div className="tabs">
            <button className={`tab${tab === 'list' ? ' on' : ''}`} onClick={() => setTab('list')}>Checklist</button>
            <button className={`tab${tab === 'priv' ? ' on' : ''}`} onClick={() => setTab('priv')}>Privileges</button>
            <button className={`tab${tab === 'train' ? ' on' : ''}`} onClick={() => setTab('train')}>Training</button>
            <button className={`tab${tab === 'docs' ? ' on' : ''}`} onClick={() => setTab('docs')}>Documents</button>
            <button className={`tab${tab === 'due' ? ' on' : ''}`} onClick={() => setTab('due')}>Keeping Current</button>
            <button className={`tab${tab === 'history' ? ' on' : ''}`} onClick={() => setTab('history')}>History</button>
          </div>
          {tab === 'list' && <Checklist track={track} mode="office" onRecord={record} />}
          {tab === 'priv' && <PrivilegeList priv={privileges} meta={meta} inputs={track.inputs}
            mode="office" onGenerate={generatePriv} onDecide={decide} onCoSign={coSign} />}
          {tab === 'train' && (
            <div className="card">
              <h3>Training</h3>
              <div className="sub">
                {training.counts.complete} of {training.counts.total} done.
                {training.counts.checksMissing > 0 &&
                  ` ${training.counts.checksMissing} modules still need their check questions written.`}
              </div>
              <table style={{ marginTop: 10 }}>
                <thead><tr><th>Module</th><th>Phase</th><th>Status</th><th>Questions</th></tr></thead>
                <tbody>
                  {training.rows.map(m => (
                    <tr key={m.id}>
                      <td><strong>{m.id}</strong> {m.title}</td>
                      <td>{m.phaseTitle}</td>
                      <td>{m.status === 'complete'
                        ? `Done ${fmtDate(m.completedAt)}${m.score !== null ? ` · ${m.score}%` : ''}`
                        : m.status}</td>
                      <td>{m.checksMissing ? <Pill kind="warn">Not written</Pill> : m.checkCount}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
          {tab === 'docs' && (
            <div className="card">
              <h3>Documents</h3>
              {resources.counts.unavailable > 0 && (
                <div className="banner amber">
                  {resources.counts.unavailable} document{resources.counts.unavailable === 1 ? '' : 's'}
                  {' '}cannot be opened. Share it in Drive, or upload it if it is not there yet.
                </div>
              )}
              <table>
                <thead><tr><th>Document</th><th>Version</th><th>Signed</th></tr></thead>
                <tbody>
                  {resources.rows.map(r => (
                    <tr key={r.id}>
                      <td>{r.title}{!r.available && <> <Pill kind="bad">Cannot open</Pill></>}</td>
                      <td>{r.version}</td>
                      <td>{r.signedAt ? fmtDate(r.signedAt) : '—'}
                        {r.stale && <> <Pill kind="warn">Old version</Pill></>}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
          {tab === 'history' && <CredentialingHistory userId={userId} />}
          {tab === 'due' && (
            <div className="card">
              <h3>Keeping current</h3>
              {!data.ongoing.active
                ? <div className="empty">
                    Nothing is on a clock yet. The recurring schedule starts once the
                    first gate is signed open.
                  </div>
                : <table>
                    <thead><tr><th>Item</th><th>How often</th><th>Due</th></tr></thead>
                    <tbody>
                      {data.ongoing.items.map(i => (
                        <tr key={i.id}>
                          <td><strong>{i.id}</strong> {i.title}</td>
                          <td>{i.repeatsLabel}</td>
                          <td>{fmtDate(i.dueAt)}{' '}
                            {i.overdue ? <Pill kind="bad">Overdue</Pill>
                              : i.daysUntilDue <= 30 ? <Pill kind="warn">{i.daysUntilDue} days</Pill> : null}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>}
            </div>
          )}
        </>
      )}
    </div>
  );
};

const OfficeRoster = ({ meta, onOpen }) => {
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  useEffect(() => {
    api('/api/clinician-onboarding/admin/roster').then(setData).catch(e => setErr(e.message));
  }, []);
  if (err) return <div className="banner bad">{err}</div>;
  if (!data) return <div className="card"><div className="empty">Loading…</div></div>;
  return (
    <div>
      {data.withoutTrack.length > 0 && (
        <div className="banner amber">
          <strong>{data.withoutTrack.length} clinician{data.withoutTrack.length === 1 ? '' : 's'}
          {' '}have no onboarding track set up:</strong> {data.withoutTrack.join(', ')}.
          Nothing about their access has changed. Open each one and set the four
          inputs to build their checklist.
        </div>
      )}
      <div className="card">
        <h2>Clinicians</h2>
        <table style={{ marginTop: 10 }}>
          <thead>
            <tr><th>Name</th><th>Track</th><th>Progress</th><th>With us</th><th>With them</th><th>Gates</th></tr>
          </thead>
          <tbody>
            {data.clinicians.map(c => (
              <tr key={c.userId} className="clk" onClick={() => onOpen(c.userId)}>
                <td><strong>{c.userName}</strong></td>
                <td>{!c.hasRecord ? <Pill kind="warn">Not set up</Pill>
                  : !c.trackDefined ? <Pill kind="warn">Not defined</Pill>
                  : <>{(c.inputs.roles || []).join(', ')}{c.inputs.relationship ? ` · ${c.inputs.relationship}` : ''}</>}</td>
                <td>{c.counts ? `${c.counts.done}/${c.counts.total}` : '—'}</td>
                <td>{c.waitingOnUs || 0}</td>
                <td>{c.waitingOnThem || 0}</td>
                <td>{(c.gates || []).map(g => (
                  <span key={g.id} style={{ marginRight: 4 }}>
                    <Pill kind={g.opened ? 'ok' : g.eligible ? 'warn' : ''}>{g.label || g.id}</Pill>
                  </span>
                ))}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
};

// ---- APP ------------------------------------------------------------------
const App = () => {
  const [meta, setMeta] = useState(null);
  const [mine, setMine] = useState(null);
  const [me, setMe] = useState(null);
  const [view, setView] = useState('mine');
  const [openUser, setOpenUser] = useState(null);
  const [err, setErr] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const m = await api('/api/clinician-onboarding/meta');
        setMeta(m);
        setMe(m.viewer);
        const office = !!(m.viewer && m.viewer.isOffice);
        const clinical = !!(m.viewer && m.viewer.hasClinicalAccess);
        let own = null;
        if (clinical) {
          try { own = await api('/api/clinician-onboarding/me'); setMine(own); }
          catch (e) { /* an office-only account has no track of its own */ }
        }
        // An office account almost always opens this page to do credentialing.
        // Landing them on their OWN track showed an admin an empty "no clinical
        // role set yet" card with the roster one click away and no sign of it —
        // found by rendering the page, which no source test could have caught.
        // They still land on their own wizard when they actually have a track.
        const ownTrackDefined = !!(own && own.track && own.track.defined
          && own.track.defined.defined);
        setView(office && !ownTrackDefined ? 'office' : 'mine');
      } catch (e) { setErr(e.message); }
    })();
  }, []);

  if (err) return <div className="wrap"><div className="banner bad" style={{ marginTop: 20 }}>{err}</div></div>;
  if (!meta) return <div className="wrap"><div className="card" style={{ marginTop: 20 }}>
    <div className="empty">Loading…</div></div></div>;

  const isOffice = !!(me && me.isOffice);
  const hasMine = !!mine;

  return (
    <div>
      <header className="top">
        <div className="wrap">
          <div className="brand">Godwins <b>Family Care</b></div>
          <div className="spacer" />
          <div style={{ fontSize: 14, opacity: .85 }}>
            {me ? me.name : ''}
          </div>
          <a className="btn ghost sm" href="/clinical">Clinical Workspace</a>
        </div>
      </header>
      <div className="wrap">
        {isOffice && hasMine && (
          <div className="tabs">
            <button className={`tab${view === 'mine' ? ' on' : ''}`} onClick={() => setView('mine')}>
              My Onboarding
            </button>
            <button className={`tab${view === 'office' ? ' on' : ''}`} onClick={() => { setView('office'); setOpenUser(null); }}>
              Credentialing
            </button>
          </div>
        )}
        {view === 'mine' && hasMine && (
          <MyWizard data={mine} meta={meta} reload={setMine}
            firstName={String((me && me.name) || '').trim().split(/\s+/)[0] || ''} />
        )}
        {view === 'mine' && !hasMine && (
          <div className="card" style={{ marginTop: 20 }}>
            <h2>Credentialing</h2>
            <div className="sub">You do not have an onboarding track of your own.</div>
            {isOffice && (
              <button className="btn" style={{ marginTop: 12 }} onClick={() => setView('office')}>
                Open The Roster
              </button>
            )}
          </div>
        )}
        {view === 'office' && isOffice && (
          openUser
            ? <OfficeDetail userId={openUser} meta={meta} onBack={() => setOpenUser(null)} />
            : <OfficeRoster meta={meta} onOpen={setOpenUser} />
        )}
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
