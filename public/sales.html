<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Godwins Family Care — Sales Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.1.0/dist/tabler-icons.min.css">
  <!-- Every time this app shows is Eastern (owner rule, 2026-09-16), and an
       audit log is the one place where a timestamp an hour out is a wrong
       answer to a compliance question. Loaded before the page's own scripts. -->
  <script src="/gfc-time.js"></script>
  <script>window.GFC_TIME && window.GFC_TIME.installDefaultTimeZone();</script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <link rel="icon" type="image/png" href="/brand/logo-mark-color-transparent.png">
  <style>
    /* The Sales Portal (owner, 2026-11-23): growth work moved off the public
       website. Content is the website's portal as it stood, ported as-is from
       the August 2026 copy; it lives in salesPortal.js, never in this page. */
    :root{--navy:#033D50;--gold:#F5CD85;--goldd:#C9A44A;--cream:#FAF7F2;--cream-d:#efe9db;--ink:#2b2b28;--mut:#7a746a;--red:#A32D2D;--line:#e5ddcb}
    *{box-sizing:border-box;margin:0;padding:0;font-family:'DM Sans',system-ui,sans-serif}
    body{background:var(--cream-d);color:var(--ink);font-size:15px;line-height:1.55}
    .hdr{background:var(--navy);color:var(--cream);padding:14px 22px}
    .hdr .t{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600}
    .hdr .s{color:var(--gold);font-size:14px}
    .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px;display:grid;grid-template-columns:220px 1fr;gap:18px}
    @media (max-width:820px){.wrap{grid-template-columns:1fr}.toc{position:static!important}}
    .toc{position:sticky;top:60px;align-self:start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
    .toc a{display:block;padding:7px 10px;border-radius:8px;color:var(--navy);text-decoration:none;font-weight:600;font-size:14px}
    .toc a:hover{background:var(--cream)}
    .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
    h2{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--navy);margin-bottom:6px}
    h3{font-size:16px;color:var(--navy);margin:14px 0 4px}
    .mu{color:var(--mut);font-size:14px}
    .item{border-top:1px solid #f1ece1;padding:12px 0}
    .item:first-of-type{border-top:none}
    .body{white-space:pre-wrap;background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:6px;font-size:14.5px}
    .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .chip{display:inline-block;border-radius:12px;padding:2px 9px;font-size:11.5px;font-weight:700;background:#eef3f0;color:#0f6e56}
    .chip.w{background:#fdf3dd;color:#8a6a1e}
    .btn{border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--navy);background:#fff;color:var(--navy);text-decoration:none}
    .err{background:#fdeeee;border:1px solid #f3c9c9;color:var(--red);border-radius:10px;padding:11px 14px;font-size:14px}
    .empty{text-align:center;color:var(--mut);padding:30px 10px}
  </style>
  <link rel="stylesheet" href="/css/gfc-theme.css">
</head>
<body>
<div id="root"></div>
<script src="/session-guard.js"></script>
<script src="/staff-nav.js"></script>
<script type="text/babel">
const { useState, useEffect } = React;
const getToken = () =>
  localStorage.getItem('admin_token') || localStorage.getItem('unified_token') || localStorage.getItem('portal_token');

const KIND = { script: 'Script', link: 'Link', document: 'Document', note: 'Note' };

function Item({ it }) {
  const [copied, setCopied] = useState(false);
  const copy = () => {
    try { navigator.clipboard.writeText(it.body || ''); setCopied(true); setTimeout(() => setCopied(false), 1500); } catch (e) { /* clipboard blocked */ }
  };
  return (
    <div className="item">
      <div className="row">
        <strong>{it.title}</strong>
        <span className="chip">{KIND[it.kind] || it.kind}</span>
        {it.stale && <span className="chip w" title={it.stale}>Check: may be out of date</span>}
        <span style={{flex:1}} />
        {it.body && it.kind === 'script' && <button className="btn" onClick={copy}>{copied ? 'Copied' : 'Copy'}</button>}
        {it.href && <a className="btn" href={it.href} target={/^https?:/.test(it.href) ? '_blank' : undefined} rel="noopener">Open</a>}
      </div>
      {it.stale && <div className="mu" style={{marginTop:4}}>{it.stale}</div>}
      {it.body && <div className="body">{it.body}</div>}
    </div>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  useEffect(() => {
    fetch('/api/sales/portal', { headers: { Authorization: `Bearer ${getToken()}` } })
      .then(async r => { const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || `Could not load (${r.status})`); return d; })
      .then(setData).catch(e => setErr(e.message));
  }, []);
  const sections = (data && data.sections) || [];
  return (
    <div>
      <div className="hdr">
        <div className="t">Sales Portal</div>
        <div className="s">Prospecting, partner and facility outreach, follow-ups and sales scripts</div>
      </div>
      <div className="wrap">
        <nav className="toc" aria-label="Sections">
          {sections.map(s => <a key={s.id} href={`#${s.id}`}>{s.title}</a>)}
          {!sections.length && <div className="mu" style={{padding:8}}>Sections appear here.</div>}
        </nav>
        <main>
          {err && <div className="err">{err}</div>}
          {!err && !data && <div className="card mu">Loading…</div>}
          {data && !sections.length && <div className="card empty">The portal's content is being moved over from the website.</div>}
          {sections.map(s => (
            <section key={s.id} id={s.id} className="card">
              <h2>{s.title}</h2>
              {s.intro && <p className="mu">{s.intro}</p>}
              {(s.items || []).map((it, i) => <Item key={i} it={it} />)}
            </section>
          ))}
        </main>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
