<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Godwins Family Care — My GFC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.1.0/dist/tabler-icons.min.css">
  <script src="/gfc-time.js"></script>
  <script>window.GFC_TIME && window.GFC_TIME.installDefaultTimeZone();</script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <link rel="icon" type="image/png" href="/brand/logo-mark-transparent.png">
  <style>
    :root{--navy:#033D50;--navy-soft:#0A4F66;--gold:#C9A44A;--gold-pale:#F1E2BE;--cream:#FAF7F2;--ink:#1B2A33;--mut:#4F6470;--line:#E1D9C9;--green:#3F7A5C;--red:#B5462E}
    *{box-sizing:border-box}
    body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
    h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;color:var(--navy);margin:0;line-height:1.15}
    h1{font-size:32px} h2{font-size:22px}
    a{color:var(--navy)} button{font-family:inherit}
    .shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
    .side{background:var(--navy);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
    .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
    .brand img{width:38px;height:38px}
    .brand b{font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1.05;color:#fff}
    .nav button{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;color:#fff;padding:11px 12px;border-radius:10px;font-size:15px;cursor:pointer;text-align:left}
    .nav button.on{background:#9A7A33}
    .nav button:hover:not(.on){background:var(--navy-soft)}
    .nav i{font-size:20px}
    .who{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.15);font-size:13px}
    .who a{color:#F5CD85;text-decoration:none}
    .main{padding:24px 28px 80px;max-width:1100px;width:100%}
    .sub{color:var(--mut);font-family:'Cormorant Garamond',serif;font-size:19px;margin:4px 0 18px}
    .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
    .card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
    .card-h h2{border-bottom:2px solid var(--gold);padding-bottom:4px}
    .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:16px}
    .tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;text-align:left;display:flex;gap:12px;align-items:flex-start}
    .tile:hover{border-color:var(--gold)}
    .tile .ic{width:44px;height:44px;border-radius:12px;background:#EEF4F6;color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:23px;flex:none}
    .tile b{display:block;color:var(--navy);font-size:15.5px} .tile small{color:var(--mut);font-size:13px}
    .row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid #F1ECE1}
    .row:last-child{border-bottom:0}
    .row .grow{flex:1;min-width:0} .row .grow b{display:block;overflow-wrap:anywhere} .row .grow small{color:var(--mut);font-size:13px}
    .row i.big{font-size:24px;color:var(--navy)}
    .btn{border-radius:9px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--navy);background:var(--navy);color:#fff;display:inline-flex;gap:7px;align-items:center;text-decoration:none}
    .btn.ghost{background:#fff;color:var(--navy)} .btn.warn{background:#fff;color:var(--red);border-color:var(--red)}
    .btn.sm{padding:6px 10px;font-size:13px} .btn[disabled]{opacity:.5;cursor:not-allowed}
    .pill{display:inline-flex;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;background:#E6EEF2;color:var(--navy)}
    .pill.ok{background:#E7F1EB;color:var(--green)} .pill.bad{background:#FBE9E5;color:var(--red)} .pill.wait{background:#F8EED7;color:#7A5A12}
    .bar{height:9px;background:#EFE8DA;border-radius:6px;overflow:hidden;margin:8px 0}
    .bar>span{display:block;height:100%;background:#A97E2B}
    .note{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--mut);font-size:14px}
    .err{background:#FBE9E5;color:var(--red);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
    .crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:10px;font-size:14px}
    .crumbs button{background:none;border:0;color:var(--navy);cursor:pointer;padding:2px 4px;text-decoration:underline;font-size:14px}
    label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:10px 0 4px}
    input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;background:#fff}
    .checks{display:flex;flex-wrap:wrap;gap:8px}
    .checks label{display:inline-flex;gap:6px;align-items:center;margin:0;font-weight:500;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:#fff}
    .mob{display:none}
    @media (max-width:820px){
      .shell{grid-template-columns:1fr}.side{display:none}.main{padding:16px 16px 90px}
      .mob{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--navy);justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom));z-index:5}
      .mob button{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;font-size:11px;gap:2px;padding:4px 6px;border-radius:8px;cursor:pointer}
      .mob button.on{background:#9A7A33} .mob i{font-size:21px}
      .mtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    }
    @media (min-width:821px){.mtop{display:none}}
  </style>
</head>
<body>
<div id="root"></div>
<script src="/session-guard.js"></script>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const getToken = () => localStorage.getItem('admin_token') || localStorage.getItem('unified_token') || localStorage.getItem('portal_token');

const call = async (path, opts = {}) => {
  const res = await fetch(path, {
    method: opts.method || 'GET',
    headers: { Authorization: `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  let data = null;
  try { data = await res.json(); } catch (e) { /* empty */ }
  if (!res.ok) {
    const err = new Error((data && data.error) || `Request failed (${res.status})`);
    err.code = data && data.code; err.status = res.status; err.detail = data && data.detail;
    throw err;
  }
  return data;
};

// A file opens through the app with the token in the HEADER, never the URL.
const openFile = async (path, name) => {
  const res = await fetch(path, { headers: { Authorization: `Bearer ${getToken()}` } });
  if (!res.ok) throw new Error('That file could not be opened.');
  const blob = await res.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name || 'document'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};

const TZ = window.GFC_TIME && window.GFC_TIME.PRACTICE_TIMEZONE;
const fmtDate = (iso) => (iso ? new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: TZ }) : '');
const fmtTime = (iso) => (iso ? new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: TZ }) : '');

const KIND_LABELS = { timesheet: 'Timesheet', visit_note: 'Signed visit note', mileage: 'Mileage or expense', certification: 'Certification',
  id_document: 'Photo ID', paystub: 'Paystub', w9: 'W-9', clinician_onboarding: 'Onboarding document', other: 'Other' };
const STATUS_PILL = { accepted: ['ok', 'Accepted'], received: ['wait', 'With the office'], rejected: ['bad', 'Sent back'] };

const SECTIONS = [
  { id: 'home', label: 'Home', icon: 'ti-home' },
  { id: 'onboarding', label: 'Onboarding', icon: 'ti-route' },
  { id: 'documents', label: 'My Documents', icon: 'ti-file-text' },
  { id: 'policies', label: 'Policies', icon: 'ti-book' },
  { id: 'folders', label: 'Shared Folders', icon: 'ti-folders' },
  { id: 'hours', label: 'Hours & Pay', icon: 'ti-clock' },
  { id: 'account', label: 'Account', icon: 'ti-user-circle' }
];

function Section({ title, sub, children, right }) {
  return (
    <div className="card">
      <div className="card-h"><h2>{title}</h2>{right}</div>
      {sub && <p style={{ marginTop: 0, color: 'var(--mut)' }}>{sub}</p>}
      {children}
    </div>
  );
}

function Tile({ icon, title, sub, onClick }) {
  return (
    <button className="tile" onClick={onClick}>
      <span className="ic"><i className={`ti ${icon}`} /></span>
      <span><b>{title}</b><small>{sub}</small></span>
    </button>
  );
}

// ---- Onboarding ---------------------------------------------------------------
function OnboardingSummary({ onboarding, compact }) {
  if (!onboarding) return <p className="note">Loading your onboarding…</p>;
  if (onboarding.error) return <p className="note">Your onboarding could not be loaded right now.</p>;
  if (!onboarding.started) {
    return <p className="note">The office hasn't started your onboarding checklist yet. It will show here once they do.</p>;
  }
  const c = onboarding.track.counts;
  const pct = c.items ? Math.round((c.complete / c.items) * 100) : 0;
  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: 8 }}>
        <span><b>{c.complete}</b> of {c.items} items done</span>
        <span>
          {c.waitingOnHer > 0 && <span className="pill wait" style={{ marginRight: 6 }}>{c.waitingOnHer} waiting on you</span>}
          {c.returned > 0 && <span className="pill bad">{c.returned} sent back</span>}
        </span>
      </div>
      <div className="bar"><span style={{ width: `${pct}%` }} /></div>
      {!compact && <p style={{ color: 'var(--mut)', fontSize: 14 }}>Your checklist, uploads, policy acknowledgments and training all live on your onboarding page.</p>}
      <a className="btn" href="/onboarding"><i className="ti ti-route" />Open My Onboarding</a>
    </div>
  );
}

// ---- Documents --------------------------------------------------------------
function Documents({ docs, onError }) {
  if (!docs) return <p className="note">Loading…</p>;
  if (!docs.length) return <p className="note">Nothing is on file for you yet. Documents you or the office upload will show here.</p>;
  return docs.map(d => {
    const pill = STATUS_PILL[d.status];
    return (
      <div className="row" key={d.id}>
        <i className="ti ti-file big" />
        <div className="grow">
          <b>{d.fileName}</b>
          <small>{KIND_LABELS[d.kind] || 'Document'} · {fmtDate(d.uploadedAt)} · {d.filedByOffice ? `Filed by ${d.uploadedByName || 'the office'}` : 'You sent this'}</small>
          {d.reviewNote && <small style={{ display: 'block', color: 'var(--red)' }}>Sent back: {d.reviewNote}</small>}
        </div>
        {pill && <span className={`pill ${pill[0]}`}>{pill[1]}</span>}
        <button className="btn ghost sm" onClick={() => openFile(`/api/my/documents/${d.id}/file`, d.fileName).catch(e => onError(e.message))}>Open</button>
      </div>
    );
  });
}

// ---- Policies ---------------------------------------------------------------
function Policies({ policies }) {
  if (!policies) return <p className="note">Loading…</p>;
  return policies.map(p => (
    <div className="row" key={p.id}>
      <i className="ti ti-book big" />
      <div className="grow"><b>{p.title}</b><small>Version {p.version}</small></div>
      {p.links.map((u, i) => (
        <a key={u} className="btn ghost sm" href={u} target="_blank" rel="noopener noreferrer">{i === 0 ? 'Open' : 'Acknowledgment form'}</a>
      ))}
    </div>
  ));
}

// ---- Shared folders ---------------------------------------------------------
function FolderBrowser({ folder, onBack }) {
  const [path, setPath] = useState([]);   // [{id, name}]
  const [data, setData] = useState(null);
  const [err, setErr] = useState('');
  useEffect(() => {
    setData(null); setErr('');
    const q = path.map(p => p.id).join(',');
    call(`/api/my/folders/${folder.id}/items?path=${encodeURIComponent(q)}`)
      .then(setData).catch(e => setErr(e.message));
  }, [folder.id, path]);
  return (
    <div>
      <div className="crumbs">
        <button onClick={onBack}>Shared Folders</button><span>/</span>
        <button onClick={() => setPath([])}>{folder.label}</button>
        {path.map((p, i) => (
          <React.Fragment key={p.id}><span>/</span><button onClick={() => setPath(path.slice(0, i + 1))}>{p.name}</button></React.Fragment>
        ))}
      </div>
      {err && <div className="err">{err}</div>}
      {!data && !err && <p className="note">Loading…</p>}
      {data && !data.items.length && <p className="note">This folder is empty.</p>}
      {data && data.items.map(i => (
        <div className="row" key={i.id}>
          <i className={`ti ${i.isFolder ? 'ti-folder' : 'ti-file'} big`} />
          <div className="grow"><b>{i.name}</b>{i.modifiedTime && <small>Updated {fmtDate(i.modifiedTime)}</small>}</div>
          {i.isFolder
            ? <button className="btn ghost sm" onClick={() => setPath(path.concat([{ id: i.id, name: i.name }]))}>Open</button>
            : i.url && <a className="btn ghost sm" href={i.url} target="_blank" rel="noopener noreferrer">Open in Drive</a>}
        </div>
      ))}
      <p className="note" style={{ marginTop: 12 }}>Files open in Google Drive. Sign in with your GFC Google account if Drive asks.</p>
    </div>
  );
}

function SharedFolders({ folders }) {
  const [open, setOpen] = useState(null);
  if (open) return <FolderBrowser folder={open} onBack={() => setOpen(null)} />;
  if (!folders) return <p className="note">Loading…</p>;
  if (!folders.length) return <p className="note">No shared folders are assigned to you yet. The office adds them for your role.</p>;
  return folders.map(f => (
    <div className="row" key={f.id} style={{ cursor: 'pointer' }} onClick={() => setOpen(f)}>
      <i className="ti ti-folder big" />
      <div className="grow"><b>{f.label}</b>{f.description && <small>{f.description}</small>}</div>
      <i className="ti ti-chevron-right" />
    </div>
  ));
}

// The admin's side: which folders each role or person sees.
function ManageFolders({ onChanged }) {
  const [data, setData] = useState(null);
  const [form, setForm] = useState({ link: '', label: '', description: '', types: [], userIds: [] });
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const load = useCallback(() => call('/api/my/admin/folders').then(setData).catch(e => setErr(e.message)), []);
  useEffect(() => { load(); }, [load]);
  const toggle = (key, v) => setForm(f => ({ ...f, [key]: f[key].includes(v) ? f[key].filter(x => x !== v) : f[key].concat([v]) }));
  const add = async () => {
    setBusy(true); setErr('');
    try {
      await call('/api/my/admin/folders', { method: 'POST', body: form });
      setForm({ link: '', label: '', description: '', types: [], userIds: [] });
      await load(); onChanged();
    } catch (e) { setErr(e.detail ? `${e.message} (${e.detail})` : e.message); }
    setBusy(false);
  };
  const remove = async (id) => {
    if (!window.confirm('Remove this folder from My GFC? Nothing in Drive is deleted.')) return;
    try { await call(`/api/my/admin/folders/${id}`, { method: 'DELETE' }); await load(); onChanged(); } catch (e) { setErr(e.message); }
  };
  if (!data) return err ? <div className="err">{err}</div> : <p className="note">Loading…</p>;
  const typeLabel = Object.fromEntries(data.types.map(t => [t.id, t.label]));
  const personName = Object.fromEntries(data.people.map(p => [p.id, p.name]));
  return (
    <div>
      {err && <div className="err">{err}</div>}
      {data.folders.map(f => (
        <div className="row" key={f.id}>
          <i className="ti ti-folder big" />
          <div className="grow">
            <b>{f.label}</b>
            <small>Seen by: {f.types.map(t => typeLabel[t]).concat(f.userIds.map(id => personName[id] || 'a removed account')).join(', ')}</small>
          </div>
          <button className="btn warn sm" onClick={() => remove(f.id)}>Remove</button>
        </div>
      ))}
      {!data.folders.length && <p className="note">No folders assigned yet.</p>}
      <h3 style={{ marginTop: 18, fontSize: 19 }}>Add a folder</h3>
      <label>Drive folder link</label>
      <input type="text" value={form.link} onChange={e => setForm({ ...form, link: e.target.value })} placeholder="https://drive.google.com/drive/folders/…" />
      <label>Name people will see</label>
      <input type="text" value={form.label} onChange={e => setForm({ ...form, label: e.target.value })} placeholder="Clinical Forms" />
      <label>Description (optional)</label>
      <input type="text" value={form.description} onChange={e => setForm({ ...form, description: e.target.value })} />
      <label>Everyone in these roles</label>
      <div className="checks">
        {data.types.map(t => (
          <label key={t.id}><input type="checkbox" checked={form.types.includes(t.id)} onChange={() => toggle('types', t.id)} />{t.label}</label>
        ))}
      </div>
      <label>Or these people</label>
      <div className="checks">
        {data.people.map(p => (
          <label key={p.id}><input type="checkbox" checked={form.userIds.includes(p.id)} onChange={() => toggle('userIds', p.id)} />{p.name}</label>
        ))}
      </div>
      <p className="note" style={{ marginTop: 12 }}>
        The folder has to be shared with the GFC admin Google account so the app can list it. Each person still opens files under their own Google sign-in, so Drive's sharing settings decide who can read a file.
      </p>
      <button className="btn" disabled={busy || !form.link || !form.label} onClick={add}><i className="ti ti-plus" />Add Folder</button>
    </div>
  );
}

// ---- Hours ------------------------------------------------------------------
function Hours({ profile, hours }) {
  if (!profile.isCaregiver) {
    return <p className="note">Hours and pay stubs for salaried and clinical staff aren't in the app yet. Pay questions go to the office.</p>;
  }
  if (!hours) return <p className="note">Loading…</p>;
  return (
    <div>
      <p style={{ marginTop: 0 }}>You clock in and out from <a href="/caregiver#schedule">My Schedule</a>. Pay stubs come from payroll, not this app.</p>
      <p><b>{hours.totalHours || 0}</b> hours on record in the last 30 days.</p>
      {hours.timeLogs.slice(0, 15).map(l => (
        <div className="row" key={l.id}>
          <i className="ti ti-clock big" />
          <div className="grow"><b>{fmtTime(l.clockInAt)}{l.clientName ? ` · ${l.clientName}` : ''}</b><small>{l.totalMinutes != null ? `${(l.totalMinutes / 60).toFixed(2)} hours` : 'Still clocked in'}</small></div>
        </div>
      ))}
      <a className="btn ghost" href="#" onClick={(e) => { e.preventDefault(); openFile('/api/scheduling/my-hours.csv', 'my-hours.csv').catch(() => {}); }}>
        <i className="ti ti-download" />Download My Hours
      </a>
    </div>
  );
}

// ---- The page ---------------------------------------------------------------
function App() {
  const [profile, setProfile] = useState(null);
  const [fatal, setFatal] = useState('');
  const [view, setView] = useState(() => {
    const h = (window.location.hash || '').slice(1);
    return SECTIONS.some(s => s.id === h) ? h : 'home';
  });
  const [onboarding, setOnboarding] = useState(null);
  const [docs, setDocs] = useState(null);
  const [policies, setPolicies] = useState(null);
  const [folders, setFolders] = useState(null);
  const [hours, setHours] = useState(null);
  const [err, setErr] = useState('');

  const loadFolders = useCallback(() => call('/api/my/folders').then(d => setFolders(d.folders)).catch(e => setErr(e.message)), []);

  useEffect(() => {
    if (!getToken()) { window.location.href = '/login'; return; }
    call('/api/my/profile').then(p => {
      setProfile(p);
      call('/api/onboarding/me').then(setOnboarding).catch(() => setOnboarding({ error: true }));
      call('/api/my/documents').then(d => setDocs(d.documents)).catch(e => setErr(e.message));
      call('/api/my/policies').then(d => setPolicies(d.policies)).catch(e => setErr(e.message));
      loadFolders();
      if (p.isCaregiver) {
        const from = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10);
        call(`/api/scheduling/time-logs?from=${from}`).then(setHours).catch(() => setHours({ timeLogs: [], totalHours: 0 }));
      }
    }).catch(e => setFatal(e.code === 'STAFF_PORTAL_STAFF_ONLY' ? 'My GFC is for GFC staff.' : e.message));
  }, [loadFolders]);

  const go = (id) => { setView(id); window.history.replaceState(null, '', `#${id}`); window.scrollTo(0, 0); };

  if (fatal) return <div className="main"><div className="err">{fatal}</div><a className="btn" href="/login">Back to sign in</a></div>;
  if (!profile) return <div className="main"><p className="note">Loading…</p></div>;

  const firstName = (profile.name || '').split(' ')[0];
  const home = profile.isCaregiver ? { href: '/caregiver', label: 'Caregiver App' }
    : profile.isClinician ? { href: '/clinical', label: 'Clinical Workspace' }
    : { href: '/login', label: 'Portal Hub' };

  let body = null;
  if (view === 'home') {
    body = (
      <div>
        <div className="tiles">
          <Tile icon="ti-route" title="Onboarding" sub="Your checklist and training" onClick={() => go('onboarding')} />
          <Tile icon="ti-file-text" title="My Documents" sub={docs ? `${docs.length} on file` : 'Your files'} onClick={() => go('documents')} />
          <Tile icon="ti-book" title="Policies" sub="The policies you work under" onClick={() => go('policies')} />
          <Tile icon="ti-folders" title="Shared Folders" sub={folders ? `${folders.length} assigned to you` : 'Drive folders for your role'} onClick={() => go('folders')} />
          <Tile icon="ti-clock" title="Hours & Pay" sub={profile.isCaregiver ? 'Your clocked hours' : 'Pay questions'} onClick={() => go('hours')} />
          <Tile icon="ti-user-circle" title="Account" sub="Password, sign-in and devices" onClick={() => go('account')} />
        </div>
        <Section title="Onboarding"><OnboardingSummary onboarding={onboarding} compact /></Section>
      </div>
    );
  } else if (view === 'onboarding') {
    body = <Section title="My Onboarding"><OnboardingSummary onboarding={onboarding} /></Section>;
  } else if (view === 'documents') {
    body = <Section title="My Documents" sub="Everything on file for you, whether you sent it or the office filed it."><Documents docs={docs} onError={setErr} /></Section>;
  } else if (view === 'policies') {
    body = <Section title="Policies" sub="The current version of each policy you work under. Each opens in Google Drive."><Policies policies={policies} /></Section>;
  } else if (view === 'folders') {
    body = (
      <div>
        <Section title="Shared Folders" sub="The Drive folders the office set up for your role."><SharedFolders folders={folders} /></Section>
        {profile.isAdmin && <Section title="Manage Shared Folders" sub="Choose which Drive folders each role or person sees here."><ManageFolders onChanged={loadFolders} /></Section>}
      </div>
    );
  } else if (view === 'hours') {
    body = <Section title="Hours & Pay"><Hours profile={profile} hours={hours} /></Section>;
  } else if (view === 'account') {
    body = (
      <Section title="Account">
        <p style={{ marginTop: 0 }}>Change your password, set up two-step sign-in and see the devices you're signed in on.</p>
        <a className="btn" href="/account"><i className="ti ti-shield-lock" />Account & Security</a>
      </Section>
    );
  }

  return (
    <div className="shell">
      <aside className="side">
        <div className="brand"><img src="/brand/logo-mark-white-transparent.png" alt="" /><b>My GFC</b></div>
        <nav className="nav">
          {SECTIONS.map(s => (
            <button key={s.id} className={view === s.id ? 'on' : ''} onClick={() => go(s.id)}><i className={`ti ${s.icon}`} />{s.label}</button>
          ))}
        </nav>
        <div className="who">
          <div>{profile.name}</div>
          <div style={{ opacity: .75 }}>{profile.typeLabel}</div>
          <a href={home.href}>← {home.label}</a>
        </div>
      </aside>
      <main className="main">
        <div className="mtop">
          <img src="/brand/logo-mark-transparent.png" alt="" style={{ width: 34, height: 34 }} />
          <a href={home.href} style={{ marginLeft: 'auto', fontSize: 14 }}>← {home.label}</a>
        </div>
        <h1>{view === 'home' ? `Hi, ${firstName}` : SECTIONS.find(s => s.id === view).label}</h1>
        <div className="sub">{profile.typeLabel} · Godwins Family Care</div>
        {err && <div className="err">{err}</div>}
        {body}
      </main>
      <nav className="mob">
        {SECTIONS.filter(s => s.id !== 'account').map(s => (
          <button key={s.id} className={view === s.id ? 'on' : ''} onClick={() => go(s.id)}><i className={`ti ${s.icon}`} />{s.label.replace('My ', '').replace(' & Pay', '')}</button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
