                {photo && <a href={photo} download={`${userName || 'headshot'}.jpg`} className="text-sm text-primary underline mt-2 inline-block">Download photo</a>}
              </div>
            </div>
          )}
        </div>
      );
    };

    // Anyone's completed welcome packet, caregiver or staff, read-only, with the
    // signed PDF (owner, 2026-11-09). Answers are shown in the packet's own
    // labels, served by the server; nothing here restates a question.
    const WelcomePacketSection = ({ token, userId, userName }) => {
      const [p, setP] = React.useState(null);
      const [err, setErr] = React.useState('');
      React.useEffect(() => {
        let live = true; setP(null); setErr('');
        fetch(`/api/my/admin/welcome/${userId}`, { headers: { Authorization: `Bearer ${token}` } })
          .then(r => r.json().then(d => { if (!r.ok) throw new Error(d.error || 'Could not load the welcome packet.'); return d; }))
          .then(d => { if (live) setP(d); }).catch(e => { if (live) setErr(e.message); });
        return () => { live = false; };
      }, [token, userId]);
      const show = (f, v) => {
        if (v == null || v === '' || (Array.isArray(v) && !v.length)) return '—';
        if (f.type === 'single') return (f.options.find(o => o.value === v) || {}).label || v;
        if (f.type === 'multi') return v.map(x => (f.options.find(o => o.value === x) || {}).label || x).join(', ');
        if (f.type === 'grid') return Object.entries(v).map(([r, cols]) => `${(f.rows.find(x => x.value === r) || {}).label || r}: ${cols.map(c => (f.columns.find(x => x.value === c) || {}).label || c).join(', ')}`).join(' | ') || '—';
        if (f.type === 'rows') return v.map(row => f.rowFields.map(rf => row[rf.id] || '—').join(' · ')).join(' / ');
        return String(v);
      };
      const openPdf = async () => {
        try {
          const res = await fetch(`/api/my/admin/welcome/${userId}/signed.pdf`, { headers: { Authorization: `Bearer ${token}` } });
          if (!res.ok) throw new Error('That packet could not be opened.');
          const a = document.createElement('a');
          a.href = URL.createObjectURL(await res.blob()); a.download = `GFC Welcome Packet - ${userName || 'staff'}.pdf`; a.click();
          setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        } catch (e) { setErr(e.message); }
      };
      const label = { submitted: 'Signed', in_progress: 'In progress', not_started: 'Not started' };
      return (
        <div className="border-t pt-4">
          <h3 className="font-medium text-gray-800 mb-1">Welcome Packet</h3>
          {err && <p className="text-sm text-red-600">{err}</p>}
          {!err && !p && <p className="text-sm text-gray-500">Loading…</p>}
          {p && (
            <div>
              <p className="text-sm text-gray-600 mb-2">
                {label[p.status] || p.status}{p.signedAt ? ` · ${new Date(p.signedAt).toLocaleDateString('en-US')}` : ''}
                {p.kind === 'caregiver' ? ' · caregiver welcome packet' : ''}
              </p>
              {p.status === 'submitted' && (
                <button type="button" onClick={openPdf} className="mb-3 px-3 py-1.5 text-sm rounded-lg bg-primary text-white">Open Completed Packet</button>
              )}
              {p.status !== 'not_started' && (
                <details className="text-sm">
                  <summary className="cursor-pointer text-primary mb-2">Answers</summary>
                  {/* The staff packet's availability is its step 3, so it sits in number order. */}
                  {p.sections.concat(p.kind === 'staff' ? [{ id: 'staff_availability', number: 3, title: 'Availability', fields: [] }] : [])
                    .sort((a, b) => a.number - b.number).map(sec => (
                    <div key={sec.id} className="mb-2">
                      <p className="font-medium text-gray-700">{sec.number}. {sec.title}</p>
                      {sec.fields.map(f => <p key={f.id} className="text-gray-600"><span className="text-gray-500">{/[?:]$/.test(f.label) ? f.label : `${f.label}:`}</span> {show(f, p.data[f.id])}</p>)}
                      {sec.id === 'staff_availability' && (p.availability
                        ? <p className="text-gray-600">From {p.availability.effectiveFrom}: {(p.availability.windows || []).map(w => `${w.day} ${w.start}–${w.end}`).join(', ') || '—'}</p>
                        : <p className="text-gray-500">None on file.</p>)}
                    </div>
                  ))}
                </details>
              )}
            </div>
          )}
        </div>
      );
    };

    // ── THE STAFF RECORD (owner, 2026-11-09) ───────────────────────────────
    // Every employee opens as one full-page record in User Management, laid
    // out like the client view in Enrollment, so nothing about a person is
    // split between User Management, Caregiver Management and Staff
    // Onboarding. The account form is the record's first sections; these
    // components are the rest. Each reads its own route, and each route
    // decides who may see it.
    const srFetch = async (token, path, opts = {}) => {
      const res = await fetch(`${API_URL}${path}`, { ...opts, headers: { 'Authorization': `Bearer ${token}`, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
      let body = null;
      try { body = await res.json(); } catch (e) { /* no body */ }
      if (!res.ok) throw new Error((body && body.error) || `The server answered ${res.status}.`);
      return body;
    };
    const srIsCaregiver = (u) => !!u && u.role === 'vendor';
    const srIsClinical = (u) => !!u && (u.hasClinicalAccess || u.role === 'caseManager');
    // The record's sections, in order, for this person. The page menu and the
    // tests read this one list.
    const staffRecordSections = (u, isSuperAdmin) => [
      { id: 'sr-account', label: 'Account & Role' },
      // What this person can open (owner, 2026-11-13). Super Admin only.
      isSuperAdmin && { id: 'sr-modules', label: 'Modules' },
      (srIsCaregiver(u) || srIsClinical(u) || (u && u.role === 'user')) && { id: 'sr-credentials', label: 'Credentials' },
      // Bio sits right before Pay (owner, 2026-11-09).
      { id: 'sr-bio', label: 'Bio & Headshot' },
      srIsCaregiver(u) && { id: 'sr-pay', label: 'Pay' },
      { id: 'sr-documents', label: 'Documents' },
      { id: 'sr-onboarding', label: 'Onboarding & Clearance' },
      { id: 'sr-welcome', label: 'Welcome Packet' },
      srIsCaregiver(u) && { id: 'sr-activity', label: 'Activity' },
      isSuperAdmin && { id: 'sr-recovery', label: 'Account Recovery' }
    ].filter(Boolean);
    const srJump = (id) => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };

    // The header: who this is, and three things at a glance.
    const StaffRecordTop = ({ token, user, onBack }) => {
      const [glance, setGlance] = React.useState({});
      React.useEffect(() => {
        let live = true;
        setGlance({});
        srFetch(token, `/api/my/admin/people/${encodeURIComponent(user.id)}/documents`)
          .then(d => live && setGlance(g => ({ ...g, waiting: (d.documents || []).filter(x => x.status === 'received').length })))
          .catch(() => live && setGlance(g => ({ ...g, waiting: null })));
        srFetch(token, `/api/onboarding/admin/people/${encodeURIComponent(user.id)}`)
          .then(d => { const c = (d.track && d.track.counts) || {}; live && setGlance(g => ({ ...g, onboarding: c.items ? Math.round((c.complete / c.items) * 100) : 0 })); })
          .catch(e => live && setGlance(g => ({ ...g, onboarding: /not been started/i.test(e.message) ? 'not started' : null })));
        if (srIsCaregiver(user)) {
          srFetch(token, `/api/caregiver/admin/welcome-packets/${encodeURIComponent(user.id)}`)
            .then(d => live && setGlance(g => ({ ...g, cleared: !!(d.caregiver && d.caregiver.cleared) })))
            .catch(() => live && setGlance(g => ({ ...g, cleared: null })));
        }
        return () => { live = false; };
      }, [token, user.id]);
      const chip = (text, tone) => (
        <span className={`mg-pill ${tone || ''}`} style={{ fontSize: 13 }}>{text}</span>
      );
      const ob = glance.onboarding;
      return (
        <div className="mg-card" style={{ marginBottom: 16 }}>
          <button type="button" onClick={onBack} className="text-sm font-semibold" style={{ color: '#033D50', background: 'none', border: 0, cursor: 'pointer', padding: 0 }}>← User Management</button>
          <div className="flex flex-wrap items-end justify-between gap-3 mt-2">
            <div>
              <h1 style={{ fontFamily: '"Cormorant Garamond", Georgia, serif', fontSize: 34, fontWeight: 600, color: '#033D50', lineHeight: 1.1, margin: 0 }}>{user.name || user.email}</h1>
              <p className="text-sm" style={{ color: '#41555f', marginTop: 4 }}>{user.email}{user.accountStatus === 'inactive' ? ' · Inactive' : ''}</p>
            </div>
            <div className="flex flex-wrap gap-2">
              {ob === undefined ? chip('Onboarding…') : ob === null ? chip('Onboarding unavailable') : ob === 'not started' ? chip('Onboarding not started', 'mg-wait') : chip(`Onboarding ${ob}%`, ob === 100 ? 'mg-ok' : 'mg-wait')}
              {srIsCaregiver(user) && (glance.cleared === undefined ? chip('Clearance…') : glance.cleared === null ? chip('Clearance unavailable') : glance.cleared ? chip('Cleared for shifts', 'mg-ok') : chip('Not cleared for shifts', 'mg-bad'))}
              {glance.waiting === undefined ? chip('Documents…') : glance.waiting === null ? chip('Documents unavailable') : chip(glance.waiting ? `${glance.waiting} document${glance.waiting === 1 ? '' : 's'} to review` : 'No documents waiting', glance.waiting ? 'mg-wait' : 'mg-ok')}
            </div>
          </div>
        </div>
      );
    };

    const StaffRecordMenu = ({ sections }) => (
      <nav className="sr-menu" aria-label="Record sections">
        {sections.map(s => (
          <button key={s.id} type="button" onClick={() => srJump(s.id)}>{s.label}</button>
        ))}
      </nav>
    );

    // What they signed: policies, the welcome packet and attestations. The
    // uploaded files are CaregiverDocsSection, just above it.
    const StaffSignedList = ({ token, user }) => {
      const [d, setD] = React.useState(null);
      const [err, setErr] = React.useState('');
      React.useEffect(() => {
        setD(null); setErr('');
        srFetch(token, `/api/my/admin/people/${encodeURIComponent(user.id)}/documents`).then(setD).catch(e => setErr(e.message));
      }, [token, user.id]);
      const openPdf = async (path, name) => {
        try {
          const res = await fetch(`${API_URL}${path}`, { headers: { 'Authorization': `Bearer ${token}` } });
          if (!res.ok) throw new Error(res.status === 401 ? 'Your session expired. Sign in again.' : 'That copy could not be opened.');
          const url = URL.createObjectURL(await res.blob());
          const a = document.createElement('a'); a.href = url; a.download = name; a.click();
          setTimeout(() => URL.revokeObjectURL(url), 60000);
        } catch (e) { setErr(e.message); }
      };
      if (err) return <p className="text-sm text-red-600 mt-3">{err}</p>;
      if (!d) return <p className="text-sm text-gray-500 mt-3">Loading what they signed…</p>;
      const signed = d.signed || [];
      return (
        <div className="mt-5 border-t pt-4">
          <h4 className="font-medium text-gray-800 mb-1">What They Signed</h4>
          {signed.length === 0 ? <p className="text-sm text-gray-500">Nothing signed yet.</p> : (
            <div className="space-y-2">
              {signed.map(x => (
                <div key={x.id} className="flex items-center gap-3 p-2 bg-gray-50 rounded-lg">
                  <div className="flex-1 min-w-0">
                    <div className="text-sm font-medium text-gray-800">{x.title}{x.version ? ` · v${x.version}` : ''}</div>
                    <div className="text-xs text-gray-500">
                      Signed {String(x.signedAt || '').slice(0, 10)}{x.filedByOffice ? ` · filed by ${x.filedByName || 'the office'}` : ''}
                      {x.current === false ? ' · an older version' : ''}
                    </div>
                  </div>
                  {x.pdf === 'packet' && <button type="button" className="px-3 py-1.5 border border-gray-300 rounded-lg text-xs"
                    onClick={() => openPdf(`/api/caregiver/welcome-packet/signed.pdf?caregiverId=${encodeURIComponent(user.id)}`, 'welcome-packet.pdf')}>Open</button>}
                  {x.pdf === 'attestation' && <button type="button" className="px-3 py-1.5 border border-gray-300 rounded-lg text-xs"
                    onClick={() => openPdf(`/api/caregiver/welcome-packet/attestations/${encodeURIComponent(x.kind)}.pdf?caregiverId=${encodeURIComponent(user.id)}`, `${x.kind}.pdf`)}>Open</button>}
                  {(x.links || []).slice(0, 1).map(href => <a key={href} href={href} target="_blank" rel="noopener noreferrer" className="px-3 py-1.5 border border-gray-300 rounded-lg text-xs">View policy</a>)}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    };

    // Onboarding progress for anyone, and for a caregiver the welcome packet,
    // the office's own checklist items and whether they are cleared for shifts.
    const StaffOnboardingPanel = ({ token, user }) => {
      const [ob, setOb] = React.useState(null);
      const [obErr, setObErr] = React.useState('');
      const [wp, setWp] = React.useState(null);
      const [wpErr, setWpErr] = React.useState('');
      const [busy, setBusy] = React.useState('');
      const load = React.useCallback(() => {
        setObErr(''); setWpErr('');
        srFetch(token, `/api/onboarding/admin/people/${encodeURIComponent(user.id)}`).then(setOb).catch(e => { setOb(null); setObErr(e.message); });
        if (srIsCaregiver(user)) srFetch(token, `/api/caregiver/admin/welcome-packets/${encodeURIComponent(user.id)}`).then(setWp).catch(e => { setWp(null); setWpErr(e.message); });
      }, [token, user.id]);
      React.useEffect(() => { setOb(null); setWp(null); load(); }, [load]);
      const setItem = async (kind, status) => {
        setBusy(kind); setWpErr('');
        try {
          await srFetch(token, `/api/caregiver/admin/welcome-packets/${encodeURIComponent(user.id)}/office-item`, { method: 'PUT', body: JSON.stringify({ kind, status }) });
          load();
        } catch (e) { setWpErr(e.message); }
        setBusy('');
      };
      const counts = (ob && ob.track && ob.track.counts) || null;
      const pct = counts && counts.items ? Math.round((counts.complete / counts.items) * 100) : 0;
      const cg = wp && wp.caregiver;
      return (
        <div>
          <p className="text-sm text-gray-600 mb-2">
            {counts ? `${counts.complete} of ${counts.items} onboarding items complete (${pct}%).` : obErr ? obErr : 'Loading onboarding…'}
            {counts && counts.waitingOnHer ? ` ${counts.waitingOnHer} waiting on them.` : ''}
          </p>
          {counts && <div className="mg-bar"><span style={{ width: `${pct}%` }} /></div>}
          <a href={`/onboarding?person=${encodeURIComponent(user.id)}`} className="mg-btn mg-ghost mg-sm">Open full onboarding</a>
          {srIsCaregiver(user) && (
            <div className="mt-5 border-t pt-4">
              <h4 className="font-medium text-gray-800 mb-1">Welcome Packet & Clearance</h4>
              {wpErr && <p className="text-sm text-red-600 mb-2">{wpErr}</p>}
              {!cg && !wpErr && <p className="text-sm text-gray-500">Loading…</p>}
              {cg && (
                <>
                  <p className="text-sm mb-3">
                    <span className={`mg-pill ${cg.cleared ? 'mg-ok' : 'mg-bad'}`}>{cg.cleared ? 'Cleared for shifts' : 'Not cleared for shifts'}</span>
                    {!cg.cleared && cg.clearanceMessage ? <span className="text-gray-600 ml-2">{cg.clearanceMessage}</span> : null}
                  </p>
                  {(cg.outstanding || []).length > 0 && (
                    <ul className="text-sm text-gray-700 list-disc pl-5 mb-3">
                      {cg.outstanding.map((o, i) => <li key={i}>{o.title || o.label || String(o.kind || o)}{o.waitingOn === 'us' ? ' (waiting on the office)' : ''}</li>)}
                    </ul>
                  )}
                  <h5 className="text-sm font-semibold text-gray-800 mb-2">Office-Checked Items</h5>
                  <div className="space-y-2">
                    {(cg.office || []).map(it => (
                      <div key={it.kind} className="flex flex-wrap items-center gap-3 p-2 bg-gray-50 rounded-lg">
                        <div className="flex-1 min-w-[160px] text-sm">
                          <b>{it.title}</b>{it.required ? '' : ' (optional)'}
                          {it.officeByName && <div className="text-xs text-gray-500">Set by {it.officeByName} {String(it.officeAt || '').slice(0, 10)}</div>}
                        </div>
                        <select className="px-2 py-1.5 border rounded-lg text-sm" value={it.officeStatus || ''} disabled={busy === it.kind}
                          onChange={e => setItem(it.kind, e.target.value)}>
                          {!it.officeStatus && <option value="">Not set</option>}
                          {(wp.officeStatuses || []).map(st => <option key={st} value={st}>{String(st).replace(/_/g, ' ')}</option>)}
                        </select>
                      </div>
                    ))}
                  </div>
                </>
              )}
            </div>
          )}
        </div>
      );
    };

    // What a caregiver filed, newest first, each linking to where it lives.
    const StaffActivityPanel = ({ token, user }) => {
      const [d, setD] = React.useState(null);
      const [err, setErr] = React.useState('');
      React.useEffect(() => {
        setD(null); setErr('');
        Promise.all([
          srFetch(token, '/api/caregiver/visit-logs'),
          srFetch(token, '/api/caregiver/escalations'),
          srFetch(token, '/api/caregiver/incidents').catch(() => ({ incidents: [] }))
        ]).then(([v, e, i]) => {
          const mine = (rows) => (rows || []).filter(r => r && String(r.caregiver_id || r.caregiverId) === String(user.id));
          setD({ logs: mine(v.visitLogs), escalations: mine(e.escalations), incidents: mine(i.incidents) });
        }).catch(x => setErr(x.message));
      }, [token, user.id]);
      if (err) return <p className="text-sm text-red-600">{err}</p>;
      if (!d) return <p className="text-sm text-gray-500">Loading…</p>;
      const row = (label, list, href) => (
        <a href={href} className="flex items-center justify-between p-3 bg-gray-50 rounded-lg hover:bg-gray-100">
          <span className="text-sm text-gray-800"><b>{list.length}</b> {label}</span>
          <span className="text-xs text-gray-500">{list[0] ? `Latest ${String(list[0].submittedAt || list[0].raisedAt || list[0].reported_at || '').slice(0, 10)}` : 'None yet'}</span>
        </a>
      );
      return (
        <div className="space-y-2">
          {row('visit logs filed', d.logs, '/caregivers')}
          {row('concerns raised (escalations)', d.escalations, '/caregivers')}
          {row('incident reports', d.incidents, '/incidents')}
        </div>
      );
    };

    // The record's own sections below the account form.
    // At module scope: a component declared inside another is a new type on
    // every render, so React remounts it and a half-chosen file is lost.
    const StaffRecordSec = ({ id, title, children }) => (
      <div id={id} className="mg-card sr-sec"><h2 style={{ marginBottom: 10 }}>{title}</h2>{children}</div>
    );
    const StaffRecordPanels = ({ token, user }) => {
      const Sec = StaffRecordSec;
      return (
        <>
          <Sec id="sr-documents" title="Documents">
            <CaregiverDocsSection token={token} caregiverId={user.id} caregiverName={user.name} inRecord />
            <StaffSignedList token={token} user={user} />
            {/* Documents the office sent this person to sign (owner, 2026-11-09). */}
            <h3 style={{ margin: '18px 0 6px' }}>Sent to Sign</h3>
            {window.GFCDocSign ? <window.GFCDocSign.OfficeDocuments userId={String(user.id)} userName={user.name} /> : null}
          </Sec>
          <Sec id="sr-onboarding" title="Onboarding & Clearance">
            <StaffOnboardingPanel token={token} user={user} />
          </Sec>
          {srIsCaregiver(user) && (
            <Sec id="sr-activity" title="Activity">
              <StaffActivityPanel token={token} user={user} />
            </Sec>
          )}
        </>
      );
    };

    const CaregiverDocsSection = ({ token, caregiverId, caregiverName, inRecord }) => {
      const [docs, setDocs] = React.useState([]);
      const [kinds, setKinds] = React.useState([]);
      const [kind, setKind] = React.useState('');
      const [file, setFile] = React.useState(null);
      const [busy, setBusy] = React.useState(false);
      const [msg, setMsg] = React.useState(null);
      const fileRef = React.useRef(null);

      const load = React.useCallback(async () => {
        // OWNER REPORT, 2026-09-14: documents uploaded for one caregiver were
        // showing on every other caregiver's form. The list is fetched per
        // caregiver correctly — but this component is not remounted when the
        // admin opens a different user, so the PREVIOUS caregiver's rows stayed
        // in state. They stayed for good if the new fetch failed, because a
        // failed fetch resolves to { error } and never calls setDocs.
        //
        // So the list is cleared FIRST, on every caregiver change. An empty
        // list while the fetch is in flight is honest; somebody else's
        // paperwork under this caregiver's name is not.
        setDocs([]);
        setMsg(null);
        if (!caregiverId) return;   // not saved yet — there is nothing to file against
        const [d, k] = await Promise.all([
          api.listCaregiverDocs(token, caregiverId),
          api.getCaregiverDocKinds(token)
        ]);
        if (d && Array.isArray(d.documents)) setDocs(d.documents);
        else if (d && d.error) setMsg({ ok: false, text: `Could not load this caregiver's documents: ${d.error}` });
        if (k && Array.isArray(k.kinds)) {
          setKinds(k.kinds);
          // The catalog decides the default, so no kind is named in this page.
          setKind(cur => cur || (k.kinds.find(x => x.payroll) || k.kinds[0] || {}).kind || '');
        }
      }, [token, caregiverId]);

      React.useEffect(() => { load(); }, [load]);

      const upload = async () => {
        if (!file) { setMsg({ ok: false, text: 'Choose a file first.' }); return; }
        if (file.size > 10 * 1024 * 1024) { setMsg({ ok: false, text: 'That file is over 10 MB.' }); return; }
        setBusy(true); setMsg(null);
        try {
          const b64 = await new Promise((resolve, reject) => {
            const r = new FileReader();
            r.onload = () => resolve(r.result);
            r.onerror = () => reject(new Error('read failed'));
            r.readAsDataURL(file);
          });
          const res = await api.uploadCaregiverDoc(token, {
            caregiverId, kind, fileName: file.name, fileDataB64: b64
          });
          if (res && res.error) {
            setMsg({ ok: false, text: [res.error, res.hint, res.setup && `Setup: ${res.setup}`].filter(Boolean).join(' — ') });
          }
          else {
            setMsg({ ok: true, text: 'Filed.' });
            setFile(null);
            if (fileRef.current) fileRef.current.value = '';
            await load();
          }
        } catch (e) {
          setMsg({ ok: false, text: e.message || 'That did not upload.' });
        }
        setBusy(false);
      };

      // Read back THROUGH THE APP, never a Drive link — that is what makes
      // the read audited and keeps the file un-shared.
      const open = async (d) => {
        setMsg(null);
        try {
          const res = await fetch(`${API_URL}/api/caregiver/documents/${d.id}/file`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (!res.ok) {
            // "That file could not be retrieved" was every failure wearing one
            // sentence — an expired session, a row with no file behind it, and a
            // missing Drive scope all read identically, and none of them could be
            // acted on. Read the server's own answer instead.
            let body = null;
            try { body = await res.json(); } catch (err) { /* not JSON */ }
            if (res.status === 401) throw new Error('Your session expired. Sign in again, then reopen this.');
            throw new Error([
              (body && body.error) || `The server answered ${res.status}.`,
              body && body.hint,
              body && body.setup && `Setup: ${body.setup}`
            ].filter(Boolean).join(' — '));
          }
          const url = URL.createObjectURL(await res.blob());
          window.open(url, '_blank');
          setTimeout(() => URL.revokeObjectURL(url), 60000);
        } catch (e) { setMsg({ ok: false, text: e.message }); }
      };

      // Accept, or send back with a reason, right on the record (owner,
      // 2026-11-09). The same route Caregiver Management's queue uses; the
      // server decides who may review (the caregiver office).
      const [why, setWhy] = React.useState({});
      const review = async (d, decision) => {
        setMsg(null);
        try {
          await srFetch(token, `/api/caregiver/documents/${encodeURIComponent(d.id)}/review`, {
            method: 'POST', body: JSON.stringify({ decision, reason: why[d.id] || '' })
          });
          setMsg({ ok: true, text: decision === 'accepted' ? 'Accepted.' : 'Sent back with your reason.' });
          await load();
        } catch (e) { setMsg({ ok: false, text: e.message }); }
      };

      const remove = async (d) => {
        if (!window.confirm(`Remove ${d.kindLabel} "${d.fileName}"? This deletes the stored file.`)) return;
        const res = await api.deleteCaregiverDoc(token, d.id);
        if (res && res.error) setMsg({ ok: false, text: res.error });
        else { setMsg({ ok: true, text: 'Removed.' }); await load(); }
      };

      if (!caregiverId) {
        return (
          <div className="mt-5 border-t pt-4">
            <h4 className="font-medium text-gray-800 mb-1">Documents</h4>
            <p className="text-xs text-gray-500">Save this caregiver first, then their documents can be filed here.</p>
          </div>
        );
      }

      return (
        <div className={inRecord ? '' : 'mt-5 border-t pt-4'}>
          {!inRecord && <h4 className="font-medium text-gray-800 mb-1">Documents</h4>}
          <p className="text-xs text-gray-500 mb-3">
            Photo ID, paystub and W-9 for onboarding, plus anything {caregiverName || 'this caregiver'} has
            sent in. These are the office's copies. <span className="font-medium">The W-4, G-4, I-9 and direct deposit are filled in by the
            caregiver in My GFC, under Hours &amp; Pay</span>, not uploaded here.
          </p>

          <div className="flex flex-wrap items-end gap-2 mb-3">
            <div className="flex-1 min-w-[180px]">
              <label className="block text-xs font-medium text-gray-600 mb-1">Type</label>
              <select className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm"
                value={kind} onChange={(e) => setKind(e.target.value)}>
                {kinds.map(k => <option key={k.kind} value={k.kind}>{k.label}</option>)}
              </select>
            </div>
            <div className="flex-1 min-w-[200px]">
              <label className="block text-xs font-medium text-gray-600 mb-1">File</label>
              <input ref={fileRef} type="file" accept="image/*,application/pdf"
                className="w-full text-sm"
                onChange={(e) => { setFile(e.target.files && e.target.files[0]); setMsg(null); }} />
            </div>
            <button type="button" onClick={upload} disabled={busy || !file || !kind}
              className="px-4 py-2 bg-gray-900 text-white rounded-lg text-sm disabled:opacity-50">
              {busy ? 'Uploading…' : 'Upload'}
            </button>
          </div>

          {msg && (
            <p className={`text-xs mb-2 ${msg.ok ? 'text-green-700' : 'text-red-600'}`}>{msg.text}</p>
          )}

          {docs.length === 0
            ? <p className="text-sm text-gray-500 py-2">Nothing on file yet.</p>
            : (
              <div className="space-y-2">
                {docs.map(d => (
                  <div key={d.id} className="p-2 bg-gray-50 rounded-lg">
                    <div className="flex items-center gap-3">
                    <div className="flex-1 min-w-0">
                      <div className="text-sm font-medium text-gray-800 truncate">
                        {d.kindLabel}
                        {d.payroll && <span className="ml-2 text-[10px] uppercase tracking-wide text-gray-500">payroll</span>}
                      </div>
                      {d.note && (
                        <div className="text-xs text-gray-600 truncate">{d.note}</div>
                      )}
                      <div className="text-xs text-gray-500 truncate">
                        {d.fileName} · {String(d.uploadedAt).slice(0, 10)}
                        {/* Who filed it. "The caregiver sent this" and "the office
                            filed it for them" are different facts. */}
                        {d.uploadedByOffice ? ' · filed by the office' : ' · sent in by the caregiver'}
                        {d.status !== 'received' && d.status !== 'accepted' ? ` · ${d.status}` : ''}
                      </div>
                    </div>
                    <button type="button" onClick={() => open(d)}
                      className="px-3 py-1.5 border border-gray-300 rounded-lg text-xs">Open</button>
                    <button type="button" onClick={() => remove(d)}
                      className="px-3 py-1.5 border border-red-200 text-red-600 rounded-lg text-xs">Remove</button>
                    </div>
                    {d.status === 'received' && (
                      <div className="flex flex-wrap items-center gap-2 mt-2">
                        <span className="text-xs font-semibold text-amber-800">Waiting on review</span>
                        <input className="flex-1 min-w-[160px] px-2 py-1 border border-gray-200 rounded-lg text-xs" placeholder="Reason, if sending it back"
                          value={why[d.id] || ''} onChange={e => setWhy({ ...why, [d.id]: e.target.value })} />
                        <button type="button" onClick={() => review(d, 'accepted')} className="px-3 py-1.5 rounded-lg text-xs text-white" style={{ backgroundColor: '#033D50' }}>Accept</button>
                        <button type="button" disabled={!(why[d.id] || '').trim()} onClick={() => review(d, 'rejected')} className="px-3 py-1.5 border border-gray-300 rounded-lg text-xs disabled:opacity-50">Send Back</button>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}
        </div>
      );
    };

    // Stash the admin's own tokens, put the viewed person's token in every key
    // a page reads, and go where their own login would send them. Exit (the
    // banner from session-guard.js) puts the admin's tokens back.
    const VIEW_AS_TOKEN_KEYS = ['unified_token', 'admin_token', 'portal_token', 'unified_user', 'admin_user', 'portal_user'];
    const startViewAs = async (token, user, setMessage) => {
      if (!window.confirm(`View the app as ${user.name || user.email}?\n\nYou will see and use exactly what they do for up to 60 minutes. Signing anything, OpenEMR and their account settings stay off. Emails and notifications still send for real.\n\nEvery action is logged as you acting as them. Use the Exit button in the gold banner to come back.`)) return;
      const result = await api.startViewAs(token, user.id);
      if (result.error || !result.token) { setMessage(`Error: ${result.error || 'Could not start View as.'}`); return; }
      const tokens = {};
      VIEW_AS_TOKEN_KEYS.forEach(k => { const v = localStorage.getItem(k); if (v) tokens[k] = v; });
      localStorage.setItem('gfc_view_as_return', JSON.stringify({ tokens, startedAt: new Date().toISOString() }));
      ['unified_token', 'admin_token', 'portal_token'].forEach(k => localStorage.setItem(k, result.token));
      ['unified_user', 'admin_user', 'portal_user'].forEach(k => localStorage.setItem(k, JSON.stringify(result.user)));
      window.location.href = result.destination || '/login';
    };

    // A page that hits an error while drawing used to blank the whole Admin Hub
    // with no clue why (owner report, 2026-10-21). This shows what failed and
    // keeps the menu working. `quiet` hides a non-essential panel instead.
    class PageErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(error) { return { error }; }
      componentDidCatch(error, info) { console.error('[admin-hub] page error:', error, info && info.componentStack); }
      componentDidUpdate(prev) { if (prev.resetKey !== this.props.resetKey && this.state.error) this.setState({ error: null }); }
      render() {
        if (!this.state.error) return this.props.children;
        if (this.props.quiet) return null;
        return (
          <div className="bg-red-50 border border-red-200 rounded-xl p-6 text-red-800">
            <p className="font-semibold">This page could not be shown.</p>
            <p className="text-sm mt-1">Refresh to try again. If it keeps happening, send this message to support:</p>
            <pre className="text-xs mt-3 whitespace-pre-wrap break-words">{String((this.state.error && (this.state.error.stack || this.state.error.message)) || this.state.error).slice(0, 1500)}</pre>
          </div>
        );
      }
    }

    // Shared with the Clients page (public/client-account-ui.js): the POA
    // login move and the pay and rate queue, one copy for both screens.
    const { PoaCutoverDialog, FinancialChangeQueue } = window.GFCClientAccount;

    // ── Veterans (IME) (owner, 2026-10-30) ───────────────────────────────────
    // The vendor's list of veterans for each exam day, assigned to a provider.

    const UsersPage = ({ token, isSuperAdmin, user: me }) => {
      const [users, setUsers] = useState([]);
      const [projects, setProjects] = useState([]);
      const [clients, setClients] = useState([]);
      const [clientPortals, setClientPortals] = useState([]);
      const [passwordResets, setPasswordResets] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showForm, setShowForm] = useState(false);
      const [editingUser, setEditingUser] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');
      // The Portal Hub opens User Management on one side of the People / Clients
      // split (owner, 2026-11-09): ?group=staff is our team, ?group=clients is
      // client and family accounts.
      const [roleFilter, setRoleFilter] = useState(() => {
        try {
          const g = new URLSearchParams(window.location.search).get('group');
          // Clients and family have their own area now (owner, 2026-11-09).
          if (g === 'clients') { window.location.replace('/clients'); return 'all'; }
          return g === 'staff' ? g : 'all';
        }
        catch (e) { return 'all'; }
      });
      const [message, setMessage] = useState('');
      // Enrollment is the natural next step after adding a client — offered
      // rather than forced, so the admin can also just keep managing users.
      const [justCreatedClientId, setJustCreatedClientId] = useState(null);
      const [cutoverFor, setCutoverFor] = useState(null);
      const [cutoverInitial, setCutoverInitial] = useState(null);
      // A create refused because the email is already someone's login: whose,
      // and what was being created, so the form can offer the right next step.
      const [emailClash, setEmailClash] = useState(null);
      const [clashBusy, setClashBusy] = useState(false);
      const [activeTab, setActiveTab] = useState('list');
      const [saving, setSaving] = useState(false);
      const [showBulkReset, setShowBulkReset] = useState(false);
      const [bulkResetType, setBulkResetType] = useState('users');
      const [bulkResetResults, setBulkResetResults] = useState(null);
      const [bulkResetLoading, setBulkResetLoading] = useState(false);
      const logoInputRef = useRef(null);

      const defaultFormData = {
        name: '', email: '', password: '', phone: '', role: 'user',
        isManager: false,
        // THE ONE ACCOUNT TYPE (owner, 2026-10-15). It sets role, isManager and
        // clinicalRole; the form never sets those three on its own. Empty until
        // an admin chooses one, so a new account is never a guess.
        accountType: '', managerClinicalAccess: '',
        hasImplementationsAccess: false,
        practiceName: '', isNewClient: false, existingPortalSlug: '',
        logo: '', hubspotCompanyId: '', hubspotDealId: '', hubspotContactId: '',
        assignedProjects: [], projectAccessLevels: {}, assignedClients: [],
        sendWelcomeEmail: true,
        // GFC extended fields
        licenseLevel: '', hasClinicalAccess: false, clinicalRole: '', enrollmentStatus: 'intake_pending',
        careTeam: { assignedFNPs: [], assignedCaseManager: '', primaryCaregiver: '', backupCaregiver: '', careCoordinators: [] },
        // family role: every patient this person is linked to, each with its
        // own POA tick (owner, 2026-10-20). One login can cover several.
        familyLinks: [],
        // client role: no email of their own; the server makes a placeholder
        // login and the POA signs in with their own account.
        noEmail: false,
        loginHeldByPoa: false,
        openEmrProviderId: '', // clinician: OpenEMR provider (numeric id) their calendar maps to (4.2)
        npi: '', // clinician: individual NPI, stamped on every clinical write (4.4 attribution)
        // ── Session 4.10 ── WHAT this prescriber is, and what they are
        // registered and enrolled to do. `clinicalRole: 'provider'` covers an MD
        // and an NP alike and cannot tell them apart; `licenseLevel` is free
        // text that gates nothing. So both are structured, admin-set, and
        // nothing in the app infers either.
        prescriberCredential: '', employmentType: '',
        deaNumber: '', deaSchedules: [], deaExpiresAt: '',
        medicareEnrollment: { status: '', effectiveDate: '' },
        // What WE PAY a caregiver — never the same number as the client's
        // billed rate below; the gap between them is the margin.
        payRate: '',
        clientPayRates: {},
        // What the CLIENT is billed. Settable at creation because the financial
        // agreement and the home care service agreement both print it and
        // neither can be signed without it.
        rateAgreement: { hourlyRate: '', dailyMinimumHours: '' }
      };
      const [formData, setFormData] = useState(defaultFormData);
      // Competencies live OUTSIDE formData on purpose — formData is round-tripped
      // to PUT /api/users, and these save through the caregiver route instead.
      const [competencyCatalog, setCompetencyCatalog] = useState([]);
      const [competencies, setCompetencies] = useState([]);
      // Session 4.8 — served, not hardcoded (see api.getClinicalRoles).
      const [clinicalRoleCatalog, setClinicalRoleCatalog] = useState([]);
      // Account types and the manager's clinical access levels, served by
      // GET /api/admin/clinical-roles (accountTypes.js) — never listed here.
      const [accountTypeCatalog, setAccountTypeCatalog] = useState([]);
      const [managerAccessCatalog, setManagerAccessCatalog] = useState([]);
      const [defaultManagerAccess, setDefaultManagerAccess] = useState('view');
      // Account recovery: OpenEMR connection status for whoever is being
      // edited. Fetched on demand when the form opens — like competencies,
      // it lives outside formData because it is not a field the save
      // round-trips, it is a live status read fresh each time.
      const [emrStatus, setEmrStatus] = useState(null);
      const [changePassword, setChangePassword] = useState(false);
      const [emrStatusLoading, setEmrStatusLoading] = useState(false);
      const [accessActionBusy, setAccessActionBusy] = useState(false);

      const selectedClinicalRole = clinicalRoleCatalog.find(r => r.value === formData.clinicalRole) || null;
      const pendingRoleReview = users.filter(u => u.clinicalRoleAutoAssigned && u.clinicalRole);
      // Accounts the account-type migration could not place (owner, 2026-10-15).
      const pendingTypeReview = users.filter(u => u.accountTypeNeedsReview);
      const accountTypeLabel = (u) => {
        const t = accountTypeCatalog.find(x => x.value === u.accountType);
        return t ? t.label : 'Choose a type';
      };
      // Choosing a type sets the fields it decides, from the SERVED mapping.
      const chooseAccountType = (value) => {
        const t = accountTypeCatalog.find(x => x.value === value);
        if (!t) { setFormData({ ...formData, accountType: '' }); return; }
        const access = value === 'manager' ? (formData.managerClinicalAccess || defaultManagerAccess) : '';
        const lvl = managerAccessCatalog.find(a => a.value === access);
        const clinicalRole = value === 'manager' ? ((lvl && lvl.clinicalRole) || '') : (t.fields.clinicalRole || '');
        setFormData({ ...formData, accountType: value, role: t.fields.role, isManager: t.fields.isManager,
          clinicalRole, hasClinicalAccess: t.fields.hasClinicalAccess, managerClinicalAccess: access });
      };
      const chooseManagerAccess = (value) => {
        const lvl = managerAccessCatalog.find(a => a.value === value);
        setFormData({ ...formData, managerClinicalAccess: value, clinicalRole: (lvl && lvl.clinicalRole) || '' });
      };
      // Session 4.11 B2 — the same pattern, for the same reason: an owner item is
      // only open for the owner once there is somewhere to do it. A console line
      // is not where an admin works.
      const missingPatientFacingCredential = users.filter(u => u.patientFacingCredentialMissing);

      const competencyFor = (task) => competencies.find(c => c.task === task) || null;
      const toggleCompetency = (task) => {
        setCompetencies(prev => prev.some(c => c.task === task)
          ? prev.filter(c => c.task !== task)
          : prev.concat([{ task, verified: true, expiry: null }]));
      };
      const setCompetencyExpiry = (task, expiry) => {
        setCompetencies(prev => prev.map(c => c.task === task ? { ...c, expiry: expiry || null } : c));
      };
      // Mirrors caregiverRepository.verifiedCompetencies: an expired sign-off is
      // NOT PRESENT, so the form says so rather than showing a tick that lies.
      const isExpired = (c) => !!(c && c.expiry && new Date(c.expiry) < new Date());

      useEffect(() => { loadData(); }, []);

      useEffect(() => {
        api.getCompetencyCatalog(token).then(r => {
          if (r && Array.isArray(r.competencies)) setCompetencyCatalog(r.competencies);
        });
        api.getClinicalRoles(token).then(r => {
          if (r && Array.isArray(r.roles)) setClinicalRoleCatalog(r.roles);
          if (r && Array.isArray(r.accountTypes)) setAccountTypeCatalog(r.accountTypes);
          if (r && Array.isArray(r.managerClinicalAccess)) setManagerAccessCatalog(r.managerClinicalAccess);
          if (r && r.defaultManagerClinicalAccess) setDefaultManagerAccess(r.defaultManagerClinicalAccess);
        });
      }, [token]);

      const [financialPending, setFinancialPending] = useState([]);
      const loadFinancial = () => fetch('/api/users/financial-change-requests?status=pending', { headers: { 'Authorization': `Bearer ${token}` } })
        .then(r => r.json()).then(r => setFinancialPending(Array.isArray(r.requests) ? r.requests : [])).catch(() => {});

      const loadData = async () => {
        setLoading(true);
        loadFinancial();
        const [usersRes, projectsRes, resetsRes, portalsRes] = await Promise.all([
          api.getUsers(token),
          api.getProjects(token),
          api.getPasswordResetRequests(token),
          fetch('/api/client-portals', { headers: { 'Authorization': `Bearer ${token}` } }).then(r => r.json()).catch(() => [])
        ]);
        if (!usersRes.error) setUsers(usersRes);
        if (!projectsRes.error) setProjects(projectsRes);
        if (!resetsRes.error) setPasswordResets(resetsRes);
        // THE ASSIGNED-CLIENTS PICKER WAS ALWAYS EMPTY, and this is why.
        // It fetched `/api/clients` — a LAB-ERA endpoint that does not exist
        // anywhere in this server. The request 404'd, `.json()` threw, and
        // `.catch(() => [])` swallowed it, so the list was `[]` on every load
        // and the form said "No clients available" forever. No caregiver could
        // be assigned to anyone through this screen, which is the thing that
        // gates a caregiver's access to a client at all.
        //
        // A GFC client IS a user with role 'client'. That list is already
        // loaded, so the picker reads it rather than a second endpoint that
        // can go missing without anyone noticing.
        if (Array.isArray(usersRes)) setClients(usersRes.filter(u => u && u.role === 'client'));
        if (Array.isArray(portalsRes)) setClientPortals(portalsRes);
        setLoading(false);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setMessage('');
        setEmailClash(null);
        setSaving(true);
        try {
          let result;
          if (editingUser) {
            const updateData = { ...formData };
            delete updateData.password;
            if (changePassword && formData.password) {
              updateData.password = formData.password;
              updateData.resetPassword = true;
            }
            result = await api.updateUser(token, editingUser.id, updateData);
          } else {
            result = await api.createUserDetailed(token, formData);
            if (result && result.existingUser) setEmailClash({ ...result.existingUser, form: formData });
          }
          console.log('API Result:', result);
          if (result.error) {
            setMessage(`Error: ${result.error}`);
          } else {
            // A manager's pay change is held for the Super Admin; the server says which.
            let note = result.message || (editingUser ? 'User updated successfully' : 'User created successfully');
            // Competencies go to the caregiver route, after the user exists.
            if (formData.role === 'vendor') {
              const savedId = (editingUser && editingUser.id) || result.id || (result.user && result.user.id);
              if (savedId) {
                const cRes = await api.setCompetencies(token, savedId, competencies);
                if (cRes && cRes.error) note += `, but the competencies did not save: ${cRes.error}`;
                else if (competencies.length) note += ` — ${competencies.length} competenc${competencies.length === 1 ? 'y' : 'ies'} recorded`;
              }
            }
            setMessage(note);
            setShowForm(false);
            setEditingUser(null);
            setFormData(defaultFormData);
            setChangePassword(false);
            setCompetencies([]);
            // A newly created client's natural next step is enrollment — offer
            // it instead of leaving the admin to go find it. An edit, or any
            // other role, just closes as before.
            if (!editingUser && formData.role === 'client') {
              const newClientId = result.id || (result.user && result.user.id);
              if (newClientId) setJustCreatedClientId(newClientId);
            }
            loadData();
          }
        } catch (err) {
          console.error('Submit error:', err);
          setMessage(`Error: ${err.message || 'Unknown error occurred'}`);
        } finally {
          setSaving(false);
        }
      };

      // ?view=users&person=<id> opens that staff member's record (owner,
      // 2026-11-09), so a record has an address the queues and the hub can
      // link to. Read once, after the list has loaded.
      const [personLink, setPersonLink] = useState(() => {
        try { return new URLSearchParams(window.location.search).get('person'); } catch (e) { return null; }
      });
      useEffect(() => {
        if (!personLink || !users.length) return;
        const u = users.find(x => String(x.id) === String(personLink));
        setPersonLink(null);
        if (u) {
          handleEdit(u);
          const hash = window.location.hash;
          if (hash) setTimeout(() => srJump(hash.slice(1)), 400);
        }
      }, [personLink, users]);
      const setRecordUrl = (id) => {
        try {
          const q = new URLSearchParams(window.location.search);
          if (id) q.set('person', id); else q.delete('person');
          q.set('view', 'users');
          window.history.replaceState(null, '', `${window.location.pathname}?${q.toString()}`);
        } catch (e) { /* the address bar is a convenience */ }
      };

      const handleEdit = (user) => {
        // A client or family account opens on the Clients page, the one place
        // they are edited (owner, 2026-11-09).
        if (user && user.role === 'client') { window.location.href = `/clients?client=${encodeURIComponent(user.id)}`; return; }
        if (user && user.role === 'family') { window.location.href = `/clients?family=${encodeURIComponent(user.id)}`; return; }
        setChangePassword(false);
        if (user && !['client', 'family'].includes(user.role)) { setRecordUrl(user.id); window.scrollTo(0, 0); }
        setEditingUser(user);
        setFormData({
          name: user.name || '',
          email: user.email || '',
          password: '',
          phone: user.phone || '',
          role: user.role || 'user',
          isManager: user.isManager || false,
          accountType: user.accountType || '',
          managerClinicalAccess: user.managerClinicalAccess || '',
          hasImplementationsAccess: user.hasImplementationsAccess || false,
          practiceName: user.practiceName || '',
          isNewClient: user.isNewClient || false,
          logo: user.logo || '',
          hubspotCompanyId: user.hubspotCompanyId || '',
          hubspotDealId: user.hubspotDealId || '',
          hubspotContactId: user.hubspotContactId || '',
          assignedProjects: user.assignedProjects || [],
          projectAccessLevels: user.projectAccessLevels || {},
          assignedClients: user.assignedClients || [],
          existingPortalSlug: '',
          // GFC extended fields
          licenseLevel: user.licenseLevel || '',
          hasClinicalAccess: user.hasClinicalAccess || false,
          // Session 4.8 — the credential, not a boolean. Round-tripped from
          // GET /api/users, or the form save would wipe it.
          clinicalRole: user.clinicalRole || '',
          clinicalRoleAutoAssigned: !!user.clinicalRoleAutoAssigned,
          enrollmentStatus: user.enrollmentStatus || 'intake_pending',
          careTeam: { assignedFNPs: [], assignedCaseManager: '', primaryCaregiver: '', backupCaregiver: '', careCoordinators: [], ...(user.careTeam || {}) },
          familyLinks: Array.isArray(user.familyLinks) ? user.familyLinks.map(l => ({ clientId: l.clientId, isPoa: !!l.isPoa, relationship: l.relationship || '' })) : [],
          noEmail: false,
          loginHeldByPoa: !!user.loginHeldByPoa,
          openEmrProviderId: user.openEmrProviderId || '',
          npi: user.npi || '',
          // Session 4.10 — round-tripped for the same reason clinicalRole is: a
          // field the form does not carry is a field the save wipes, and wiping
          // a DEA registration silently stops a prescriber recording a
          // controlled substance with nobody having decided that.
          prescriberCredential: user.prescriberCredential || '',
          employmentType: user.employmentType || '',
          deaNumber: user.deaNumber || '',
          deaSchedules: Array.isArray(user.deaSchedules) ? user.deaSchedules : [],
          deaExpiresAt: user.deaExpiresAt || '',
          medicareEnrollment: {
            status: (user.medicareEnrollment && user.medicareEnrollment.status) || '',
            effectiveDate: (user.medicareEnrollment && user.medicareEnrollment.effectiveDate) || ''
          },
          medicareEnrollmentVerified: (user.medicareEnrollment && user.medicareEnrollment.verifiedAt) || null,
          medicareEnrollmentVerifiedBy: (user.medicareEnrollment && user.medicareEnrollment.verifiedBy) || null,
          payRate: user.payRate === null || user.payRate === undefined ? '' : String(user.payRate),
          clientPayRates: user.clientPayRates || {},
          // Read-only on EDIT: changing a signed rate has consent consequences
          // and belongs on the enrollment rate screen, which handles them.
          rateAgreement: user.rateAgreement || { hourlyRate: '', dailyMinimumHours: '' }
        });
        setCompetencies((user.skilledCompetencies || [])
          .filter(c => c && c.verified)
          .map(c => ({ task: c.task, verified: true, expiry: c.expiry || null })));
        setEmrStatus(null);
        if (user.hasClinicalAccess) refreshEmrStatus(user.id);
        setShowForm(true);
      };

      // Account recovery — the admin-hub half of the two routes above. Both
      // actions are independent of each other and of the password field:
      // resetting MFA does not touch OpenEMR, disconnecting OpenEMR does not
      // touch MFA, and neither touches the password.
      const refreshEmrStatus = async (userId) => {
        setEmrStatusLoading(true);
        const result = await api.getEmrStatus(token, userId);
        setEmrStatusLoading(false);
        if (!result.error) setEmrStatus(result);
      };

      const resetUserMfa = async (user) => {
        if (!window.confirm(`Reset ${user.name}'s authenticator?\n\nThis deletes their current enrollment and signs them out of every active session immediately. They will set up a new authenticator (scan a fresh QR code) the next time they log in.`)) return;
        setAccessActionBusy(true);
        const result = await api.resetUserMfa(token, user.id);
        setAccessActionBusy(false);
        if (result.error) { setMessage(`Error: ${result.error}`); return; }
        setMessage(result.hadEnrollment
          ? `Authenticator reset for ${user.name}. ${result.sessionsRevoked} active session(s) ended — they'll get a new QR code next login.`
          : `${user.name} had no authenticator enrolled yet.`);
        setEditingUser(prev => (prev && prev.id === user.id) ? { ...prev, mfaEnrolled: false } : prev);
        loadData();
      };

      const disconnectUserEmr = async (user) => {
        if (!window.confirm(`Disconnect ${user.name}'s OpenEMR connection?\n\nThey will need to sign in to OpenEMR again the next time they open a chart. This does not change their OpenEMR password — that is set in OpenEMR itself, not here.`)) return;
        setAccessActionBusy(true);
        const result = await api.disconnectUserEmr(token, user.id);
        setAccessActionBusy(false);
        if (result.error) { setMessage(`Error: ${result.error}`); return; }
        setMessage(result.disconnected
          ? `${user.name}'s OpenEMR connection was cleared. They'll be asked to sign in again next time.`
          : `${user.name} had no active OpenEMR connection.`);
        refreshEmrStatus(user.id);
      };

      // Email them a reset link. DELIBERATELY NOT the password field above:
      // that one sets a password an admin then has to read out over the phone,
      // which is how a password ends up in a text message. This generates a
      // temporary one, emails a secure link, and never returns the password —
      // so the copy must not imply the admin now knows it.
      const emailResetLink = async (user) => {
        if (!window.confirm(`Email ${user.name || 'this user'} a password reset link?\n\nTheir current password stops working straight away and a secure link is emailed to ${user.email}. You will not be shown the new password — they set their own from the link.`)) return;
        setAccessActionBusy(true);
        const result = await api.emailPasswordReset(token, user.id);
        setAccessActionBusy(false);
        // A placeholder login is refused with a specific, actionable sentence
        // (RESET_PLACEHOLDER_LOGIN names the POA to reset instead). Surface the
        // server's own words — a generic failure sends somebody to the wrong fix.
        if (result.error) { setMessage(`Error: ${result.error}`); return; }
        setMessage(`A password reset link has been emailed to ${user.email}. Their old password no longer works.`);
        loadData();
      };

      // End every session this person holds. For a lost or stolen device: it
      // does not change their password, so they sign in again with the one
      // they have.
      const revokeUserSessions = async (user) => {
        const isMe = !!(me && me.id === user.id);
        const warn = isMe
          ? `Sign yourself out everywhere?\n\nThis is your own account, so it ends THIS session too and you will have to sign in again. Your password is unchanged.`
          : `Sign ${user.name || 'this user'} out everywhere?\n\nEvery device they are signed in on is ended immediately. Their password is unchanged — they can sign straight back in with it, so reset the password too if the device is lost.`;
        if (!window.confirm(warn)) return;
        setAccessActionBusy(true);
        const result = await api.revokeUserSessions(token, user.id);
        setAccessActionBusy(false);
        if (result.error) { setMessage(`Error: ${result.error}`); return; }
        // `revoked` is a count, and 0 is a real answer: nobody was signed in.
        setMessage(result.revoked
          ? `${user.name || 'They'} ${result.revoked === 1 ? 'was' : 'were'} signed out of ${result.revoked} session${result.revoked === 1 ? '' : 's'}.`
          : `${user.name || 'They'} had no active sessions, so nothing was signed out.`);
      };

      const handleDelete = async (userId) => {
        if (!confirm('Are you sure you want to delete this user?')) return;
        const result = await api.deleteUser(token, userId);
        if (result.error) setMessage(`Error: ${result.error}`);
        else loadData();
      };

      const toggleEmailSubscription = async (user) => {
        const willUnsubscribe = !user.emailUnsubscribed;
        const action = willUnsubscribe ? 'unsubscribe' : 'resubscribe';
        if (!confirm(`Are you sure you want to ${action} ${user.name} from automated emails?`)) return;
        const result = await api.updateUser(token, user.id, { emailUnsubscribed: willUnsubscribe });
        if (result.error) { setMessage(`Error: ${result.error}`); return; }
        setMessage(`${user.name} has been ${willUnsubscribe ? 'unsubscribed from' : 'resubscribed to'} automated emails.`);
        loadData();
      };

      const toggleAccountStatus = async (user) => {
        if (user.role === 'admin') return;
        const currentlyActive = user.accountStatus !== 'inactive';
        const action = currentlyActive ? 'deactivate' : 'reactivate';
        if (!confirm(`Are you sure you want to ${action} ${user.name}'s account?${currentlyActive ? '\n\nThey will be unable to log in until reactivated.' : ''}`)) return;
        const newStatus = currentlyActive ? 'inactive' : 'active';
        const result = await api.updateUser(token, user.id, { accountStatus: newStatus });
        if (result.error) { setMessage(`Error: ${result.error}`); return; }
        setMessage(`Account ${currentlyActive ? 'deactivated' : 'reactivated'} successfully.`);
        loadData();
      };

      const toggleProjectAssignment = (projectId) => {
        const assigned = formData.assignedProjects.includes(projectId);
        let newAssigned, newLevels;
        if (assigned) {
          newAssigned = formData.assignedProjects.filter(id => id !== projectId);
          newLevels = { ...formData.projectAccessLevels };
          delete newLevels[projectId];
        } else {
          newAssigned = [...formData.assignedProjects, projectId];
          newLevels = { ...formData.projectAccessLevels, [projectId]: 'edit' };
        }
        setFormData({ ...formData, assignedProjects: newAssigned, projectAccessLevels: newLevels });
      };

      const setProjectAccessLevel = (projectId, level) => {
        setFormData({ ...formData, projectAccessLevels: { ...formData.projectAccessLevels, [projectId]: level } });
      };

      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 2 * 1024 * 1024) {
          setMessage('Error: Logo must be less than 2MB');
          return;
        }
        const reader = new FileReader();
        reader.onloadend = () => setFormData({ ...formData, logo: reader.result });
        reader.readAsDataURL(file);
      };

      const handlePasswordReset = async (requestId, userId) => {
        const newPassword = prompt('Enter new password for user:');
        if (!newPassword) return;
        const result = await api.updateUser(token, userId, { password: newPassword, resetPassword: true });
        if (!result.error) {
          await api.dismissPasswordReset(token, requestId);
          setMessage('Password reset successfully');
          loadData();
        } else {
          setMessage(`Error: ${result.error}`);
        }
      };

      const dismissReset = async (requestId) => {
        await api.dismissPasswordReset(token, requestId);
        loadData();
      };

      const handleBulkReset = async () => {
        if (!confirm(`Are you sure you want to reset passwords for ${'all staff (not admins, clients or family)'}? They will be required to change their password on next login.`)) return;
        setBulkResetLoading(true);
        setBulkResetResults(null);
        try {
          const response = await fetch('/api/admin/bulk-password-reset', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ userType: bulkResetType })
          });
          const result = await response.json();
          if (result.error) {
            setMessage(`Error: ${result.error}`);
          } else {
            setBulkResetResults(result.results);
            setMessage(result.message);
            loadData();
          }
        } catch (err) {
          setMessage(`Error: ${err.message || 'Network error'}`);
        }
        setBulkResetLoading(false);
      };


      // Export users to xlsx
      const exportUsersToXlsx = () => {
        // Prepare data for export
        const getRoleDisplay = (user) => accountTypeLabel(user);

        const clientNameById = new Map(users.filter(u => u.role === 'client').map(u => [u.id, u.name]));
        const exportData = users.filter(isStaffAccount).filter(user => isSuperAdmin || OFFICE_MANAGED_TYPES.includes(user.accountType)).map(user => ({
          'Name': user.name || '',
          'Email': user.email || '',
          'Account Type': getRoleDisplay(user),
          'Clinical Access (Manager)': user.managerClinicalAccess || '',
          'Practice/Company': user.practiceName || '',
          // Lab-era CRM ids — empty for every GFC user, so they are three
          // empty columns in every export. Flip SHOW_LAB_LEGACY_UI to bring
          // them back with the rest.
          ...(SHOW_LAB_LEGACY_UI ? {
            'HubSpot Company ID': user.hubspotCompanyId || '',
            'HubSpot Deal ID': user.hubspotDealId || '',
            'HubSpot Contact ID': user.hubspotContactId || ''
          } : {}),
          // Assignments are stored as client ids now (older rows may still carry a
          // name from before the picker was fixed) — resolve to a name either way.
          'Assigned Clients': Array.isArray(user.assignedClients)
            ? user.assignedClients.map(c => clientNameById.get(c) || c).join(', ') : '',
          'Created At': user.createdAt ? new Date(user.createdAt).toLocaleDateString() : '',
          'User ID': user.id || ''
        }));

        // Create workbook and worksheet
        const ws = XLSX.utils.json_to_sheet(exportData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Users');

        // Set column widths
        const colWidths = [
          { wch: 25 }, // Name
          { wch: 30 }, // Email
          { wch: 15 }, // Role
          { wch: 25 }, // Practice/Company
          { wch: 12 }, // Service Portal
          { wch: 12 }, // Admin Hub
          { wch: 15 }, // Implementations
          { wch: 15 }, // Client Portal Admin
          // Positional — these must rise and fall with the columns above, or
          // every width after them lands on the wrong column.
          ...(SHOW_LAB_LEGACY_UI ? [
            { wch: 18 }, // HubSpot Company ID
            { wch: 18 }, // HubSpot Deal ID
            { wch: 18 }  // HubSpot Contact ID
          ] : []),
          { wch: 30 }, // Assigned Clients
          { wch: 12 }, // Created At
          { wch: 38 }  // User ID
        ];
        ws['!cols'] = colWidths;

        // Generate filename with date
        const date = new Date().toISOString().split('T')[0];
        const filename = `gfc-users-${date}.xlsx`;

        // Download file
        XLSX.writeFile(wb, filename);
      };

      // Reset requests from staff only; client and family ones are on /clients.
      const staffResets = passwordResets.filter(r => isStaffAccount(users.find(u => u.id === r.userId)));
      const filteredUsers = users.filter(isStaffAccount).filter(user => isSuperAdmin || OFFICE_MANAGED_TYPES.includes(user.accountType)).filter(user => {
        // String(): one record with a malformed name must not blank the whole list.
        const q = String(searchTerm || '').toLowerCase();
        const matchesSearch = String(user.name || '').toLowerCase().includes(q) || String(user.email || '').toLowerCase().includes(q);
        const matchesRole = roleFilter === 'all' || roleFilter === 'staff' || user.role === roleFilter;
        return matchesSearch && matchesRole;
      });

      // A staff member being edited opens as a full-page RECORD (owner,
      // 2026-11-09); a new account, a client and a family contact keep the
      // pop-up. The list and banners are hidden while a record is open.
      const recordUser = showForm && editingUser && !['client', 'family'].includes(editingUser.role) ? editingUser : null;
      const closeRecord = () => { setShowForm(false); setEditingUser(null); setMessage(''); setEmailClash(null); setCompetencies([]); setEmrStatus(null); setRecordUrl(null); };

      return (
        <div className={recordUser ? 'space-y-6 sr-open' : 'space-y-6'}>
          <FinancialChangeQueue token={token} requests={financialPending} canDecide={isSuperAdmin} onChanged={loadData} />
          {cutoverFor && (
            <PoaCutoverDialog token={token} client={cutoverFor} users={users} initial={cutoverInitial}
              onClose={() => { setCutoverFor(null); setCutoverInitial(null); }}
              onDone={() => { setCutoverFor(null); setCutoverInitial(null); setShowForm(false); setEditingUser(null); setFormData(defaultFormData); setMessage(`${cutoverFor.name}'s login now belongs to their POA.`); loadData(); }} />
          )}
          {/* Session 4.8 — the reassignment queue. Clinical access stopped being
              one checkbox, and the migration could not tell an RN from an FNP,
              so it mapped everyone who had access to PROVIDER. That preserves
              what they could do, and it means a nurse currently holds
              prescribing rights until someone says otherwise. The boot log
              names them too, but the log scrubber redacts the addresses and a
              console line is not where an admin works. This banner stands
              until each role has been confirmed. */}
          {isSuperAdmin && pendingTypeReview.length > 0 && (
            <div className="bg-amber-50 border border-amber-300 p-4 rounded-xl">
              <p className="font-semibold text-amber-900">
                {pendingTypeReview.length} account{pendingTypeReview.length === 1 ? '' : 's'} need{pendingTypeReview.length === 1 ? 's' : ''} an account type
              </p>
              <p className="text-sm text-amber-800 mt-1">
                Each account now has one account type, and it decides what the person can do. These did not match a
                type, so nothing was guessed. Open each one, choose the type and save.
              </p>
              <div className="flex flex-wrap gap-2 mt-3">
                {pendingTypeReview.map(u => (
                  <button key={u.id} onClick={() => handleEdit(u)}
                    className="px-3 py-1.5 rounded-lg text-sm bg-white border border-amber-300 text-amber-900 hover:bg-amber-100">
                    {u.name}
                  </button>
                ))}
              </div>
            </div>
          )}
          {isSuperAdmin && pendingRoleReview.length > 0 && (
            <div className="bg-amber-50 border border-amber-300 p-4 rounded-xl">
              <p className="font-semibold text-amber-900">
                {pendingRoleReview.length} clinical role{pendingRoleReview.length === 1 ? '' : 's'} still need{pendingRoleReview.length === 1 ? 's' : ''} confirming
              </p>
              <p className="text-sm text-amber-800 mt-1">
                Everyone who had clinical access was mapped to <b>Provider</b>, which carries prescribing, placing
                orders on their own authority and signing billable encounters. Open each person and set their real
                credential — saving the form confirms it.
              </p>
              <div className="flex flex-wrap gap-2 mt-3">
                {pendingRoleReview.map(u => (
                  <button key={u.id} onClick={() => handleEdit(u)}
                    className="px-3 py-1.5 rounded-lg text-sm bg-white border border-amber-300 text-amber-900 hover:bg-amber-100">
                    {u.name} — {u.clinicalRole}
                  </button>
                ))}
              </div>
            </div>
          )}
          {/* Session 4.11 B2 — patients are told a name with no title */}
          {isSuperAdmin && missingPatientFacingCredential.length > 0 && (
            <div className="bg-amber-50 border border-amber-300 p-4 rounded-xl">
              <p className="font-semibold text-amber-900">
                {missingPatientFacingCredential.length} clinician{missingPatientFacingCredential.length === 1 ? '' : 's'} appear
                {missingPatientFacingCredential.length === 1 ? 's' : ''} to patients with no title
              </p>
              <p className="text-sm text-amber-800 mt-1">
                Booking and reminder emails name the clinician who is coming. With no credential on file the patient is
                told a name and nothing else — and a patient opening their front door should know a nurse practitioner is
                coming. Open each person and set their credential; nothing is ever guessed from a licence string.
              </p>
              <div className="flex flex-wrap gap-2 mt-3">
                {missingPatientFacingCredential.map(u => (
                  <button key={u.id} onClick={() => handleEdit(u)}
                    className="px-3 py-1.5 rounded-lg text-sm bg-white border border-amber-300 text-amber-900 hover:bg-amber-100">
                    {u.name}
                  </button>
                ))}
              </div>
            </div>
          )}
          <div className="bg-white p-6 rounded-xl shadow-sm">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div>
                <h1 className="text-2xl font-bold text-accent">User Management</h1>
                <p className="text-gray-600 mt-1">Manage all users, roles, and portal access</p>
              </div>
              <div className="flex gap-2 flex-wrap">
                <button onClick={exportUsersToXlsx}
                  className="px-4 py-2 rounded-lg font-medium flex items-center gap-2 shadow-sm hover:shadow-md transition-all border border-gray-300 bg-white text-gray-700 hover:bg-gray-50">
                  {Icons.download} Export
                </button>
                {isSuperAdmin && (
                <button onClick={() => { setShowBulkReset(true); setBulkResetResults(null); }}
                  className="px-4 py-2 rounded-lg font-medium flex items-center gap-2 shadow-sm hover:shadow-md transition-all border border-orange-300 bg-orange-50 text-orange-700 hover:bg-orange-100">
                  {Icons.key} Bulk Reset
                </button>
                )}
                <button onClick={() => { setShowForm(true); setEditingUser(null); setFormData(defaultFormData); setCompetencies([]); setEmrStatus(null); }}
                  className="px-4 py-2 rounded-lg font-medium flex items-center gap-2 shadow-sm hover:shadow-md transition-all"
                  style={{backgroundColor: '#033D50', color: 'white'}}>
                  {Icons.plus} Add User
                </button>
              </div>
            </div>

            {/* Tabs */}
            <div className="mt-4 flex gap-2 border-b">
              <button onClick={() => setActiveTab('list')} className={`px-4 py-2 font-medium ${activeTab === 'list' ? 'border-b-2 border-primary text-primary' : 'text-gray-500'}`}>
                Users ({users.filter(isStaffAccount).filter(u => isSuperAdmin || OFFICE_MANAGED_TYPES.includes(u.accountType)).length})
              </button>
              {isSuperAdmin && <button onClick={() => setActiveTab('resets')} className={`px-4 py-2 font-medium ${activeTab === 'resets' ? 'border-b-2 border-primary text-primary' : 'text-gray-500'}`}>
                Password Resets {staffResets.length > 0 && <span className="ml-1 bg-red-500 text-white text-xs px-2 py-0.5 rounded-full">{staffResets.length}</span>}
              </button>}
            </div>

            {message && <div className={`mt-4 p-3 rounded-lg ${message.includes('Error') ? 'bg-red-50 text-red-700' : 'bg-green-50 text-green-700'}`}>{message}</div>}

            {activeTab === 'list' && (
              <div className="mt-4 flex flex-col md:flex-row gap-4">
                <input type="text" placeholder="Search users..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)}
                  className="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary" />
                <select value={roleFilter} onChange={(e) => setRoleFilter(e.target.value)} className="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary">
                  <option value="all">All Roles</option>
                  <option value="staff">People (our team)</option>
                  <option value="admin">Admins</option>
                  <option value="user">Team Members</option>
                  <option value="vendor">Vendors</option>
                  <option value="service">Service Portal Access</option>
                </select>
              </div>
            )}
          </div>

          {/* Password Reset Requests Tab */}
          {activeTab === 'resets' && (
            <div className="bg-white rounded-xl shadow-sm p-6">
              <h2 className="text-lg font-bold text-accent mb-4 flex items-center gap-2">{Icons.key} Password Reset Requests</h2>
              {staffResets.length > 0 ? (
                <div className="space-y-3">
                  {staffResets.map(req => {
                    const user = users.find(u => u.id === req.userId);
                    return (
                      <div key={req.id} className="flex justify-between items-center p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
                        <div>
                          <p className="font-medium">{user?.name || 'Unknown User'}</p>
                          <p className="text-sm text-gray-500">{user?.email}</p>
                          <p className="text-xs text-gray-400">Requested: {new Date(req.requestedAt).toLocaleString()}</p>
                        </div>
                        <div className="flex gap-2">
                          <button onClick={() => handlePasswordReset(req.id, req.userId)} className="px-3 py-1 bg-gradient-to-r from-primary to-accent text-white rounded text-sm">Reset Password</button>
                          <button onClick={() => dismissReset(req.id)} className="px-3 py-1 bg-gray-200 rounded text-sm">Dismiss</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              ) : (
                <p className="text-gray-500 text-center py-8">No pending password reset requests</p>
              )}
            </div>
          )}

          {/* Client created — enrollment is the natural next step, offered not forced */}
          {justCreatedClientId && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-xl shadow-2xl w-full max-w-md p-6">
                <h2 className="text-lg font-bold text-accent mb-2">Client created</h2>
                <p className="text-sm text-gray-600 mb-5">Start their enrollment now — intake, consents, and documents live there, for home care or clinical care alike.</p>
                <div className="flex gap-3">
                  <a href={`/clients?client=${justCreatedClientId}`}
                    className="flex-1 text-center px-4 py-2.5 bg-primary-500 text-white rounded-lg hover:bg-primary-600 font-medium">
                    Go to enrollment
                  </a>
                  <button onClick={() => setJustCreatedClientId(null)} className="px-4 py-2.5 border border-gray-300 rounded-lg hover:bg-gray-50 font-medium">
                    Not Now
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* User Form Modal */}
          {showForm && (
            <div className={recordUser ? 'staff-record' : 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4'}>
              {recordUser && <StaffRecordTop token={token} user={recordUser} onBack={closeRecord} />}
              <div className={recordUser ? 'sr-body' : 'contents'}>
              {recordUser && <StaffRecordMenu sections={staffRecordSections(recordUser, isSuperAdmin)} />}
              <div className={recordUser ? 'sr-main' : 'contents'}>
