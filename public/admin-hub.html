              <div id={recordUser ? 'sr-account' : undefined} className={recordUser ? 'mg-card sr-sec sr-form' : 'bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto'}>
                <div className={recordUser ? 'border-b pb-3 mb-1 flex items-center justify-between' : 'sticky top-0 bg-white border-b px-6 py-4 flex items-center justify-between'}>
                  <h2 className="text-lg font-bold text-accent">{recordUser ? 'Account & Role' : editingUser ? 'Edit User' : 'Create New User'}</h2>
                  <button onClick={() => { if (recordUser) { closeRecord(); return; } setShowForm(false); setEditingUser(null); setCompetencies([]); setEmrStatus(null); }} className="text-gray-400 hover:text-gray-600" aria-label="Close">
                    {Icons.close}
                  </button>
                </div>
                <form onSubmit={handleSubmit} className="p-6 space-y-6">
                  {/* Error/Success Message */}
                  {message && (
                    <div className={`p-3 rounded-lg ${message.includes('Error') ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-green-50 text-green-700 border border-green-200'}`}>
                      {message}
                    </div>
                  )}
                  {/* Basic Info */}
                  <div className="grid md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Name *</label>
                      <input type="text" value={formData.name} onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                        className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary" required />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Email {formData.noEmail ? '' : '*'}</label>
                      {editingUser && editingUser.noLogin ? (
                        <p className="px-4 py-2 border rounded-lg bg-gray-50 text-sm text-gray-500">No login (placeholder). Their POA signs in with their own account.</p>
                      ) : (
                        <input type="email" autoComplete="off" value={formData.noEmail ? '' : formData.email} disabled={formData.noEmail}
                          onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                          className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary disabled:bg-gray-50" required={!formData.noEmail} />
                      )}
                      {!editingUser && formData.role === 'client' && (
                        <label className="flex items-start gap-2 mt-2 text-xs text-gray-600">
                          <input type="checkbox" className="mt-0.5" checked={!!formData.noEmail}
                            onChange={(e) => setFormData({ ...formData, noEmail: e.target.checked, email: '', password: '' })} />
                          <span>No email for this patient. Their POA or family member will sign in with their own account instead. No welcome email is sent.</span>
                        </label>
                      )}
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Phone (optional)</label>
                      <input type="tel" value={formData.phone || ''} onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                        placeholder="(555) 123-4567"
                        className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary" />
                    </div>
                    {/* A browser fills a saved password into any password box it
                        finds, so on an edit the box only exists once the admin
                        ticks to set one. The server also refuses a password
                        that arrives without resetPassword: true. */}
                    {editingUser ? (
                      <div>
                        <label className="flex items-center gap-2 text-sm font-medium text-gray-700 mb-1">
                          <input type="checkbox" checked={changePassword}
                            onChange={(e) => { setChangePassword(e.target.checked); setFormData({ ...formData, password: '' }); }} />
                          Set a new password for this user
                        </label>
                        {changePassword && (
                          <input type="password" autoComplete="new-password" value={formData.password}
                            onChange={(e) => setFormData({ ...formData, password: e.target.value })}
                            placeholder="New temporary password"
                            className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary" required />
                        )}
                        <p className="text-xs text-gray-500 mt-1">
                          {changePassword ? 'Saving will reset their password and email them a link.' : 'Their password is not changed by saving this form.'}
                        </p>
                      </div>
                    ) : (
                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Password {formData.noEmail ? '' : '*'}</label>
                        <input type="password" autoComplete="new-password" value={formData.noEmail ? '' : formData.password} disabled={formData.noEmail}
                          onChange={(e) => setFormData({ ...formData, password: e.target.value })}
                          placeholder={formData.noEmail ? 'Not needed' : ''}
                          className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary disabled:bg-gray-50" required={!formData.noEmail} />
                      </div>
                    )}
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Account Type *</label>
                      {/* ONE choice sets everything this person can do (owner,
                          2026-10-15). The types come from the server; the form
                          lists none of its own. */}
                      <select value={formData.accountType} required onChange={(e) => chooseAccountType(e.target.value)}
                        disabled={!!(editingUser && editingUser.role === 'client')}
                        className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary disabled:bg-gray-50">
                        <option value="">-- Choose an account type --</option>
                        {accountTypeCatalog.filter(t => !['client', 'family'].includes(t.value)).map(t => (
                          <option key={t.value} value={t.value}>{t.label}</option>
                        ))}
                      </select>
                      {editingUser && editingUser.role === 'client' && (
                        <p className="text-xs text-gray-500 mt-1">A patient's account type can't be changed: it would hide their care team and records. If their POA has been using this login, use "Move this login to the POA" under Client Settings.</p>
                      )}
                    </div>
                  </div>

                  {/* W-2 or 1099 (owner, 2026-11-08): every W-2 staff member clocks
                      in through the app. Staff only, never a client or family. */}
                  {formData.role && !['client', 'family'].includes(formData.role) && (
                    <div className="border-t pt-4">
                      <label className="block text-sm font-medium text-gray-700 mb-1">Employment Type</label>
                      <select value={formData.employmentType || ''} onChange={(e) => setFormData({ ...formData, employmentType: e.target.value })}
                        className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary">
                        <option value="">Not set</option>
                        <option value="W2">W-2 employee (clocks in through the app)</option>
                        <option value="1099">1099 contractor (hours come from other platforms)</option>
                        <option value="HYBRID">Hybrid: W-2 for clinical care, 1099 for exams (clocks in for clinical hours only)</option>
                      </select>
                    </div>
                  )}

                  {/* License Level — shown for Caregiver (vendor) role */}
                  {formData.role === 'vendor' && (
                    <div id="sr-credentials" className="border-t pt-4">
                      <label className="block text-sm font-medium text-gray-700 mb-1">License Level</label>
                      <select value={formData.licenseLevel} onChange={(e) => setFormData({ ...formData, licenseLevel: e.target.value })}
                        className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary">
                        <option value="">-- Select License Level --</option>
                        <option value="sitter">Sitter / Companion</option>
                        <option value="pca">PCA</option>
                        <option value="cna">CNA</option>
                        <option value="lpn">LPN</option>
                      </select>
                      <p className="text-xs text-gray-500 mt-1">
                        This decides which caregiver app they see. A caregiver with no level set cannot open it at all.
                      </p>

                      {/* Verified competencies — Session 6's gate on the visit-log form.
                          Levels are cumulative; competencies are not. Ticking one only
                          adds a field for a CNA or above: it can never promote someone
                          past their license level, which the server enforces. */}
                      <div className="mt-4">
                        <label className="block text-sm font-medium text-gray-700 mb-1">Verified competencies</label>
                        <p className="text-xs text-gray-500 mb-2">
                          Tick only what you have signed off on paper. Each tick adds those fields to their visit
                          log. It takes effect at CNA and above — a Sitter or PCA sees their own form no matter
                          what is ticked here. Leave the date blank if the sign-off does not expire.
                        </p>
                        {competencyCatalog.length === 0 ? (
                          <p className="text-xs text-gray-400">Loading the competency list…</p>
                        ) : (
                          <div className="border rounded-lg divide-y">
                            {competencyCatalog.map(({ task, label }) => {
                              const c = competencyFor(task);
                              return (
                                <div key={task} className="flex items-center gap-3 px-3 py-2">
                                  <input type="checkbox" id={`comp-${task}`} checked={!!c}
                                    onChange={() => toggleCompetency(task)}
                                    className="w-4 h-4 rounded border-gray-300 text-teal-600 focus:ring-teal-500" />
                                  <label htmlFor={`comp-${task}`} className="text-sm text-gray-700 flex-1">{label}</label>
                                  {c && (
                                    <span className="flex items-center gap-2">
                                      {isExpired(c) && <span className="text-xs text-danger-600 font-medium">Expired</span>}
                                      <input type="date" value={c.expiry || ''}
                                        onChange={(e) => setCompetencyExpiry(task, e.target.value)}
                                        className="px-2 py-1 border rounded text-xs" />
                                    </span>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        )}
                        {competencies.some(isExpired) && (
                          <p className="text-xs text-danger-600 mt-2">
                            An expired sign-off counts as not present, so those fields disappear from their visit
                            log until the date is updated.
                          </p>
                        )}
                      </div>
                    </div>
                  )}

                  {/* Clinical access. The account type sets the clinical role;
                      a MANAGER's is chosen here (owner, 2026-10-15): View only by
                      default, or none, or chart editing. The levels are served. */}
                  {(formData.role === 'user' || formData.role === 'caseManager') && (
                    <div id="sr-credentials" className="border-t pt-4">
                      <div className="p-3 bg-teal-50 rounded-lg">
                        {formData.accountType === 'manager' ? (
                          <>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Clinical Workspace access</label>
                            <select value={formData.managerClinicalAccess || defaultManagerAccess}
                              onChange={(e) => chooseManagerAccess(e.target.value)}
                              className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary">
                              {managerAccessCatalog.map(a => (
                                <option key={a.value} value={a.value}>{a.label}</option>
                              ))}
                            </select>
                            <p className="text-xs text-gray-500 mt-2">
                              A manager runs scheduling, billing and patient accounts. Billing is done inside the Clinical
                              Workspace, so a manager who bills needs at least View only. View and edit charts lets them
                              write and edit notes like a Care Coordinator. Nobody without a clinical licence signs.
                            </p>
                          </>
                        ) : (
                          <p className="text-sm text-gray-700">
                            Clinical role: <b>{(clinicalRoleCatalog.find(r => r.value === formData.clinicalRole) || {}).label || 'None'}</b>
                            <span className="block text-xs text-gray-500 mt-1">Set by the account type.</span>
                          </p>
                        )}
                        {selectedClinicalRole && (
                          <p className="text-xs text-teal-800 mt-2">
                            May execute under a standing order: {(selectedClinicalRole.credentialCeiling || []).join(', ') || 'nothing'}.
                          </p>
                        )}
                        {editingUser && editingUser.clinicalRoleAutoAssigned && (
                          <p className="text-xs text-amber-700 mt-2">
                            This role was assigned automatically when clinical access stopped being one checkbox. Confirm
                            or change it — saving this form counts as confirming it.
                          </p>
                        )}
                        {/* Session 4.11 B2: the patient-facing "Who" line. A blank
                            credential means a patient is told a name with no title
                            at all — a data gap nobody finds out about from the code.
                            The SERVER answers whether it is missing, so this cannot
                            drift from the formatter that decides it. */}
                        {editingUser && editingUser.patientFacingCredentialMissing && (
                          <p className="text-xs text-amber-700 mt-2">
                            Patients see this clinician's name with no title. Set the prescriber credential or the licence
                            level below and the reminder and booking emails will say what they are — "your nurse
                            practitioner", "your physician". Saving a credential clears this.
                          </p>
                        )}
                        {editingUser && editingUser.patientFacingLabel && !editingUser.patientFacingCredentialMissing && (
                          <p className="text-xs text-gray-500 mt-2">
                            Patients see: <b>{editingUser.patientFacingLabel}</b>
                          </p>
                        )}
                      </div>
                      {formData.hasClinicalAccess && (
                        <div className="mt-3">
                          <label className="block text-sm font-medium text-gray-700 mb-1">OpenEMR Provider ID (calendar mapping)</label>
                          <input type="text" inputMode="numeric" value={formData.openEmrProviderId}
                            onChange={(e) => setFormData({ ...formData, openEmrProviderId: e.target.value.replace(/\D/g, '') })}
                            placeholder="e.g. 1 — numeric id from OpenEMR's provider list"
                            className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary" />
                          <p className="text-xs text-gray-500 mt-1">Required for their clinical scheduling calendar (Session 4.2). Find it under /clinical → Schedule → provider list.</p>
                          <label className="block text-sm font-medium text-gray-700 mb-1 mt-3">Individual NPI (10 digits)</label>
                          <input type="text" inputMode="numeric" maxLength={10} value={formData.npi}
                            onChange={(e) => setFormData({ ...formData, npi: e.target.value.replace(/\D/g, '').slice(0, 10) })}
                            placeholder="10-digit NPI"
                            className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary" />
                          <p className="text-xs text-gray-500 mt-1">Stamped as the rendering clinician on every note, order, prescription and signed encounter (Session 4.4 attribution). Leave blank if not credentialed.</p>
                        </div>
                      )}

                      {/* ── Session 4.10: prescribing credential + DEA ──────
                          Georgia APRNs may not prescribe Schedule I or II
                          substances, and `clinicalRole: 'provider'` cannot tell
                          an NP from an MD. Nothing is parsed out of the licence
                          text: this is the field the guard reads, and absent
                          means no prescription can be recorded at all. */}
                      {formData.clinicalRole === 'provider' && (
                        <div className="mt-3 p-3 bg-amber-50 rounded-lg">
                          <label className="block text-sm font-medium text-gray-700 mb-1">Prescriber credential</label>
                          <select value={formData.prescriberCredential}
                            onChange={(e) => setFormData({ ...formData, prescriberCredential: e.target.value })}
                            className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary">
                            <option value="">Not on file — cannot prescribe</option>
                            {[['MD', 'MD — physician'], ['DO', 'DO — physician'], ['NP', 'NP / APRN — nurse practitioner'], ['PA', 'PA — physician associate']]
                              .map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                          </select>
                          <p className="text-xs text-gray-500 mt-1">
                            A Georgia NP or PA may not prescribe a Schedule I or II substance. Absent, no prescription can
                            be recorded at all — the app does not guess a credential from a licence string.
                          </p>

                          <label className="block text-sm font-medium text-gray-700 mb-1 mt-3">DEA number</label>
                          <input type="text" maxLength={9} value={formData.deaNumber}
                            onChange={(e) => setFormData({ ...formData, deaNumber: e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 9) })}
                            placeholder="Two letters and seven digits"
                            className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary" />
                          <p className="text-xs text-gray-500 mt-1">Required for any controlled prescription. The last digit is a checksum and is validated — a transposed digit is somebody else's registration.</p>

                          <label className="block text-sm font-medium text-gray-700 mb-1 mt-3">Schedules the registration covers</label>
                          <div className="flex flex-wrap gap-3">
                            {['CII', 'CIII', 'CIV', 'CV'].map(sc => (
                              <label key={sc} className="flex items-center gap-1.5 text-sm">
                                <input type="checkbox" checked={(formData.deaSchedules || []).includes(sc)}
                                  onChange={(e) => setFormData({
                                    ...formData,
                                    deaSchedules: e.target.checked
                                      ? [...(formData.deaSchedules || []), sc]
                                      : (formData.deaSchedules || []).filter(x => x !== sc)
                                  })} />
                                {sc}
                              </label>
                            ))}
                          </div>

                          <label className="block text-sm font-medium text-gray-700 mb-1 mt-3">DEA expires</label>
                          <input type="date" value={formData.deaExpiresAt}
                            onChange={(e) => setFormData({ ...formData, deaExpiresAt: e.target.value })}
                            className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary" />
                        </div>
                      )}

                      {/* ── Session 4.10: 42 CFR 424.507 ───────────────────
                          When the practitioner who ORDERED a lab test, imaging
                          study or DMEPOS item is not enrolled in Medicare in
                          approved status, the LAB's or SUPPLIER's claim is
                          denied. Not GFC's claim — which is why it gets
                          forgotten — and still GFC's problem. Admin-maintained;
                          nothing infers it. */}
                      {formData.hasClinicalAccess && (
                        <div className="mt-3 p-3 bg-blue-50 rounded-lg">
                          <label className="block text-sm font-medium text-gray-700 mb-1">Medicare enrolment (42 CFR 424.507)</label>
                          <select value={(formData.medicareEnrollment || {}).status || ''}
                            onChange={(e) => setFormData({ ...formData, medicareEnrollment: { ...(formData.medicareEnrollment || {}), status: e.target.value } })}
                            className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary">
                            <option value="">Not recorded</option>
                            <option value="approved">Enrolled — approved</option>
                            <option value="pending">Enrolment pending</option>
                            <option value="none">Not enrolled</option>
                            <option value="opted_out">Opted out of Medicare</option>
                          </select>
                          <label className="block text-sm font-medium text-gray-700 mb-1 mt-3">Effective date</label>
                          <input type="date" value={(formData.medicareEnrollment || {}).effectiveDate || ''}
                            onChange={(e) => setFormData({ ...formData, medicareEnrollment: { ...(formData.medicareEnrollment || {}), effectiveDate: e.target.value } })}
                            className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary" />
                          <p className="text-xs text-gray-500 mt-1">
                            Until this reads approved (or opted out), their lab, imaging and DME orders for Medicare
                            patients carry a warning the clinician has to acknowledge with a reason.
                          </p>
                          {formData.medicareEnrollmentVerified && (
                            <p className="text-xs text-blue-800 mt-1">
                              Last verified {new Date(formData.medicareEnrollmentVerified).toLocaleDateString()} by {formData.medicareEnrollmentVerifiedBy || 'an admin'}.
                            </p>
                          )}
                        </div>
                      )}
                    </div>
                  )}

                  {editingUser && isSuperAdmin && !['client', 'family'].includes(formData.role) && (
                    <div id="sr-modules"><ModulesSection token={token} userId={editingUser.id} userName={editingUser.name} /></div>
                  )}
                  {editingUser && !['client', 'family'].includes(formData.role) && (
                    <div id="sr-welcome"><WelcomePacketSection token={token} userId={editingUser.id} userName={editingUser.name} /></div>
                  )}
                  {editingUser && !['client', 'family'].includes(formData.role) && (
                    <div id="sr-bio"><StaffBioSection token={token} userId={editingUser.id} userName={editingUser.name} /></div>
                  )}

                  {/* ── Account recovery ────────────────────────────────
                      Both routes existed on the server (Session 5.3 MFA
                      reset, Session 5.2 OpenEMR disconnect) with no button
                      anywhere in the app. This is that button. Only shown
                      when editing an existing user — there is nothing to
                      recover for one that does not exist yet. Super Admin
                      only: MFA reset and EMR disconnect stay theirs. */}
                  {editingUser && isSuperAdmin && (
                    <div id="sr-recovery" className="border-t pt-4">
                      <h3 className="font-medium text-gray-800 mb-1">Account recovery</h3>
                      <p className="text-sm text-gray-500 mb-3">
                        For a lost or replaced device. Neither of these is the password field above — reset that separately if it also needs to change.
                      </p>
                      {isSuperAdmin && editingUser.role !== 'admin' && editingUser.accountStatus !== 'inactive' && (
                        <div className="p-3 mb-3 bg-gray-50 rounded-lg">
                          <div className="flex items-center justify-between gap-3">
                            <div>
                              <p className="text-sm font-medium text-gray-700">View as {editingUser.name || 'this user'}</p>
                              <p className="text-xs text-gray-500 mt-0.5">See and use the app exactly as they do, for up to 60 minutes. Signing, OpenEMR and their account settings stay off. Emails still send.</p>
                            </div>
                            <button type="button" onClick={() => startViewAs(token, editingUser, setMessage)}
                              className="px-3 py-1.5 bg-primary text-white text-sm rounded-lg hover:opacity-90 whitespace-nowrap">
                              View as
                            </button>
                          </div>
                        </div>
                      )}
                      <div className="p-3 bg-gray-50 rounded-lg">
                        <div className="flex items-center justify-between gap-3">
                          <div>
                            <p className="text-sm font-medium text-gray-700">Authenticator (MFA)</p>
                            <p className="text-xs text-gray-500 mt-0.5">
                              {editingUser.mfaEnrolled
                                ? 'Enrolled. Resetting deletes it and signs them out of every active session immediately — they scan a new QR code next login.'
                                : 'Not enrolled yet. They are asked to enrol at their next login.'}
                            </p>
                          </div>
                          <button type="button" disabled={!editingUser.mfaEnrolled || accessActionBusy}
                            onClick={() => resetUserMfa(editingUser)}
                            className="px-3 py-1.5 bg-amber-100 text-amber-800 text-sm rounded-lg hover:bg-amber-200 disabled:opacity-40 disabled:cursor-not-allowed whitespace-nowrap">
                            Reset Authenticator
                          </button>
                        </div>
                      </div>

                      {/* Email a reset link. Separate from the password field
                          above on purpose: that one sets a password somebody
                          then has to read out, this one lets them set their
                          own. Refused on a placeholder login, with the server's
                          own sentence naming the POA to reset instead. */}
                      <div className="mt-3 p-3 bg-gray-50 rounded-lg">
                        <div className="flex items-center justify-between gap-3">
                          <div>
                            <p className="text-sm font-medium text-gray-700">Password reset link</p>
                            <p className="text-xs text-gray-500 mt-0.5">
                              Emails a secure link to {editingUser.email} and stops their current password working. You are not shown the new password — they choose their own. Use this instead of typing one in when you cannot speak to them.
                            </p>
                          </div>
                          <button type="button" disabled={accessActionBusy}
                            onClick={() => emailResetLink(editingUser)}
                            className="px-3 py-1.5 bg-amber-100 text-amber-800 text-sm rounded-lg hover:bg-amber-200 disabled:opacity-40 disabled:cursor-not-allowed whitespace-nowrap">
                            Email Reset Link
                          </button>
                        </div>
                      </div>

                      {/* End every session. For a lost or stolen device; it
                          changes no password, which the copy has to say or
                          somebody will think it locks the account. */}
                      <div className="mt-3 p-3 bg-gray-50 rounded-lg">
                        <div className="flex items-center justify-between gap-3">
                          <div>
                            <p className="text-sm font-medium text-gray-700">Active sessions</p>
                            <p className="text-xs text-gray-500 mt-0.5">
                              Signs them out of every device immediately. Their password is unchanged, so they can sign back in with it — reset the password as well if a device is lost.
                              {me && me.id === editingUser.id && <span className="text-amber-800 font-medium"> This is your own account, so it will sign you out of this session too.</span>}
                            </p>
                          </div>
                          <button type="button" disabled={accessActionBusy}
                            onClick={() => revokeUserSessions(editingUser)}
                            className="px-3 py-1.5 bg-amber-100 text-amber-800 text-sm rounded-lg hover:bg-amber-200 disabled:opacity-40 disabled:cursor-not-allowed whitespace-nowrap">
                            Sign Out Everywhere
                          </button>
                        </div>
                      </div>

                      {formData.hasClinicalAccess && (
                        <div className="mt-3 p-3 bg-gray-50 rounded-lg">
                          <div className="flex items-center justify-between gap-3">
                            <div>
                              <p className="text-sm font-medium text-gray-700">OpenEMR connection</p>
                              <p className="text-xs text-gray-500 mt-0.5">
                                {emrStatusLoading ? 'Checking…' : (emrStatus && emrStatus.connected)

                                <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-orange-100 text-orange-700" title="This user has unsubscribed from automated emails">
                                  <svg xmlns="http://www.w3.org/2000/svg" className="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" /></svg>
                                  Unsubscribed{user.emailUnsubscribedAt ? ` ${new Date(user.emailUnsubscribedAt).toLocaleDateString('en-US', { timeZone: 'America/New_York' })}` : ''}
                                </span>
                              </div>
                            )}
                          </td>
                          <td className="px-4 py-4 text-center">
                            <button onClick={() => toggleAccountStatus(user)}
                              disabled={user.role === 'admin'}
                              className={`px-2.5 py-1 text-xs rounded-full font-medium transition ${user.accountStatus === 'inactive' ? 'bg-red-100 text-red-700 hover:bg-red-200' : 'bg-green-100 text-green-700 hover:bg-green-200'} ${user.role === 'admin' ? 'cursor-not-allowed opacity-70' : 'cursor-pointer'}`}
                              title={user.role === 'admin' ? 'Admin accounts cannot be deactivated' : `Click to ${user.accountStatus === 'inactive' ? 'reactivate' : 'deactivate'}`}>{user.accountStatus === 'inactive' ? 'Inactive' : 'Active'}</button>
                          </td>
                          <td className="px-4 py-4 text-sm text-gray-500">{new Date(user.createdAt).toLocaleDateString()}</td>
                          <td className="px-4 py-4">
                            <div className="flex gap-2">
                              <button onClick={() => handleEdit(user)} className="p-1 text-primary hover:bg-primary/10 rounded" title="Edit">{Icons.edit}</button>
                              {isSuperAdmin && user.role !== 'admin' && user.accountStatus !== 'inactive' && (
                                <button onClick={() => startViewAs(token, user, setMessage)} className="px-2 py-0.5 text-xs font-medium text-primary border border-primary/40 rounded hover:bg-primary/10 whitespace-nowrap" title="See and use the app as this person">View as</button>
                              )}
                              <button
                                onClick={() => toggleEmailSubscription(user)}
                                className={`p-1 rounded ${user.emailUnsubscribed ? 'text-orange-600 hover:bg-orange-50' : 'text-gray-400 hover:bg-gray-100'}`}
                                title={user.emailUnsubscribed ? 'Resubscribe to emails' : 'Unsubscribe from emails'}
                              >
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.75} d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                              </button>
                              {isSuperAdmin && <button onClick={() => handleDelete(user.id)} className="p-1 text-red-600 hover:bg-red-50 rounded" title="Delete">{Icons.trash}</button>}
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    // Full Service Portal Page (embedded admin view)
    const ServicePortalPage = ({ token, user }) => {
      const [activeTab, setActiveTab] = useState('reports');
      const [reports, setReports] = useState([]);
      const [clients, setClients] = useState([]);
      const [technicians, setTechnicians] = useState([]);
      const [loading, setLoading] = useState(true);
      const [searchTerm, setSearchTerm] = useState('');
      const [sortBy, setSortBy] = useState('date_desc');
      const [statusFilter, setStatusFilter] = useState('');
      const [viewingReport, setViewingReport] = useState(null);
      const [showNewReport, setShowNewReport] = useState(false);
      const [submitting, setSubmitting] = useState(false);
      const [formData, setFormData] = useState({
        clientFacilityName: '', customerName: '', serviceProviderName: user?.name || '',
        address: '', serviceCompletionDate: new Date().toISOString().split('T')[0],
        analyzerModel: '', analyzerSerialNumber: '', hubspotTicketNumber: '', hubspotCompanyId: '',
        serviceType: '', descriptionOfWork: '', materialsUsed: '', solution: '', outstandingIssues: ''
      });

      // Assignment form state
      const [assignFormData, setAssignFormData] = useState({
        assignedToId: '', clientFacilityName: '', customerName: '', address: '',
        serviceType: '', analyzerModel: '', analyzerSerialNumber: '',
        hubspotTicketNumber: '', hubspotCompanyId: '', serviceCompletionDate: '',
        managerNotes: '', validationStartDate: '', validationEndDate: '', expectedDays: ''
      });
      const [assignedPhotos, setAssignedPhotos] = useState([]);
      const [assignedFiles, setAssignedFiles] = useState([]);
      const [photoPreviewUrls, setPhotoPreviewUrls] = useState([]);
      const [fileNames, setFileNames] = useState([]);
      const photoInputRef = React.useRef(null);
      const fileInputRef = React.useRef(null);

      const serviceTypes = ['Analyzer Hardware', 'Inventory', 'LIS/EMR', 'Billing & Fees', 'Compliance', 'Training', 'Validations'];

      // Pending Review state
      const [pendingReviewTickets, setPendingReviewTickets] = useState([]);
      const [pendingLoading, setPendingLoading] = useState(false);
      const [dismissingId, setDismissingId] = useState(null);
      const [dismissingAll, setDismissingAll] = useState(false);

      useEffect(() => {
        loadData();
      }, [token]);

      const loadData = async () => {
        setLoading(true);
        const [reportsData, clientsData, techniciansData, pollingData] = await Promise.all([
          api.getServiceReports(token),
          api.getServiceClients(token),
          api.getTechnicians(token),
          api.getPollingStatus(token)
        ]);
        if (!techniciansData.error) setTechnicians(techniciansData);
        if (!pollingData.error) setPendingReviewTickets(pollingData.pendingReviewTickets || []);
        if (!reportsData.error) {
          setReports(reportsData);
        }
        if (!clientsData.error) setClients(clientsData);
        setLoading(false);
      };

      const handleDismissPendingTicket = async (ticketId) => {
        setDismissingId(ticketId);
        const result = await api.dismissPendingReviewTicket(token, ticketId);
        if (result.error) {
          alert('Error: ' + result.error);
        } else {
          setPendingReviewTickets(result.pendingReviewTickets || []);
        }
        setDismissingId(null);
      };

      const handleDismissAllPending = async () => {
        if (!window.confirm('Clear all pending review tickets? This cannot be undone.')) return;
        setDismissingAll(true);
        const result = await api.dismissAllPendingReview(token);
        if (result.error) {
          alert('Error: ' + result.error);
        } else {
          setPendingReviewTickets([]);
        }
        setDismissingAll(false);
      };

      const handleClientSelect = (clientName) => {
        const client = clients.find(c => c.name === clientName || c.clientName === clientName);
        if (client) {
          setFormData(prev => ({
            ...prev,
            clientFacilityName: client.name || client.clientName || '',
            address: client.address || '',
            hubspotCompanyId: client.hubspotCompanyId || ''
          }));
        }
      };

      const handleSubmitReport = async (e) => {
        e.preventDefault();
        if (!formData.clientFacilityName || !formData.serviceType || !formData.descriptionOfWork) {
          alert('Please fill in all required fields');
          return;
        }
        setSubmitting(true);
        const result = await api.submitServiceReport(token, formData);
        if (result.error) {
          alert('Error: ' + result.error);
        } else {
          setShowNewReport(false);
          setFormData({
            clientFacilityName: '', customerName: '', serviceProviderName: user?.name || '',
            address: '', serviceCompletionDate: new Date().toISOString().split('T')[0],
            analyzerModel: '', analyzerSerialNumber: '', hubspotTicketNumber: '', hubspotCompanyId: '',
            serviceType: '', descriptionOfWork: '', materialsUsed: '', solution: '', outstandingIssues: ''
          });
          loadData();
        }
        setSubmitting(false);
      };

      // Assignment handlers
      const handlePhotoSelect = (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length > 0) {
          setAssignedPhotos(prev => [...prev, ...files]);
          const newPreviews = files.map(file => URL.createObjectURL(file));
          setPhotoPreviewUrls(prev => [...prev, ...newPreviews]);
        }
      };

      const handleFileSelect = (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length > 0) {
          setAssignedFiles(prev => [...prev, ...files]);
          setFileNames(prev => [...prev, ...files.map(f => f.name)]);
        }
      };

      const removePhoto = (idx) => {
        setAssignedPhotos(prev => prev.filter((_, i) => i !== idx));
        setPhotoPreviewUrls(prev => prev.filter((_, i) => i !== idx));
      };

      const removeFile = (idx) => {
        setAssignedFiles(prev => prev.filter((_, i) => i !== idx));
        setFileNames(prev => prev.filter((_, i) => i !== idx));
      };

      const handleAssignClientSelect = (clientName) => {
        const client = clients.find(c => c.name === clientName || c.clientName === clientName);
        if (client) {
          setAssignFormData(prev => ({
            ...prev,
            clientFacilityName: client.name || client.clientName || '',
            address: client.address || '',
            hubspotCompanyId: client.hubspotCompanyId || ''
          }));
        }
      };

      const handleAssignReport = async (e) => {
        e.preventDefault();
        if (!assignFormData.assignedToId || !assignFormData.clientFacilityName) {
          alert('Please select a technician/vendor and client');
          return;
        }
        setSubmitting(true);
        try {
          // First create the assigned report
          const result = await api.assignServiceReport(token, assignFormData);
          if (result.error) {
            alert('Error: ' + result.error);
            setSubmitting(false);
            return;
          }

          // Upload photos if any
          if (assignedPhotos.length > 0) {
            await api.uploadServiceReportPhotos(token, result.id, assignedPhotos);
          }

          // Upload files if any
          if (assignedFiles.length > 0) {
            await api.uploadServiceReportFiles(token, result.id, assignedFiles);
          }

          // Reset form
          setAssignFormData({
            assignedToId: '', clientFacilityName: '', customerName: '', address: '',
            serviceType: '', analyzerModel: '', analyzerSerialNumber: '',
            hubspotTicketNumber: '', hubspotCompanyId: '', serviceCompletionDate: '',
            managerNotes: '', validationStartDate: '', validationEndDate: '', expectedDays: ''
          });
          setAssignedPhotos([]);
          setAssignedFiles([]);
          setPhotoPreviewUrls([]);
          setFileNames([]);
          setActiveTab('reports');
          loadData();
          alert('Service report assigned successfully!');
        } catch (err) {
          alert('Error assigning report: ' + err.message);
        }
        setSubmitting(false);
      };

      // Include all reports (submitted and assigned) with sort and filter
      const filteredReports = reports
        .filter(r => {
          if (searchTerm && !r.clientFacilityName?.toLowerCase().includes(searchTerm.toLowerCase()) &&
              !r.serviceType?.toLowerCase().includes(searchTerm.toLowerCase()) &&
              !r.technicianName?.toLowerCase().includes(searchTerm.toLowerCase())) return false;
          if (statusFilter && r.status !== statusFilter) return false;
          return true;
        })
        .sort((a, b) => {
          const dateA = new Date(a.serviceCompletionDate || a.createdAt);
          const dateB = new Date(b.serviceCompletionDate || b.createdAt);
          if (sortBy === 'date_desc') return dateB - dateA;
          if (sortBy === 'date_asc') return dateA - dateB;
          if (sortBy === 'client_asc') return (a.clientFacilityName || '').localeCompare(b.clientFacilityName || '');
          if (sortBy === 'client_desc') return (b.clientFacilityName || '').localeCompare(a.clientFacilityName || '');
          if (sortBy === 'type_asc') return (a.serviceType || '').localeCompare(b.serviceType || '');
          if (sortBy === 'tech_asc') return (a.technicianName || a.serviceProviderName || '').localeCompare(b.technicianName || b.serviceProviderName || '');
          return dateB - dateA;
        });

      // View single report
      if (viewingReport) {
        const isAssigned = viewingReport.status === 'assigned';
        const isSignatureNeeded = viewingReport.status === 'signature_needed';
        const headerGradient = isAssigned ? 'bg-gradient-to-r from-yellow-500 to-yellow-600' :
          isSignatureNeeded ? 'bg-gradient-to-r from-orange-500 to-orange-600' :
          'bg-gradient-to-r from-green-600 to-green-800';
        const statusLabel = isAssigned ? 'Pending - Awaiting Completion' :
          isSignatureNeeded ? 'Signature Needed - Awaiting Client Signature' : 'Complete';
        return (
          <div className="space-y-6">
            <button onClick={() => setViewingReport(null)} className="flex items-center gap-2 text-primary hover:text-accent">
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
              Back to Service Portal
            </button>
            <div className="bg-white rounded-xl shadow-sm overflow-hidden">
              <div className={`${headerGradient} text-white p-6`}>
                <div className="flex items-center gap-3 mb-2">
                  <h1 className="text-2xl font-bold">Service Report Details</h1>
                  <span className="px-3 py-1 rounded-full text-sm font-medium bg-white/20">
                    {statusLabel}
                  </span>
                </div>
                <p className="opacity-90">Report ID: {viewingReport.id}</p>
                {isAssigned && viewingReport.assignedByName && (
                  <p className="opacity-90 mt-1">Assigned by: {viewingReport.assignedByName} to {viewingReport.assignedToName}</p>
                )}
              </div>
              <div className="p-6 space-y-6">
                {/* Assignment Info for assigned reports */}
                {isAssigned && (
                  <div className="bg-yellow-50 border border-yellow-200 rounded-lg p-4">
                    <h3 className="font-semibold text-yellow-800 mb-2">Assignment Details</h3>
                    <div className="grid md:grid-cols-2 gap-4 text-sm">
                      <p><span className="text-yellow-700">Assigned To:</span> <span className="font-medium">{viewingReport.assignedToName}</span></p>
                      <p><span className="text-yellow-700">Assigned By:</span> <span className="font-medium">{viewingReport.assignedByName}</span></p>
                      <p><span className="text-yellow-700">Assigned At:</span> {new Date(viewingReport.assignedAt).toLocaleString()}</p>
                    </div>
                  </div>
                )}

                {/* Manager Notes */}
                {viewingReport.managerNotes && (
                  <div className="bg-blue-50 border border-blue-200 rounded-lg p-4">
                    <h3 className="font-semibold text-blue-800 mb-2">Manager Notes</h3>
                    <p className="text-sm text-blue-900 whitespace-pre-wrap">{viewingReport.managerNotes}</p>
                  </div>
                )}

                {/* Photos */}
                {viewingReport.photos && viewingReport.photos.length > 0 && (
                  <div>
                    <h3 className="font-bold text-accent mb-3">Photos</h3>
                    <div className="flex flex-wrap gap-3">
                      {viewingReport.photos.map((photo, idx) => (
                        <a key={photo.id || idx} href={photo.url} target="_blank" rel="noopener noreferrer" className="block">
                          <img src={photo.url} alt={photo.name} className="w-24 h-24 object-cover rounded-lg border hover:opacity-80 transition" />
                        </a>
                      ))}
                    </div>
                  </div>
                )}

                {/* Client Files */}
                {viewingReport.clientFiles && viewingReport.clientFiles.length > 0 && (
                  <div>
                    <h3 className="font-bold text-accent mb-3">Client Files</h3>
                    <div className="space-y-2">
                      {viewingReport.clientFiles.map((file, idx) => (
                        <a key={file.id || idx} href={file.url} target="_blank" rel="noopener noreferrer"
                          className="flex items-center gap-2 p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition">
                          {Icons.folder}
                          <span className="text-sm text-primary hover:underline">{file.name}</span>
                        </a>
                      ))}
                    </div>
                  </div>
                )}

                <div className="grid md:grid-cols-2 gap-6">
                  <div>
                    <h3 className="font-bold text-accent mb-3">Client Information</h3>
                    <div className="space-y-2 text-sm">
                      <p><span className="text-gray-500">Facility:</span> {viewingReport.clientFacilityName}</p>
                      <p><span className="text-gray-500">Customer:</span> {viewingReport.customerName || '-'}</p>
                      <p><span className="text-gray-500">Address:</span> {viewingReport.address || '-'}</p>
                      <p><span className="text-gray-500">Service Date:</span> {viewingReport.serviceCompletionDate || '-'}</p>
                      <p><span className="text-gray-500">Analyzer:</span> {viewingReport.analyzerModel || '-'} (S/N: {viewingReport.analyzerSerialNumber || '-'})</p>
                      <p><span className="text-gray-500">HubSpot Ticket:</span> {viewingReport.hubspotTicketNumber || '-'}</p>
                    </div>
                  </div>
                  <div>
                    <h3 className="font-bold text-accent mb-3">Service Details</h3>
                    <div className="space-y-2 text-sm">
                      <p><span className="text-gray-500">Service Type:</span> <span className="px-2 py-1 bg-green-100 text-green-700 rounded">{viewingReport.serviceType || '-'}</span></p>
                      <p><span className="text-gray-500">Technician:</span> {viewingReport.serviceProviderName || viewingReport.technicianName || (isAssigned ? 'Pending' : '-')}</p>
                    </div>
                  </div>
                </div>

                {/* Only show technician-provided details if submitted */}
                {!isAssigned && (
                  <>
                    {viewingReport.descriptionOfWork && (
                      <div>
                        <h3 className="font-bold text-accent mb-3">Work Performed</h3>
                        <p className="text-sm bg-gray-50 p-3 rounded-lg whitespace-pre-wrap">{viewingReport.descriptionOfWork}</p>
                      </div>
                    )}
                    {viewingReport.materialsUsed && (
                      <div>
                        <h3 className="font-bold text-accent mb-3">Materials Used</h3>
                        <p className="text-sm bg-gray-50 p-3 rounded-lg">{viewingReport.materialsUsed}</p>
                      </div>
                    )}
                    {viewingReport.solution && (
                      <div>
                        <h3 className="font-bold text-accent mb-3">Solution</h3>
                        <p className="text-sm bg-gray-50 p-3 rounded-lg whitespace-pre-wrap">{viewingReport.solution}</p>
                      </div>
                    )}
                    {viewingReport.outstandingIssues && (
                      <div>
                        <h3 className="font-bold text-accent mb-3">Outstanding Issues / Recommendations</h3>
                        <p className="text-sm bg-gray-50 p-3 rounded-lg whitespace-pre-wrap">{viewingReport.outstandingIssues}</p>
                      </div>
                    )}
                  </>
                )}

                {isAssigned && (
                  <div className="bg-gray-50 rounded-lg p-4 text-center text-gray-500">
                    <p>Technician details will appear here once the report is submitted.</p>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="space-y-6">
          {/* Header */}
          <div className="bg-gradient-to-r from-green-600 to-green-800 text-white p-6 rounded-xl">
            <h1 className="text-2xl font-bold">Service Portal</h1>
            <p className="mt-1 opacity-90">Manage service reports and technician activities</p>
          </div>

          {/* Tabs */}
          <div className="bg-white rounded-xl shadow-sm">
            <div className="flex border-b flex-wrap">
              <button onClick={() => setActiveTab('reports')}
                className={`px-6 py-4 font-medium ${activeTab === 'reports' ? 'text-green-600 border-b-2 border-green-600' : 'text-gray-500 hover:text-gray-700'}`}>
                Service Reports ({reports.length})
              </button>
              <button onClick={() => setActiveTab('pending_review')}
                className={`px-6 py-4 font-medium flex items-center gap-2 ${activeTab === 'pending_review' ? 'text-red-600 border-b-2 border-red-600' : 'text-gray-500 hover:text-gray-700'}`}>
                Pending Review
                {pendingReviewTickets.length > 0 && (
                  <span className="px-2 py-0.5 bg-red-100 text-red-600 rounded-full text-xs font-semibold">{pendingReviewTickets.length}</span>
                )}
              </button>
            </div>

            {/* Reports Tab */}
            {activeTab === 'reports' && (
              <div className="p-6">
                <div className="flex flex-wrap items-end gap-3 mb-4">
                  <div className="flex-1 min-w-[200px]">
                    <input type="text" placeholder="Search by client, service type, or technician..." value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)} className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500" />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-gray-500 mb-1">Sort</label>
                    <select value={sortBy} onChange={e => setSortBy(e.target.value)} className="px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-green-500">
                      <option value="date_desc">Newest First</option>
                      <option value="date_asc">Oldest First</option>
                      <option value="client_asc">Client A-Z</option>
                      <option value="client_desc">Client Z-A</option>
                      <option value="type_asc">Service Type</option>
                      <option value="tech_asc">Technician</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-gray-500 mb-1">Status</label>
                    <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className="px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-green-500">
                      <option value="">All Statuses</option>
                      <option value="submitted">Complete</option>
                      <option value="assigned">Pending</option>
                      <option value="signature_needed">Signature Needed</option>
                    </select>
                  </div>
                </div>
                {loading ? (
                  <div className="flex justify-center py-12"><div className="animate-spin rounded-full h-8 w-8 border-4 border-green-600 border-t-transparent"></div></div>
                ) : filteredReports.length > 0 ? (
                  <div className="overflow-x-auto">
                    <table className="w-full">
                      <thead className="bg-gray-50 border-b">
                        <tr>
                          <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Status</th>
                          <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Date</th>
                          <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Client</th>
                          <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Service Type</th>
                          <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Assigned To / Technician</th>
                          <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Ticket #</th>
                          <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-200">
                        {filteredReports.map(report => (
                          <tr key={report.id} className="hover:bg-gray-50">
                            <td className="px-4 py-3">
                              {report.status === 'assigned' ? (
                                <span className="px-2 py-1 text-xs bg-yellow-100 text-yellow-700 rounded font-medium">Pending</span>
                              ) : report.status === 'signature_needed' ? (
                                <span className="px-2 py-1 text-xs bg-orange-100 text-orange-700 rounded font-medium">Signature Needed</span>
                              ) : (
                                <span className="px-2 py-1 text-xs bg-green-100 text-green-700 rounded font-medium">Complete</span>
                              )}
                            </td>
                            <td className="px-4 py-3 text-sm">{new Date(report.serviceCompletionDate || report.createdAt).toLocaleDateString()}</td>
                            <td className="px-4 py-3">
                              <div className="font-medium text-gray-900">{report.clientFacilityName}</div>
                            </td>
                            <td className="px-4 py-3"><span className="px-2 py-1 text-xs bg-blue-100 text-blue-700 rounded">{report.serviceType || '-'}</span></td>
                            <td className="px-4 py-3 text-sm">
                              {report.status === 'assigned' ? (
                                <span className="text-yellow-700">{report.assignedToName}</span>
                              ) : (
                                report.serviceProviderName || report.technicianName || '-'
                              )}
                            </td>
                            <td className="px-4 py-3 text-sm text-gray-500">{report.hubspotTicketNumber || '-'}</td>
                            <td className="px-4 py-3">
                              <button onClick={() => setViewingReport(report)} className="flex items-center gap-1 text-green-600 hover:text-green-800">
                                {Icons.eye} View
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                ) : (
