<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Godwins Family Care — Admin Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.1.0/dist/tabler-icons.min.css">
  <!-- EVERY time this app shows is Eastern, on both sides (owner rule,
       2026-09-16). Loaded before the page's own scripts so nothing can format a
       date before the default is in place. `installDefaultTimeZone()` fills in
       the zone where a caller passed none; the shift and visit sites also call
       GFC_TIME's helpers explicitly, because code that says what it means
       outlives a shim. See public/gfc-time.js. -->
  <script src="/gfc-time.js"></script>
  <script>window.GFC_TIME && window.GFC_TIME.installDefaultTimeZone();</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <!-- Session 9 messaging: the same thread component every portal mounts. -->
  <script src="/note-format.js"></script>
  <script src="/components/gfc-messaging.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#033D50', 50: '#e8f0f4', 100: '#c5d9e3', 200: '#9fc0d0', 300: '#6ea3bb', 400: '#3d86a6', 500: '#033D50', 600: '#02334a', 700: '#022A38', 800: '#011f2a', 900: '#01141c' },
            accent: '#C9A44A',
            surface: { 50: '#fafafa', 100: '#f4f4f5', 200: '#e4e4e7' },
            success: { 50: '#ecfdf5', 500: '#10b981', 600: '#059669' },
            warning: { 50: '#fffbeb', 500: '#f59e0b', 600: '#d97706' },
            danger: { 50: '#fef2f2', 500: '#ef4444', 600: '#dc2626' }
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['"DM Sans"', '"Inter"', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'soft': '0 2px 15px -3px rgba(0, 0, 0, 0.07), 0 10px 20px -2px rgba(0, 0, 0, 0.04)',
            'card': '0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.1)',
            'card-hover': '0 10px 40px -10px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05)'
          }
        }
      }
    }
  </script>
  <link rel="icon" type="image/png" href="/brand/logo-mark-color-transparent.png">
  <link rel="stylesheet" href="/css/gfc-tokens.css">
  <style>
    /* The Admin Hub wears the My GFC frame (owner, 2026-11-09): the same
       sidebar, banner, cream page and cards. The frame itself comes from
       /my-gfc.js; these rules bring the hub's own cards into the same look. */
    * { font-family: 'DM Sans', 'Inter', system-ui, sans-serif; }
    .ti { font-family: 'tabler-icons' !important; }
    body { background: #FAF7F2; }
    .ah .mg-body { max-width: 1320px; }
    .ah .mg-tiles a.mg-tile { text-decoration: none; }
    /* The staff record (owner, 2026-11-09): a page, not a pop-up. While one is
       open, User Management's list and banners step aside. */
    .sr-open > *:not(.staff-record) { display: none !important; }
    .sr-body { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
    .sr-main { min-width: 0; }
    .sr-sec { scroll-margin-top: 70px; }
    .sr-form form { padding: 12px 0 0 !important; }
    .sr-form .sticky { position: static !important; }
    .sr-menu { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .sr-menu button { white-space: nowrap; background: #fff; border: 1px solid #ECE4D6; border-radius: 999px; padding: 7px 12px; font-size: 13.5px; font-weight: 600; color: #033D50; cursor: pointer; }
    .sr-menu button:hover { border-color: #C9A44A; }
    @media (min-width: 1100px) {
      .sr-body { grid-template-columns: 210px minmax(0, 1fr); }
      .sr-menu { flex-direction: column; position: sticky; top: 16px; overflow: visible; }
      .sr-menu button { text-align: left; border-radius: 12px; }
    }
    .sidebar-link { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 0.75rem; }
    .sidebar-link:hover { background: linear-gradient(90deg, rgba(3, 61, 80, 0.08) 0%, rgba(3, 61, 80, 0.02) 100%); }
    .sidebar-link.active { background: linear-gradient(135deg, var(--gfc-navy) 0%, var(--gfc-navy-soft) 100%); color: white; box-shadow: 0 4px 14px -3px rgba(3, 61, 80, 0.4); }
    .card-modern { background: white; border-radius: 16px; border: 1px solid #ECE4D6; box-shadow: 0 1px 2px rgba(3,61,80,.04), 0 6px 18px -12px rgba(3,61,80,.18); }
    .btn-primary { background: linear-gradient(135deg, var(--gfc-navy) 0%, var(--gfc-navy-soft) 100%); transition: all 0.2s; }
    .btn-primary:hover { background: linear-gradient(135deg, var(--gfc-navy-soft) 0%, var(--gfc-navy-deep) 100%); box-shadow: 0 4px 14px -3px rgba(3, 61, 80, 0.5); transform: translateY(-1px); }
    .input-modern { border: 1.5px solid #e4e4e7; border-radius: 0.75rem; transition: all 0.2s; }
    .input-modern:focus { border-color: var(--gfc-navy); box-shadow: 0 0 0 3px rgba(3, 61, 80, 0.1); outline: none; }
    .gradient-header { background: linear-gradient(135deg, var(--gfc-navy) 0%, var(--gfc-navy-deep) 100%); }
    .stat-card { position: relative; overflow: hidden; }
    .stat-card::before { content: ''; position: absolute; top: 0; right: 0; width: 100px; height: 100px; background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 100%); border-radius: 0 1rem 0 100%; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    .glass-effect { backdrop-filter: blur(10px); background: rgba(255,255,255,0.9); }
  </style>
  <script src="/session-guard.js"></script>
  <script src="/staff-nav.js"></script>
  <script src="/mfa-step.js"></script>
</head>
<body class="min-h-screen">
  <div id="root"></div>
  <!-- The My GFC frame (Shell, Tile, Section), shared with /my and the caregiver app. -->
  <script type="text/babel" src="/my-gfc.js"></script>
  <script type="text/babel" src="/welcome-packet-ui.js"></script>
  <script type="text/babel" src="/document-sign-ui.js"></script>
  <!-- Client and family accounts live on the Clients page; the pieces both
       screens need are one shared copy (owner, 2026-11-09). -->
  <script type="text/babel" src="/client-account-ui.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const API_URL = window.location.origin;

    // Lab-era UI (HubSpot CRM ids, launch-tracker stats, ticket counts) that
    // GFC does not use. HIDDEN, not deleted: CLAUDE.md keeps the HubSpot
    // connector and its hooks deliberately dormant for a future CRM upgrade,
    // so the fields, their state and the save path all still exist — flip this
    // one flag to true and every one of them comes back exactly as it was.
    const SHOW_LAB_LEGACY_UI = false;

    const handleResponse = async (response) => {
      if (!response.ok) {
        // Auto-redirect to login on auth failure (expired/invalid token)
        if (response.status === 401 || response.status === 403) {
          try {
            const errData = await response.clone().json();
            if (errData.error === 'Invalid token' || errData.error === 'User not found' || response.status === 401) {
              localStorage.clear();
              window.location.href = '/login';
              throw new Error('Session expired. Redirecting to login...');
            }
          } catch (redirectErr) {
            if (redirectErr.message.includes('Session expired')) throw redirectErr;
          }
        }
        // The server's own sentence is the useful part. It used to be thrown
        // INSIDE a try whose own catch replaced it with the status code, so
        // every failure on this page read "HTTP error 400" and named nothing.
        // Read the body first, throw after — a throw cannot be swallowed by
        // the block that was only there to handle a non-JSON body.
        let serverMessage = '';
        try {
          const errorData = await response.json();
          if (errorData && errorData.error) serverMessage = String(errorData.error);
        } catch (e) { /* no JSON body — fall back to the status below */ }
        throw new Error(serverMessage || `HTTP error ${response.status}`);
      }
      return response.json();
    };

    // Owner, 2026-11-04: a manager or care coordinator opens the Admin Hub for
    // User Management and nothing else. Everything else here stays the Super
    // Admin's; the server still refuses what they may not do.
    const HUB_OFFICE_TYPES = ['manager', 'coordinator'];
    // Since the Modules grid (owner, 2026-11-13) it is whoever holds User
    // Management: the record's `modules` when the server sent it, otherwise
    // the account type as before. The server still refuses the rest.
    const isHubOffice = (u) => !!u && u.role !== 'admin' &&
      (Array.isArray(u.modules) ? u.modules.includes('users') : HUB_OFFICE_TYPES.includes(u.accountType));
    // USER MANAGEMENT IS INTERNAL STAFF ONLY (owner, 2026-11-09). Client and
    // family accounts live in the Clients area (/clients) and never appear
    // here. The full user list is still loaded, because the caregiver and
    // liaison client pickers read it; only what this page SHOWS is staff.
    const isStaffAccount = (u) => !!u && !['client', 'family'].includes(u.role);
    // What a manager or coordinator sees here: caregivers (accountTypes.js E1;
    // the client and family accounts they also manage are on /clients).
    const OFFICE_MANAGED_TYPES = ['caregiver'];

    const api = {
      adminLogin: (email, password) =>
        fetch(`${API_URL}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        }).then(handleResponse).then(r => window.GFC_MFA.complete(r)).then(result => {
          // The Admin Hub is the Super Admin's (owner, 2026-10-15), with User
          // Management open to managers and coordinators (owner, 2026-11-04).
          if (result.user && result.user.role !== 'admin' && !isHubOffice(result.user)) {
            return { error: 'Access denied. Admin Hub access required.' };
          }
          return result;
        }).catch(err => ({ error: err.message })),

      getDashboard: (token) =>
        fetch(`${API_URL}/api/admin-hub/dashboard`, {
          headers: { 'Authorization': `Bearer ${token}` }
        }).then(handleResponse).catch(err => ({ error: err.message })),

      // Scheduling summary for the dashboard block. Admin-only server-side, so
      // a non-admin gets an error object and the block simply does not render —
      // the gate is the route, never the absence of a tile.
      getSchedulingSummary: (token) =>
        fetch(`${API_URL}/api/scheduling/summary`, {
          headers: { 'Authorization': `Bearer ${token}` }
        }).then(handleResponse).catch(err => ({ error: err.message })),

      // The AI setup panel. Same rule as the scheduling summary above: a
      // non-admin gets an error object and the panel simply does not render —
      // the gate is the route, never the absence of a tile.
      getAiStatus: (token) =>
        fetch(`${API_URL}/api/admin/ai/status`, {
          headers: { 'Authorization': `Bearer ${token}` }
        }).then(handleResponse).catch(err => ({ error: err.message })),
      // OpenEMR's code catalog as the app last cached it (2026-10-28). Admin
      // only server-side; a refused read renders nothing.
      getCodeCatalog: (token) =>
        fetch(`${API_URL}/api/admin/code-catalog`, {
          headers: { 'Authorization': `Bearer ${token}` }
        }).then(handleResponse).catch(err => ({ error: err.message })),
      // A failed refresh still answers with the cached view, so the body is
      // read whatever the status: the panel must show the old catalog AND why
      // the refresh failed.
      refreshCodeCatalog: (token) =>
        fetch(`${API_URL}/api/admin/code-catalog/refresh`, {
          method: 'POST', headers: { 'Authorization': `Bearer ${token}` }
        }).then(r => r.json().catch(() => ({ error: `HTTP error ${r.status}` }))).catch(err => ({ error: err.message })),
      recheckAi: (token) =>
        fetch(`${API_URL}/api/admin/ai/recheck`, {
          method: 'POST', headers: { 'Authorization': `Bearer ${token}` }
        }).then(handleResponse).catch(err => ({ error: err.message })),
      runAiTest: (token) =>
        fetch(`${API_URL}/api/admin/ai/test`, {
          method: 'POST', headers: { 'Authorization': `Bearer ${token}` }
        }).then(handleResponse).catch(err => ({ error: err.message })),

      getUsers: (token) =>
        fetch(`${API_URL}/api/users`, {
          headers: { 'Authorization': `Bearer ${token}` }
        }).then(handleResponse).catch(err => ({ error: err.message })),

      createUser: (token, userData) =>
        fetch(`${API_URL}/api/users`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(userData)
        }).then(handleResponse).catch(err => ({ error: err.message })),

      // Like createUser, but a refusal keeps the server's details (whose
      // account an email already belongs to) so the form can offer the next step.
      createUserDetailed: async (token, userData) => {
        try {
          const r = await fetch(`${API_URL}/api/users`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(userData)
          });
          const body = await r.json().catch(() => ({}));
          if (!r.ok) return { error: body.error || `HTTP error ${r.status}`, code: body.code || null, existingUser: body.existingUser || null };
          return body;
        } catch (err) { return { error: err.message }; }
      },

      updateUser: (token, userId, userData) =>
        fetch(`${API_URL}/api/users/${userId}`, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(userData)
        }).then(handleResponse).catch(err => ({ error: err.message })),

      // The clinical role vocabulary (Session 4.8) — SERVED, never restated in
      // this page. A second copy of the enum is a copy that drifts, and a
      // drifting clinical role decides who may prescribe.
      getClinicalRoles: (token) =>
        fetch(`${API_URL}/api/admin/clinical-roles`, {
          headers: { 'Authorization': `Bearer ${token}` }
        }).then(handleResponse).catch(err => ({ error: err.message })),

      // Verified competencies (Session 6). Deliberately a SEPARATE call from the
      // user save: the user PUT never touches skilledCompetencies, so a normal
      // profile edit can never wipe what a caregiver is signed off to do.
      getCompetencyCatalog: (token) =>
        fetch(`${API_URL}/api/caregiver/admin/competencies`, {
          headers: { 'Authorization': `Bearer ${token}` }
        }).then(handleResponse).catch(err => ({ error: err.message })),

      // Moving a patient's login to their POA (owner, 2026-10-20). The app
      // only suggests which logins might be the POA's; an admin decides.
      getPossiblePoaLogins: (token) =>
        fetch(`${API_URL}/api/gfc/admin/clients/possible-poa-logins`, {
          headers: { 'Authorization': `Bearer ${token}` }
        }).then(handleResponse).catch(err => ({ error: err.message })),
      poaCutover: (token, clientId, body) =>
        fetch(`${API_URL}/api/gfc/admin/clients/${clientId}/poa-cutover`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        }).then(handleResponse).catch(err => ({ error: err.message })),

      setCompetencies: (token, userId, skilledCompetencies) =>
        fetch(`${API_URL}/api/caregiver/admin/caregivers/${userId}/competencies`, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ skilledCompetencies })
        }).then(handleResponse).catch(err => ({ error: err.message })),

      // Account recovery (Session 5.3 / 5.2 routes; this is their first UI).
      // Resetting MFA and disconnecting OpenEMR are two independent things —
      // see the cards in the Edit User form — and neither touches the
      // password field above.
      // "View as" (impersonation.js). Super Admin only; the server refuses
      // admin targets, nested starts and anyone without an MFA-verified session.
      // Two more Session 5 routes whose first UI this is. Both are admin-only
      // and neither is the password field on the form: that one SETS a password
      // the admin then has to convey; this one emails the person a reset link
      // and never hands the password back.
      emailPasswordReset: (token, userId) =>
        fetch(`${API_URL}/api/admin/reset-user-password/${encodeURIComponent(userId)}`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({})
        }).then(handleResponse).catch(asError),

      revokeUserSessions: (token, userId) =>
        fetch(`${API_URL}/api/users/${encodeURIComponent(userId)}/sessions/revoke`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
        }).then(handleResponse).catch(asError),

      startViewAs: (token, userId) =>
        fetch(`${API_URL}/api/admin/impersonate/${userId}`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` }
        }).then(handleResponse).catch(err => ({ error: err.message })),

      resetUserMfa: (token, userId) =>
        fetch(`${API_URL}/api/users/${userId}/mfa/reset`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` }
        }).then(handleResponse).catch(err => ({ error: err.message })),

      getEmrStatus: (token, userId) =>
        fetch(`${API_URL}/api/users/${userId}/emr/status`, {
          headers: { 'Authorization': `Bearer ${token}` }
        }).then(handleResponse).catch(err => ({ error: err.message })),

      disconnectUserEmr: (token, userId) =>
        fetch(`${API_URL}/api/users/${userId}/emr/disconnect`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` }
        }).then(handleResponse).catch(err => ({ error: err.message })),

      // Caregiver documents. The admin files onboarding paperwork on a
      // caregiver's behalf and must name them; the API refuses an unnamed one.
      listCaregiverDocs: (token, caregiverId) =>
        fetch(`${API_URL}/api/caregiver/documents?caregiverId=${encodeURIComponent(caregiverId)}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        }).then(handleResponse).catch(err => ({ error: err.message })),

      getCaregiverDocKinds: (token) =>
        fetch(`${API_URL}/api/caregiver/documents/kinds`, {
          headers: { 'Authorization': `Bearer ${token}` }
        }).then(handleResponse).catch(err => ({ error: err.message })),

      uploadCaregiverDoc: async (token, body) => {
        // Deliberately NOT handleResponse: it throws Error(error) and drops
        // `hint`/`setup`, which are the only parts that say what to fix.
        // Widening the shared helper would touch every call on this page.
        try {
          const res = await fetch(`${API_URL}/api/caregiver/documents`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          const data = await res.json().catch(() => null);
          if (!res.ok) {
            if (res.status === 401) return { error: 'Your session expired. Sign in again and re-upload.' };
            return {
              error: (data && data.error) || `The server answered ${res.status}.`,
              hint: data && data.hint, setup: data && data.setup
            };
          }
          return data;
        } catch (err) { return { error: err.message }; }
      },

      deleteCaregiverDoc: (token, id) =>
        fetch(`${API_URL}/api/caregiver/documents/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        }).then(handleResponse).catch(err => ({ error: err.message })),

      deleteUser: (token, userId) =>
        fetch(`${API_URL}/api/users/${userId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        }).then(handleResponse).catch(err => ({ error: err.message })),

      getProjects: (token) =>
        fetch(`${API_URL}/api/projects`, {
          headers: { 'Authorization': `Bearer ${token}` }
        }).then(handleResponse).catch(err => ({ error: err.message })),

      getPasswordResetRequests: (token) =>
        fetch(`${API_URL}/api/admin/password-reset-requests`, {
          headers: { 'Authorization': `Bearer ${token}` }
        }).then(handleResponse).catch(err => ({ error: err.message })),

      handlePasswordReset: (token, requestId) =>
        fetch(`${API_URL}/api/admin/password-reset-requests/${requestId}`, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'completed' })
        }).then(handleResponse).catch(err => ({ error: err.message })),

      dismissPasswordReset: (token, requestId) =>
        fetch(`${API_URL}/api/admin/password-reset-requests/${requestId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        }).then(handleResponse).catch(err => ({ error: err.message })),

      bulkPasswordReset: (token, userType = 'all') =>
        fetch(`${API_URL}/api/admin/bulk-password-reset`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ userType })
        }).then(handleResponse).catch(err => ({ error: err.message })),

      getServiceReports: (token) =>
        fetch(`${API_URL}/api/service-reports`, {
          headers: { 'Authorization': `Bearer ${token}` }
        }).then(handleResponse).catch(err => ({ error: err.message })),

      // Service Portal APIs
      getServiceClients: (token) =>
        fetch(`${API_URL}/api/service-portal/clients`, {
          headers: { 'Authorization': `Bearer ${token}` }
        }).then(handleResponse).catch(err => ({ error: err.message })),

      submitServiceReport: (token, reportData) =>
        fetch(`${API_URL}/api/service-reports`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(reportData)
        }).then(handleResponse).catch(err => ({ error: err.message })),

      // Service Report Assignment APIs
      getTechnicians: (token) =>
        fetch(`${API_URL}/api/service-portal/technicians`, {
          headers: { 'Authorization': `Bearer ${token}` }
        }).then(handleResponse).catch(err => ({ error: err.message })),

      assignServiceReport: (token, reportData) =>
        fetch(`${API_URL}/api/service-reports/assign`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(reportData)
        }).then(handleResponse).catch(err => ({ error: err.message })),

      uploadServiceReportPhotos: (token, reportId, files) => {
        const formData = new FormData();
        files.forEach(file => formData.append('photos', file));
        return fetch(`${API_URL}/api/service-reports/${reportId}/photos`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData
        }).then(handleResponse).catch(err => ({ error: err.message }));
      },

      uploadServiceReportFiles: (token, reportId, files) => {
        const formData = new FormData();
        files.forEach(file => formData.append('files', file));
        return fetch(`${API_URL}/api/service-reports/${reportId}/files`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData
        }).then(handleResponse).catch(err => ({ error: err.message }));
      },

      updateManagerNotes: (token, reportId, managerNotes) =>

    const LoginPage = ({ onLogin }) => {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

        e.preventDefault();
        setLoading(true);
        setError('');
        const result = await api.adminLogin(email, password);
        if (result.error) {
          setError(result.error);
        } else {
          localStorage.setItem('admin_token', result.token);
          localStorage.setItem('admin_user', JSON.stringify(result.user));
          onLogin(result.token, result.user);

                    <svg className="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                    <span>{error}</span>
                  </div>
                )}

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                  <input
                    type="email"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    className="input-modern w-full px-4 py-3 text-gray-900 placeholder-gray-400"
                    placeholder="you@godwinsfamilycarellc.com"
                    required
                  />
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">Password</label>
                  <input
                    type="password"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    className="input-modern w-full px-4 py-3 text-gray-900 placeholder-gray-400"
                    placeholder="Enter your password"
                    required
                  />
                </div>

                <button
                  type="submit"
                  disabled={loading}
                  className="btn-primary w-full text-white py-3.5 rounded-xl font-semibold text-sm tracking-wide disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                >
                  {loading ? (
                    <>
                      <svg className="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                      <span>Signing in...</span>
                    </>
                  ) : (
                    <span>Sign In</span>
                  )}
                </button>
              </form>

              {/* Footer */}
              <div className="mt-8 pt-6 border-t border-gray-100 text-center">
                <p className="text-xs text-gray-400">&copy; 2026 Godwins Family Care LLC. All rights reserved.</p>
                <a href="/changelog" className="text-primary-500 hover:underline text-xs mt-1 inline-block">View Changelog</a>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ── Messages (Session 9) ──
    // A PANEL, not a page: it lives inside the Inbox as its first tab. Two
    // sidebar entries both called some form of "inbox" — one for real people
    // messaging, one for bug reports and password resets — read as duplicates
    // of each other, so there is now one Inbox and these are its tabs.
    //
    // Admin has full visibility by the matrix, so this is the whole board: no
    // client scope is passed, and the server returns every thread. That is the
    // one role for which "everything" is the correct answer, and it is decided
    // there, not by leaving the filter off here. Leaving the scope unset is
    // also what gives the panel its client picker.
    const MessagesPanel = ({ token, user }) => {
      React.useEffect(() => {
        const lib = window.GFCMessaging;
        if (!lib || !token) return undefined;
        // The caller's REAL role, not a hardcoded 'admin'. It is display-only
        // (the server decides which threads come back from the token), but a
        // manager should not be shown someone else's label.
        lib.mount('gfc-messaging-admin', { userId: user && user.id, role: (user && user.role) || 'admin', authToken: token });
        return () => lib.unmount('gfc-messaging-admin');
      }, [token, user && user.id]);

      return (
        <div className="bg-white rounded-xl shadow-soft border border-gray-100 p-5">
          {window.GFCMessaging
            ? <div id="gfc-messaging-admin"></div>
            : <p className="text-sm text-gray-500">Messages did not load. Refresh the page.</p>}
        </div>
      );
    };

    // Dashboard Page - Modern design
    // ── AI setup and the go-live proof (Session G1, H3) ──────────────────
    //
    // The panel ASKS THE SERVER and renders nothing if the server refuses, so
    // the page restates no role rule of its own. "Run test" is the owner's
    // only proof of the Google side: everything else here can be true while
    // Google still refuses the identity.
    // The billing code catalog. OpenEMR owns it; the app shows how old its
    // cached copy is and never hides a stale or failed one. No dismiss button:
    // the banner clears when the catalog is fresh and every rule-list code is
    // active in OpenEMR.
    const CodeCatalogPanel = ({ token }) => {
      const [view, setView] = useState(null);
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState('');
      useEffect(() => { api.getCodeCatalog(token).then(d => { if (d && d.loaded !== undefined) setView(d); }); }, [token]);
      if (!view) return null;
      const refresh = async () => {
        setBusy(true); setErr('');
        const d = await api.refreshCodeCatalog(token);
        if (d && d.loaded !== undefined) setView(d);
        if (d && d.error) setErr(d.error);
        setBusy(false);
      };
      const when = view.fetchedAt ? new Date(view.fetchedAt).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' }) : null;
      const last = view.lastAttempt;
      const warn = !view.loaded || view.stale || (view.problems || []).length > 0 || (last && !last.ok);
      return (
        <div className={`p-4 rounded-xl border ${warn ? 'bg-amber-50 border-amber-300' : 'bg-white border-gray-200'}`}>
          <div className="flex flex-wrap items-start justify-between gap-3">
            <div>
              <p className={`font-semibold ${warn ? 'text-amber-900' : 'text-gray-900'}`}>
                {!view.loaded ? 'Billing code catalog not loaded' : view.stale ? 'Billing code catalog is stale' : 'Billing code catalog'}
              </p>
              <p className={`text-sm mt-1 ${warn ? 'text-amber-800' : 'text-gray-600'}`}>
                {view.loaded
                  ? `${view.activeCount} active CPT and HCPCS codes from OpenEMR, last refreshed ${when}.`
                  : 'The app has never read OpenEMR\'s code catalog, so no service code can be checked or offered from the app\'s side.'}
                {view.loaded && view.stale ? ` That is more than ${view.staleAfterHours} hours ago; the cached copy is still in use.` : ''}
              </p>
              {last && !last.ok && (
                <p className="text-sm text-amber-800 mt-1">Last refresh failed {new Date(last.at).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' })}: {last.error}</p>
              )}
              {(view.problems || []).map(p => (
                <p key={`${p.file}:${p.code}`} className="text-sm text-amber-900 mt-1">{p.message}</p>
              ))}
              {err && <p className="text-sm text-red-700 mt-1">{err}</p>}
            </div>
            <button onClick={refresh} disabled={busy}
              className="px-3 py-1.5 rounded-lg text-sm font-semibold bg-primary-600 text-white disabled:opacity-50">
              {busy ? 'Refreshing…' : 'Refresh Catalog'}
            </button>
          </div>
        </div>
      );
    };

    const AiSetupPanel = ({ token }) => {
      const [st, setSt] = useState(null);
      const [busy, setBusy] = useState(null);
      const [result, setResult] = useState(null);

      const load = () => api.getAiStatus(token).then(d => { if (!d.error) setSt(d); });
      useEffect(() => { load(); }, [token]);
      if (!st) return null;

      const run = () => {
        setBusy('test'); setResult(null);
        api.runAiTest(token).then(r => setResult(r)).finally(() => setBusy(null));
      };
      const recheck = () => {
        setBusy('recheck');
        api.recheckAi(token).then(r => { if (r && r.status) setSt({ ...st, ...r.status, checks: r.checks }); })
          .finally(() => setBusy(null));
      };

      return (
        <div className="bg-white rounded-xl border border-gray-200 p-5 mb-6">
          <div className="flex flex-wrap items-center justify-between gap-2">
            <div>
              <h3 className="font-semibold text-gray-900">AI (Gemini on Vertex AI)</h3>
              <p className="text-xs text-gray-500">{st.proof}</p>
            </div>
            <span className={`px-2 py-0.5 rounded text-xs font-medium ${st.configured ? 'bg-green-100 text-green-800' : 'bg-amber-100 text-amber-800'}`}>
              {st.configured ? 'Switched on' : 'Not switched on'}
            </span>
          </div>

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mt-4 text-xs">
            {[['Model', st.model], ['Location', st.location], ['Project', st.projectId],
              ['Credential', st.credentialType], ['Staging bucket', st.stagingBucket],
              ['Zero data retention', st.zeroDataRetention ? 'confirmed' : 'not confirmed'],
              ['Reviews kept', `${st.retentionDays} days`]].map(([k, v]) => (
              <div key={k}>
                <div className="text-gray-500">{k}</div>
                <div className="font-medium text-gray-900 break-words">{v || '—'}</div>
              </div>
            ))}
          </div>

          {/* A static key is refused rather than used, and the panel says so
              in those words rather than showing a neutral value. */}
          {st.usesStaticKeys && (
            <div className="mt-3 text-xs text-red-800 bg-red-50 border border-red-200 rounded p-2">
              That credential is a static service-account key. Workload Identity Federation is required, so it is refused rather than used.
            </div>
          )}

          <div className="mt-4 border-t border-gray-100 pt-3">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div className="text-xs text-gray-600">
                Google-side checks:{' '}
                {st.checks && st.checks.at
                  ? <>last run {window.GFC_TIME ? window.GFC_TIME.fmtDateTime(st.checks.at) : new Date(st.checks.at).toLocaleString()} — <strong>{st.checks.ok && !st.checks.stale ? 'passed' : 'not passing'}</strong></>
                  : <strong>never run</strong>}
              </div>
              <button onClick={recheck} disabled={busy === 'recheck'}
                className="px-3 py-1.5 text-xs rounded border border-gray-300 text-gray-700 hover:bg-gray-50">
                {busy === 'recheck' ? 'Checking…' : 'Re-Run Checks'}
              </button>
            </div>
            {!!(st.checks && st.checks.failures || []).length && (
              <ul className="mt-2 text-xs text-amber-900 list-disc pl-4 space-y-0.5">
                {st.checks.failures.map((f, i) => <li key={i}>{f}</li>)}
              </ul>
            )}
          </div>

          {!!(st.blockers || []).length && (
            <div className="mt-3">
              <div className="text-xs font-semibold text-gray-700">What is still needed</div>
              <ul className="mt-1 text-xs text-gray-600 list-disc pl-4 space-y-0.5">
                {st.blockers.map((b, i) => <li key={i}>{b}</li>)}
              </ul>
            </div>
          )}

          <div className="mt-4 border-t border-gray-100 pt-3">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div className="text-xs text-gray-600">
                Runs a made-up chart and document — <strong>no real patient</strong> — through the real path, including a two-pass split and the merge.
              </div>
              <button onClick={run} disabled={busy === 'test' || !st.configured}
                className="px-3 py-1.5 text-xs rounded bg-primary-600 text-white disabled:opacity-50">
                {busy === 'test' ? 'Running…' : 'Run Test'}
              </button>
            </div>
            {result && (
              <div className={`mt-2 text-xs rounded p-2 border ${result.ok ? 'bg-green-50 border-green-200 text-green-900' : 'bg-red-50 border-red-200 text-red-900'}`}>
                <div className="font-semibold">{result.ok ? result.message : (result.error || 'The test did not pass.')}</div>
                {!!(result.passes || []).length && (
                  <div className="mt-1">
                    {result.passes.map(p => (
                      <div key={p.pass}>
                        Pass {p.pass}: {p.sections} sections, {p.documents} document(s), {p.findings} finding(s)
                        {p.inputTokens != null ? ` — ${p.inputTokens} in / ${p.outputTokens} out` : ''}
                      </div>
                    ))}
                  </div>
                )}
                {result.ok && <div className="mt-1">{result.findings} finding(s) after the merge{result.droppedUncited ? `, ${result.droppedUncited} dropped for not citing a source` : ''}.</div>}
                {result.sampleFinding && <div className="mt-1 italic">e.g. “{result.sampleFinding.statement}”</div>}
                {!!(result.blockers || []).length && (
                  <ul className="mt-1 list-disc pl-4">{result.blockers.map((b, i) => <li key={i}>{b}</li>)}</ul>
                )}
              </div>
            )}
          </div>
        </div>
      );
    };

    // ── T1 D2 — video visits, and the proof that they work ─────────────────
    //
    // `configured` means the settings parse. It is NOT evidence that Google
    // accepts them, and this panel says so in those words rather than showing
    // a green tick that has not been earned — the distinction a narrowed OAuth
    // token behind a green "OpenEMR connected" cost this repo weeks.
    const MeetSetupPanel = ({ token }) => {
      const [st, setSt] = useState(null);
      const [busy, setBusy] = useState(false);
      const [result, setResult] = useState(null);
      useEffect(() => { api.getMeetStatus(token).then(setSt); }, [token]);
      if (!st) return null;
      if (st.error) return (
        <div className="card-modern p-6">
          <h2 className="text-lg font-semibold text-gray-900 mb-2">Video visits</h2>
          <p className="text-sm text-red-700">{st.error}</p>
        </div>
      );
      const m = st.meet || {};
      const missing = (st.hosts && st.hosts.withoutWorkspaceAccount) || [];
      const run = () => {
        setBusy(true); setResult(null);
        api.testMeetRoom(token).then(r => { setResult(r); setBusy(false); api.getMeetStatus(token).then(setSt); });
      };
      return (
        <div className="card-modern p-6">
          <div className="flex items-start justify-between gap-3 flex-wrap mb-4">
            <h2 className="text-lg font-semibold text-gray-900">Video visits</h2>
            <span className={`text-xs font-medium px-2.5 py-1 rounded-full ${m.configured ? 'bg-teal-50 text-teal-700' : 'bg-amber-50 text-amber-800'}`}>
              {m.configured ? 'Settings in place' : 'Not set up'}
            </span>
          </div>
          {!m.configured && (
            <div className="mb-4">
              <p className="text-sm text-gray-700 mb-2">A telehealth visit booked now gets no video room. What is missing:</p>
              <ul className="text-sm text-gray-700 list-disc pl-5 space-y-1">
                {(m.blockers || []).map((b, i) => <li key={i}>{b}</li>)}
              </ul>
            </div>
          )}
          {m.configured && (
            <p className="text-sm text-gray-700 mb-4">
              The settings parse, which is not the same as Google accepting them. Press Test video room to find out.
            </p>
          )}
          <div className="flex items-center gap-3 flex-wrap">
            <button onClick={run} disabled={busy || !m.configured}
              className="px-4 py-2 rounded-xl bg-primary-500 text-white text-sm font-medium disabled:opacity-50">
              {busy ? 'Testing…' : 'Test Video Room'}
            </button>
            <span className="text-xs text-gray-500">
              Creates a real room and shuts it again. No patient is involved.
            </span>
          </div>
          {result && (
            <p className={`text-sm mt-3 ${result.error ? 'text-red-700' : 'text-teal-700'}`}>
              {result.error || result.message}
            </p>
          )}
          {missing.length > 0 && (
            <div className="mt-4 p-3 bg-amber-50 rounded-xl">
              <p className="text-sm text-gray-800 mb-1">
                <b>{missing.length}</b> {missing.length === 1 ? 'clinician has' : 'clinicians have'} no GFC Google account, so they cannot host a video visit.
                Their visits will book and then have no room.
              </p>
              <p className="text-xs text-gray-600">
                {missing.map(u => u.name).join(', ')} — each needs a mailbox on {(st.workspaceDomains || []).join(' or ')}.
              </p>
            </div>
          )}
          {st.openRooms > 0 && (
            <p className="text-xs text-gray-500 mt-3">{st.openRooms} video {st.openRooms === 1 ? 'room is' : 'rooms are'} open for booked visits.</p>
          )}
        </div>
      );
    };

    const DashboardPage = ({ token, onNavigate, user }) => {
      const MG = window.MyGFC;
      const isManager = user?.isManager && user?.role !== 'admin';
      const [stats, setStats] = useState(null);
      const [sched, setSched] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        api.getDashboard(token).then(data => {
          if (!data.error) setStats(data);
          setLoading(false);
        });
        // Separate call, deliberately not awaited with the one above: the
        // dashboard must still render if scheduling is unreachable or refuses.
        api.getSchedulingSummary(token).then(data => {
          if (data && !data.error && data.summary) setSched(data.summary);
        });
      }, [token]);

      if (loading) return (
        <div className="flex items-center justify-center py-20">
          <div className="flex flex-col items-center gap-4">
            <div className="animate-spin rounded-full h-10 w-10 border-[3px] border-primary-500 border-t-transparent"></div>
            <p className="text-gray-500 text-sm">Loading dashboard...</p>
          </div>
        </div>
      );

      // "New Launches" counts lab-era projects and means nothing for GFC, so
      // it is hidden with the rest of the lab UI rather than sitting on the
      // dashboard at zero forever. Caregivers earns the slot it leaves.
      const statCards = [
        { label: 'Total Users', value: stats?.totalUsers || 0, color: 'from-primary-500 to-primary-700', icon: Icons.users },
        { label: 'Client Accounts', value: stats?.clientUsers || 0, color: 'from-warning-500 to-warning-600', icon: Icons.folder },
        { label: 'Caregivers', value: stats?.caregiverUsers || 0, color: 'from-success-500 to-success-600', icon: Icons.clipboard },
        ...(SHOW_LAB_LEGACY_UI
          ? [{ label: 'New Launches', value: stats?.activeProjects || 0, color: isManager ? 'from-warning-500 to-warning-600' : 'from-accent to-primary-900', icon: Icons.rocket }]
          : [])
      ];

      return (
        <div className="space-y-8 animate-fade-in">
          {/* AI setup and the owner's go-live proof. Renders nothing at all
              if the server refuses the status read, so this page restates no
              role rule of its own. */}
          <AiSetupPanel token={token} />
          <CodeCatalogPanel token={token} />
          {/* Billing reference-data reminder (owner-directed, 2026-09-24). There
              is no real billing backend yet, so CMS's quarterly NCCI/MUE tables
              (the sign-time bundling check) have no operator behind them at all
              except this. It reads the same stored data the sign gate reads and
              clears itself the moment scripts/load_ncci_tables.js actually runs
              — there is no dismiss button, on purpose: a reminder someone can
              click away without doing the work is worse than no reminder. Every
              admin and manager lands here, so both see it. */}
          {/* The E/M level table (emLevels.js) has a known expiry: CPT changes every
              January. Admin hub only, never a clinician or coder screen. */}
          {(stats?.serviceRulesReview || []).length > 0 && (
            <div className="bg-amber-50 border border-amber-300 p-4 rounded-xl">
              <p className="font-semibold text-amber-900">Service selection rules are past their review date</p>
              <p className="text-sm text-amber-800 mt-1">
                {stats.serviceRulesReview.map(r => `serviceRules/${r.family} (due ${r.nextReviewDue})`).join(', ')}. Re-verify each against the current CPT code set and CMS booklets, then update verifiedOn and nextReviewDue.
              </p>
            </div>
          )}
          {stats?.emLevelReview?.overdue && (
            <div className="bg-amber-50 border border-amber-300 p-4 rounded-xl">
              <p className="font-semibold text-amber-900">E/M level table is past its review date</p>
              <p className="text-sm text-amber-800 mt-1">
                {stats.emLevelReview.file} was verified {stats.emLevelReview.verifiedOn} and was due for review {stats.emLevelReview.nextReviewDue}.
                Re-verify it against the current CPT code set, then update verifiedOn and nextReviewDue in the file.
              </p>
            </div>
          )}
          {stats?.billingDataRefresh?.due && (
            <div className="bg-amber-50 border border-amber-300 p-4 rounded-xl">
              <p className="font-semibold text-amber-900">
                Quarterly billing reference data needs refreshing
              </p>
              <p className="text-sm text-amber-800 mt-1">
                {stats.billingDataRefresh.message}
              </p>
              <p className="text-xs text-amber-700 mt-2">
                This runs on the server, not in this app — someone with access to the deployment runs
                <code className="mx-1 px-1.5 py-0.5 bg-white rounded border border-amber-200">node scripts/load_ncci_tables.js</code>
                each quarter (the MUE half fetches on its own; the PTP half needs that quarter's CMS zip files placed
                in <code className="mx-1 px-1.5 py-0.5 bg-white rounded border border-amber-200">scripts/ncci_source/ptp/</code> first
                — see <code className="mx-1 px-1.5 py-0.5 bg-white rounded border border-amber-200">scripts/ncci_source/README.md</code>).
                Until a real billing backend exists, this banner is the only reminder there is — it stays until the
                loader is actually re-run.
              </p>
            </div>
          )}

          {/* At a glance, in the My GFC tile style (owner, 2026-11-09). */}
          {MG && (
            <div className="mg-tiles">
              {[
                { icon: 'ti-users', n: stats?.totalUsers, label: 'Total users', href: '/admin?view=users' },
                { icon: 'ti-heart-handshake', n: stats?.clientUsers, label: 'Client accounts', href: '/admin?view=users&group=clients' },
                { icon: 'ti-user-heart', n: stats?.caregiverUsers, label: 'Caregivers', href: '/caregivers' },
                ...(SHOW_LAB_LEGACY_UI ? [{ icon: 'ti-rocket', n: stats?.activeProjects, label: 'New launches', href: '#' }] : [])
              ].map(t => (
                <a key={t.label} href={t.href} className="mg-tile">
                  <span className="mg-ic"><i className={`ti ${t.icon}`} /></span>
                  <span><span style={{ display: 'block', fontSize: 30, fontWeight: 700, color: 'var(--navy)', lineHeight: 1.1 }}>{t.n || 0}</span><small>{t.label}</small></span>
                </a>
              ))}
            </div>
          )}

          {/* Caregiver scheduling — the dashboard block (2026-09-13, owner request).
              Renders only when the admin-only summary actually came back, so the
              access control is the route rather than a hidden tile. Every row is
              something waiting on a person; a zero row is deliberately still
              shown, because "nothing is waiting" is information too. */}
          {sched && (
            <div className="card-modern p-6">
              <div className="flex items-start justify-between mb-5 gap-3 flex-wrap">
                <h2 className="text-lg font-semibold text-gray-900 flex items-center gap-2">
                  <span className="w-8 h-8 rounded-lg bg-teal-50 text-teal-600 flex items-center justify-center">{Icons.clipboard}</span>
                  Staff Scheduling
                </h2>
                <a href="/scheduling" className="text-sm font-medium text-primary-600 hover:text-primary-700">Open scheduling →</a>
              </div>

              <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
                <div className="p-4 bg-gray-50 rounded-xl">
                  <p className="text-2xl font-bold text-gray-900">{sched.today}</p>
                  <p className="text-xs text-gray-500 mt-1">Shifts today</p>
                </div>
                <div className="p-4 bg-gray-50 rounded-xl">
                  <p className="text-2xl font-bold text-gray-900">{sched.inProgress}</p>
                  <p className="text-xs text-gray-500 mt-1">Clocked in now</p>
                </div>
                <div className={`p-4 rounded-xl ${sched.openUnfilled ? 'bg-warning-50' : 'bg-gray-50'}`}>
                  <p className={`text-2xl font-bold ${sched.openUnfilled ? 'text-warning-600' : 'text-gray-900'}`}>{sched.openUnfilled}</p>
                  <p className="text-xs text-gray-500 mt-1">Unfilled shifts</p>
                </div>
                <div className={`p-4 rounded-xl ${sched.flaggedTimeLogs ? 'bg-warning-50' : 'bg-gray-50'}`}>
                  <p className={`text-2xl font-bold ${sched.flaggedTimeLogs ? 'text-warning-600' : 'text-gray-900'}`}>{sched.flaggedTimeLogs}</p>
                  <p className="text-xs text-gray-500 mt-1">Time logs to review</p>
                </div>
              </div>

              {/* Waiting on someone. Each line says who it is waiting on, because
                  "3 pending" without that is a number nobody can act on. */}
              <div className="space-y-2">
                {sched.awaitingApproval > 0 && (
                  <a href="/scheduling" className="flex items-center justify-between p-3 bg-warning-50 hover:bg-warning-100 rounded-xl transition">
                    <span className="text-sm text-gray-800">
                      <b>{sched.awaitingApproval}</b> claimed {sched.awaitingApproval === 1 ? 'shift is' : 'shifts are'} waiting on <b>your</b> approval
                    </span>
                    <span className="text-xs text-warning-700 font-medium whitespace-nowrap ml-3">Review →</span>
                  </a>
                )}
                {sched.awaitingAcceptance > 0 && (
                  <div className="flex items-center justify-between p-3 bg-gray-50 rounded-xl">
                    <span className="text-sm text-gray-700">
                      <b>{sched.awaitingAcceptance}</b> assigned {sched.awaitingAcceptance === 1 ? 'shift is' : 'shifts are'} waiting on the caregiver to accept
                    </span>
                  </div>
                )}
                {sched.clientsMissingCoordinates > 0 && (
                  <a href="/scheduling" className="flex items-center justify-between p-3 bg-red-50 hover:bg-red-100 rounded-xl transition">
                    <span className="text-sm text-gray-800">
                      <b>{sched.clientsMissingCoordinates}</b> of {sched.clientCount} {sched.clientsMissingCoordinates === 1 ? 'client has' : 'clients have'} no address coordinates — clock-ins there can only record as unverifiable
                    </span>
                    <span className="text-xs text-red-700 font-medium whitespace-nowrap ml-3">Locations →</span>
                  </a>
                )}
                {!sched.awaitingApproval && !sched.awaitingAcceptance && !sched.clientsMissingCoordinates && (
                  <p className="text-sm text-gray-500 p-3">Nothing is waiting on you.</p>
                )}
              </div>
            </div>
          )}

          {/* T1 D2 — admin-only, like every other setup panel here. */}
          {!isManager && <MeetSetupPanel token={token} />}

          {/* The Admin Hub's own pages. Everything else (Enrollment, Clinical,
              Caregivers, Scheduling, Billing, the Audit Log) lives on the Portal
              Hub and in the "All areas" menu at the top of every staff page, so
              this is no longer a third launcher (owner, 2026-11-09). */}
          {MG && (
            <MG.Section title="In the Admin Hub" sub="Everything else is on the Portal Hub, and in the All areas menu at the top of every page.">
              <div className="mg-tiles">
                <MG.Tile icon="ti-inbox" title="Inbox" sub="Messages, feed posts, feedback, password resets" onClick={() => onNavigate('inbox')} />
                <MG.Tile icon="ti-users" title="User Management" sub="Add and edit accounts" onClick={() => onNavigate('users')} />
                <MG.Tile icon="ti-bell" title="Notifications" sub="Templates and the send queue" onClick={() => onNavigate('notifications')} />

                  <a href="/audit" className="mg-tile">
                    <span className="mg-ic"><i className="ti ti-shield-check" /></span>
                    <span><b>Audit Log</b><small>Who opened which record, and when: the record an accounting of disclosures is produced from</small></span>
                  </a>
                )}
                <MG.Tile icon="ti-layout-grid" title="Portal Hub" sub="Every area you can open" onClick={() => { window.location.href = '/login?hub=1'; }} />
              </div>

    };

    // Inbox Page - Bug Reports and Feature Requests
    // ── Announcements: posted in My GFC (2026-11-10) ──
    // The caregiver Feed's posts are now announcements for the whole team,
    // posted from ONE composer in My GFC → Announcements. This tab points there
    // rather than keeping a second composer that would drift from it.
    const CaregiverFeedPanel = () => (
      <div className="bg-white rounded-xl border border-gray-200 p-5">
        <h3 className="font-semibold text-gray-800 mb-1">Announcements</h3>
        <p className="text-sm text-gray-500 mb-3">
          Announcements for every caregiver, and for the rest of the team, are posted in My GFC → Announcements.
          Caregivers see them on their Feed tab; everyone else sees them on My GFC Home.
        </p>
        <a href="/my#announcements" className="inline-block px-4 py-2 rounded-lg bg-primary text-white text-sm font-medium">Open Announcements</a>
      </div>
    );

    const InboxPage = ({ token, user, initialTab }) => {
      const [feedback, setFeedback] = useState([]);
      const [passwordResets, setPasswordResets] = useState([]);
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState(initialTab || 'messages');
      // Managers and case managers come here for Messages. Feedback and
      // password resets are the super admin's work, and both routes refuse
      // them at the API anyway — a tab that always errors is worse than no tab.
      const canSeeAdminInbox = user?.role === 'admin';
      const [selectedItem, setSelectedItem] = useState(null);

      useEffect(() => {
        loadData();
      }, [token]);

      const loadData = async () => {
        setLoading(true);
        const [feedbackData, resetData] = await Promise.all([
          canSeeAdminInbox ? api.getFeedback(token) : Promise.resolve([]),
          canSeeAdminInbox ? api.getPasswordResetRequests(token) : Promise.resolve([])
        ]);
        if (!feedbackData.error) setFeedback(feedbackData);
        if (!resetData.error) setPasswordResets(resetData);
        setLoading(false);
      };

      const updateFeedbackStatus = async (id, status) => {
        await api.updateFeedback(token, id, { status });
        loadData();
        setSelectedItem(null);
      };

      const handlePasswordReset = async (id) => {
        await api.handlePasswordReset(token, id);
        loadData();
      };

      const dismissPasswordReset = async (id) => {
        await api.dismissPasswordReset(token, id);
        loadData();
      };

      const openFeedback = feedback.filter(f => f.status === 'open');
      const resolvedFeedback = feedback.filter(f => f.status === 'resolved');

      // The spinner covers the FEEDBACK fetch, not the Messages panel, which
      // loads its own data. Blocking the whole page on an unrelated request is
      // how a working inbox ends up looking broken.
      if (loading && activeTab !== 'messages' && activeTab !== 'broadcast') return (
        <div className="flex items-center justify-center py-20">
          <div className="flex flex-col items-center gap-4">
            <div className="animate-spin rounded-full h-10 w-10 border-[3px] border-primary-500 border-t-transparent"></div>
            <p className="text-gray-500 text-sm">Loading inbox...</p>
          </div>
        </div>
      );

      return (
        <div className="space-y-6">
          {/* Header */}
          <div className="flex justify-between items-center">
            <div>
              <h1 className="text-2xl font-bold text-accent">Inbox</h1>
              <p className="text-gray-500 text-sm mt-1">
                {canSeeAdminInbox
                  ? 'Messages, bug reports, feature requests, and password resets'
                  : 'Messages and the caregiver feed'}
              </p>
            </div>
          </div>

          {/* Tabs */}
          <div className="flex gap-2 border-b border-gray-200">
            <button onClick={() => setActiveTab('messages')}
              className={`px-4 py-3 text-sm font-medium border-b-2 transition ${activeTab === 'messages' ? 'border-primary-500 text-primary-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>
              Messages
            </button>
            <button onClick={() => setActiveTab('broadcast')}
              className={`px-4 py-3 text-sm font-medium border-b-2 transition ${activeTab === 'broadcast' ? 'border-primary-500 text-primary-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>
              Caregiver Feed
            </button>
            {canSeeAdminInbox && (
              <button onClick={() => setActiveTab('feedback')}
                className={`px-4 py-3 text-sm font-medium border-b-2 transition ${activeTab === 'feedback' ? 'border-primary-500 text-primary-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>
                Feedback & Requests
                {openFeedback.length > 0 && <span className="ml-2 px-2 py-0.5 bg-red-100 text-red-600 rounded-full text-xs">{openFeedback.length}</span>}
              </button>
            )}
            {canSeeAdminInbox && (
              <button onClick={() => setActiveTab('password')}
                className={`px-4 py-3 text-sm font-medium border-b-2 transition ${activeTab === 'password' ? 'border-primary-500 text-primary-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>
                Password Resets
                {passwordResets.length > 0 && <span className="ml-2 px-2 py-0.5 bg-orange-100 text-orange-600 rounded-full text-xs">{passwordResets.length}</span>}
              </button>
            )}
          </div>

          {activeTab === 'messages' && <MessagesPanel token={token} user={user} />}

          {activeTab === 'broadcast' && <CaregiverFeedPanel token={token} />}

          {canSeeAdminInbox && activeTab === 'feedback' && (
            <div className="space-y-4">
              {/* Open Feedback */}
              <div className="bg-white rounded-xl shadow-soft border border-gray-100 overflow-hidden">
                <div className="px-5 py-4 border-b border-gray-100 bg-gray-50/50">
                  <h3 className="font-semibold text-gray-800">Open Items ({openFeedback.length})</h3>
                </div>
                {openFeedback.length === 0 ? (
                  <div className="p-8 text-center text-gray-500">
                    <div className="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-3">
                      {Icons.check}
                    </div>
                    <p>No open feedback items</p>
                  </div>
                ) : (
                  <div className="divide-y divide-gray-100">
                    {openFeedback.map(item => (
                      <div key={item.id} className="p-4 hover:bg-gray-50 cursor-pointer transition" onClick={() => setSelectedItem(item)}>
                        <div className="flex items-start gap-4">
                          <div className={`w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0 ${item.type === 'bug' ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}`}>
                            {item.type === 'bug' ? Icons.bug : Icons.chat}
                          </div>
                          <div className="flex-1 min-w-0">
                            <div className="flex items-center gap-2 mb-1">
                              <span className={`px-2 py-0.5 rounded text-xs font-medium ${item.type === 'bug' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}`}>
                                {item.type === 'bug' ? 'Bug Report' : 'Feature Request'}
                              </span>
                              <span className="text-xs text-gray-400">{new Date(item.createdAt).toLocaleDateString()}</span>
                            </div>
                            <h4 className="font-medium text-gray-800 truncate">{item.subject}</h4>
                            <p className="text-sm text-gray-500 truncate">{item.description}</p>
                            <p className="text-xs text-gray-400 mt-1">From: {item.userName} ({item.userEmail})</p>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* Resolved Feedback */}
              {resolvedFeedback.length > 0 && (
                <div className="bg-white rounded-xl shadow-soft border border-gray-100 overflow-hidden">
                  <div className="px-5 py-4 border-b border-gray-100 bg-gray-50/50">
                    <h3 className="font-semibold text-gray-800">Resolved ({resolvedFeedback.length})</h3>
                  </div>
                  <div className="divide-y divide-gray-100">
                    {resolvedFeedback.slice(0, 5).map(item => (
                      <div key={item.id} className="p-4 opacity-60">
                        <div className="flex items-start gap-4">
                          <div className="w-10 h-10 rounded-lg bg-green-100 text-green-600 flex items-center justify-center flex-shrink-0">
                            {Icons.check}
                          </div>
                          <div className="flex-1 min-w-0">
                            <h4 className="font-medium text-gray-800 truncate">{item.subject}</h4>
                            <p className="text-sm text-gray-500">{item.type === 'bug' ? 'Bug Report' : 'Feature Request'} - Resolved</p>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}

          {canSeeAdminInbox && activeTab === 'password' && (
            <div className="bg-white rounded-xl shadow-soft border border-gray-100 overflow-hidden">
              <div className="px-5 py-4 border-b border-gray-100 bg-gray-50/50">
                <h3 className="font-semibold text-gray-800">Pending Password Reset Requests</h3>
              </div>
              {passwordResets.length === 0 ? (
                <div className="p-8 text-center text-gray-500">
                  <div className="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-3">
                    {Icons.key}
                  </div>
                  <p>No pending password reset requests</p>
                </div>
              ) : (
                <div className="divide-y divide-gray-100">
                  {passwordResets.map(request => (
                    <div key={request.id} className="p-4 flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-lg bg-orange-100 text-orange-600 flex items-center justify-center">
                          {Icons.key}
                        </div>
                        <div>
                          <p className="font-medium text-gray-800">{request.email}</p>
                          <p className="text-sm text-gray-500">Requested: {new Date(request.requestedAt).toLocaleString()}</p>
                        </div>
                      </div>
                      <div className="flex gap-2">
                        <button onClick={() => handlePasswordReset(request.id)}
                          className="px-3 py-1.5 bg-gradient-to-r from-primary to-accent text-white text-sm rounded-lg hover:opacity-90 transition">
                          Reset Password
                        </button>
                        <button onClick={() => dismissPasswordReset(request.id)}
                          className="px-3 py-1.5 text-gray-500 hover:text-red-600 hover:bg-red-50 text-sm rounded-lg transition">
                          Dismiss
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Detail Modal */}
          {selectedItem && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg animate-fade-in">
                <div className="p-6 border-b border-gray-100">
                  <div className="flex justify-between items-start">
                    <div className="flex items-center gap-3">
                      <div className={`w-10 h-10 rounded-lg flex items-center justify-center ${selectedItem.type === 'bug' ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}`}>
                        {selectedItem.type === 'bug' ? Icons.bug : Icons.chat}
                      </div>
                      <div>
                        <span className={`px-2 py-0.5 rounded text-xs font-medium ${selectedItem.type === 'bug' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}`}>
                          {selectedItem.type === 'bug' ? 'Bug Report' : 'Feature Request'}
                        </span>
                        <h2 className="text-lg font-bold text-accent mt-1">{selectedItem.subject}</h2>
                      </div>
                    </div>
                    <button onClick={() => setSelectedItem(null)} className="text-gray-400 hover:text-gray-600">
                      {Icons.close}
                    </button>
                  </div>
                </div>
                <div className="p-6 space-y-4">
                  <div>
                    <p className="text-sm font-medium text-gray-500 mb-1">From</p>
                    <p className="text-gray-800">{selectedItem.userName} ({selectedItem.userEmail})</p>
                  </div>
                  <div>
                    <p className="text-sm font-medium text-gray-500 mb-1">Submitted</p>
                    <p className="text-gray-800">{new Date(selectedItem.createdAt).toLocaleString()}</p>
                  </div>
                  <div>
                    <p className="text-sm font-medium text-gray-500 mb-1">Description</p>
                    <p className="text-gray-800 whitespace-pre-wrap bg-gray-50 p-4 rounded-lg">{selectedItem.description}</p>
                  </div>
                </div>
                <div className="p-6 border-t border-gray-100 flex gap-3">
                  <button onClick={() => setSelectedItem(null)}
                    className="flex-1 py-2.5 px-4 rounded-xl border border-gray-200 text-gray-600 font-medium hover:bg-gray-50 transition">
                    Close
                  </button>
                  <button onClick={() => updateFeedbackStatus(selectedItem.id, 'resolved')}
                    className="flex-1 py-2.5 px-4 rounded-xl bg-gradient-to-r from-primary to-accent text-white font-medium hover:opacity-90 transition">
                    Mark Resolved
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // Full User Management Page with all features
    // ======================================================================
    // CAREGIVER DOCUMENTS on the user form (2026-09-13, owner request)
    // ======================================================================
    // Photo ID, paystub and W-9 for payroll onboarding, plus anything the
    // caregiver has sent in themselves. It sits on the user record because
    // that is where the person is managed — a timesheet is payroll, but a
    // W-9 is part of who this employee is.
    //
    // GUSTO IS THE SYSTEM OF RECORD for the payroll paperwork. The caregiver
    // submits it there; what the app holds is the office's copy. The card
    // says so, because a screen that stays quiet about it lets someone
    // believe uploading here filed their W-9.
    //
    // AT MODULE SCOPE, deliberately — it was first written inside UsersPage,
    // where a component is a new function identity on every render, so React
    // unmounts and remounts it and the file picker resets mid-use.
    // test/react_input_focus.test.js did not catch that: it only read 40 lines
    // past a declaration and this component is far longer. The guard now scans
    // the whole component body, which is the hole this change found.
    // The headshot and website bio each staff member keeps in My GFC → My
    // Profile. Shown read-only on their User Management form for the admin
    // team (owner, 2026-11-09), in place of a separate Team Bios page.
    // The Modules grid (owner, 2026-11-13). One row per module: what this
    // person's account type includes comes ticked and can be unticked; what it
    // does not include comes unticked and can be granted. Locked rows say why.
    // The server decides every row (GET/PUT /api/users/:id/modules); this page
    // restates no rule of its own.
    const MODULE_STATE_LABEL = { role: 'Comes with their role', removed: 'Taken away', granted: 'Added', off: '' };
    const ModulesSection = ({ token, userId, userName }) => {
      const [grid, setGrid] = React.useState(null);
      const [editable, setEditable] = React.useState(false);
      const [checked, setChecked] = React.useState({});
      const [err, setErr] = React.useState('');
      const [msg, setMsg] = React.useState('');
      const [busy, setBusy] = React.useState(false);
      const take = (d) => { setGrid(d.grid); setChecked(Object.fromEntries(d.grid.map(r => [r.id, r.has]))); };
      React.useEffect(() => {
        let live = true;
        setGrid(null); setErr(''); setMsg('');
        fetch(`/api/users/${encodeURIComponent(userId)}/modules`, { headers: { Authorization: `Bearer ${token}` } })
          .then(r => r.json().then(d => { if (!r.ok) throw new Error(d.error || 'Could not load the modules.'); return d; }))
          .then(d => { if (live) { take(d); setEditable(!!d.editable); } })
          .catch(e => { if (live) setErr(e.message); });
        return () => { live = false; };
      }, [token, userId]);
      const dirty = !!grid && grid.some(r => !!checked[r.id] !== r.has);
      const save = () => {
        setBusy(true); setErr(''); setMsg('');
        fetch(`/api/users/${encodeURIComponent(userId)}/modules`, {
          method: 'PUT', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ modules: grid.filter(r => checked[r.id]).map(r => r.id) })
        }).then(r => r.json().then(d => { if (!r.ok) throw new Error(d.error || 'Could not save the modules.'); return d; }))
          .then(d => { take(d); setMsg('Saved. It applies on their next click.'); })
          .catch(e => setErr(e.message)).finally(() => setBusy(false));
      };
      const areas = grid ? [...new Set(grid.map(r => r.area))] : [];
      return (
        <div className="border-t pt-4">
          <h3 className="font-medium text-gray-800 mb-1">Modules</h3>
          <p className="text-sm text-gray-500 mb-3">What {userName || 'this person'} can open. Ticked modules come with their role; untick one to take it away. Tick any other module to give them access.</p>
          {err && <p className="text-sm text-red-600 mb-2">{err}</p>}
          {!err && !grid && <p className="text-sm text-gray-500">Loading…</p>}
          {grid && areas.map(area => (
            <div key={area} className="mb-3">
              <div className="text-xs font-semibold uppercase tracking-wide text-gray-500 mb-1">{area}</div>
              {grid.filter(r => r.area === area).map(r => {
                const on = !!checked[r.id];
                const state = r.byRole ? (on ? 'role' : 'removed') : (on ? 'granted' : 'off');
                return (
                  <label key={r.id} className={`flex items-start gap-3 py-1.5 px-2 rounded ${r.locked || !editable ? 'opacity-70' : 'hover:bg-gray-50 cursor-pointer'}`}>
                    <input type="checkbox" className="mt-1" checked={on} disabled={!!r.locked || !editable || busy}
                      onChange={e => setChecked({ ...checked, [r.id]: e.target.checked })} />
                    <span className="flex-1">
                      <span className="font-medium text-gray-800">{r.name}</span>
                      {MODULE_STATE_LABEL[state] && <span className={`ml-2 text-xs px-1.5 py-0.5 rounded ${state === 'role' ? 'bg-gray-100 text-gray-600' : state === 'granted' ? 'bg-green-50 text-green-700' : 'bg-amber-50 text-amber-800'}`}>{MODULE_STATE_LABEL[state]}</span>}
                      <span className="block text-xs text-gray-500">{r.locked || r.description}</span>
                      {r.note && on && <span className="block text-xs text-amber-800">{r.note}</span>}
                    </span>
                  </label>
                );
              })}
            </div>
          ))}
          {grid && editable && (
            <div className="flex items-center gap-3">
              <button type="button" className="px-3 py-1.5 rounded bg-primary text-white text-sm disabled:opacity-50" disabled={!dirty || busy} onClick={save}>{busy ? 'Saving…' : 'Save Modules'}</button>
              {msg && <span className="text-sm text-green-700">{msg}</span>}
            </div>
          )}
        </div>
      );
    };

    const StaffBioSection = ({ token, userId, userName }) => {
      const [bio, setBio] = React.useState(null);
      const [photo, setPhoto] = React.useState('');
      const [err, setErr] = React.useState('');
      React.useEffect(() => {
        let url = ''; let live = true;
        setBio(null); setPhoto(''); setErr('');
        fetch(`/api/my/admin/bios/${userId}`, { headers: { Authorization: `Bearer ${token}` } })
          .then(r => r.json().then(d => { if (!r.ok) throw new Error(d.error || 'Could not load the bio.'); return d; }))
          .then(d => {
            if (!live) return;
            setBio(d);
            if (d.hasHeadshot) {
              fetch(`/api/my/admin/bios/${userId}/headshot`, { headers: { Authorization: `Bearer ${token}` } })
                .then(r => (r.ok ? r.blob() : null)).then(b => { if (b && live) { url = URL.createObjectURL(b); setPhoto(url); } });
            }
          })
          .catch(e => { if (live) setErr(e.message); });
        return () => { live = false; if (url) URL.revokeObjectURL(url); };
      }, [token, userId]);
      return (
        <div className="border-t pt-4">
          <h3 className="font-medium text-gray-800 mb-1">Headshot and Bio</h3>
          <p className="text-sm text-gray-500 mb-3">Kept up to date by {userName || 'the staff member'} in My GFC → My Profile.</p>
          {err && <p className="text-sm text-red-600">{err}</p>}
          {!err && !bio && <p className="text-sm text-gray-500">Loading…</p>}
          {bio && (
            <div className="flex gap-4 items-start">
              {photo
                ? <img src={photo} alt={userName || ''} className="w-24 h-24 rounded-full object-cover border" />
                : <div className="w-24 h-24 rounded-full bg-gray-100 border flex items-center justify-center text-xs text-gray-400 text-center">No photo yet</div>}
              <div className="flex-1">
                {bio.title && <p className="font-medium text-gray-800">{bio.title}</p>}
                <p className="text-sm whitespace-pre-wrap text-gray-700">{bio.bio || <span className="text-gray-400">No bio yet.</span>}</p>
