                <div className="goal"><i className={`ti ${form.primaryContact?.name ? 'ti-circle-check' : 'ti-circle'}`} style={{ color: form.primaryContact?.name ? 'var(--teal)' : 'var(--mut)' }} />Primary contact {form.primaryContact?.name || '— missing'}</div>
                <div className="goal"><i className="ti ti-circle-check" style={{ color: 'var(--teal)' }} />{(form.medications || []).filter(m => m.name).length} medication(s) listed</div>
                <div className="goal"><i className={`ti ${requiredSigned ? 'ti-circle-check' : 'ti-alert-circle'}`} style={{ color: requiredSigned ? 'var(--teal)' : 'var(--gfc-danger,#B5462E)' }} />Required consents {requiredSigned ? 'all signed' : `(${requiredConsents.filter(t => consents[t] === 'signed').length}/${requiredConsents.length})`}</div>
              </div>
              {!consentsLoaded && <div className="err">We couldn't load your consent forms. Please refresh the page and try again.</div>}
              {consentsLoaded && !requiredSigned && <div className="err">Please sign all required consents before submitting (go back to Consents).</div>}
              <button className="btn" disabled={busy || !requiredSigned} onClick={submit}>{busy ? 'Submitting…' : 'Complete enrollment'}</button>
            </React.Fragment>
          )}

          {err && <div className="err">{err}</div>}

          {k !== 'review' && (
            <div className="intake-foot">
              <button className="btn ghost" onClick={back} disabled={busy} style={{ flex: '0 0 auto', width: 110 }}>{step === 0 ? 'Cancel' : 'Back'}</button>
              <button className="btn" onClick={next} disabled={busy}>{busy ? 'Saving…' : 'Continue'}</button>
            </div>
          )}
          {k === 'review' && (
            <button className="btn ghost" onClick={back} disabled={busy}>Back</button>
          )}
        </div>
      );
    };

    // Friendly date like "Jul 21" (prototype uses month-abbrev, no year for recency).
    function prettyDate(iso) {
      if (!iso) return '';
      const d = new Date(iso); if (isNaN(d)) return '';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    // Derive whole-years age from a YYYY-MM-DD DOB for the review screen.
    function ageFromDob(dob) {
      if (!dob) return '';
      const d = new Date(dob); if (isNaN(d)) return '';
      const n = new Date(); let a = n.getFullYear() - d.getFullYear();
      const m = n.getMonth() - d.getMonth();
      if (m < 0 || (m === 0 && n.getDate() < d.getDate())) a--;
      return a;
    }

    // Enrollment status-pill progression (prototype screen 4).
    const EnrollmentPills = ({ status }) => {
      const order = ['intake_pending', 'intake_complete', 'enrolled'];
      const labels = { intake_pending: 'Intake pending', intake_complete: 'Intake complete', enrolled: 'Enrolled' };
      const cur = order.indexOf(status === 'intake_pending' ? 'intake_pending' : (status === 'enrolled' ? 'enrolled' : 'intake_complete'));
      return (
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', margin: '2px 0 16px' }}>
          {order.map((s, i) => {
            const active = i === cur;
            const done = i <= cur;
            return <span key={s} style={{ fontSize: 11.5, fontWeight: 600, padding: '5px 12px', borderRadius: 20,
              background: active ? 'var(--navy)' : (done ? 'var(--gold)' : 'rgba(3,61,80,.06)'),
              color: active ? 'var(--cream)' : (done ? 'var(--navy)' : 'var(--mut)') }}>{labels[s]}</span>;
          })}
        </div>
      );
    };

    const GfcDashboard = ({ data, onNavigate, me }) => {
      const cp = data.carePlan;                       // null until an RN authors the real plan (Session 4)
      const pc = (cp && cp.primaryCaregiver) || {};
      const upcoming = data.upcomingVisits || [];
      const unread = (data.messages?.messages || []).filter(m => m.unread).length;
      const roiFamilySigned = me && me.roiFamilySigned;
      const tierLabel = (cp && cp.careTierLabel) || data.careTierLabel;
      return (
        <div className="gfc-body">
          <h2 className="disp">Good morning, {data.greetingName}</h2>
          <p className="sub">{pc.name ? `${pc.name.split(' ')[0]} arrives at ${(upcoming[0]||{}).time || 'your next visit'}.` : 'Welcome to your care portal.'}</p>
          {me && <EnrollmentPills status={me.enrollmentStatus} />}
          <div className="planhero">
            <div className="pe">Your care plan</div>
            {cp ? (
              <React.Fragment>
                <div className="prow">
                  <Avatar initials={pc.initials || 'GF'} />
                  <div><div className="nm">{pc.name || 'Your care team'}{pc.credential ? `, ${pc.credential}` : ''}</div><div className="rl">{pc.role || 'Primary caregiver'}</div></div>
                </div>
                {tierLabel && <span className="pill"><i className="ti ti-heart-handshake" style={{ fontSize: 13 }} />{tierLabel}</span>}
                <div className="plink" onClick={() => onNavigate('care')}>View full care plan <i className="ti ti-arrow-right" /></div>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <div className="prow">
                  <Avatar initials="GF" />
                  <div><div className="nm">Your care plan is being prepared</div><div className="rl">Your nurse will review it with you</div></div>
                </div>
                {tierLabel && <span className="pill"><i className="ti ti-heart-handshake" style={{ fontSize: 13 }} />{tierLabel}</span>}
              </React.Fragment>
            )}
          </div>
          <p className="lbl">Upcoming visits</p>
          {upcoming.length === 0 && <p className="sub" style={{ marginTop: 0 }}>No visits scheduled yet — your care coordinator will reach out to set up your schedule.</p>}
          {upcoming.slice(0, 2).map(v => (
            <div className={`visit ${v.highlight ? 'hl' : ''}`} key={v.id}>
              <span className="vt">{v.day}<br />{v.time}</span>
              <div className="vm"><b>{v.type}</b><span>{v.with}</span></div>
            </div>
          ))}
          <div className="tiles" style={{ marginTop: 14 }}>
            <button className="tile" onClick={() => onNavigate('messages')}>{unread > 0 && <span className="badge">{unread}</span>}<i className="ti ti-message" /><span className="tl">Messages</span><span className="ts">Care team</span></button>
            <button className="tile" onClick={() => onNavigate('documents')}><i className="ti ti-file-text" /><span className="tl">Documents</span><span className="ts">Consents signed</span></button>
          </div>
          {roiFamilySigned && (
            <div className="card" style={{ marginTop: 14, background: 'var(--cream)', border: '1px solid var(--line2)', boxShadow: 'none' }}>
              <div style={{ fontSize: 13, color: 'var(--ink)', lineHeight: 1.55 }}>
                <b style={{ color: 'var(--navy)' }}>Family portal unlocked.</b> Your Release of Information — Family consent is signed, so the family members you designated can now follow along.
              </div>
            </div>
          )}
        </div>
      );
    };

    const GfcCarePlan = ({ data, readOnly, token }) => {
      const cp = data.carePlan || {};
      const hasPlan = !!data.carePlan;               // null until the RN-authored plan exists (Session 4)
      const upcoming = data.upcomingVisits || [];
      const recent = data.recentVisits || [];
      const teamColors = ['var(--gold)', '#9FE1CB', '#CECBF6'];
      const teamTextColors = ['var(--navy)', '#0f6e56', '#3c3489'];
      const [coSigned, setCoSigned] = useState(!!cp.coSignedAt);
      const [coSignBusy, setCoSignBusy] = useState(false);
      const [coSignErr, setCoSignErr] = useState('');
      // Canvas signature pad — same drawn-signature mechanism as the provider ROI.
      const sigCanvasRef = useRef(null);
      const sigState = useRef({ drawing: false, empty: true });
      const padVisible = !readOnly && !coSigned && cp.version != null;
      useEffect(() => {
        if (!padVisible) return;
        const canvas = sigCanvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const ratio = window.devicePixelRatio || 1;
        const w = canvas.offsetWidth || 400;
        canvas.width = w * ratio; canvas.height = 130 * ratio;
        ctx.scale(ratio, ratio);
        ctx.strokeStyle = '#033D50'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        sigState.current = { drawing: false, empty: true };
        const pos = (e) => { const r = canvas.getBoundingClientRect(); const s = e.touches ? e.touches[0] : e; return { x: s.clientX - r.left, y: s.clientY - r.top }; };
        const down = (e) => { sigState.current.drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
        const move = (e) => { if (!sigState.current.drawing) return; e.preventDefault && e.preventDefault(); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); sigState.current.empty = false; };
        const up = () => { sigState.current.drawing = false; };
        canvas.addEventListener('mousedown', down); canvas.addEventListener('mousemove', move);
        canvas.addEventListener('mouseup', up); canvas.addEventListener('mouseleave', up);
        canvas.addEventListener('touchstart', down, { passive: false });
        canvas.addEventListener('touchmove', move, { passive: false });
        canvas.addEventListener('touchend', up);
        return () => {
          canvas.removeEventListener('mousedown', down); canvas.removeEventListener('mousemove', move);
          canvas.removeEventListener('mouseup', up); canvas.removeEventListener('mouseleave', up);
          canvas.removeEventListener('touchstart', down); canvas.removeEventListener('touchmove', move);
          canvas.removeEventListener('touchend', up);
        };
      }, [padVisible, cp.version]);
      const clearSig = () => {
        const canvas = sigCanvasRef.current; if (!canvas) return;
        canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
        sigState.current.empty = true;
      };
      const handleCoSign = async () => {
        setCoSignErr('');
        if (sigState.current.empty) { setCoSignErr('Please draw your signature before co-signing.'); return; }
        const signatureImageB64 = sigCanvasRef.current.toDataURL('image/png');
        setCoSignBusy(true);
        const res = await api.coSignGfcCarePlan(token, cp.version, signatureImageB64);
        setCoSignBusy(false);
        if (res.error) { setCoSignErr(res.error); return; }
        setCoSigned(true);
      };
      return (
        <div className="gfc-body">
          {readOnly && <span className="ro"><i className="ti ti-eye" />Family view · read-only</span>}
          {!hasPlan && (
            <div className="card" style={{ marginTop: 0 }}>
              <div className="prow">
                <Avatar initials="GF" size={34} />
                <div>
                  <div style={{ fontSize: 14.5, fontWeight: 600, color: 'var(--navy)' }}>Your care plan is being prepared</div>
                  <div style={{ fontSize: 12.5, color: 'var(--mut)', marginTop: 2 }}>Your nurse will write your personalized plan and review it with you{readOnly ? '' : ' — you’ll co-sign it right here'}.</div>
                </div>
              </div>
            </div>
          )}
          {hasPlan && (cp.version != null) && (
            <p className="sub" style={{ marginTop: 0, marginBottom: 12 }}>
              Version {cp.version}{cp.effectiveDate ? ` · effective ${prettyDate(cp.effectiveDate)}` : ''}{cp.authoredBy ? ` · written by ${cp.authoredBy}` : ''}, reviewed with you and your family.
            </p>
          )}
          {hasPlan && (
          <React.Fragment>
          <p className="lbl" style={{ marginTop: 0 }}>Goals</p>
          {(cp.goals || []).map((g, i) => (
            <div className="goal" key={i}><i className="ti ti-circle-check" />{g}</div>
          ))}
          {(cp.eachVisit || []).length > 0 && (
            <React.Fragment>
              <p className="lbl">Each visit</p>
              {cp.eachVisit.map((t, i) => (
                <div className="goal" key={i}><i className="ti ti-square-check" style={{ color: 'var(--navy)' }} />{t}</div>
              ))}
            </React.Fragment>
          )}
          {cp.visitSchedule && (
            <React.Fragment>
              <p className="lbl">Visit schedule</p>
              <div className="card" style={{ margin: 0 }}>
                <div style={{ fontSize: 14.5, fontWeight: 600, color: 'var(--navy)' }}>{cp.visitSchedule.days} · {cp.visitSchedule.hours}</div>
                {cp.visitSchedule.caregiver && <div style={{ fontSize: 12.5, color: 'var(--mut)', marginTop: 2 }}>{cp.visitSchedule.caregiver}</div>}
              </div>
            </React.Fragment>
          )}
          {(cp.authorizedServices || []).length > 0 && (
            <React.Fragment>
              <p className="lbl">Authorized services</p>
              <div className="seg">{(cp.authorizedServices || []).map((s, i) => <span className="on" key={i}>{s}</span>)}</div>
            </React.Fragment>
          )}
          {(cp.careTeam || []).length > 0 && (
            <React.Fragment>
              <p className="lbl">Care team</p>
              <div className="card" style={{ margin: 0 }}>
                {(cp.careTeam || []).map((m, i) => (
                  <div className="prow" style={{ marginBottom: i < (cp.careTeam.length - 1) ? 10 : 0 }} key={i}>
                    <Avatar initials={m.initials} size={34} bg={teamColors[i % 3]} color={teamTextColors[i % 3]} />
                    <div><div style={{ fontSize: 14, fontWeight: 600, color: 'var(--navy)' }}>{m.name}</div><div style={{ fontSize: 12, color: 'var(--mut)' }}>{m.role}</div></div>
                  </div>
                ))}
              </div>
            </React.Fragment>
          )}
          </React.Fragment>
          )}
          <p className="lbl">Upcoming visits</p>
          {upcoming.length === 0 && <p className="sub" style={{ marginTop: 0 }}>No visits scheduled yet.</p>}
          {upcoming.map(v => (
            <div className={`visit ${v.highlight ? 'hl' : ''}`} key={v.id}>
              <span className="vt">{v.day}<br />{v.time}</span>
              <div className="vm"><b>{v.type}</b><span>{v.with}{v.duration ? ` · ${v.duration}` : ''}</span></div>
            </div>
          ))}
          <p className="lbl">Recent visits</p>
          {recent.length === 0 && <p className="sub" style={{ marginTop: 0 }}>No completed visits yet.</p>}
          {recent.map(v => (
            <div className="visit" key={v.id}>
              <span className="vt">{v.day}<br />{v.time}</span>
              <div className="vm"><b>{v.type}</b><span>{v.with}</span></div>
              {v.completed && <i className="ti ti-circle-check chk" />}
            </div>
          ))}
          {!readOnly && hasPlan && (
            <React.Fragment>
              <p className="lbl">Your co-signature</p>
              <div className="card" style={{ margin: 0 }}>
                {coSigned ? (
                  <React.Fragment>
                    <div style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 22, fontWeight: 600, color: 'var(--navy)', borderBottom: '1px solid var(--line2)', paddingBottom: 8, marginBottom: 8 }}>{data.greetingName}</div>
                    <div className="goal" style={{ margin: 0 }}><i className="ti ti-circle-check" style={{ color: 'var(--teal)' }} />You co-signed care plan v{cp.version} · versions are retained.</div>
                  </React.Fragment>
                ) : (
                  <React.Fragment>
                    <div className="goal" style={{ margin: '0 0 10px', alignItems: 'flex-start' }}><i className="ti ti-square-check" style={{ color: 'var(--navy)' }} />I reviewed this plan and agree to it · sign below. Co-signature required, every version kept.</div>
                    <div style={{ position: 'relative', border: '1px solid var(--line2)', borderRadius: 10, background: '#fff' }}>
                      <canvas ref={sigCanvasRef} style={{ display: 'block', width: '100%', height: 130, touchAction: 'none' }} />
                      <button type="button" onClick={clearSig} style={{ position: 'absolute', top: 6, right: 8, background: 'none', border: 'none', color: 'var(--mut)', fontSize: 12, cursor: 'pointer' }}>Clear</button>
                    </div>
                    <div style={{ fontSize: 11.5, color: 'var(--mut)', margin: '6px 0 10px' }}>Draw your signature above — {data.greetingName}</div>
                    <button className="btn" disabled={coSignBusy || cp.version == null} onClick={handleCoSign}>{coSignBusy ? 'Signing…' : `Co-sign care plan v${cp.version}`}</button>
                    {coSignErr && <div className="err">{coSignErr}</div>}
                  </React.Fragment>
                )}
              </div>
              {/* Visit requests arrive with the scheduling session (Session 7) —
                  labeled and disabled, no fake interactivity. */}
              <button className="btn ghost" disabled style={{ opacity: .55, cursor: 'default' }}><i className="ti ti-calendar-plus" style={{ verticalAlign: -2 }} /> Visit requests — coming with scheduling</button>
            </React.Fragment>
          )}
          {hasPlan && (
            <p className="micro"><i className="ti ti-history" />{[cp.careTierLabel, cp.version != null ? `Version ${cp.version}` : null, cp.updatedAt ? `updated ${prettyDate(cp.updatedAt)}${cp.updatedBy ? ` by ${cp.updatedBy}` : ''}` : null].filter(Boolean).join(' · ')}</p>
          )}
        </div>
      );
    };

    const GfcMessages = ({ messages, readOnly, token, onSent }) => {
      const rows = messages?.messages || [];
      const [draft, setDraft] = useState('');
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState('');
      const send = async () => {
        const body = draft.trim();
        if (!body || busy) return;
        setErr(''); setBusy(true);
        const res = await api.sendGfcMessage(token, body);
        setBusy(false);
        if (res.error) { setErr(res.error); return; }
        setDraft('');
        onSent && onSent();
      };
      const roleColor = (m) => m.direction === 'out' ? 'var(--gold)' : 'var(--navy)';
      const roleText = (m) => m.direction === 'out' ? 'var(--navy)' : 'var(--cream)';
      const when = (iso) => {
        if (!iso) return '';
        const d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        const today = d.toDateString() === new Date().toDateString();
        return today ? d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : prettyDate(iso);
      };
      return (
        <div className="gfc-body">
          {readOnly && <span className="ro"><i className="ti ti-eye" />Family view · read-only</span>}
          {rows.length === 0 && (
            <div className="card" style={{ marginTop: 0 }}>
              <div className="prow">
                <Avatar initials="GF" size={34} />
                <div>
                  <div style={{ fontSize: 14.5, fontWeight: 600, color: 'var(--navy)' }}>No messages yet</div>
                  <div style={{ fontSize: 12.5, color: 'var(--mut)', marginTop: 2 }}>{readOnly ? 'Messages with the care team will appear here.' : 'Send a message below and our team will get back to you.'}</div>
                </div>
              </div>
            </div>
          )}
          {rows.map(m => (
            <div className="thread" key={m.id}>
              <Avatar initials={m.initials} bg={roleColor(m)} color={roleText(m)} />
              <div className="tm"><div className="tn">{m.direction === 'out' ? 'You' : m.from}{m.fromRole && m.direction !== 'out' ? ` · ${m.fromRole}` : ''}</div><div className="tp">{m.body}</div></div>
              <div style={{ textAlign: 'right' }}><div className="tt">{when(m.sentAt)}</div>{m.unread && <div className="un" />}</div>
            </div>
          ))}
          {!readOnly && (
            <div className="card" style={{ marginTop: 14 }}>
              <textarea value={draft} onChange={e => setDraft(e.target.value)} placeholder="Write a message to your care team…" maxLength={4000} style={{ minHeight: 64 }} />
              <button className="btn" style={{ marginTop: 10 }} disabled={busy || !draft.trim()} onClick={send}>{busy ? 'Sending…' : 'Send to care team'}</button>
              {err && <div className="err">{err}</div>}
            </div>
          )}
          <div className="card" style={{ marginTop: 14, background: 'rgba(3,61,80,.04)', border: 'none', boxShadow: 'none', fontSize: 12, color: 'var(--mut)', textAlign: 'center' }}>
            Messages go to the Godwins Family Care team. Direct caregiver and clinical channels open in a later session.
          </div>
        </div>
      );
    };

    // ── Transfer-of-Care Provider ROI (Session 3.4) ──
    // Multi-screen flow mirroring docs/source-forms/template-gfc-roi-upload.php:
    // choose path → upload a signed scan OR complete the 8-section online form
    // (provider cards prefilled from priorProviders + canvas signature) → success.
    // Uses canvas signature capture (not typed name) because the PDF is
    // provider-facing. Does NOT gate the portal.
    const ROI_CATS = [
      { key: 'hp', label: 'History & physical / progress notes' },
      { key: 'lab', label: 'Lab and pathology results' },
      { key: 'diag', label: 'Problem & diagnosis list' },
      { key: 'imaging', label: 'Imaging / radiology reports' },
      { key: 'meds', label: 'Current medication list' },
      { key: 'discharge', label: 'Discharge summaries' },
      { key: 'allergies', label: 'Allergies' },
      { key: 'immune', label: 'Immunization records' }
    ];

    const RoiProviderCard = ({ p, idx, removable, onChange, onRemove }) => (
      <div className="card" style={{ background: 'var(--cream)', marginBottom: 12 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 4 }}>
          <span style={{ fontSize: 10.5, fontWeight: 700, letterSpacing: '.6px', textTransform: 'uppercase', color: 'var(--navy)' }}>{p.label || 'Provider / facility'}</span>
          {removable && <button onClick={onRemove} style={{ background: 'none', border: 'none', color: '#B5462E', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>Remove</button>}
        </div>
        <TextField label="Provider / facility name" value={p.name} onChange={v => onChange(idx, 'name', v)} placeholder="e.g. Northside Hospital" />
        <TextField label="Department" value={p.dept} onChange={v => onChange(idx, 'dept', v)} placeholder="e.g. Medical Records" />
        <TextField label="Address" value={p.address} onChange={v => onChange(idx, 'address', v)} placeholder="Street, City, State ZIP" />
        <TextField label="Phone" type="tel" value={p.phone} onChange={v => onChange(idx, 'phone', v)} />
        <TextField label="Fax" type="tel" value={p.fax} onChange={v => onChange(idx, 'fax', v)} />
      </div>
    );

    const GfcTransferRoi = ({ token, onClose, onDone }) => {
      const [screen, setScreen] = useState('choice'); // choice | upload | form | success
      const [loaded, setLoaded] = useState(false);
      const [patient, setPatient] = useState({});
      const [providers, setProviders] = useState([]);
      const [cats, setCats] = useState({});
      const [otherText, setOtherText] = useState('');
      const [includesProtected, setIncludesProtected] = useState(false); // 42 CFR Part 2 — defaults FALSE
      const [purposeOther, setPurposeOther] = useState(false);
      const [purposeOtherText, setPurposeOtherText] = useState('');
      const [expDate, setExpDate] = useState('');
      const [expEvent, setExpEvent] = useState('');
      const [printedName, setPrintedName] = useState('');
      const [relationship, setRelationship] = useState('');
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState('');
      const [file, setFile] = useState(null); // { name, dataB64, type }
      const canvasRef = useRef(null);
      const sigState = useRef({ drawing: false, empty: true });
      const today = new Date().toLocaleDateString();

      useEffect(() => {
        (async () => {
          const r = await api.getGfcTransferRoi(token);
          if (!r.error) {
            setPatient(r.patient || {});
            setPrintedName((r.patient && r.patient.patientName) || '');
            const pre = (r.priorProviders || []).map(pp => ({
              label: pp.roleLabel === 'pcp' ? 'Primary care physician' : pp.roleLabel === 'specialist' ? 'Specialist' : pp.roleLabel === 'hospital' ? 'Hospital / facility' : 'Provider / facility',
              name: pp.name || '', dept: pp.dept || '', address: pp.address || '', phone: pp.phone || '', fax: pp.fax || ''
            }));
            setProviders(pre.length ? pre : [{ label: 'Provider / facility', name: '', dept: '', address: '', phone: '', fax: '' }]);
          }
          setLoaded(true);
        })();
      }, [token]);

      // Canvas signature pad — initialized when the form screen mounts.
      useEffect(() => {
        if (screen !== 'form') return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const ratio = window.devicePixelRatio || 1;
        const w = canvas.offsetWidth || 400;
        canvas.width = w * ratio; canvas.height = 130 * ratio;
        ctx.scale(ratio, ratio);
        ctx.strokeStyle = '#033D50'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        sigState.current = { drawing: false, empty: true };
        const pos = (e) => { const r = canvas.getBoundingClientRect(); const s = e.touches ? e.touches[0] : e; return { x: s.clientX - r.left, y: s.clientY - r.top }; };
        const down = (e) => { sigState.current.drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
        const move = (e) => { if (!sigState.current.drawing) return; e.preventDefault && e.preventDefault(); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); sigState.current.empty = false; };
        const up = () => { sigState.current.drawing = false; };
        canvas.addEventListener('mousedown', down); canvas.addEventListener('mousemove', move);
        canvas.addEventListener('mouseup', up); canvas.addEventListener('mouseleave', up);
        canvas.addEventListener('touchstart', down, { passive: false });
        canvas.addEventListener('touchmove', move, { passive: false });
        canvas.addEventListener('touchend', up);
        return () => {
          canvas.removeEventListener('mousedown', down); canvas.removeEventListener('mousemove', move);
          canvas.removeEventListener('mouseup', up); canvas.removeEventListener('mouseleave', up);
          canvas.removeEventListener('touchstart', down); canvas.removeEventListener('touchmove', move);
          canvas.removeEventListener('touchend', up);
        };
      }, [screen]);

      const clearSig = () => {
        const canvas = canvasRef.current; if (!canvas) return;
        canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
        sigState.current.empty = true;
      };

      const setP = (i, k, v) => setProviders(ps => ps.map((p, idx) => idx === i ? { ...p, [k]: v } : p));
      const addProvider = () => setProviders(ps => [...ps, { label: 'Additional provider', name: '', dept: '', address: '', phone: '', fax: '' }]);
      const rmProvider = (i) => setProviders(ps => ps.filter((_, idx) => idx !== i));
      const toggleCat = (k) => setCats(c => ({ ...c, [k]: !c[k] }));

      const handleFile = (f) => {
        if (!f) return;
        const allowed = ['application/pdf', 'image/jpeg', 'image/jpg', 'image/png'];
        if (allowed.indexOf(f.type) === -1) { setErr('Only PDF, JPG, and PNG files are accepted.'); return; }
        if (f.size > 10 * 1024 * 1024) { setErr('File must be under 10 MB.'); return; }
        setErr('');
        const reader = new FileReader();
        reader.onload = () => setFile({ name: f.name, dataB64: String(reader.result), type: f.type });
        reader.readAsDataURL(f);
      };

      const submitUpload = async () => {
        if (!file) { setErr('Choose a file first.'); return; }
        setBusy(true); setErr('');
        const res = await api.uploadGfcTransferRoi(token, { fileName: file.name, fileDataB64: file.dataB64, mimeType: file.type });
        setBusy(false);
        if (res.error) { setErr(res.error); return; }
        onDone && onDone();
        setScreen('success');
      };

      const submitForm = async () => {
        setErr('');
        const named = providers.filter(p => (p.name || '').trim());
        if (named.length === 0) { setErr('Add at least one provider before submitting.'); return; }
        if (sigState.current.empty) { setErr('Please draw your signature before submitting.'); return; }
        if (!printedName.trim()) { setErr('Printed name is required.'); return; }
        const signatureImageB64 = canvasRef.current.toDataURL('image/png');
        const checkedAny = ROI_CATS.some(c => cats[c.key]) || cats.other;
        if (!checkedAny) { setErr('Select at least one type of record to request.'); return; }
        setBusy(true);
        const payload = {
          patientName: patient.patientName, patientDOB: patient.patientDOB, patientAddress: patient.patientAddress, patientPhone: patient.patientPhone,
          providers: named.map(p => ({ name: p.name, dept: p.dept, address: p.address, phone: p.phone, fax: p.fax })),
          categories: { ...cats, otherText },
          includesProtected: includesProtected === true,
          purposeTreatment: true, purposeOther, purposeOtherText,
          expDate, expEvent,
          signatureImageB64, printedName: printedName.trim(), relationship
        };
        const res = await api.submitGfcTransferRoi(token, payload);
        setBusy(false);
        if (res.error) {
          if (res.fieldErrors) setErr('Missing required fields: ' + Object.values(res.fieldErrors).join(' '));
          else setErr(res.error);
          return;
        }
        onDone && onDone();
        setScreen('success');
      };

      if (!loaded) return <div className="gfc-body" style={{ display: 'flex', justifyContent: 'center', paddingTop: 60 }}><div className="gfc-spin" /></div>;

      const backBtn = (to) => (
        <button className="back-min" onClick={() => { setErr(''); setScreen(to); }} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, background: 'none', border: 'none', color: 'var(--mut)', fontSize: 13, cursor: 'pointer', padding: 0, marginBottom: 8 }}>
          <i className="ti ti-chevron-left" /> Back
        </button>
      );

      if (screen === 'success') {
        return (
          <div className="gfc-body">
            <div style={{ textAlign: 'center', padding: '50px 0 30px' }}>
              <div style={{ width: 60, height: 60, background: 'var(--navy)', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 20px' }}>
                <i className="ti ti-check" style={{ color: 'var(--gold)', fontSize: 28 }} />
              </div>
              <h2 className="disp">Authorization received</h2>
              <p className="sub" style={{ maxWidth: 360, margin: '12px auto' }}>Your form was submitted to our care team. We'll use it to request your records from your provider and will be in touch with next steps. A confirmation email is on its way.</p>
              <button className="btn" style={{ maxWidth: 240, margin: '18px auto 0' }} onClick={onClose}>Back to Documents</button>
            </div>
          </div>
        );
      }

      if (screen === 'choice') {
        return (
          <div className="gfc-body">
            {backBtn && <button className="back-min" onClick={onClose} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, background: 'none', border: 'none', color: 'var(--mut)', fontSize: 13, cursor: 'pointer', padding: 0, marginBottom: 8 }}><i className="ti ti-chevron-left" /> Documents</button>}
            <h2 className="disp">Authorize record release</h2>
            <p className="sub">To request your records from a prior provider, we need a signed Authorization to Obtain Medical Records. Choose how you'd like to complete it.</p>
            <div className="card" style={{ cursor: 'pointer', marginTop: 16 }} onClick={() => setScreen('upload')}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <i className="ti ti-upload" style={{ fontSize: 22, color: 'var(--navy)' }} />
                <div><b style={{ color: 'var(--navy)', fontSize: 14.5 }}>Upload a signed form</b><div className="sub" style={{ marginTop: 2 }}>Already printed, signed, and scanned it? Upload it here.</div></div>
              </div>
            </div>
            <div className="card" style={{ cursor: 'pointer' }} onClick={() => setScreen('form')}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <i className="ti ti-edit" style={{ fontSize: 22, color: 'var(--navy)' }} />
                <div><b style={{ color: 'var(--navy)', fontSize: 14.5 }}>Complete the form online</b><div className="sub" style={{ marginTop: 2 }}>Fill it out now — we'll generate one authorization per provider.</div></div>
              </div>
            </div>
            {err && <div className="err">{err}</div>}
          </div>
        );
      }

      if (screen === 'upload') {
        return (
          <div className="gfc-body">
            {backBtn('choice')}
            <h2 className="disp">Upload signed form</h2>
            <div className="card" style={{ marginTop: 14 }}>
              <label className="fld" style={{ margin: 0, display: 'block', cursor: 'pointer' }}>
                <div style={{ border: '2px dashed var(--line2)', borderRadius: 12, padding: '32px 18px', textAlign: 'center', background: 'var(--cream)' }}>
                  <i className="ti ti-cloud-upload" style={{ fontSize: 34, color: 'var(--navy)' }} />
                  <div style={{ marginTop: 8, fontSize: 13.5, color: 'var(--ink)' }}><b style={{ color: 'var(--navy)' }}>Click to select your file</b></div>
                  <div className="sub" style={{ fontSize: 12 }}>PDF, JPG, or PNG · max 10 MB</div>
                </div>
                <input type="file" accept=".pdf,.jpg,.jpeg,.png" style={{ display: 'none' }} onChange={e => handleFile(e.target.files[0])} />
              </label>
              {file && <div className="doc" style={{ marginTop: 12 }}><i className="ti ti-file-check" /><div><b>{file.name}</b><span>Ready to upload</span></div></div>}
              <button className="btn" disabled={busy || !file} onClick={submitUpload}>{busy ? 'Uploading…' : 'Upload document'}</button>
              {err && <div className="err">{err}</div>}
            </div>
          </div>
        );
      }

      // screen === 'form'
      return (
        <div className="gfc-body">
          {backBtn('choice')}
          <h2 className="disp">Authorization form</h2>

          <p className="lbl">1 · Patient (whose records)</p>
          <div className="card">
            <TextField label="Patient full name" value={patient.patientName} onChange={v => setPatient(p => ({ ...p, patientName: v }))} />
            <TextField label="Date of birth" value={patient.patientDOB} onChange={v => setPatient(p => ({ ...p, patientDOB: v }))} placeholder="MM/DD/YYYY" />
            <TextField label="Address" value={patient.patientAddress} onChange={v => setPatient(p => ({ ...p, patientAddress: v }))} />
            <TextField label="Phone" type="tel" value={patient.patientPhone} onChange={v => setPatient(p => ({ ...p, patientPhone: v }))} />
          </div>

          <p className="lbl">2 · Release records from</p>
          <div className="hint" style={{ fontSize: 11.5, color: 'var(--mut)', marginBottom: 8 }}>Providers from your intake are pre-filled. Edit any field and add more. A separate authorization PDF is generated for each provider.</div>
          {providers.map((p, i) => (
            <RoiProviderCard key={i} p={p} idx={i} removable={providers.length > 1} onChange={setP} onRemove={() => rmProvider(i)} />
          ))}
          <button className="btn ghost" onClick={addProvider} style={{ marginTop: 4 }}><i className="ti ti-plus" /> Add another provider</button>

          <p className="lbl">3 · Release records to</p>
          <div className="card" style={{ background: 'var(--cream)' }}>
            <b style={{ color: 'var(--navy)', fontSize: 14 }}>Godwins Family Care LLC</b>
            <div className="sub" style={{ marginTop: 3, fontSize: 12.5 }}>4300 Paces Ferry Rd SE, Ste 500, Atlanta, GA 30339 · Tel 404-913-6705 · Fax 678-692-7445</div>
          </div>

          <p className="lbl">4 · Information authorized</p>
          <div className="card">
            {ROI_CATS.map(c => (
              <div key={c.key} className={`check ${cats[c.key] ? 'on' : ''}`} onClick={() => toggleCat(c.key)}>
                <span className="box">{cats[c.key] && <i className="ti ti-check" />}</span>{c.label}
              </div>
            ))}
            <div className={`check ${cats.other ? 'on' : ''}`} onClick={() => toggleCat('other')}>
              <span className="box">{cats.other && <i className="ti ti-check" />}</span>Other
            </div>
            {cats.other && <TextField label="Other — specify" value={otherText} onChange={setOtherText} />}
            <div style={{ marginTop: 14, padding: '12px 14px', background: 'var(--cream)', borderRadius: 11, border: '1px solid var(--line2)' }}>
              <div style={{ fontSize: 12, color: 'var(--mut)', lineHeight: 1.55, marginBottom: 8 }}>
                <b style={{ color: 'var(--navy)' }}>Specially protected information.</b> Records of mental health, substance use, HIV/AIDS, or genetic testing are released <b>only</b> if you specifically authorize it here.
              </div>
              <div className={`check ${includesProtected ? 'on' : ''}`} onClick={() => setIncludesProtected(v => !v)} style={{ marginBottom: 0 }}>
                <span className="box">{includesProtected && <i className="ti ti-check" />}</span>Yes, include specially protected information listed above
              </div>
            </div>
          </div>

          <p className="lbl">5 · Purpose</p>
          <div className="card">
            <div className="check on" style={{ cursor: 'default' }}><span className="box"><i className="ti ti-check" /></span>Treatment, care coordination, and care planning</div>
            <div className={`check ${purposeOther ? 'on' : ''}`} onClick={() => setPurposeOther(v => !v)}><span className="box">{purposeOther && <i className="ti ti-check" />}</span>Other</div>
            {purposeOther && <TextField label="Other purpose — specify" value={purposeOtherText} onChange={setPurposeOtherText} />}
          </div>

          <p className="lbl">6 · Expiration</p>
          <div className="card">
            <div className="hint" style={{ fontSize: 11.5, color: 'var(--mut)', marginBottom: 4 }}>Unless revoked sooner, this authorization expires one year from the date signed, or on the earlier of:</div>
            <TextField label="Expiration date (optional)" value={expDate} onChange={setExpDate} placeholder="MM/DD/YYYY" />
            <TextField label="Expiration event (optional)" value={expEvent} onChange={setExpEvent} placeholder="e.g. end of treatment" />
          </div>

          <p className="lbl">7 · Your rights</p>
          <div className="consentbox">
            <p>I understand that: (1) I may revoke this authorization at any time by writing to Godwins Family Care LLC, except to the extent action has already been taken in reliance on it; (2) treatment, payment, enrollment, and eligibility for benefits may not be conditioned on signing, except where the law allows; (3) information disclosed under this authorization may be re-disclosed by the recipient and may no longer be protected by federal privacy law; and (4) I am entitled to a copy of this signed authorization.</p>
          </div>

          <p className="lbl">8 · Signature</p>
          <div className="card">
            <div className="hint" style={{ fontSize: 11.5, color: 'var(--mut)', marginBottom: 8 }}>Draw your signature below using your mouse or finger.</div>
            <div style={{ position: 'relative', border: '1px solid var(--line2)', borderRadius: 10, background: '#fff' }}>
              <canvas ref={canvasRef} style={{ display: 'block', width: '100%', height: 130, touchAction: 'none' }} />
              <button onClick={clearSig} style={{ position: 'absolute', top: 6, right: 8, background: '#fff', border: '1px solid var(--line2)', borderRadius: 6, fontSize: 11, color: 'var(--mut)', padding: '2px 8px', cursor: 'pointer' }}>Clear</button>
            </div>
            <TextField label="Printed name" value={printedName} onChange={setPrintedName} />
            <TextField label="Relationship / authority (if signing for patient)" value={relationship} onChange={setRelationship} placeholder="e.g. Power of attorney" />
            <div className="sub" style={{ fontSize: 12, marginTop: 8 }}>Date: {today}</div>
            <button className="btn" disabled={busy} onClick={submitForm}>{busy ? (providers.filter(p => (p.name || '').trim()).length > 1 ? 'Generating authorizations…' : 'Submitting…') : 'Submit authorization'}</button>
            {err && <div className="err">{err}</div>}
          </div>
        </div>
      );
    };

    const GfcDocuments = ({ docs, readOnly, token, onOpenTransferRoi }) => {
      const signed = docs?.signedConsents || [];
      const files = docs?.documents || [];
      const packet = docs?.enrollmentPacket || null;
      const openPacket = () => {
        if (!packet) return;
        // Drive-hosted copy opens directly; on-demand PDF uses the auth-header download helper.
        if (packet.url && packet.url.startsWith('http')) window.open(packet.url, '_blank');
        else openPdfSecurely(`${API_URL}${packet.url}`, token);
      };
      return (
        <div className="gfc-body">
          {readOnly && <span className="ro"><i className="ti ti-eye" />Family view · read-only</span>}
          {!readOnly && onOpenTransferRoi && (
            <React.Fragment>
              <p className="lbl" style={{ marginTop: 0 }}>Record release</p>
              <div className="doc" onClick={onOpenTransferRoi} style={{ cursor: 'pointer' }}>
                <i className="ti ti-file-symlink" />
                <div><b>Authorize record release from prior providers</b><span>Request your records from a prior doctor, specialist, or hospital</span></div>
                <i className="ti ti-chevron-right" style={{ marginLeft: 'auto', color: 'var(--goldd)' }} />
              </div>
            </React.Fragment>
          )}
          {packet && (
            <React.Fragment>
              <p className="lbl" style={{ marginTop: 0 }}>Enrollment</p>
              <div className="doc" onClick={openPacket} style={{ cursor: 'pointer' }}>
                <i className="ti ti-file-certificate" />
                <div><b>{packet.title}</b><span>{packet.description}</span></div>
                <i className="ti ti-download" style={{ marginLeft: 'auto', color: 'var(--goldd)' }} />
              </div>
            </React.Fragment>
          )}
          <p className="lbl" style={{ marginTop: packet ? undefined : 0 }}>Signed consents</p>
          {signed.length === 0 && <p className="sub">No consents on file yet.</p>}
          {signed.map(s => {
            // Each signed consent is a filed PDF (opens the signed enrollment packet,
            // which contains the consent + its e-signature metadata).
            const openConsentPdf = () => { if (!packet) return; packet.url && packet.url.startsWith('http') ? window.open(packet.url, '_blank') : openPdfSecurely(`${API_URL}${packet.url}`, token); };
            const sub = s.status === 'na' ? 'Opt-out recorded'
              : `Signed ${s.signedAt ? prettyDate(s.signedAt) : ''}${s.signerName ? ` · ${s.signerName}` : ''}`.trim();
            return (
              <div className="doc" key={s.key} onClick={s.status === 'signed' ? openConsentPdf : undefined} style={{ cursor: s.status === 'signed' ? 'pointer' : 'default' }}>
                <i className="ti ti-file-certificate" />
                <div><b>{s.label}</b><span>{sub}</span></div>
                {s.status === 'signed' && <span style={{ marginLeft: 'auto', fontSize: 11, fontWeight: 700, letterSpacing: '.06em', color: 'var(--goldd)' }}>PDF</span>}
              </div>
            );
          })}
          <p className="lbl">From your care team</p>
          {files.length === 0 && <p className="sub">Shared documents from your care team will appear here.</p>}
          {files.map(f => (
            <a className="doc" key={f.id} href={f.url || '#'} target="_blank" rel="noopener noreferrer" style={{ textDecoration: 'none' }}>
              <i className="ti ti-file-text" />
              <div><b>{f.title || f.name || 'Document'}</b><span>{f.description || 'Shared by your care team'}</span></div>
              <i className="ti ti-download" style={{ marginLeft: 'auto', color: 'var(--goldd)' }} />
            </a>
          ))}
          <p className="micro"><i className="ti ti-cloud-lock" />Documents stored in HIPAA Google Drive</p>
        </div>
      );
    };

    const GfcClientPortal = ({ token, user }) => {
      const [me, setMe] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [view, setView] = useState('home');       // home | care | messages | documents
      const [showIntake, setShowIntake] = useState(false);
      const [showTransferRoi, setShowTransferRoi] = useState(false); // Transfer-of-Care ROI overlay (Session 3.4)
      const [justEnrolled, setJustEnrolled] = useState(false); // one-time nudge right after intake completes (Session 3.4)
      const [data, setData] = useState(null);          // care-plan + visits
      const [messages, setMessages] = useState(null);
      const [docs, setDocs] = useState(null);

      const reloadMe = async () => {
        const result = await api.getGfcMe(token);
        if (!result.error) setMe(result);
        return result;
      };

      // Step 1: load enrollment state (not gated).
      useEffect(() => {
        let cancelled = false;
        (async () => {
          const result = await api.getGfcMe(token);
          if (cancelled) return;
          if (result.error) { setError(result.error); setLoading(false); return; }
          setMe(result);
          setLoading(false);
        })();
        return () => { cancelled = true; };
      }, [token]);

      const isFamily = me?.isFamily;
      const locked = me && (isFamily ? !me.roiFamilySigned : me.enrollmentStatus === 'intake_pending');

      // Step 2: once unlocked, load portal data (these endpoints are gated server-side).
      useEffect(() => {
        if (!me || locked) return;
        let cancelled = false;
        (async () => {
          const [cp, msg, dc] = await Promise.all([
            api.getGfcCarePlan(token),
            api.getGfcMessages(token),
            api.getGfcDocuments(token)
          ]);
          if (cancelled) return;
          if (!cp.error) { cp.messages = msg.error ? null : msg; setData(cp); }
          if (!msg.error) setMessages(msg);
          if (!dc.error) setDocs(dc);
        })();
        return () => { cancelled = true; };
      }, [me, locked, token]);

      if (loading) {
        return (
          <div className="gfc"><div className="gfc-shell"><div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 16 }}>
            <div className="gfc-spin" /><p style={{ color: 'var(--mut)' }}>Loading your care portal…</p>
          </div></div></div>
        );
      }

      if (error) {
        return (
          <div className="gfc"><div className="gfc-shell">
            <div className="gfc-hdr"><span className="ttl">Godwins Family Care</span><button onClick={gfcLogout} title="Sign out"><i className="ti ti-logout" /></button></div>
            <div className="gfc-body"><div className="lockcard"><i className="ti ti-alert-triangle" /><div><b>We couldn't load your portal</b><span>{error}</span></div></div></div>
          </div></div>
        );
      }

      // LOCKED → render only the gate / intake. Every other area is blocked server-side too.
      if (locked) {
        return (
          <div className="gfc"><div className="gfc-shell">
            <div className="gfc-hdr">
              {showIntake ? <button onClick={() => setShowIntake(false)}><i className="ti ti-chevron-left" /></button> : <span style={{ width: 18 }} />}
              <span className="ttl">{showIntake ? 'Enrollment' : 'My Care'}</span>
              <button onClick={gfcLogout} title="Sign out"><i className="ti ti-logout" /></button>
            </div>
            {showIntake && !isFamily
              ? <GfcIntakeFlow token={token} me={me} onBack={() => setShowIntake(false)}
                  onComplete={async () => { setShowIntake(false); await reloadMe(); setJustEnrolled(true); }} />
              : <GfcGate me={me} onStartIntake={() => setShowIntake(true)} />}
          </div></div>
        );
      }

      // One-time nudge right after enrollment completes — offers the full
      // Transfer-of-Care ROI immediately rather than leaving it to be
      // discovered later in Documents (Session 3.4).
      if (justEnrolled && !isFamily) {
        return (
          <div className="gfc"><div className="gfc-shell">
            <div className="gfc-hdr"><span className="ttl">Welcome</span><button onClick={gfcLogout} title="Sign out"><i className="ti ti-logout" /></button></div>
            <div className="gfc-body" style={{ textAlign: 'center', padding: '50px 20px 20px' }}>
              <div style={{ width: 60, height: 60, background: 'var(--navy)', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 20px' }}>
                <i className="ti ti-check" style={{ color: 'var(--gold)', fontSize: 28 }} />
              </div>
              <h2 className="disp">You're enrolled!</h2>
              <p className="sub" style={{ maxWidth: 340, margin: '12px auto 24px' }}>If you're transferring care from another doctor, specialist, or hospital, you can authorize us to request your records now — it only takes a minute.</p>
              <button className="btn" style={{ maxWidth: 280, margin: '0 auto' }} onClick={() => { setJustEnrolled(false); setShowTransferRoi(true); }}>Authorize record release now</button>
              <button className="btn ghost" style={{ maxWidth: 280, margin: '10px auto 0' }} onClick={() => setJustEnrolled(false)}>Not now — I'll do this later</button>
            </div>
          </div></div>
        );
      }

      // Transfer-of-Care ROI overlay — takes over the shell (client-only, Session 3.4).
      if (showTransferRoi && !isFamily) {
        return (
          <div className="gfc"><div className="gfc-shell">
            <div className="gfc-hdr">
              <button onClick={() => setShowTransferRoi(false)}><i className="ti ti-chevron-left" /></button>
              <span className="ttl">Record Release</span>
              <button onClick={gfcLogout} title="Sign out"><i className="ti ti-logout" /></button>
            </div>
            <GfcTransferRoi token={token}
              onClose={() => setShowTransferRoi(false)}
              onDone={async () => { const dc = await api.getGfcDocuments(token); if (!dc.error) setDocs(dc); }} />
          </div></div>
        );
      }

      // UNLOCKED portal.
      const titles = { home: 'My Care', care: 'Care Plan', messages: 'Messages', documents: 'Documents' };
      const tabs = [
        { id: 'home', icon: 'ti-home', label: 'Home' },
        { id: 'care', icon: 'ti-clipboard-heart', label: 'Care' },
        { id: 'messages', icon: 'ti-message', label: 'Messages' },
        { id: 'documents', icon: 'ti-file-text', label: 'Documents' }
      ];
      return (
        <div className="gfc"><div className="gfc-shell desktopnav">
          <div className="gfc-hdr">
            <span className="ttl">{titles[view]}</span>
            <button onClick={gfcLogout} title="Sign out"><i className="ti ti-logout" /></button>
          </div>
          {view === 'home' && data && <GfcDashboard data={data} onNavigate={setView} me={me} />}
          {view === 'care' && data && <GfcCarePlan data={data} readOnly={isFamily} token={token} />}
          {view === 'messages' && <GfcMessages messages={messages} readOnly={isFamily} token={token}
            onSent={async () => { const msg = await api.getGfcMessages(token); if (!msg.error) { setMessages(msg); setData(d => d ? { ...d, messages: msg } : d); } }} />}
          {view === 'documents' && <GfcDocuments docs={docs} readOnly={isFamily} token={token} onOpenTransferRoi={() => setShowTransferRoi(true)} />}
          {!data && view !== 'messages' && view !== 'documents' && (
            <div className="gfc-body" style={{ display: 'flex', justifyContent: 'center', paddingTop: 60 }}><div className="gfc-spin" /></div>
          )}
          <nav className="gfc-tabs">
            {tabs.map(t => (
              <button key={t.id} className={view === t.id ? 'on' : ''} onClick={() => setView(t.id)}>
                <i className={`ti ${t.icon}`} />{t.label}
              </button>
            ))}
          </nav>
        </div></div>
      );
    };

    const Portal = ({ token, user }) => {
      // GFC client + family users get the converted Private Home Care portal.
      // Staff (admin/manager/client-portal-admin) keep the existing admin view below.
      if (user && (user.role === 'client' || user.role === 'family')) {
        return <GfcClientPortal token={token} user={user} />;
      }
      const urlSlug = getSlugFromUrl();
      // Super Admin, Manager, or users with hasClientPortalAdminAccess can access admin features
      const isAdmin = user?.role === 'admin' || user?.isManager || user?.hasClientPortalAdminAccess;
      const slug = user?.slug || urlSlug || (isAdmin ? 'admin' : null);

      // URL routing helper functions
      const getPageFromUrl = () => {
        const path = window.location.pathname;
        const hash = window.location.hash;
        // Parse path like /portal/slug/page or /portal/slug/page/tab
        const match = path.match(/\/portal\/[^\/]+\/([^\/]+)(?:\/([^\/]+))?/);
        const page = match ? match[1] : 'home';
        const tab = match ? match[2] : null;
        return { page, tab };
      };

      const updateUrl = (page, tab = null) => {
        const basePath = `/portal/${slug}`;
        let newPath = basePath;
        if (page && page !== 'home') {
          newPath += `/${page}`;
          if (tab) newPath += `/${tab}`;
        }
        if (window.location.pathname !== newPath) {
          window.history.pushState({ page, tab }, '', newPath);
        }
      };

      const initialRoute = getPageFromUrl();
      const [activePage, setActivePage] = useState(initialRoute.page || 'home');
      const [activeSubTab, setActiveSubTab] = useState(initialRoute.tab || null);
      const [data, setData] = useState(null);
      const [settings, setSettings] = useState(null);
      const [announcements, setAnnouncements] = useState([]);
      const [documents, setDocuments] = useState([]);
      const [loading, setLoading] = useState(true);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [highlightServiceReportId, setHighlightServiceReportId] = useState(null);

      // Navigate with URL update
      const navigateTo = (page, tab = null) => {
        setActivePage(page);
        setActiveSubTab(tab);
        updateUrl(page, tab);
      };

      // Navigate from Service History to Files with a specific report highlighted
      const navigateToFile = (serviceReportId) => {
        setHighlightServiceReportId(serviceReportId || null);
        navigateTo('files');
      };

      // Handle browser back/forward
      useEffect(() => {
        const handlePopState = (event) => {
          const route = getPageFromUrl();
          setActivePage(route.page || 'home');
          setActiveSubTab(route.tab || null);
        };
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, []);
      
      useEffect(() => {
        const loadData = async () => {
          try {
            // Admin doesn't need portal data for their own view
            if (isAdmin) {
              const portalSettings = await api.getPortalSettings();
              setSettings(portalSettings);
              setData({ user });
              setLoading(false);
              return;
            }
            const [portalData, portalSettings, announcementsData, docsData] = await Promise.all([
              api.getPortalData(token),
              api.getPortalSettings(),
              api.getAnnouncements(token),
              api.getClientDocuments(slug, token)
            ]);
            setData(portalData);
            setSettings(portalSettings);
            setAnnouncements(announcementsData);
            setDocuments(docsData);
          } catch (err) {
            console.error('Failed to load portal data:', err);
          } finally {
            setLoading(false);
          }
        };
        loadData();
      }, [token, slug, isAdmin]);
      
      const handleSettingsChange = (newSettings) => {
        setSettings({ ...settings, ...newSettings });
      };
      
      if (loading) {
        return (
          <div className="min-h-screen flex items-center justify-center">
            <div className="text-center">
              <div className="inline-block animate-spin rounded-full h-12 w-12 border-4 border-primary border-t-transparent"></div>
              <p className="mt-4 text-gray-600">Loading your portal...</p>
            </div>
          </div>
        );
      }
      
      const renderPage = () => {
        // Admin pages
        if (isAdmin) {
          if (activePage === 'home') return <AdminHomePage token={token} />;
          if (activePage === 'admin_settings') return <AdminSettingsPage token={token} settings={settings} onSettingsChange={handleSettingsChange} />;
          if (activePage === 'admin_announcements') return <AdminAnnouncementsPage token={token} />;
          if (activePage === 'admin_documents') return <AdminDocumentsPage token={token} />;
          if (activePage === 'admin_clients') return <AdminClientsPage token={token} />;
        }

        // Client pages
        if (activePage === 'home') return <HomePage data={data} announcements={announcements} onNavigate={navigateTo} />;
        if (activePage === 'milestones') return <MilestonesPage data={data} onNavigate={navigateTo} token={token} currentUser={user} onNavigateToFile={navigateToFile} />;
        if (activePage === 'support') return <SupportPage settings={settings} token={token} userData={data?.user} documents={documents} activeTab={activeSubTab} onTabChange={(tab) => navigateTo('support', tab)} onNavigateToFile={navigateToFile} />;
        if (activePage === 'files') return <FilesPage settings={settings} documents={documents} token={token} projects={data?.projects || []} userData={data?.user} highlightServiceReportId={highlightServiceReportId} />;
        
        return null;
      };
      
      return (
        <div className="flex min-h-screen">
          {/* Mobile header */}
          <div className="fixed top-0 left-0 right-0 bg-white border-b z-30 lg:hidden p-4 flex justify-between items-center">
            <button onClick={() => setMobileMenuOpen(true)} className="text-gray-600 hover:text-gray-800">
              {Icons.menu}
            </button>
            <img src="/brand/logo-full-color-transparent.png" alt="Godwins Family Care" className="h-8" />
            <div className="w-6"></div>
          </div>
          
          <Sidebar
            activePage={activePage}
            onNavigate={navigateTo}
            user={data?.user || user}
            projects={data?.projects || []}
            isMobileOpen={mobileMenuOpen}
            onClose={() => setMobileMenuOpen(false)}
          />
          
          <main className="flex-1 lg:ml-64 p-4 lg:p-8 mt-16 lg:mt-0 max-w-7xl">
            {/* Signature Required Banner */}
            {!isAdmin && (() => {
              const unsignedCount = (documents || []).filter(d => d.serviceReportId && d.reportStatus === 'signature_needed').length;
              if (unsignedCount === 0) return null;
              return (
                <div className="mb-6 bg-red-50 border border-red-300 rounded-xl p-4 flex items-center gap-4 shadow-sm">
                  <div className="flex-shrink-0 w-10 h-10 bg-red-100 rounded-full flex items-center justify-center">
                    <svg className="w-5 h-5 text-red-600" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                  </div>
                  <div className="flex-1">
                    <p className="font-semibold text-red-800">
                      {unsignedCount} service report{unsignedCount > 1 ? 's' : ''} requires your signature
                    </p>
                    <p className="text-sm text-red-600">Please review and sign your service report{unsignedCount > 1 ? 's' : ''} to download.</p>
                  </div>
                  <button
                    onClick={() => navigateToFile(null)}
                    className="px-4 py-2 bg-red-600 text-white rounded-lg font-medium hover:bg-red-700 transition-colors text-sm whitespace-nowrap"
                  >
                    Go to Files
                  </button>
                </div>
              );
            })()}
            {renderPage()}
            
            <footer className="mt-12 text-center text-sm text-gray-500">
              <p>&copy; 2026 Godwins Family Care LLC. All rights reserved.</p>
              {isAdmin && (
                <a href="/changelog" className="text-primary hover:underline text-xs mt-1 inline-block">View Changelog</a>
              )}
            </footer>
          </main>
        </div>
      );
    };
    
    const App = () => {
      // Check multiple token sources - portal_token, unified_token, or admin_token from Portal Hub
      const [token, setToken] = useState(() => {
        return localStorage.getItem('portal_token') || localStorage.getItem('unified_token') || localStorage.getItem('admin_token');
      });
      const [user, setUser] = useState(() => {
        try {
          const userData = localStorage.getItem('portal_user') || localStorage.getItem('unified_user') || localStorage.getItem('admin_user');
          return userData ? JSON.parse(userData) : null;
        } catch {
          return null;
        }
      });
      const slug = getSlugFromUrl();
      
      const handleLogin = (newToken, newUser) => {
        setToken(newToken);
        setUser(newUser);
      };
      
      // Handle central /portal login (no slug) - show login page or admin view
      if (!slug) {
        if (!token || !user) {
          return <LoginPage slug={null} onLogin={handleLogin} />;
        }
        // Super Admin, Manager, or users with Client Portal Admin access get the admin portal view directly at /portal
        if (user.role === 'admin' || user.isManager || user.hasClientPortalAdminAccess) {
          return <Portal token={token} user={user} />;
        }
        // Family / authorized contacts have no slug of their own — render the
        // GFC portal directly (it resolves the linked client via /api/gfc/me).
        if (user.role === 'family') {
          return <Portal token={token} user={user} />;
        }
        // Client users logged in from central portal - redirect to their portal
        if (user.slug) {
          window.location.href = `/portal/${user.slug}`;
          return null;
        }
        return (
          <div className="min-h-screen flex items-center justify-center bg-gray-100">
            <div className="text-center">
              <h1 className="text-2xl font-bold text-red-600">Portal Not Found</h1>
              <p className="text-gray-600 mt-2">Invalid portal configuration.</p>
            </div>
          </div>
        );
      }
      
      if (!token || !user) {
        return <LoginPage slug={slug} onLogin={handleLogin} />;
      }
      
      return <Portal token={token} user={user} />;
    };
    
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
