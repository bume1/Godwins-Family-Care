      genderPref: ['No preference', 'Female preferred', 'Male preferred', 'Female — strong', 'Male — strong'],
      caregiverExp: ['Entry-level OK', 'Some experience', 'Experienced', 'Dementia-trained', 'Behavioral support certified'],
      insuranceTypes: ['Medicare Part A & B', 'Medicare Advantage', 'Medicaid', 'Dual eligible', 'VA benefits', 'Commercial insurance', 'Managed care organization', 'Long-term care insurance', 'Private pay only'],
      medicareType: ['Part A & B', 'Medicare Advantage (Part C)', 'Dual eligible', 'Not applicable'],
      medicaidWaiver: ['CCSP', 'ICWP', 'SOURCE', 'Katie Beckett', 'Other waiver', 'Not on a waiver'],
      policyHolderRel: ['Self', 'Spouse', 'Parent', 'Child', 'Other'],
      homeBenefit: ['Covered — verified', 'Covered — unverified', 'Not covered', 'Unknown'],
      ltcCarrier: ['Genworth', 'Mutual of Omaha', 'Northwestern Mutual', 'John Hancock', 'Transamerica', 'Other', 'Not applicable'],
      auth911: ['Yes — authorized', 'Yes — call family first if time allows', 'No — always call family first']
    };

    // Small textarea field matching the .fld/label convention used across the wizard.
    const TextArea = ({ label, hint, value, onChange, placeholder }) => (
      <div className="fld">
        <label>{label}</label>
        {hint && <div className="hint">{hint}</div>}
        <textarea value={value || ''} placeholder={placeholder} onChange={e => onChange(e.target.value)} />
      </div>
    );

    const GfcIntakeFlow = ({ token, me, onBack, onComplete }) => {
      const [loaded, setLoaded] = useState(false);
      const [serviceLine, setServiceLine] = useState(me.serviceLine || 'PHC');
      const [form, setForm] = useState({
        medications: [{ name: '', dose: '', route: '', frequency: '', prescriber: '', pharmacy: '' }],
        insuranceIds: [{ carrier: '', memberId: '', group: '' }],
        submitter: {}, primaryContact: {}, emergencyContacts: [{}, {}],
        medicalTeam: {}, situation: {}, schedule: {}, matching: {}, advanceDirective: {},
        medicare: {}, medicaid: {}, commercial: {}, ltc: {},
        adl: {}, conditions: [], skilledTasksNeeded: [], recentEvents: [],
        equipment: [], iadl: [], behavioralFlags: [], functionalRisk6mo: [],
        homeSafetyFlags: [], legalDocs: [], helpNeeded: [], ongoingConditions: [],
        preferredDays: [], serviceInterests: [], currentServices: [], hbpcInterests: [], insuranceTypes: []
      });
      const [consents, setConsents] = useState({});
      const [consentMeta, setConsentMeta] = useState({});
      const [consentDefs, setConsentDefs] = useState([]);
      const [requiredConsents, setRequiredConsents] = useState([]);
      const [step, setStep] = useState(0);
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState('');

      useEffect(() => {
        (async () => {
          const r = await api.getGfcIntake(token);
          if (!r.error) {
            const sl = r.serviceLine || 'PHC';
            setServiceLine(sl);
            setConsents(r.consents || {});
            setConsentMeta(r.consentMeta || {});
            setConsentDefs(r.consentDefs || []);
            setRequiredConsents(r.requiredConsents || []);
            if (r.intake && Object.keys(r.intake).length) {
              const it = r.intake;
              const arr = (v) => Array.isArray(v) ? v : [];
              const obj = (v) => (v && typeof v === 'object') ? v : {};
              setForm(f => ({
                ...f, ...it,
                medications: (it.medications && it.medications.length) ? it.medications : f.medications,
                insuranceIds: (it.insuranceIds && it.insuranceIds.length) ? it.insuranceIds : f.insuranceIds,
                submitter: obj(it.submitter), primaryContact: obj(it.primaryContact),
                emergencyContacts: (it.emergencyContacts && it.emergencyContacts.length) ? it.emergencyContacts : [{}, {}],
                medicalTeam: obj(it.medicalTeam), situation: obj(it.situation), schedule: obj(it.schedule),
                matching: obj(it.matching), advanceDirective: obj(it.advanceDirective),
                medicare: obj(it.medicare), medicaid: obj(it.medicaid), commercial: obj(it.commercial), ltc: obj(it.ltc),
                adl: obj(it.adl), conditions: arr(it.conditions), skilledTasksNeeded: arr(it.skilledTasksNeeded),
                recentEvents: arr(it.recentEvents), equipment: arr(it.equipment), iadl: arr(it.iadl),
                behavioralFlags: arr(it.behavioralFlags), functionalRisk6mo: arr(it.functionalRisk6mo),
                homeSafetyFlags: arr(it.homeSafetyFlags), legalDocs: arr(it.legalDocs), helpNeeded: arr(it.helpNeeded),
                ongoingConditions: arr(it.ongoingConditions), preferredDays: arr(it.preferredDays),
                serviceInterests: arr(it.serviceInterests), currentServices: arr(it.currentServices),
                hbpcInterests: arr(it.hbpcInterests), insuranceTypes: arr(it.insuranceTypes)
              }));
            }
          }
          setLoaded(true);
        })();
      }, [token]);

      const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
      const setNested = (obj, k, v) => setForm(f => ({ ...f, [obj]: { ...(f[obj] || {}), [k]: v } }));
      const toggleArr = (k, val) => setForm(f => {
        const arr = f[k] || []; return { ...f, [k]: arr.includes(val) ? arr.filter(x => x !== val) : [...arr, val] };
      });
      const setMed = (i, k, v) => setForm(f => { const m = [...f.medications]; m[i] = { ...m[i], [k]: v }; return { ...f, medications: m }; });
      const addMed = () => setForm(f => ({ ...f, medications: [...f.medications, { name: '', dose: '', route: '', frequency: '', prescriber: '', pharmacy: '' }] }));
      const rmMed = (i) => setForm(f => ({ ...f, medications: f.medications.filter((_, x) => x !== i) }));
      const setIns = (i, k, v) => setForm(f => { const a = [...f.insuranceIds]; a[i] = { ...a[i], [k]: v }; return { ...f, insuranceIds: a }; });
      const addIns = () => setForm(f => ({ ...f, insuranceIds: [...f.insuranceIds, { carrier: '', memberId: '', group: '' }] }));
      const setEC = (i, k, v) => setForm(f => { const e = [...f.emergencyContacts]; e[i] = { ...(e[i] || {}), [k]: v }; return { ...f, emergencyContacts: e }; });

      const activeConsentDefs = consentDefs.length ? consentDefs : [];
      // Guard against a vacuous "all signed": if the consent defs never loaded,
      // requiredConsents is [] and .every() is trivially true. Require defs to be
      // present before treating consents as satisfied.
      const consentsLoaded = consentDefs.length > 0;
      const requiredSigned = consentsLoaded && requiredConsents.every(t => consents[t] === 'signed');

      // Persist the data steps as a draft when advancing.
      const saveDraft = async () => {
        const res = await api.saveGfcIntake(token, form, serviceLine);
        return res;
      };

      // Changing the service line changes the branched consent set. Persist the
      // new line, then refresh consentDefs/requiredConsents so the Consents step
      // renders the correct cards and the submit gate matches what the server
      // will require — otherwise a PHC→IHPC switch leaves stale consent cards and
      // enrollment cannot be completed.
      const changeServiceLine = async (newLine) => {
        if (newLine === serviceLine) return;
        setServiceLine(newLine);
        try {
          await api.saveGfcIntake(token, form, newLine);
          const r = await api.getGfcIntake(token);
          if (!r.error) {
            setConsentDefs(r.consentDefs || []);
            setRequiredConsents(r.requiredConsents || []);
            setConsents(r.consents || {});
            setConsentMeta(r.consentMeta || {});
          }
        } catch (_) { /* non-fatal; user can retry by re-selecting */ }
      };

      const handleSignConsent = async (type, payload) => {
        const res = await api.signGfcConsent(token, { type, ...payload });
        if (!res.error) {
          setConsents(c => ({ ...c, [type]: res.status }));
        }
        return res;
      };

      // Intake document uploads → HIPAA Drive (reuses the same base64 pattern as the ROI upload).
      const [uploadBusy, setUploadBusy] = useState(false);
      const [uploadErr, setUploadErr] = useState('');
      const handleUploadFiles = async (e) => {
        const files = Array.from(e.target.files || []);
        e.target.value = '';
        if (!files.length) return;
        setUploadErr(''); setUploadBusy(true);
        for (const file of files) {
          if (file.size > 10 * 1024 * 1024) { setUploadErr(`${file.name} exceeds 10 MB.`); continue; }
          try {
            const b64 = await new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = reject; r.readAsDataURL(file); });
            const res = await api.uploadGfcIntakeDoc(token, { fileName: file.name, fileDataB64: b64, mimeType: file.type });
            if (res.error) { setUploadErr(res.error); continue; }
            setForm(f => ({ ...f, uploads: [...(f.uploads || []), { name: file.name, url: res.url || null }] }));
          } catch (err) { setUploadErr('Upload failed. Please try again.'); }
        }
        setUploadBusy(false);
      };

      const steps = [
        { key: 'path', label: 'Service path' },
        { key: 'client', label: 'Client details' },
        { key: 'contacts', label: 'Contacts' },
        { key: 'situation', label: 'Care situation' },
        { key: 'schedule', label: 'Schedule & urgency' },
        { key: 'homebound', label: 'Homebound & recent care' },
        { key: 'medical', label: 'Medical' },
        { key: 'function', label: 'Function & safety' },
        { key: 'matching', label: 'Caregiver match' },
        { key: 'insurance', label: 'Insurance' },
        { key: 'consents', label: 'Consents' },
        { key: 'review', label: 'Review & submit' }
      ];
      const pct = Math.round(((step + 1) / steps.length) * 100);

      const next = async () => {
        setErr('');
        // Validate per step
        if (steps[step].key === 'client' && !form.dob) { setErr('Please enter the client date of birth.'); return; }
        if (steps[step].key === 'contacts' && !(form.primaryContact && form.primaryContact.name)) { setErr('A primary family contact name is required.'); return; }
        setBusy(true);
        // Save draft on data steps (not on the consent step which saves per-signature)
        if (steps[step].key !== 'consents' && steps[step].key !== 'review') {
          const res = await saveDraft();
          if (res.error) { setBusy(false); setErr(res.error); return; }
        }
        setBusy(false);
        setStep(s => Math.min(s + 1, steps.length - 1));
        window.scrollTo(0, 0);
      };
      const back = () => { setErr(''); if (step === 0) { onBack(); } else setStep(s => s - 1); };

      const submit = async () => {
        setErr(''); setBusy(true);
        await saveDraft();
        const res = await api.submitGfcIntake(token);
        setBusy(false);
        if (res.error) {
          if (res.code === 'CONSENTS_INCOMPLETE') setErr('Some required consents still need signing. Go back to Consents.');
          else if (res.code === 'INTAKE_INCOMPLETE') setErr('Some required details are missing: ' + (res.missingFields || []).join(', '));
          else setErr(res.error);
          return;
        }
        onComplete();
      };

      if (!loaded) {
        return <div className="gfc-body" style={{ display: 'flex', justifyContent: 'center', paddingTop: 60 }}><div className="gfc-spin" /></div>;
      }

      const k = steps[step].key;
      return (
        <div className="gfc-body">
          <div className="step">Enrollment · {steps[step].label}</div>
          <div className="progress"><i style={{ width: pct + '%' }} /></div>
          <div style={{ fontSize: 11, color: 'var(--mut)', marginBottom: 6 }}>Step {step + 1} of {steps.length}</div>

          {k === 'path' && (
            <React.Fragment>
              <h2 className="disp">What kind of care?</h2>
              <p className="sub">This sets which consents and details we ask for.</p>
              <Pills label="Service line" value={serviceLine}
                onChange={changeServiceLine}
                options={[{ value: 'PHC', label: 'Private Home Care' }, { value: 'IHPC', label: 'In-Home Primary Care' }, { value: 'both', label: 'Both' }]} />
            </React.Fragment>
          )}

          {k === 'client' && (
            <React.Fragment>
              <h2 className="disp">Client details</h2>
              <p className="sub">We collect date of birth once and calculate age from it.</p>
              <div className="grid2">
                <TextField label="Client first name" value={form.clientFirst} onChange={v => set('clientFirst', v)} />
                <TextField label="Client last name" value={form.clientLast} onChange={v => set('clientLast', v)} />
              </div>
              <TextField label="Preferred name / nickname" value={form.preferredName} onChange={v => set('preferredName', v)} placeholder="What we should call them" />
              <TextField label="Date of birth" type="date" value={form.dob} onChange={v => set('dob', v)} />
              {form.dob && <div className="hint" style={{ fontSize: 11.5, color: 'var(--mut)', marginTop: -8, marginBottom: 8 }}>Age {ageFromDob(form.dob)} (calculated)</div>}
              <SelectField label="Gender" value={form.gender} onChange={v => set('gender', v)} options={IO.gender} />
              <TextField label="Primary language" value={form.primaryLanguage} onChange={v => set('primaryLanguage', v)} placeholder="e.g. English" />
              <TextField label="Home phone" type="tel" value={form.phone} onChange={v => set('phone', v)} />
              <TextField label="Home address" value={form.addressLine1} onChange={v => set('addressLine1', v)} placeholder="Street, city, GA, ZIP" />
              <SelectField label="Lives with" value={form.livesWith} onChange={v => set('livesWith', v)} options={IO.livesWith} />
            </React.Fragment>
          )}

          {k === 'contacts' && (
            <React.Fragment>
              <h2 className="disp">Contacts &amp; authority</h2>
              <p className="lbl" style={{ marginTop: 8 }}>About you (form submitter)</p>
              <div className="grid2">
                <TextField label="First name" value={form.submitter.first} onChange={v => setNested('submitter', 'first', v)} />
                <TextField label="Last name" value={form.submitter.last} onChange={v => setNested('submitter', 'last', v)} />
              </div>
              <TextField label="Email address" type="email" value={form.submitter.email} onChange={v => setNested('submitter', 'email', v)} />
              <TextField label="Phone number" type="tel" value={form.submitter.phone} onChange={v => setNested('submitter', 'phone', v)} />
              <p className="lbl">Primary family contact</p>
              <TextField label="Full name" value={form.primaryContact.name} onChange={v => setNested('primaryContact', 'name', v)} />
