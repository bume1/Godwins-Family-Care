<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Godwins Family Care — Payroll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.1.0/dist/tabler-icons.min.css">
  <script src="/gfc-time.js"></script>
  <script>window.GFC_TIME && window.GFC_TIME.installDefaultTimeZone();</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <script>
    // The clinical workspace's palette, so a claim reads the same here as the
    // visit it came from.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#033D50', 50: '#e8f0f4', 100: '#c5d9e3', 500: '#033D50', 600: '#02334a', 700: '#022A38' },
            accent: '#C9A44A',
            cream: '#FAF7F2', creamdeep: '#efe9db',
            stone: { 50: '#FCFAF6', 100: '#F1ECE2', 200: '#E8E0D2', 300: '#D9CFBE', 400: '#8E9BA1',
              500: '#5b6b73', 600: '#4a5a62', 700: '#34444c', 800: '#1a2a32', 900: '#11202a' }
          },
          fontFamily: { serif: ['"Cormorant Garamond"', 'Georgia', 'serif'], sans: ['"DM Sans"', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="icon" type="image/png" href="/brand/logo-mark-color-transparent.png">
  <style>
    /* The Billing module (owner, 2026-10-15; the claims workspace 2026-11-04).
       Its own page, because billing covers both medical visits and home care
       and the person working claims needs none of the clinical chart. The
       classes below are the clinical workspace's, so the shared claim view
       (/components/claim-shared.jsx) looks the same on both pages. */
    :root { --navy:#033D50; --navy2:#0a5066; --navyd:#022A38; --goldd:#C9A44A; --gold:#F5CD85; --gold-ink:#9A7430;
      --cream:#FAF7F2; --wash:#F6EFE2; --edge:#ECE4D6; --edge2:#E1D7C5; --ink:#1a2a32; --mut:#5b6b73; --danger:#B5462E;
      --shadow:0 1px 2px rgba(3,61,80,.04),0 6px 18px -12px rgba(3,61,80,.18); }
    * { font-family: 'DM Sans', system-ui, sans-serif; }
    body { background: var(--cream); color: var(--ink); }
    .card { background:#fff; border:1px solid var(--edge); border-radius:16px; box-shadow:var(--shadow); }
    .card-h { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:14px 18px; border-bottom:1px solid var(--edge); }
    .card-h h2 { font-family:'Cormorant Garamond',serif; font-size:20px; color:var(--navy); font-weight:600; line-height:1.15; }
    .lblu { font-size:10.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--gold-ink); font-weight:700; }
    .inp { width:100%; border:1px solid var(--edge2); border-radius:10px; padding:8px 11px; font-size:13.5px; background:#fff; color:var(--ink); }
    .inp:focus { outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(3,61,80,.10); }
    .btn { display:inline-flex; align-items:center; gap:6px; border-radius:10px; padding:8px 15px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid var(--navy); background:var(--navy); color:#fff; text-decoration:none; }
    .btn:hover:not(:disabled) { background:var(--navy2); }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .btn.gold { background:#A9853A; border-color:#A9853A; color:#fff; }
    .btn.gold:hover:not(:disabled) { background:var(--gold-ink); }
    .btn.ghost { background:#fff; color:var(--navy); border-color:var(--edge2); }
    .btn.ghost:hover:not(:disabled) { background:var(--wash); }
    .chip { display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:2px 10px; font-size:11px; font-weight:600; white-space:nowrap; }
    .tabbtn { padding:10px 14px; font-size:14px; font-weight:600; color:rgba(255,255,255,.75); border-bottom:2.5px solid transparent; cursor:pointer; white-space:nowrap; background:none; border-top:0; border-left:0; border-right:0; }
    .tabbtn:hover { color:#fff; }
    .tabbtn.on { color:var(--gold); border-color:var(--gold); }
    .cw-row { transition:background .12s; }
    .cw-row:hover { background:#FCFAF6; }
    .cw-row.on { background:var(--wash); box-shadow:inset 3px 0 0 var(--goldd); }
    .fmt { font-size:13px; line-height:1.5; color:#1f2937; }
    .fmt ul { list-style:disc; padding-left:1.25rem; margin:2px 0; }
    .fmt ol { list-style:decimal; padding-left:1.4rem; margin:2px 0; }
    .fmt h3 { font-size:14px; font-weight:700; color:#033D50; margin:4px 0 2px; }
    .fmt strong { font-weight:700; } .fmt em { font-style:italic; } .fmt u { text-decoration:underline; }
    .sigblock { border:2px solid #033D50; border-radius:10px; padding:10px 12px; background:#fff; }
  </style>
  <script src="/session-guard.js"></script>
</head>
<body>
  <div id="root"></div>

<script type="text/babel">
// ============================================================================
// /payroll — the owner's payroll screen (spec v2, 2026-11-08). Super Admin
// only: every route it calls is requireAdmin. Runs (draft, approve, pay),
// people (pay setup, I-9 Section 2, reveal a number), contractor invoices,
// taxes (deposits, filings, quarter and year-end figures), tax tables
// (approve staged ones), QuickBooks, and settings. The server decides every
// number; this page draws it.
// ============================================================================
const { useState, useEffect, useCallback } = React;
const getToken = () => localStorage.getItem('admin_token') || localStorage.getItem('unified_token') || localStorage.getItem('portal_token');
const call = async (path, opts = {}) => {
  const res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${getToken()}`, ...(opts.headers || {}) } });
  let data = null;
  try { data = await res.json(); } catch (e) { /* empty */ }
  if (!res.ok) { const err = new Error((data && data.error) || `Request failed (${res.status})`); err.code = data && data.code; err.status = res.status; err.data = data; throw err; }
  return data;
};
const post = (p, b) => call(p, { method: 'POST', body: JSON.stringify(b || {}) });
const put = (p, b) => call(p, { method: 'PUT', body: JSON.stringify(b || {}) });
const enc = encodeURIComponent;
const usd = (c) => (c === null || c === undefined ? '—' : `$${(Number(c) / 100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',')}`);
const day = (ymd) => (ymd ? new Date(`${ymd}T12:00:00Z`).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'America/New_York' }) : '');
const hrs = (m) => (m ? (m / 60).toFixed(2) : '0.00');

const Card = ({ title, right, children }) => (
  <div className="card mb-4"><div className="card-h"><h2>{title}</h2>{right}</div><div className="p-4 text-[13.5px]">{children}</div></div>
);
const Err = ({ e }) => (e ? <div className="rounded-lg border border-red-200 bg-red-50 text-red-800 p-3 mb-3 text-[13px]">{e}</div> : null);
const Ok = ({ m }) => (m ? <div className="rounded-lg border border-emerald-200 bg-emerald-50 text-emerald-800 p-3 mb-3 text-[13px]">{m}</div> : null);
const Warn = ({ children }) => <div className="rounded-lg border border-amber-200 bg-amber-50 text-amber-900 p-3 mb-3 text-[13px]">{children}</div>;

// ---- Runs --------------------------------------------------------------------
// State names from the server (one list). Georgia first, then the rest A to Z.
let STATE_NAMES = {};
const stName = (c) => STATE_NAMES[c] || c;
const statesGaFirst = () => ['GA', ...Object.keys(STATE_NAMES).filter(c => c !== 'GA').sort((a, b) => stName(a).localeCompare(stName(b)))];
const STATUS_CHIP = { draft: 'bg-stone-100 text-stone-600', approved: 'bg-amber-50 text-amber-800', paid: 'bg-emerald-50 text-emerald-700' };
const RunDetail = ({ id, onBack, reload }) => {
  const [run, setRun] = useState(null); const [sheet, setSheet] = useState(null);
  const [err, setErr] = useState(''); const [msg, setMsg] = useState(''); const [busy, setBusy] = useState(false);
  const [adj, setAdj] = useState({ userId: '', type: 'bonus', amount: '', note: '' });
  const load = useCallback(() => call(`/api/payroll/admin/runs/${enc(id)}`).then(r => {
    setRun(r.run);
    if (r.run.status !== 'draft') call(`/api/payroll/admin/runs/${enc(id)}/payment-sheet`).then(setSheet).catch(e => setErr(e.message));
  }).catch(e => setErr(e.message)), [id]);
  useEffect(() => { load(); }, [load]);
  const act = async (fn, ok) => { setBusy(true); setErr(''); setMsg(''); try { await fn(); setMsg(ok); await load(); reload(); } catch (e) { setErr(e.message + (e.data && e.data.blocked ? ` ${e.data.blocked.map(b => `${b.name}: ${b.missing.join(', ')}`).join('; ')}` : '')); } setBusy(false); };
  if (!run) return err ? <Err e={err} /> : <p>Loading…</p>;
  const t = run.totals;
  return (
    <div>
      <button className="btn ghost mb-3" onClick={onBack}>Back to Runs</button>
      <Card title={`Pay period ${day(run.period.start)} to ${day(run.period.end)}`} right={<span className={`chip ${STATUS_CHIP[run.status]}`}>{run.status.toUpperCase()}</span>}>
        <Err e={err} /><Ok m={msg} />
        <p className="mb-3">Pay date <b>{day(run.period.payDate)}</b>. {run.status === 'draft' ? 'This is a draft: it is rebuilt from the hours each time, and nothing is paid until you approve it.' : `Approved by ${run.approvedBy}.`}</p>
        {run.blocked && run.blocked.length > 0 && <Warn><b>Missing paperwork, so these people cannot be paid yet:</b><ul className="list-disc pl-5">{run.blocked.map(b => <li key={b.userId}>{b.name}: {b.missing.join(', ')}</li>)}</ul></Warn>}
        {run.sutaRateMissing && <Warn>Set GFC's Georgia unemployment rate under Settings before approving.</Warn>}
        {(run.stateRatesMissing || []).length > 0 && <Warn>Set GFC's unemployment rate for {run.stateRatesMissing.map(stName).join(', ')} under Settings before approving.</Warn>}
        <div className="grid sm:grid-cols-4 gap-3 mb-4">
          {[['Gross pay', t.grossCents], ['Net pay', t.netCents], ['Taxes withheld', t.federalCents + t.socialSecurityCents + t.medicareCents + t.georgiaCents + (t.stateWithholdingCents || 0)], ['Cash needed', t.cashNeededCents]].map(([k, v]) => (
            <div key={k} className="rounded-xl border border-stone-200 p-3"><div className="lblu">{k}</div><div className="text-[20px] font-semibold text-primary">{usd(v)}</div></div>
          ))}
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-[13px]">
            <thead><tr className="text-left text-stone-500"><th className="py-1">Person</th><th>Hours</th><th>OT hrs</th><th className="text-right">Gross</th><th className="text-right">Federal</th><th className="text-right">SS</th><th className="text-right">Medicare</th><th className="text-right">State</th><th className="text-right">Net</th></tr></thead>
            <tbody>{run.workers.map(w => {
              const reg = w.earnings.find(e => e.code === 'regular'), ot = w.earnings.find(e => e.code === 'overtime');
              return (
                <tr key={w.userId} className="border-t border-stone-100">
                  <td className="py-1.5"><b>{w.name}</b>{w.missing.length > 0 && <div className="text-red-700 text-[12px]">Missing: {w.missing.join(', ')}</div>}</td>
                  <td>{reg ? hrs(reg.minutes) : '—'}</td><td>{ot ? hrs(ot.minutes) : ''}</td>
                  {w.pay ? <><td className="text-right">{usd(w.pay.grossCents)}</td><td className="text-right">{usd(w.pay.taxes.federal)}</td><td className="text-right">{usd(w.pay.taxes.socialSecurity)}</td><td className="text-right">{usd(w.pay.taxes.medicare)}</td><td className="text-right">{usd((w.pay.taxes.georgia || 0) + (w.pay.taxes.state || 0))} <span className="text-stone-400">{w.pay.workState || w.workState || 'GA'}</span></td><td className="text-right"><b>{usd(w.pay.netCents)}</b></td></>
                    : <td colSpan="6" className="text-stone-500">Not figured until the W-4 and their state form are on file.</td>}
                </tr>
              );
            })}</tbody>
          </table>
        </div>
        <div className="mt-3"><button className="btn ghost" onClick={() => download(`/api/payroll/admin/runs/${enc(id)}/register.csv`, `payroll-register-${run.period.payDate}.csv`, setErr)}>Download Register CSV</button></div>
        <p className="text-[12.5px] text-stone-500 mt-3">Employer taxes: Social Security {usd(t.employerSocialSecurityCents)}, Medicare {usd(t.employerMedicareCents)}, FUTA {usd(t.futaCents)}, Georgia unemployment {usd(t.gaSutaCents)}{Object.entries(t.byState || {}).map(([st, b]) => `, ${stName(st)} unemployment ${usd(b.sutaCents)}`).join('')}.</p>
        {run.skippedItems && run.skippedItems.length > 0 && <Warn><b>Not paid, needs fixing:</b><ul className="list-disc pl-5">{run.skippedItems.map((s, i) => <li key={i}>{s.reason} ({s.ref})</li>)}</ul></Warn>}
        {run.status === 'draft' && (
          <div className="mt-4 grid gap-3">
            <div className="flex flex-wrap gap-2 items-end">
              <select className="inp !w-48" value={adj.userId} onChange={e => setAdj({ ...adj, userId: e.target.value })}><option value="">Person…</option>{run.workers.map(w => <option key={w.userId} value={w.userId}>{w.name}</option>)}</select>
              <select className="inp !w-44" value={adj.type} onChange={e => setAdj({ ...adj, type: e.target.value })}><option value="bonus">Bonus</option><option value="reimbursement">Reimbursement (not taxed)</option><option value="correction">Correction</option></select>
              <input className="inp !w-28" placeholder="$" value={adj.amount} onChange={e => setAdj({ ...adj, amount: e.target.value })} />
              <input className="inp !w-56" placeholder="What it is for" value={adj.note} onChange={e => setAdj({ ...adj, note: e.target.value })} />
              <button className="btn ghost" disabled={busy || !adj.userId || !adj.amount} onClick={() => act(() => post(`/api/payroll/admin/runs/${enc(id)}/adjustments`, adj), 'Added.')}>Add Line</button>
            </div>
            <div className="flex gap-2">
              <button className="btn ghost" disabled={busy} onClick={() => act(() => post('/api/payroll/admin/runs', { periodStart: run.period.start, schedule: run.schedule || (run.period && run.period.schedule) || 'staff' }), 'Rebuilt from the latest hours.')}>Rebuild From Hours</button>
              {SUPER ? <button className="btn gold" disabled={busy} onClick={() => window.confirm('Approve this payroll? Its hours lock and pay stubs go out.') && act(() => post(`/api/payroll/admin/runs/${enc(id)}/approve`), 'Approved. Pay stubs are out.')}>Approve Payroll</button>
                : <span className="text-[12.5px] text-stone-500 self-center">Ready? Tell the Super Admin to approve it.</span>}
            </div>
          </div>
        )}
      </Card>
      {sheet && (
        <Card title="Payment Sheet (PNC)" right={<span className="text-[12.5px] text-stone-500">Send by {day(sheet.sendBy)}</span>}>
          <p className="mb-3 text-stone-500">Send each payment in the PNC app, then paste its confirmation number here. The run is paid when everyone has one.</p>
          {sheet.sheet.map(s => <PaymentRow key={s.userId} runId={id} s={s} onDone={load} />)}
        </Card>
      )}
    </div>
  );
};
const Copy = ({ text }) => <button className="btn ghost !py-0.5 !px-2 !text-[11px]" onClick={() => navigator.clipboard && navigator.clipboard.writeText(String(text))}>Copy</button>;
const PaymentRow = ({ runId, s, onDone }) => {
  const [conf, setConf] = useState(''); const [full, setFull] = useState({}); const [err, setErr] = useState('');
  const reveal = (field) => post(`/api/payroll/admin/people/${enc(s.userId)}/reveal`, { field }).then(r => setFull(f => ({ ...f, [field]: r.value }))).catch(e => setErr(e.message));
  return (
    <div className="flex flex-wrap justify-between gap-3 py-2 border-b border-stone-100">
      <div>
        <b className="text-primary">{s.name}</b> · <b>{s.net}</b> <Copy text={(s.netCents / 100).toFixed(2)} />
        <div className="text-[12.5px] text-stone-500">
          {s.method === 'direct_deposit' ? <>
            {s.bankName} {s.accountType} · routing {full.routing || `••••${s.routingLast4}`} {full.routing ? <Copy text={full.routing} /> : SUPER && <button className="underline" onClick={() => reveal('routing')}>show</button>}
            {' '}· account {full.account || `••••${s.accountLast4}`} {full.account ? <Copy text={full.account} /> : SUPER && <button className="underline" onClick={() => reveal('account')}>show</button>}
          </> : s.method === 'check' ? 'Paper check' : s.method === 'wise' ? 'Wise' : 'No pay method'}
        </div>
        {err && <div className="text-red-700 text-[12px]">{err}</div>}
      </div>
      {s.paid ? <span className="chip bg-emerald-50 text-emerald-700">PAID · {s.paid.confirmation}</span> : !SUPER ? <span className="text-[12.5px] text-stone-500">Not paid yet</span> : (
        <div className="flex gap-2"><input className="inp !w-44" placeholder="Confirmation #" value={conf} onChange={e => setConf(e.target.value)} />
          <button className="btn" disabled={!conf.trim()} onClick={() => post(`/api/payroll/admin/runs/${enc(runId)}/payments/${enc(s.userId)}`, { confirmation: conf }).then(onDone).catch(e => setErr(e.message))}>Mark Paid</button></div>
      )}
    </div>
  );
};
// Past pay dates from Gusto: the Payroll Journal CSV becomes paid runs and
// pay stubs in each person's My GFC. Preview first; nothing is kept of the file.
const GustoImport = ({ reload }) => {
  const [csv, setCsv] = useState(''); const [name, setName] = useState('');
  const [prev, setPrev] = useState(null); const [err, setErr] = useState(''); const [msg, setMsg] = useState(''); const [busy, setBusy] = useState(false);
  const pick = (e) => {
    const f = e.target.files && e.target.files[0];
    setPrev(null); setMsg(''); setErr('');
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { setCsv(String(rd.result || '')); setName(f.name); };
    rd.onerror = () => setErr('That file could not be read.');
    rd.readAsText(f);
  };
  const go = (commit) => {
    setBusy(true); setErr('');
    post('/api/payroll/admin/import/gusto', { csv, commit })
      .then(r => { if (commit) { setMsg(`Imported ${r.stubs} pay stub(s) across ${r.payDates} pay date(s).${r.pdfFailed ? ` ${r.pdfFailed} PDF(s) could not be filed in Drive; the stubs still show.` : ''}`); setPrev(null); setCsv(''); reload(); } else setPrev(r); })
      .catch(e => setErr(e.message)).finally(() => setBusy(false));
  };
  return (
    <Card title="Import Past Pay From Gusto">
      <Err e={err} /><Ok m={msg} />
      <p className="text-stone-500 mb-3">In Gusto: Reports → Payroll Journal → this year → export CSV. Each matched person gets their past pay stubs in My GFC, and their year-to-date counts toward this year's limits and W-2. No one is emailed.</p>
      <input type="file" accept=".csv,text/csv" onChange={pick} />
      {csv && !prev && <button className="btn ml-2" disabled={busy} onClick={() => go(false)}>Preview {name}</button>}
      {prev && (
        <div className="mt-3">
          <div><b>{prev.stubs}</b> pay stub(s) across <b>{prev.payDates}</b> pay date(s), {usd(prev.grossCents)} gross.{prev.replacing ? ` Replaces ${prev.replacing} pay date(s) imported before.` : ''}</div>
          {prev.matched.map(m => <div key={m.userId} className="text-[13px]">· {m.name}: {m.payDates} pay date(s), {usd(m.grossCents)}</div>)}
          {prev.unmatched.length > 0 && <Warn>Not imported (no matching account): {prev.unmatched.map(u => `${u.name} (${u.reason})`).join('; ')}</Warn>}
          {prev.nonGeorgia.length > 0 && <Warn>{prev.nonGeorgia.map(n => `${n.name} works in ${n.states.join(', ')}`).join('; ')}. Their state is recorded; they are paid in the app once that state's tax table is approved and GFC's unemployment rate there is set in Settings.</Warn>}
          {prev.warnings.length > 0 && <Warn>{prev.warnings.map((w, i) => <div key={i}>{w}</div>)}</Warn>}
          <button className="btn mt-2" disabled={busy || !prev.stubs} onClick={() => go(true)}>Import</button>
          <button className="btn ghost mt-2 ml-2" onClick={() => { setPrev(null); setCsv(''); }}>Cancel</button>
        </div>
      )}
    </Card>
  );
};

// Hours for any range, the same file Scheduling used to export (moved here,
// 2026-11-09): every clock-in, open shifts included, with edit details and
// the pay period. Nothing clinical.
const HoursExport = () => {
  const [from, setFrom] = useState(''); const [to, setTo] = useState(''); const [err, setErr] = useState('');
  return (
    <Card title="Hours Export">
      <Err e={err} />
      <div className="flex flex-wrap gap-2 items-end">
        <div><div className="lblu mb-1">From</div><input type="date" className="inp" value={from} onChange={e => setFrom(e.target.value)} /></div>
        <div><div className="lblu mb-1">To</div><input type="date" className="inp" value={to} onChange={e => setTo(e.target.value)} /></div>
        <button className="btn ghost" disabled={!from || !to} onClick={() => { setErr(''); download(`/api/scheduling/payroll.csv?from=${from}&to=${to}`, `payroll-hours-${from}-to-${to}.csv`, setErr); }}>Export Hours CSV</button>
      </div>
    </Card>
  );
};

const Runs = ({ data, reload }) => {
  const [open, setOpen] = useState(null); const [err, setErr] = useState(''); const [busy, setBusy] = useState(false);
  const scheds = data.schedules || [];
  const [schedule, setSchedule] = useState(scheds[0] ? scheds[0].key : 'staff');
  const cur = scheds.find(x => x.key === schedule);
  const [start, setStart] = useState(cur ? cur.current.start : (data.nextPeriod ? data.nextPeriod.start : ''));
  if (open) return <RunDetail id={open} onBack={() => setOpen(null)} reload={reload} />;
  const schedLabel = (k) => { const x = scheds.find(y => y.key === k); return x ? `${x.label} · ${x.frequency === 'weekly' ? 'weekly' : 'every two weeks'}` : ''; };
  return (
    <>
    {SUPER && <GustoImport reload={reload} />}
    <HoursExport />
    <Card title="Payroll Runs">
      <Err e={err} />

// The figures come from approved runs and paid contractor invoices. Release
// freezes them, puts each form in that person's My GFC, and emails a link to
// everyone who agreed to electronic delivery. Everyone else is printed and
// mailed from here.
const download = async (url, name, setErr) => {
  const r = await fetch(url, { headers: { Authorization: `Bearer ${getToken()}` } });
  if (!r.ok) { const b = await r.json().catch(() => ({})); setErr(b.error || 'That file could not be built.'); return; }
  const href = URL.createObjectURL(await r.blob());
  const a = document.createElement('a'); a.href = href; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(href), 60000);
};

    setBusy(true);
    try { const r = await post(`/api/payroll/admin/year-end/${enc(yr)}/release`); setMsg(`Released. ${r.emailed} emailed; ${r.paper.length} to print and mail.`); load(); } catch (e) { setErr(e.message); }

  };
  const mailed = (x, form) => post(`/api/payroll/admin/year-end/${enc(yr)}/forms/${enc(x.userId)}/${form}/mailed`).then(load).catch(e => setErr(e.message));
  const formRow = (x, form, label, amount) => (
    <div key={`${form}${x.userId}`} className="flex flex-wrap justify-between gap-2 py-2 border-b border-stone-100">
      <span><b className="text-primary">{x.name}</b> <span className="text-stone-500 text-[12.5px]">{label} · {usd(amount)}{x.missing && x.missing.length ? ` · missing: ${x.missing.join(', ')}` : ''}</span></span>
      <span className="flex gap-2 items-center">
        {rel && <button className="btn ghost !py-1" onClick={() => download(`/api/payroll/admin/year-end/${enc(yr)}/forms/${enc(x.userId)}/${form}.pdf`, `${yr}_${label}_${x.name}.pdf`, setErr)}>Print</button>}
        {rel && (x.eDelivery ? <span className="chip bg-emerald-50 text-emerald-700">{x.openedAt ? 'OPENED' : 'EMAILED'}</span>

  return (
    <>
      <Card title="Year End: W-2 and 1099-NEC" right={<span className="flex gap-2"><input className="inp !w-24" value={yr} onChange={e => setYr(e.target.value)} /></span>}>
        <Err e={err} /><Ok m={msg} />
        {ye && (
          <>
            {ye.employerMissing.length > 0 && <Warn>Before release: {ye.employerMissing.join(', ')}.</Warn>}
            {ye.gustoGrossCents > 0 && !rel && <div className="rounded-xl border border-stone-200 bg-stone-50 p-3 text-[13px] text-stone-700 mb-3">These figures include {usd(ye.gustoGrossCents)} paid through Gusto in {yr}. GFC files {yr}'s W-2s from the app (owner, 2026-11-09), so those wages belong here. Before releasing, make sure Gusto is not also set to file {yr} W-2s, or the wages are reported twice.</div>}
            {(ye.draftRuns > 0 || ye.unpaidRuns > 0) && <Warn>{ye.draftRuns} draft and {ye.unpaidRuns} unpaid run(s) with a {yr} pay date. Finish them first; their wages belong on these forms.</Warn>}
            <p className="text-stone-500 mb-3">Due to people by January 31; filed with SSA, the IRS and Georgia by the same date (the next business day when it falls on a weekend). 1099-NEC is for contractors paid {usd(ye.necThresholdCents)} or more{ye.necBelowThreshold ? `; ${ye.necBelowThreshold} paid less and get none` : ''}.</p>
            <div className="lblu mb-1">W-2 ({w2.length})</div>
            {w2.length === 0 && <p className="text-stone-500 mb-2">No wages paid in {yr}.</p>}
            {w2.map(x => formRow(x, 'w2', 'W-2', x.boxes.box1))}
            <div className="lblu mt-4 mb-1">1099-NEC ({nec.length})</div>
            {nec.length === 0 && <p className="text-stone-500 mb-2">No contractor reached the threshold.</p>}
            {nec.map(x => formRow(x, '1099-nec', '1099-NEC', x.boxes.box1a))}
            <div className="flex flex-wrap gap-2 mt-4">

              <button className="btn ghost" onClick={() => download(`/api/payroll/admin/year-end/${enc(yr)}?format=csv`, `gfc_year_end_${yr}.csv`, setErr)}>Summary (no SSNs)</button>
            </div>
          </>
        )}
      </Card>

        <Card title="Filing">

              <button className="btn ghost" disabled={!rel} onClick={() => download(`/api/payroll/admin/year-end/${enc(yr)}/filing-sheet.csv`, `gfc_${yr}_filing_sheet.csv`, setErr)}>Download Filing Sheet</button></div>
            <div className="rounded-xl border border-stone-200 p-3"><div className="lblu mb-1">Upload files</div>
              <p className="text-[13px] mb-2">{ye.layouts.efw2 ? 'SSA W-2 file (EFW2). Check it in AccuWage Online before you upload.' : `SSA has changed the W-2 file for ${yr} (overtime code TT), and that layout is not in the app yet. Use the filing sheet.`}</p>
              <button className="btn ghost" disabled={!rel || !ye.layouts.efw2} onClick={() => download(`/api/payroll/admin/year-end/${enc(yr)}/ssa-w2.txt`, `gfc_${yr}_ssa_w2.txt`, setErr)}>SSA W-2 File</button>
              <button className="btn ghost ml-2" disabled={!rel || !ye.layouts.irisNec} onClick={() => download(`/api/payroll/admin/year-end/${enc(yr)}/iris-1099-nec.csv`, `gfc_${yr}_iris_1099_nec.csv`, setErr)}>IRIS 1099-NEC CSV</button></div>
            <div className="rounded-xl border border-stone-200 p-3"><div className="lblu mb-1">Georgia G-1003</div>
              <div>W-2s: {ye.g1003.w2Count}</div><div>Georgia wages: {usd(ye.g1003.gaWagesCents)}</div><div><b>Georgia tax withheld: {usd(ye.g1003.gaWithheldCents)}</b></div>

          </div>
        </Card>
      )}
      {ye && <YearEndSettings ye={ye} onSaved={load} />}
    </>

};

// A new year's table: the figures pasted as JSON, in the same shape as the
// shipped ones (Show Figures on any table shows the shape). It is staged, and
// pays nothing until it is approved.
const StageTable = ({ reload }) => {
  const [open, setOpen] = useState(false); const [f, setF] = useState({ year: '', jurisdiction: 'federal', source: '', json: '' }); const [err, setErr] = useState('');
  if (!open) return <button className="btn ghost mb-3" onClick={() => setOpen(true)}>Stage a New Table</button>;
  const save = () => {
    let data; try { data = JSON.parse(f.json); } catch (e) { setErr('The figures are not valid JSON.'); return; }
    post('/api/payroll/admin/tax-tables', { year: Number(f.year), jurisdiction: f.jurisdiction, source: f.source, data }).then(() => { setOpen(false); reload(); }).catch(e => setErr(e.message));
  };
  return (
    <div className="border border-stone-200 rounded-xl p-3 mb-3 grid gap-2">
      <Err e={err} />
      <div className="flex flex-wrap gap-2"><input className="inp !w-24" placeholder="Year" value={f.year} onChange={e => setF({ ...f, year: e.target.value })} />
        <select className="inp !w-44" value={f.jurisdiction} onChange={e => setF({ ...f, jurisdiction: e.target.value })}><option value="federal">Federal</option>{statesGaFirst().map(c => <option key={c} value={c}>{stName(c)}</option>)}</select>
        <input className="inp" placeholder="Source (publication and date)" value={f.source} onChange={e => setF({ ...f, source: e.target.value })} /></div>
      <textarea className="inp font-mono !text-[12px]" rows={8} placeholder="Paste the figures, in the shape Show Figures displays" value={f.json} onChange={e => setF({ ...f, json: e.target.value })} />
      <div className="flex gap-2"><button className="btn" onClick={save}>Stage Table</button><button className="btn ghost" onClick={() => setOpen(false)}>Cancel</button></div>
    </div>
  );
};

        </div>

        {data && tab === 'tables' && <TaxTables data={data} reload={load} />}
        {data && tab === 'qbo' && <QuickBooks />}
        {data && tab === 'settings' && <Settings data={data} reload={load} />}
      </div>
    </>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
