        suicide: (latest && latest.levels.suicide) || '', homicide: (latest && latest.levels.homicide) || '',
        selfNeglect: (latest && latest.levels.selfNeglect) || '',
        protectiveFactors: '', meansRestriction: '', plan: ''
      }));
      const set = (k, v) => setF(p => ({ ...p, [k]: v }));
      // Whether a plan is needed is the SERVER's answer, read off the list it
      // served. Deciding it here would be a second clinical rule to keep in
      // step with the one that refuses the save.
      const needsPlan = (d.riskDomains || []).some(k => (d.riskNeedsPlan || []).includes(f[k]));
      return (
        <div className="card mb-4">
          <div className="card-h">
            <h2><i className="ti ti-shield-exclamation mr-1 text-accent" />Risk Assessment</h2>
            {latest
              ? <span className={`chip ${RISK_CHIP[highestOf(latest, d.riskDomains, d.riskLevels)] || 'bg-stone-100 text-stone-600'}`}>{highestOf(latest, d.riskDomains, d.riskLevels)}</span>
              : <span className={`chip ${d.riskRequired ? 'bg-amber-50 text-amber-800' : 'bg-stone-100 text-stone-500'}`}>{d.riskRequired ? 'Required to sign' : 'Not recorded'}</span>}
          </div>
          <div className="p-4 text-sm grid gap-2">
            {latest ? (
              <div className="text-xs text-stone-600">
                {(d.riskDomains || []).map(k => <span key={k} className="mr-3">{k}: <b>{latest.levels[k]}</b></span>)}
                <div className="text-[11px] text-stone-500 mt-0.5">{npiLabel(latest.by)} · {fmtTs(latest.at)}</div>
                {latest.plan && <div className="mt-1 whitespace-pre-wrap text-[13px]">{latest.plan}</div>}
              </div>
            ) : (
              <p className="text-xs text-stone-500">
                {d.riskRequired
                  ? 'This visit type cannot be signed until a risk assessment is recorded. Documenting the visit is not blocked.'
                  : 'Not required for this visit type. Record one anyway if the visit warrants it.'}
              </p>
            )}
            {/* Appended, never rewritten: risk changes inside one visit and
                overwriting would lose that the clinician escalated. */}
            {(d.riskHistory || []).length > 1 && (
              <details className="text-[11px] text-stone-500">
                <summary className="cursor-pointer">Earlier in this visit ({d.riskHistory.length - 1})</summary>
                {d.riskHistory.slice(1).map(r => (
                  <div key={r.id} className="mt-1">{highestOf(r, d.riskDomains, d.riskLevels)} · {npiLabel(r.by)} · {fmtTs(r.at)}</div>
                ))}
              </details>
            )}
            {!locked && !open && <button className="btn ghost !py-1 !px-2.5 text-xs w-fit" onClick={() => setOpen(true)}>{latest ? 'Update Risk' : 'Record Risk'}</button>}
            {!locked && open && (
              <div className="grid gap-3 border-t border-stone-100 pt-3">
                <div className="grid md:grid-cols-3 gap-2">
                  {(d.riskDomains || []).map(k => (
                    <Field key={k} label={k.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase())}>
                      <select className="inp" value={f[k]} onChange={e => set(k, e.target.value)}>
                        <option value="">— select —</option>
                        {(d.riskLevels || []).map(l => <option key={l} value={l}>{l}</option>)}
                      </select>
                    </Field>
                  ))}
                </div>
                <Field label="Protective factors"><textarea className="inp" rows={2} value={f.protectiveFactors} onChange={e => set('protectiveFactors', e.target.value)} /></Field>
                <Field label="Means restriction"><textarea className="inp" rows={2} value={f.meansRestriction} onChange={e => set('meansRestriction', e.target.value)} /></Field>
                <Field label={needsPlan ? 'Plan — required at this level of risk' : 'Plan'}>
                  <textarea className="inp" rows={3} value={f.plan} onChange={e => set('plan', e.target.value)} />
                </Field>
                {needsPlan && <p className="text-[11px] text-amber-700"><i className="ti ti-alert-triangle mr-1" />An assessment with no plan records that the risk was seen, not that it was handled.</p>}
                <div className="flex gap-2">
                  <button className="btn w-fit" disabled={busy} onClick={() => onSave(f).then(() => setOpen(false)).catch(() => {})}>
                    {busy ? 'Recording…' : 'Save Assessment'}
                  </button>
                  <button className="btn ghost w-fit" disabled={busy} onClick={() => setOpen(false)}>Cancel</button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };
    // The worst of the domains, ranked by the order the SERVER SERVED THE
    // LEVELS IN. A local copy of that order is a second answer to "which risk
    // is worse", and it goes stale the day a level is added — the same reason
    // the levels themselves are not listed here.
    const highestOf = (a, domains, levels) => {
      if (!a || !a.levels) return null;
      const rank = (v) => (levels || []).indexOf(v);
      return (domains || []).map(k => a.levels[k]).filter(Boolean)
        .sort((x, y) => rank(y) - rank(x))[0] || null;
    };

    // A follow-up (or older) note being edited on its encounter. The H&P has its
    // own, larger form (HpTab) and is embedded the same way.
    const FollowUpNoteEditor = ({ patient, euuid, noteSections, sectionsOnly, typeLabel, onSign, onChanged, codingDirty, onNoteState }) => {
      const sn = useSharedNote({ patientId: patient.id, encounterUuid: euuid });
      const blank = { chiefConcern: '', subjective: '', objective: '', assessment: '', plan: '', sections: {},
        vitals: { bpSys: '', bpDia: '', hr: '', temp: '', rr: '', spo2: '', weight: '', height: '', pain: '' } };
      const [f, setF] = useState(blank);
      const [kind, setKind] = useState('followup');
      const [visit, setVisit] = useState(null);
      const [busy, setBusy] = useState(false); const [msg, setMsg] = useState(null);
      const [showCarry, setShowCarry] = useState(false);
      const [seeded, setSeeded] = useState(false);
      const applyNote = (n) => {
        if (!n) return;
        setF(prev => ({ ...prev, chiefConcern: n.chiefConcern || '', subjective: n.subjective || '', objective: n.objective || '',
          assessment: n.assessment || '', plan: n.plan || '', sections: { ...(n.sections || {}) }, vitals: { ...prev.vitals, ...(n.vitals || {}) } }));
        if (n.kind) setKind(n.kind);
        if (n.visit) setVisit(n.visit);
      };
      useEffect(() => {
        sn.load().then(r => { if (r) { applyNote(r.note); setSeeded(!!r.seededFromOpenEmr); } markSaved(); }).catch(e => setMsg({ ok: false, text: e.message }));
      }, [patient.id, euuid]);
      const toNote = () => ({ kind, chiefConcern: f.chiefConcern, subjective: f.subjective, objective: f.objective,
        assessment: f.assessment, plan: f.plan, sections: f.sections, vitals: f.vitals, ...(visit ? { visit } : {}) });
      // Typed and not yet saved — see useNoteDirty.
      const markSaved = useNoteDirty(f, onNoteState, () => save());
      const save = (opts) => {
        setBusy('draft'); setMsg(null);
        return sn.save(toNote(), opts)
          .then(r => { markSaved(); setMsg({ ok: true, text: `${r.message}${(r.warnings || []).length ? ` — ${r.warnings.join(' · ')}` : ''}. Saved as a draft — NOT signed yet.` }); setSeeded(false); onChanged && onChanged(); return r; })
          .catch(e => { setMsg({ ok: false, text: e.message }); throw e; })
          .finally(() => setBusy(false));
      };
      const discard = () => {
        const reason = window.prompt('Why is this encounter being deleted? The reason is kept on record. It will be removed from the chart and voided in OpenEMR, and it will never bill.');
        if (!reason || reason.trim().length < 3) return;
        setBusy('discard');
        api.voidNote(patient.id, euuid, reason.trim()).then(r => { setMsg({ ok: true, text: r.message }); onChanged && onChanged(); })
          .catch(e => setMsg({ ok: false, text: e.message })).finally(() => setBusy(false));
      };
      const pickCarry = (r) => {
        const c = r.content || {};
        applyNote({ ...c, vitals: {}, kind });
        sn.applyCarry(r); setShowCarry(false);
        setMsg({ ok: true, text: `Copied from the note of ${r.fromDate || 'an earlier visit'}. Edit or confirm each marked section before signing.` });
      };
      const setV = (k, v) => setF(p => ({ ...p, vitals: { ...p.vitals, [k]: v } }));
      const carried = (k) => sn.pending.includes(k);
      return (
        <div>
          <div className="card p-3 mb-3 text-xs text-stone-600 flex flex-wrap items-center gap-2">
            <span className="chip bg-amber-50 text-amber-800">DRAFT · v{sn.meta.version}</span>
            {seeded ? 'This note was written before notes could be edited. It is loaded from OpenEMR — saving makes it a shared draft.'
              : sn.meta.narrativeSyncError
                ? <span className="text-red-700">Saved in the app, but OpenEMR did not take the latest version ({sn.meta.narrativeSyncError}). Save draft again to retry.</span>
                : 'Saved to the app and OpenEMR. Anyone writing on this chart can keep editing it until it is signed.'}
          </div>
          {sn.conflict && (
            <NoteConflict conflict={sn.conflict}
              onUseTheirs={() => { sn.setConflict(null); sn.load().then(r => r && applyNote(r.note)); }}
              onKeepMine={() => save({ overwrite: sn.conflict }).catch(() => {})} />
          )}
          {!showCarry && <button className="btn ghost !py-1.5 text-xs mb-3" onClick={() => setShowCarry(true)}><i className="ti ti-copy" />Copy Previous Note</button>}
          {showCarry && <CarryForwardPicker patientId={patient.id} excludeEuuid={euuid} onPick={pickCarry} onClose={() => setShowCarry(false)} />}
          {/* One continuous note in the visit type's order — see noteLayout. */}
          <div className="card mb-4">
            <div className="card-h"><h2>Note</h2></div>
            <div className="p-4 grid gap-3">
              <DictationHint />
              {noteLayout({
                sections: noteSections,
                // A phone call has no vitals or exam to record (owner, 2026-10-02).
                // Server-answered, with the visit as typed here as a fallback.
                fixedBlocks: (sectionsOnly || (visit && visit.modality === 'phone'))
                  ? []
                  : SOAP_BLOCKS,
                extraBlocks: [], extraLabel: 'More of this note',
                stored: f.sections, labelFor: sectionLabelFor, typeLabel
              }).map((item, i) => (item.kind === 'heading'
                ? <NoteHeading key={`h-${i}`} label={item.label} />
                : item.kind === 'pointer'
                  ? <CardPointer key={`p-${item.section.key}`} section={item.section} card={item.card} />
                : item.kind === 'section'
                  ? renderOwnSection(item.section, f.sections, (k, v) => setF(prev => ({ ...prev, sections: { ...prev.sections, [k]: v } })), sn.pending, sn.confirm)
                  : <div key={`b-${item.block}`}>{soapBlock({ block: item.block, label: item.label, patientReported: item.patientReported, f,
                      setText: (k, v) => setF(p => ({ ...p, [k]: v })), setV, carried, onConfirm: sn.confirm })}</div>))}
            </div>
          </div>
          {msg && <p className={`text-sm mb-3 ${msg.ok ? 'text-emerald-700' : 'text-red-600'}`}>{msg.text}</p>}
          <div className="card p-3 mb-3">
            <div className="flex flex-wrap items-center gap-2">
              <button className="btn" disabled={!!busy} onClick={() => save().catch(() => {})}><i className="ti ti-device-floppy" />{busy === 'draft' ? 'Saving…' : 'Save Draft'}</button>
              {/* Signing reads the SAVED diagnoses and then locks them, so unsaved
                  coding on this screen would be signed away without a word. */}
              <button className="btn gold" disabled={!!busy || codingDirty || !onSign} title={codingDirty ? 'Save your diagnoses and coding first' : undefined} onClick={() => save().then(() => onSign && onSign(euuid)).catch(() => {})}><i className="ti ti-writing-sign" />Sign &amp; Submit</button>
              {codingDirty && <span className="text-[11px] text-amber-700">Save your diagnoses and coding below before signing.</span>}
              <button className="btn ghost text-red-600" disabled={!!busy} onClick={discard}>{busy === 'discard' ? 'Deleting…' : 'Delete Encounter'}</button>
              <Hint className="w-full"><b>Save Draft</b> saves to the app and OpenEMR together, stamped with your name and the time — it does <b>not</b> sign. <b>Sign &amp; Submit</b> saves, then opens the Sign card where you attest and sign.</Hint>
            </div>
            <NoteHistory revisions={sn.meta.revisions} />
          </div>
        </div>
      );
    };

    // A signed (or discarded) note, formatted, with its signature bold at the
    // bottom. Read-only: after signing, changes are addenda.
    // WHAT THIS VISIT STILL NEEDS ON FILE.
    //
    // An appointment type can declare the documents a visit of that kind
    // requires — a face sheet, a discharge summary, a referral letter — and
    // `GET .../encounters/:euuid/documents` has answered with the full list,
    // what is filed and what is outstanding since the per-visit document work
    // shipped. Nothing on any screen called it, so the requirement was
    // recorded and invisible: a clinician finished a visit with no way to see
    // that a document was still owed, and the office found out later or not
    // at all.
    //
    // Read-only here on purpose. Filing a document is its own route with its
    // own gate; this card says what is missing and where it stands. Every
    // label, hint and kind comes from the SERVER — the page names no document
    // kind of its own, so it cannot drift from the catalog that decides them.
    const VisitDocumentsCard = ({ clientId, euuid }) => {
      const [d, setD] = useState(null);     // null = loading, false = failed
      useEffect(() => {
        let dead = false;
        setD(null);
        api.visitDocuments(clientId, euuid)
          .then(r => { if (!dead) setD(r); })
          .catch(() => { if (!dead) setD(false); });
        return () => { dead = true; };
      }, [clientId, euuid]);
      return (
        <div className="card">
          <div className="card-h"><h2>Visit Documents</h2></div>
          <div className="p-4 text-sm">
            {d === null && <p className="text-xs text-stone-400">Reading…</p>}
            {/* A failed read must not read as "nothing is owed". */}
            {d === false && <p className="text-xs text-red-600">The document list could not be read. That is not the same as this visit needing nothing.</p>}
            {d && (
              <>
                {(d.required || []).length === 0 && (d.filed || []).length === 0 && (
                  <p className="text-xs text-stone-400">
                    {d.appointmentType
                      ? 'This visit type asks for no documents, and none has been filed against it.'
                      : 'No visit type is set on this encounter, so nothing is being asked for.'}
                  </p>
                )}
                {(d.required || []).length > 0 && (
                  <ul className="space-y-1.5 mb-3">
                    {d.required.map(r => (
                      <li key={r.kind} className="flex items-start gap-2">
                        <span className={`chip ${r.filed ? 'bg-[#E8F3EE] text-[#0f6e56]' : 'bg-[#FDEEEE] text-[#A32D2D]'}`}>
                          {r.filed ? 'On file' : 'Still needed'}
                        </span>
                        <span className="min-w-0">
                          <span className="font-medium">{r.label}</span>
                          {r.hint && <span className="block text-[12px] text-stone-500">{r.hint}</span>}
                        </span>
                      </li>
                    ))}
                  </ul>
                )}
                {(d.filed || []).length > 0 && (
                  <div className="border-t border-stone-100 pt-3">
                    <div className="text-[12px] font-semibold text-primary mb-1.5">Filed against this visit</div>
                    <ul className="space-y-1.5">
                      {d.filed.map(f => (
                        <li key={f.id} className="flex flex-wrap items-center gap-2">
                          {/* The file opens THROUGH the app, so the read is
                              audited and the Drive id never reaches the
                              browser — the server already returns that url. */}
                          <a className="text-primary underline" href={f.url} target="_blank" rel="noreferrer">{f.fileName || f.label}</a>
                          <span className="text-[12px] text-stone-500">
                            {f.label}{f.uploadedByName ? ` · ${f.uploadedByName}` : ''}{f.uploadedAt ? ` · ${fmtDate(f.uploadedAt)}` : ''}
                          </span>
                          {f.status && f.status !== 'accepted' && <span className="chip bg-[#FDF3DD] text-[#8a6a1e]">{f.status}</span>}
                        </li>
                      ))}
                    </ul>
                  </div>
                )}
                <p className="text-[10.5px] text-stone-400 mt-2">
                  Documents are filed from the chart's Documents area or by the office. This card says what this visit asks for.
                </p>
              </>
            )}
          </div>
        </div>
      );
    };

    const EncounterLookups = ({ patient, chart, onChartChanged }) => {

                  className={`chip border ${open === l.key ? 'bg-primary text-white border-primary' : 'bg-white text-primary border-stone-200'}`}

                {open === 'problems' && <ProblemsTab chart={chart} />}

    // Who a signed visit's after-visit summary was given to. The app records it;

            </div>

          {canRecord && !open && <button className="chip border bg-white text-primary border-stone-200" onClick={() => setOpen(true)}><i className="ti ti-send" /> Log Recipient</button>}
          {canRecord && open && (

              <select className="inp" value={f.recipientType} onChange={e => setF({ ...f, recipientType: e.target.value })}>
                {types.map(t => <option key={t} value={t}>{labels[t] || t}</option>)}
              </select>
              {f.recipientType !== 'patient' && <input className="inp" placeholder={f.recipientType === 'facility' ? 'Facility and staff name' : 'Name'} value={f.recipientName} onChange={e => setF({ ...f, recipientName: e.target.value })} />}
              <select className="inp" value={f.channel} onChange={e => setF({ ...f, channel: e.target.value })}>
                {channels.map(c => <option key={c} value={c}>{(d.sendChannelLabels || {})[c] || c}</option>)}
              </select>
              {isFax && <input className="inp" placeholder="Fax number it went to" value={f.recipientFax} onChange={e => setF({ ...f, recipientFax: e.target.value })} />}
              <div className="flex gap-1.5">
                <button className="btn gold !py-1 !px-2.5 text-xs" disabled={!ok || busy} onClick={() => Promise.resolve(onRecord(f)).then(r => { if (r) { setOpen(false); setF({ recipientType: 'patient', recipientName: '', channel: 'hand', recipientFax: '' }); } })}>{busy ? 'Saving…' : 'Record'}</button>
                <button className="btn ghost !py-1 !px-2.5 text-xs" onClick={() => setOpen(false)}>Cancel</button>
              </div>
              <p className="text-[10.5px] text-stone-500">This records that you gave it. It does not send anything. Before sending to a facility, check the patient has authorized sharing with that facility.</p>
            </div>
          )}
        </div>
      );
    };

    // ── T1 B1/B2 — the video room and the pre-join checks ───────────────────
    //
    // Shown only on a video visit. An empty card on a house call is a control
    // that invites a click that does nothing, and the SERVER decides which
    // this is (`isVideoVisit`): the page names no check and no rule of its own,
    // so it cannot drift from the validator that refuses one it did not offer.
    const VideoVisitCard = ({ d, eid, busy, onStart, onCheck }) => {
      const tele = d.telehealthChecklist;
      const [notes, setNotes] = useState({});
      if (!d.isVideoVisit) return null;
      return (
        <div className="border border-primary/30 bg-primary/[0.03] rounded-lg p-2.5 mt-1 text-xs">
          <div className="flex items-center justify-between gap-2 flex-wrap">
            <b className="text-primary"><i className="ti ti-video mr-1" />Video visit</b>
            {d.video
              ? (eid
                ? <button className="btn gold !py-1 !px-2.5 text-[11.5px]" disabled={busy === 'video'} onClick={onStart}>
                  <i className="ti ti-video" />Start Video Visit
                </button>
                /* The room belongs to the APPOINTMENT, so without one there is
                   nothing to key a start on. Said plainly rather than hidden. */
                : <span className="text-stone-500">Attach this note to its appointment to open the room from here.</span>)
              : <span className="text-amber-800">No video room for this visit. If it should be a video visit, reschedule it as one so a room is created.</span>}
          </div>
          {d.video && d.video.meetingCode && (
            <p className="text-stone-500 mt-1">Meeting code <b>{d.video.meetingCode}</b> — read it out if someone cannot open the link.</p>
          )}
          {tele && (
            <div className="mt-2">
              <div className="lblu mb-1">Before you start</div>
              {tele.electionWarning && (
                <p className="text-amber-800 mb-1.5"><i className="ti ti-alert-triangle mr-1" />{tele.electionWarning}</p>
              )}
              <div className="grid gap-1.5">
                {tele.items.map(it => (
                  <div key={it.key} className="border border-stone-200 bg-white rounded-lg px-2.5 py-1.5">
                    <label className="flex items-start gap-2 cursor-pointer">
                      <input type="checkbox" className="mt-0.5" checked={it.confirmed} disabled={busy === `tele:${it.key}`}
                        onChange={e => onCheck(it.key, e.target.checked, notes[it.key] || '')} />
                      <span className="min-w-0">
                        <span className={it.confirmed ? 'font-semibold text-emerald-800' : 'font-semibold text-stone-800'}>{it.label}</span>
                        <span className="block text-stone-500">{it.hint}</span>
                        {it.prefill && <span className="block text-emerald-800">{it.prefill}</span>}
                        {it.confirmed && it.by && <span className="block text-stone-400">{it.by.name} · {fmtTs(it.at)}{it.note ? ` · ${it.note}` : ''}</span>}
                      </span>
                    </label>
                    {it.key === 'location' && !it.confirmed && (
                      <input className="inp mt-1.5 text-[11.5px]" placeholder="Where are they? (e.g. their home in Marietta, GA)"
                        value={notes.location || ''} onChange={e => setNotes({ ...notes, location: e.target.value })} />
                    )}
                  </div>
                ))}
              </div>
              {/* NEVER A BLOCK. The clinician on the call is the person who
                  knows whether identity was confirmed, and a note refused over
                  a tick box is an hour of documentation held hostage. */}
              <p className="text-stone-500 mt-1.5">
                {tele.complete
                  ? 'All recorded.'
                  : 'These do not stop you signing — the note will carry a note of anything not recorded.'}
              </p>
            </div>
          )}
        </div>
      );
    };

    const EncounterPanel = ({ patient, euuid, chart, onChartChanged, onBack, onChanged, initialStep }) => {
      const [d, setD] = useState(null);
      const [err, setErr] = useState('');
      const [busy, setBusy] = useState('');
      const [msg, setMsg] = useState(null);
      const [diagnoses, setDiagnoses] = useState([]);
      const [services, setServices] = useState([]);
      const [addToProblemList, setAddToProblemList] = useState([]);
      const [attest, setAttest] = useState(false);
      const [portalHold, setPortalHold] = useState({ on: false, reason: '' });
      const [addendum, setAddendum] = useState('');
      // The clinician addendum that makes an author's note billable, and
      // attaching this note to an appointment booked after the visit.
      const [clinAddendum, setClinAddendum] = useState('');
      const [totalMins, setTotalMins] = useState('');
      const [clinAttest, setClinAttest] = useState(false);
      const [coSignAttest, setCoSignAttest] = useState(false);
      const [attachOpen, setAttachOpen] = useState(false);
      const [attachAppts, setAttachAppts] = useState(null);
      const [showRx, setShowRx] = useState(false); const [showOrder, setShowOrder] = useState(false);
      // F3: one step per screen on a phone. Presentation only — the panel is
      // the SAME mounted component on every step, so nothing typed on one is
      // lost by moving to another.
      // One step per screen at every width (owner, 2026-11-04). The whole
      // encounter as one scroll was fifteen cards deep on a laptop.
      const [step, setStep] = useState(initialStep && ENCOUNTER_STEPS.some(x => x.key === initialStep) ? initialStep : 'visit');
      const goSign = () => { setStep('sign'); try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) { /* old browser */ } };
      // 4.3: clinician-authored patient-facing text — the only visit text the
      // patient portal ever shows (never the narrative note)
      const [facing, setFacing] = useState({ patientSummary: '', followUpInstructions: '' });
      const canWrite = useCanWrite();
      // Session 4.8 — certification, not one boolean. Each control asks for the
      // capability it actually needs, so an RN sees the chart and the note and
      // does not see a Record Rx button the server would refuse.
      const canPrescribe = useCan('prescribe');
      const canOrderDirect = useCan('orderDirect');
      // A licence whose standing-order ceiling is screening only (an LCSW or
      // LMSW) has no ORDER to place: screenings go on the Screenings card.
      const ceiling = useContext(AccessContext).credentialCeiling || [];
      const canOrderStanding = useCan('orderStanding') && ceiling.some(t => t !== 'screening');
      const canSelectCodes = useCan('selectServiceCodes');
      // Anyone licensed refers within the team; a provider or an LCSW refers out
      // (owner, 2026-10-12). Either one opens the order form, for a referral.
      const canReferInternal = useCan('referInternal');
      const canReferExternal = useCan('referExternal');
      const canRefer = canReferInternal || canReferExternal;
      const myClinicalRole = useClinicalRole();
      const [standingOrders, setStandingOrders] = useState([]);
      const [orderEnrollmentWarning, setOrderEnrollmentWarning] = useState(null);
      useEffect(() => {
        if (!canOrderStanding) return;
        api.myStandingOrders().then(r => setStandingOrders((r && r.standingOrders) || [])).catch(() => setStandingOrders([]));
      }, [canOrderStanding]);
      // Every save elsewhere on the encounter (a draft, an Rx, an order) reloads
      // it. The reload used to reset the coding boxes, so diagnoses added or a
      // long patient summary typed and not yet saved vanished. Unsaved coding
      // is kept; only a clean screen takes the server's copy.
      const codingRef = useRef({});
      // Set by a SUCCESSFUL coding save, so the reload after it takes the
      // server's copy. Without it the reload compared the boxes with the
      // record from BEFORE the save, decided they were still unsaved, kept
      // them, never cleared "add to problem list", and "Unsaved changes" (and
      // the Sign block) stayed on after every save (owner report, 2026-10-12).
      const adoptCodingRef = useRef(false);
      // The note editor's unsaved state: the Sign & Submit card reads the
      // SAVED note, so it says "save first" rather than listing sections
      // that are typed but not saved (owner report, 2026-10-12).
      const [noteDirty, setNoteDirty] = useState(false);
      const noteSaveRef = useRef(null);
      const onNoteState = useCallback((s) => { setNoteDirty(!!s.dirty); noteSaveRef.current = s.save; }, []);
      const saveNoteFirst = () => { if (noteSaveRef.current) Promise.resolve(noteSaveRef.current()).catch(() => {}); };
      codingRef.current = { diagnoses, services, facing, addToProblemList, record: d && d.record, key: `${patient.id}|${euuid}` };
      const load = useCallback(() => {
        api.encounterDetail(patient.id, euuid).then(r => {
          const cur = codingRef.current;
          const prev = cur.key === `${patient.id}|${euuid}` ? cur.record : null;
          const unsaved = !!prev && (
            JSON.stringify(cur.diagnoses) !== JSON.stringify(prev.diagnoses || []) ||
            JSON.stringify(cur.services) !== JSON.stringify(prev.services || []) ||
            (cur.facing.patientSummary || '') !== (prev.patientSummary || '') ||
            (cur.facing.followUpInstructions || '') !== (prev.followUpInstructions || '') ||
            (cur.addToProblemList || []).length > 0);
          setD(r); setErr('');
          if (!unsaved || adoptCodingRef.current) {
            adoptCodingRef.current = false;
            setDiagnoses(r.record.diagnoses || []); setServices(r.record.services || []); setAddToProblemList([]);
            setFacing({ patientSummary: r.record.patientSummary || '', followUpInstructions: r.record.followUpInstructions || '' });
          }
        }).catch(e => setErr(e.message));
      }, [patient.id, euuid]);
      useEffect(load, [load]);
      const run = (label, fn, okText) => {
        setBusy(label); setMsg(null);
        return fn().then(r => {
          setMsg({ ok: true, text: `${okText || r.message}${r.warnings && r.warnings.length ? ` — ${r.warnings.join(' · ')}` : ''}` });
          load(); onChanged && onChanged(); return r;
        }).catch(e => { setMsg({ ok: false, text: e.data && e.data.missing ? `${e.message}` : e.message }); return null; }).finally(() => setBusy(''));
      };
      // run() resolves to null when the action was refused. A form only closes,
      // or its text only clears, on a real success: a refused prescription,
      // order or addendum keeps what the clinician typed (owner-reported class).
      const onOk = (fn) => (r) => { if (r) fn(r); return r; };
      if (err) return <div className="card p-4"><p className="text-red-600 text-sm">{err}</p><button className="btn ghost mt-2" onClick={onBack}>Back</button></div>;
      if (!d) return <p className="text-sm text-stone-500 p-4">Loading encounter from OpenEMR…</p>;
      const closed = d.closed;
      // Read-only for a signed encounter OR a read-only role (case manager)
      const canDocument = useCanDocument();
      const locked = closed || !canDocument;
      // What this viewer may do with the NOTE is answered by the server
      // (noteActions) — the page decides no credential question itself.
      const na = d.noteActions || {};
      const ns = d.noteState || {};
      // Billing's side of a signed visit, answered by the server.
      const ba = d.billingActions || {};
      // Coding stays open, on a note an RN or LMSW signed as its author, to the
      // clinician who will add the billing addendum: the diagnoses are theirs.
      // Once a clinician signs, the SERVICE codes, modifiers and dx links are
      // billing's until billing submits (owner, 2026-09-29) — the diagnoses
      // stay exactly as the clinician signed them.
      // ONE coding area on the encounter (owner, 2026-11-04): before signing it
      // is the clinician's. After a clinician signs, the service codes,
      // modifiers and links are finished on the billing page, never here.
      const codingLocked = closed ? !na.canAddClinicianAddendum : !canWrite;
      const awaitingAddendum = d.record.coSignStatus === 'pending';
      const BILLING_STATUS_TEXT = {
        awaiting_billing: 'With billing — service codes are added and the visit submitted by billing.',
        billed: 'Submitted to billing.',
        no_charge: 'Closed by billing with no charge.'
      };
      const openAttach = () => {
        setAttachOpen(true); setAttachAppts(null);
        api.patientAppointments(patient.id)
          .then(r => setAttachAppts(((r && r.appointments) || []).filter(a => !a.encounterUuid && !['cancelled', 'no_show'].includes(a.state))))
          .catch(e => setMsg({ ok: false, text: e.message }));
      };
      const facingDirty = (facing.patientSummary || '') !== (d.record.patientSummary || '') || (facing.followUpInstructions || '') !== (d.record.followUpInstructions || '');
      // Ticking "add to problem list" is a change too: without it, Save stayed disabled.
      const dirty = JSON.stringify(diagnoses) !== JSON.stringify(d.record.diagnoses || []) || JSON.stringify(services) !== JSON.stringify(d.record.services || []) || facingDirty || (addToProblemList || []).length > 0;
      const ORDER_LABEL = { ordered: 'Ordered', sent: 'Sent', scheduled: 'Scheduled', accepted: 'Accepted', resulted: 'Resulted', completed: 'Completed', cancelled: 'Cancelled' };
      // Every step stays MOUNTED and only the current one shows, so a note
      // half typed on Visit survives a look at Coding.
      return (
        <div className="max-w-4xl">
          <button className="text-xs text-primary underline mb-2" onClick={onBack}><i className="ti ti-arrow-left" /> All Encounters</button>
          <EncounterStepRail step={step} onStep={setStep} blockers={(d.signReadiness && d.signReadiness.missing) || []} closed={closed} />
          {/* The header is on every step: who this is and whether it is signed
              is the context for all four, and hiding it would leave a screen
              that does not say whose encounter it belongs to. */}
          <div className="card mb-4">
            <div className="card-h"><h2>{d.encounter.reason || 'Encounter'}</h2><EncStateChip state={d.state} /></div>
            <div className="p-4 text-sm grid gap-1">
              <div className="flex flex-wrap gap-4 text-xs text-stone-500">
                <span>Date <b>{d.encounter.date || '—'}</b></span>
                <span>OpenEMR encounter <b>#{d.encounter.eid || '—'}</b></span>
                <span>Rendering clinician <b>{npiLabel(d.record.renderingProvider)}</b></span>
                {ba.canBill && <span>Billing provider NPI <b>{d.billingNpiUsed || <span className="text-red-600">not configured (Settings)</span>}</b></span>}
              </div>
              {d.encounter.billingNote && <div className="text-xs text-stone-500">OpenEMR billing note: {d.encounter.billingNote}</div>}
              <div className="flex flex-wrap items-center gap-2 text-xs mt-1">
                {d.linkedAppointmentEid
                  ? <span className="chip bg-primary-50 text-primary"><i className="ti ti-calendar-check mr-1" />Attached to appointment #{d.linkedAppointmentEid}</span>
                  : <span className="chip bg-stone-100 text-stone-600">Not attached to an appointment</span>}
                {na.canAttachAppointment && !attachOpen && (
                  <button className="btn ghost !py-1 !px-2.5 text-xs" onClick={openAttach}><i className="ti ti-link" />Attach to Appointment</button>
                )}
              </div>
              {attachOpen && (
                <div className="border border-stone-200 rounded-lg p-2.5 mt-1 text-xs">
                  <div className="flex items-center justify-between mb-1"><b className="text-primary">Attach this note to an appointment</b><button className="text-stone-400" onClick={() => setAttachOpen(false)}><i className="ti ti-x" /></button></div>
                  <p className="text-stone-500 mb-2">For a visit that was unscheduled when the note was written. Only unsigned notes can be attached.</p>
                  {!attachAppts && <p className="text-stone-500">Loading this patient's appointments…</p>}
                  {attachAppts && attachAppts.length === 0 && <p className="text-stone-500">No appointment without a note. Book the appointment first, then attach this note to it.</p>}
                  <div className="grid gap-1">
                    {(attachAppts || []).map(a => (
                      <button key={a.eid} className="text-left border border-stone-200 rounded-lg px-2.5 py-1.5 hover:bg-cream" disabled={busy === 'attach'}

                        <b>{fmtDayLabel(a.date)}</b> {fmt12h(a.startTime)} — {a.title || 'Appointment'}

                  </div>
                </div>

              <VideoVisitCard d={d} eid={d.linkedAppointmentEid} busy={busy}

                  setBusy('video'); setMsg(null);
                  api.startVideoVisit(d.linkedAppointmentEid)

                    .catch(e => { if (tab) tab.close(); setMsg({ ok: false, text: e.message }); })

                onCheck={(key, confirmed, note) => {
                  setBusy(`tele:${key}`); setMsg(null);

                    .catch(e => setMsg({ ok: false, text: e.message }))
                    .finally(() => setBusy(''));
                }} />
              {closed && (
                <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-2.5 text-xs text-emerald-900 mt-1">
                  <b>Signed {fmtTs(d.attestation.signedAt)} by {npiLabel(d.attestation.signedBy)}{awaitingAddendum ? ' as the note\'s author' : ''}.</b> The note is locked for clinicians. Corrections go in as addenda below, each with its own signer and timestamp.

                    <a className="chip border bg-white text-primary border-stone-200" href={api.signedNoteUrl(patient.id, euuid)} target="_blank" rel="noopener noreferrer"><i className="ti ti-file-download" /> Download note PDF</a>
                    <a className="chip border bg-white text-primary border-stone-200" href={api.visitSummaryUrl(patient.id, euuid)} target="_blank" rel="noopener noreferrer"><i className="ti ti-file-heart" /> Visit summary for the patient (PDF)</a>
                  </div>
                  <AvsGivenLog d={d} busy={busy === 'avs'} onRecord={(body) => run('avs', () => api.avsGiven(patient.id, euuid, body))} />

                  {!awaitingAddendum && BILLING_STATUS_TEXT[d.billingStatus] && <div className="mt-1 font-semibold">{BILLING_STATUS_TEXT[d.billingStatus]}</div>}
                </div>
              )}
              {ns.status === 'voided' && (
                <div className="bg-stone-100 border border-stone-200 rounded-lg p-2.5 text-xs text-stone-700 mt-1">
                  <b>This encounter was deleted{d.record.voided ? ` by ${(d.record.voided.by || {}).name || 'someone'} on ${fmtTs(d.record.voided.at)}` : ''}.</b>{d.record.voided && d.record.voided.reason ? <> Reason: {d.record.voided.reason}.</> : null} It is hidden from the chart's lists, voided in OpenEMR, kept on record, and it will never bill.
                </div>
              )}
              {(d.warnings || []).map((w, i) => <p key={i} className="text-xs text-amber-700"><i className="ti ti-alert-triangle mr-1" />{w}</p>)}
              {d.record.structuredNoteError && !locked && (
                <button className="btn ghost !py-1 !px-2.5 text-xs w-fit" disabled={busy === 'resync'} onClick={() => run('resync', () => api.resync(patient.id, euuid))}>Retry EMR Sync</button>
              )}
            </div>
          </div>

          {/* THE NOTE. A draft is edited here by anyone writing on this chart —
              the H&P in its own form, everything else in the SOAP editor. Once
              signed it is read-only, formatted, with the signature at the foot. */}
          <div hidden={step !== 'visit'}>
          {ns.status === 'draft' && na.canEdit && (
            // The H&P screen for an H&P — and for a draft still holding H&P
            // boxes, so they are shown and kept (it renders a follow-up type
            // as the same SOAP note). Everything else: the SOAP editor.
            (((ns.note && ns.note.kind) || d.record.noteKind) === 'hp' || noteHasHpContent(ns.note))
              ? <HpTab patient={patient} chart={chart} encounterUuid={euuid} embedded codingDirty={!locked && dirty} onNoteState={onNoteState}
                  onChanged={() => { load(); onChanged && onChanged(); }} onGoToEncounter={() => setStep('coding')} onSign={goSign} />
              : <FollowUpNoteEditor patient={patient} euuid={euuid} noteSections={d.noteSections} sectionsOnly={!!d.sectionsOnly} typeLabel={d.noteTypeLabel} codingDirty={!locked && dirty} onNoteState={onNoteState}
                  onSign={goSign} onChanged={() => { load(); onChanged && onChanged(); }} />
          )}
          {!(ns.status === 'draft' && na.canEdit) && <div className="card mb-4">
            <div className="card-h"><h2>Note</h2><span className="text-[10.5px] text-stone-500">{closed ? 'signed — read-only; corrections are addenda' : ns.status === 'voided' ? 'deleted encounter' : 'draft — read-only for your role'}</span></div>
            <div className="p-4 text-sm grid gap-3">
              {ns.note
                ? <SignedNoteView note={ns.note} noteSections={d.noteSections} signature={ns.signature} revisions={ns.revisions} />
                : <>
                    {d.notesError && <p className="text-xs text-red-600">{d.notesError}</p>}
                    {!d.notesError && d.narrativeNotes.length === 0 && <p className="text-xs text-amber-700">No narrative note found on this encounter in OpenEMR — signing requires one.</p>}
                    {d.narrativeNotes.map(n => (
                      <div key={n.id} className="grid gap-1.5 text-xs">
                        {[['S', n.subjective], ['O', n.objective], ['A', n.assessment], ['P', n.plan]].map(([k, v]) => v ? <div key={k}><b className="text-primary">{k}</b> <span className="whitespace-pre-wrap">{v}</span></div> : null)}
                      </div>
                    ))}
                    <SignatureBlock signature={ns.signature} />
                  </>}
            </div>
          </div>}

          {/* On the Visit step, where the clinician is reading the note and

          {(
            <ScreeningCard d={d} patient={patient} euuid={euuid} locked={locked} busy={busy === 'screen'}

          {(
            <RiskCard d={d} patient={patient} euuid={euuid} locked={locked || !canWrite} busy={busy === 'risk'}
              onSave={(form) => run('risk', () => api.saveRisk(patient.id, euuid, form))} />
          )}

          {<EncounterLookups patient={patient} chart={chart} onChartChanged={onChartChanged} />}
          </div>

          <div hidden={step !== 'coding'}>
          {<div className="card mb-4">
            <div className="card-h"><h2>Diagnoses &amp; Services</h2>
              <span className={`chip ${d.record.codingStatus === 'coded' ? 'bg-primary-50 text-primary' : 'bg-amber-50 text-amber-800'}`}>{d.record.codingStatus === 'coded' ? 'CODED' : 'NOT CODED'}</span>
            </div>
            <div className="p-4 grid gap-4">
              <div>
                <span className="lblu block mb-1">Diagnoses (ICD-10-CM)</span>
                <DxEditor diagnoses={diagnoses} setDiagnoses={setDiagnoses} candidates={d.candidates} clientId={patient.id} readOnly={codingLocked}
                  addToProblemList={addToProblemList} setAddToProblemList={setAddToProblemList} />
                {!codingLocked && canWrite && <DxSuggestionsPanel patientId={patient.id} euuid={euuid} diagnoses={diagnoses} setDiagnoses={setDiagnoses} />}
                {d.candidatesError && <p className="text-[11px] text-amber-700 mt-1">Problem list unavailable: {d.candidatesError}</p>}
                {closed && ba.canBill && !awaitingAddendum && <Hint className="mt-1">Signed. The service codes, modifiers and diagnosis links are finished on the <a className="underline" href={billingClaimHref(patient.id, euuid)}>Billing page</a>.</Hint>}
              </div>
              <div>
                <span className="lblu block mb-1">Services (CPT / HCPCS) — each linked to ≥1 diagnosis</span>
                {/* Session 4.8: certification gates the CODE. The service
                    editor goes read-only for a credential that may not select
                    one — the diagnosis editor above does not, because an RN
                    correcting a diagnosis is not coding a claim. The route
                    gates on the codes CHANGING, so a read-only editor and the
                    server agree without the page having to re-derive it. */}
                <SvcEditor services={services} setServices={setServices} diagnoses={diagnoses} readOnly={codingLocked || !canSelectCodes}
                  practiceFavorites={d.favorites.practiceServices} favorites={d.favorites.services} />
                {!codingLocked && !canSelectCodes && <p className="text-[11px] text-stone-400 mt-1">Service codes are added by billing after the note is signed. You can still correct the diagnoses.</p>}
                {!closed && canSelectCodes && <Hint className="mt-1">Optional before signing — billing adds or confirms the service codes after you sign.</Hint>}
              </div>
              <div className="border-t border-stone-100 pt-3">
                <span className="lblu block mb-1">Patient-facing summary (shown in the patient portal — plain language, optional)</span>
                <div className="grid md:grid-cols-2 gap-3">
                  <Field label="What we did today, in plain words"><textarea className="inp" rows={6} maxLength={4000} disabled={codingLocked} value={facing.patientSummary} onChange={e => setFacing({ ...facing, patientSummary: e.target.value })} placeholder="e.g. We checked your blood pressure and adjusted your water pill." /></Field>
                  <Field label="Follow-up instructions for the patient"><textarea className="inp" rows={6} maxLength={4000} disabled={codingLocked} value={facing.followUpInstructions} onChange={e => setFacing({ ...facing, followUpInstructions: e.target.value })} placeholder="e.g. Take the new dose each morning; we will see you again in 4 weeks." /></Field>
                </div>
                <Hint className="mt-1">Without this, the portal summary shows only the diagnoses addressed, prescriptions recorded and tests ordered. Since 2026-09-29 (owner decision) the signed note itself is also shown to the patient and their POA, unless you hold it from the portal when signing.</Hint>
              </div>
              {!codingLocked && (
                <div className="flex items-center gap-3">
                  <button className="btn" disabled={busy === 'coding' || !dirty} onClick={() => run('coding', () => api.saveCoding(patient.id, euuid, { diagnoses, services, addToProblemList, ...facing }).then(r => { adoptCodingRef.current = true; return r; }))}>
                    <i className="ti ti-device-floppy" />{busy === 'coding' ? 'Saving…' : 'Save Coding'}
                  </button>
                  {dirty && <span className="text-xs text-amber-700">Unsaved changes</span>}
                </div>
              )}
            </div>
          </div>}
          </div>

          <div hidden={step !== 'actions'}>
          {<div className="grid md:grid-cols-2 gap-4 mb-4">

              <div className="p-4 text-sm">

                      {r.schedule && r.schedule !== 'non_controlled' && <span className="chip bg-amber-50 text-amber-800 ml-1">{r.schedule === 'unclassified' ? 'schedule not recorded' : r.schedule}</span>}
                    </div>
                    <div className="text-xs text-stone-500">qty {r.quantity} · refills {r.refills} · {r.date} · {npiLabel(r.prescriber)}{r.emrMedicationId ? ' · on the OpenEMR med list' : (r.emrWriteError ? ' · OpenEMR med-list write failed' : '')} · <b>not transmitted</b></div>
                    {r.instructions && <div className="text-xs text-stone-500">{r.instructions}</div>}
                  </div>
                ))}
                {!locked && !canPrescribe && <p className="text-[11px] text-stone-400 mt-2">Prescribing is a provider's — your credential can read what was prescribed but not add to it.</p>}
