<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Godwins Family Care — Clinical Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.1.0/dist/tabler-icons.min.css">
  <!-- EVERY time this app shows is Eastern, on both sides (owner rule,
       2026-09-16). Loaded before the page's own scripts so nothing can format a
       date before the default is in place. `installDefaultTimeZone()` fills in
       the zone where a caller passed none; the shift and visit sites also call
       GFC_TIME's helpers explicitly, because code that says what it means
       outlives a shim. See public/gfc-time.js. -->
  <script src="/gfc-time.js"></script>
  <script>window.GFC_TIME && window.GFC_TIME.installDefaultTimeZone();</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <!-- Session 9 messaging: the same thread component every portal mounts. -->
  <script src="/components/gfc-messaging.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#033D50', 50: '#e8f0f4', 100: '#c5d9e3', 500: '#033D50', 600: '#02334a', 700: '#022A38' },
            accent: '#C9A44A',
            cream: '#FAF7F2', creamdeep: '#efe9db'
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['"DM Sans"', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="icon" type="image/png" href="/brand/logo-mark-transparent.png">
  <style>
    * { font-family: 'DM Sans', system-ui, sans-serif; }
    body { background: #efe9db; color: #2b2b28; }
    .serif { font-family: 'Cormorant Garamond', Georgia, serif; }
    .card { background: #fff; border: 1px solid #e5ddcb; border-radius: 12px; }
    .card-h { display:flex; align-items:center; justify-content:space-between; padding: 12px 16px; border-bottom: 1px solid #eee9dc; }
    .card-h h2 { font-family: 'Cormorant Garamond', serif; font-size: 17px; color: #033D50; font-weight: 600; }
    .lblu { font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: #7a746a; font-weight: 600; }
    .inp { width:100%; border:1px solid #e5ddcb; border-radius:8px; padding:8px 10px; font-size:13px; background:#fff; }
    .inp:focus { outline:2px solid #C9A44A55; border-color:#C9A44A; }
    .btn { display:inline-flex; align-items:center; gap:6px; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid #033D50; background:#033D50; color:#fff; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .btn.gold { background:#C9A44A; border-color:#C9A44A; color:#033D50; }
    .btn.ghost { background:#fff; color:#033D50; }
    .chip { border-radius:999px; padding:2px 9px; font-size:10.5px; font-weight:700; }
    .prefill { background:#FDF6E7; border:1px dashed #C9A44A; }
    .prefill-badge { font-size:9.5px; color:#9a6a1e; font-weight:700; letter-spacing:.4px; }
    .tabbtn { padding:9px 14px; font-size:13px; font-weight:600; color:#7a746a; border-bottom:2.5px solid transparent; cursor:pointer; white-space:nowrap; }
    .tabbtn.on { color:#033D50; border-color:#C9A44A; }
    ::-webkit-scrollbar { width:8px; height:8px; } ::-webkit-scrollbar-thumb { background:#d8d0bd; border-radius:8px; }
  </style>
  <script src="/session-guard.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useContext , useMemo } = React;
    const API_URL = window.location.origin;

    // Session 4.3 — case-manager scoped read. The API enforces the split
    // (requireClinicalRead / requireClinicalWrite); this context only decides
    // which controls to RENDER. Mirrors patientReadRepository.canClinicalWrite.
    const canWriteFor = (u) => !!u && (u.role === 'admin' || (!!u.hasClinicalAccess && u.role !== 'caseManager'));
    // Session 4.8 — the capability matrix comes from GET /api/clinical/status,
    // which reads the SAME module the routes enforce with. This page never
    // decides a capability itself: a control drawn here is one the server will
    // accept, and every one is re-checked at the route regardless.
    const AccessContext = React.createContext({ canWrite: true, role: null, capabilities: {}, clinicalRole: null });
    const useCanWrite = () => useContext(AccessContext).canWrite;
    const useCan = (capability) => {
      const ctx = useContext(AccessContext);
      // Until the status call lands there is no matrix; fall back to the
      // read/write split rather than drawing controls we cannot vouch for.
      if (!ctx.capabilities || !Object.keys(ctx.capabilities).length) return ctx.canWrite;
      return !!ctx.capabilities[capability];
    };
    const useClinicalRole = () => useContext(AccessContext).clinicalRole;

    const getToken = () => localStorage.getItem('admin_token') || localStorage.getItem('unified_token');
    const handleResponse = async (response) => {
      if (!response.ok) {
        let data = null;
        try { data = await response.json(); } catch {}
        // The server answers an expired or invalid JWT with 403, not 401, so
        // keying only on 401 left a stale session rendering the raw string
        // "Invalid token" in red across the page with no hint to sign in again.
        // Key on the auth CODES instead: a permission 403 (CLINICAL_READ_ONLY
        // and friends) belongs to a correctly signed-in user and must not log
        // them out.
        const authCode = data && data.code;
        const isAuthFailure = response.status === 401
          || ['AUTH_MISSING', 'AUTH_EXPIRED', 'AUTH_INVALID', 'AUTH_INACTIVE', 'AUTH_IDLE', 'AUTH_REVOKED', 'AUTH_MFA_REQUIRED'].includes(authCode);
        if (isAuthFailure) {
          localStorage.removeItem('admin_token'); localStorage.removeItem('admin_user');
          throw Object.assign(
            new Error((data && data.error) || 'Your session has expired. Please sign in again.'),
            { code: 'AUTH', authCode: authCode || null, status: response.status });
        }
        const err = new Error((data && data.error) || `HTTP error ${response.status}`);
        err.status = response.status; err.data = data;
        throw err;
      }
      return response.json();
    };
    const authedFetch = (path, opts = {}) => {
      const headers = Object.assign({ 'Authorization': `Bearer ${getToken()}` },
        opts.body && !(opts.body instanceof FormData) ? { 'Content-Type': 'application/json' } : {}, opts.headers || {});
      return fetch(`${API_URL}${path}`, Object.assign({}, opts, { headers })).then(handleResponse);
    };
    // A multipart upload. `authedFetch` sets Content-Type for a JSON body and
    // deliberately does not for FormData — the browser has to write the
    // multipart boundary itself — so this exists to make that impossible to get
    // wrong at a call site rather than to add anything else.
    const authedUpload = (path, formData) => fetch(`${API_URL}${path}`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${getToken()}` },
      body: formData
    }).then(handleResponse);
    const api = {
      login: (email, password) => fetch(`${API_URL}/api/auth/login`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      }).then(handleResponse),
      status: () => authedFetch('/api/clinical/status'),
      patients: (q) => authedFetch(`/api/clinical/patients${q ? `?q=${encodeURIComponent(q)}` : ''}`),
      link: (id, body) => authedFetch(`/api/clinical/patients/${id}/link`, { method: 'POST', body: JSON.stringify(body || {}) }),
      chart: (id) => authedFetch(`/api/clinical/patients/${id}/chart`),
      visit: (id, body) => authedFetch(`/api/clinical/patients/${id}/visit`, { method: 'POST', body: JSON.stringify(body) }),
      // Drafts are per-clinician: you resume your own half-written note, never
      // somebody else's. The server keys them that way too.
      getDraft: (id) => authedFetch(`/api/clinical/patients/${id}/visit/draft`),
      saveDraft: (id, draft) => authedFetch(`/api/clinical/patients/${id}/visit/draft`, { method: 'PUT', body: JSON.stringify({ draft }) }),
      discardDraft: (id) => authedFetch(`/api/clinical/patients/${id}/visit/draft`, { method: 'DELETE' }),
      // Home-visit standing facts (4.12 F4). On the PATIENT, never an encounter.
      saveHomeVisit: (id, homeVisit) => authedFetch(`/api/clinical/patients/${id}/home-visit`, {
        method: 'PUT', body: JSON.stringify({ homeVisit })
      }),
      // Session 4.12 — the day, the visit stamps, and the packet read in the car.
      myDay: (date) => authedFetch(`/api/clinical/my-day?date=${encodeURIComponent(date)}`),
      stampVisit: (eid, body) => authedFetch(`/api/clinical/visits/${eid}/timing`, {
        method: 'POST', body: JSON.stringify(body)
      }),
      nearby: (clientId, radiusMiles) => authedFetch(`/api/clinical/nearby?clientId=${encodeURIComponent(clientId)}&radiusMiles=${radiusMiles}`),
      workQueues: () => authedFetch('/api/clinical/work-queues'),
      analytics: () => authedFetch('/api/clinical/analytics'),
      // Reading a filed document into proposals, from the chart. The SAME three
      // routes the enrollment screen uses, gated on requireClinicalWrite.
      extractionStatus: (id) => authedFetch(`/api/clinical/patients/${id}/extraction`),
      extractDocument: (id, docId) => authedFetch(`/api/clinical/patients/${id}/documents/${encodeURIComponent(docId)}/extract`, { method: 'POST' }),
      reviewExtraction: (id, exId, decisions) => authedFetch(`/api/clinical/patients/${id}/extraction/${encodeURIComponent(exId)}/review`, {
        method: 'POST', body: JSON.stringify({ decisions })
      }),
      patientOrders: (id) => authedFetch(`/api/clinical/patients/${id}/orders`),
      patientResults: (id) => authedFetch(`/api/clinical/patients/${id}/results`),
      timeline: (id, kinds) => authedFetch(`/api/clinical/patients/${id}/timeline${kinds && kinds.length ? `?kinds=${encodeURIComponent(kinds.join(','))}` : ''}`),
      preVisit: (id, eid) => authedFetch(`/api/clinical/patients/${id}/pre-visit${eid ? `?eid=${encodeURIComponent(eid)}` : ''}`),
      // PROPOSES an order. It never applies one — accepting rebooks through the
      // existing appointment routes so the patient is told.
      optimizeDay: (visits) => authedFetch('/api/clinical/my-day/optimize', {
        method: 'POST', body: JSON.stringify({ visits })
      }),
      // Scanning a document into the patient's file from the chart. The route
      // is the enrollment one on purpose — ONE store for a client's documents,
      // so what a clinician scans in is what the office and the client see.
      fileClientDocument: (clientId, body) => authedFetch(`/api/gfc/admin/enrollment/${clientId}/documents/upload`, {
        method: 'POST', body: JSON.stringify(body)
      }),
      documentKinds: (clientId) => authedFetch(`/api/gfc/admin/enrollment/${clientId}/documents`),
      // Read-only here. The facility and the encounter type are ADMIN writes on
      // the enrollment record (4.12 F1, owner 2026-09-23) — this page states
      // what the claim will say and names where it is fixed.
      placeOfService: (id) => authedFetch(`/api/clinical/patients/${id}/place-of-service`),
      recordExtras: (id) => authedFetch(`/api/clinical/patients/${id}/record-extras`),
      saveRisk: (id, euuid, body) => authedFetch(`/api/clinical/patients/${id}/encounters/${euuid}/risk-assessment`, {
        method: 'POST', body: JSON.stringify(body)
      }),
      medrec: (id) => authedFetch(`/api/clinical/patients/${id}/medrec`),
      medrecSave: (id, decisions) => authedFetch(`/api/clinical/patients/${id}/medrec`, { method: 'POST', body: JSON.stringify({ decisions }) }),
      addProblem: (id, body) => authedFetch(`/api/clinical/patients/${id}/problems`, { method: 'POST', body: JSON.stringify(body) }),
      carePlan: (id) => authedFetch(`/api/clinical/patients/${id}/care-plan`),
      saveCarePlan: (id, body) => authedFetch(`/api/clinical/patients/${id}/care-plan`, { method: 'POST', body: JSON.stringify(body) }),
      // The clinical enrollment sequence (checklist/mark/activate) moved to
      // /admin/enrollment — it duplicated that screen's own approval gate and
      // both wrote the same client.enrollmentStatus independently. See
      // admin-enrollment.html.
      // Session 4.2 — scheduling (OpenEMR is the appointment ledger)
      providers: () => authedFetch('/api/clinical/providers'),
      appointments: (params) => authedFetch(`/api/clinical/appointments?${new URLSearchParams(params).toString()}`),
      appointmentDetail: (eid) => authedFetch(`/api/clinical/appointments/${eid}`),
      patientAppointments: (id) => authedFetch(`/api/clinical/patients/${id}/appointments`),
      createAppointment: (id, body) => authedFetch(`/api/clinical/patients/${id}/appointments`, { method: 'POST', body: JSON.stringify(body) }),
      rescheduleAppointment: (eid, body) => authedFetch(`/api/clinical/appointments/${eid}/reschedule`, { method: 'POST', body: JSON.stringify(body) }),
      cancelAppointment: (eid, reason) => authedFetch(`/api/clinical/appointments/${eid}/cancel`, { method: 'POST', body: JSON.stringify({ reason }) }),
      markNoShow: (eid) => authedFetch(`/api/clinical/appointments/${eid}/no-show`, { method: 'POST' }),
      followUp: (id, body) => authedFetch(`/api/clinical/patients/${id}/encounters`, { method: 'POST', body: JSON.stringify(body) }),
      // Session 4.4 — clinical completeness P0
      dxCandidates: (id) => authedFetch(`/api/clinical/patients/${id}/dx-candidates`),
      settings: () => authedFetch('/api/clinical/settings'),
      saveSettings: (body) => authedFetch('/api/clinical/settings', { method: 'PUT', body: JSON.stringify(body) }),
      codeSearch: (params) => authedFetch(`/api/clinical/codes/search?${new URLSearchParams(params).toString()}`),
      encounters: (id) => authedFetch(`/api/clinical/patients/${id}/encounters`),
      encounterDetail: (id, euuid) => authedFetch(`/api/clinical/patients/${id}/encounters/${euuid}`),
      saveCoding: (id, euuid, body) => authedFetch(`/api/clinical/patients/${id}/encounters/${euuid}/coding`, { method: 'PUT', body: JSON.stringify(body) }),
      addRx: (id, euuid, body) => authedFetch(`/api/clinical/patients/${id}/encounters/${euuid}/prescriptions`, { method: 'POST', body: JSON.stringify(body) }),
      addOrder: (id, euuid, body) => authedFetch(`/api/clinical/patients/${id}/encounters/${euuid}/orders`, { method: 'POST', body: JSON.stringify(body) }),
      // Session 4.8 — "what may I actually act on". The server answers with the
      // protocol's permitted tests and the intersection with my credential
      // ceiling, so the form never computes either.
      myStandingOrders: () => authedFetch('/api/clinical/standing-orders?executable=true'),
      orderStatus: (orderId, status, note) => authedFetch(`/api/clinical/orders/${orderId}/status`, { method: 'POST', body: JSON.stringify({ status, note }) }),
      // ── Session 4.10 — orders that leave the building ────────────────────
      // 'sent' and 'resulted' are deliberately absent from orderStatus above:
      // each has its own route because each captures EVIDENCE. The page cannot
      // reach them any other way, and neither can a curl.
      markOrderSent: (orderId, body) => authedFetch(`/api/clinical/orders/${orderId}/sent`, { method: 'POST', body: JSON.stringify(body) }),
      markReferralScheduled: (orderId, appointmentDate) => authedFetch(`/api/clinical/orders/${orderId}/scheduled`, { method: 'POST', body: JSON.stringify({ appointmentDate }) }),
      attachResult: (orderId, formData) => authedUpload(`/api/clinical/orders/${orderId}/result`, formData),
      attachUnmatchedResult: (clientId, formData) => authedUpload(`/api/clinical/patients/${clientId}/results`, formData),
      resultsInbox: () => authedFetch('/api/clinical/results/inbox'),
      acknowledgeResult: (resultId, followUpNote) => authedFetch(`/api/clinical/results/${resultId}/acknowledge`, { method: 'POST', body: JSON.stringify({ followUpNote }) }),
      overdueOrders: () => authedFetch('/api/clinical/orders/overdue'),
      // THE REQUISITION IS OPENED, NOT FETCHED. On a phone it must land in the
      // browser's PDF viewer so the SHARE SHEET is one tap away — that is the
      // whole workflow: generate, share to Doximity, send. The token rides as a
      // query parameter here because a navigation carries no Authorization
      // header (the enrollment-downloads lesson, PR #103) and `authenticateToken`
      // accepts `?token=` for exactly this case.
      requisitionUrl: (orderId) => `/api/clinical/orders/${orderId}/requisition.pdf?token=${encodeURIComponent(getToken() || '')}`,
      sign: (id, euuid) => authedFetch(`/api/clinical/patients/${id}/encounters/${euuid}/sign`, { method: 'POST', body: JSON.stringify({ attest: true }) }),
      addAddendum: (id, euuid, text) => authedFetch(`/api/clinical/patients/${id}/encounters/${euuid}/addenda`, { method: 'POST', body: JSON.stringify({ text }) }),
      resync: (id, euuid) => authedFetch(`/api/clinical/patients/${id}/encounters/${euuid}/resync`, { method: 'POST' }),
      queue: (state) => authedFetch(`/api/clinical/encounters/queue?state=${encodeURIComponent(state || 'open')}`),
      inbox: () => authedFetch('/api/clinical/inbox')
    };

    // The workspace's top-level views. A MAP rather than a ternary chain: the
    // chain is what collided when 4.9 and 4.10 both added a view, and a fifth
    // would collide again.
    const VIEW_TITLES = {
      myday: 'My Day', queues: 'Work Queues', analytics: 'Analytics', charts: 'Patient Chart', schedule: 'Schedule', queue: 'Coding Queue',
      inbox: 'Inbox', results: 'Results Inbox', overdue: 'Overdue Orders'
    };

    // The nav strip, DECLARED ONCE (owner report 2026-09-23: the top bar was
    // clipping "Analytics" off the right edge). It was nine hand-written
    // buttons, which is why the crowding had nine places to be fixed in and
    // got fixed in none. `tab` is the short label the strip shows; the long
    // one stays in VIEW_TITLES for the heading beside it, so the bar reads
    // "Coding queue" while the heading says "Coding Queue" in full.
    //
    // `keepsPatient` is the one behavioural difference between them: opening
    // Charts leaves the patient list showing on a phone, and every other view
    // is full-width so it closes it.
    const NAV_VIEWS = Object.freeze([
      { key: 'myday', tab: 'My Day', icon: 'ti-sun' },
      { key: 'charts', tab: 'Charts', icon: 'ti-folder-open', keepsPatient: true },
      { key: 'schedule', tab: 'Schedule', icon: 'ti-calendar-week' },
      { key: 'queue', tab: 'Coding', icon: 'ti-receipt' },
      // 4.9's Inbox is what is waiting on a clinician INSIDE the app —
      // unsigned encounters, pending co-signs, visit-log reviews. 4.10's
      // Results is what has COME IN from outside and needs acknowledging, and
      // Overdue is what went out and never came back. Three different
      // questions, and each answers one; see the note where clinicalResults is
      // required in server.js.
      { key: 'inbox', tab: 'Inbox', icon: 'ti-inbox' },
      { key: 'results', tab: 'Results', icon: 'ti-flask' },
      { key: 'overdue', tab: 'Overdue', icon: 'ti-clock-exclamation' },
      { key: 'queues', tab: 'Tasks', icon: 'ti-checkbox' },
      { key: 'analytics', tab: 'Analytics', icon: 'ti-chart-bar' }
    ]);

    const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
    const fmtTs = (iso) => iso ? new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—';
    const initials = (n) => String(n || '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || 'GF';

    // ── Scheduling date/time helpers (wall-clock strings, matching OpenEMR) ──
    const toYmd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const todayYmd = () => toYmd(new Date());
    const addDaysYmd = (ymd, n) => { const d = new Date(`${ymd}T12:00:00`); d.setDate(d.getDate() + n); return toYmd(d); };
    const mondayOf = (ymd) => { const d = new Date(`${ymd}T12:00:00`); return addDaysYmd(ymd, -((d.getDay() + 6) % 7)); };
    const fmtDayLabel = (ymd) => new Date(`${ymd}T12:00:00`).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    const fmt12h = (hhmm) => {
      const [h, m] = String(hhmm || '').split(':').map(n => parseInt(n, 10));
      if (isNaN(h)) return hhmm || '—';
      const ap = h >= 12 ? 'p' : 'a';
      return `${((h + 11) % 12) + 1}:${String(m || 0).padStart(2, '0')}${ap}`;
    };
    const timeMins = (hhmm) => { const [h, m] = String(hhmm || '0:0').split(':').map(n => parseInt(n, 10) || 0); return h * 60 + m; };

    const APPT_STATE_META = {
      scheduled: { label: 'Scheduled', chip: 'bg-primary-50 text-primary' },
      needs_documentation: { label: 'Not yet documented', chip: 'bg-amber-50 text-amber-800' },
      documented: { label: 'Documented', chip: 'bg-emerald-50 text-emerald-700' },
      no_show: { label: 'No-show', chip: 'bg-red-50 text-red-700' },
      cancelled: { label: 'Cancelled', chip: 'bg-stone-100 text-stone-500' }
    };
    const StateChip = ({ state }) => {
      const m = APPT_STATE_META[state] || APPT_STATE_META.scheduled;
      return <span className={`chip ${m.chip}`}>{m.label}</span>;
    };
    const LOCATION_LABELS = { home: 'Home visit', telehealth: 'Telehealth', office: 'Office' };

    // ── Drawn signature pad (same mechanism as the 3.4 ROI / portal co-sign) ──
    const SignaturePad = ({ padRef }) => {
      const canvasRef = useRef(null);
      const state = useRef({ drawing: false, empty: true });
      useEffect(() => {
        const canvas = canvasRef.current; if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const ratio = window.devicePixelRatio || 1;
        const w = canvas.offsetWidth || 400;
        canvas.width = w * ratio; canvas.height = 130 * ratio;
        ctx.scale(ratio, ratio);
        ctx.strokeStyle = '#033D50'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        state.current = { drawing: false, empty: true };
        const pos = (e) => { const r = canvas.getBoundingClientRect(); const s = e.touches ? e.touches[0] : e; return { x: s.clientX - r.left, y: s.clientY - r.top }; };
        const down = (e) => { state.current.drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
        const move = (e) => { if (!state.current.drawing) return; e.preventDefault && e.preventDefault(); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); state.current.empty = false; };
        const up = () => { state.current.drawing = false; };
        canvas.addEventListener('mousedown', down); canvas.addEventListener('mousemove', move);
        canvas.addEventListener('mouseup', up); canvas.addEventListener('mouseleave', up);
        canvas.addEventListener('touchstart', down, { passive: false });
        canvas.addEventListener('touchmove', move, { passive: false });
        canvas.addEventListener('touchend', up);
        padRef.current = {
          isEmpty: () => state.current.empty,
          toDataURL: () => canvas.toDataURL('image/png'),
          clear: () => { ctx.clearRect(0, 0, canvas.width, canvas.height); state.current.empty = true; }
        };
        return () => {
          canvas.removeEventListener('mousedown', down); canvas.removeEventListener('mousemove', move);
          canvas.removeEventListener('mouseup', up); canvas.removeEventListener('mouseleave', up);
          canvas.removeEventListener('touchstart', down); canvas.removeEventListener('touchmove', move);
          canvas.removeEventListener('touchend', up);
        };
      }, []);
      return (
        <div>
          <canvas ref={canvasRef} style={{ width: '100%', height: 130, background: '#FAF7F2', border: '1px solid #e5ddcb', borderRadius: 8, touchAction: 'none' }} />
          <button type="button" className="text-xs text-primary underline mt-1" onClick={() => padRef.current && padRef.current.clear()}>Clear signature</button>
        </div>
      );
    };

    // ── Pre-filled field wrapper: visibly marked until clinician-confirmed ──
    const Prefilled = ({ fieldKey, confirmed, onConfirm, children }) => {
      const isConfirmed = confirmed.includes(fieldKey);
      return (
        <div className={`rounded-lg p-2 ${isConfirmed ? '' : 'prefill'}`}>
          {children}
          {!isConfirmed && (
            <button type="button" className="prefill-badge mt-1 flex items-center gap-1" onClick={() => onConfirm(fieldKey)}>
              <i className="ti ti-alert-circle" /> FROM INTAKE — TAP TO CONFIRM
            </button>
          )}
          {isConfirmed && <span className="text-[9.5px] text-emerald-700 font-bold flex items-center gap-1 mt-1"><i className="ti ti-circle-check" /> CONFIRMED</span>}
        </div>
      );
    };

    const Field = ({ label, children, className }) => (
      <label className={`block ${className || ''}`}>
        <span className="lblu block mb-1">{label}</span>
        {children}
      </label>
    );

    const Login = ({ onLogin }) => {
      const [email, setEmail] = useState(''); const [password, setPassword] = useState('');
      const [err, setErr] = useState(''); const [busy, setBusy] = useState(false);
      const submit = (e) => {
        e.preventDefault(); setBusy(true); setErr('');
        api.login(email, password).then(r => {
          localStorage.setItem('admin_token', r.token);
          localStorage.setItem('admin_user', JSON.stringify(r.user));
          onLogin(r.user);
        }).catch(e => { setErr(e.message); setBusy(false); });
      };
      return (
        <div className="min-h-screen flex items-center justify-center p-6">
          <form onSubmit={submit} className="card p-8 w-full max-w-sm">
            <img src="/brand/logo-mark-transparent.png" alt="" className="h-12 mb-3" />
            <h1 className="serif text-2xl text-primary font-semibold mb-1">Clinical Workspace</h1>
            <p className="text-xs text-stone-500 mb-5">Authorized clinical staff only. All access is logged.</p>
            <Field label="Email"><input className="inp" type="email" value={email} onChange={e => setEmail(e.target.value)} required /></Field>
            <div className="h-3" />
            <Field label="Password"><input className="inp" type="password" value={password} onChange={e => setPassword(e.target.value)} required /></Field>
            {err && <p className="text-red-600 text-xs mt-3">{err}</p>}
            <button className="btn w-full justify-center mt-5" disabled={busy}>{busy ? 'Signing in…' : 'Sign in'}</button>
          </form>
        </div>
      );
    };

    // ── The chart's documents ──
    //
    // Fed by chart.chartDocuments, not by the FHIR read: OpenEMR returns nothing
    // for documents on this instance, so a panel wired to that read shows an
    // empty chart for a patient whose record is full. Rows carry where they can
    // be read from, and an EMR row that cannot be opened here SAYS SO rather
    // than being dropped — a missing row reads as "no such document".
    // Scanning into the chart (2026-09-22, owner-directed). Until now the
    // clinical area had NO file input at all — a document handed over at a home
    // visit, or faxed by a doctor's office, had nowhere to go from here.
    //
    // It files into the CLIENT's document store, the same one the enrollment
    // screen and the client's portal read, so a scan taken at the bedside ticks
    // the office's checklist and the client sees it. A second clinical-only
    // store would mean the office chasing a document a clinician already holds.
    const ChartScanIn = ({ clientId, onFiled }) => {
      const [kinds, setKinds] = useState(null);
      const [kind, setKind] = useState('');
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState(null);
      useEffect(() => {
        let live = true;
        api.documentKinds(clientId)
          .then(r => {
            if (!live) return;
            const list = (r && r.catalog) || [];
            setKinds(list);
            // The page names no document kind of its own — the catalog is
            // served, so the picker cannot drift from the validator that
            // refuses one it does not know.
            if (list.length) setKind(list[0].kind);
          })
          .catch(e => { if (live) setMsg({ ok: false, text: e.message }); });
        return () => { live = false; };
      }, [clientId]);

      const pick = (file) => {
        if (!file || !kind) return;
        setBusy(true); setMsg(null);
        const reader = new FileReader();
        reader.onload = () => {
          api.fileClientDocument(clientId, { kind, fileName: file.name, fileDataB64: String(reader.result) })
            .then(r => { setMsg({ ok: true, text: r.message }); onFiled && onFiled(); })
            .catch(e => setMsg({ ok: false, text: e.message }))
            .finally(() => setBusy(false));
        };
        reader.onerror = () => { setMsg({ ok: false, text: 'That file could not be read.' }); setBusy(false); };
        reader.readAsDataURL(file);
      };

      return (
        <div className="border-t border-stone-100 mt-3 pt-3">
          <div className="text-[13px] font-semibold text-primary mb-2">Scan a document into this file</div>
          <div className="flex flex-wrap items-center gap-2">
            <select className="inp max-w-[260px]" value={kind} disabled={busy || !kinds} onChange={e => setKind(e.target.value)}>
              {(kinds || []).map(k => <option key={k.kind} value={k.kind}>{k.label}</option>)}
            </select>
            <label className={`btn ghost ${busy || !kind ? 'opacity-50' : 'cursor-pointer'}`}>
              <i className="ti ti-scan" />{busy ? 'Filing…' : 'Choose file'}
              <input type="file" className="hidden" accept=".pdf,.jpg,.jpeg,.png" disabled={busy || !kind}
                onChange={e => { pick((e.target.files || [])[0]); e.target.value = ''; }} />
            </label>
          </div>
          {!kinds && !msg && <p className="text-[11px] text-stone-400 mt-2">Reading the document list…</p>}
          <p className="text-[11px] text-stone-400 mt-2">
            Filed to the client's documents — it ticks the office checklist and the client sees it on their portal.
            PDF, JPG or PNG.
          </p>
          {msg && <p className={`text-xs mt-1 ${msg.ok ? 'text-emerald-700' : 'text-red-600'}`}>{msg.text}</p>}
        </div>
      );
    };

    // ── Reading a document into proposals, from the CHART (2026-09-23) ─────
    // The same three routes the enrollment screen uses, registered a second
    // time under requireClinicalWrite. A clinician filing a referral or a face
    // sheet at a visit reads it where they are, instead of going to the
    // enrollment screen for it — and what comes back goes through exactly the
    // review a staff-triggered read goes through.
    //
    // NOTHING ABOUT WHAT AN EXTRACTION IS LIVES HERE. The allow-list, the
    // identity-conflict guard, the stale-field refusal and the staff-verified
    // provenance are all server-side and shared; this renders the answer.
    const ChartExtractionRow = ({ row, decision, onDecide }) => {
      const [edited, setEdited] = useState(row.value);
      useEffect(() => { setEdited(row.value); }, [row.value]);
      const isEdit = decision && decision.decision === 'edit';
      return (
        <div className="border-b border-stone-100 py-2 last:border-0">
          <div className="flex items-start justify-between gap-2 flex-wrap">
            <div className="min-w-0">
              <div className="lblu">{row.label}</div>
              <div className="text-[13px] text-stone-800 break-words">
                {isEdit
                  ? <input className="inp !py-1 text-[13px]" value={edited}
                    onChange={e => { setEdited(e.target.value); onDecide(row.path, { decision: 'edit', value: e.target.value }); }} />
                  : row.value}
              </div>
              <div className="text-[11px] text-stone-500">
                {[row.current ? `on file: ${row.current}` : 'nothing on file',
                  row.confidence != null ? `${Math.round(row.confidence * 100)}% confident` : null
                ].filter(Boolean).join(' · ')}
              </div>
            </div>
            <div className="flex gap-1.5 shrink-0">
              {[['accept', 'Keep'], ['edit', 'Edit'], ['discard', 'Discard']].map(([d, label]) => (
                <button key={d}
                  className={`chip border ${decision && decision.decision === d ? 'bg-primary text-white border-primary' : 'bg-white text-stone-600 border-stone-200'}`}
                  onClick={() => onDecide(row.path, d === 'edit' ? { decision: 'edit', value: edited } : { decision: d })}>
                  {label}
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    };

    const ChartExtractionReview = ({ clientId, extraction, onDone, onCancel }) => {
      const [decisions, setDecisions] = useState({});
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState('');
      const decide = (path, d) => setDecisions(prev => ({ ...prev, [path]: d }));
      const rows = (extraction.rows || []).filter(r => !r.verifyOnly);
      // A review with anything undecided is NOT complete — an enrollment must
      // not finish on a half-read scan. The server enforces it; saying so here
      // stops somebody hitting a refusal they could have seen coming.
      const undecided = rows.filter(r => !decisions[r.path]).length;
      const save = () => {
        setBusy(true); setErr('');
        api.reviewExtraction(clientId, extraction.id, decisions)
          .then(() => onDone())
          .catch(e => setErr(e.message))
          .finally(() => setBusy(false));
      };
      return (
        <div className="border border-accent rounded-lg p-3 bg-cream mt-2">
          <div className="flex items-center justify-between gap-2">
            <div className="font-semibold text-[13px] text-primary">Read from {extraction.fileName || 'the document'}</div>
            <button className="text-[11.5px] text-stone-500 underline" onClick={onCancel}>Close</button>
          </div>
          <p className="text-[11.5px] text-stone-600 mt-1">
            Nothing here has been saved. Check each value — what you keep is recorded as checked by you.
          </p>
          {extraction.source === 'ocr' && (
            <div className="text-[11.5px] text-amber-900 bg-amber-50 border border-amber-200 rounded p-2 mt-2">
              <b>Read from a picture.</b> This document had no text in it, so the words were recognised from the
              image{extraction.ocrConfidence ? ` (about ${Math.round(extraction.ocrConfidence)}% legible)` : ''}.
              Check every character before you keep it.
            </div>
          )}
          {extraction.reader === 'template' && extraction.source !== 'ocr' && (
            <p className="text-[11.5px] text-stone-500 mt-1">Read from the document's own text by matching its printed labels.</p>
          )}
          {extraction.readNotice && (
            <div className="text-[11.5px] text-amber-900 bg-amber-50 border border-amber-200 rounded p-2 mt-2">
              <b>Not all of this document was read.</b> {extraction.readNotice}
            </div>
          )}
          {(extraction.identityConflicts || []).length > 0 && (
            <div className="text-[12px] text-red-800 bg-red-50 border border-red-200 rounded p-2 mt-2">
              <b>This document may not be about this patient.</b>
              {extraction.identityConflicts.map((c, i) => (
                <div key={i}>{c.label}: document says <b>{c.value}</b>, record says <b>{c.current || '—'}</b></div>
              ))}
            </div>
          )}
          <div className="mt-2">
            {rows.map(r => (
              <ChartExtractionRow key={r.path} row={r} decision={decisions[r.path]} onDecide={decide} />
            ))}
            {!rows.length && <p className="text-[12px] text-stone-500">Nothing in this document matched a field we record.</p>}
          </div>
          {err && <p className="text-[11.5px] text-red-600 mt-1">{err}</p>}
          {rows.length > 0 && (
            <div className="flex items-center gap-2 mt-2">
              <button className="btn gold !py-1 !px-3 text-xs" disabled={busy || undecided > 0} onClick={save}>
                {busy ? 'Saving…' : 'Save what I kept'}
              </button>
              {undecided > 0 && <span className="text-[11.5px] text-stone-500">{undecided} still to decide</span>}
            </div>
          )}
        </div>
      );
    };

    const ChartReadButton = ({ clientId, doc, status, onRead }) => {
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState('');
      const access = useContext(AccessContext);
      // Only an UPLOAD can be read, and only a kind the server declares. Both
      // facts are SERVED — a page that decides either drifts from the module
      // that refuses one.
      if (!access.canWrite || !status || !doc.uploadId) return null;
      if (!doc.kind || !(status.extractableKinds || []).includes(doc.kind)) return null;
      if (!status.available) {
        return <span className="chip bg-stone-100 text-stone-500" title={(status.blockers || []).join('\n')}>Reading not switched on</span>;
      }
      const run = () => {
        setBusy(true); setErr('');
        api.extractDocument(clientId, doc.uploadId)
          .then(r => onRead({ ...r.extraction, fileName: doc.title }))
          .catch(e => setErr(e.message))
          .finally(() => setBusy(false));
      };
      return (
        <span className="flex items-center gap-1.5">
          <button className="chip border border-accent text-primary bg-white" disabled={busy} onClick={run}>
            {busy ? 'Reading…' : 'Read this'}
          </button>
          {err && <span className="text-[11px] text-red-600">{err}</span>}
        </span>
      );
    };

    const ChartDocuments = ({ docs, clientId, onRefresh }) => {
      const [busy, setBusy] = useState('');
      const [err, setErr] = useState('');
      // Which kinds can be read, and whether reading is on at all. ASKED OF THE
      // SERVER: a page that lists the readable kinds itself drifts from the
      // module that refuses one.
      const [readStatus, setReadStatus] = useState(null);
      const [reviewing, setReviewing] = useState(null);
      useEffect(() => {
        if (!clientId) return;
        let live = true;
        api.extractionStatus(clientId).then(r => { if (live) setReadStatus(r); }).catch(() => {});
        return () => { live = false; };
      }, [clientId]);

      const open = async (d) => {
        if (!d.openable || !clientId) return;
        setBusy(d.id); setErr('');
        try {
          const res = await fetch(`${API_URL}/api/clinical/patients/${clientId}/documents/${encodeURIComponent(d.id)}/file`, {
            headers: { 'Authorization': `Bearer ${getToken()}` }
          });
          if (!res.ok) {
            let msg = 'That document could not be opened.';
            try { const j = await res.json(); msg = j.error || msg; } catch (e) { /* non-JSON body */ }
            setErr(msg); return;
          }
          const ct = res.headers.get('content-type') || '';
          // A record release hands back its filed Drive reference rather than
          // re-rendering, so what a clinician reads is what the provider got.
          if (ct.includes('application/json')) {
            const j = await res.json();
            if (j.url) window.open(j.url, '_blank');
            else setErr('No stored copy of that document.');
            return;
          }
          const url = URL.createObjectURL(await res.blob());
          window.open(url, '_blank');
          setTimeout(() => URL.revokeObjectURL(url), 60000);
        } catch (e) { setErr('That document could not be opened.'); }
        finally { setBusy(''); }
      };

      // Grouped by what the document IS, which is how a clinician looks for one.
      const order = ['Plan of care', 'Consent', 'Record release', 'From the client', 'In the EMR'];
      const groups = order
        .map(g => ({ name: g, rows: docs.filter(d => d.category === g) }))
        .filter(g => g.rows.length);

      return (
        <div className="card mb-4">
          <div className="card-h">
            <h2><i className="ti ti-files mr-1 text-accent" />Documents</h2>
            <span className="chip bg-stone-100 text-stone-600">{docs.length}</span>
          </div>
          <div className="p-4 text-sm">
            {err && <p className="text-red-600 text-xs mb-2">{err}</p>}
            {docs.length === 0 && <p className="text-stone-400 text-xs">No documents on file for this patient.</p>}
            {groups.map(g => (
              <div key={g.name} className="mb-3 last:mb-0">
                <div className="text-[11px] uppercase tracking-wide text-stone-400 font-medium mb-1">{g.name}</div>
                {g.rows.map(d => (
                  <div key={d.id} className="flex items-start justify-between gap-3 border-b border-stone-100 py-1.5 last:border-0">
                    <div className="min-w-0">
                      {d.openable ? (
                        <button className="text-left text-accent hover:underline disabled:opacity-50"
                          disabled={busy === d.id} onClick={() => open(d)}>
                          {busy === d.id ? 'Opening…' : d.title}
                        </button>
                      ) : <span className="text-stone-700">{d.title}</span>}
                      <div className="text-xs text-stone-400">
                        {[d.date && fmtDate(d.date), d.note].filter(Boolean).join(' · ')}
                      </div>
                    </div>
                    <div className="shrink-0 flex items-center gap-1.5">
                      {d.filedBy && <span className="chip bg-stone-100 text-stone-600">{d.filedBy === 'staff' ? 'Filed by the office' : 'From the client'}</span>}
                      {d.inChart && <span className="chip bg-emerald-50 text-emerald-700">In EMR</span>}
                      {!d.openable && <span className="chip bg-amber-50 text-amber-800">Open in OpenEMR</span>}
                      <ChartReadButton clientId={clientId} doc={d} status={readStatus}
                        onRead={(ex) => setReviewing(ex)} />
                    </div>
                  </div>
                ))}
                {reviewing && g.rows.some(d => d.uploadId === reviewing.docId) && (
                  <ChartExtractionReview clientId={clientId} extraction={reviewing}
                    onDone={() => { setReviewing(null); onRefresh && onRefresh(); }}
                    onCancel={() => setReviewing(null)} />
                )}
              </div>
            ))}
          </div>
          {clientId && <ChartScanIn clientId={clientId} onFiled={onRefresh} />}
        </div>
      );
    };

    // ── Chart summary tab ──
    // Place of service, READ-ONLY. Both halves of it — the facility (WHERE)
    // and the encounter type (WHAT) — are set by an admin on the enrollment
    // record, moved there on the owner's instruction 2026-09-23. The owner's
    // 4.5 rule is that a clinician never chooses a POS, and an encounter type
    // that decides one is the same decision; so the chart states what the
    // claim will say and names the screen where it is fixed. It reads the SAME
    // route the enrollment card writes through, so the two cannot drift.
    const PlaceOfServiceCard = ({ patient }) => {
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      useEffect(() => {
        let live = true;
        setData(null); setErr(null);
        api.placeOfService(patient.id)
          .then(d => { if (live) setData(d); })
          .catch(e => { if (live) setErr(e.message); });
        return () => { live = false; };
      }, [patient.id]);
      if (err) return (
        <div className="card mb-4"><div className="card-h"><h2><i className="ti ti-building-hospital mr-1 text-accent" />Place of service</h2></div>
          <div className="p-4 text-xs text-red-600">{err}</div></div>
      );
      if (!data) return (
        <div className="card mb-4"><div className="card-h"><h2><i className="ti ti-building-hospital mr-1 text-accent" />Place of service</h2></div>
          <div className="p-4 text-[11px] text-stone-400">Reading…</div></div>
      );
      const assigned = !!data.facilityId;
      const agree = data.agreement || { ok: true };
      const posMissing = assigned && !data.posCode;
      const ok = assigned && !posMissing && data.serviceLocation !== false && agree.ok;
      return (
        <div className="card mb-4">
          <div className="card-h">
            <h2><i className="ti ti-building-hospital mr-1 text-accent" />Place of service</h2>
            {ok
              ? <span className="chip bg-emerald-50 text-emerald-700">POS {data.posCode}</span>
              : <span className="chip bg-amber-50 text-amber-800">Blocks signing</span>}
          </div>
          <div className="p-4 text-sm grid gap-2">
            <div className="text-xs text-stone-600">
              {assigned
                ? <>Seen at <b>{data.facilityName || `facility ${data.facilityId}`}</b>{data.posCode ? <> · place of service <b>{data.posCode}</b></> : null}.</>
                : <b className="text-amber-800">This patient is not assigned to an OpenEMR facility, so their visits cannot be signed.</b>}
            </div>
            <div className="text-xs text-stone-600">
              {data.usualLocation
                ? <>Usually seen at <b>{data.usualLocationLabel}</b>. Each visit says where it actually happened, and that is what bills.</>
                : <>No usual location set, so every booking has to say where the visit happens.</>}
            </div>
            {posMissing && (
              <p className="text-xs text-amber-700"><i className="ti ti-alert-triangle mr-1" />
                "{data.facilityName}" has no place-of-service code on its record in OpenEMR.
              </p>
            )}
            {data.serviceLocation === false && (
              <p className="text-xs text-amber-700"><i className="ti ti-alert-triangle mr-1" />
                "{data.facilityName}" is not marked as a Service Location in OpenEMR, so no encounter can be assigned there.
              </p>
            )}
            {!agree.ok && <p className="text-xs text-red-600"><i className="ti ti-alert-triangle mr-1" />{agree.error}</p>}
            <p className="text-[11px] text-stone-400">
              An admin sets both of these on the enrollment record (Enrollment → this client → Place of service).
              It decides the place of service on the claim, so it is not a clinician's pick.
            </p>
          </div>
        </div>
      );
    };

    // The clinical inbox — what is waiting on a clinician. Every row says WHO
    // it is waiting on, because a count that does not is a number nobody can
    // act on. Whether YOU can act on a row is decided by the server against
    // the same matrix the routes enforce, never re-derived here.
    const INBOX_ICONS = {
      encounter_co_sign: 'ti-writing-sign',
      order_co_sign: 'ti-flask',
      care_plan_co_sign: 'ti-clipboard-heart',
      visit_log_review: 'ti-notes',
      encounter_unsigned: 'ti-file-pencil'
    };
    const InboxView = ({ onOpenEncounter, onOpenChart }) => {
      const [data, setData] = useState(null);
      const [err, setErr] = useState('');
      const [mineOnly, setMineOnly] = useState(true);
      const load = () => api.inbox().then(r => { setData(r); setErr(''); }).catch(e => setErr(e.message));
      useEffect(() => { load(); }, []);
      if (err) return <div className="p-6"><p className="text-sm text-red-600">{err}</p></div>;
      if (!data) return <div className="p-10 text-stone-400 text-sm">Loading your inbox…</div>;
      const shown = mineOnly ? data.items.filter(i => i.actionable) : data.items;
      const c = data.counts;
      return (
        <div className="p-4 lg:p-7">
          <div className="flex flex-wrap items-center gap-2 mb-4">
            <div className="serif text-lg text-primary font-semibold">Inbox</div>
            {c.overdue > 0 && <span className="chip bg-red-50 text-red-700">{c.overdue} overdue</span>}
            <span className="chip bg-primary-50 text-primary">{c.actionable} waiting on you</span>
            <span className="chip bg-stone-100 text-stone-600">{c.total} in total</span>
            <div className="flex rounded-lg border border-stone-200 overflow-hidden ml-auto">
              <button className={`px-3 py-1.5 text-xs font-semibold ${mineOnly ? 'bg-primary text-white' : 'bg-white text-primary'}`}
                onClick={() => setMineOnly(true)}>Waiting on me</button>
              <button className={`px-3 py-1.5 text-xs font-semibold ${!mineOnly ? 'bg-primary text-white' : 'bg-white text-primary'}`}
                onClick={() => setMineOnly(false)}>Everything</button>
            </div>
            <button className="btn ghost !py-1.5" onClick={load}><i className="ti ti-refresh" />Refresh</button>
          </div>
          {!shown.length && (
            <div className="card p-6 text-sm text-stone-500">
              {mineOnly
                ? (c.total ? `Nothing is waiting on you. ${c.total} item${c.total > 1 ? 's are' : ' is'} waiting on someone else — switch to Everything to see them.`
                           : 'Nothing is waiting on you.')
                : 'Nothing is waiting on anyone.'}
            </div>
          )}
          <div className="grid gap-2">
            {shown.map(i => (
              <div key={`${i.kind}:${i.id}`} className={`card p-3 flex flex-wrap items-center gap-3 ${i.overdue ? 'border-red-200' : ''}`}>
                <i className={`ti ${INBOX_ICONS[i.kind] || 'ti-inbox'} text-accent text-lg`} />
                <div className="min-w-0 flex-1">
                  <div className="text-[13px] font-semibold text-primary">
                    {i.label}
                    {i.overdue && <span className="chip bg-red-50 text-red-700 ml-2">Overdue</span>}
                  </div>
                  <div className="text-xs text-stone-500">
                    {i.patientName || 'Unknown patient'} · {i.at ? fmtTs(i.at) : 'no date'}
                    {i.dueAt ? ` · due ${fmtTs(i.dueAt)}` : ''}
                  </div>
                  {i.detail && <div className="text-[11px] text-stone-400 mt-0.5">{i.detail}</div>}
                </div>
                <span className={`chip ${i.actionable ? 'bg-amber-50 text-amber-800' : 'bg-stone-100 text-stone-500'}`}>
                  {i.actionable ? 'Waiting on you' : `Waiting on ${i.waitingOn}`}
                </span>
                {i.encounterUuid
                  ? <button className="btn ghost !py-1.5" onClick={() => onOpenEncounter(i.clientId, i.encounterUuid)}>Open encounter</button>
                  : <button className="btn ghost !py-1.5" onClick={() => onOpenChart(i.clientId)}>Open chart</button>}
              </div>
            ))}
          </div>
        </div>
      );
    };

    // ── Session 4.12 — the persistent patient banner (Scope C) ─────────────
    // Never a tab. It sits above every chart tab and every encounter step, so
    // name, age, DOB, MRN, MBI and allergies are on screen at a front door
    // instead of buried a click away. Every value is SERVED — the page decides
    // no clinical fact of its own, so the strip cannot drift from the record.
    //
    // The allergy strip has three states and they are three different
    // sentences. An empty strip must never be what says "none on file", and a
    // strip reading "No known allergies" when the list simply failed to load is
    // worse still: it tells a clinician something untrue at the moment it
    // matters most. See clinicalRepository.buildAllergyStrip.
    const AllergyStrip = ({ allergies }) => {
      const a = allergies || { state: 'unavailable', rows: [], reason: 'No allergy information was returned.' };
      if (a.state === 'listed') {
        return (
          <div className="bg-red-50 border border-red-200 text-red-800 rounded-lg px-3 py-1.5 text-[12.5px] font-semibold flex items-start gap-2">
            <i className="ti ti-alert-triangle-filled mt-[1px] shrink-0" />
            <span className="min-w-0">
              {a.rows.join(' · ').toUpperCase()}
              {a.source === 'intake' && <span className="font-normal normal-case"> — reported at intake, not reconciled</span>}
            </span>
          </div>
        );
      }
      if (a.state === 'none_known') {
        return (
          <div className="bg-stone-50 border border-stone-200 text-stone-600 rounded-lg px-3 py-1.5 text-[12.5px] font-semibold flex items-center gap-2">
            <i className="ti ti-circle-check" />No known allergies
          </div>
        );
      }
      return (
        <div className="bg-amber-50 border border-amber-300 text-amber-900 rounded-lg px-3 py-1.5 text-[12.5px] flex items-start gap-2">
          <i className="ti ti-alert-circle mt-[1px] shrink-0" />
          <span className="min-w-0"><b>Allergies unknown.</b> {a.reason}</span>
        </div>
      );
    };

    const BannerFact = ({ label, value, children }) => (
      <div className="min-w-0">
        <div className="lblu">{label}</div>
        <div className="text-[12.5px] text-stone-700 break-words">{children || value || '—'}</div>
      </div>
    );

    // The home-visit standing facts (Scope F4). Read from the PATIENT record —
    // never from an encounter — so they survive to the next visit and to the
    // covering clinician who has never been to the house.
    const HomeVisitFacts = ({ homeVisit, fields }) => {
      const hv = homeVisit || {};
      const rows = (fields || []).filter(([k]) => hv[k]);
      if (!rows.length) return null;
      return (
        <div className="bg-cream border border-creamdeep rounded-lg p-3 grid grid-cols-1 sm:grid-cols-2 gap-3">
          {rows.map(([k, label]) => (
            <div key={k} className="min-w-0">
              <div className="lblu">{label}</div>
              <div className="text-[12.5px] text-stone-700 break-words">{hv[k]}</div>
            </div>
          ))}
        </div>
      );
    };

    const HomeVisitEditor = ({ patient, homeVisit, fields, onSaved }) => {
      const [open, setOpen] = useState(false);
      const [f, setF] = useState(homeVisit || {});
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState(null);
      useEffect(() => { setF(homeVisit || {}); }, [homeVisit]);
      const save = () => {
        setBusy(true); setMsg(null);
        api.saveHomeVisit(patient.id, f)
          .then(r => { setMsg({ ok: true, text: r.message }); setOpen(false); onSaved && onSaved(r.homeVisit); })
          .catch(e => setMsg({ ok: false, text: e.message }))
          .finally(() => setBusy(false));
      };
      if (!open) {
        return (
          <div>
            <button className="btn ghost !py-1 !px-2.5 text-[11.5px]" onClick={() => setOpen(true)}>
              <i className="ti ti-home-edit" />{(fields || []).some(([k]) => (homeVisit || {})[k]) ? 'Edit home visit notes' : 'Add home visit notes'}
            </button>
            {msg && <p className={`text-[11.5px] mt-1 ${msg.ok ? 'text-emerald-700' : 'text-red-600'}`}>{msg.text}</p>}
          </div>
        );
      }
      return (
        <div className="border border-creamdeep rounded-lg p-3 bg-white">
          <p className="text-[11.5px] text-stone-500 mb-2">
            These stay on the patient, so they are here at the next visit and for whoever covers. Record what changed
            <i> today</i> in the visit note instead.
          </p>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {(fields || []).map(([k, label]) => (
              <Field key={k} label={label}>
                <textarea className="inp" rows="2" value={f[k] || ''} onChange={e => setF({ ...f, [k]: e.target.value })} />
              </Field>
            ))}
          </div>
          <div className="flex gap-2 mt-3">
            <button className="btn gold !py-1.5 !px-3 text-xs" disabled={busy} onClick={save}>{busy ? 'Saving…' : 'Save'}</button>
            <button className="btn ghost !py-1.5 !px-3 text-xs" disabled={busy} onClick={() => { setF(homeVisit || {}); setOpen(false); }}>Cancel</button>
          </div>
          {msg && !msg.ok && <p className="text-[11.5px] mt-1 text-red-600">{msg.text}</p>}
        </div>
      );
    };

    const PatientBanner = ({ banner, patient, homeVisitFields, visitDraft, onStartVisit, onHomeVisitSaved }) => {
      const [open, setOpen] = useState(false);
      const access = useContext(AccessContext);
      const b = banner || {};
      const name = b.name || (patient && patient.name) || '—';
      // The identity line, and it never collapses — not on a phone, not on any
      // tab. It is the line that stops a note being written in the wrong chart.
      const idBits = [
        b.age != null ? `${b.age}` : null,
        b.sex || null,
        b.dob ? `DOB ${b.dob}` : null,
        b.mrn ? `MRN ${b.mrn}` : null,
        b.mbi ? `MBI ${b.mbi}` : null
      ].filter(Boolean);
      const draftOpen = !!(visitDraft && visitDraft.open);
      return (
        <div className="bg-white border-b border-stone-200 px-4 lg:px-7 pt-3 pb-3">
          <div className="flex items-start gap-3">
            <div className="w-11 h-11 rounded-full bg-accent text-primary hidden sm:flex items-center justify-center font-bold border border-stone-200 shrink-0">{initials(name)}</div>
            <div className="min-w-0 flex-1">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="serif text-xl text-primary font-semibold leading-tight">{name}</span>
                {b.preferredName && <span className="text-[12px] text-stone-500">("{b.preferredName}")</span>}
                {b.codeStatus && <span className="chip bg-red-100 text-red-800">{b.codeStatus}</span>}
                {b.serviceLine && <span className="chip bg-primary text-white hidden sm:inline">{b.serviceLine}</span>}
                {b.activatedAt && <span className="chip bg-emerald-50 text-emerald-700 hidden sm:inline">ACTIVATED</span>}
              </div>
              <div className="text-[12px] text-stone-600 mt-0.5 break-words">{idBits.length ? idBits.join(' • ') : 'No identifiers on file'}</div>
            </div>
            {onStartVisit && access.canWrite && (
              <button className={`btn ${draftOpen ? 'gold' : ''} !py-1.5 !px-3 text-xs shrink-0`} onClick={onStartVisit}>
                <i className={`ti ${draftOpen ? 'ti-writing' : 'ti-player-play'}`} />{draftOpen ? 'Resume draft' : 'Start visit'}
              </button>
            )}
          </div>
          <div className="mt-2"><AllergyStrip allergies={b.allergies} /></div>
          <button className="text-[11.5px] text-primary font-semibold mt-2 flex items-center gap-1" onClick={() => setOpen(!open)}>
            <i className={`ti ti-chevron-${open ? 'up' : 'down'}`} />{open ? 'Hide details' : 'Address, contacts, insurance'}
          </button>
          {open && (
            <div className="mt-2 space-y-3">
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                <BannerFact label="Home address">
                  {b.address && (b.address.line1 || b.address.city)
                    ? <span>{[b.address.line1, b.address.line2].filter(Boolean).join(', ')}<br />{[b.address.city, b.address.state, b.address.zip].filter(Boolean).join(' ')}</span>
                    : (b.addressLine || '—')}
                </BannerFact>
                <BannerFact label="Phone" value={b.phone} />
                <BannerFact label={`Responsible party${b.responsibleParty && b.responsibleParty.relationship ? ` · ${b.responsibleParty.relationship}` : ''}`}>
                  {b.responsibleParty && b.responsibleParty.name
                    ? <span>{b.responsibleParty.name}{b.responsibleParty.phone ? <><br />{b.responsibleParty.phone}</> : null}{b.responsibleParty.authority ? <><br /><span className="text-stone-500">{b.responsibleParty.authority}</span></> : null}</span>
                    : '—'}
                </BannerFact>
                <BannerFact label="Existing PCP">
                  {b.pcp && b.pcp.name
                    ? <span>{b.pcp.name}{b.pcp.practice ? <><br />{b.pcp.practice}</> : null}{b.pcp.phone ? <><br />{b.pcp.phone}</> : null}</span>
                    : '—'}
                </BannerFact>
                <BannerFact label="Insurance">
                  <span>
                    {(b.insurance && b.insurance.primary) || '—'}
                    {b.insurance && b.insurance.secondary ? <><br /><span className="text-stone-500">2nd: {b.insurance.secondary}</span></> : null}
                    {b.insurance && b.insurance.medicareAdvantage ? <><br /><span className="chip bg-amber-100 text-amber-800">MEDICARE ADVANTAGE</span></> : null}
                    {b.insurance && b.insurance.qmb ? <><br /><span className="chip bg-amber-100 text-amber-800">QMB</span></> : null}
                  </span>
                </BannerFact>
                <BannerFact label="Facility &amp; POS">
                  {b.facility && b.facility.name
                    ? <span>{b.facility.name}<br />POS {b.facility.posCode || <span className="text-amber-700">not set</span>}</span>
                    : <span className="text-amber-700">Not assigned — visits cannot be signed</span>}
                </BannerFact>
                <BannerFact label="Last visit" value={b.lastVisitAt} />
                <BannerFact label="Track" value={b.careTierLabel} />
              </div>
              <HomeVisitFacts homeVisit={b.homeVisit} fields={homeVisitFields} />
              {access.canWrite && (
                <HomeVisitEditor patient={patient} homeVisit={b.homeVisit} fields={homeVisitFields} onSaved={onHomeVisitSaved} />
              )}
            </div>
          )}
        </div>
      );
    };

    // ── Session 4.12 Scope D — CHART NAVIGATION: PLACES, NOT ACTIONS ───────
    // Every tab is somewhere in the record. No workflow is a tab: the H&P opens
    // as a visit from the banner, and med reconciliation is a step inside the
    // encounter and a section under MEDICATIONS rather than a sibling of it.
    //
    // ChartSection and chartRow live at MODULE scope so every place can render
    // the same way. A component declared inside another is a new function
    // identity on every render, which remounts it and loses the caret — the
    // trap test/react_input_focus.test.js exists to catch.
    const ChartSection = ({ title, data, render, icon, linked, children }) => (
      <div className="card mb-4">
        <div className="card-h"><h2><i className={`ti ${icon} mr-1 text-accent`} />{title}</h2>
          {/* A pending org-level read grant is a setup step, not a fault —
              badge it differently so a real failure still stands out. */}
          {data && !data.ok && data.permissionPending && <span className="chip bg-amber-50 text-amber-800">Not enabled yet</span>}
          {data && !data.ok && !data.permissionPending && <span className="chip bg-red-50 text-red-700">EMR read failed</span>}
        </div>
        <div className="p-4 text-sm">
          {children}
          {!linked && <p className="text-stone-400 text-xs">Link this patient to OpenEMR to read live data.</p>}
          {linked && data && data.ok && data.rows.length === 0 && <p className="text-stone-400 text-xs">Nothing on file in OpenEMR.</p>}
          {linked && data && data.ok && data.rows.map((r, i) => render(r, i))}
          {linked && data && !data.ok && data.permissionPending && (
            <p className="text-amber-800 text-xs">
              OpenEMR has not granted this app org-level read access to {title.toLowerCase()} yet.
              An administrator enables it under Administration → Access → the <code className="font-mono">gfc-app-api</code> group.
              Nothing is wrong with this patient's record.
            </p>
          )}
          {linked && data && !data.ok && !data.permissionPending && <p className="text-red-600 text-xs">{data.error}</p>}
        </div>
      </div>
    );

    const chartRow = (main, sub, right, key) => (
      <div key={key} className="flex items-start justify-between py-1.5 border-b border-stone-100 last:border-0 gap-2">
        <div className="min-w-0"><div className="font-semibold text-[13px]">{main}</div>{sub && <div className="text-xs text-stone-500">{sub}</div>}</div>
        {right && <span className="chip bg-primary-50 text-primary shrink-0">{right}</span>}
      </div>
    );

    // An empty place says so in a sentence. A blank panel and a place with
    // nothing in it are indistinguishable, and only one of them is correct —
    // the rule the clinical inbox set and Scope I3 restates for navigation.
    const EmptyPlace = ({ children }) => (
      <div className="card p-6 text-center text-sm text-stone-500">{children}</div>
    );

    const ProblemsTab = ({ chart }) => {
      const emr = (chart && chart.emr) || {};
      return <ChartSection title="Problem list" icon="ti-list-details" data={emr.problems} linked={chart && chart.linked}
        render={(r, i) => chartRow(r.title, [r.code, r.onset && `since ${fmtDate(r.onset)}`].filter(Boolean).join(' · '), r.status, i)} />;
    };

    const AllergiesTab = ({ chart }) => {
      const emr = (chart && chart.emr) || {};
      return (
        <div>
          {/* The same strip the banner carries, and deliberately the same
              component: two renderings of "what is this patient allergic to"
              is how the two start disagreeing. */}
          <div className="mb-4"><AllergyStrip allergies={chart && chart.banner && chart.banner.allergies} /></div>
          <ChartSection title="Allergies" icon="ti-alert-triangle" data={emr.allergies} linked={chart && chart.linked}
            render={(r, i) => chartRow(r.title, r.criticality && `criticality: ${r.criticality}`, r.status, i)} />
        </div>
      );
    };

    // D4: med reconciliation is a SECTION under MEDICATIONS, not a tab beside
    // it. Reconciling is something you do to the medication list; it is not a
    // different place in the record.
    const MedicationsTab = ({ chart, patient }) => {
      const emr = (chart && chart.emr) || {};
      return (
        <div>
          <ChartSection title="Medications" icon="ti-pill" data={emr.medications} linked={chart && chart.linked}
            render={(r, i) => chartRow(r.title, r.instructions || (r.authoredOn && fmtDate(r.authoredOn)), r.status, i)} />
          <MedRecTab patient={patient} />
        </div>
      );
    };

    // ── Session 4.12 Scope J — the rest of the record ──────────────────────
    // Nine resources the app had never asked OpenEMR for. EVERY SECTION SAYS
    // WHY IT IS EMPTY, which is the whole value of the screen: a 403 (the org
    // ACL, an admin fixes it), a 404 (8.4 does not serve this at all) and a
    // genuine zero rows have three different fixes and looked identical as a
    // blank panel. An empty result is not a diagnosis.
    //
    // The sections, their labels and the failure wording are all SERVED. The
    // page restates none of them, so a resource added or a message reworded
    // server-side reaches the screen without a second edit here.
    const RecordExtrasTab = ({ patient }) => {
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      useEffect(() => {
        let live = true;
        setData(null); setErr(null);
        api.recordExtras(patient.id)
          .then(d => { if (live) setData(d); })
          .catch(e => { if (live) setErr(e.message); });
        return () => { live = false; };
      }, [patient.id]);
      if (err) return <p className="text-sm text-red-600">{err}</p>;
      if (!data) return <p className="text-sm text-stone-500">Reading the rest of the record from OpenEMR…</p>;
      return (
        <div>
          {data.unproven && (
            <p className="text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-lg p-2.5 mb-4">
              <i className="ti ti-alert-triangle mr-1" />{data.unprovenNote}
            </p>
          )}
          {data.sections.map(sec => (
            <div className="card mb-4" key={sec.key}>
              <div className="card-h">
                <h2>{sec.label}</h2>
                {sec.failure
                  ? <span className="chip bg-amber-50 text-amber-800">could not be read</span>
                  : <span className="chip bg-stone-100 text-stone-600">{sec.rows.length}</span>}
              </div>
              <div className="p-4 text-sm">
                {/* The server's own sentence, naming the layer. A page that
                    wrote its own would be a second answer to why this failed. */}
                {sec.failure && <p className="text-xs text-amber-700">{sec.failure.message}</p>}
                {!sec.failure && sec.rows.length === 0 && (
                  <p className="text-xs text-stone-500">OpenEMR answered, and has nothing recorded here for this patient.</p>
                )}
                {!sec.failure && sec.rows.map((r, i) => (
                  <div key={r.id || i} className="py-1.5 border-b border-stone-100 last:border-0">
                    <div className="text-[13px] font-semibold">{fhirRowTitle(r)}</div>
                    <div className="text-xs text-stone-500">{fhirRowDetail(r)}</div>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      );
    };
    // Nine resource shapes, one renderer. FHIR puts a human-readable label in
    // a different place in almost every one of them, so the fallbacks are
    // walked in order and `text.div` is the last resort — which is where the
    // allergen turned out to live in 4.1, after every allergy in the chart
    // displayed as "Unknown" for months.
    const codeableText = (c) => c && (c.text || ((c.coding || [])[0] || {}).display || ((c.coding || [])[0] || {}).code);
    const fhirRowTitle = (r) => codeableText(r.vaccineCode) || codeableText(r.code) || codeableText(r.type)
      || r.description || r.name || (r.payor && codeableText(r.payor[0]))
      || (r.type && r.type.text) || (r.relationship && codeableText(r.relationship[0]))
      || (r.description && r.description.text)
      || String(r.resourceType || 'Record') + (r.id ? ` ${r.id}` : '');
    const fhirRowDetail = (r) => [
      r.status, r.occurrenceDateTime && fmtDate(r.occurrenceDateTime),
      r.performedDateTime && fmtDate(r.performedDateTime),
      r.period && r.period.start && `from ${fmtDate(r.period.start)}`,
      r.authored && fmtDate(r.authored),
      r.createdDateTime && fmtDate(r.createdDateTime),
      r.lotNumber && `lot ${r.lotNumber}`
    ].filter(Boolean).join(' · ') || '—';

    const DocumentsTab = ({ chart, patient, onChartChanged }) => (
      <ChartDocuments docs={(chart && chart.chartDocuments) || []} clientId={patient && patient.id} onRefresh={onChartChanged} />
    );

    // ---- Orders, Referrals, Imaging and Results, wired to what 4.10 built ---
    // Not placeholders. 4.10 shipped the orders, the requisitions, the referral
    // lifecycle and the results path with per-patient reads and no per-patient
    // PLACE to read them in.
    const useChartOrders = (clientId) => {
      const [data, setData] = useState(null);
      const [err, setErr] = useState('');
      const load = useCallback(() => {
        if (!clientId) return;
        api.patientOrders(clientId).then(r => { setData(r); setErr(''); }).catch(e => setErr(e.message));
      }, [clientId]);
      useEffect(() => { load(); }, [load]);
      return { data, err, reload: load };
    };

    const OrderList = ({ rows, empty, err }) => {
      if (err) return <div className="card p-4 text-sm text-red-600">{err}</div>;
      if (!rows) return <div className="card p-4 text-sm text-stone-500">Loading…</div>;
      if (!rows.length) return <EmptyPlace>{empty}</EmptyPlace>;
      return (
        <div className="card">
          <div className="p-4">
            {rows.map(o => (
              <div key={o.id} className="py-2 border-b border-stone-100 last:border-0">
                <div className="flex items-center justify-between gap-2 flex-wrap">
                  <span className="font-semibold text-[13px]">
                    {o.orderType === 'referral' ? (o.specialty || 'Referral')
                      : o.orderType === 'dme' ? (o.itemDescription || 'DME')
                        : ((o.tests && o.tests.join(', ')) || o.orderType)}
                  </span>
                  <span className="chip bg-primary-50 text-primary">{String(o.status || '').toUpperCase()}</span>
                </div>
                <div className="text-[11.5px] text-stone-500">
                  {[o.orderReference, o.priority, o.createdAt && fmtDate(o.createdAt)].filter(Boolean).join(' · ')}
                </div>
                {Array.isArray(o.sends) && o.sends.length > 0 && (
                  <div className="text-[11.5px] text-stone-500">
                    Last sent {fmtTs(o.sends[o.sends.length - 1].at)} to {o.sends[o.sends.length - 1].recipient || 'recipient not recorded'}
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    };

    const OrdersTab = ({ patient }) => {
      const { data, err } = useChartOrders(patient && patient.id);
      // Referrals and DME have their own places. This is the diagnostic half.
      const rows = data ? (data.orders || []).filter(o => !['referral'].includes(o.orderType)) : null;
      return <OrderList rows={rows} err={err}
        empty="No orders on this chart yet. Orders are placed from inside an encounter." />;
    };

    const ReferralsTab = ({ patient }) => {
      const { data, err } = useChartOrders(patient && patient.id);
      const rows = data ? (data.orders || []).filter(o => o.orderType === 'referral') : null;
      return <OrderList rows={rows} err={err}
        empty="No referrals on this chart yet. A referral is placed from inside an encounter." />;
    };

    // D3: IMAGING lists imaging orders AND the result documents attached to
    // them, so a study and its report are read in one place rather than two.
    const ImagingTab = ({ patient }) => {
      const { data, err } = useChartOrders(patient && patient.id);
      const [results, setResults] = useState(null);
      useEffect(() => {
        if (!patient || !patient.id) return;
        let live = true;
        api.patientResults(patient.id).then(r => { if (live) setResults(r.results || []); }).catch(() => { if (live) setResults([]); });
        return () => { live = false; };
      }, [patient && patient.id]);
      const rows = data ? (data.orders || []).filter(o => o.orderType === 'imaging') : null;
      if (err) return <div className="card p-4 text-sm text-red-600">{err}</div>;
      if (!rows) return <div className="card p-4 text-sm text-stone-500">Loading…</div>;
      if (!rows.length) return <EmptyPlace>No imaging on this chart yet.</EmptyPlace>;
      return (
        <div className="card"><div className="p-4">
          {rows.map(o => {
            const attached = (results || []).filter(r => String(r.orderId) === String(o.id));
            return (
              <div key={o.id} className="py-2 border-b border-stone-100 last:border-0">
                <div className="flex items-center justify-between gap-2 flex-wrap">
                  <span className="font-semibold text-[13px]">{(o.tests && o.tests.join(', ')) || 'Imaging'}</span>
                  <span className="chip bg-primary-50 text-primary">{String(o.status || '').toUpperCase()}</span>
                </div>
                <div className="text-[11.5px] text-stone-500">{[o.orderReference, o.createdAt && fmtDate(o.createdAt)].filter(Boolean).join(' · ')}</div>
                {attached.length === 0
                  ? <div className="text-[11.5px] text-stone-400 mt-0.5">No report attached yet.</div>
                  : attached.map(r => (
                    <div key={r.id} className="text-[11.5px] text-stone-700 mt-0.5">
                      <i className="ti ti-report-medical mr-1" />{r.label || r.documentName || 'Report'}
                      {r.interpretation ? ` — ${r.interpretation}` : ''}
                    </div>
                  ))}
              </div>
            );
          })}
        </div></div>
      );
    };

    const ResultsTab = ({ patient }) => {
      const [rows, setRows] = useState(null);
      const [err, setErr] = useState('');
      useEffect(() => {
        if (!patient || !patient.id) return;
        let live = true;
        api.patientResults(patient.id).then(r => { if (live) setRows(r.results || []); })
          .catch(e => { if (live) setErr(e.message); });
        return () => { live = false; };
      }, [patient && patient.id]);
      if (err) return <div className="card p-4 text-sm text-red-600">{err}</div>;
      if (!rows) return <div className="card p-4 text-sm text-stone-500">Loading…</div>;
      if (!rows.length) return <EmptyPlace>No results on this chart yet.</EmptyPlace>;
      return (
        <div className="card"><div className="p-4">
          {rows.map(r => (
            <div key={r.id} className="py-2 border-b border-stone-100 last:border-0">
              <div className="flex items-center justify-between gap-2 flex-wrap">
                <span className="font-semibold text-[13px]">{r.label || r.documentName || 'Result'}</span>
                <span className={`chip ${r.interpretation === 'critical' ? 'bg-red-100 text-red-800'
                  : r.interpretation === 'abnormal' ? 'bg-amber-100 text-amber-800' : 'bg-stone-100 text-stone-600'}`}>
                  {String(r.interpretation || 'unread').toUpperCase()}
                </span>
              </div>
              <div className="text-[11.5px] text-stone-500">
                {[r.receivedAt && fmtDate(r.receivedAt),
                  r.order && r.order.reference,
                  r.acknowledgedAt ? `acknowledged ${fmtDate(r.acknowledgedAt)}` : 'not yet acknowledged'
                ].filter(Boolean).join(' · ')}
