                  <i className="ti ti-calendar-smile text-3xl text-accent" />
                  <p className="text-sm text-stone-500 mt-1">No appointments {mode === 'day' ? 'this day' : 'this week'}{providerFilter ? ' for this provider' : ''}.</p>
                  <p className="text-xs text-stone-400">Book one with “New appointment” — it goes straight onto the OpenEMR calendar.</p>
                </div>
              )}
            </div>
          )}

          {picked && (
            <AppointmentDetail appt={picked} providers={providersData && providersData.providers}
              onClose={() => setPicked(null)} onChanged={changed}
              onOpenChart={onOpenChart}
              onReschedule={(a) => { setPicked(null); setModal({ mode: 'reschedule', appt: a }); }}
              onDocument={(a) => { setPicked(null); onDocument(a); }} />
          )}
          {modal && (
            <AppointmentModal mode={modal.mode} appt={modal.appt} patients={patients}
              providersData={providersData} defaultDate={anchor}
              defaultProviderId={providerFilter || (providersData && providersData.myProviderId)}
              onClose={() => setModal(null)} onSaved={changed} />
          )}
        </div>
      );
    };

    // Chart tab: this patient's upcoming + past appointments with
    // documented / no-show / not-yet-documented state (Scope B).
    const ApptsTab = ({ patient, patients, chart, onDocumentHp, onEncounterCreated }) => {
      const canWrite = useCanWrite();
      const [data, setData] = useState(null);
      const [err, setErr] = useState('');
      const [providersData, setProvidersData] = useState(null);
      const [picked, setPicked] = useState(null);
      const [modal, setModal] = useState(null);
      const [followUp, setFollowUp] = useState(null); // appt | 'plain'
      const load = useCallback(() => {
        api.patientAppointments(patient.id).then(r => { setData(r); setErr(''); }).catch(e => setErr(e.message));
      }, [patient.id]);
      useEffect(load, [load]);
      useEffect(() => { api.providers().then(setProvidersData).catch(() => {}); }, []);
      if (err) return <p className="text-red-600 text-sm p-4">{err}</p>;
      if (!data) return <p className="text-sm text-stone-500 p-4">Loading appointments from OpenEMR…</p>;
      const today = todayYmd();
      const upcoming = data.appointments.filter(a => a.date >= today && a.state === 'scheduled');
      const past = data.appointments.filter(a => !(a.date >= today && a.state === 'scheduled')).reverse();
      const changed = () => { setPicked(null); setModal(null); setFollowUp(null); load(); };
      const documentFrom = (a) => {
        if (!patient.initialVisitAt) onDocumentHp(a.eid);
        else setFollowUp(a);
      };
      const Row = ({ a }) => (
        <div className="flex flex-wrap items-center justify-between gap-2 py-2.5 border-b border-stone-100 last:border-0">
          <div className="cursor-pointer" onClick={() => setPicked(a)}>
            <div className={`font-semibold text-[13px] ${a.state === 'cancelled' ? 'line-through text-stone-400' : ''}`}>
              {fmtDayLabel(a.date)} · {fmt12h(a.startTime)}–{fmt12h(a.endTime)} — {a.title}
            </div>
            <div className="text-xs text-stone-500">{LOCATION_LABELS[a.location] || 'Home visit'}{a.notes ? ` · ${a.notes.slice(0, 60)}` : ''}</div>
          </div>
          <div className="flex items-center gap-1.5">
            <StateChip state={a.state} />
            {canWrite && !a.encounterUuid && a.state !== 'cancelled' && a.state !== 'no_show' &&
              <button className="btn gold !py-1 !px-2.5 text-xs" onClick={() => documentFrom(a)}>Document</button>}
          </div>
        </div>
      );
      return (
        <div className="max-w-3xl">
          {!data.linked && (
            <div className="card p-5 text-center">
              <i className="ti ti-calendar-off text-3xl text-accent" />
              <p className="text-sm text-stone-500 mt-1">Link this patient to OpenEMR to schedule clinical visits.</p>
            </div>
          )}
          {data.linked && (
            <div>
              <div className="card mb-4">
                <div className="card-h"><h2>Upcoming</h2>
                  {canWrite && <button className="btn gold !py-1.5" onClick={() => setModal({ mode: 'create' })}><i className="ti ti-calendar-plus" />New appointment</button>}
                </div>
                <div className="p-4">
                  {upcoming.length === 0 && <p className="text-sm text-stone-400">Nothing scheduled. Book the next visit — it goes straight onto the OpenEMR calendar.</p>}
                  {upcoming.map(a => <Row key={a.eid} a={a} />)}
                </div>
              </div>
              <div className="card">
                <div className="card-h"><h2>Past &amp; other</h2>
                  {canWrite && <button className="btn ghost !py-1.5 text-xs" onClick={() => setFollowUp('plain')}>Document unscheduled visit</button>}
                </div>
                <div className="p-4">
                  {past.length === 0 && <p className="text-sm text-stone-400">No appointment history yet.</p>}
                  {past.map(a => <Row key={a.eid} a={a} />)}
                </div>
              </div>
            </div>
          )}
          {picked && (
            <AppointmentDetail appt={{ ...picked, clientId: patient.id }} providers={providersData && providersData.providers}
              onClose={() => setPicked(null)} onChanged={changed}
              onReschedule={(a) => { setPicked(null); setModal({ mode: 'reschedule', appt: a }); }}
              onDocument={(a) => { setPicked(null); documentFrom(a); }} />
          )}
          {modal && (
            <AppointmentModal mode={modal.mode} appt={modal.appt}
              patients={(patients || []).filter(p => p.id === patient.id)}
              providersData={providersData} defaultDate={todayYmd()}
              defaultProviderId={providersData && providersData.myProviderId}
              onClose={() => setModal(null)} onSaved={changed} />
          )}
          {followUp && (
            <FollowUpModal patient={patient} chart={chart} appt={followUp === 'plain' ? null : followUp}
              onClose={() => setFollowUp(null)} onSaved={(r) => { changed(); onEncounterCreated && onEncounterCreated(r.encounterUuid); }} />
          )}
        </div>
      );
    };

    // ── Session 4.4 — Clinical completeness P0 ──
    // Coding · orders · prescriptions · sign-and-close · note→billing route.
    // OpenEMR 7.0.4 has no write API for any of these (preflight 2026-09-04),
    // so the app keeps the records and mirrors them into a GFC structured note
    // on the encounter (spec §2.4 interim). Guardrail for the coding assist:
    // the system proposes, the clinician disposes — nothing lands on a record
    // without a click, nothing auto-submits.

    const ENC_STATE_META = {
      not_coded: { label: 'Not coded', chip: 'bg-amber-50 text-amber-800' },
      coded: { label: 'Coded', chip: 'bg-primary-50 text-primary' },
      signed: { label: 'Signed & closed', chip: 'bg-emerald-50 text-emerald-700' }
    };
    // ── Session 4.12 Scope F3 — the encounter, one step per screen on a phone ──
    // The encounter panel is six cards on one scroll. At a desk that is the
    // right shape: a reviewer wants the whole visit in front of them. In
    // somebody's front room on a phone it is a long scroll with no sense of
    // where you are or what is left.
    //
    // THE STEPS ARE THE CARDS THAT ALREADY EXIST. Nothing new is modelled: a
    // second idea of "what an encounter consists of" would be a second thing
    // to keep in step with the record.
    //
    // STEPPING IS DISPLAY ONLY, AND NO STEP GATES ANOTHER. A clinician in a
    // home who has to record an order before finishing coding must be able
    // to. The only gate is the signature's own readiness, which the SERVER
    // answers and which was already there. A wizard that forces an order
    // would make this slower than paper in the one place it has to be faster.
    //
    // 767px is Tailwind's `md` boundary, deliberately the same number the
    // layout classes use: if the JS and the CSS disagreed about what a phone
    // is, the stepper would hide a card the grid was still laying out.
    const PHONE_QUERY = '(max-width: 767px)';
    const useNarrowViewport = () => {
      const [narrow, setNarrow] = useState(() =>
        typeof window !== 'undefined' && window.matchMedia ? window.matchMedia(PHONE_QUERY).matches : false);
      useEffect(() => {
        if (typeof window === 'undefined' || !window.matchMedia) return;
        const mq = window.matchMedia(PHONE_QUERY);
        const on = e => setNarrow(e.matches);
        setNarrow(mq.matches);
        // SUBSCRIBED, not read once: rotating a phone changes the answer, and
        // a stale one leaves a step hidden with no way back to it.
        mq.addEventListener ? mq.addEventListener('change', on) : mq.addListener(on);
        return () => { mq.removeEventListener ? mq.removeEventListener('change', on) : mq.removeListener(on); };
      }, []);
      return narrow;
    };

    const ENCOUNTER_STEPS = [
      { key: 'visit', label: 'Visit', icon: 'ti-clipboard-text' },
      { key: 'coding', label: 'Coding', icon: 'ti-code' },
      { key: 'actions', label: 'Orders & Rx', icon: 'ti-flask' },
      { key: 'sign', label: 'Sign', icon: 'ti-writing-sign' }
    ];
    // Which screen a blocker is fixed on. The LIST of blockers is the
    // server's and is never re-derived here; this only decides where to put
    // each one. An unrecognised blocker lands on Sign, where the server's full
    // message is printed in words — a blocker that maps to no step would
    // simply disappear, which is the worst of the three possible answers.
    const STEP_FOR_BLOCKER = { note: 'visit', diagnosis: 'coding', service: 'coding', service_dx_link: 'coding' };
    const stepForBlocker = (m) => STEP_FOR_BLOCKER[m] || 'sign';

    const EncounterStepRail = ({ step, onStep, blockers, closed }) => {
      const byStep = {};
      for (const m of blockers || []) { const k = stepForBlocker(m); byStep[k] = (byStep[k] || 0) + 1; }
      const i = Math.max(0, ENCOUNTER_STEPS.findIndex(s => s.key === step));
      return (
        <div className="mb-3">
          <div className="flex gap-1.5">
            {ENCOUNTER_STEPS.map(s => {
              const on = s.key === step;
              const n = byStep[s.key] || 0;
              return (
                <button key={s.key} onClick={() => onStep(s.key)}
                  className={`flex-1 rounded-lg border px-1 py-1.5 text-[11px] leading-tight ${on ? 'bg-primary text-white border-primary' : 'bg-white border-stone-200 text-stone-600'}`}>
                  <i className={`ti ${s.icon} block text-sm`} />
                  {s.label}
                  {/* Counted from the SERVER's blocker list. A tick the server
                      would refuse is worse than no tick at all. */}
                  {!closed && n > 0 && <span className={`block text-[10px] ${on ? 'text-white' : 'text-amber-700'}`}>{n} to do</span>}
                  {!closed && n === 0 && <span className={`block text-[10px] ${on ? 'text-white/70' : 'text-emerald-700'}`}>done</span>}
                </button>
              );
            })}
          </div>
          <div className="flex justify-between mt-2">
            <button className="btn ghost !py-1 !px-2.5 text-xs" disabled={i === 0} onClick={() => onStep(ENCOUNTER_STEPS[i - 1].key)}>
              <i className="ti ti-chevron-left" />Back
            </button>
            <button className="btn ghost !py-1 !px-2.5 text-xs" disabled={i === ENCOUNTER_STEPS.length - 1} onClick={() => onStep(ENCOUNTER_STEPS[i + 1].key)}>
              Next<i className="ti ti-chevron-right" />
            </button>
          </div>
        </div>
      );
    };

    const EncStateChip = ({ state }) => {
      const m = ENC_STATE_META[state] || ENC_STATE_META.not_coded;
      return <span className={`chip ${m.chip}`}>{m.label}</span>;
    };
    const SOURCE_META = {
      problem_list: { label: 'Problem list (OpenEMR)', chip: 'bg-emerald-50 text-emerald-700' },
      prior_encounter: { label: 'Prior encounter', chip: 'bg-emerald-50 text-emerald-700' },
      favorite: { label: 'My favorites', chip: 'bg-primary-50 text-primary' },
      practice: { label: 'Practice fee schedule', chip: 'bg-primary-50 text-primary' },
      typed: { label: 'Typed — OpenEMR resolves on read-back', chip: 'bg-amber-50 text-amber-800' },
      manual: { label: 'Entered', chip: 'bg-stone-100 text-stone-600' }
    };
    const SourceChip = ({ source }) => {
      const m = SOURCE_META[source] || SOURCE_META.manual;
      return <span className={`chip ${m.chip}`}>{m.label}</span>;
    };
    const npiLabel = (p) => p ? `${p.name || '—'}${p.licenseLevel ? `, ${p.licenseLevel}` : ''} · ${p.npi ? `NPI ${p.npi}` : 'NPI not on file'}` : '—';

    // Code picker: results come ONLY from OpenEMR-sourced data (this patient's
    // problem list, the clinician's own prior picks, the practice favorites).
    // A full code typed in is accepted on format and flagged until OpenEMR
    // resolves it. The app holds no code list (spec §7).
    const CodePicker = ({ set, clientId, exclude, onPick, placeholder }) => {
      const [q, setQ] = useState('');
      const [res, setRes] = useState(null);
      const [busy, setBusy] = useState(false);
      useEffect(() => {
        let alive = true;
        setBusy(true);
        const t = setTimeout(() => {
          api.codeSearch({ set, q, clientId: clientId || '' })
            .then(r => { if (alive) setRes(r); })
            .catch(e => { if (alive) setRes({ results: [], error: e.message }); })
            .finally(() => alive && setBusy(false));
        }, 220);
        return () => { alive = false; clearTimeout(t); };
      }, [set, q, clientId]);
      const rows = ((res && res.results) || []).filter(r => !(exclude || []).includes(r.code));
      return (
        <div className="border border-stone-200 rounded-lg p-2 bg-cream">
          <input className="inp" placeholder={placeholder || (set === 'ICD10' ? 'Search code or description, or type a full ICD-10 code (e.g. E11.9)' : 'Type a CPT/HCPCS code (e.g. 99348)')}
            value={q} onChange={e => setQ(e.target.value)} />
          <div className="max-h-44 overflow-y-auto mt-1.5">
            {busy && !res && <p className="text-xs text-stone-400 px-1">Searching…</p>}
            {res && res.error && <p className="text-xs text-red-600 px-1">{res.error}</p>}
            {res && !rows.length && !busy && <p className="text-xs text-stone-400 px-1">{q ? 'No match. Type the full code to add it.' : 'Start typing, or pick from your favorites below.'}</p>}
            {rows.map(r => (
              <button key={r.code} type="button" className="w-full text-left flex items-center justify-between gap-2 px-2 py-1.5 rounded hover:bg-white" onClick={() => { onPick(r); setQ(''); }}>
                <span className="text-[13px]"><b className="font-mono">{r.code}</b> {r.description || r.label || ''}</span>
                <SourceChip source={r.source} />
              </button>
            ))}
          </div>
          {res && res.notice && <p className="text-[10px] text-stone-400 px-1 mt-1">{res.notice}</p>}
        </div>
      );
    };

    // Encounter diagnoses editor (+ T1 carry-forward candidates as proposals).
    const DxEditor = ({ diagnoses, setDiagnoses, candidates, clientId, readOnly, addToProblemList, setAddToProblemList }) => {
      const has = (code) => diagnoses.some(d => d.code === code);
      const add = (r) => { if (!has(r.code)) setDiagnoses([...diagnoses, { code: r.code, description: r.description || '', source: r.source === 'typed' ? 'manual' : r.source, problemUuid: r.problemUuid || null, primary: diagnoses.length === 0 }]); };
      const remove = (code) => setDiagnoses(diagnoses.filter(d => d.code !== code).map((d, i, a) => ({ ...d, primary: a.some(x => x.primary) ? d.primary : i === 0 })));
      const setPrimary = (code) => setDiagnoses(diagnoses.map(d => ({ ...d, primary: d.code === code })));
      const pending = (candidates || []).filter(c => c.code && !has(c.code));
      const uncoded = (candidates || []).filter(c => !c.code);
      return (
        <div className="grid gap-2">
          {diagnoses.length === 0 && <p className="text-xs text-stone-400">No diagnoses on this encounter yet.</p>}
          {diagnoses.map(d => (
            <div key={d.code} className="flex flex-wrap items-center justify-between gap-2 py-1.5 border-b border-stone-100">
              <div className="text-[13px]"><b className="font-mono">{d.code}</b> {d.description || <span className="text-stone-400">(description from OpenEMR on read-back)</span>}
                <span className="ml-1"><SourceChip source={d.source} /></span>
                {d.primary && <span className="chip bg-accent text-primary ml-1">PRIMARY</span>}
              </div>
              {!readOnly && (
                <div className="flex items-center gap-2 text-xs">
                  {!d.primary && <button type="button" className="text-primary underline" onClick={() => setPrimary(d.code)}>Make primary</button>}
                  {d.source === 'manual' && setAddToProblemList && (
                    <label className="flex items-center gap-1 text-stone-500">
                      <input type="checkbox" checked={(addToProblemList || []).includes(d.code)}
                        onChange={e => setAddToProblemList(e.target.checked ? [...(addToProblemList || []), d.code] : (addToProblemList || []).filter(c => c !== d.code))} />
                      add to problem list
                    </label>
                  )}
                  <button type="button" className="text-red-600" onClick={() => remove(d.code)}><i className="ti ti-x" /></button>
                </div>
              )}
            </div>
          ))}
          {!readOnly && pending.length > 0 && (
            <div className="prefill rounded-lg p-2">
              <div className="prefill-badge mb-1"><i className="ti ti-bulb" /> FROM THE OPENEMR PROBLEM LIST — proposed, tap to include</div>
              <div className="flex flex-wrap gap-1.5">
                {pending.map(c => (
                  <button key={c.code} type="button" className="chip border bg-white text-primary border-stone-200" onClick={() => add(c)}>
                    + {c.code} {c.description}
                  </button>
                ))}
              </div>
            </div>
          )}
          {!readOnly && uncoded.length > 0 && (
            <p className="text-[11px] text-amber-700"><i className="ti ti-alert-triangle mr-1" />
              {uncoded.length} problem{uncoded.length > 1 ? 's' : ''} on the OpenEMR list ha{uncoded.length > 1 ? 've' : 's'} no ICD-10 code ({uncoded.map(u => u.description).join(', ')}) — code {uncoded.length > 1 ? 'them' : 'it'} below to bill against {uncoded.length > 1 ? 'them' : 'it'}.
            </p>
          )}
          {!readOnly && <CodePicker set="ICD10" clientId={clientId} exclude={diagnoses.map(d => d.code)} onPick={add} />}
        </div>
      );
    };

    // Service (CPT/HCPCS) editor: each line must link to ≥1 encounter diagnosis.
    const SvcEditor = ({ services, setServices, diagnoses, practiceFavorites, favorites, readOnly }) => {
      const has = (code) => services.some(s => s.code === code);
      const add = (r) => { if (!has(r.code)) setServices([...services, { code: r.code, codeType: r.codeType, label: r.label || r.description || '', units: 1, dxLinks: diagnoses.map(d => d.code), modifiers: [] }]); };
      const update = (code, patch) => setServices(services.map(s => s.code === code ? { ...s, ...patch } : s));
      const remove = (code) => setServices(services.filter(s => s.code !== code));
      const favCodes = new Set((favorites || []).map(f => f.code));
      const quick = [...(favorites || []).map(f => ({ ...f, source: 'favorite' })), ...(practiceFavorites || []).filter(f => !favCodes.has(f.code)).map(f => ({ ...f, source: 'practice' }))];
      return (
        <div className="grid gap-2">
          {services.length === 0 && <p className="text-xs text-stone-400">No service codes on this encounter yet.</p>}
          {services.map(s => (
            <div key={s.code} className="py-1.5 border-b border-stone-100">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <div className="text-[13px]"><b className="font-mono">{s.code}</b> <span className="text-stone-500">{s.codeType}</span> {s.label}</div>
                {!readOnly && (
                  <div className="flex items-center gap-2 text-xs">
                    <label className="flex items-center gap-1">units <input className="inp !w-14 !py-0.5" value={s.units} onChange={e => update(s.code, { units: e.target.value.replace(/\D/g, '') || 1 })} /></label>
                    <label className="flex items-center gap-1">mod <input className="inp !w-20 !py-0.5" placeholder="25" value={(s.modifiers || []).join(',')} onChange={e => update(s.code, { modifiers: e.target.value.split(',').map(x => x.trim()).filter(Boolean) })} /></label>
                    <button type="button" className="text-red-600" onClick={() => remove(s.code)}><i className="ti ti-x" /></button>
                  </div>
                )}
              </div>
              <div className="flex flex-wrap items-center gap-1.5 mt-1 text-[11px] text-stone-500">
                Linked dx:
                {diagnoses.length === 0 && <span className="text-amber-700">add a diagnosis first</span>}
                {diagnoses.map(d => (
                  <label key={d.code} className={`chip border cursor-pointer ${(s.dxLinks || []).includes(d.code) ? 'bg-primary text-white border-primary' : 'bg-white text-primary border-stone-200'}`}>
                    <input type="checkbox" className="hidden" disabled={readOnly} checked={(s.dxLinks || []).includes(d.code)}
                      onChange={e => update(s.code, { dxLinks: e.target.checked ? [...(s.dxLinks || []), d.code] : (s.dxLinks || []).filter(c => c !== d.code) })} />
                    {d.code}
                  </label>
                ))}
                {!(s.dxLinks || []).length && diagnoses.length > 0 && <span className="text-red-600">must link to at least one</span>}
              </div>
            </div>
          ))}
          {!readOnly && (
            <div>
              <div className="lblu mb-1">Quick pick — your most-used first, then the practice fee schedule</div>
              <div className="flex flex-wrap gap-1.5 mb-2">
                {quick.filter(f => !has(f.code)).map(f => (
                  <button key={f.code} type="button" className={`chip border ${f.source === 'favorite' ? 'bg-primary-50 text-primary border-primary' : 'bg-white text-primary border-stone-200'}`} onClick={() => add(f)} title={f.source === 'favorite' ? `used ${f.count}×` : 'practice favorite'}>
                    + {f.code}{f.label ? ` · ${f.label}` : ''}
                  </button>
                ))}
                {quick.length === 0 && <span className="text-xs text-stone-400">No favorites yet — an admin can seed the practice list in Settings.</span>}
              </div>
              <CodePicker set="SERVICE" exclude={services.map(s => s.code)} onPick={add} />
            </div>
          )}
        </div>
      );
    };

    // Follow-up visit (Scope A): short SOAP + vitals + T1 diagnoses + quick
    // service pick → Encounter + narrative note + GFC structured note.
    // Module scope, same reason as VitalInput above: nested inside the modal
    // it was a new component every keystroke, so the field took one character
    // and then lost the caret.
    const FollowUpVital = ({ k, label, f, setV }) => (
      <Field label={label}><input className="inp" value={f.vitals[k]} onChange={e => setV(k, e.target.value)} /></Field>
    );
    const FollowUpModal = ({ patient, chart, appt, onClose, onSaved }) => {
      const [cands, setCands] = useState([]);
      const [f, setF] = useState({ reason: appt ? appt.title : 'Follow-up visit', date: appt ? appt.date : todayYmd(), subjective: '', objective: '', assessment: '', plan: '',
        vitals: { bpSys: '', bpDia: '', hr: '', temp: '', rr: '', spo2: '', weight: '', height: '', pain: '' } });
      const [diagnoses, setDiagnoses] = useState([]);
      const [services, setServices] = useState([]);
      const [settings, setSettings] = useState(null);
      const [busy, setBusy] = useState(false); const [err, setErr] = useState('');
      useEffect(() => { api.settings().then(setSettings).catch(() => {}); }, []);
      // T1: the server proposes the patient's active coded problems; they arrive
      // pre-selected and the clinician unchecks what wasn't addressed.
      useEffect(() => {
        api.dxCandidates(patient.id).then(r => {
          setCands(r.candidates || []);
          setDiagnoses(prev => prev.length ? prev : (r.candidates || []).filter(c => c.preselected)
            .map((c, i) => ({ code: c.code, description: c.description, source: c.source, problemUuid: c.problemUuid, primary: i === 0 })));
        }).catch(() => {});
      }, [patient.id]);
      const setV = (k, v) => setF(p => ({ ...p, vitals: { ...p.vitals, [k]: v } }));
      const submit = () => {
        setBusy(true); setErr('');
        api.followUp(patient.id, { ...f, diagnoses, services, appointmentEid: appt ? appt.eid : undefined })
          .then(r => onSaved(r)).catch(e => { setErr(e.message); setBusy(false); });
      };
      return (
        <div className="fixed inset-0 bg-black/40 z-40 flex items-start justify-center p-4 overflow-y-auto" onClick={onClose}>
          <div className="card w-full max-w-2xl mt-6 mb-10" onClick={e => e.stopPropagation()}>
            <div className="card-h"><h2>Document follow-up visit</h2><button className="text-stone-400" onClick={onClose}><i className="ti ti-x" /></button></div>
            <div className="p-4 grid gap-3">
              {appt && <p className="text-xs text-stone-500">From appointment: {fmtDayLabel(appt.date)} {fmt12h(appt.startTime)} — the Encounter links back to it.</p>}
              <div className="grid md:grid-cols-[1fr_160px] gap-3">
                <Field label="Visit reason"><input className="inp" value={f.reason} onChange={e => setF({ ...f, reason: e.target.value })} /></Field>
                <Field label="Visit date"><input className="inp" type="date" value={f.date} onChange={e => setF({ ...f, date: e.target.value })} /></Field>
              </div>
              <Field label="Subjective"><textarea className="inp" rows={2} value={f.subjective} onChange={e => setF({ ...f, subjective: e.target.value })} /></Field>
              <div>
                <span className="lblu block mb-1">Vitals (optional — preserved verbatim in the note)</span>
                <div className="grid grid-cols-1 sm:grid-cols-3 md:grid-cols-5 gap-2">
                  <FollowUpVital f={f} setV={setV} k="bpSys" label="BP sys" /><FollowUpVital f={f} setV={setV} k="bpDia" label="BP dia" /><FollowUpVital f={f} setV={setV} k="hr" label="HR" /><FollowUpVital f={f} setV={setV} k="temp" label="Temp °F" /><FollowUpVital f={f} setV={setV} k="rr" label="RR" />
                  <FollowUpVital f={f} setV={setV} k="spo2" label="SpO₂ %" /><FollowUpVital f={f} setV={setV} k="weight" label="Wt lb" /><FollowUpVital f={f} setV={setV} k="height" label="Ht in" /><FollowUpVital f={f} setV={setV} k="pain" label="Pain /10" />
                </div>
              </div>
              <Field label="Objective"><textarea className="inp" rows={2} value={f.objective} onChange={e => setF({ ...f, objective: e.target.value })} /></Field>
              <Field label="Assessment"><textarea className="inp" rows={2} value={f.assessment} onChange={e => setF({ ...f, assessment: e.target.value })} /></Field>
              <Field label="Plan"><textarea className="inp" rows={2} value={f.plan} onChange={e => setF({ ...f, plan: e.target.value })} /></Field>
              <div className="border-t border-stone-100 pt-3">
                <span className="lblu block mb-1">Encounter diagnoses (ICD-10) — active problems pre-selected; uncheck what wasn't addressed</span>
                <DxEditor diagnoses={diagnoses} setDiagnoses={setDiagnoses} candidates={cands} clientId={patient.id} />
              </div>
              <div className="border-t border-stone-100 pt-3">
                <span className="lblu block mb-1">Service code (CPT/HCPCS) — optional now, required before signing</span>
                <SvcEditor services={services} setServices={setServices} diagnoses={diagnoses}
                  practiceFavorites={settings && settings.serviceCodeFavorites} favorites={[]} />
              </div>
              {err && <p className="text-red-600 text-sm">{err}</p>}
              <div className="flex gap-2 justify-end">
                <button className="btn ghost" onClick={onClose}>Close</button>
                <button className="btn" disabled={busy || !f.reason.trim()} onClick={submit}>{busy ? 'Writing to OpenEMR…' : 'Write encounter & note'}</button>
              </div>
              <p className="text-[11px] text-stone-400">Writes the Encounter and your narrative SOAP note to OpenEMR (stamped with your name and NPI), then opens the encounter so you can add prescriptions and orders and sign it.</p>
            </div>
          </div>
        </div>
      );
    };

    const RxForm = ({ routes, onSave, busy, schedules, scheduleLabels, prescriber }) => {
      // ── Session 4.10 ── THE SCHEDULE HAS NO DEFAULT. The clinician chooses,
      // because the whole control is that a person declared it — a pre-selected
      // "not a controlled substance" is a declaration nobody made.
      const [f, setF] = useState({ kind: 'new', drug: '', dose: '', route: 'oral', frequency: '', quantity: '', refills: '0', date: todayYmd(), instructions: '', schedule: '', pdmp: { checked: false, checkedOn: todayYmd() } });
      const p = prescriber || {};
      const controlled = f.schedule && f.schedule !== 'non_controlled';
      // A Georgia NP or PA may not prescribe Schedule II. The SERVER refuses it;
      // this says so before the click, so the answer is "route it to the
      // collaborating physician" rather than a 403 with nothing to do about it.
      const scheduleTwoBlocked = f.schedule === 'CII' && p.scheduleIIProhibited;
      const deaMissing = controlled && !p.deaOnFile;
      const deaUncovered = controlled && p.deaOnFile && (p.deaSchedules || []).length > 0 && !(p.deaSchedules || []).includes(f.schedule);
      return (
        <div className="grid gap-2 border-t border-stone-100 pt-3">
          {!p.prescriberCredential && (
            <p className="text-[11px] text-amber-800">
              Your prescriber credential (MD, DO, NP or PA) is not on file, so a prescription cannot be recorded.
              Georgia's scope rules differ by credential, so nothing is inferred — an admin sets it on your user record.
            </p>
          )}
          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2">
            <Field label="Type"><select className="inp" value={f.kind} onChange={e => setF({ ...f, kind: e.target.value })}><option value="new">New Rx</option><option value="refill">Refill</option></select></Field>
            <Field label="Drug" className="sm:col-span-2"><input className="inp" value={f.drug} onChange={e => setF({ ...f, drug: e.target.value })} /></Field>
            <Field label="Dose"><input className="inp" placeholder="500 mg" value={f.dose} onChange={e => setF({ ...f, dose: e.target.value })} /></Field>
            <Field label="Route"><select className="inp" value={f.route} onChange={e => setF({ ...f, route: e.target.value })}>{(routes || ['oral']).map(r => <option key={r} value={r}>{r}</option>)}</select></Field>
            <Field label="Frequency"><input className="inp" placeholder="BID" value={f.frequency} onChange={e => setF({ ...f, frequency: e.target.value })} /></Field>
            <Field label="Quantity"><input className="inp" inputMode="numeric" value={f.quantity} onChange={e => setF({ ...f, quantity: e.target.value.replace(/\D/g, '') })} /></Field>
            <Field label="Refills"><input className="inp" inputMode="numeric" value={f.refills} onChange={e => setF({ ...f, refills: e.target.value.replace(/\D/g, '') })} /></Field>
            <Field label="Date"><input className="inp" type="date" value={f.date} onChange={e => setF({ ...f, date: e.target.value })} /></Field>
            <Field label="Instructions" className="sm:col-span-2 md:col-span-3"><input className="inp" value={f.instructions} onChange={e => setF({ ...f, instructions: e.target.value })} /></Field>
            <Field label="Schedule">
              <select className="inp" value={f.schedule} onChange={e => setF({ ...f, schedule: e.target.value })}>
                <option value="">Choose…</option>
                {(schedules || []).map(sc => <option key={sc} value={sc}>{(scheduleLabels && scheduleLabels[sc]) || sc}</option>)}
              </select>
            </Field>
          </div>
          {scheduleTwoBlocked && (
            <p className="text-[11px] text-red-700">
              A Georgia {p.prescriberCredential} may not prescribe a Schedule I or II substance. Route this to the
              collaborating physician, who can record it under their own credential.
            </p>
          )}
          {deaMissing && <p className="text-[11px] text-amber-800">A controlled prescription needs a DEA registration on file. An admin records it on your user record.</p>}
          {deaUncovered && <p className="text-[11px] text-amber-800">Your DEA registration covers {(p.deaSchedules || []).join(', ')} — it does not cover {f.schedule}.</p>}
          {controlled && !scheduleTwoBlocked && (
            <div className="grid gap-2 p-2.5 rounded border border-stone-200 bg-stone-50">
              <label className="flex items-start gap-2 text-xs">
                <input type="checkbox" className="mt-0.5" checked={!!f.pdmp.checked} onChange={e => setF({ ...f, pdmp: { ...f.pdmp, checked: e.target.checked } })} />
                <span>I checked the Georgia PDMP before writing this prescription.</span>
              </label>
              {f.pdmp.checked && <Field label="Date checked"><input className="inp" type="date" value={f.pdmp.checkedOn} onChange={e => setF({ ...f, pdmp: { ...f.pdmp, checkedOn: e.target.value } })} /></Field>}
            </div>
          )}
          <div className="flex justify-end">
            <button className="btn !py-1.5"
              disabled={busy || !f.drug || !f.dose || !f.frequency || !f.quantity || !f.schedule || !p.prescriberCredential ||
                scheduleTwoBlocked || deaMissing || deaUncovered || (controlled && !f.pdmp.checked)}
              onClick={() => onSave(f)}>{busy ? 'Recording…' : 'Record prescription'}</button>
          </div>
          <p className="text-[10.5px] text-stone-400">
            The schedule is yours to declare. The server checks it against the drug name as a backstop and refuses a
            declaration that contradicts a term it is confident about — it is not a formulary and never will be.
          </p>
        </div>
      );
    };

    // ── Session 4.10: a referral and a DME order carry a PAYLOAD, not tests ──
    // Two separate sub-forms rather than one form that grows conditional
    // branches: the SWO's six elements and a referral's clinical question have
    // nothing in common, and a shared form would read as if they did.
    //
    // The fax fields are ten digits. The SERVER is the control — a mistyped fax
    // number is a misdirected PHI disclosure, so it validates there — but the
    // form says so before the click rather than after a 400.
    const faxOk = (v) => /^\d{10}$/.test(String(v || '').replace(/\D/g, ''));

    const ReferralFields = ({ f, setF }) => (
      <React.Fragment>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <Field label="Specialty"><input className="inp" value={f.specialty || ''} onChange={e => setF({ ...f, specialty: e.target.value })} /></Field>
          <Field label="Urgency"><select className="inp" value={f.urgency || 'routine'} onChange={e => setF({ ...f, urgency: e.target.value })}>{['routine', 'urgent', 'stat'].map(u => <option key={u} value={u}>{u}</option>)}</select></Field>
          <Field label="Receiving practice"><input className="inp" value={f.receivingPractice || ''} onChange={e => setF({ ...f, receivingPractice: e.target.value })} /></Field>
          <Field label="Receiving provider"><input className="inp" value={f.receivingProvider || ''} onChange={e => setF({ ...f, receivingProvider: e.target.value })} /></Field>
          <Field label="Receiving fax (this is what gets faxed)">
            <input className="inp" inputMode="tel" value={f.receivingFax || ''} onChange={e => setF({ ...f, receivingFax: e.target.value })} />
            {f.receivingFax && !faxOk(f.receivingFax) && <p className="text-[11px] text-amber-700 mt-1">Ten digits. A mistyped fax number sends this patient's record to a stranger.</p>}
          </Field>
          <Field label="Receiving phone"><input className="inp" value={f.receivingPhone || ''} onChange={e => setF({ ...f, receivingPhone: e.target.value })} /></Field>
        </div>
        <Field label="Reason for referral"><input className="inp" value={f.reason || ''} onChange={e => setF({ ...f, reason: e.target.value })} /></Field>
        <Field label="Clinical summary — the question you want answered">
          <textarea className="inp" rows={3} value={f.clinicalSummary || ''} onChange={e => setF({ ...f, clinicalSummary: e.target.value })} />
        </Field>
        <label className="flex items-start gap-2 text-xs">
          <input type="checkbox" className="mt-0.5" checked={!!f.priorAuthRequired} onChange={e => setF({ ...f, priorAuthRequired: e.target.checked })} />
          <span>Prior authorization is required. <span className="text-stone-500">Medicare Advantage plans frequently require one; this is how it stops being forgotten.</span></span>
        </label>
        {f.priorAuthRequired && <Field label="Authorization number (if you already have it)"><input className="inp" value={f.priorAuthNumber || ''} onChange={e => setF({ ...f, priorAuthNumber: e.target.value })} /></Field>}
      </React.Fragment>
    );

    const DmeFields = ({ f, setF }) => (
      <React.Fragment>
        <p className="text-[11px] text-stone-500">
          CMS Standard Written Order. The beneficiary, the order date, the treating practitioner and the signature come
          from the record and your user account; the four fields below are yours. The requisition is refused if any of the
          six elements is missing.
        </p>
        <Field label="Item — narrative, HCPCS, or brand and model"><input className="inp" value={f.itemDescription || ''} onChange={e => setF({ ...f, itemDescription: e.target.value })} /></Field>
        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2">
          <Field label="HCPCS (optional)"><input className="inp" value={f.hcpcsCode || ''} onChange={e => setF({ ...f, hcpcsCode: e.target.value.toUpperCase() })} /></Field>
          <Field label="Quantity"><input className="inp" inputMode="numeric" value={f.quantity || ''} onChange={e => setF({ ...f, quantity: e.target.value.replace(/\D/g, '') })} /></Field>
          <Field label="Length of need"><input className="inp" placeholder="99 months" value={f.lengthOfNeed || ''} onChange={e => setF({ ...f, lengthOfNeed: e.target.value })} /></Field>
          <Field label="Order date"><input className="inp" type="date" value={f.orderDate || todayYmd()} onChange={e => setF({ ...f, orderDate: e.target.value })} /></Field>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <Field label="Supplier"><input className="inp" value={f.supplierName || ''} onChange={e => setF({ ...f, supplierName: e.target.value })} /></Field>
          <Field label="Supplier fax">
            <input className="inp" inputMode="tel" value={f.supplierFax || ''} onChange={e => setF({ ...f, supplierFax: e.target.value })} />
            {f.supplierFax && !faxOk(f.supplierFax) && <p className="text-[11px] text-amber-700 mt-1">Ten digits.</p>}
          </Field>
        </div>
        <label className="flex items-start gap-2 text-xs">
          <input type="checkbox" className="mt-0.5" checked={!!f.requiresF2F} onChange={e => setF({ ...f, requiresF2F: e.target.checked })} />
          <span>This item requires a face-to-face encounter.</span>
        </label>
        {f.requiresF2F && (
          <Field label="Face-to-face encounter date — must be within the six months before the order date">
            <input className="inp" type="date" value={f.faceToFaceDate || ''} onChange={e => setF({ ...f, faceToFaceDate: e.target.value })} />
          </Field>
        )}
        <label className="flex items-start gap-2 text-xs">
          <input type="checkbox" className="mt-0.5" checked={!!f.requiresWOPD} onChange={e => setF({ ...f, requiresWOPD: e.target.checked })} />
          <span>Written order prior to delivery. <span className="text-stone-500">The supplier may not deliver before they hold it — power mobility devices are the statutory case.</span></span>
        </label>
        <p className="text-[11px] text-stone-500">
          Which items need a face-to-face encounter or a written order prior to delivery is CMS's{' '}
          <a className="underline" target="_blank" rel="noopener noreferrer"
            href="https://www.cms.gov/medicare/regulations-guidance/dmepos-face-to-face-written-order-prior-delivery-power-mobility-devices-list">Required List</a>,
          which changes. It is not embedded in this app — you set the flags.
        </p>
      </React.Fragment>
    );

    // Session 4.8: the same form places a direct order (a provider's own
    // authority) and an order under a protocol. `requireStandingOrder` is set
    // for a credential that has no direct authority — the protocol picker then
    // has no blank option, and the TESTS come from the protocol's list rather
    // than a free-text box, because a test typed in is refused server-side.
    const OrderForm = ({ diagnoses, types, priorities, onSave, busy, standingOrders, requireStandingOrder, docTypes }) => {
      const [f, setF] = useState({ orderType: 'lab', tests: '', priority: 'routine', diagnosisCodes: diagnoses.map(d => d.code), notes: '', standingOrderId: '' });
      // 4.10: which types carry a payload rather than a list of tests. SERVED,
      // never listed here — a form that names its own options drifts from the
      // validator that refuses one it did not offer.
      const isDoc = (docTypes || []).includes(f.orderType);
      const toggleDx = (c) => setF(p => ({ ...p, diagnosisCodes: p.diagnosisCodes.includes(c) ? p.diagnosisCodes.filter(x => x !== c) : [...p.diagnosisCodes, c] }));
      const protocols = (standingOrders || []).filter(o => o.executableByMe);
      const picked = protocols.find(o => o.id === f.standingOrderId) || null;
      const pickedTests = picked ? (picked.permittedTests || []) : [];
      const toggleTest = (t) => setF(p => {
        const cur = p.tests.split('\n').map(x => x.trim()).filter(Boolean);
        return { ...p, tests: (cur.includes(t) ? cur.filter(x => x !== t) : cur.concat([t])).join('\n') };
      });
      // Under a protocol the choice narrows to the types BOTH the protocol and
      // the caller's licence allow — the server computed that intersection, so
      // the form does not re-derive it.
      const typeOptions = picked ? (picked.executableOrderTypes || []) : (types || []);
      return (
        <div className="grid gap-2 border-t border-stone-100 pt-3">
          {(requireStandingOrder || protocols.length > 0) && (
            <Field label={requireStandingOrder ? 'Standing order (required)' : 'Standing order (optional)'}>
              <select className="inp" value={f.standingOrderId}
                onChange={e => setF({ ...f, standingOrderId: e.target.value, tests: '', orderType: 'lab' })}>
                {!requireStandingOrder && <option value="">No protocol — my own authority</option>}
                {requireStandingOrder && <option value="">Select a protocol…</option>}
                {protocols.map(o => <option key={o.id} value={o.id}>{o.title} (v{o.version})</option>)}
              </select>
              {requireStandingOrder && protocols.length === 0 &&
                <p className="text-[11px] text-amber-700 mt-1">No active standing order authorises your credential for this work. A provider authors and signs one.</p>}
              {picked && <p className="text-[11px] text-stone-500 mt-1">Ordering clinician of record: {picked.authorizingProvider && picked.authorizingProvider.name}. Expires {String(picked.expiresAt || '').slice(0, 10)}.</p>}
            </Field>
          )}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <Field label="Order type"><select className="inp" value={f.orderType} onChange={e => setF({ ...f, orderType: e.target.value })}>{typeOptions.map(t => <option key={t} value={t}>{t}</option>)}</select></Field>
            <Field label="Priority"><select className="inp" value={f.priority} onChange={e => setF({ ...f, priority: e.target.value })}>{(priorities || []).map(t => <option key={t} value={t}>{t}</option>)}</select></Field>
          </div>
          {isDoc
            ? (f.orderType === 'referral' ? <ReferralFields f={f} setF={setF} /> : <DmeFields f={f} setF={setF} />)
            : picked
            ? (
              <Field label="Tests / studies this protocol permits">
                <div className="flex flex-wrap gap-1.5">
                  {pickedTests.map(t => (
                    <button key={t} type="button"
                      className={`chip border ${f.tests.split('\n').map(x => x.trim()).includes(t) ? 'bg-primary text-white border-primary' : 'bg-white text-primary border-stone-200'}`}
                      onClick={() => toggleTest(t)}>{t}</button>
                  ))}
                </div>
              </Field>
            )
            : <Field label="Tests / studies (one per line)"><textarea className="inp" rows={2} value={f.tests} onChange={e => setF({ ...f, tests: e.target.value })} /></Field>}
          <div className="flex flex-wrap items-center gap-1.5 text-[11px] text-stone-500">Linked dx:
            {diagnoses.length === 0 && <span className="text-amber-700">add an encounter diagnosis first</span>}
            {diagnoses.map(d => (
              <button key={d.code} type="button" className={`chip border ${f.diagnosisCodes.includes(d.code) ? 'bg-primary text-white border-primary' : 'bg-white text-primary border-stone-200'}`} onClick={() => toggleDx(d.code)}>{d.code}</button>
            ))}
          </div>
          <Field label="Notes"><input className="inp" value={f.notes} onChange={e => setF({ ...f, notes: e.target.value })} /></Field>
          <div className="flex justify-end">
            <button className="btn !py-1.5"
              disabled={busy || !f.diagnosisCodes.length || (requireStandingOrder && !f.standingOrderId) ||
                (isDoc
                  ? (f.orderType === 'referral'
                    ? (!f.specialty || !f.reason || !f.clinicalSummary || !faxOk(f.receivingFax))
                    : (!f.itemDescription || !f.quantity || !f.supplierName || !f.lengthOfNeed || !faxOk(f.supplierFax) || (f.requiresF2F && !f.faceToFaceDate)))
                  : !f.tests.trim())}
              onClick={() => onSave(isDoc ? f : { ...f, tests: f.tests.split('\n').map(s => s.trim()).filter(Boolean) })}>
              {busy ? 'Recording…' : f.orderType === 'referral' ? 'Record referral' : f.orderType === 'dme' ? 'Record written order' : 'Record order'}
            </button>
          </div>
        </div>
      );
    };

    // ── Session 4.10: the hand-off to Doximity, and the evidence it leaves ──
    //
    // THE APP GENERATES. A PERSON TRANSMITS. This row is the whole workflow:
    // open the requisition (it lands in the phone's PDF viewer, one tap from the
    // share sheet), fax it from Doximity, then come back and say it went — which
    // is what "Mark as faxed" records, with the number and the channel.
    const OrderActions = ({ order, channels, channelLabels, defaultChannel, faxChannels, interpretations, onSent, onScheduled, onResult, busy }) => {
      const [mode, setMode] = useState('');
      const [send, setSend] = useState({
        // SERVED, not named here. The default channel and which channels carry a
        // fax number are both the server's answer — this form restating either
        // would let it offer an option the validator refuses, silently.
        channel: defaultChannel || '',
        recipientName: (order.referral && (order.referral.receivingPractice || order.referral.receivingProvider || order.referral.specialty)) || (order.dme && order.dme.supplierName) || '',
        recipientFax: (order.referral && order.referral.receivingFax) || (order.dme && order.dme.supplierFax) || '',
        note: ''
      });
      const [appt, setAppt] = useState('');
      const [res, setRes] = useState({ interpretation: 'normal', resultDate: todayYmd(), performedBy: '', summary: '', file: null });
      const isFax = (faxChannels || []).includes(send.channel);
      const sends = order.sends || [];
      return (
        <div className="mt-1.5">
          <div className="flex flex-wrap gap-1.5">
            <a className="chip border bg-white text-primary border-stone-200" href={api.requisitionUrl(order.id)} target="_blank" rel="noopener noreferrer">
              <i className="ti ti-file-text" /> {order.requisitionGeneratedAt ? 'Open requisition again' : 'Open requisition'}
            </a>
            {['ordered', 'sent', 'scheduled'].includes(order.status) &&
              <button className="chip border bg-white text-primary border-stone-200" onClick={() => setMode(mode === 'send' ? '' : 'send')}>
                {sends.length ? 'Record another send' : 'Mark as faxed'}
              </button>}
            {order.orderType === 'referral' && ['sent'].includes(order.status) &&
              <button className="chip border bg-white text-primary border-stone-200" onClick={() => setMode(mode === 'appt' ? '' : 'appt')}>Mark as scheduled</button>}
            {!['cancelled', 'resulted', 'completed'].includes(order.status) &&
              <button className="chip border bg-white text-primary border-stone-200" onClick={() => setMode(mode === 'result' ? '' : 'result')}>
                {order.orderType === 'referral' ? 'Attach consult note' : 'Attach result'}
              </button>}
          </div>

          {sends.map((sd, i) => (
            <div key={i} className="text-[11px] text-stone-500 mt-1">
              {i === 0 ? 'Sent' : 'Re-sent'} {fmtTs(sd.sentAt)} · {channelLabels && channelLabels[sd.channel] || sd.channel} → {sd.recipientName}
              {sd.recipientFax ? ` at ${sd.recipientFax.replace(/(\d{3})(\d{3})(\d{4})/, '($1) $2-$3')}` : ''} · by {sd.sentBy && sd.sentBy.name}
            </div>
          ))}

          {mode === 'send' && (
            <div className="grid gap-2 mt-2 p-2.5 rounded border border-stone-200 bg-stone-50">
              <p className="text-[11px] text-stone-600">
                Open the requisition, fax it from Doximity, then record it here. This does not send anything — it records that you did.
              </p>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <Field label="Channel">
                  <select className="inp" value={send.channel} onChange={e => setSend({ ...send, channel: e.target.value })}>
                    {(channels || []).map(c => <option key={c} value={c}>{(channelLabels && channelLabels[c]) || c}</option>)}
                  </select>
                </Field>
                <Field label="Sent to"><input className="inp" value={send.recipientName} onChange={e => setSend({ ...send, recipientName: e.target.value })} /></Field>
              </div>
              {isFax && (
                <Field label="Fax number it went to">
                  <input className="inp" inputMode="tel" value={send.recipientFax} onChange={e => setSend({ ...send, recipientFax: e.target.value })} />
                  {send.recipientFax && !faxOk(send.recipientFax) && <p className="text-[11px] text-amber-700 mt-1">Ten digits. This is the record of who the PHI went to.</p>}
                </Field>
              )}
              <Field label="Note (optional)"><input className="inp" value={send.note} onChange={e => setSend({ ...send, note: e.target.value })} /></Field>
              <div className="flex justify-end">
                <button className="btn !py-1.5" disabled={busy || !send.recipientName || (isFax && !faxOk(send.recipientFax))}
                  onClick={() => onSent(send).then(() => setMode(''))}>{busy ? 'Recording…' : 'Record the send'}</button>
              </div>
            </div>
          )}

          {mode === 'appt' && (
            <div className="grid gap-2 mt-2 p-2.5 rounded border border-stone-200 bg-stone-50">
              <Field label="Appointment date the specialist's office gave"><input className="inp" type="date" value={appt} onChange={e => setAppt(e.target.value)} /></Field>
              <div className="flex justify-end"><button className="btn !py-1.5" disabled={busy || !appt} onClick={() => onScheduled(appt).then(() => setMode(''))}>Record it</button></div>
            </div>
          )}

          {mode === 'result' && (
            <div className="grid gap-2 mt-2 p-2.5 rounded border border-stone-200 bg-stone-50">
              <p className="text-[11px] text-stone-600">
                The PDF is the record; the interpretation is what decides who this reaches and how fast. It files into the
                patient's chart, never into Drive.
              </p>
              <Field label="Document (PDF, JPEG or PNG)">
                <input className="inp" type="file" accept="application/pdf,image/jpeg,image/png" onChange={e => setRes({ ...res, file: e.target.files[0] || null })} />
              </Field>
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">
                <Field label="Interpretation">
                  <select className="inp" value={res.interpretation} onChange={e => setRes({ ...res, interpretation: e.target.value })}>
                    {(interpretations || ['normal', 'abnormal', 'critical']).map(i => <option key={i} value={i}>{i}</option>)}
                  </select>
                </Field>
                <Field label="Result date"><input className="inp" type="date" value={res.resultDate} onChange={e => setRes({ ...res, resultDate: e.target.value })} /></Field>
                <Field label="Performing lab / facility"><input className="inp" value={res.performedBy} onChange={e => setRes({ ...res, performedBy: e.target.value })} /></Field>
              </div>
              <Field label="Short summary"><input className="inp" value={res.summary} onChange={e => setRes({ ...res, summary: e.target.value })} /></Field>
              {res.interpretation === 'critical' && <p className="text-[11px] text-amber-800">A critical result notifies the ordering clinician immediately. The notice carries no patient or clinical detail.</p>}
              <div className="flex justify-end">
                <button className="btn !py-1.5" disabled={busy || !res.file || !res.performedBy || !res.summary}
                  onClick={() => onResult(res).then(() => setMode(''))}>{busy ? 'Filing…' : 'File the result'}</button>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ══════════════════════════════════════════════════════════════════════
    // SESSION 4.10 — THE RESULTS INBOX
    //
    // `acknowledgeAbnormalResult` has existed as a capability since 4.8 with no
    // route and no screen behind it. This is where it finally gets both.
    //
    // WITH RESULTS ARRIVING BY FAX TO ONE PERSON'S PHONE, the realistic harm is
    // an ABNORMAL RESULT NOBODY WITH AUTHORITY EVER SAW. Critical pinned first,
    // then abnormal, then normal; oldest first within each, because the oldest
    // unanswered result is the one most likely to have been forgotten.
    // ══════════════════════════════════════════════════════════════════════
    const ResultsInbox = () => {
      const [d, setD] = useState(null);
      const [err, setErr] = useState('');
      const [busy, setBusy] = useState('');
      const [notes, setNotes] = useState({});
      const load = useCallback(() => {
        api.resultsInbox().then(r => { setD(r); setErr(''); }).catch(e => setErr(e.message));
      }, []);
      useEffect(load, [load]);
      if (err) return <div className="p-7"><p className="text-red-600 text-sm">{err}</p></div>;
      if (!d) return <div className="p-10 text-stone-400 text-sm">Loading the inbox…</div>;
      const rows = d.results || [];
      const ack = (r) => {
        setBusy(r.id);
        return api.acknowledgeResult(r.id, notes[r.id] || '')
          .then(() => { setBusy(''); load(); })
          .catch(e => { setBusy(''); setErr(e.message); });
      };
      const tone = { critical: 'bg-red-50 text-red-700 border-red-200', abnormal: 'bg-amber-50 text-amber-800 border-amber-200', normal: 'bg-stone-50 text-stone-600 border-stone-200' };
      return (
        <div className="p-4 lg:p-7">
          <div className="card mb-4">
            <div className="card-h">
              <h2>Results waiting for review</h2>
              <span className="chip bg-primary-50 text-primary">{rows.length}</span>
            </div>
            <div className="p-4 text-sm">
              {rows.length === 0 && <p className="text-stone-500">Nothing is waiting on you.</p>}
              {rows.map(r => (
                <div key={r.id} className={`py-2.5 px-3 mb-2 rounded border ${tone[r.interpretation] || tone.normal}`}>
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <div className="font-semibold text-[13px]">
                      {(d.interpretationLabels && d.interpretationLabels[r.interpretation]) || r.interpretation}
                      {r.clientName ? ` · ${r.clientName}` : ''}
                      {r.orderReference ? ` · ${r.orderReference}` : ''}
                    </div>
                    <div className="flex items-center gap-1.5">
                      {r.escalated && <span className="chip bg-red-600 text-white">escalated</span>}
                      {r.unmatched && <span className="chip bg-white text-stone-600 border border-stone-200">no matching order</span>}
                    </div>
                  </div>
                  <div className="text-xs mt-0.5">{r.summary}</div>
                  <div className="text-[11px] mt-0.5 opacity-80">
                    {r.performedBy} · result dated {r.resultDate} · received {fmtTs(r.receivedAt)}
                    {r.routeTo && r.routeTo.name ? ` · routed to ${r.routeTo.name}${r.routeTo.via === 'authorizing_provider' ? ' (authorizing provider on the standing order)' : ''}` : ''}
                    {r.document && !r.document.emrFiled ? ' · NOT filed in the chart' : ''}
                  </div>
                  {r.canAcknowledge ? (
                    <div className="grid gap-1.5 mt-2">
                      {r.followUpRequired && (
                        <input className="inp" placeholder="What are you doing about it? (required)"
                          value={notes[r.id] || ''} onChange={e => setNotes({ ...notes, [r.id]: e.target.value })} />
                      )}
                      <div className="flex justify-end">
                        <button className="btn !py-1.5" disabled={busy === r.id || (r.followUpRequired && !(notes[r.id] || '').trim())}
                          onClick={() => ack(r)}>{busy === r.id ? 'Recording…' : 'Acknowledge'}</button>
                      </div>
                    </div>
                  ) : (
                    <p className="text-[11px] mt-1.5 opacity-80">
                      Clinically acknowledging a {r.interpretation} result is a provider's. It stays here until one does.
                    </p>
                  )}
                </div>
              ))}
              <p className="text-[10.5px] text-stone-400 mt-2">
                An unacknowledged critical result escalates to the office after {d.thresholds && d.thresholds.criticalHours} hours;
                an abnormal one after {d.thresholds && d.thresholds.abnormalBusinessDays} business days.
              </p>
            </div>
          </div>
          {(d.escalations || []).length > 0 && (
            <div className="card">
              <div className="card-h"><h2>Escalated — nobody has answered these</h2><span className="chip bg-red-600 text-white">{d.escalations.length}</span></div>
              <div className="p-4 text-sm">
                {d.escalations.map(e => (
                  <div key={e.id} className="py-1.5 border-b border-stone-100 last:border-0 text-xs">
                    <b>{e.interpretation}</b>{e.orderReference ? ` · ${e.orderReference}` : ''} · received {fmtTs(e.receivedAt)} ·
                    past its {e.thresholdDescription} · routed to {(e.routeTo && e.routeTo.name) || 'nobody'}
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    };

    // ══════════════════════════════════════════════════════════════════════
    // SESSION 4.10 — OVERDUE ORDERS: THE LOST FAX
    //
    // The failure mode of a manual workflow, and the harm is not that a fax was
    // lost — it is that nobody noticed. An order sent and never answered looks
    // exactly like one working its way through a lab, so the recipient and the
    // number it went to are on the row: the point of this screen is that
    // somebody can pick up the phone.
    // ══════════════════════════════════════════════════════════════════════
    const OverdueOrders = () => {
      const [d, setD] = useState(null);
      const [err, setErr] = useState('');
      useEffect(() => { api.overdueOrders().then(r => { setD(r); setErr(''); }).catch(e => setErr(e.message)); }, []);
      if (err) return <div className="p-7"><p className="text-red-600 text-sm">{err}</p></div>;
      if (!d) return <div className="p-10 text-stone-400 text-sm">Loading…</div>;
      const rows = d.orders || [];
      return (
        <div className="p-4 lg:p-7">
          <div className="card">
            <div className="card-h"><h2>Sent and never answered</h2><span className="chip bg-amber-50 text-amber-800">{rows.length}</span></div>
            <div className="p-4 text-sm">
              {rows.length === 0 && <p className="text-stone-500">Nothing is overdue.</p>}
              {rows.map(o => (
                <div key={o.id} className="py-2 border-b border-stone-100 last:border-0">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <div className="font-semibold text-[13px]">
                      {o.orderType} · {o.clientName || o.clientId} {o.orderReference ? <span className="text-stone-500">· {o.orderReference}</span> : null}
                    </div>
                    <span className="chip bg-amber-50 text-amber-800">{o.ageDays} days · threshold {o.thresholdDays}</span>
                  </div>
                  <div className="text-xs text-stone-500">{(o.tests || []).join(', ')}</div>
                  <div className="text-xs text-stone-600 mt-0.5">
                    Sent {fmtTs(o.sentAt)} to <b>{o.recipientName || 'an unnamed recipient'}</b>
                    {o.recipientFax ? <span> at <b>{String(o.recipientFax).replace(/(\d{3})(\d{3})(\d{4})/, '($1) $2-$3')}</b></span> : null}
                    {o.orderingClinician && o.orderingClinician.name ? ` · ordered by ${o.orderingClinician.name}` : ''}
                  </div>
                </div>
              ))}
              <p className="text-[10.5px] text-stone-400 mt-2">
                Thresholds: {Object.entries(d.thresholds || {}).map(([k, v]) => `${k} ${v}d`).join(' · ')}.
              </p>
            </div>
          </div>
        </div>
      );
    };

    // The encounter panel: coding, Rx, orders, sign & close, addenda.
    // ── Session 4.12 Scope F5 — act from inside the encounter ──────────────
    // Mid-visit a clinician needs the rest of the chart: what this patient is
    // allergic to before prescribing, what they are already taking, what the
    // problem list says, whether the result that was chased has landed, and
    // somewhere to put the document just handed over. Every one of those lived
    // on a different tab, and getting to it meant leaving the encounter —
    // which on a phone in someone's front room means losing your place in the
    // visit you are documenting.
    //
    // IT MOUNTS THE EXISTING TAB COMPONENTS. Not a summary of them, not a
    // second rendering: the same components, reading the same chart, writing
    // through the same routes. A second view of "what is this patient
    // allergic to" is how the two start disagreeing, which is the rule the
    // allergy strip already follows one layer down.
    const LOOKUPS = [
      { key: 'allergies', label: 'Allergies', icon: 'ti-alert-triangle' },
      { key: 'medications', label: 'Medications', icon: 'ti-pill' },
      { key: 'problems', label: 'Problems', icon: 'ti-list-details' },
      { key: 'results', label: 'Results', icon: 'ti-flask' },
      { key: 'documents', label: 'Documents', icon: 'ti-file-text' }
    ];
    // ── Session 4.12 Scope G — the risk assessment ─────────────────────────
    // A psychiatric encounter cannot be SIGNED without one. Documenting is
    // never blocked, which is why this is a card on the visit rather than a
    // dialog in the way.
    //
    // The levels, the domains and WHICH of them need a plan are all SERVED.
    // A page that carries its own list of risk levels drifts from the
    // validator that refuses one it no longer knows, and the plan rule
    // restated here would be a second answer to a clinical question.
    const RISK_CHIP = {
      none: 'bg-emerald-50 text-emerald-700', low: 'bg-emerald-50 text-emerald-700',
      moderate: 'bg-amber-50 text-amber-800', high: 'bg-red-50 text-red-700', imminent: 'bg-red-600 text-white'
    };
    const RiskCard = ({ d, patient, euuid, locked, busy, onSave }) => {
      const latest = d.riskAssessment;
      const [open, setOpen] = useState(false);
      const [f, setF] = useState(() => ({
        suicide: (latest && latest.levels.suicide) || '', homicide: (latest && latest.levels.homicide) || '',
        selfNeglect: (latest && latest.levels.selfNeglect) || '',
        protectiveFactors: '', meansRestriction: '', plan: ''
      }));
      const set = (k, v) => setF(p => ({ ...p, [k]: v }));
      // Whether a plan is needed is the SERVER's answer, read off the list it
      // served. Deciding it here would be a second clinical rule to keep in
      // step with the one that refuses the save.
      const needsPlan = (d.riskDomains || []).some(k => (d.riskNeedsPlan || []).includes(f[k]));
      return (
        <div className="card mb-4">
          <div className="card-h">
            <h2><i className="ti ti-shield-exclamation mr-1 text-accent" />Risk assessment</h2>
            {latest
              ? <span className={`chip ${RISK_CHIP[highestOf(latest, d.riskDomains, d.riskLevels)] || 'bg-stone-100 text-stone-600'}`}>{highestOf(latest, d.riskDomains, d.riskLevels)}</span>
              : <span className={`chip ${d.riskRequired ? 'bg-amber-50 text-amber-800' : 'bg-stone-100 text-stone-500'}`}>{d.riskRequired ? 'Required to sign' : 'Not recorded'}</span>}
          </div>
          <div className="p-4 text-sm grid gap-2">
            {latest ? (
              <div className="text-xs text-stone-600">
                {(d.riskDomains || []).map(k => <span key={k} className="mr-3">{k}: <b>{latest.levels[k]}</b></span>)}
                <div className="text-[11px] text-stone-500 mt-0.5">{npiLabel(latest.by)} · {fmtTs(latest.at)}</div>
                {latest.plan && <div className="mt-1 whitespace-pre-wrap text-[13px]">{latest.plan}</div>}
              </div>
            ) : (
              <p className="text-xs text-stone-500">
                {d.riskRequired
                  ? 'This is a psychiatric visit, so it cannot be signed until a risk assessment is recorded. Documenting the visit is not blocked.'
                  : 'Not required for this visit type. Record one anyway if the visit warrants it.'}
              </p>
            )}
            {/* Appended, never rewritten: risk changes inside one visit and
                overwriting would lose that the clinician escalated. */}
            {(d.riskHistory || []).length > 1 && (
              <details className="text-[11px] text-stone-500">
                <summary className="cursor-pointer">Earlier in this visit ({d.riskHistory.length - 1})</summary>
                {d.riskHistory.slice(1).map(r => (
                  <div key={r.id} className="mt-1">{highestOf(r, d.riskDomains, d.riskLevels)} · {npiLabel(r.by)} · {fmtTs(r.at)}</div>
                ))}
              </details>
            )}
            {!locked && !open && <button className="btn ghost !py-1 !px-2.5 text-xs w-fit" onClick={() => setOpen(true)}>{latest ? 'Record a change in risk' : 'Record risk assessment'}</button>}
            {!locked && open && (
              <div className="grid gap-3 border-t border-stone-100 pt-3">
                <div className="grid md:grid-cols-3 gap-2">
                  {(d.riskDomains || []).map(k => (
                    <Field key={k} label={k.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase())}>
                      <select className="inp" value={f[k]} onChange={e => set(k, e.target.value)}>
                        <option value="">— select —</option>
                        {(d.riskLevels || []).map(l => <option key={l} value={l}>{l}</option>)}
                      </select>
                    </Field>
                  ))}
                </div>
                <Field label="Protective factors"><textarea className="inp" rows={2} value={f.protectiveFactors} onChange={e => set('protectiveFactors', e.target.value)} /></Field>
                <Field label="Means restriction"><textarea className="inp" rows={2} value={f.meansRestriction} onChange={e => set('meansRestriction', e.target.value)} /></Field>
                <Field label={needsPlan ? 'Plan — required at this level of risk' : 'Plan'}>
                  <textarea className="inp" rows={3} value={f.plan} onChange={e => set('plan', e.target.value)} />
                </Field>
                {needsPlan && <p className="text-[11px] text-amber-700"><i className="ti ti-alert-triangle mr-1" />An assessment with no plan records that the risk was seen, not that it was handled.</p>}
                <div className="flex gap-2">
                  <button className="btn w-fit" disabled={busy} onClick={() => onSave(f).then(() => setOpen(false)).catch(() => {})}>
                    {busy ? 'Recording…' : 'Record assessment'}
                  </button>
                  <button className="btn ghost w-fit" disabled={busy} onClick={() => setOpen(false)}>Cancel</button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };
    // The worst of the domains, ranked by the order the SERVER SERVED THE
    // LEVELS IN. A local copy of that order is a second answer to "which risk
    // is worse", and it goes stale the day a level is added — the same reason
    // the levels themselves are not listed here.
    const highestOf = (a, domains, levels) => {
      if (!a || !a.levels) return null;
      const rank = (v) => (levels || []).indexOf(v);
      return (domains || []).map(k => a.levels[k]).filter(Boolean)
        .sort((x, y) => rank(y) - rank(x))[0] || null;
    };

    const EncounterLookups = ({ patient, chart, onChartChanged }) => {
      const [open, setOpen] = useState(null);
      return (
        <div className="card mb-4">
          <div className="card-h">
            <h2><i className="ti ti-stethoscope mr-1 text-accent" />The rest of the chart</h2>
            {open && <button className="btn ghost !py-1 !px-2.5 text-xs" onClick={() => setOpen(null)}>Close</button>}
          </div>
          <div className="p-4">
            <div className="flex flex-wrap gap-1.5">
              {LOOKUPS.map(l => (
                <button key={l.key}
                  className={`chip border ${open === l.key ? 'bg-primary text-white border-primary' : 'bg-white text-primary border-stone-200'}`}
                  onClick={() => setOpen(v => v === l.key ? null : l.key)}>
                  <i className={`ti ${l.icon} mr-1`} />{l.label}
                </button>
              ))}
            </div>
            {!open && <p className="text-[11px] text-stone-400 mt-2">Open any of these here — you stay in the encounter and nothing you have typed is lost.</p>}
            {open && (
              <div className="mt-3 border-t border-stone-100 pt-3">
                {open === 'allergies' && <AllergiesTab chart={chart} />}
                {open === 'medications' && <MedicationsTab chart={chart} patient={patient} />}
                {open === 'problems' && <ProblemsTab chart={chart} />}
                {open === 'results' && <ResultsTab patient={patient} />}
                {open === 'documents' && <DocumentsTab chart={chart} patient={patient} onChartChanged={onChartChanged} />}
              </div>
            )}
          </div>
        </div>
      );
    };

    const EncounterPanel = ({ patient, euuid, chart, onChartChanged, onBack, onChanged }) => {
      const [d, setD] = useState(null);
      const [err, setErr] = useState('');
      const [busy, setBusy] = useState('');
      const [msg, setMsg] = useState(null);
      const [diagnoses, setDiagnoses] = useState([]);
      const [services, setServices] = useState([]);
      const [addToProblemList, setAddToProblemList] = useState([]);
      const [attest, setAttest] = useState(false);
      const [addendum, setAddendum] = useState('');
      const [showRx, setShowRx] = useState(false); const [showOrder, setShowOrder] = useState(false);
      // F3: one step per screen on a phone. Presentation only — the panel is
      // the SAME mounted component on every step, so nothing typed on one is
      // lost by moving to another.
      const narrow = useNarrowViewport();
      const [step, setStep] = useState('visit');
      // 4.3: clinician-authored patient-facing text — the only visit text the
      // patient portal ever shows (never the narrative note)
      const [facing, setFacing] = useState({ patientSummary: '', followUpInstructions: '' });
      const canWrite = useCanWrite();
      // Session 4.8 — certification, not one boolean. Each control asks for the
      // capability it actually needs, so an RN sees the chart and the note and
      // does not see a Record Rx button the server would refuse.
      const canPrescribe = useCan('prescribe');
      const canOrderDirect = useCan('orderDirect');
      const canOrderStanding = useCan('orderStanding');
      const canSelectCodes = useCan('selectServiceCodes');
      const canAdvanceOrders = useCan('orderStatusAdvance');
      const myClinicalRole = useClinicalRole();
      const canSignBillable = useCan('signBillableEncounter');
      const [standingOrders, setStandingOrders] = useState([]);
      useEffect(() => {
        if (!canOrderStanding) return;
        api.myStandingOrders().then(r => setStandingOrders((r && r.standingOrders) || [])).catch(() => setStandingOrders([]));
      }, [canOrderStanding]);
      const load = useCallback(() => {
        api.encounterDetail(patient.id, euuid).then(r => {
          setD(r); setErr('');
          setDiagnoses(r.record.diagnoses || []); setServices(r.record.services || []); setAddToProblemList([]);
          setFacing({ patientSummary: r.record.patientSummary || '', followUpInstructions: r.record.followUpInstructions || '' });
        }).catch(e => setErr(e.message));
      }, [patient.id, euuid]);
      useEffect(load, [load]);
      const run = (label, fn, okText) => {
        setBusy(label); setMsg(null);
        return fn().then(r => {
          setMsg({ ok: true, text: `${okText || r.message}${r.warnings && r.warnings.length ? ` — ${r.warnings.join(' · ')}` : ''}` });
          load(); onChanged && onChanged(); return r;
        }).catch(e => setMsg({ ok: false, text: e.data && e.data.missing ? `${e.message}` : e.message })).finally(() => setBusy(''));
      };
      if (err) return <div className="card p-4"><p className="text-red-600 text-sm">{err}</p><button className="btn ghost mt-2" onClick={onBack}>Back</button></div>;
      if (!d) return <p className="text-sm text-stone-500 p-4">Loading encounter from OpenEMR…</p>;
      const closed = d.closed;
      // Read-only for a signed encounter OR a read-only role (case manager)
      const locked = closed || !canWrite;
      // Session 4.8 — GATE ON WHAT IS BEING ATTESTED. An encounter carrying a
      // service code is a claim, and the claim asserts the signer was certified
      // to render it. With no service codes it is nursing documentation, and an
      // RN attesting her own note is exactly right. Mirrors
      // clinicalRoles.evaluateEncounterSignature; the route decides.
      const encounterServiceCodes = (d.record.services || []).map(x => x.code);
      const carriesService = encounterServiceCodes.length > 0;
      const canSignThisEncounter = carriesService ? canSignBillable : canWrite;
      const signBlockReason = carriesService
        ? `This encounter carries a billable service code (${encounterServiceCodes.join(', ')}), so it must be signed by a provider. A nursing note carrying no service code you can sign yourself.`
        : 'Signing an encounter requires a clinical licence.';
      const facingDirty = (facing.patientSummary || '') !== (d.record.patientSummary || '') || (facing.followUpInstructions || '') !== (d.record.followUpInstructions || '');
      const dirty = JSON.stringify(diagnoses) !== JSON.stringify(d.record.diagnoses || []) || JSON.stringify(services) !== JSON.stringify(d.record.services || []) || facingDirty;
      const ORDER_LABEL = { ordered: 'Ordered', sent: 'Sent', resulted: 'Resulted', cancelled: 'Cancelled' };
      // On a phone one step shows at a time; at a desk the whole encounter is
      // one scroll, because a reviewer wants to see all of it at once. Two
      // different jobs, so two different shapes rather than one compromise.
      const on = (k) => !narrow || step === k;
      return (
        <div className="max-w-4xl">
          <button className="text-xs text-primary underline mb-2" onClick={onBack}><i className="ti ti-arrow-left" /> All encounters</button>
          {narrow && <EncounterStepRail step={step} onStep={setStep} blockers={(d.signReadiness && d.signReadiness.missing) || []} closed={closed} />}
          {/* The header is on every step: who this is and whether it is signed
              is the context for all four, and hiding it would leave a screen
              that does not say whose encounter it belongs to. */}
