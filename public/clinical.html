          <div className="card mb-4">
            <div className="card-h"><h2>{d.encounter.reason || 'Encounter'}</h2><EncStateChip state={d.state} /></div>
            <div className="p-4 text-sm grid gap-1">
              <div className="flex flex-wrap gap-4 text-xs text-stone-500">
                <span>Date <b>{d.encounter.date || '—'}</b></span>
                <span>OpenEMR encounter <b>#{d.encounter.eid || '—'}</b></span>
                <span>Rendering clinician <b>{npiLabel(d.record.renderingProvider)}</b></span>
                <span>Billing provider NPI <b>{d.billingNpiUsed || <span className="text-red-600">not configured (Settings)</span>}</b></span>
              </div>
              {d.encounter.billingNote && <div className="text-xs text-stone-500">OpenEMR billing note: {d.encounter.billingNote}</div>}
              {closed && (
                <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-2.5 text-xs text-emerald-900 mt-1">
                  <b>Signed & closed {fmtTs(d.attestation.signedAt)} by {npiLabel(d.attestation.signedBy)}.</b> This encounter is read-only. Corrections go in as addenda below, each with its own signer and timestamp.
                </div>
              )}
              {(d.warnings || []).map((w, i) => <p key={i} className="text-xs text-amber-700"><i className="ti ti-alert-triangle mr-1" />{w}</p>)}
              {d.record.structuredNoteError && !locked && (
                <button className="btn ghost !py-1 !px-2.5 text-xs w-fit" disabled={busy === 'resync'} onClick={() => run('resync', () => api.resync(patient.id, euuid))}>Retry EMR sync</button>
              )}
            </div>
          </div>

          {on('visit') && <div className="card mb-4">
            <div className="card-h"><h2>Narrative note{d.narrativeNotes.length > 1 ? 's' : ''}</h2><span className="text-[10.5px] text-stone-500">as written to OpenEMR — never edited by the app</span></div>
            <div className="p-4 text-sm grid gap-3">
              {d.notesError && <p className="text-xs text-red-600">{d.notesError}</p>}
              {!d.notesError && d.narrativeNotes.length === 0 && <p className="text-xs text-amber-700">No narrative note found on this encounter in OpenEMR — signing requires one.</p>}
              {d.narrativeNotes.map(n => (
                <div key={n.id} className="grid gap-1.5 text-xs">
                  {[['S', n.subjective], ['O', n.objective], ['A', n.assessment], ['P', n.plan]].map(([k, v]) => v ? <div key={k}><b className="text-primary">{k}</b> <span className="whitespace-pre-wrap">{v}</span></div> : null)}
                </div>
              ))}
            </div>
          </div>}

          {/* On the Visit step, where the clinician is reading the note and
              deciding. Shown even when not required, so a risk that turns up
              on a non-psychiatric visit has somewhere to go. */}
          {on('visit') && (
            <RiskCard d={d} patient={patient} euuid={euuid} locked={locked} busy={busy === 'risk'}
              onSave={(form) => run('risk', () => api.saveRisk(patient.id, euuid, form))} />
          )}

          {on('visit') && <EncounterLookups patient={patient} chart={chart} onChartChanged={onChartChanged} />}

          {on('coding') && <div className="card mb-4">
            <div className="card-h"><h2>Coding — diagnoses &amp; services</h2>
              <span className={`chip ${d.record.codingStatus === 'coded' ? 'bg-primary-50 text-primary' : 'bg-amber-50 text-amber-800'}`}>{d.record.codingStatus === 'coded' ? 'CODED' : 'NOT CODED'}</span>
            </div>
            <div className="p-4 grid gap-4">
              <div>
                <span className="lblu block mb-1">Diagnoses (ICD-10-CM)</span>
                <DxEditor diagnoses={diagnoses} setDiagnoses={setDiagnoses} candidates={d.candidates} clientId={patient.id} readOnly={locked}
                  addToProblemList={addToProblemList} setAddToProblemList={setAddToProblemList} />
                {d.candidatesError && <p className="text-[11px] text-amber-700 mt-1">Problem list unavailable: {d.candidatesError}</p>}
              </div>
              <div>
                <span className="lblu block mb-1">Services (CPT / HCPCS) — each linked to ≥1 diagnosis</span>
                {/* Session 4.8: certification gates the CODE. The service
                    editor goes read-only for a credential that may not select
                    one — the diagnosis editor above does not, because an RN
                    correcting a diagnosis is not coding a claim. The route
                    gates on the codes CHANGING, so a read-only editor and the
                    server agree without the page having to re-derive it. */}
                <SvcEditor services={services} setServices={setServices} diagnoses={diagnoses} readOnly={locked || !canSelectCodes}
                  practiceFavorites={d.favorites.practiceServices} favorites={d.favorites.services} />
                {!locked && !canSelectCodes && <p className="text-[11px] text-stone-400 mt-1">Selecting a service code is a provider's (an LCSW selects the behavioural-health set). You can still correct the diagnoses.</p>}
              </div>
              <div className="border-t border-stone-100 pt-3">
                <span className="lblu block mb-1">Patient-facing summary (shown in the patient portal — plain language, optional)</span>
                <div className="grid md:grid-cols-2 gap-3">
                  <Field label="What we did today, in plain words"><textarea className="inp" rows={3} maxLength={1000} disabled={locked} value={facing.patientSummary} onChange={e => setFacing({ ...facing, patientSummary: e.target.value })} placeholder="e.g. We checked your blood pressure and adjusted your water pill." /></Field>
                  <Field label="Follow-up instructions for the patient"><textarea className="inp" rows={3} maxLength={600} disabled={locked} value={facing.followUpInstructions} onChange={e => setFacing({ ...facing, followUpInstructions: e.target.value })} placeholder="e.g. Take the new dose each morning; we will see you again in 4 weeks." /></Field>
                </div>
                <p className="text-[11px] text-stone-400 mt-1">Without this, the portal shows only the diagnoses addressed, prescriptions recorded and tests ordered. The narrative note is never shown to patients.</p>
              </div>
              {!locked && (
                <div className="flex items-center gap-3">
                  <button className="btn" disabled={busy === 'coding' || !dirty} onClick={() => run('coding', () => api.saveCoding(patient.id, euuid, { diagnoses, services, addToProblemList, ...facing }))}>
                    <i className="ti ti-device-floppy" />{busy === 'coding' ? 'Saving…' : 'Save coding'}
                  </button>
                  {dirty && <span className="text-xs text-amber-700">Unsaved changes</span>}
                </div>
              )}
            </div>
          </div>}

          {on('actions') && <div className="grid md:grid-cols-2 gap-4 mb-4">
            <div className="card">
              <div className="card-h"><h2>Prescriptions</h2>{!locked && canPrescribe && <button className="btn ghost !py-1 !px-2.5 text-xs" onClick={() => setShowRx(v => !v)}>{showRx ? 'Close' : '+ Record Rx'}</button>}</div>
              <div className="p-4 text-sm">
                {d.prescriptions.length === 0 && <p className="text-xs text-stone-400">None recorded on this encounter.</p>}
                {d.prescriptions.map(r => (
                  <div key={r.id} className="py-1.5 border-b border-stone-100 last:border-0">
                    <div className="font-semibold text-[13px]">{r.drug} {r.dose} · {r.route} · {r.frequency} <span className="chip bg-stone-100 text-stone-600 ml-1">{r.kind}</span>
                      {r.schedule && r.schedule !== 'non_controlled' && <span className="chip bg-amber-50 text-amber-800 ml-1">{r.schedule === 'unclassified' ? 'schedule not recorded' : r.schedule}</span>}
                    </div>
                    <div className="text-xs text-stone-500">qty {r.quantity} · refills {r.refills} · {r.date} · {npiLabel(r.prescriber)}{r.emrMedicationId ? ' · on the OpenEMR med list' : (r.emrWriteError ? ' · OpenEMR med-list write failed' : '')} · <b>not transmitted</b></div>
                    {r.instructions && <div className="text-xs text-stone-500">{r.instructions}</div>}
                  </div>
                ))}
                {!locked && !canPrescribe && <p className="text-[11px] text-stone-400 mt-2">Prescribing is a provider's — your credential can read what was prescribed but not add to it.</p>}
                {showRx && !locked && canPrescribe && <RxForm routes={d.rxRoutes} schedules={d.rxSchedules} scheduleLabels={d.rxScheduleLabels} prescriber={d.prescriber} busy={busy === 'rx'} onSave={(f) => run('rx', () => api.addRx(patient.id, euuid, f)).then(() => setShowRx(false))} />}
                <p className="text-[10.5px] text-stone-400 mt-2">Record only — e-prescribing is out of scope; transmission continues as today.</p>
              </div>
            </div>
            <div className="card">
              <div className="card-h"><h2>Orders</h2>{!locked && (canOrderDirect || canOrderStanding) && <button className="btn ghost !py-1 !px-2.5 text-xs" onClick={() => setShowOrder(v => !v)}>{showOrder ? 'Close' : '+ Record order'}</button>}</div>
              <div className="p-4 text-sm">
                {d.orders.length === 0 && <p className="text-xs text-stone-400">None recorded on this encounter.</p>}
                {d.orders.map(o => {
                  // A referral's lifecycle is not a lab's, so the transitions
                  // come from the map the SERVER chose for this order's type.
                  const trans = (o.orderType === 'referral' ? d.referralTransitions : d.orderTransitions) || {};
                  const headline = o.orderType === 'referral'
                    ? `Referral · ${(o.referral && o.referral.specialty) || ''}${o.referral && o.referral.receivingPractice ? ` → ${o.referral.receivingPractice}` : ''}`
                    : o.orderType === 'dme'
                      ? `DME · ${(o.dme && o.dme.itemDescription) || ''}${o.dme && o.dme.quantity ? ` ×${o.dme.quantity}` : ''}`
                      : `${o.orderType} · ${o.priority} — ${(o.tests || []).join(', ')}`;
                  return (
                  <div key={o.id} className="py-1.5 border-b border-stone-100 last:border-0">
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <div className="font-semibold text-[13px]">{headline}</div>
                      <span className={`chip ${['resulted', 'completed'].includes(o.status) ? 'bg-emerald-50 text-emerald-700' : o.status === 'cancelled' ? 'bg-stone-100 text-stone-500' : 'bg-primary-50 text-primary'}`}>{ORDER_LABEL[o.status] || o.status}</span>
                    </div>
                    <div className="text-xs text-stone-500">
                      dx {o.diagnosisCodes.join(', ')} · {npiLabel(o.orderingClinician)} · {fmtTs(o.createdAt)}
                      {o.orderReference && <span> · <b className="text-stone-700">{o.orderReference}</b></span>}
                    </div>
                    {o.orderType === 'dme' && o.dme && o.dme.requiresWOPD &&
                      <div className="text-[11px] font-semibold text-amber-800 mt-0.5">Written order prior to delivery — the supplier may not deliver before they hold it.</div>}
                    {o.orderType === 'referral' && o.referral && o.referral.priorAuthRequired &&
                      <div className="text-[11px] text-amber-800 mt-0.5">Prior authorization required{o.referral.priorAuthNumber ? ` — ${o.referral.priorAuthNumber}` : ' — not yet obtained'}.</div>}
                    {o.referral && o.referral.appointmentDate &&
                      <div className="text-[11px] text-stone-600 mt-0.5">Appointment {o.referral.appointmentDate}.</div>}
                    {o.medicareEnrollmentAcknowledgment &&
                      <div className="text-[11px] text-amber-800 mt-0.5">Placed with an acknowledged 42 CFR 424.507 warning — {o.medicareEnrollmentAcknowledgment.reason}</div>}
                    <OrderActions order={o} channels={d.sendChannels} channelLabels={d.sendChannelLabels}
                      defaultChannel={d.defaultSendChannel} faxChannels={d.faxSendChannels}
                      interpretations={d.resultInterpretations} busy={busy === `o${o.id}`}
                      onSent={(body) => run(`o${o.id}`, () => api.markOrderSent(o.id, body))}
                      onScheduled={(date) => run(`o${o.id}`, () => api.markReferralScheduled(o.id, date))}
                      onResult={(r) => {
                        const fd = new FormData();
                        fd.append('file', r.file);
                        ['interpretation', 'resultDate', 'performedBy', 'summary'].forEach(k => fd.append(k, r[k]));
                        return run(`o${o.id}`, () => api.attachResult(o.id, fd));
                      }} />
                    <div className="flex flex-wrap gap-1.5 mt-1">
                      {canAdvanceOrders && (trans[o.status] || [])
                        // 4.10: only the statuses that carry NO evidence are
                        // clickable. 'sent', 'scheduled', 'resulted' and
                        // 'completed' have their own controls above; offering a
                        // button the server refuses is worse than no button.
                        .filter(n => n === 'cancelled')
                        .map(n => (
                        <button key={n} className="chip border bg-white text-primary border-stone-200" disabled={busy === `o${o.id}`}
                          onClick={() => run(`o${o.id}`, () => api.orderStatus(o.id, n))}>mark {(ORDER_LABEL[n] || n).toLowerCase()}</button>
                      ))}
                    </div>
                  </div>
                  );
                })}
                {showOrder && !locked && (canOrderDirect || canOrderStanding) &&
                  <OrderForm diagnoses={diagnoses} types={d.orderTypes} priorities={d.orderPriorities} busy={busy === 'order'}
                    docTypes={d.documentOrderTypes}
                    standingOrders={standingOrders} requireStandingOrder={!canOrderDirect}
                    onSave={(f) => run('order', () => api.addOrder(patient.id, euuid, f)).then(() => setShowOrder(false))} />}
                {!locked && !canOrderDirect && canOrderStanding && <p className="text-[11px] text-stone-400 mt-2">You place orders under a signed standing order. Pick the protocol, then the test it permits.</p>}
                <p className="text-[10.5px] text-stone-400 mt-2">The app generates; a person transmits. Open the requisition, fax it from Doximity, then record the send here — that is what moves an order to sent. Attaching the result is what moves it to resulted. Both still work after the encounter is signed.</p>
              </div>
            </div>
          </div>}

          {on('sign') && !locked && !canSignThisEncounter && (
            <div className="card mb-4">
              <div className="card-h"><h2>Sign &amp; close encounter</h2></div>
              <div className="p-4 text-sm text-amber-800">
                {signBlockReason}
              </div>
            </div>
          )}

          {on('sign') && !locked && canSignThisEncounter && (
            <div className="card mb-4">
              <div className="card-h"><h2>Sign &amp; close encounter</h2>
                <span className={`chip ${d.signReadiness.ok ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-800'}`}>{d.signReadiness.ok ? 'Ready to sign' : `${d.signReadiness.missing.length} blocker${d.signReadiness.missing.length > 1 ? 's' : ''}`}</span>
              </div>
              <div className="p-4 grid gap-3 text-sm">
                {!d.signReadiness.ok && <p className="text-xs text-amber-700">{d.signReadiness.message}{dirty ? ' Save your coding changes first.' : ''}</p>}
                <label className="flex items-start gap-2 text-xs">
                  <input type="checkbox" className="mt-0.5" checked={attest} onChange={e => setAttest(e.target.checked)} />
                  <span>I attest that this encounter documentation is accurate and complete, that I personally performed or directly supervised the services recorded, and that the diagnoses and service codes are supported by the note. Signing as <b>{npiLabel(d.me)}</b>.</span>
                </label>
                {!d.me.npi && <p className="text-[11px] text-amber-700"><i className="ti ti-alert-triangle mr-1" />Your NPI is not on file — an admin can add it in your user profile. Signing is allowed for test use and will be flagged.</p>}
                <button className="btn gold w-fit" disabled={!attest || !d.signReadiness.ok || dirty || busy === 'sign'} onClick={() => run('sign', () => api.sign(patient.id, euuid))}>
                  <i className="ti ti-writing-sign" />{busy === 'sign' ? 'Signing…' : 'Sign & close encounter'}
                </button>
                <p className="text-[10.5px] text-stone-400">Records the attestation with your name, NPI and timestamp, makes you the rendering provider on the charge, and writes the GFC structured coding/attestation note to the OpenEMR encounter for back-office billing.</p>
              </div>
            </div>
          )}

          {on('sign') && closed && (
            <div className="card mb-4">
              <div className="card-h"><h2>Attestation &amp; addenda</h2></div>
              <div className="p-4 grid gap-3 text-sm">
                <div className="text-xs text-stone-600 whitespace-pre-wrap border border-stone-100 rounded-lg p-2.5 bg-cream">{d.attestation.attestationText}<br /><b>{npiLabel(d.attestation.signedBy)} · {fmtTs(d.attestation.signedAt)}</b></div>
                {d.addenda.length === 0 && <p className="text-xs text-stone-400">No addenda.</p>}
                {d.addenda.map(a => (
                  <div key={a.id} className="border-l-4 border-accent pl-3 py-1">
                    <div className="text-xs text-stone-500">Addendum · {fmtTs(a.at)} · {npiLabel(a.by)}</div>
                    <div className="text-[13px] whitespace-pre-wrap">{a.text}</div>
                  </div>
                ))}
                {canWrite && <Field label="Add an addendum (signed as you, timestamped now)"><textarea className="inp" rows={2} value={addendum} onChange={e => setAddendum(e.target.value)} /></Field>}
                {canWrite && <button className="btn w-fit" disabled={addendum.trim().length < 3 || busy === 'addendum'} onClick={() => run('addendum', () => api.addAddendum(patient.id, euuid, addendum)).then(() => setAddendum(''))}>
                  {busy === 'addendum' ? 'Recording…' : 'Sign addendum'}
                </button>}
              </div>
            </div>
          )}
          {msg && <p className={`text-sm mb-3 ${msg.ok ? 'text-emerald-700' : 'text-red-600'}`}>{msg.text}</p>}
        </div>
      );
    };

    // Chart tab: this patient's encounters with coded / signed state.
    const EncountersTab = ({ patient, chart, initialEuuid, onOpened, onChartChanged }) => {
      const canWrite = useCanWrite();
      const [data, setData] = useState(null);
      const [err, setErr] = useState('');
      const [open, setOpen] = useState(initialEuuid || null);
      const [followUp, setFollowUp] = useState(false);
      const load = useCallback(() => { api.encounters(patient.id).then(r => { setData(r); setErr(''); }).catch(e => setErr(e.message)); }, [patient.id]);
      useEffect(load, [load]);
      useEffect(() => { if (initialEuuid) { setOpen(initialEuuid); onOpened && onOpened(); } }, [initialEuuid]);
      if (open) return <EncounterPanel patient={patient} euuid={open} chart={chart} onChartChanged={onChartChanged} onBack={() => { setOpen(null); load(); }} onChanged={load} />;
      if (err) return <p className="text-red-600 text-sm p-4">{err}</p>;
      if (!data) return <p className="text-sm text-stone-500 p-4">Loading encounters from OpenEMR…</p>;
      return (
        <div className="max-w-3xl">
          {!data.linked && <div className="card p-5 text-center"><i className="ti ti-stethoscope-off text-3xl text-accent" /><p className="text-sm text-stone-500 mt-1">Link this patient to OpenEMR to document visits.</p></div>}
          {data.linked && (
            <div className="card">
              <div className="card-h"><h2>Encounters</h2>
                {canWrite && <button className="btn gold !py-1.5" onClick={() => setFollowUp(true)}><i className="ti ti-stethoscope" />Document follow-up visit</button>}
              </div>
              <div className="p-4">
                {data.emrError && <p className="text-xs text-amber-700 mb-2">OpenEMR encounter list unavailable ({data.emrError}) — showing what the app has recorded.</p>}
                {data.encounters.length === 0 && <p className="text-sm text-stone-400">No encounters yet. The initial H&amp;P lives on its own tab; follow-ups start here.</p>}
                {data.encounters.map(e => (
                  <div key={e.id} className="flex flex-wrap items-center justify-between gap-2 py-2.5 border-b border-stone-100 last:border-0 cursor-pointer" onClick={() => setOpen(e.id)}>
                    <div>
                      <div className="font-semibold text-[13px]">{e.start ? fmtDate(e.start) : '—'} — {e.reason || e.type}</div>
                      <div className="text-xs text-stone-500">
                        {[e.renderingProvider ? npiLabel(e.renderingProvider) : e.provider, `${e.diagnosisCount} dx · ${e.serviceCount} svc · ${e.prescriptionCount} Rx · ${e.orderCount} orders`, e.signedAt && `signed ${fmtTs(e.signedAt)} by ${e.signedBy}`].filter(Boolean).join(' · ')}
                      </div>
                    </div>
                    <div className="flex items-center gap-1.5">
                      {e.structuredNoteError && <span className="chip bg-red-50 text-red-700" title={e.structuredNoteError}>EMR sync failed</span>}
                      <EncStateChip state={e.state} />
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
          {followUp && <FollowUpModal patient={patient} chart={chart} appt={null} onClose={() => setFollowUp(false)} onSaved={(r) => { setFollowUp(false); load(); setOpen(r.encounterUuid); }} />}
        </div>
      );
    };

    // Admin: billing identity (spec §2.5) + practice service-code favorites.
    const SettingsCard = () => {
      const [s, setS] = useState(null);
      const [f, setF] = useState(null);
      const [busy, setBusy] = useState(false); const [msg, setMsg] = useState(null);
      useEffect(() => { api.settings().then(r => { setS(r); setF({ billingNpiUsed: r.billingNpiUsed || '', billingProviderName: r.billingProviderName || '', favorites: (r.serviceCodeFavorites || []).map(x => `${x.code} | ${x.label || ''}`).join('\n') }); }).catch(e => setMsg({ ok: false, text: e.message })); }, []);
      if (!s || !f) return null;
      const save = () => {
        setBusy(true); setMsg(null);
        api.saveSettings({
          billingNpiUsed: f.billingNpiUsed, billingProviderName: f.billingProviderName,
          serviceCodeFavorites: f.favorites.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const [code, ...rest] = l.split('|'); return { code: code.trim(), label: rest.join('|').trim() }; })
        }).then(r => setMsg({ ok: true, text: r.message })).catch(e => setMsg({ ok: false, text: e.message })).finally(() => setBusy(false));
      };
      return (
        <div className="card mb-4">
          <div className="card-h"><h2>Billing settings</h2><span className="text-[10.5px] text-stone-500">gfc_payer_credentialing.billing_npi_used · admin only</span></div>
          <div className="p-4 grid gap-3 text-sm">
            <div className="grid md:grid-cols-2 gap-3">
              <Field label={`Billing provider NPI (${s.billingNpiSource === 'record' ? 'set here' : s.billingNpiSource === 'env_seed' ? 'seeded from env' : 'NOT SET — signing is blocked'})`}>
                <input className="inp font-mono" maxLength={10} disabled={!s.isAdmin} value={f.billingNpiUsed} onChange={e => setF({ ...f, billingNpiUsed: e.target.value.replace(/\D/g, '') })} />
              </Field>
              <Field label="Billing provider name"><input className="inp" disabled={!s.isAdmin} value={f.billingProviderName} onChange={e => setF({ ...f, billingProviderName: e.target.value })} /></Field>
            </div>
            <Field label="Practice service-code favorites — one per line: CODE | label (codes must exist in OpenEMR's fee schedule; the AMA descriptors stay in OpenEMR)">
              <textarea className="inp font-mono text-xs" rows={6} disabled={!s.isAdmin} value={f.favorites} onChange={e => setF({ ...f, favorites: e.target.value })} />
            </Field>
            {msg && <p className={`text-xs ${msg.ok ? 'text-emerald-700' : 'text-red-600'}`}>{msg.text}</p>}
            {s.isAdmin && <button className="btn w-fit" disabled={busy} onClick={save}>{busy ? 'Saving…' : 'Save settings'}</button>}
            <p className="text-[10.5px] text-stone-400">The billing provider is the NPI every coded encounter bills under (currently Bethel Godwins's individual NPI; flip it here when the organizational Medicare enrollment lands). Never hardcoded. The rendering provider is always the signing clinician.</p>
          </div>
        </div>
      );
    };

    // Staff coding queue (spec §2.6): every encounter that isn't coded/signed.
    const CodingQueueView = ({ onOpenEncounter }) => {
      const [filter, setFilter] = useState('open');
      const [data, setData] = useState(null);
      const [err, setErr] = useState('');
      useEffect(() => { setData(null); api.queue(filter).then(r => { setData(r); setErr(''); }).catch(e => setErr(e.message)); }, [filter]);
      return (
        <div className="p-4 lg:p-7">
          <SettingsCard />
          <div className="card">
            <div className="card-h"><h2>Coding queue</h2>
              <div className="flex gap-1.5">
                {[['open', 'Open'], ['not_coded', 'Not coded'], ['coded', 'Coded, unsigned'], ['signed', 'Signed'], ['all', 'All']].map(([k, l]) => (
                  <button key={k} className={`chip border ${filter === k ? 'bg-primary text-white border-primary' : 'bg-white text-primary border-stone-200'}`} onClick={() => setFilter(k)}>
                    {l}{data && data.counts && k in data.counts ? ` ${data.counts[k]}` : ''}
                  </button>
                ))}
              </div>
            </div>
            <div className="p-4">
              {err && <p className="text-red-600 text-sm">{err}</p>}
              {!err && !data && <p className="text-sm text-stone-500">Loading encounters from OpenEMR…</p>}
              {data && data.degraded && <p className="text-xs text-amber-700 mb-2">OpenEMR encounter feed unavailable{data.emrError ? ` (${data.emrError})` : ''} — showing encounters the app has recorded.</p>}
              {data && data.encounters.length === 0 && <p className="text-sm text-stone-400">Nothing here.</p>}
              {data && data.encounters.map(e => (
                <div key={e.encounterUuid} className="flex flex-wrap items-center justify-between gap-2 py-2.5 border-b border-stone-100 last:border-0 cursor-pointer" onClick={() => onOpenEncounter(e.clientId, e.encounterUuid)}>
                  <div>
                    <div className="font-semibold text-[13px]">{e.patientName || 'Patient'} — {e.reason}</div>
                    <div className="text-xs text-stone-500">{[e.date && fmtDate(e.date), e.renderingProvider ? npiLabel(e.renderingProvider) : e.provider, `${e.diagnosisCount} dx · ${e.serviceCount} svc`, e.signedAt && `signed ${fmtTs(e.signedAt)}`].filter(Boolean).join(' · ')}</div>
                  </div>
                  <EncStateChip state={e.state} />
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // ── App shell ──
    // ── Messages (Session 9) ──
    // At MODULE scope on purpose. A component defined inside another is a new
    // component identity on every parent render, so React unmounts and
    // remounts it and the caret jumps out of any field inside — the failure
    // test/react_input_focus.test.js exists to catch.
    // a filter on what is already permitted, never the permission itself.
    const MessagesTab = ({ patient }) => {
      const el = `gfc-messaging-clinical`;
      React.useEffect(() => {
        const lib = window.GFCMessaging;
        const token = getToken();
        if (!lib || !token || !patient) return undefined;
        lib.mount(el, {
          userId: (JSON.parse(localStorage.getItem('admin_user') || 'null') || {}).id,
          role: 'clinical',
          scopeClientId: patient.id,
          authToken: token
        });
        return () => lib.unmount(el);
      }, [patient && patient.id]);

      if (!window.GFCMessaging) {
        return <p className="text-sm text-stone-500">Messages did not load. Refresh the page.</p>;
      }
      return <div id={el} />;
    };

    const App = () => {
      const [user, setUser] = useState(() => {
        try { return JSON.parse(localStorage.getItem('admin_user') || 'null'); } catch { return null; }
      });
      const [patients, setPatients] = useState(null);
      const [q, setQ] = useState('');
      const [sel, setSel] = useState(null);
      const [chart, setChart] = useState(null);
      const [tab, setTab] = useState('summary');
      const [emrStatus, setEmrStatus] = useState(null);
      // Session 5.2: the OAuth round trip lands back here with ?emr=connected|error.
      const [emrReturn] = useState(() => new URLSearchParams(window.location.search).get('emr'));
      const [emrReturnReason] = useState(() => new URLSearchParams(window.location.search).get('reason'));
      useEffect(() => {
        if (emrReturn) window.history.replaceState({}, '', window.location.pathname);
      }, [emrReturn]);
      const connectEmr = async () => {
        try {
          const r = await authedFetch('/api/emr/connect');
          if (r && r.url) window.location.href = r.url;
        } catch (e) { alert(`Could not start the OpenEMR sign-in: ${e.message}`); }
      };
      const [linking, setLinking] = useState(false);
      const [linkCandidates, setLinkCandidates] = useState([]);
      const [err, setErr] = useState('');
      const [listOpen, setListOpen] = useState(true);
      // Whether the patient panel is open, remembered per browser. A clinician
      // who collapses it wants it collapsed next time; a preference like this is
      // exactly what localStorage is for, and it is read in a try/catch because
      // a private window or blocked site data makes the accessor throw. Open is
      // the default, so a failed read gives the panel rather than hiding it.
      const [panelOpen, setPanelOpen] = useState(() => {
        try { return window.localStorage.getItem('gfc.clinical.panel') !== 'closed'; }
        catch { return true; }
      });
      useEffect(() => {
        try { window.localStorage.setItem('gfc.clinical.panel', panelOpen ? 'open' : 'closed'); }
        catch { /* a preference that cannot be saved is not an error worth showing */ }
      }, [panelOpen]);
      // Session 4.12 I1 — MY DAY is the default route after sign-in. The
      // workspace used to open on a patient list, which is not how a house-call
      // day starts.
      const [view, setView] = useState('myday'); // 'myday' (4.12) | 'charts' | 'schedule' (4.2) | 'queue' (4.4) | 'inbox' (4.9) | 'results' | 'overdue' (4.10)
      const [hpApptEid, setHpApptEid] = useState(null); // H&P opened from an appointment
      const [encTarget, setEncTarget] = useState(null); // encounter to open on the Encounters tab (4.4)

      const loadPatients = useCallback(() => {
        if (!getToken()) return;
        api.patients(q).then(r => { setPatients(r.patients); setErr(''); })
          .catch(e => {
            if (e.code === 'AUTH') setUser(null);
            else setErr(e.message);
          });
      }, [q]);
      useEffect(() => { if (user) { loadPatients(); api.status().then(setEmrStatus).catch(() => {}); } }, [user, loadPatients]);

      // Clear every stored credential key the portals share, so signing out of
      // the workspace really signs out (not just this tab's view).
      const signOut = () => {
        ['admin_token', 'admin_user', 'unified_token', 'unified_user', 'portal_token', 'portal_user']
          .forEach(k => localStorage.removeItem(k));
        window.location.href = '/login';
      };

      const openPatient = (p, opts) => {
        setSel(p); setChart(null); setTab((opts && opts.tab) || 'summary'); setListOpen(false);
        setLinkCandidates([]);  // candidates belong to the patient that produced them
        setView('charts'); setHpApptEid((opts && opts.appointmentEid) || null);
        setEncTarget((opts && opts.encounterUuid) || null);
        api.chart(p.id).then(setChart).catch(e => setErr(e.message));
      };
      // Calendar → chart navigation (4.2): open the chart, or jump straight
      // into documentation (H&P for a first visit, Appointments tab otherwise).
      const openChartById = (clientId, opts) => {
        const p = (patients || []).find(x => x.id === clientId);
        if (p) openPatient(p, opts);
      };
      const documentFromSchedule = (appt) => {
        const p = (patients || []).find(x => x.id === appt.clientId);
        if (!p) return;
        openPatient(p, p.initialVisitAt ? { tab: 'appts' } : { tab: 'visit', appointmentEid: appt.eid });
      };
      const refreshChart = () => sel && api.chart(sel.id).then(setChart).catch(() => {});
      const link = (body) => {
        setLinking(true); setErr('');
        api.link(sel.id, body || {})
          .then(() => { setLinkCandidates([]); refreshChart(); loadPatients(); })
          .catch(e => {
            // The duplicate guard answers 409 with the matching charts rather
            // than creating a second one; show them instead of a bare error.
            const candidates = e.data && e.data.code === 'EMR_PATIENT_EXISTS' ? e.data.candidates : null;
            if (candidates && candidates.length) setLinkCandidates(candidates);
            setErr(e.message);
          })
          .finally(() => setLinking(false));
      };

      if (!user || !getToken()) return <Login onLogin={setUser} />;

      // 4.3 read/write split: the server's answer wins once it arrives; until
      // then mirror the rule from the stored user so the UI does not flash.
      const canWrite = emrStatus && emrStatus.access ? !!emrStatus.access.canWrite : canWriteFor(user);
      const access = {
        canWrite, role: user.role,
        capabilities: (emrStatus && emrStatus.access && emrStatus.access.capabilities) || {},
        clinicalRole: (emrStatus && emrStatus.access && emrStatus.access.clinicalRole) || null,
        clinicalRoleLabel: (emrStatus && emrStatus.access && emrStatus.access.clinicalRoleLabel) || null
      };
      // Session 4.12 Scope D — every one of these is a PLACE in the record.
      // No workflow is a tab: the H&P opens as a visit from the banner's Start
      // visit action, and med reconciliation is a section under MEDICATIONS
      // rather than a sibling of it. Enrollment left for Admin in PR #116.
      //
      // Appointments is kept as a place alongside the brief's twelve because it
      // is the per-patient calendar — removing a working surface is not what a
      // reorganisation is for.
      const tabs = [
        ['summary', 'Overview'],
        ['timeline', 'Timeline'],
        ['encounters', 'Encounters'],
        ['appts', 'Appointments'],
        ['problems', 'Problems'],
        ['medications', 'Medications'],
        ['allergies', 'Allergies'],
        ['orders', 'Orders'],
        ['results', 'Results'],
        ['imaging', 'Imaging'],
        ['referrals', 'Referrals'],
        ['documents', 'Documents'],
        ['careplan', 'Care Plan'],
        ['extras', 'Rest of the record'],
        ['messages', 'Messages']
      ];
      return (
        <AccessContext.Provider value={access}>
        {/* The patient panel collapses (owner, 2026-09-23). The grid column
            goes to zero rather than the aside being hidden inside a 290px
            track, or the chart would keep a 290px gutter of nothing. */}
        <div className={`min-h-screen lg:grid ${panelOpen ? 'lg:grid-cols-[290px_1fr]' : 'lg:grid-cols-[0_1fr]'}`}>
          {/* Patient list */}
          <aside className={`bg-white border-r border-stone-200 ${listOpen ? '' : 'hidden'} ${panelOpen ? 'lg:block' : 'lg:hidden'}`}>
            <div className="bg-primary text-white px-5 py-4">
              <img src="/brand/logo-mark-transparent.png" alt="" className="h-10 mb-1.5" />
              <div className="text-[9px] tracking-[2px] uppercase text-accent font-bold">Clinical Workspace</div>
            </div>
            <div className="p-3">
              <input className="inp" placeholder="Search patients…" value={q}
                onChange={e => setQ(e.target.value)} onKeyDown={e => e.key === 'Enter' && loadPatients()} />
            </div>
            <div className="px-5 pb-1 lblu">IHPC panel{patients ? ` · ${patients.length}` : ''}</div>
            <div className="overflow-y-auto" style={{ maxHeight: 'calc(100vh - 190px)' }}>
              {patients === null && err && (
                <div className="px-5 py-3">
                  <p className="text-xs text-red-600 mb-2">{err}</p>
                  <button className="btn ghost !py-1 !px-2.5 text-xs" onClick={loadPatients}>Retry</button>
                </div>
              )}
              {patients === null && !err && <p className="text-xs text-stone-400 px-5 py-3">Loading…</p>}
              {patients && patients.length === 0 && <p className="text-xs text-stone-400 px-5 py-3">No IHPC clients yet.</p>}
              {(patients || []).map(p => (
                <div key={p.id}
                  className={`flex items-center gap-3 px-5 py-2.5 border-b border-stone-100 cursor-pointer ${sel && sel.id === p.id ? 'bg-cream border-l-4 border-l-accent' : ''}`}
                  onClick={() => openPatient(p)}>
                  <div className="w-9 h-9 rounded-full bg-creamdeep text-primary flex items-center justify-center font-bold text-[13px] border border-stone-200">{initials(p.name)}</div>
                  <div className="min-w-0">
                    <div className="font-semibold text-[13.5px] truncate">{p.name}</div>
                    <div className="text-[11.5px] text-stone-500">
                      {[p.careTier, p.serviceLine, p.activatedAt ? 'Active' : (p.openEmrPatientId ? 'Linked' : 'Not linked')].filter(Boolean).join(' · ')}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </aside>

          {/* Chart. `lg:col-start-2` is load-bearing, not decoration: when the
              panel is collapsed, `aside` gets `display:none` and CSS Grid
              drops a display:none item from its item list entirely — so with
              nothing pinning `main`, it auto-places into the now-empty FIRST
              (0-width) track instead of the second, and the whole chart
              renders at zero width. Found by measuring the live layout, not
              by reading the CSS: `main`'s own bounding rect reported width 0
              with the grid track correctly sized underneath it. */}
          <main className={`${listOpen ? 'hidden' : ''} lg:block lg:col-start-2`}>
            {/* WRAPS. Two groups in a `justify-between` row with nothing
                allowed to wrap is why the right-hand group pushed the nav off
                the edge instead of dropping below it. */}
            <div className="bg-white border-b border-stone-200 px-4 lg:px-7 py-3 flex flex-wrap items-center justify-between gap-x-3 gap-y-2">
              <div className="flex items-center gap-3 min-w-0 flex-1">
                <button className="lg:hidden btn ghost !px-2.5 !py-1.5" onClick={() => setListOpen(true)}><i className="ti ti-users" /></button>
                {/* The panel toggle is desktop-only: on a phone the list is a
                    full-screen overlay with its own button to the left. */}
                <button className="hidden lg:inline-flex btn ghost !px-2 !py-1.5 shrink-0"
                  onClick={() => setPanelOpen(o => !o)}
                  title={panelOpen ? 'Hide the patient list' : 'Show the patient list'}
                  aria-label={panelOpen ? 'Hide the patient list' : 'Show the patient list'}
                  aria-expanded={panelOpen}>
                  <i className={`ti ${panelOpen ? 'ti-layout-sidebar-left-collapse' : 'ti-layout-sidebar-left-expand'}`} />
                </button>
                {/* The heading gives up its width before the nav does — it is
                    a label, and the nav is the thing you click. */}
                <div className="serif text-lg text-primary font-semibold truncate shrink">{VIEW_TITLES[view] || 'Patient Chart'}</div>
                {/* WRAPS, never scrolls invisibly. The first version made this
                    strip `overflow-x-auto`, which technically fit nine views —
                    but a horizontal scrollbar on a nav bar is not a fix, it is
                    the same clipping with an affordance nobody sees. Labels
                    show only once there is genuinely room for all nine words
                    (2xl, 1536px+); below that it is icons, which is what makes
                    nine views actually fit on a laptop instead of technically
                    scrolling past it. `flex-wrap` is the backstop under that —
                    if even nine icons cannot fit (a narrow phone), the strip
                    grows to a second row inside its own border rather than
                    cutting the last button off at the edge. */}
                <div className="flex flex-wrap rounded-lg border border-stone-200 ml-1 nav-strip">
                  {NAV_VIEWS.map(v => (
                    <button key={v.key}
                      className={`px-2.5 py-1.5 text-xs font-semibold whitespace-nowrap ${view === v.key ? 'bg-primary text-white' : 'bg-white text-primary'}`}
                      title={VIEW_TITLES[v.key]}
                      onClick={() => { setView(v.key); if (!v.keepsPatient) setListOpen(false); }}>
                      <i className={`ti ${v.icon}`} />
                      <span className="hidden 2xl:inline ml-1">{v.tab}</span>
                    </button>
                  ))}
                </div>
              </div>
              <div className="flex items-center gap-2 shrink-0">
                <div className="flex items-center gap-2 text-[11.5px] text-stone-500 bg-cream border border-stone-200 px-3 py-1.5 rounded-full whitespace-nowrap">
                  <span className={`w-2 h-2 rounded-full ${emrStatus === null ? 'bg-stone-300' : emrStatus.connected ? 'bg-emerald-500' : (emrStatus.reachable ? 'bg-amber-500' : 'bg-red-500')}`} />
                  {emrStatus === null ? 'OpenEMR…'
                    : !emrStatus.configured ? 'OpenEMR not configured'
                    : !emrStatus.reachable ? 'OpenEMR unreachable'
                    : emrStatus.connected ? `OpenEMR: ${(emrStatus.emrUser && (emrStatus.emrUser.username || emrStatus.emrUser.name)) || 'signed in'}`
                    : 'OpenEMR: not signed in'}
                </div>
                {emrStatus && emrStatus.serverStartedAt && (
                  <span className="text-[10.5px] text-stone-400 hidden 2xl:inline" title="When this server process started — older than your last deploy means it was never restarted.">
                    server up since {fmtTs(emrStatus.serverStartedAt)}
                  </span>
                )}
                {!canWrite && <span className="chip bg-amber-50 text-amber-800" title="Case-manager scoped read: every write route answers 403.">Read-only</span>}
                {(user.role === 'admin' || user.role === 'caseManager') && (
                  <a className="btn ghost !py-1.5 !px-2.5 text-xs" href="/admin/enrollment" title="Staff enrollment view"><i className="ti ti-clipboard-list" /><span className="hidden sm:inline">Enrollment</span></a>
                )}
                <div className="flex items-center gap-2 pl-1 border-l border-stone-200">
                  <span className="text-[11.5px] text-stone-500 hidden sm:inline">{user.name}</span>
                  <button className="btn ghost !py-1.5 !px-2.5 text-xs" onClick={signOut} title="Sign out">
                    <i className="ti ti-logout" /><span className="hidden sm:inline">Sign out</span>
                  </button>
                </div>
              </div>
            </div>
            {/* Setup diagnostics: names the exact blocker so an admin can fix it
                without opening dev tools. Never renders secret VALUES. */}
            {emrStatus && !emrStatus.connected && (
              <div className="bg-amber-50 border-b border-amber-200 px-4 lg:px-7 py-2 text-[12px] text-amber-900">
                {!emrStatus.configured ? (
                  (emrStatus.missing || []).length ? (
                    <span>
                      <b>OpenEMR is not configured.</b> Missing environment {emrStatus.missing.length === 1 ? 'variable' : 'variables'}:{' '}
                      <code className="font-mono">{emrStatus.missing.join(', ')}</code>. Add {emrStatus.missing.length === 1 ? 'it' : 'them'} to the app's secrets, then STOP and RUN the app (a page reload is not enough — secrets load at server start).
                    </span>
                  ) : (
                    // No `missing` list means the SERVER is running code older than
                    // this page (files on disk updated, process not restarted) —
                    // env vars are only read at process start either way.
                    <span>
                      <b>OpenEMR is not configured, and the server is running an older build than this page.</b>{' '}
                      Stop and Run the app (not just a page reload) so it picks up both the current code and the secrets. If it still shows this afterwards, the OpenEMR secrets are not set on the running server.
                    </span>
                  )
                ) : emrStatus.reachable ? (
                  // Session 5.2: every clinician signs in to OpenEMR as
                  // THEMSELVES. Until they do, this server holds no token for
                  // them and every chart call is refused (EMR_NOT_CONNECTED).
                  <span className="flex flex-wrap items-center gap-3">
                    <span>
                      <b>{emrStatus.disconnectReason ? 'Your OpenEMR sign-in has lapsed.' : 'Sign in to OpenEMR to open charts.'}</b>{' '}
                      Charts, notes and orders are written under your own OpenEMR account
                      {emrStatus.emrUser && emrStatus.emrUser.username ? ` (last signed in as ${emrStatus.emrUser.username})` : ''}. You will be sent to OpenEMR's login page and back.
                    </span>
                    <button type="button" onClick={connectEmr} className="px-3 py-1 rounded bg-[#033D50] text-white text-[12px] font-semibold hover:opacity-90">Sign in to OpenEMR</button>
                  </span>
                ) : (
                  <span><b>OpenEMR is configured but unreachable.</b> {emrStatus.error || 'The EMR did not respond.'}</span>
                )}
              </div>
            )}
            {emrReturn && (
              <div className={`border-b px-4 lg:px-7 py-2 text-[12px] ${emrReturn === 'connected' ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-red-50 border-red-200 text-red-900'}`}>
                {emrReturn === 'connected' ? <span><b>OpenEMR account connected.</b> Your clinical writes are now attributed to you in OpenEMR.</span>
                  : <span><b>OpenEMR sign-in did not complete</b> ({emrReturnReason || 'unknown'}). Try again; if it repeats, tell an admin the code shown here.</span>}
              </div>
            )}
            {/* 4.4 deploy diagnostics: the appointment-scoped OAuth client swap
                (P0 deploy step) and the billing NPI (spec §2.5). */}
            {emrStatus && emrStatus.connected && emrStatus.appointmentScopes === false && (
              <div className="bg-amber-50 border-b border-amber-200 px-4 lg:px-7 py-2 text-[12px] text-amber-900">
                <b>Appointment OAuth client swap not deployed.</b> The token OpenEMR issued to this server carries no appointment scopes, so scheduling will 401. Swap <code className="font-mono">OPENEMR_CLIENT_ID</code>/<code className="font-mono">OPENEMR_CLIENT_SECRET</code> to the appointment-scoped client (enabled 2026-08-29), then stop and run the app.
              </div>
            )}
            {/* 4.5 deploy diagnostics: the 8.4 / Phase 6B OAuth client swap.
                A token carries only the scopes the DEPLOYED client was
                registered with, and OpenEMR reports the shortfall as a narrower
                token rather than an error — so the indicator above reads a
                healthy green while every new route 401s "Unauthorized". Name the
                shortfall here or nobody finds out until a write fails. */}
            {emrStatus && emrStatus.connected && (emrStatus.billingRouteScopes === false || emrStatus.nativeWriteScopes === false) && (
              <div className="bg-amber-50 border-b border-amber-200 px-4 lg:px-7 py-2 text-[12px] text-amber-900">
                <b>OpenEMR client is out of date for 8.4.</b> The token this server holds carries{' '}
                <b>{emrStatus.grantedScopeCount} of {emrStatus.requestedScopeCount}</b> scopes, so{' '}
                {[emrStatus.billingRouteScopes === false && 'charges, orders and code search',
                  emrStatus.nativeWriteScopes === false && 'prescription writes']
                  .filter(Boolean).join(' and ')}{' '}
                will fail with 401. Swap <code className="font-mono">OPENEMR_CLIENT_ID</code>/<code className="font-mono">OPENEMR_CLIENT_SECRET</code>{' '}
                to the v4 client (54 scopes), then stop and run the app.
                {(emrStatus.missingScopes || []).length > 0 && (
                  <> Missing: <code className="font-mono">{emrStatus.missingScopes.join(', ')}</code>.</>
                )}
              </div>
            )}
            {emrStatus && emrStatus.billingNpiConfigured === false && (
              <div className="bg-amber-50 border-b border-amber-200 px-4 lg:px-7 py-2 text-[12px] text-amber-900">
                <b>Billing provider NPI not configured.</b> Encounters cannot be signed until an admin sets it under Coding queue → Billing settings (or seeds <code className="font-mono">GFC_BILLING_NPI_USED</code> in the env).
              </div>
            )}
            {err && <p className="text-red-600 text-sm px-7 pt-3">{err}</p>}
            {view === 'myday' && (
              <MyDayView user={user} onOpenChart={(clientId) => openChartById(clientId)} />
            )}
            {view === 'queues' && (
              <WorkQueuesView
                onOpenChart={(clientId) => openChartById(clientId)}
                onOpenEncounter={(clientId, euuid) => openChartById(clientId, { tab: 'encounters', encounterUuid: euuid })} />
            )}
            {view === 'analytics' && <AnalyticsView />}
            {view === 'queue' && (
              <CodingQueueView onOpenEncounter={(clientId, euuid) => openChartById(clientId, { tab: 'encounters', encounterUuid: euuid })} />
            )}
            {view === 'inbox' && (
              <InboxView
                onOpenEncounter={(clientId, euuid) => openChartById(clientId, { tab: 'encounters', encounterUuid: euuid })}
                onOpenChart={(clientId) => openChartById(clientId)} />
            )}
            {view === 'results' && <ResultsInbox />}
            {view === 'overdue' && <OverdueOrders />}
            {view === 'schedule' && (
              <ScheduleView user={user} patients={patients || []}
                onOpenChart={(clientId) => openChartById(clientId)}
                onDocument={documentFromSchedule} />
            )}
            {view === 'charts' && !sel && <div className="p-10 text-stone-400 text-sm">Select a patient to open their chart, or switch to Schedule for the calendar.</div>}
            {view === 'charts' && sel && (
              <div>
                {/* Session 4.12 — the banner, above the tab bar and therefore
                    present on EVERY tab. It replaced a header that showed DOB,
                    Track and a truncated OpenEMR uuid and no age, MRN, MBI or
                    allergies: the five things read first at a front door. */}
                <PatientBanner
                  banner={chart ? chart.banner : null}
                  patient={sel}
                  homeVisitFields={(emrStatus && emrStatus.homeVisitFields) || []}
                  visitDraft={chart ? chart.visitDraft : null}
                  onStartVisit={canWrite ? () => setTab('visit') : null}
                  onHomeVisitSaved={refreshChart} />
                {/* The H&P is NOT a tab (Scope D1) — it opens as a visit from
                    the banner. So when one is open nothing on the tab bar is
                    highlighted, and a clinician needs to be told where they are
                    and how to get back. */}
                {tab === 'visit' && (
                  <div className="bg-accent/20 border-b border-accent px-4 lg:px-7 py-2 flex items-center justify-between gap-2 flex-wrap">
                    <span className="text-[12.5px] text-primary font-semibold">
                      <i className="ti ti-writing mr-1" />Documenting a visit
                    </span>
                    <button className="btn ghost !py-1 !px-2.5 text-[11.5px]" onClick={() => setTab('summary')}>
                      <i className="ti ti-arrow-left" />Back to the chart
                    </button>
                  </div>
                )}
                <div className="bg-white border-b border-stone-200 px-4 lg:px-7">
                  <div className="flex overflow-x-auto -mb-px">
                    {tabs.map(([k, label]) => (
                      <div key={k} className={`tabbtn ${tab === k ? 'on' : ''}`} onClick={() => setTab(k)}>{label}</div>
                    ))}
                  </div>
                </div>
                <div className="p-4 lg:p-7">
                  {tab === 'summary' && <SummaryTab chart={chart} patient={sel} onLink={link} linking={linking}
                    linkCandidates={linkCandidates} onDismissCandidates={() => { setLinkCandidates([]); setErr(''); }}
                    isAdmin={access.role === 'admin'} onChartChanged={() => { loadPatients(); refreshChart(); }} />}
                  {tab === 'appts' && <ApptsTab patient={sel} patients={patients || []} chart={chart} onDocumentHp={(eid) => { setHpApptEid(eid); setTab('visit'); }}
                    onEncounterCreated={(euuid) => { setEncTarget(euuid); setTab('encounters'); }} />}
                  {tab === 'encounters' && <EncountersTab patient={sel} chart={chart} initialEuuid={encTarget} onOpened={() => setEncTarget(null)} onChartChanged={() => { loadPatients(); refreshChart(); }} />}
                  {tab === 'visit' && (chart ? <HpTab patient={sel} chart={chart} appointmentEid={hpApptEid} onDone={() => { setHpApptEid(null); refreshChart(); loadPatients(); }} onGoToEncounter={(euuid) => { setEncTarget(euuid); setTab('encounters'); }} /> : <p className="text-sm text-stone-500">Loading…</p>)}
                  {tab === 'timeline' && <TimelineTab patient={sel} />}
                  {tab === 'problems' && <ProblemsTab chart={chart} />}
                  {tab === 'medications' && <MedicationsTab chart={chart} patient={sel} />}
                  {tab === 'allergies' && <AllergiesTab chart={chart} />}
                  {tab === 'orders' && <OrdersTab patient={sel} />}
                  {tab === 'results' && <ResultsTab patient={sel} />}
                  {tab === 'imaging' && <ImagingTab patient={sel} />}
                  {tab === 'referrals' && <ReferralsTab patient={sel} />}
                  {tab === 'documents' && <DocumentsTab chart={chart} patient={sel} onChartChanged={() => { loadPatients(); refreshChart(); }} />}
                  {tab === 'careplan' && <CarePlanTab patient={sel} onSaved={loadPatients} />}
                  {tab === 'extras' && <RecordExtrasTab patient={sel} />}
                  {tab === 'messages' && <MessagesTab patient={sel} />}
                </div>
              </div>
            )}
            <footer className="px-7 py-4 text-[10.5px] text-stone-400">
              Authorized users only. This system contains protected health information; all access is logged.
            </footer>
          </main>
        </div>
        </AccessContext.Provider>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
