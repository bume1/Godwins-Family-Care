      const [err, setErr] = useState(null);
      const [busy, setBusy] = useState(false);

      const load = useCallback(() => {
        if (!clientId) return;
        api.aiReviews(clientId).then(setState).catch(e => setErr(e.message));
      }, [clientId]);
      useEffect(() => { load(); }, [load]);

      // Poll while a review is running. A long chart takes minutes, so the
      // screen says which pass it is on rather than spinning silently.
      const running = open && open.status === 'running';
      useEffect(() => {
        if (!running || !clientId || !open) return;
        let live = true;
        const t = setInterval(() => {
          api.aiReview(clientId, open.id)
            .then(r => { if (live && r && r.review) { setOpen(r.review); if (r.review.status !== 'running') load(); } })
            .catch(() => {});
        }, 4000);
        return () => { live = false; clearInterval(t); };
      }, [running, clientId, open && open.id, load]);

      const start = () => {
        setStarting(true); setErr(null);
        api.startAiReview(clientId, { focus: focus.trim() || undefined, excludeDocumentIds: excluded })
          .then(r => {
            setShowPlan(false);
            setOpen({ id: r.reviewId, status: r.status, passes: null, currentPass: null });
            load();
          })
          .catch(e => setErr(e.message))
          .finally(() => setStarting(false));
      };

      const openReview = (id) => {
        setErr(null);
        api.aiReview(clientId, id).then(r => setOpen(r.review)).catch(e => setErr(e.message));
      };

      const decide = (index, decision) => {
        if (!open) return;
        setBusy(true);
        api.decideAiFindings(open.id, [{ index, decision }])
          .then(() => api.aiReview(clientId, open.id))
          .then(r => { setOpen(r.review); load(); })
          .catch(e => setErr(e.message))
          .finally(() => setBusy(false));
      };

      if (!state) return null;

      // NOT CONFIGURED IS A SENTENCE, NOT A HIDDEN CONTROL. "Off" and "nothing
      // to review" are different facts, and only an admin is handed the
      // blockers because only an admin can clear them.
      if (!state.available) {
        return (
          <div className="card p-4 mb-4">
            <div className="font-semibold text-sm text-primary">AI review isn't switched on yet.</div>
            {Array.isArray(state.blockers) && state.blockers.length > 0 && (
              <ul className="text-xs text-stone-600 mt-2 list-disc pl-4 space-y-0.5">
                {state.blockers.map((b, i) => <li key={i}>{b}</li>)}
              </ul>
            )}
          </div>
        );
      }

      const docs = ((chart && chart.chartDocuments) || []).filter(d => d.uploadId);
      const decisionFor = (i) => (open && (open.findingDecisions || []).find(d => d.index === i)) || null;
      const findings = (open && open.output && open.output.findings) || [];
      const sorted = findings
        .map((f, i) => ({ f, i }))
        .sort((a, b) => AI_PRIORITY_ORDER.indexOf(a.f.priority) - AI_PRIORITY_ORDER.indexOf(b.f.priority));

      return (
        <div className="card p-4 mb-4">
          <div className="flex flex-wrap items-center justify-between gap-2">
            <div className="font-semibold text-sm text-primary"><i className="ti ti-sparkles mr-1" />AI review</div>
            {state.canRun && !showPlan && !running && (
              <button className="btn gold !py-1.5" onClick={() => setShowPlan(true)}>Review Full Chart</button>
            )}
          </div>

          {err && <div className="text-[12px] text-red-800 bg-red-50 border border-red-200 rounded p-2 mt-2">{err}</div>}

          {showPlan && (
            <div className="border border-stone-200 rounded p-3 mt-3">
              <div className="text-[13px] font-semibold text-stone-800">What will be read</div>
              <div className="text-[12px] text-stone-600 mt-1">
                Everything in this chart you can already open: the problem list, medications, allergies, vitals,
                every encounter and its note, orders, results, prescriptions, every care-plan version, the intake,
                medication reconciliations, caregiver records, and the care-team conversations you can see.
                There is no time limit and nothing is capped.
              </div>
              {docs.length > 0 && (
                <div className="mt-2">
                  <div className="text-[12px] font-semibold text-stone-700">{docs.length} document{docs.length === 1 ? '' : 's'} — untick any to leave out</div>
                  <div className="mt-1 max-h-40 overflow-auto space-y-1">
                    {docs.map(d => (
                      <label key={d.uploadId} className="flex items-center gap-2 text-[12px] text-stone-700">
                        <input type="checkbox" checked={!excluded.includes(String(d.uploadId))}
                          onChange={e => setExcluded(prev => e.target.checked
                            ? prev.filter(x => x !== String(d.uploadId))
                            : [...prev, String(d.uploadId)])} />
                        <span className="truncate">{d.description || d.title || 'Document'}</span>
                      </label>
                    ))}
                  </div>
                </div>
              )}
              <div className="mt-2">
                <label className="text-[12px] font-semibold text-stone-700">Anything particular to look at? (optional)</label>
                <input className="inp !py-1 text-[13px] mt-1" maxLength={500} value={focus}
                  onChange={e => setFocus(e.target.value)} placeholder="e.g. her falls since January" />
              </div>
              <div className="flex gap-2 mt-3">
                <button className="btn gold !py-1.5" disabled={starting} onClick={start}>{starting ? 'Starting…' : 'Start Review'}</button>
                <button className="btn !py-1.5" onClick={() => setShowPlan(false)}>Cancel</button>
              </div>
            </div>
          )}

          {running && (
            <div className="text-[13px] text-stone-700 mt-3">
              <i className="ti ti-loader-2 animate-spin mr-1" />
              {open.passes && open.currentPass
                ? `Reading pass ${open.currentPass} of ${open.passes}…`
                : 'Reading the chart…'}
              <div className="text-[11px] text-stone-500 mt-0.5">A long history is read in passes and can take a few minutes.</div>
            </div>
          )}

          {open && open.status === 'failed' && (
            <div className="text-[12px] text-red-800 bg-red-50 border border-red-200 rounded p-2 mt-3">
              <div className="font-semibold">That review did not finish.</div>
              <div>{open.error || 'No reason was recorded.'}</div>
              {Array.isArray(open.blockers) && open.blockers.map((b, i) => <div key={i}>· {b}</div>)}
            </div>
          )}

          {open && open.status === 'done' && (
            <div className="mt-3">
              {/* FIXED, NEVER DISMISSIBLE. */}
              <div className="text-[12px] text-amber-900 bg-amber-50 border border-amber-300 rounded p-2">
                AI draft from Gemini. Check every item against its source before acting. Nothing here is saved to the chart.
              </div>

              {open.output.summary && (
                <div className="text-[13px] text-stone-800 mt-3 whitespace-pre-wrap">{open.output.summary}</div>
              )}

              {!!(open.output.timeline || []).length && (
                <div className="mt-3">
                  <div className="text-[13px] font-semibold text-stone-800">Timeline</div>
                  <div className="mt-1 space-y-1">
                    {open.output.timeline.map((t, i) => (
                      <div key={i} className="text-[12px] text-stone-700">
                        <span className="text-stone-500">{t.date || '—'}</span> · {t.event}
                        {(t.citations || []).map((c, j) => (
                          <button key={j} className="chip border bg-white text-stone-600 border-stone-200 ml-1"
                            onClick={() => onOpenSource && onOpenSource(c)}>{c.sourceId}{c.page ? ` p${c.page}` : ''}</button>
                        ))}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div className="mt-3">
                <div className="text-[13px] font-semibold text-stone-800">
                  {sorted.length} finding{sorted.length === 1 ? '' : 's'}
                </div>
                {sorted.length === 0 && <div className="text-[12px] text-stone-500">Nothing was flagged.</div>}
                <div className="mt-1 space-y-2">
                  {sorted.map(({ f, i }) => {
                    const chosen = decisionFor(i);
                    return (
                      <div key={i} className={`border rounded p-2 ${AI_PRIORITY_STYLE[f.priority] || AI_PRIORITY_STYLE.info}`}>
                        <div className="flex items-start justify-between gap-2">
                          <div>
                            <div className="text-[11px] uppercase tracking-wide opacity-70">
                              {f.priority} · {AI_CATEGORY_LABEL[f.category] || f.category}
                            </div>
                            <div className="text-[13px]">{f.statement}</div>
                            <div className="mt-1 flex flex-wrap gap-1">
                              {(f.citations || []).map((c, j) => (
                                <button key={j} className="chip border bg-white text-stone-600 border-stone-200"
                                  title={c.quote || ''}
                                  onClick={() => onOpenSource && onOpenSource(c)}>
                                  {c.sourceId}{c.page ? ` p${c.page}` : ''}
                                </button>
                              ))}
                            </div>
                          </div>
                          {state.canDecide !== false && open.findingDecisions && (
                            <div className="flex gap-1 shrink-0">
                              {[['noted', 'Noted'], ['dismissed', 'Dismiss']].map(([d, label]) => (
                                <button key={d} disabled={busy}
                                  className={`chip border ${chosen && chosen.decision === d ? 'bg-primary text-white border-primary' : 'bg-white text-stone-600 border-stone-200'}`}
                                  onClick={() => decide(i, d)}>{label}</button>
                              ))}
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {!!(open.output.questionsForClinician || []).length && (
                <div className="mt-3">
                  <div className="text-[13px] font-semibold text-stone-800">Questions for you</div>
                  <ul className="text-[12px] text-stone-700 list-disc pl-4 mt-1 space-y-0.5">
                    {open.output.questionsForClinician.map((q, i) => <li key={i}>{q}</li>)}
                  </ul>
                </div>
              )}

              {/* WHAT IT COULD NOT READ. An omission nobody is told about is
                  the dangerous kind. */}
              {!!(open.output.notReviewed || []).length && (
                <div className="mt-3">
                  <div className="text-[13px] font-semibold text-stone-800">Not read</div>
                  <ul className="text-[12px] text-stone-600 list-disc pl-4 mt-1 space-y-0.5">
                    {open.output.notReviewed.map((n, i) => <li key={i}>{n}</li>)}
                  </ul>
                </div>
              )}

              {open.droppedUncited > 0 && (
                <div className="text-[11px] text-stone-500 mt-2">
                  {open.droppedUncited} item{open.droppedUncited === 1 ? '' : 's'} were left out because they did not cite a source in this chart.
                </div>
              )}
            </div>
          )}

          {!!(state.reviews || []).length && (
            <div className="border-t border-stone-100 mt-3 pt-2">
              <div className="text-[11px] uppercase tracking-wide text-stone-500">Earlier reviews</div>
              <div className="mt-1 space-y-0.5">
                {state.reviews.slice(0, 6).map(r => (
                  <button key={r.id} className="block text-left text-[12px] text-stone-700 hover:underline"
                    onClick={() => openReview(r.id)}>
                    {window.GFC_TIME ? window.GFC_TIME.fmtDateTime(r.at) : new Date(r.at).toLocaleString()} · {r.status}
                    {r.status === 'done' ? ` · ${r.findings} finding${r.findings === 1 ? '' : 's'}` : ''}
                    {r.requestedBy ? ` · ${r.requestedBy}` : ''}
                  </button>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    };

    const SummaryTab = ({ chart, patient, onLink, linking, linkCandidates, onDismissCandidates, isAdmin, onChartChanged, onGoTab }) => {
      const canWrite = useCanWrite();
      const canBill = useCanBill();
      const [showLinkExisting, setShowLinkExisting] = useState(false);
      const [existingId, setExistingId] = useState('');
      const d = chart && chart.demographics;
      if (!chart) return <p className="text-sm text-stone-500 p-4">Loading chart…</p>;
      const emr = chart.emr || {};
      return (
        <div>
          {!chart.linked && !canWrite && (
            <div className="card p-4 mb-4"><div className="font-semibold text-sm text-primary">Not linked to OpenEMR yet</div><div className="text-xs text-stone-500">A clinician links this chart at the first visit.</div></div>
          )}
          {!chart.linked && canWrite && (
            <div className="card p-4 mb-4">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <div className="font-semibold text-sm text-primary">Not linked to OpenEMR yet</div>
                  <div className="text-xs text-stone-500">Create the OpenEMR patient record from the app demographics, or link a chart that already exists in the EMR.</div>
                </div>
                <button className="btn gold" disabled={linking} onClick={() => onLink()}>{linking ? 'Linking…' : 'Create & Link Chart'}</button>
              </div>
              {/* Duplicate guard: the server refuses to create a second chart
                  for a patient who already looks present in OpenEMR and hands
                  the candidates back here. Nothing is linked automatically —
                  a wrong link writes clinical data into someone else's record. */}
              {!!(linkCandidates && linkCandidates.length) && (
                <div className="border-t border-stone-100 mt-3 pt-3">
                  <div className="text-sm font-semibold text-amber-800">
                    {linkCandidates.length === 1 ? 'This patient may already be in OpenEMR' : `${linkCandidates.length} possible matches already in OpenEMR`}
                  </div>
                  <div className="text-xs text-stone-500 mb-2">
                    No new chart was created. Link the existing chart if it is the same person — otherwise confirm below.
                  </div>
                  <div className="space-y-2">
                    {linkCandidates.map(c => (
                      <div key={c.openEmrPatientId} className="flex flex-wrap items-center justify-between gap-2 border border-stone-200 rounded p-2">
                        <div className="min-w-0">
                          <div className="text-[13px] font-semibold">{c.name || '(no name on the EMR record)'}</div>
                          <div className="text-[11px] text-stone-500">
                            {[c.birthDate ? `DOB ${c.birthDate}` : 'no DOB on file',
                              `${c.confidence} match`,
                              `${String(c.openEmrPatientId).slice(0, 8)}…`].join(' · ')}
                          </div>
                          {c.alreadyLinkedToAnotherClient && (
                            <div className="text-[11px] text-red-600">Already linked to a different client record — linking here is blocked.</div>
                          )}
                        </div>
                        <button className="btn" disabled={linking || c.alreadyLinkedToAnotherClient}
                          onClick={() => onLink({ openEmrPatientId: c.openEmrPatientId })}>
                          {linking ? 'Linking…' : 'Link Chart'}
                        </button>
                      </div>
                    ))}
                  </div>
                  <div className="flex flex-wrap gap-2 mt-2">
                    <button className="btn ghost text-xs" disabled={linking} onClick={() => onLink({ confirmDistinct: true })}>
                      None of these — create a new chart
                    </button>
                    <button className="btn ghost text-xs" disabled={linking} onClick={onDismissCandidates}>Cancel</button>
                  </div>
                </div>
              )}
              {/* Link an EXISTING EMR chart — the path for patients already in
                  OpenEMR (legacy records, or a chart created directly there).
                  Prevents a duplicate chart for the same person. */}
              <div className="border-t border-stone-100 mt-3 pt-3">
                {!showLinkExisting ? (
                  <button className="text-xs text-primary underline" onClick={() => setShowLinkExisting(true)}>
                    Already in OpenEMR? Link an existing patient instead
                  </button>
                ) : (
                  <div className="flex flex-wrap items-end gap-2">
                    <Field label="OpenEMR patient UUID" className="flex-1 min-w-[260px]">
                      <input className="inp font-mono text-xs" placeholder="e.g. a284d5c2-670e-4a62-aa95-2d1aa629003c"
                        value={existingId} onChange={e => setExistingId(e.target.value.trim())} />
                    </Field>
                    <button className="btn" disabled={linking || !existingId} onClick={() => onLink({ openEmrPatientId: existingId })}>
                      {linking ? 'Linking…' : 'Link'}
                    </button>
                    <button className="btn ghost" onClick={() => { setShowLinkExisting(false); setExistingId(''); }}>Cancel</button>
                    <Hint className="w-full">Find the UUID in OpenEMR on the patient's record (or ask an admin). The link is verified against the EMR before it is saved.</Hint>
                  </div>
                )}
              </div>
            </div>
          )}
          {/* Billing's only (owner, 2026-09-29): a clinician chooses what KIND
              of visit it is, never where it bills. */}
          {chart.linked && canBill && <PlaceOfServiceCard patient={patient} />}
          {canBill && <InsurancePointer patient={patient} />}
          {/* The AI review sits on Overview, above the chart sections it
              reviews. It renders nothing at all until the server answers, and
              says plainly when reading is not switched on — "off" and
              "nothing to review" are different facts. */}
          {chart.linked && <AiReviewCard clientId={patient && patient.id} chart={chart} />}
          {/* Session 4.12 Scope D — OVERVIEW is the at-a-glance. The problem
              list, medications, allergies, documents and the timeline each have
              their OWN place on the tab bar, so nothing here is the
              authoritative copy and nothing is rendered twice. 2026-10-12: laid
              out as the owner's mockup card grid; every card reads only what
              the chart read already returned. */}
          <OverviewGrid chart={chart} patient={patient} onGoTab={onGoTab} />
          {/* This patient's to-dos that the viewer wrote or was handed. Shown
              to everyone who may hold one, a case manager included. */}
          {patient && <PatientTodosCard patient={patient} />}
        </div>
      );
    };

    const PatientTodosCard = ({ patient }) => {
      if (!useContext(AccessContext).canManageTasks) return null;
      return (
        <div className="card mt-4">
          <div className="card-h"><h2><i className="ti ti-checkbox mr-1 text-accent" />To-Dos</h2></div>
          <div className="p-4"><TodoList clientId={patient.id} patientName={patient.name} compact /></div>
        </div>
      );
    };

    // ── Overview cards (2026-10-12 redesign) ───────────────────────────────
    // Module scope (the input-focus rule). OvCard is one card; ovState says,
    // in words, why a card has no rows — the same three states ChartSection
    // has always told apart: not linked, not enabled yet, and a failed read.
    const OvCard = ({ title, icon, onMore, moreLabel, className, children }) => (
      <div className={`card flex flex-col ${className || ''}`}>
        <div className="flex items-center justify-between gap-2 px-4 pt-3.5 pb-2">
          <h2 className="serif text-[19px] font-semibold text-primary leading-tight">
            {icon && <i className={`ti ${icon} mr-1.5 text-accent text-[17px]`} />}{title}
          </h2>
          {onMore && <button className="text-stone-400 hover:text-primary" onClick={onMore} aria-label={moreLabel || `Open ${title}`}><i className="ti ti-chevron-right" /></button>}
        </div>
        <div className="px-4 pb-4 text-[13px] text-stone-700 flex-1">{children}</div>
        {onMore && moreLabel && (
          <div className="px-4 pb-3.5"><button className="text-[12.5px] font-semibold text-primary hover:underline" onClick={onMore}>{moreLabel} →</button></div>
        )}
      </div>
    );
    const ovState = (data, linked, label) => {
      if (!linked) return <p className="text-stone-400 text-[12.5px]">Link this patient to OpenEMR to read {label}.</p>;
      if (!data) return <p className="text-stone-400 text-[12.5px]">Loading…</p>;
      if (!data.ok && data.permissionPending) return <p className="text-amber-800 text-[12.5px]">OpenEMR has not enabled this read yet. Nothing is wrong with this record.</p>;
      if (!data.ok) return <p className="text-red-600 text-[12.5px]">Could not be read from OpenEMR. {data.error}</p>;
      if (!data.rows.length) return <p className="text-stone-400 text-[12.5px]">Nothing on file in OpenEMR.</p>;
      return null;
    };
    // The newest reading of each vital the card shows, matched on the row's
    // NAME. A vital with no reading shows a dash: the card never fills a gap.
    const OV_VITALS = [
      ['BP', /blood pressure|^bp\b|systolic/i],
      ['HR', /heart rate|pulse/i],
      ['Temp', /temp/i],
      ['SpO₂', /oxygen|spo2|o2 sat/i]
    ];
    // Splits a served reading into the number to show large and the unit it
    // came with. Blood pressure arrives as two labelled components and is
    // shown as systolic/diastolic. The unit is the reading's OWN, never one
    // this page assumes (a temperature may be °F or °C).
    const vitalDisplay = (label, value) => {
      const v = String(value == null ? '' : value).trim();
      if (!v) return { big: null, small: '' };
      if (label === 'BP') {
        const n = v.match(/\d+(?:\.\d+)?/g) || [];
        return n.length >= 2 ? { big: `${n[0]}/${n[1]}`, small: 'mmHg' } : { big: v, small: '' };
      }
      const m = v.match(/^([\d.]+)\s*(.*)$/);
      return m ? { big: m[1], small: m[2] } : { big: v, small: '' };
    };
    const latestVitals = (rows) => OV_VITALS.map(([label, re]) => {
      const list = rows || [];
      for (let i = list.length - 1; i >= 0; i--) {
        if (re.test(String(list[i].name || ''))) return { label, ...vitalDisplay(label, list[i].value), at: list[i].at, draft: !!list[i].draft };
      }
      return { label, big: null, small: '', at: null, draft: false };
    });

    const OvRow = ({ label, children }) => (
      <div className="grid grid-cols-[110px_1fr] gap-2 py-1">
        <span className="text-stone-500">{label}</span><span className="min-w-0 break-words">{children || '—'}</span>
      </div>
    );
    const OverviewGrid = ({ chart, patient, onGoTab }) => {
      const [plan, setPlan] = useState(undefined);
      useEffect(() => {
        if (!patient || !patient.id) return;
        let live = true;
        api.carePlan(patient.id).then(r => { if (live) setPlan(r || null); }).catch(() => { if (live) setPlan(null); });
        return () => { live = false; };
      }, [patient && patient.id]);
      const emr = chart.emr || {};
      const b = chart.banner || {};
      const linked = chart.linked;
      const go = (t) => onGoTab && (() => onGoTab(t));
      const active = emr.problems && emr.problems.ok
        ? emr.problems.rows.filter(r => !/resolved|inactive|remission/i.test(String(r.status || ''))) : [];
      const meds = emr.medications && emr.medications.ok ? emr.medications.rows.filter(r => !/stopped|completed|cancel|entered/i.test(String(r.status || ''))) : [];
      const allergies = emr.allergies && emr.allergies.ok ? emr.allergies.rows : [];
      // Draft readings (a saved, unsigned note) are newer than OpenEMR's.
      const vitalRows = [...((emr.vitals && emr.vitals.ok) ? emr.vitals.rows : []),
        ...(chart.draftVitals || []).map(r => ({ ...r, draft: true }))];
      const vitals = latestVitals(vitalRows);
      const vitalsAt = vitals.map(v => v.at).filter(Boolean).sort().pop();
      const encs = emr.encounters && emr.encounters.ok
        ? [...emr.encounters.rows].sort((x, y) => String(y.start || '').localeCompare(String(x.start || ''))) : [];
      const last = encs[0] || null;
      const cp = plan && plan.carePlan;
      const ins = b.insurance || {};
      return (
        <div className="space-y-4">
          <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-[1.3fr_1fr_1fr_0.8fr]">
            <OvCard title="Demographics">
              <OvRow label="Address">
                {b.address && (b.address.line1 || b.address.city)
                  ? <>{[b.address.line1, b.address.line2].filter(Boolean).join(', ')}<br />{[b.address.city, b.address.state, b.address.zip].filter(Boolean).join(' ')}</>
                  : b.addressLine}
              </OvRow>
              <OvRow label="Phone">{b.phone}</OvRow>
              <OvRow label="Emergency contact">
                {b.responsibleParty && b.responsibleParty.name
                  ? <>{b.responsibleParty.relationship ? `${b.responsibleParty.relationship} – ` : ''}{b.responsibleParty.name}{b.responsibleParty.phone ? <><br />{b.responsibleParty.phone}</> : null}</>
                  : null}
              </OvRow>
              <OvRow label="Existing PCP">{b.pcp && b.pcp.name ? [b.pcp.name, b.pcp.practice].filter(Boolean).join(', ') : null}</OvRow>
            </OvCard>
            <OvCard title="Active Problems" onMore={go('problems')} moreLabel={active.length > 6 ? `View all ${active.length}` : 'View all'}>
              {ovState(emr.problems, linked, 'problems') || (active.length === 0
                ? <p className="text-stone-400 text-[12.5px]">No active problems on file.</p>
                : <ul className="space-y-1.5">{active.slice(0, 6).map(r => (
                  <li key={r.id} className="flex gap-2"><span className="text-red-500 mt-[1px]">●</span><span>{r.title}</span></li>))}</ul>)}
            </OvCard>
            <OvCard title={`Current Medications${meds.length ? ` (${meds.length})` : ''}`} onMore={go('medications')} moreLabel="View all">
              {ovState(emr.medications, linked, 'medications') || (meds.length === 0
                ? <p className="text-stone-400 text-[12.5px]">No current medications on file.</p>
                : <ul className="space-y-1.5">{meds.slice(0, 5).map(r => (
                  <li key={r.id} className="flex justify-between gap-2">
                    <span className="flex gap-2 min-w-0"><i className="ti ti-pill text-stone-400 mt-[2px]" /><span className="truncate">{r.title}</span></span>
                    {r.instructions && <span className="text-stone-500 text-[12px] text-right shrink-0 max-w-[45%] truncate" title={r.instructions}>{r.instructions}</span>}
                  </li>))}</ul>)}
            </OvCard>
            <OvCard title={`Allergies${allergies.length ? ` (${allergies.length})` : ''}`} onMore={go('allergies')}>
              {ovState(emr.allergies, linked, 'allergies') || (allergies.length === 0
                ? <p className="text-stone-500 text-[12.5px]"><i className="ti ti-circle-check mr-1" />No known allergies on file.</p>
                : <ul className="space-y-1.5">{allergies.map(r => (
                  <li key={r.id} className="flex gap-2"><span className="text-red-500 mt-[1px]">●</span>
                    <span><b className="font-semibold">{r.title}</b>{r.criticality ? <span className="block text-[11.5px] text-stone-500">{r.criticality} criticality</span> : null}</span></li>))}</ul>)}
            </OvCard>
          </div>
          <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-[1.4fr_1fr_1fr_1fr]">
            <OvCard title="Latest Vitals">
              {!linked && !(chart.draftVitals || []).length ? ovState(null, false, 'vitals') : (
                <>
                  <div className="text-[12px] text-stone-500 mb-2">
                    {vitalsAt ? fmtDate(String(vitalsAt).slice(0, 10)) : 'No readings on file'}
                    {vitals.some(v => v.draft) && <DraftVitalsChip />}
                  </div>
                  <div className="flex flex-wrap gap-y-3">
                    {vitals.map(v => (
                      <div key={v.label} className="min-w-0 w-1/2 sm:w-1/4 pr-2">
                        <div className="text-[11.5px] text-stone-500">{v.label}</div>
                        <div className="text-[19px] font-semibold text-primary truncate">{v.big || '—'}</div>
                        {v.small && <div className="text-[11px] text-stone-500 truncate">{v.small}</div>}
                      </div>
                    ))}
                  </div>
                  {emr.vitals && !emr.vitals.ok && <p className="text-red-600 text-[12px] mt-2">Vitals could not be read from OpenEMR.</p>}
                </>
              )}
            </OvCard>
            <OvCard title="Care Plan" onMore={go('careplan')} moreLabel="View plan">
              {plan === undefined ? <p className="text-stone-400 text-[12.5px]">Loading…</p>
                : !cp ? <p className="text-stone-400 text-[12.5px]">No care plan written yet.</p>
                : <>
                  <p className="font-semibold text-primary">{(cp.problems || []).slice(0, 2).join(', ') || `Version ${cp.version}`}</p>
                  <p className="text-[12px] text-stone-500 mt-0.5">Version {cp.version}{cp.authoredAt ? ` · updated ${fmtDate(String(cp.authoredAt).slice(0, 10))}` : ''}</p>
                  {cp.providerCoSignStatus === 'pending' && <span className="chip bg-amber-50 text-amber-800 mt-2">Awaiting clinician co-signature</span>}
                </>}
            </OvCard>
            <OvCard title="Last Encounter" onMore={go('encounters')} moreLabel="View encounters">
              {ovState(emr.encounters, linked, 'encounters') || (last && (
                <>
                  <p className="text-[12px] text-stone-500">{last.start ? fmtDate(String(last.start).slice(0, 10)) : 'Undated'}</p>
                  <p className="font-semibold text-primary">{last.type}</p>
                  {last.provider && <p className="text-[12px] text-stone-500">{last.provider}</p>}
                </>
              ))}
            </OvCard>
            <OvCard title="Coverage">
              {ins.primary || ins.secondary ? (
                <>
                  <p className="font-semibold text-primary">{ins.primary || '—'}</p>
                  {ins.secondary && <p className="text-[12px] text-stone-500">Secondary: {ins.secondary}</p>}
                  <div className="flex gap-1.5 flex-wrap mt-1.5">
                    {ins.medicareAdvantage && <span className="chip bg-amber-100 text-amber-800">Medicare Advantage</span>}
                    {ins.qmb && <span className="chip bg-amber-100 text-amber-800">QMB</span>}
                  </div>
                </>
              ) : <p className="text-stone-400 text-[12.5px]">No coverage on file.</p>}
            </OvCard>
          </div>
        </div>
      );
    };

    // ── H&P documentation tab (intake spec §2C) ──
    // appointmentEid (4.2): set when the visit is opened from a calendar
    // appointment — the resulting Encounter links back to it.
    // These live at MODULE scope on purpose. A component declared inside
    // another component's body is a NEW function identity on every render, so
    // React tears down its subtree and builds a fresh one — destroying the
    // <input> DOM node and the caret with it. The symptom is a field that
    // accepts exactly one character and then stops. Keep them out here.
    const VitalInput = ({ k, label, w, f, set }) => (
      <Field label={label} className={w || ''}>
        <input className="inp" value={f.vitals[k]} onChange={e => set(`vitals.${k}`, e.target.value)} />
      </Field>
    );
    // ── Dictation (Scope F5), and the one option deliberately NOT taken ────
    // The browser's Web Speech API is not wired and must not be. In Chrome its
    // implementation streams the audio to Google's servers, which would put a
    // clinician dictating an assessment about a named patient outside the BAA —
    // a PHI disclosure with no agreement behind it, from a feature that looks
    // free.
    //
    // What works today needs no code and no vendor at all: the DEVICE
    // KEYBOARD's own microphone dictates into any ordinary textarea, and on iOS
    // it is on-device for supported languages. So every narrative field stays a
    // plain textarea — `speech` and `dictation` attributes left alone — and the
    // form simply says so, once, rather than shipping a button that would send
    // a patient's history to a third party.
    //
    // When Amazon Transcribe Medical is available inside the AWS boundary it
    // slots in behind an IAM role with zero data retention confirmed, the same
    // way §10.3 governs Bedrock. That is a configuration, not a rewrite.
    const DictationHint = () => (
      <div className="mb-2"><Hint>
        <i className="ti ti-microphone mr-1" />
        To dictate, use the microphone on your phone or tablet keyboard — it types straight into any box here.
      </Hint></div>
    );

    const TextArea = ({ path, label, rows, f, set }) => (
      <Field label={label}>
        <textarea className="inp" rows={rows || 2} value={path.split('.').reduce((o, k) => o[k], f)} onChange={e => set(path, e.target.value)} />
      </Field>
    );
    // ══ The shared clinical note (owner-directed, 2026-09-27) ═══════════════
    // A note used to be filed once and never edited again. It is now a SHARED,
    // VERSIONED draft on its encounter: Save draft writes the app and OpenEMR in
    // one action and stamps the editor and time; anyone writing on this chart
    // may edit it; Sign & submit locks it. Every component below is module
    // scope — see the note above VitalInput about remounting inputs.
    const NF = window.GFC_NOTE_FORMAT;

    const FMT_TOOLS = [
      { cmd: 'bold', label: <b>B</b>, title: 'Bold (Ctrl/⌘+B)' },
      { cmd: 'italic', label: <i>I</i>, title: 'Italic (Ctrl/⌘+I)' },
      { cmd: 'underline', label: <u>U</u>, title: 'Underline (Ctrl/⌘+U)' },
      { cmd: 'insertUnorderedList', label: <i className="ti ti-list" />, title: 'Bulleted list' },
      { cmd: 'insertOrderedList', label: <i className="ti ti-list-numbers" />, title: 'Numbered list' },
      { cmd: 'heading', label: <i className="ti ti-heading" />, title: 'Section heading' }
    ];
    // A note field with a formatting toolbar. What it stores is the six-shape
    // markup, never HTML: every change walks the editor's DOM back through
    // domToMarkup, so a paste or an odd browser element cannot reach a record.
    const FormattedField = ({ label, value, onChange, readOnly, placeholder, minRows, carried, onConfirmCarried, required }) => {
      const ref = useRef(null);
      const emitted = useRef(null);
      // Load the value when it changes from OUTSIDE — a load, a carry-forward,
      // the other clinician's version. Never on this editor's own keystrokes, or
      // the caret would jump to the start on every letter.
      useEffect(() => {
        const el = ref.current;
        if (!el || value === emitted.current) return;
        el.innerHTML = NF.renderHtml(value || '');
        emitted.current = value;
      }, [value]);
      const emit = () => {
        if (!ref.current) return;
        // newlines: Shift+Enter in this pre-wrap box is a real line break, not a space.
        const markup = NF.domToMarkup(ref.current, { newlines: true });
        if (markup === emitted.current) return;
        emitted.current = markup;
        onChange && onChange(markup);
      };
      const run = (cmd) => {
        if (readOnly || !ref.current) return;
        ref.current.focus();
        if (cmd === 'heading') {
          const inHeading = /^h\d$/i.test(String(document.queryCommandValue('formatBlock') || ''));
          document.execCommand('formatBlock', false, inHeading ? 'div' : 'h3');
        } else {
          document.execCommand(cmd, false, null);
        }
        emit();
      };
      // A paste arrives as TEXT: formatting from Word or a web page is not
      // carried over, and the clinician applies what they mean with the toolbar.
      const onPaste = (e) => {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData('text/plain');
        document.execCommand('insertText', false, text);
        emit();
      };
      return (
        <div>
          {label && <span className="lblu block mb-1">{label}{required && <span className="text-amber-700"> · required to sign</span>}</span>}
          <div className={`rounded-lg ${carried ? 'carried' : 'border border-[#e5ddcb]'} bg-white`}>
            {!readOnly && (
              <div className="flex flex-wrap gap-1 px-2 pt-2" role="toolbar" aria-label={`Format ${label || 'text'}`}>
                {FMT_TOOLS.map(t => (
                  <button type="button" key={t.cmd} className="fmt-tool" title={t.title} aria-label={t.title}
                    onMouseDown={e => { e.preventDefault(); run(t.cmd); }}>{t.label}</button>
                ))}
              </div>
            )}
            <div ref={ref} className="fmt fmt-editor px-3 py-2" role="textbox" aria-multiline="true" aria-label={label || 'Note text'}
              contentEditable={!readOnly} suppressContentEditableWarning data-placeholder={placeholder || ''}
              style={{ minHeight: `${(minRows || 2) * 1.5}em` }}
              onInput={emit} onBlur={emit} onPaste={onPaste} />
          </div>
          {carried && (
            <button type="button" className="prefill-badge mt-1 flex items-center gap-1" onClick={onConfirmCarried}>
              <i className="ti ti-alert-circle" /> CARRIED FORWARD — EDIT IT, OR TAP TO CONFIRM IT STILL APPLIES
            </button>
          )}
        </div>
      );
    };

    // Choose an earlier note to start from. The server says which notes exist
    // and returns the content with vitals and the date already left out.
    const CarryForwardPicker = ({ patientId, excludeEuuid, onPick, onClose }) => {
      const [sources, setSources] = useState(null);
      const [err, setErr] = useState('');
      const [busy, setBusy] = useState('');
      useEffect(() => {
        api.carrySources(patientId).then(r => setSources((r.sources || []).filter(s => s.encounterUuid !== excludeEuuid)))
          .catch(e => setErr(e.message));
      }, [patientId, excludeEuuid]);
      const pick = (s) => {
        setBusy(s.encounterUuid); setErr('');
        api.carryContent(patientId, s.encounterUuid).then(r => onPick(r)).catch(e => { setErr(e.message); setBusy(''); });
      };
      return (
        <div className="card p-3 mb-3 border-accent">
          <div className="flex items-center justify-between mb-2">
            <b className="text-sm text-primary"><i className="ti ti-copy mr-1" />Copy Previous Note</b>
            <button className="text-stone-400" onClick={onClose}><i className="ti ti-x" /></button>
          </div>
          <div className="mb-2"><Hint>Copies the whole note except vitals and the date. Every copied section is marked, and the note cannot be signed until each one has been edited or confirmed.</Hint></div>
          {err && <p className="text-xs text-red-600">{err}</p>}
          {!sources && !err && <p className="text-xs text-stone-500">Loading earlier notes…</p>}
          {sources && sources.length === 0 && <p className="text-xs text-stone-500">No earlier notes on this chart.</p>}
          <div className="grid gap-1.5">
            {(sources || []).map(s => (
              <button key={s.encounterUuid} className="text-left border border-stone-200 rounded-lg px-3 py-2 hover:bg-cream text-xs"
                disabled={!!busy} onClick={() => pick(s)}>
                <b>{s.date || '—'}</b> · {s.visitLabel || s.reason || 'Visit'}{s.signedBy ? ` · signed by ${s.signedBy}` : ` · ${s.status}`}
                {busy === s.encounterUuid && <span className="ml-2 text-stone-400">loading…</span>}
              </button>
            ))}
          </div>
        </div>
      );
    };

    // Two people saved the same note. Neither version is thrown away: theirs is
    // shown, and the clinician decides.
    const NoteConflict = ({ conflict, onUseTheirs, onKeepMine }) => (
      <div className="card p-3 mb-3 border-amber-300 bg-amber-50 text-sm">
        <b className="text-amber-900"><i className="ti ti-users mr-1" />{conflict.message}</b>
        <div className="flex flex-wrap gap-2 mt-2">
          <button className="btn ghost !py-1 !px-2.5 text-xs" onClick={onUseTheirs}>Load their version (discards what I typed)</button>
          <button className="btn !py-1 !px-2.5 text-xs" onClick={onKeepMine}>Keep Mine</button>
        </div>
        <p className="text-[11px] text-amber-800 mt-1">Either way, both saves stay in the note history with their names and times.</p>
      </div>
    );

    // The note's lifecycle, shared by the H&P and the follow-up editors.
    const useSharedNote = ({ patientId, encounterUuid: initialEuuid, appointmentEid }) => {
      const [euuid, setEuuid] = useState(initialEuuid || null);
      const [meta, setMeta] = useState({ version: 0, status: 'draft', revisions: [], signature: null, carriedPending: [], carriedFrom: null, signsAsAuthor: false });
      const [carryFrom, setCarryFrom] = useState(null);           // a carry-forward chosen but not yet saved
      const [localPending, setLocalPending] = useState([]);       // its fields, until the server answers
      const [confirmCarried, setConfirmCarried] = useState([]);
      const [conflict, setConflict] = useState(null);
      const adopt = (r) => {
        setMeta(m => ({ ...m, version: r.version, status: r.status, revisions: r.revisions || [], signature: r.signature || null,
          carriedPending: r.carriedPending || [], carriedFrom: r.carriedFrom || null,
          narrativeSyncError: r.narrativeSyncError || null,
          signsAsAuthor: r.signsAsAuthor !== undefined ? !!r.signsAsAuthor : m.signsAsAuthor }));
        setCarryFrom(null); setLocalPending([]); setConfirmCarried([]); setConflict(null);
      };
      const pending = carryFrom ? localPending : (meta.carriedPending || []).filter(k => !confirmCarried.includes(k));
      const load = () => (euuid ? api.getNote(patientId, euuid).then(r => { adopt(r); return r; }) : Promise.resolve(null));
      const save = (note, { overwrite } = {}) => {
        const body = { note, carryForwardFrom: carryFrom || undefined, confirmCarried };
        const call = euuid
          ? api.saveNote(patientId, euuid, { ...body, baseVersion: overwrite ? overwrite.version : meta.version })
          : api.createNote(patientId, { ...body, appointmentEid: appointmentEid || undefined });
        return call.then(r => {
          if (r.encounterUuid) setEuuid(r.encounterUuid);
          adopt(r);
          return r;
        }).catch(e => {
          if (e.data && e.data.code === 'NOTE_CHANGED') {
            setConflict({ message: e.message, version: e.data.version, note: e.data.note, lastSavedBy: e.data.lastSavedBy });
          }
          throw e;
        });
      };
      const applyCarry = (r) => { setCarryFrom(r.fromEncounterUuid); setLocalPending(r.fields || []); };
      const confirm = (key) => {
        setConfirmCarried(c => (c.includes(key) ? c : [...c, key]));
        setLocalPending(p => p.filter(k => k !== key));
      };
      return { euuid, meta, pending, conflict, setConflict, load, save, applyCarry, confirm, carryFrom };
    };

    // Portal P1 (owner, 2026-09-29): a signed note is shown to the patient.
    // A clinician may hold one from the portal, with a reason from a fixed
    // list. Module scope, per the input-focus rule.
    const PORTAL_HOLD_REASONS = [
      ['risk_of_harm', 'Substantial risk of harm to the patient or another person'],
      ['patient_request', 'The patient asked for it not to be shown']
    ];
    const portalHoldPayload = (hold) => (hold && hold.on ? { reason: hold.reason || '' } : false);
    const PortalHoldControl = ({ hold, setHold }) => (
      <div className="text-xs">
        <label className="flex items-start gap-2">
          <input type="checkbox" className="mt-0.5" checked={!!hold.on} onChange={e => setHold({ ...hold, on: e.target.checked })} />
          <span>Hold this note from the patient portal. The visit summary still publishes; the portal says the note is available on request.</span>
        </label>
        {hold.on && (
          <select className="inp mt-1.5" value={hold.reason || ''} onChange={e => setHold({ ...hold, reason: e.target.value })}>
            <option value="">Choose a reason (required)</option>
            {PORTAL_HOLD_REASONS.map(([k, label]) => <option key={k} value={k}>{label}</option>)}
          </select>
        )}
      </div>
    );

    // Where this signed visit stands on the patient's portal, the retry
    // button, and placing or releasing a hold after signing.
    const PortalPublishCard = ({ record, attestation, canWrite, busy, onPublish }) => {
      const [hold, setHold] = useState({ on: false, reason: '' });
      const r = record || {};
      const held = !!(attestation && attestation.portalHold);
      const heldLabel = held ? (PORTAL_HOLD_REASONS.find(([k]) => k === attestation.portalHold.reason) || [null, attestation.portalHold.reason])[1] : null;
      return (
        <div className="card mb-4">
          <div className="card-h"><h2>Patient Portal</h2>
            <span className={`chip ${r.portalPublished ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-800'}`}>
              {r.portalPublished ? 'Published' : (r.portalPublishError ? 'Did not publish' : 'Not published')}
            </span>
          </div>
          <div className="p-4 grid gap-2 text-sm">
            {r.portalPublished && <p className="text-xs text-stone-600">The visit summary{held ? '' : ' and the signed note'} are on the patient's portal{r.portalPublishedAt ? ` (published ${fmtTs(r.portalPublishedAt)})` : ''}.</p>}
            {!r.portalPublished && r.portalPublishError && <p className="text-xs text-amber-700">It did not publish: {r.portalPublishError}. Publishing again is safe.</p>}
            {!r.portalPublished && !r.portalPublishError && <p className="text-xs text-stone-600">This visit was signed before portal publishing existed, or has not been published yet.</p>}
            {held && <p className="text-xs text-stone-600"><b>Note held from the portal:</b> {heldLabel}. The patient sees the summary and "available on request".</p>}
            {canWrite && (
              <div className="flex flex-wrap items-start gap-2">
                <button className="btn w-fit" disabled={busy === 'portal'} onClick={() => onPublish(undefined)}>
                  <i className="ti ti-world-upload" />{busy === 'portal' ? 'Publishing…' : 'Publish to Portal'}
                </button>
                {held && <button className="btn ghost w-fit" disabled={busy === 'portal'} onClick={() => onPublish('release')}>Release to Portal</button>}
              </div>
            )}
            {canWrite && !held && (
              <div className="grid gap-1.5">
                <PortalHoldControl hold={hold} setHold={setHold} />
                {hold.on && <button className="btn ghost w-fit" disabled={!hold.reason || busy === 'portal'} onClick={() => onPublish({ reason: hold.reason })}>Hold & Republish</button>}
              </div>
            )}
          </div>
        </div>
      );
    };

    // Sign & submit: saves first, then signs. The server decides whether this
    // is a billable signature or an author's; a refusal says what is missing.
    // Whether the note on screen differs from the one last loaded or saved
    // (owner report, 2026-10-12). The encounter's Sign & Submit card reads the
    // SAVED note, so while typing is unsaved it would list sections that are
    // plainly filled in. The editor reports { dirty, save } up so the card can
    // say "save first" instead. `markSaved()` takes the next render's form as
    // the saved copy: after a load (the server's note as shown) or a save.
    const useNoteDirty = (f, onNoteState, save) => {
      const savedRef = useRef(null);
      const pendingRef = useRef(true);
      const saveRef = useRef(save); saveRef.current = save;
      const cur = JSON.stringify(f);
      useEffect(() => {
        if (pendingRef.current) { savedRef.current = cur; pendingRef.current = false; }
        if (onNoteState) onNoteState({ dirty: savedRef.current != null && cur !== savedRef.current, save: () => saveRef.current() });
      });
      useEffect(() => () => { if (onNoteState) onNoteState({ dirty: false, save: null }); }, []);
      return () => { pendingRef.current = true; };
    };

    // Shown on the Sign & Submit card while the note has unsaved typing.
    const UnsavedNoteLine = ({ onSave }) => (
      <div className="flex flex-wrap items-center gap-2 text-xs text-amber-700">
        <span><i className="ti ti-alert-triangle mr-1" />Your note has unsaved changes. Save it to check what signing still needs.</span>
        <button className="btn !py-1 text-xs" onClick={onSave}><i className="ti ti-device-floppy" />Save Note</button>
      </div>
    );

    // The total time on the date of service (documentation gate, 2026-11-04).
    // A whole number of minutes: the coding queue does not accept prose. When
    // the visit's start and end were recorded on My Day and nothing is typed
    // here, those are used. Module scope, so typing never remounts the input.
    const TotalTimeField = ({ value, onChange, recorded }) => (
      <label className="grid gap-1 text-xs">
        <span className="font-semibold text-primary">Total time on this date (minutes)</span>
        <input className="inp w-32" inputMode="numeric" pattern="[0-9]*" value={value}
          onChange={e => onChange(e.target.value.replace(/[^0-9]/g, '').slice(0, 4))}
          placeholder={recorded ? String(recorded.minutes) : 'e.g. 45'} />
        {recorded && recorded.source === 'recorded_start_end' && <span className="text-[11px] text-stone-500">Your recorded start and end come to {recorded.minutes} minutes. Leave blank to use that.</span>}
        {recorded && recorded.source === 'entered' && <span className="text-[11px] text-stone-500">{recorded.minutes} minutes is on file. Leave blank to keep it.</span>}
      </label>
    );

    // ONE place signs a note: the encounter's Sign card (2026-11-04). The
    // note editors used to carry a second sign box of their own, with a
    // different attestation and without the visit facts, so the same note had
    // two ways in. Their Sign & Submit now saves and goes to that card.
    // ── ONE NOTE, IN THE VISIT TYPE'S OWN ORDER (owner report, 2026-09-28) ──
    // The template sections used to be dumped into a separate "Visit sections"
    // card in the middle of the note, with the note's fixed fields (chief
    // concern, vitals, exam, assessment, plan) in cards around it — so the page
    // read as two notes. Now every section appears ONCE, in the order the visit
    // type lists it. A section the note already has a fixed field for shows
    // that field in its place; the rest get their own box.
    //
    // DISPLAY ONLY. Nothing about how a note is stored changes: the fixed fields
    // and `sections.<key>` are saved exactly as before.
    //
    // Mirrors clinicalNotes.FIELD_FOR_SECTION (build-enforced key for key), so a
    // section the server counts as answered by a fixed field never gets a
    // second box here.
    const FIXED_BLOCK_FOR_SECTION = Object.freeze({
      chiefComplaint: 'chiefConcern', reasonForVisit: 'chiefConcern',
      hpi: 'subjective', intervalHistory: 'subjective', subjective: 'subjective',
      vitals: 'vitals', awvVitals: 'vitals',
      physicalExam: 'exam', focusedExam: 'exam',
      mentalStatusExam: 'mse',
      assessment: 'assessment', plan: 'plan'
    });
    // Sections the encounter's own interactive cards already ARE — the Orders
    // and Prescriptions cards (owner, 2026-09-28: keep those, drop the free-text
    // copy). An order or prescription placed on the encounter satisfies these
    // on the server (noteSatisfiers), so no text box is offered for them — only
    // a pointer to the card. A box that ALREADY holds text still shows, so
    // nothing typed before this change is hidden.
    const SECTIONS_COVERED_BY_CARDS = Object.freeze({
      ordersRx: 'the Orders and Prescriptions cards',
      ordersRxReferrals: 'the Orders and Prescriptions cards',
      medicationsRx: 'the Prescriptions card'
    });
    // → an ordered list of { kind: 'fixed', block, label } | { kind: 'section',
    //   section } | { kind: 'pointer', section, card } | { kind: 'heading',
    //   label }. Nothing already typed is ever
    //   left out: fixed blocks the template does not name, and any stored
    //   section this visit type no longer lists (the type was changed after
    //   typing), follow the template under their own headings.
    //
    // A SOAP template (owner, 2026-10-12) carries a `group` on each row. Its
    // Objective rows sit under an "Objective" heading, and the visit type's own
    // questions follow the core under "<type> — additional" (`typeLabel`).
    const noteLayout = ({ sections, fixedBlocks, extraBlocks, extraLabel, stored, labelFor, typeLabel }) => {
      const out = [];
      const used = new Set();
      const listed = new Set();
      let group = null;
      for (const sec of (sections || [])) {
        listed.add(sec.key);
        if (sec.group && sec.group !== group) {
          if (sec.group === 'o') out.push({ kind: 'heading', label: 'Objective' });
          if (sec.group === 'extra') out.push({ kind: 'heading', label: `${typeLabel || 'This visit'} — additional` });
          group = sec.group;
        }
        const block = FIXED_BLOCK_FOR_SECTION[sec.key];
        if (!sec.ownField && block && fixedBlocks.includes(block)) {
          if (used.has(block)) continue;          // two names for one field — shown once
          used.add(block);
          out.push({ kind: 'fixed', block, label: sec.label, patientReported: !!sec.patientReported });
        } else if (SECTIONS_COVERED_BY_CARDS[sec.key] && NF.isBlank((stored || {})[sec.key])) {
          out.push({ kind: 'pointer', section: sec, card: SECTIONS_COVERED_BY_CARDS[sec.key] });
        } else {
          out.push({ kind: 'section', section: sec });
        }
      }
      const rest = fixedBlocks.filter(b => !used.has(b)).concat(extraBlocks || []);
      if (rest.length) {
        if (out.length) out.push({ kind: 'heading', label: extraLabel });
        for (const b of rest) out.push({ kind: 'fixed', block: b, label: null });
      }
      const orphans = Object.keys(stored || {}).filter(k => !listed.has(k) && !NF.isBlank(stored[k]));
      if (orphans.length) {
        out.push({ kind: 'heading', label: 'From an earlier visit type — kept, still saved with the note' });
        for (const k of orphans) out.push({ kind: 'section', section: { key: k, label: labelFor ? labelFor(k) : k, ownField: true, required: false } });
      }
      return out;
    };
    // One section's own box — the same field, value and badges the old card had.
    const renderOwnSection = (sec, values, onChange, pending, onConfirm) => (
      <FormattedField key={`sec-${sec.key}`} label={sec.label} required={sec.required}
        value={(values || {})[sec.key] || ''} onChange={v => onChange(sec.key, v)}
        carried={(pending || []).includes(`sections.${sec.key}`)} onConfirmCarried={() => onConfirm(`sections.${sec.key}`)} />
    );
    const CardPointer = ({ section, card }) => (
      <div className="text-xs text-stone-600 border border-dashed border-stone-300 rounded-lg px-3 py-2">
        <b className="text-primary">{section.label}</b> — recorded in {card} on this encounter's Coding step, not typed here.
      </div>
    );
    const NoteHeading = ({ label }) => (
      <div className="border-t border-stone-200 pt-3 mt-1"><span className="text-[11px] font-bold text-primary uppercase tracking-wide">{label}</span></div>
    );
    const sectionLabelFor = (k) => String(k).replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase());

    // ONE block of a follow-up note, shared by the Visit tab and the encounter
    // so a follow-up looks the same whichever button started it (owner,
    // 2026-10-12). A plain function, not a component: a component declared per
    // render remounts its inputs and drops the caret.
    //   f            the form ({ chiefConcern, subjective, objective, assessment, plan, vitals })
    //   setText      (key, value) for the five text fields
    //   setV         (vitalKey, value)
    //   carried      (key) => whether the field is still held for review
    //   onConfirm    (key) => confirm a carried field
    // A telehealth visit keeps the same boxes; vitals and exam say they were
    // reported by the patient or observed by video.
    const SOAP_BLOCK_LABELS = Object.freeze({
      chiefConcern: 'Chief Complaint', subjective: 'Subjective', vitals: 'Vitals',
      exam: 'Physical Exam', assessment: 'Assessment', plan: 'Plan'
    });
    const SOAP_BLOCKS = Object.keys(SOAP_BLOCK_LABELS);
    const soapBlock = ({ block, label, patientReported, f, setText, setV, carried, onConfirm }) => {
      const text = (k, rows) => (
        <FormattedField label={label || SOAP_BLOCK_LABELS[block]} minRows={rows || 2} value={f[k] || ''} onChange={v => setText(k, v)}
          carried={carried(k)} onConfirmCarried={() => onConfirm(k)} />
      );
      switch (block) {
        case 'chiefConcern': return text('chiefConcern');
        case 'subjective': return text('subjective', 3);
        case 'vitals': return (
          <div>
            <span className="lblu block mb-1">{label || 'Vitals'}{patientReported && <span className="normal-case font-normal text-stone-500"> · patient-reported on a video visit</span>}</span>
            <div className="grid grid-cols-1 sm:grid-cols-3 md:grid-cols-5 gap-2">
              <FollowUpVital f={f} setV={setV} k="bpSys" label="BP sys" /><FollowUpVital f={f} setV={setV} k="bpDia" label="BP dia" /><FollowUpVital f={f} setV={setV} k="hr" label="HR" /><FollowUpVital f={f} setV={setV} k="temp" label="Temp °F" /><FollowUpVital f={f} setV={setV} k="rr" label="RR" />
              <FollowUpVital f={f} setV={setV} k="spo2" label="SpO₂ %" /><FollowUpVital f={f} setV={setV} k="weight" label="Wt lb" /><FollowUpVital f={f} setV={setV} k="height" label="Ht in" /><FollowUpVital f={f} setV={setV} k="pain" label="Pain /10" />
            </div>
          </div>
        );
        case 'exam': return (
          <div>
            {text('objective', 3)}
            {patientReported && <p className="text-[11px] text-stone-500 mt-1">Video visit: record what was observed by video.</p>}
          </div>
        );
        case 'assessment': return text('assessment', 3);
        case 'plan': return text('plan', 3);
        default: return null;
      }
    };
    // A draft that holds H&P-only boxes (written before the visit type decided
    // the note) keeps them: they are shown and saved, never dropped.
    const HP_BLOCK_FOR_PART = Object.freeze({
      systemsExam: 'systemsGrid', mentalStatusExam: 'mse', skinWound: 'skinWound',
      painAssessment: 'pain', homeHazards: 'hazards', triage: 'triage'
    });
    const hpPartHasContent = (part, values) => Object.entries(values || {})
      .some(([k, v]) => String(v || '').trim() && !(part === 'skinWound' && k === 'woundPresent' && v === 'no'));
    const noteHasHpContent = (note) => !!(note && note.hp && Object.keys(note.hp).some(k => hpPartHasContent(k, note.hp[k])));

    // Which appointment a new note belongs to. Today's and earlier visits with
    // no note yet, newest first, or "unscheduled". Module scope, per the
    // input-focus rule.
    const VisitAppointmentPicker = ({ patientId, value, onChange }) => {
      const [appts, setAppts] = useState(null);
      useEffect(() => {
        let live = true;
        api.patientAppointments(patientId)
          .then(r => { if (!live) return; const today = todayYmd(); setAppts(((r && r.appointments) || []).filter(a => !a.encounterUuid && a.date <= today && ['scheduled', 'needs_documentation'].includes(a.state)).reverse()); })
          .catch(() => { if (live) setAppts([]); });
        return () => { live = false; };
      }, [patientId]);
      if (!appts || appts.length === 0) return null;
      return (
        <div className="card p-3 mb-4 grid gap-1.5 text-sm">
          <label className="lblu" htmlFor="visit-appt">Which appointment is this visit for?</label>
          <select id="visit-appt" className="inp" value={value || ''} onChange={e => onChange(e.target.value || null)}>
            <option value="">Unscheduled visit (no appointment)</option>
            {appts.map(a => <option key={a.eid} value={a.eid}>{fmtDayLabel(a.date)} · {fmt12h(a.startTime)} — {a.title || 'Appointment'}</option>)}
          </select>
        </div>
      );
    };

    const HpTab = ({ patient, chart, appointmentEid: givenEid, onDone, onGoToEncounter, encounterUuid, embedded, onChanged, codingDirty, onNoteState, onSign }) => {
      // ONE way to start a visit (owner, 2026-11-04): New Visit opens this
      // screen, and when it was not opened from an appointment it asks which
      // one it is for, or none. That choice used to be a separate popup.
      const [pickedEid, setPickedEid] = useState(null);
      const appointmentEid = givenEid || pickedEid;
      const pf = (chart && chart.intakePrefill) || {};
      const [confirmed, setConfirmed] = useState([]);
      const confirm = (k) => setConfirmed(c => c.includes(k) ? c : [...c, k]);
      const [f, setF] = useState({
        chiefConcern: pf.chiefConcern ? NF.fromPlainText(pf.chiefConcern) : '',
        // The encounter date fills itself in (owner, 2026-10-19): today, or
        // the date a saved note or a call already carries. A note opened from
        // an appointment takes the appointment's date on the server.
        visitDate: appointmentEid ? '' : todayYmd(),
        subjective: '', objective: '', assessment: '', plan: '', sections: {},
        // bpSys/bpDia/pain are the follow-up note's single BP: a follow-up
        // visit type opens the SOAP note here (owner, 2026-10-12).
        vitals: { bpRightSys: '', bpRightDia: '', bpLeftSys: '', bpLeftDia: '', bpRightUnable: '', bpRightUnableReason: '', bpLeftUnable: '', bpLeftUnableReason: '', bpSys: '', bpDia: '', pain: '', hr: '', temp: '', rr: '', spo2: '', weight: '', height: '' },
        systemsExam: { general: '', cardiovascular: '', respiratory: '', lungSounds: '', neuro: '', gi: '', gu: '', musculoskeletal: '' },
        // Scope G — the exam variant, not a different note. Held in state on
        // every visit and RENDERED only on a psychiatric one, so a patient
        // whose type is set mid-visit does not lose what was already typed.
        mentalStatusExam: { appearance: '', behavior: '', speech: '', mood: '', affect: '', thoughtProcess: '', thoughtContent: '', perception: '', cognition: '', insight: '', judgment: '' },
        skinWound: { findings: '', woundPresent: 'no', woundLocation: '', woundMeasurements: '' },
        painAssessment: { breathing: '', negativeVocalization: '', facialExpression: '', bodyLanguage: '', consolability: '', totalScore: '' },
        homeHazards: { smokeDetectors: '', coDetectors: '', grabBars: '', nonSkidSurfaces: '', runningWater: '', secondaryExit: '', notes: '' },
        triage: { track: '', rationale: '' }
      });
      const set = (path, v) => setF(prev => {
        const [a, b] = path.split('.');
        if (!b) return { ...prev, [a]: v };
        return { ...prev, [a]: { ...prev[a], [b]: v } };
      });
      const [busy, setBusy] = useState(false); const [msg, setMsg] = useState(null);
      const [draftAt, setDraftAt] = useState(null);
      const [restored, setRestored] = useState(false);
      const [showCarry, setShowCarry] = useState(false);
      // The shared note: once saved, it lives on its encounter and anyone
      // writing on this chart may edit it (2026-09-27).
      const sn = useSharedNote({ patientId: patient.id, encounterUuid, appointmentEid });
      const HP_SECTIONS = ['systemsExam', 'mentalStatusExam', 'skinWound', 'painAssessment', 'homeHazards', 'triage'];
      // A stored note → this form. Fixed sub-fields keep their blank defaults so
      // every box renders even when the note left it empty.
      const applyNote = (n) => {
        if (!n) return;
        setF(prev => ({
          ...prev,
          chiefConcern: n.chiefConcern || '', subjective: n.subjective || '', objective: n.objective || '',
          assessment: n.assessment || '', plan: n.plan || '', sections: { ...(n.sections || {}) },
          visitDate: n.visitDate || prev.visitDate,
          vitals: { ...prev.vitals, ...(n.vitals || {}) },
          ...HP_SECTIONS.reduce((acc, k) => { acc[k] = { ...prev[k], ...((n.hp || {})[k] || {}) }; return acc; }, {})
        }));
        if (n.visit) setVisit(v => ({ ...v, ...n.visit }));
        if (Array.isArray(n.confirmedFields)) setConfirmed(n.confirmedFields);
      };
      // Resume: a SAVED note from its encounter, or — before the first save —
      // your own scratch copy on this device's account. A note written the old
      // way is offered for editing, seeded from its OpenEMR text.
      useEffect(() => {
        let live = true;
        if (encounterUuid) {
          sn.load().then(r => { if (live && r && r.note) { applyNote(r.note); setRestored(true); } if (live) markSaved(); })
            .catch(e => live && setMsg({ ok: false, text: e.message }));
        } else {
          api.getDraft(patient.id).then(r => {
            if (!live || !r || !r.draft) return;
            const d = r.draft;
            if (d.note) applyNote(d.note);
            else {
              // A scratch draft from before the shared note: plain text, so its
              // literals are preserved as they were typed.
              const txt = (v) => (v ? NF.fromPlainText(v) : '');
              applyNote({ chiefConcern: txt(d.chiefConcern), subjective: txt(d.subjective), assessment: txt(d.assessment), plan: txt(d.plan),
                vitals: d.vitals, hp: HP_SECTIONS.reduce((acc, k) => { if (d[k]) acc[k] = d[k]; return acc; }, {}), confirmedFields: d.confirmedFields });
            }
            setDraftAt(r.updatedAt || null); setRestored(true);
          }).catch(() => { /* no draft is the normal case, never an error on screen */ });
        }
        return () => { live = false; };
      }, [patient.id, encounterUuid]);

      // ── What kind of visit is this? (owner, 2026-09-23) ──────────────────
      // The FIRST thing a clinician chooses, because it decides which note
      // they are about to write. Not a property of the patient: somebody who
      // normally has a primary-care visit can have a psych evaluation, and the
      // note has to follow the visit rather than the chart.
      const [visit, setVisit] = useState({ appointmentType: '', modality: 'in_person', location: '' });
      const [catalog, setCatalog] = useState(null);
      const myRole = useClinicalRole();
      useEffect(() => {
        let live = true;
        api.placeOfService(patient.id)
          .then(d => {
            if (!live) return;
            setCatalog(d);
            // The patient's usual location is a DEFAULT the clinician
            // confirms. Pre-filled, never locked.
            if (d.usualLocation) setVisit(v => v.location ? v : { ...v, location: d.usualLocation });
            // Every note gets a type (owner, 2026-10-12): once the initial
            // visit is done, Follow-up is the default, so a follow-up opens as
            // its SOAP note and never saves as an H&P. A social worker picks
            // one of their own types. (This was the old popup's default.)
            const fu = (d.appointmentTypes || []).find(t => t.key === 'pc_follow_up' && t.canDocument !== false);
            if (fu && patient.initialVisitAt && !['lcsw', 'lmsw'].includes(myRole)) setVisit(v => v.appointmentType ? v : { ...v, appointmentType: fu.key });
          })
          .catch(() => { /* the picker still works; it just has no default */ });
        return () => { live = false; };
      }, [patient.id]);
      const noteSections = useMemo(() => {
        if (!catalog || !visit.appointmentType) return [];
        const type = (catalog.appointmentTypes || []).find(t => t.key === visit.appointmentType);
        if (!type) return [];
        // The SERVER holds the templates; this only asks which sections this
        // visit carries. Restating a template here would drift from the gate
        // that refuses the signature.
        return (catalog.noteTemplates && catalog.noteTemplates[visit.appointmentType]
          ? catalog.noteTemplates[visit.appointmentType]
          : []).filter(sec => sec.modality == null || sec.modality === visit.modality);
      }, [catalog, visit.appointmentType, visit.modality]);
      const noteHasSection = (key) => noteSections.some(s => s.key === key);
      const visitType = catalog && (catalog.appointmentTypes || []).find(t => t.key === visit.appointmentType);
      // A phone call (owner, 2026-10-02): no location, no vitals, no exam, and
      // it saves as a follow-up-shaped note — never an H&P, which would demand
      // a blood pressure in both arms and mark the initial visit as done.
      const isPhone = visit.modality === 'phone';
      // A social worker never writes an H&P: until they choose one of their
      // own visit types the note stays empty rather than showing vitals and
      // a physical exam they cannot record.
      const isSocialWorker = ['lcsw', 'lmsw'].includes(useClinicalRole());
      // Only its template sections: a phone call, or a social work note.
      const sectionsOnly = isPhone || isSocialWorker || !!(visitType && visitType.noteShape === 'sections');
      // A follow-up visit type (served `noteForm`) is never an H&P: the same
      // SOAP note the encounter shows, one BP, no home-visit blocks. Only New
      // Patient, Psych Initial and the IME exam keep this H&P screen.
      const followupForm = !sectionsOnly && !!(visitType && visitType.noteForm === 'followup');
      // H&P boxes a draft already holds are kept and shown, never dropped.
      const legacyHpParts = followupForm ? HP_SECTIONS.filter(k => hpPartHasContent(k, f[k])) : [];
      const allowedModalities = (visitType && visitType.modalities) || null;
      const chooseType = (key) => setVisit(v => {
        const t = catalog && (catalog.appointmentTypes || []).find(x => x.key === key);
        const allowed = (t && t.modalities) || null;
        const modality = allowed && !allowed.includes(v.modality) ? allowed[0] : v.modality;
        return { ...v, appointmentType: key, modality,
          location: modality === 'phone' ? '' : (v.location || (catalog && catalog.usualLocation) || '') };
      });

      // Typed and not yet saved — see useNoteDirty.
      const markSaved = useNoteDirty(f, onNoteState, () => saveDraft());
      // This form → the shared note's shape, carrying the encounter date.
      const toNote = () => ({ ...(f.visitDate ? { visitDate: f.visitDate } : {}), ...toNoteBody() });
      const toNoteBody = () => (sectionsOnly ? {
        kind: 'followup',
        chiefConcern: '', subjective: '', objective: '',
        assessment: '', plan: '', sections: f.sections, vitals: {},
        confirmedFields: confirmed, visit: { ...visit, location: isPhone ? '' : visit.location }
      } : followupForm ? {
        kind: 'followup',
        chiefConcern: f.chiefConcern, subjective: f.subjective, objective: f.objective,
        assessment: f.assessment, plan: f.plan, sections: f.sections, vitals: f.vitals,
        ...(legacyHpParts.length ? { hp: legacyHpParts.reduce((acc, k) => { acc[k] = f[k]; return acc; }, {}) } : {}),
        confirmedFields: confirmed, visit
      } : {
        kind: 'hp',
        chiefConcern: f.chiefConcern, subjective: f.subjective, objective: f.objective,
        assessment: f.assessment, plan: f.plan, sections: f.sections, vitals: f.vitals,
        hp: HP_SECTIONS.reduce((acc, k) => { acc[k] = f[k]; return acc; }, {}),
        confirmedFields: confirmed, visit
      });

      // SAVE DRAFT writes the app AND OpenEMR in one action, stamped with your
      // name and the time. It does NOT sign — the message says so in words,
      // because telling a clinician they signed when they did not is the failure.
      const saveDraft = () => {
        setBusy('draft'); setMsg(null);
        return sn.save(toNote())
          .then(r => {
            markSaved();
            setDraftAt(null);
            setMsg({ ok: true, text: `${r.message}${(r.warnings || []).length ? ` — ${r.warnings.join(' · ')}` : ''}. Saved as a draft — it is NOT signed yet, and anyone working on this chart can keep editing it.` });
            onDone && onDone(); onChanged && onChanged();
            return r;
          })
          .catch(e => { setMsg({ ok: false, text: e.message }); throw e; })
          .finally(() => setBusy(false));
      };

      // Before the first save there is only your scratch copy to throw away.
      // After it, the encounter exists in OpenEMR and cannot be deleted, so the
      // encounter is DELETED with a reason: voided in OpenEMR, hidden from the
      // chart's lists, and kept on record.
      const discardDraft = () => {
        if (sn.euuid) {
          const reason = window.prompt('Why is this encounter being deleted? The reason is kept on record. It will be removed from the chart and voided in OpenEMR, and it will never bill.');
          if (!reason || reason.trim().length < 3) return;
          setBusy('discard'); setMsg(null);
          api.voidNote(patient.id, sn.euuid, reason.trim())
            .then(r => { setMsg({ ok: true, text: r.message }); onDone && onDone(); onChanged && onChanged(); })
            .catch(e => setMsg({ ok: false, text: e.message }))
            .finally(() => setBusy(false));
          return;
        }
        setBusy('discard'); setMsg(null);
        api.discardDraft(patient.id)
          .then(() => { setDraftAt(null); setRestored(false); setMsg({ ok: true, text: 'Draft discarded. What is on screen is still here until you leave the page.' }); })
          .catch(e => setMsg({ ok: false, text: e.message }))
          .finally(() => setBusy(false));
      };

      // Sign & submit: the note has to exist before it can be signed, so it is
      // saved first, then the encounter's Sign card opens — the one place a
      // note is signed.
      const startSign = () => {
        // Signing reads the SAVED diagnoses and locks them: unsaved coding on the
        // encounter screen would be signed away.
        if (codingDirty) { setMsg({ ok: false, text: 'Save your diagnoses and coding on this encounter before signing.' }); return; }
        saveDraft().then(r => { const id = sn.euuid || (r && r.encounterUuid); if (id && onSign) onSign(id); }).catch(() => {});
      };
      const pickCarry = (r) => {
        const c = r.content || {};
        // Vitals and the date are never carried — they belong to today.
        applyNote({ ...c, vitals: {}, visit: undefined, confirmedFields: confirmed });
        sn.applyCarry(r);
        setShowCarry(false);
        setMsg({ ok: true, text: `Copied from the note of ${r.fromDate || 'an earlier visit'}. Every copied section is marked — edit or confirm each one before signing.` });
      };
      const isCarried = (key) => sn.pending.includes(key);
      // A plain function, NOT a component: a component declared in here would
      // be a new type every render and remount the inputs it wraps.
      const carriedMark = (k) => (isCarried(k)
        ? <button type="button" className="prefill-badge mt-2 flex items-center gap-1" onClick={() => sn.confirm(k)}>
            <i className="ti ti-alert-circle" /> CARRIED FORWARD — EDIT IT, OR TAP TO CONFIRM IT STILL APPLIES
          </button>
        : null);
      const painFields = ['breathing', 'negativeVocalization', 'facialExpression', 'bodyLanguage', 'consolability'];
      const hazardFields = [['smokeDetectors', 'Smoke detectors'], ['coDetectors', 'CO detectors'], ['grabBars', 'Grab bars'], ['nonSkidSurfaces', 'Non-skid surfaces'], ['runningWater', 'Running water'], ['secondaryExit', 'Secondary exit']];
      const setSection = (k, v) => setF(prev => ({ ...prev, sections: { ...prev.sections, [k]: v } }));
      // An arm that cannot be used for a BP (pacemaker side, fistula, injury)
      // is marked, with the reason, instead of a reading (owner, 2026-09-28).
      // Ticking it clears that arm's numbers; unticking clears the reason.
      const setUnable = (s, on) => setF(prev => ({ ...prev, vitals: { ...prev.vitals,
        [`${s}Unable`]: on ? 'yes' : '',
        ...(on ? { [`${s}Sys`]: '', [`${s}Dia`]: '' } : { [`${s}UnableReason`]: '' }) } }));
      const bpArm = (s, side) => {
        const unable = !!f.vitals[`${s}Unable`];
        return (
          <div key={s} className="grid grid-cols-1 sm:grid-cols-4 gap-3 items-end mb-2">
            {!unable && <VitalInput f={f} set={set} k={`${s}Sys`} label={`BP ${side} — sys`} />}
            {!unable && <VitalInput f={f} set={set} k={`${s}Dia`} label={`BP ${side} — dia`} />}
            {unable && <VitalInput f={f} set={set} k={`${s}UnableReason`} w="sm:col-span-2" label={`Why the ${side} arm can't be used`} />}
            <label className="flex items-center gap-2 text-xs sm:col-span-2 pb-2.5">
              <input type="checkbox" checked={unable} onChange={e => setUnable(s, e.target.checked)} />
              Unable to take BP in the {side} arm
            </label>
          </div>
        );
      };
      const blockTitle = (text, note) => (
