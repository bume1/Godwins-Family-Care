              </div>
            </div>
          ))}
        </div></div>
      );
    };

    // ---- D5 TIMELINE -------------------------------------------------------
    const TIMELINE_LABELS = {
      visit: 'Visits', message: 'Messages', medication: 'Medications', order: 'Orders',
      result: 'Results', referral: 'Referrals', document: 'Documents', hospitalization: 'Hospitalizations'
    };

    const TimelineTab = ({ patient }) => {
      const [data, setData] = useState(null);
      const [err, setErr] = useState('');
      const [filter, setFilter] = useState([]);
      useEffect(() => {
        if (!patient || !patient.id) return;
        let live = true;
        api.timeline(patient.id, filter).then(r => { if (live) { setData(r); setErr(''); } })
          .catch(e => { if (live) setErr(e.message); });
        return () => { live = false; };
      }, [patient && patient.id, filter.join(',')]);
      const toggle = (k) => setFilter(f => f.includes(k) ? f.filter(x => x !== k) : [...f, k]);
      if (err) return <div className="card p-4 text-sm text-red-600">{err}</div>;
      return (
        <div className="card">
          <div className="card-h"><h2><i className="ti ti-timeline mr-1 text-accent" />Timeline</h2></div>
          <div className="px-4 pt-3 flex gap-1.5 flex-wrap">
            {(data ? data.kinds : Object.keys(TIMELINE_LABELS)).map(k => (
              <button key={k}
                className={`chip border ${filter.includes(k) ? 'bg-primary text-white border-primary' : 'bg-white text-stone-600 border-stone-200'}`}
                onClick={() => toggle(k)}>{TIMELINE_LABELS[k] || k}</button>
            ))}
            {filter.length > 0 && (
              <button className="chip bg-stone-100 text-stone-600" onClick={() => setFilter([])}>Clear</button>
            )}
          </div>
          <div className="p-4">
            {!data && <p className="text-sm text-stone-500">Loading…</p>}
            {data && data.rows.length === 0 && (
              <p className="text-sm text-stone-500">
                {filter.length ? 'Nothing of that kind on this chart.' : 'Nothing on this chart yet.'}
              </p>
            )}
            {data && data.rows.map((r, i) => (
              <div key={`${r.kind}-${r.id || i}`} className="flex gap-3 py-2 border-b border-stone-100 last:border-0">
                <div className="w-[84px] shrink-0 text-[12px] text-stone-500 pt-0.5">{r.date}</div>
                <div className="w-5 shrink-0 text-accent pt-0.5"><i className={`ti ti-${r.icon}`} /></div>
                <div className="min-w-0">
                  <div className="text-[13px] font-semibold text-stone-800">{r.title}</div>
                  {r.detail && <div className="text-[11.5px] text-stone-500">{r.detail}</div>}
                </div>
              </div>
            ))}
            {/* "Nothing here" and "four things could not be placed" are
                different facts, and only one of them is a data gap. */}
            {data && data.undated > 0 && (
              <p className="text-[11.5px] text-amber-700 mt-2">
                {data.undated} {data.undated === 1 ? 'item has' : 'items have'} no usable date and could not be placed on the thread.
              </p>
            )}
            {data && data.emrNotice && <p className="text-[11.5px] text-amber-700 mt-2">{data.emrNotice}</p>}
          </div>
        </div>
      );
    };

    // ── Session 4.12 Scope I — WORK QUEUES and ANALYTICS ──────────────────
    // I2: the cross-patient destinations are work queues, not chart tabs.
    // I3: a destination with nothing in it renders an empty state SAYING SO —
    // it is never hidden, because a missing menu item is indistinguishable
    // from a broken one.
    const QueueCard = ({ title, icon, rows, empty, render }) => (
      <div className="card mb-4">
        <div className="card-h">
          <h2><i className={`ti ${icon} mr-1 text-accent`} />{title}</h2>
          {rows && <span className="chip bg-primary-50 text-primary">{rows.length}</span>}
        </div>
        <div className="p-4 text-sm">
          {!rows && <p className="text-stone-500 text-xs">Loading…</p>}
          {rows && rows.length === 0 && <p className="text-stone-500 text-[12.5px]">{empty}</p>}
          {rows && rows.map(render)}
        </div>
      </div>
    );

    const WorkQueuesView = ({ onOpenChart, onOpenEncounter }) => {
      const [data, setData] = useState(null);
      const [err, setErr] = useState('');
      useEffect(() => {
        let live = true;
        api.workQueues().then(r => { if (live) { setData(r); setErr(''); } })
          .catch(e => { if (live) setErr(e.message); });
        return () => { live = false; };
      }, []);
      if (err) return <div className="p-4 lg:p-7"><div className="card p-4 text-sm text-red-600">{err}</div></div>;
      const q = (data && data.queues) || {};
      const line = (main, sub, onClick, key) => (
        <div key={key} className="flex items-center justify-between gap-2 py-1.5 border-b border-stone-100 last:border-0">
          <div className="min-w-0">
            <div className="text-[13px] font-semibold truncate">{main}</div>
            {sub && <div className="text-[11.5px] text-stone-500">{sub}</div>}
          </div>
          {onClick && <button className="btn ghost !py-0.5 !px-2 text-[11px] shrink-0" onClick={onClick}>Open</button>}
        </div>
      );
      return (
        <div className="p-4 lg:p-7 max-w-3xl">
          <QueueCard title="Unsigned encounters" icon="ti-signature" rows={data ? q.unsignedEncounters : null}
            empty="Every documented encounter is signed. Nothing is waiting here."
            render={(r) => line(r.patientName || 'Unnamed patient',
              [r.date, r.codingStatus].filter(Boolean).join(' · '),
              () => onOpenEncounter(r.clientId, r.encounterUuid), r.encounterUuid)} />
          <QueueCard title="Results to acknowledge" icon="ti-flask" rows={data ? q.unacknowledgedResults : null}
            empty="No results are waiting to be acknowledged."
            render={(r) => line(`${r.patientName || 'Unnamed patient'} — ${r.label}`,
              [r.interpretation, r.receivedAt && fmtDate(r.receivedAt)].filter(Boolean).join(' · '),
              () => onOpenChart(r.clientId), r.id)} />
          <QueueCard title="Open referrals" icon="ti-share" rows={data ? q.openReferrals : null}
            empty="No referrals are outstanding."
            render={(r) => line(`${r.patientName || 'Unnamed patient'} — ${r.specialty || 'Referral'}`,
              [r.status, r.orderReference, r.createdAt && fmtDate(r.createdAt)].filter(Boolean).join(' · '),
              () => onOpenChart(r.clientId), r.id)} />
          <QueueCard title="Overdue orders" icon="ti-clock-exclamation" rows={data ? q.overdueOrders : null}
            empty="Nothing is overdue."
            render={(r) => line(`${r.patientName || 'Unnamed patient'} — ${r.orderType || 'Order'}`,
              [r.daysOverdue != null ? `${r.daysOverdue} days overdue` : null,
                r.recipient, r.faxNumber].filter(Boolean).join(' · '),
              () => onOpenChart(r.clientId), r.id)} />
          {data && data.overdueThresholds && (
            <p className="text-[11.5px] text-stone-400">
              Overdue after {Object.entries(data.overdueThresholds).map(([k, v]) => `${k} ${v}d`).join(' · ')}.
            </p>
          )}
        </div>
      );
    };

    const Metric = ({ label, value, sub, unavailable, reason }) => (
      <div className="card p-4">
        <div className="lblu">{label}</div>
        {unavailable
          ? <div className="text-[12.5px] text-amber-700 mt-1">Not available — {String(reason || '').replace(/_/g, ' ')}</div>
          : <div className="serif text-2xl text-primary font-semibold mt-0.5">{value == null ? '—' : value}</div>}
        {!unavailable && sub && <div className="text-[11.5px] text-stone-500">{sub}</div>}
      </div>
    );

    const AnalyticsView = () => {
      const [data, setData] = useState(null);
      const [err, setErr] = useState('');
      useEffect(() => {
        let live = true;
        api.analytics().then(r => { if (live) { setData(r); setErr(''); } })
          .catch(e => { if (live) setErr(e.message); });
        return () => { live = false; };
      }, []);
      if (err) return <div className="p-4 lg:p-7"><div className="card p-4 text-sm text-red-600">{err}</div></div>;
      if (!data) return <div className="p-4 lg:p-7 text-sm text-stone-500">Loading…</div>;
      const m = data.metrics;
      const weeks = m.visitsPerWeek || [];
      const peak = Math.max(1, ...weeks.map(w => w.total));
      return (
        <div className="p-4 lg:p-7 max-w-3xl">
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 mb-4">
            <Metric label="Average visit length"
              value={m.averageVisitMinutes.value == null ? null : `${m.averageVisitMinutes.value} min`}
              sub={`from ${m.averageVisitMinutes.sampleSize} finished ${m.averageVisitMinutes.sampleSize === 1 ? 'visit' : 'visits'}`} />
            <Metric label="Unsigned notes" value={m.unsignedNotesAgeing.count}
              sub={m.unsignedNotesAgeing.oldestDays != null ? `oldest ${m.unsignedNotesAgeing.oldestDays} days` : null} />
            <Metric label="Open orders" value={m.openOrdersAgeing.count}
              sub={m.openOrdersAgeing.oldestDays != null ? `oldest ${m.openOrdersAgeing.oldestDays} days` : null} />
            {/* Two metrics this app cannot observe yet. Reported as unavailable
                with the reason rather than as a zero somebody would read as
                "nobody drove anywhere" or "no screenings are done". */}
            <Metric label="Miles driven" unavailable={m.milesDriven.unavailable} reason={m.milesDriven.reason} />
            <Metric label="Screening completion"
              unavailable={m.screeningCompletionRate.unavailable} reason={m.screeningCompletionRate.reason} />
          </div>
          <div className="card">
            <div className="card-h"><h2><i className="ti ti-chart-bar mr-1 text-accent" />Visits per week</h2></div>
            <div className="p-4">
              {weeks.length === 0 && <p className="text-[12.5px] text-stone-500">No documented visits in the last eight weeks.</p>}
              {weeks.map(w => (
                <div key={w.week} className="flex items-center gap-2 py-1">
                  <span className="text-[11.5px] text-stone-500 w-[84px] shrink-0">{w.week}</span>
                  <div className="flex-1 bg-stone-100 rounded h-3 overflow-hidden">
                    <div className="bg-accent h-3" style={{ width: `${Math.round((w.total / peak) * 100)}%` }} />
                  </div>
                  <span className="text-[11.5px] text-stone-700 w-6 text-right">{w.total}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // ── Session 4.12 Scope B — the day, plotted (B2/B3) ───────────────────
    // NO MAP TILES, DELIBERATELY. A tile provider would receive the coordinates
    // of every patient's home on every render — a disclosure of where people
    // live to a third party with no BAA — and for the question this screen
    // answers ("in what order should I see these people") a street map adds
    // nothing a relative plot does not. The brief's own sketch is dots joined
    // by lines. Everything here is drawn from coordinates the app already
    // holds, and nothing leaves the boundary.
    const DayMap = ({ plot }) => {
      // SERVED, not computed here. The module that places a stop reaches into
      // the scheduling module for the one coordinate reader, and that chain
      // does not load in a page — so the page renders the server's answer and
      // decides no geometry of its own.
      if (!plot || !plot.points || !plot.points.length) {
        return (
          <div className="p-4 text-[12.5px] text-amber-700">
            None of today's visits has address coordinates, so there is nothing to plot.
            An admin sets them under Scheduling → Locations.
          </div>
        );
      }
      return (
        <div className="p-4">
          <svg viewBox="0 0 100 100" className="w-full max-w-md mx-auto block" style={{ aspectRatio: '1 / 1' }}
            role="img" aria-label="Today's stops, plotted by relative position">
            {plot.points.slice(0, -1).map((p, i) => {
              const n = plot.points[i + 1];
              return <line key={`l${p.eid}`} x1={p.x} y1={p.y} x2={n.x} y2={n.y}
                stroke="#C9A44A" strokeWidth="0.8" strokeDasharray="2 1.5" />;
            })}
            {plot.points.map(p => (
              <g key={p.eid}>
                <circle cx={p.x} cy={p.y} r="3.2" fill="#033D50" />
                <text x={p.x} y={p.y + 1.1} textAnchor="middle" fill="#fff"
                  style={{ fontSize: '3px', fontWeight: 700 }}>{p.order}</text>
                <text x={p.x} y={p.y - 4.6} textAnchor="middle" fill="#2b2b28"
                  style={{ fontSize: '3.2px' }}>{p.label}</text>
              </g>
            ))}
          </svg>
          <p className="text-[11px] text-stone-400 text-center mt-2">
            Relative positions only — north is up. Not a street map, and no coordinates leave this app.
          </p>
          {plot.unplaceable > 0 && (
            <p className="text-[11.5px] text-amber-700 text-center mt-1">
              {plot.unplaceable} {plot.unplaceable === 1 ? 'stop has' : 'stops have'} no coordinates and could not be plotted.
            </p>
          )}
        </div>
      );
    };

    // B5 — who else lives near this address and is due to be seen. A house call
    // is mostly driving, so a trip that fills two slots instead of one is the
    // biggest lever there is on a day.
    const NearbyDue = ({ clientId, onOpenChart }) => {
      const [data, setData] = useState(null);
      const [err, setErr] = useState('');
      const [radius, setRadius] = useState(10);
      useEffect(() => {
        if (!clientId) return;
        let live = true;
        api.nearby(clientId, radius).then(r => { if (live) { setData(r); setErr(''); } })
          .catch(e => { if (live) setErr(e.message); });
        return () => { live = false; };
      }, [clientId, radius]);
      if (err) return <p className="text-[12px] text-red-600">{err}</p>;
      if (!data) return <p className="text-[12px] text-stone-500">Looking…</p>;
      if (data.notice) return <p className="text-[12px] text-amber-700">{data.notice}</p>;
      return (
        <div>
          <div className="flex items-center gap-2 mb-2">
            <span className="lblu">Within</span>
            <select className="inp !w-auto !py-0.5 text-[11.5px]" value={radius} onChange={e => setRadius(Number(e.target.value))}>
              {[5, 10, 15, 25].map(r => <option key={r} value={r}>{r} miles</option>)}
            </select>
            <span className="text-[11px] text-stone-400">straight line</span>
          </div>
          {data.nearby.length === 0
            ? <p className="text-[12px] text-stone-500">
              Nobody else within {data.radiusMiles} miles is due to be seen.
            </p>
            : data.nearby.map(n => (
              <div key={n.clientId} className="flex items-center justify-between gap-2 py-1.5 border-b border-stone-100 last:border-0">
                <div className="min-w-0">
                  <div className="text-[13px] font-semibold truncate">{n.name}</div>
                  <div className="text-[11.5px] text-stone-500">
                    {[`${n.miles} mi`,
                      n.reason === 'never_seen' ? 'never seen' : `last seen ${n.lastVisitAt} (${n.daysSinceLastVisit}d)`,
                      n.address].filter(Boolean).join(' · ')}
                  </div>
                </div>
                <button className="btn ghost !py-0.5 !px-2 text-[11px] shrink-0" onClick={() => onOpenChart(n.clientId)}>Open</button>
              </div>
            ))}
          <p className="text-[11px] text-stone-400 mt-2">
            "Due" means no visit on file, or none in the last {data.dueAfterDays} days.
          </p>
        </div>
      );
    };

    // ── Session 4.12 — MY DAY (Scope A) ────────────────────────────────────
    // The default landing screen. A house-call clinician does not start the day
    // by looking up a patient; they start it by looking at the day. Every row
    // carries what you read in the car: who, when, where, how to get in, and
    // who will be there.
    const VISIT_STATE_STYLE = {
      scheduled: 'bg-stone-100 text-stone-600',
      en_route: 'bg-sky-100 text-sky-800',
      arrived: 'bg-amber-100 text-amber-800',
      in_progress: 'bg-emerald-100 text-emerald-800',
      signed: 'bg-primary text-white',
      cancelled: 'bg-stone-200 text-stone-500',
      no_show: 'bg-red-100 text-red-700'
    };

    // NAVIGATE hands off to the device's own map app rather than drawing a map
    // in a browser tab: the clinician is about to drive, and the phone's map has
    // their traffic, their voice guidance and their car.
    const navigateHref = (address) =>
      `https://maps.google.com/?q=${encodeURIComponent(String(address || ''))}`;

    const DayDistance = ({ distance }) => {
      const d = distance || {};
      if (d.reason === 'first_stop') return <span className="text-[11.5px] text-stone-400">First stop</span>;
      if (d.reason === 'no_coordinates') {
        return <span className="text-[11.5px] text-amber-700">No address coordinates — distance cannot be shown</span>;
      }
      if (typeof d.miles !== 'number') return null;
      // LABELLED as straight-line, deliberately. A 3-mile straight line across a
      // river is a 20-minute drive, and a clinician planning a day around a
      // number called "drive time" that is really a crow's flight will be late.
      return <span className="text-[11.5px] text-stone-500">{d.miles} mi in a straight line from the last stop</span>;
    };

    const DayVisitRow = ({ v, onOpenChart, onPacket, onStamp, busy, canWrite }) => (
      <div className={`border-b border-stone-100 py-3 ${v.state === 'cancelled' ? 'opacity-50' : ''}`}>
        <div className="flex items-start gap-3">
          <div className="w-[68px] shrink-0 text-right">
            <div className="text-[13.5px] font-bold text-primary">{v.time || '—'}</div>
            {v.endTime && <div className="text-[10.5px] text-stone-400">to {v.endTime}</div>}
          </div>
          <div className="min-w-0 flex-1">
            <div className="flex items-center gap-2 flex-wrap">
              <span className="font-semibold text-[14px] text-stone-800">{v.patientName || 'Unnamed patient'}</span>
              <span className={`chip ${VISIT_STATE_STYLE[v.state] || 'bg-stone-100 text-stone-600'}`}>
                {(v.state || '').replace(/_/g, ' ').toUpperCase()}
              </span>
            </div>
            <div className="text-[12px] text-stone-600">
              {[v.visitType, v.serviceLine].filter(Boolean).join(' • ')}
            </div>
            {v.address && <div className="text-[12px] text-stone-500 mt-0.5">{v.address}</div>}
            <div className="mt-0.5"><DayDistance distance={v.distance} /></div>
            {/* A2 — access notes and who will be there. From the PATIENT record,
                so they are here for whoever covers, not just whoever entered
                them. This is what you read before getting out of the car. */}
            {v.homeVisit && v.homeVisit.length > 0 && (
              <div className="mt-2 bg-cream border border-creamdeep rounded-lg px-3 py-2 space-y-1">
                {v.homeVisit.map(h => (
                  <div key={h.key} className="text-[12px] text-stone-700">
                    <span className="lblu mr-1.5">{h.label}</span>{h.value}
                  </div>
                ))}
              </div>
            )}
            {v.timing && (v.timing.arrivedAt || v.timing.startedAt) && (
              <div className="text-[11px] text-stone-500 mt-1">
                {v.timing.arrivedAt && <>Arrived {fmtTs(v.timing.arrivedAt)}. </>}
                {v.timing.startedAt && <>Started {fmtTs(v.timing.startedAt)}. </>}
                {v.timing.totalMinutes != null && <b>{v.timing.totalMinutes} min total.</b>}
              </div>
            )}
            <div className="flex gap-2 mt-2 flex-wrap">
              {v.address && (
                <a className="btn ghost !py-1 !px-2.5 text-[11.5px]" href={navigateHref(v.address)}
                  target="_blank" rel="noopener noreferrer"><i className="ti ti-navigation" />Navigate</a>
              )}
              <button className="btn ghost !py-1 !px-2.5 text-[11.5px]" onClick={() => onPacket(v)}>
                <i className="ti ti-file-description" />Pre-visit
              </button>
              <button className="btn ghost !py-1 !px-2.5 text-[11.5px]" onClick={() => onOpenChart(v.clientId)}>
                <i className="ti ti-folder-open" />Open chart
              </button>
              {canWrite && v.state === 'scheduled' && (
                <button className="btn ghost !py-1 !px-2.5 text-[11.5px]" disabled={busy === v.eid}
                  onClick={() => onStamp(v, 'en_route')}><i className="ti ti-car" />En route</button>
              )}
              {canWrite && ['scheduled', 'en_route'].includes(v.state) && (
                <button className="btn gold !py-1 !px-2.5 text-[11.5px]" disabled={busy === v.eid}
                  onClick={() => onStamp(v, 'arrive')}><i className="ti ti-door-enter" />Arrive</button>
              )}

    const MyDayView = ({ user, onOpenChart }) => {

      const longDate = new Date(`${date}T12:00:00Z`).toLocaleDateString('en-US',

            {day && day.calendar && !day.calendar.ok && (

                    <p className="text-[12px] text-stone-500 mb-2">{proposal.proposal.caveat}</p>
                    {proposal.proposal.unchanged
                      ? <p className="text-[13px] text-stone-700">The day is already in proximity order.</p>
                      : proposal.proposal.order.map((o, i) => (
                        <div key={o.eid} className="text-[13px] py-1 border-b border-stone-100 last:border-0">
                          <b>{i + 1}.</b> {o.patientName} <span className="text-stone-500">({o.fromTime} → {o.toTime})</span>
                        </div>
                      ))}
                    {/* NEVER auto-applied. Accepting rebooks through the
                        appointment routes so the patient is told. */}
                    <p className="text-[11.5px] text-amber-700 mt-3">
                      Nothing has changed yet. Accepting this rebooks each visit through the normal reschedule
                      route, which emails the patient. Accepting is not built in this pass — the order above is a
                      proposal to work from.
                    </p>
                  </>
                )}
              </div>
            </div>
          )}
        </div>
      );
    };

    const SummaryTab = ({ chart, patient, onLink, linking, linkCandidates, onDismissCandidates, isAdmin, onChartChanged }) => {
      const canWrite = useCanWrite();
      const [showLinkExisting, setShowLinkExisting] = useState(false);

      return (
        <div>
          {!chart.linked && !canWrite && (
            <div className="card p-4 mb-4"><div className="font-semibold text-sm text-primary">Not linked to OpenEMR yet</div><div className="text-xs text-stone-500">A clinician links this chart at the first visit.</div></div>
          )}
          {!chart.linked && canWrite && (
            <div className="card p-4 mb-4">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div>

                  <div className="text-xs text-stone-500">Create the OpenEMR patient record from the app demographics, or link a chart that already exists in the EMR.</div>
                </div>

                      </div>

                    </button>
                    <button className="btn ghost text-xs" disabled={linking} onClick={onDismissCandidates}>Cancel</button>
                  </div>
                </div>
              )}
              {/* Link an EXISTING EMR chart — the path for patients already in
                  OpenEMR (legacy records, or a chart created directly there).
                  Prevents a duplicate chart for the same person. */}
              <div className="border-t border-stone-100 mt-3 pt-3">
                {!showLinkExisting ? (
                  <button className="text-xs text-primary underline" onClick={() => setShowLinkExisting(true)}>

                    <button className="btn ghost" onClick={() => { setShowLinkExisting(false); setExistingId(''); }}>Cancel</button>
                    <p className="text-[11px] text-stone-400 w-full">Find the UUID in OpenEMR on the patient's record (or ask an admin). The link is verified against the EMR before it is saved.</p>

          {chart.linked && <PlaceOfServiceCard patient={patient} />}
          {/* Session 4.12 Scope D — OVERVIEW is the at-a-glance. The problem

              their OWN place on the tab bar now, so nothing here is the
              authoritative copy and nothing is rendered twice. */}
          <div className="grid md:grid-cols-2 gap-0 md:gap-4">
            <div>

            </div>

              <ChartSection title="Encounters" icon="ti-stethoscope" data={emr.encounters} linked={chart.linked}
                render={(r, i) => chartRow(r.type, [r.provider, r.start && fmtTs(r.start)].filter(Boolean).join(' · '), r.status, i)} />
              <ChartSection title="Vitals (recent)" icon="ti-heart-rate-monitor" data={emr.vitals} linked={chart.linked}
                render={(r, i) => chartRow(r.name, r.at && fmtTs(r.at), r.value, i)} />

      );
    };

    // ── H&P documentation tab (intake spec §2C) ──
    // appointmentEid (4.2): set when the visit is opened from a calendar
    // appointment — the resulting Encounter links back to it.
    // These live at MODULE scope on purpose. A component declared inside
    // another component's body is a NEW function identity on every render, so
    // React tears down its subtree and builds a fresh one — destroying the
    // <input> DOM node and the caret with it. The symptom is a field that
    // accepts exactly one character and then stops. Keep them out here.
    const VitalInput = ({ k, label, w, f, set }) => (
      <Field label={label} className={w || ''}>
        <input className="inp" value={f.vitals[k]} onChange={e => set(`vitals.${k}`, e.target.value)} />
      </Field>
    );
    // ── Dictation (Scope F5), and the one option deliberately NOT taken ────
    // The browser's Web Speech API is not wired and must not be. In Chrome its
    // implementation streams the audio to Google's servers, which would put a
    // clinician dictating an assessment about a named patient outside the BAA —
    // a PHI disclosure with no agreement behind it, from a feature that looks
    // free.
    //
    // What works today needs no code and no vendor at all: the DEVICE
    // KEYBOARD's own microphone dictates into any ordinary textarea, and on iOS
    // it is on-device for supported languages. So every narrative field stays a
    // plain textarea — `speech` and `dictation` attributes left alone — and the
    // form simply says so, once, rather than shipping a button that would send
    // a patient's history to a third party.
    //
    // When Amazon Transcribe Medical is available inside the AWS boundary it
    // slots in behind an IAM role with zero data retention confirmed, the same
    // way §10.3 governs Bedrock. That is a configuration, not a rewrite.
    const DictationHint = () => (
      <p className="text-[11px] text-stone-400 mb-2">
        <i className="ti ti-microphone mr-1" />
        To dictate, use the microphone on your phone or tablet keyboard — it types straight into any box here.
      </p>
    );

    const TextArea = ({ path, label, rows, f, set }) => (
      <Field label={label}>
        <textarea className="inp" rows={rows || 2} value={path.split('.').reduce((o, k) => o[k], f)} onChange={e => set(path, e.target.value)} />
      </Field>
    );
    const HpTab = ({ patient, chart, appointmentEid, onDone, onGoToEncounter }) => {
      const pf = (chart && chart.intakePrefill) || {};
      const [confirmed, setConfirmed] = useState([]);
      const confirm = (k) => setConfirmed(c => c.includes(k) ? c : [...c, k]);
      const [f, setF] = useState({
        chiefConcern: pf.chiefConcern || '',
        subjective: '', assessment: '', plan: '',
        vitals: { bpRightSys: '', bpRightDia: '', bpLeftSys: '', bpLeftDia: '', hr: '', temp: '', rr: '', spo2: '', weight: '', height: '' },
        systemsExam: { general: '', cardiovascular: '', respiratory: '', lungSounds: '', neuro: '', gi: '', gu: '', musculoskeletal: '' },
        // Scope G — the exam variant, not a different note. Held in state on
        // every visit and RENDERED only on a psychiatric one, so a patient
        // whose type is set mid-visit does not lose what was already typed.
        mentalStatusExam: { appearance: '', behavior: '', speech: '', mood: '', affect: '', thoughtProcess: '', thoughtContent: '', perception: '', cognition: '', insight: '', judgment: '' },
        skinWound: { findings: '', woundPresent: 'no', woundLocation: '', woundMeasurements: '' },
        painAssessment: { breathing: '', negativeVocalization: '', facialExpression: '', bodyLanguage: '', consolability: '', totalScore: '' },
        homeHazards: { smokeDetectors: '', coDetectors: '', grabBars: '', nonSkidSurfaces: '', runningWater: '', secondaryExit: '', notes: '' },
        triage: { track: '', rationale: '' }
      });
      const set = (path, v) => setF(prev => {
        const [a, b] = path.split('.');
        if (!b) return { ...prev, [a]: v };
        return { ...prev, [a]: { ...prev[a], [b]: v } };
      });
      const [busy, setBusy] = useState(false); const [msg, setMsg] = useState(null);
      const [draftAt, setDraftAt] = useState(null);
      const [restored, setRestored] = useState(false);
      // Resume YOUR OWN half-written note. Drafts are per clinician, so an
      // on-site assessment and a virtual one of the same patient on the same
      // day never overwrite each other.
      useEffect(() => {
        let live = true;
        api.getDraft(patient.id).then(r => {
          if (!live || !r || !r.draft) return;
          const d = r.draft;
          setF(prev => ({
            ...prev, ...d,
            vitals: { ...prev.vitals, ...(d.vitals || {}) },
            systemsExam: { ...prev.systemsExam, ...(d.systemsExam || {}) },
            mentalStatusExam: { ...prev.mentalStatusExam, ...(d.mentalStatusExam || {}) },
            skinWound: { ...prev.skinWound, ...(d.skinWound || {}) },
            painAssessment: { ...prev.painAssessment, ...(d.painAssessment || {}) },
            homeHazards: { ...prev.homeHazards, ...(d.homeHazards || {}) },
            triage: { ...prev.triage, ...(d.triage || {}) }
          }));
          if (Array.isArray(d.confirmedFields)) setConfirmed(d.confirmedFields);
          setDraftAt(r.updatedAt || null); setRestored(true);
        }).catch(() => { /* no draft is the normal case, never an error on screen */ });
        return () => { live = false; };
      }, [patient.id]);

      // ── What kind of visit is this? (owner, 2026-09-23) ──────────────────
      // The FIRST thing a clinician chooses, because it decides which note
      // they are about to write. Not a property of the patient: somebody who
      // normally has a primary-care visit can have a psych evaluation, and the
      // note has to follow the visit rather than the chart.
      const [visit, setVisit] = useState({ appointmentType: '', modality: 'in_person', location: '' });
      const [catalog, setCatalog] = useState(null);
      useEffect(() => {
        let live = true;
        api.placeOfService(patient.id)
          .then(d => {
            if (!live) return;
            setCatalog(d);
            // The patient's usual location is a DEFAULT the clinician
            // confirms. Pre-filled, never locked.
            if (d.usualLocation) setVisit(v => v.location ? v : { ...v, location: d.usualLocation });
          })
          .catch(() => { /* the picker still works; it just has no default */ });
        return () => { live = false; };
      }, [patient.id]);
      const noteSections = useMemo(() => {
        if (!catalog || !visit.appointmentType) return [];
        const type = (catalog.appointmentTypes || []).find(t => t.key === visit.appointmentType);
        if (!type) return [];
        // The SERVER holds the templates; this only asks which sections this
        // visit carries. Restating a template here would drift from the gate
        // that refuses the signature.
        return (catalog.noteTemplates && catalog.noteTemplates[visit.appointmentType]
          ? catalog.noteTemplates[visit.appointmentType]
          : []).filter(sec => sec.modality == null || sec.modality === visit.modality);
      }, [catalog, visit.appointmentType, visit.modality]);
      const noteHasSection = (key) => noteSections.some(s => s.key === key);
      const visitType = catalog && (catalog.appointmentTypes || []).find(t => t.key === visit.appointmentType);

      const saveDraft = () => {
        setBusy('draft'); setMsg(null);
        api.saveDraft(patient.id, { ...f, confirmedFields: confirmed, appointmentEid: appointmentEid || undefined })
          .then(r => { setDraftAt(r.updatedAt); setMsg({ ok: true, text: 'Draft saved. Nothing is in the chart yet — you can close this and pick it up later.' }); })
          .catch(e => setMsg({ ok: false, text: e.message }))
          .finally(() => setBusy(false));
      };

      const discardDraft = () => {
        setBusy('discard'); setMsg(null);
        api.discardDraft(patient.id)
          .then(() => { setDraftAt(null); setRestored(false); setMsg({ ok: true, text: 'Draft discarded. What is on screen is still here until you leave the page.' }); })
          .catch(e => setMsg({ ok: false, text: e.message }))
          .finally(() => setBusy(false));
      };

      // Filing writes the Encounter, the vitals row and the note to OpenEMR.
      // It does NOT sign: an attestation needs diagnoses and service codes,
      // which are captured on the encounter, not here. Saying otherwise on the
      // button would tell a clinician they had signed when they had not.
      const file = (thenGo) => {
        setBusy(thenGo ? 'file-go' : 'file'); setMsg(null);
        api.visit(patient.id, { ...f, confirmedFields: confirmed, appointmentEid: appointmentEid || undefined })
          .then(r => {
            setDraftAt(null); setRestored(false);
            setMsg({ ok: true, text: `${r.message} (${fmtTs(r.at)}). The note is in the chart but NOT signed yet — add diagnoses and service codes on the encounter, then sign.` });
            onDone && onDone();
            if (thenGo && r.encounterUuid && onGoToEncounter) onGoToEncounter(r.encounterUuid);
          })
          .catch(e => setMsg({ ok: false, text: e.message }))
          .finally(() => setBusy(false));
      };
      const painFields = ['breathing', 'negativeVocalization', 'facialExpression', 'bodyLanguage', 'consolability'];
      const hazardFields = [['smokeDetectors', 'Smoke detectors'], ['coDetectors', 'CO detectors'], ['grabBars', 'Grab bars'], ['nonSkidSurfaces', 'Non-skid surfaces'], ['runningWater', 'Running water'], ['secondaryExit', 'Secondary exit']];
      return (
        <div className="max-w-3xl">
          {appointmentEid && (
            <div className="card p-3 mb-4 flex items-center gap-2 text-sm text-primary">
              <i className="ti ti-calendar-check text-accent" />
              Documenting from a scheduled appointment — the Encounter will be linked to it on the chart.
            </div>
          )}
          {/* FIRST, because it decides everything below it. */}
          <div className="card mb-4">
            <div className="card-h">
              <h2><i className="ti ti-clipboard-list mr-1 text-accent" />What kind of visit is this?</h2>
              {visitType && <span className="chip bg-primary-50 text-primary">{visitType.defaultMinutes} min</span>}
            </div>
            <div className="p-4 grid md:grid-cols-3 gap-3 text-sm">
              <Field label="Appointment type">
                <select className="inp" value={visit.appointmentType} onChange={e => setVisit(v => ({ ...v, appointmentType: e.target.value }))}>
                  <option value="">— choose —</option>
                  {(catalog ? catalog.services : []).map(svc => (
                    <optgroup key={svc.key} label={svc.label}>
                      {(catalog.appointmentTypes || []).filter(t => t.service === svc.key).map(t => (
                        <option key={t.key} value={t.key}>{t.label}</option>
                      ))}
                    </optgroup>
                  ))}
                </select>
              </Field>
              <Field label="Modality">
                <select className="inp" value={visit.modality} onChange={e => setVisit(v => ({ ...v, modality: e.target.value }))}>
                  {(catalog ? catalog.modalities : []).map(m => (
                    <option key={m.key} value={m.key}
                      disabled={m.key === 'telehealth' && visitType && !visitType.telehealthAllowed}>{m.label}</option>
                  ))}
                </select>
              </Field>
              <Field label="Location">
                <select className="inp" value={visit.location} onChange={e => setVisit(v => ({ ...v, location: e.target.value }))}>
                  <option value="">— choose —</option>
                  {(catalog ? catalog.locations : []).map(l => <option key={l.key} value={l.key}>{l.label}</option>)}
                </select>
              </Field>
            </div>
            <div className="px-4 pb-4 text-[11px] text-stone-500 grid gap-1">
              {!visit.appointmentType && <span>Choose a type and the note below will ask for what that visit needs.</span>}
              {catalog && catalog.usualLocation && visit.location === catalog.usualLocation &&
                <span>Location pre-filled from this patient's usual one. Change it if today is different.</span>}
              {visit.modality === 'telehealth' && visitType && visitType.telehealthPayerCaveat &&
                <span className="text-amber-700"><i className="ti ti-alert-triangle mr-1" />
                  Telehealth for this visit type depends on current CMS flexibilities. Confirm with the payer before billing.</span>}
              {visit.modality === 'telehealth' &&
                <span>Vitals and exam findings recorded on a video visit are marked as patient-reported.</span>}
            </div>
          </div>

          <div className="card mb-4">
            <div className="card-h"><h2>{visitType ? visitType.label : 'Visit'} · Note</h2></div>
            <div className="p-4 grid gap-4">
              <Prefilled fieldKey="chiefConcern" confirmed={confirmed} onConfirm={confirm}>
                <TextArea f={f} set={set} path="chiefConcern" label="Chief concern" />
              </Prefilled>
              {(pf.conditions || []).length > 0 && (
                <Prefilled fieldKey="conditions" confirmed={confirmed} onConfirm={confirm}>
                  <span className="lblu block mb-1">Family-reported conditions (intake)</span>
                  <div className="flex flex-wrap gap-1.5">{pf.conditions.map((c, i) => <span key={i} className="chip bg-primary-50 text-primary">{c}</span>)}</div>
                </Prefilled>
              )}
              <DictationHint />
              <TextArea f={f} set={set} path="subjective" label="Subjective / history" rows={3} />
            </div>
          </div>

          <div className="card mb-4">
            <div className="card-h"><h2>Vitals</h2><span className="text-[10.5px] text-stone-500">BP required in both arms (§2C)</span></div>
            <div className="p-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
              <VitalInput f={f} set={set} k="bpRightSys" label="BP right — sys" /><VitalInput f={f} set={set} k="bpRightDia" label="BP right — dia" />
              <VitalInput f={f} set={set} k="bpLeftSys" label="BP left — sys" /><VitalInput f={f} set={set} k="bpLeftDia" label="BP left — dia" />
              <VitalInput f={f} set={set} k="hr" label="Heart rate" /><VitalInput f={f} set={set} k="temp" label="Temp (°F)" /><VitalInput f={f} set={set} k="rr" label="Resp rate" /><VitalInput f={f} set={set} k="spo2" label="SpO₂ (%)" />
              <VitalInput f={f} set={set} k="weight" label="Weight (lb)" /><VitalInput f={f} set={set} k="height" label="Height (in)" />
            </div>
          </div>

          <div className="card mb-4">
            <div className="card-h"><h2>Systems exam</h2></div>
            <div className="p-4 grid md:grid-cols-2 gap-3">
              {Object.keys(f.systemsExam).map(k => (
                <TextArea f={f} set={set} key={k} path={`systemsExam.${k}`} label={k === 'lungSounds' ? 'Lung sounds' : k.charAt(0).toUpperCase() + k.slice(1)} />
              ))}
            </div>
          </div>

          {/* Offered where the encounter type says the visit is psychiatric,
              and nowhere else. An empty MSE on every note trains people to
              scroll past the section that matters. The SERVER answers whether
              this patient is psychiatric — the page never reads a label and
              decides for itself. */}
          {/* The MSE follows THIS VISIT's appointment type, not the patient's
              usual one. A patient who normally has a primary-care visit can
              have a psych evaluation, and the note has to follow the visit. */}
          {noteHasSection('mentalStatusExam') && (
            <div className="card mb-4">
              <div className="card-h"><h2>Mental status exam</h2>
                <span className="text-[10.5px] text-stone-500">the exam for this visit — the systems exam above still applies</span>
              </div>
              <div className="p-4 grid md:grid-cols-2 gap-3">
                {Object.keys(f.mentalStatusExam).map(k => (
                  <TextArea f={f} set={set} key={k} path={`mentalStatusExam.${k}`} label={k.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase())} />
                ))}
              </div>
            </div>
          )}

          <div className="card mb-4">
            <div className="card-h"><h2>Skin &amp; wound</h2></div>
            <div className="p-4 grid gap-3">
              <TextArea f={f} set={set} path="skinWound.findings" label="Skin findings" />
              <Field label="Wound present?">
                <select className="inp" value={f.skinWound.woundPresent} onChange={e => set('skinWound.woundPresent', e.target.value)}>
                  <option value="no">No</option><option value="yes">Yes</option>
                </select>
              </Field>
              {f.skinWound.woundPresent === 'yes' && (
                <div className="grid md:grid-cols-2 gap-3">
                  <TextArea f={f} set={set} path="skinWound.woundLocation" label="Location" />
                  <TextArea f={f} set={set} path="skinWound.woundMeasurements" label="Measurements (L × W × D cm)" />
                </div>
              )}
            </div>
          </div>

          <div className="card mb-4">
            <div className="card-h"><h2>Pain assessment (PAINAD-style)</h2><span className="text-[10.5px] text-stone-500">0–2 each</span></div>
            <div className="p-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
              {painFields.map(k => (
                <Field key={k} label={k.replace(/([A-Z])/g, ' $1')}>
                  <select className="inp" value={f.painAssessment[k]} onChange={e => set(`painAssessment.${k}`, e.target.value)}>
                    <option value="">—</option><option>0</option><option>1</option><option>2</option>
                  </select>
                </Field>
              ))}
              <Field label="Total score">
                <input className="inp" readOnly value={painFields.reduce((s, k) => s + (parseInt(f.painAssessment[k], 10) || 0), 0)} />
              </Field>
            </div>
          </div>

          <div className="card mb-4">
            <div className="card-h"><h2>Home-hazard inventory</h2></div>
            <div className="p-4">
              {(pf.homeSafetyFlags || []).length > 0 && (
                <Prefilled fieldKey="homeSafetyFlags" confirmed={confirmed} onConfirm={confirm}>
                  <span className="lblu block mb-1">Intake staff-safety flags</span>
                  <div className="flex flex-wrap gap-1.5">{pf.homeSafetyFlags.map((c, i) => <span key={i} className="chip bg-amber-50 text-amber-800">{c}</span>)}</div>
                </Prefilled>
              )}
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 mt-3">
                {hazardFields.map(([k, label]) => (
                  <Field key={k} label={label}>
                    <select className="inp" value={f.homeHazards[k]} onChange={e => set(`homeHazards.${k}`, e.target.value)}>
                      <option value="">—</option><option value="present_working">Present / working</option>
                      <option value="present_not_working">Present, not working</option><option value="absent">Absent</option>
                      <option value="na">N/A</option>
                    </select>
                  </Field>
                ))}
              </div>
              <div className="mt-3"><TextArea f={f} set={set} path="homeHazards.notes" label="Hazard notes" /></div>
            </div>
          </div>

          <div className="card mb-4">
            <div className="card-h"><h2>Assessment, plan &amp; RN triage</h2></div>
            <div className="p-4 grid gap-3">
              <TextArea f={f} set={set} path="assessment" label="Assessment" rows={3} />
              <TextArea f={f} set={set} path="plan" label="Plan" rows={3} />
              <div className="grid md:grid-cols-2 gap-3">
                <Field label="Track assignment (RN triage)">
                  <select className="inp" value={f.triage.track} onChange={e => set('triage.track', e.target.value)}>
                    <option value="">— keep current ({patient.careTier || 'unset'})</option>
                    <option value="A1">A1 — Essential ADL</option><option value="A2">A2 — Comprehensive ADL &amp; IADL</option>
                    <option value="A3">A3 — IADL-Forward Support</option><option value="A4">A4 — Behavioral &amp; Cognitive</option>
                    <option value="B">B — Skilled Nursing</option>
                  </select>
                </Field>
                <TextArea f={f} set={set} path="triage.rationale" label="Triage rationale" />
              </div>
            </div>
          </div>

          {msg && <p className={`text-sm mb-3 ${msg.ok ? 'text-emerald-700' : 'text-red-600'}`}>{msg.text}</p>}
          <div className="card p-3 mb-3">
            <div className="flex flex-wrap items-center gap-2">
              <button className="btn ghost" disabled={!!busy} onClick={saveDraft}>
                <i className="ti ti-device-floppy" />{busy === 'draft' ? 'Saving…' : 'Save draft'}
              </button>
              <button className="btn" disabled={!!busy} onClick={() => file(false)}>
                <i className="ti ti-file-check" />{busy === 'file' ? 'Filing to OpenEMR…' : 'Save & file note to chart'}
              </button>
              <button className="btn gold" disabled={!!busy} onClick={() => file(true)}>
                <i className="ti ti-writing-sign" />{busy === 'file-go' ? 'Filing to OpenEMR…' : 'File note & go to coding / sign'}
              </button>
              {draftAt && (
                <button className="btn ghost text-red-600" disabled={!!busy} onClick={discardDraft}>
                  {busy === 'discard' ? 'Discarding…' : 'Discard draft'}
                </button>
              )}
            </div>
            <p className="text-[11px] text-stone-500 mt-2">
              <b>Save draft</b> keeps this note on the server and writes nothing to the chart — safe to leave and come back.
              <b> Save &amp; file</b> writes the Encounter, vitals and note into OpenEMR; the note is documented but <b>not signed</b>.
              <b> File &amp; go to coding</b> does the same and takes you to the encounter, where diagnoses and service codes are added and the note is signed.
            </p>
            {draftAt && <p className="text-[11px] text-stone-400 mt-1">Draft last saved {fmtTs(draftAt)}{restored ? ' · restored into this form' : ''}.</p>}
          </div>
        </div>
      );
    };

    // ── Medication reconciliation tab ──
    const MedRecTab = ({ patient }) => {
      const canWrite = useCanWrite();
      const [data, setData] = useState(null);
      const [decisions, setDecisions] = useState({});
      const [busy, setBusy] = useState(false); const [msg, setMsg] = useState(null);
      const load = useCallback(() => { api.medrec(patient.id).then(setData).catch(e => setMsg({ ok: false, text: e.message })); }, [patient.id]);
      useEffect(load, [load]);
      if (!data) return <p className="text-sm text-stone-500 p-4">Loading…</p>;
      const { matched, familyOnly, emrOnly } = data.view;
      const decide = (key, action, med, emrUuid) => setDecisions(d => ({ ...d, [key]: { action, med, emrUuid } }));
      const rows = [
        ...matched.map((m, i) => ({ key: `m${i}`, label: m.family.name || m.family.title, sub: `${m.family.dose || ''} ${m.family.frequency || ''}`.trim(), src: 'Both', med: m.family, emrUuid: m.emr.uuid || m.emr.id })),
        ...familyOnly.map((m, i) => ({ key: `f${i}`, label: m.name || m.title, sub: `${m.dose || ''} ${m.frequency || ''}`.trim(), src: 'Family-reported only', med: m })),
        ...emrOnly.map((m, i) => ({ key: `e${i}`, label: m.title || m.name, sub: m.comments || '', src: 'OpenEMR only', med: { name: m.title || m.name }, emrUuid: m.uuid || m.id }))
      ];
      const save = () => {
        const list = rows.map(r => decisions[r.key] ? { ...decisions[r.key] } : { action: 'keep', med: r.med, emrUuid: r.emrUuid });
        setBusy(true); setMsg(null);
        api.medrecSave(patient.id, list)
          .then(r => { setMsg({ ok: true, text: `${r.message}. EMR writes: ${r.emrResults.filter(x => x.ok).length}/${r.emrResults.length}` }); load(); })
          .catch(e => setMsg({ ok: false, text: e.message }))
          .finally(() => setBusy(false));
      };
      return (
        <div className="max-w-3xl">
          <div className="card">
            <div className="card-h"><h2>Medication reconciliation</h2>
              {!data.emrOk && <span className="chip bg-amber-50 text-amber-800">EMR list unavailable</span>}
            </div>
            <div className="p-4">
              {rows.length === 0 && <p className="text-sm text-stone-400">No medications reported anywhere.</p>}
              {rows.map(r => {
                const d = decisions[r.key];
                return (
                  <div key={r.key} className="flex flex-wrap items-center justify-between gap-2 py-2.5 border-b border-stone-100 last:border-0">
                    <div>
                      <div className="font-semibold text-[13px]">{r.label}</div>
                      <div className="text-xs text-stone-500">{r.sub} <span className="chip bg-primary-50 text-primary ml-1">{r.src}</span></div>
                    </div>
                    {canWrite && <div className="flex gap-1.5">
                      {['keep', 'add', 'discontinue'].map(a => (
                        <button key={a}
                          className={`chip border ${d && d.action === a ? 'bg-primary text-white border-primary' : 'bg-white text-primary border-stone-200'}`}
                          onClick={() => decide(r.key, a, r.med, r.emrUuid)}>
                          {a}
                        </button>
                      ))}
                    </div>}
                  </div>
                );
              })}
              {msg && <p className={`text-sm mt-3 ${msg.ok ? 'text-emerald-700' : 'text-red-600'}`}>{msg.text}</p>}
              {canWrite && <button className="btn mt-4" disabled={busy || rows.length === 0} onClick={save}>
                {busy ? 'Saving…' : 'Resolve — write to OpenEMR & update app rows'}
              </button>}
              {canWrite && <p className="text-[11px] text-stone-400 mt-2">Unmarked rows default to "keep". "Add" writes to OpenEMR; "discontinue" end-dates the OpenEMR row and removes it from the app's structured list.</p>}
              {!canWrite && <p className="text-[11px] text-stone-400 mt-2">Read-only view — reconciliation is resolved by a clinician.</p>}
            </div>
          </div>
        </div>
      );
    };

    // ── Care-plan authoring tab (Scope C) ──
    const CarePlanTab = ({ patient, onSaved }) => {
      const canWrite = useCanWrite();
      const [existing, setExisting] = useState(null);
      const padRef = useRef(null);
      const [f, setF] = useState({ problems: '', goals: '', eachVisit: '', visitFrequency: '', visitDays: [], visitTimes: '', duration: '', chargePlanNote: '', effectiveDate: '', targetDate: '' });
      const [busy, setBusy] = useState(false); const [msg, setMsg] = useState(null);
      useEffect(() => { api.carePlan(patient.id).then(setExisting).catch(() => {}); }, [patient.id]);
      const cp = existing && existing.carePlan;
      const coSigned = cp && existing.coSign && existing.coSign[`v${cp.version}`];
      const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      const lines = (s) => s.split('\n').map(x => x.trim()).filter(Boolean);
      const save = () => {
        if (!padRef.current || padRef.current.isEmpty()) { setMsg({ ok: false, text: 'Draw your author signature before saving.' }); return; }
        setBusy(true); setMsg(null);
        api.saveCarePlan(patient.id, {
          problems: lines(f.problems), goals: lines(f.goals), eachVisit: lines(f.eachVisit),
          visitFrequency: f.visitFrequency, visitDays: f.visitDays, visitTimes: f.visitTimes,
          duration: f.duration, chargePlanNote: f.chargePlanNote,
          effectiveDate: f.effectiveDate || null, targetDate: f.targetDate || null,
          rnSignatureImageB64: padRef.current.toDataURL()
        }).then(r => {
          setMsg({ ok: true, text: r.message + (r.emrDocumented ? ' · authored PDF filed to OpenEMR' : '') });
          api.carePlan(patient.id).then(setExisting).catch(() => {});
          onSaved && onSaved();
        }).catch(e => setMsg({ ok: false, text: e.message })).finally(() => setBusy(false));
      };
      return (
        <div className="max-w-3xl">
          {cp && (
            <div className="card mb-4">
              <div className="card-h"><h2>Current plan — v{cp.version}</h2>
                <span className={`chip ${coSigned ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-800'}`}>
                  {coSigned ? `Co-signed ${fmtTs(coSigned.at)}` : 'Awaiting client co-signature'}
                </span>
              </div>
              <div className="p-4 text-sm grid gap-1">
                <div><b>Authored:</b> {fmtTs(cp.authoredAt)} by {cp.authoredBy}</div>
                <div><b>Goals:</b> {(cp.goals || []).join(' · ')}</div>
                <div><b>Schedule:</b> {cp.visitSchedule || '—'} {cp.duration && `· ${cp.duration}`}</div>
                {existing.docs && existing.docs[`v${cp.version}`] && existing.docs[`v${cp.version}`].signed && (
                  <div><b>Signed PDF:</b>{' '}
                    {existing.docs[`v${cp.version}`].signed.driveUrl
                      ? <a className="text-primary underline" href={existing.docs[`v${cp.version}`].signed.driveUrl} target="_blank" rel="noreferrer">on Drive</a>
                      : 'stored'}
                    {existing.docs[`v${cp.version}`].signed.emrDocumented && ' · filed to OpenEMR'}
                  </div>
                )}
                {(existing.history || []).length > 1 && (
                  <div className="text-xs text-stone-500 mt-1">History: {existing.history.map(h => `v${h.version} (${fmtDate(h.authoredAt)})`).join(' · ')}</div>
                )}
              </div>
            </div>
          )}
          {!canWrite && !cp && <div className="card p-5 text-center"><i className="ti ti-clipboard-heart text-3xl text-accent" /><p className="text-sm text-stone-500 mt-1">No care plan authored yet.</p></div>}
          {canWrite && <div className="card">
            <div className="card-h"><h2>{cp ? `Author new version (v${cp.version + 1})` : 'Author care plan (v1)'}</h2></div>
            <div className="p-4 grid gap-4">
              <Field label="Problems addressed (one per line)"><textarea className="inp" rows={3} value={f.problems} onChange={e => setF({ ...f, problems: e.target.value })} /></Field>
              <Field label="Goals & objectives (one per line)"><textarea className="inp" rows={3} value={f.goals} onChange={e => setF({ ...f, goals: e.target.value })} /></Field>
              <Field label="Task list — each visit (one per line)"><textarea className="inp" rows={3} value={f.eachVisit} onChange={e => setF({ ...f, eachVisit: e.target.value })} /></Field>
              <div className="grid md:grid-cols-2 gap-3">
                <Field label="Visit frequency"><input className="inp" placeholder="e.g. 2 visits / week" value={f.visitFrequency} onChange={e => setF({ ...f, visitFrequency: e.target.value })} /></Field>
                <Field label="Times"><input className="inp" placeholder="e.g. mornings 9–11a" value={f.visitTimes} onChange={e => setF({ ...f, visitTimes: e.target.value })} /></Field>
              </div>
              <Field label="Days">
                <div className="flex flex-wrap gap-1.5">
                  {days.map(d => (
                    <button key={d} type="button"
                      className={`chip border ${f.visitDays.includes(d) ? 'bg-primary text-white border-primary' : 'bg-white text-primary border-stone-200'}`}
                      onClick={() => setF({ ...f, visitDays: f.visitDays.includes(d) ? f.visitDays.filter(x => x !== d) : [...f.visitDays, d] })}>
                      {d}
                    </button>
                  ))}
                </div>
              </Field>
              <div className="grid md:grid-cols-3 gap-3">
                <Field label="Duration"><input className="inp" placeholder="e.g. 90 days, reassess" value={f.duration} onChange={e => setF({ ...f, duration: e.target.value })} /></Field>
                <Field label="Effective date"><input className="inp" type="date" value={f.effectiveDate} onChange={e => setF({ ...f, effectiveDate: e.target.value })} /></Field>
                <Field label="Target date"><input className="inp" type="date" value={f.targetDate} onChange={e => setF({ ...f, targetDate: e.target.value })} /></Field>
              </div>
              <Field label="Charge-plan note"><textarea className="inp" rows={2} value={f.chargePlanNote} onChange={e => setF({ ...f, chargePlanNote: e.target.value })} /></Field>
              <div>
                <span className="lblu block mb-1">RN / clinician author signature (drawn)</span>
                <SignaturePad padRef={padRef} />
              </div>
              {msg && <p className={`text-sm ${msg.ok ? 'text-emerald-700' : 'text-red-600'}`}>{msg.text}</p>}
              <button className="btn" disabled={busy} onClick={save}>
                <i className="ti ti-writing-sign" />{busy ? 'Saving…' : (cp ? `Sign & save v${cp.version + 1}` : 'Sign & save v1 — unlocks the client portal plan')}
              </button>
              <p className="text-[11px] text-stone-400">Saving writes the versioned plan to the client record (portal + co-sign unlock) and files the authored PDF to OpenEMR. The final signed PDF — with both signatures — is emitted when the client co-signs in their portal.</p>
            </div>
          </div>}
        </div>
      );
    };

    // The clinical enrollment sequence (checklist + ACTIVATE) used to live
    // here as its own tab. Moved to /admin/enrollment (owner-directed,
    // 2026-09-23): it is a second admin workflow gate, same shape as
    // "Approve enrollment", and both wrote client.enrollmentStatus
    // independently with no relationship to each other — a clinician working
    // a chart has no reason to see it, and an admin working enrollment
    // shouldn't have to leave that screen to find it. See DetailView's
    // "Clinical enrollment sequence" section in admin-enrollment.html.

    // ── Session 4.2 — Clinical scheduling (OpenEMR-tied) ──
    // OpenEMR is the appointment ledger; every view below renders its LIVE
    // rows. Cancelled slots stay visible (tombstone swap — never a hard
    // delete); double-booking is rejected server-side against OpenEMR.

    const DURATIONS = [15, 30, 45, 60, 90, 120];

    // Create / reschedule form. On 409 APPOINTMENT_CONFLICT the server's
    // specific message (which slot, with whom) is shown verbatim.
    const AppointmentModal = ({ mode, appt, patients, providersData, defaultDate, defaultProviderId, onClose, onSaved }) => {
      const isRes = mode === 'reschedule';
      const linkable = (patients || []).filter(p => p.openEmrPatientId);
      const [f, setF] = useState({
        clientId: isRes ? (appt.clientId || '') : (linkable.length === 1 ? linkable[0].id : ''),
        providerId: isRes ? appt.providerId : (defaultProviderId || (providersData && providersData.myProviderId) || ''),
        date: isRes ? appt.date : (defaultDate || todayYmd()),
        startTime: isRes ? appt.startTime : '09:00',
        durationMinutes: isRes ? (appt.durationMinutes || 30) : 30,
        title: isRes ? appt.title : 'Clinical visit',
        location: (isRes && appt.location) || 'home',
        notes: (isRes && appt.notes) || ''
      });
      const [busy, setBusy] = useState(false); const [err, setErr] = useState('');
      const canPickProvider = providersData && providersData.isAdmin;
      const submit = () => {
        setErr('');
        if (!isRes && !f.clientId) { setErr('Pick a patient.'); return; }
        setBusy(true);
        const body = { providerId: f.providerId, date: f.date, startTime: f.startTime,
          durationMinutes: Number(f.durationMinutes), title: f.title, location: f.location, notes: f.notes };
        (isRes ? api.rescheduleAppointment(appt.eid, body) : api.createAppointment(f.clientId, body))
          .then(r => onSaved(r))
          .catch(e => { setErr(e.message); setBusy(false); });
      };
      return (
        <div className="fixed inset-0 bg-black/40 z-40 flex items-start justify-center p-4 overflow-y-auto" onClick={onClose}>
          <div className="card w-full max-w-lg mt-10" onClick={e => e.stopPropagation()}>
            <div className="card-h"><h2>{isRes ? `Reschedule — ${appt.patientName || 'appointment'}` : 'New appointment'}</h2>
              <button className="text-stone-400" onClick={onClose}><i className="ti ti-x" /></button>
            </div>
            <div className="p-4 grid gap-3">
              {!isRes && (
                <Field label="Patient (IHPC, linked to OpenEMR)">
                  <select className="inp" value={f.clientId} onChange={e => setF({ ...f, clientId: e.target.value })}>
                    <option value="">— select —</option>
                    {linkable.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                  </select>
                  {linkable.length === 0 && <p className="text-xs text-amber-700 mt-1">No linked patients yet — link a patient to OpenEMR from their chart first.</p>}
                </Field>
              )}
              <Field label="Provider">
                {canPickProvider ? (
                  <select className="inp" value={f.providerId} onChange={e => setF({ ...f, providerId: e.target.value })}>
                    <option value="">— select —</option>
                    {(providersData.providers || []).map(p => <option key={p.id} value={p.id}>{p.name} (id {p.id})</option>)}
                  </select>
                ) : (
                  <input className="inp" disabled value={(providersData && (providersData.providers || []).filter(p => p.id === f.providerId).map(p => p.name)[0]) || `Provider ${f.providerId || '—'}`} />
                )}
              </Field>
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                <Field label="Date"><input className="inp" type="date" value={f.date} onChange={e => setF({ ...f, date: e.target.value })} /></Field>
                <Field label="Start"><input className="inp" type="time" value={f.startTime} onChange={e => setF({ ...f, startTime: e.target.value })} /></Field>
                <Field label="Duration">
                  <select className="inp" value={f.durationMinutes} onChange={e => setF({ ...f, durationMinutes: e.target.value })}>
                    {DURATIONS.map(d => <option key={d} value={d}>{d} min</option>)}
                  </select>
                </Field>
              </div>
              <div className="grid md:grid-cols-2 gap-3">
                <Field label="Visit type / title"><input className="inp" value={f.title} onChange={e => setF({ ...f, title: e.target.value })} placeholder="e.g. Initial H&P, Follow-up" /></Field>
                <Field label="Location">
                  <select className="inp" value={f.location} onChange={e => setF({ ...f, location: e.target.value })}>
                    <option value="home">Home visit</option><option value="telehealth">Telehealth</option><option value="office">Office</option>
                  </select>
                </Field>
              </div>
              <Field label="Notes"><textarea className="inp" rows={2} value={f.notes} onChange={e => setF({ ...f, notes: e.target.value })} /></Field>
              {err && <p className="text-red-600 text-sm">{err}</p>}
              <div className="flex gap-2 justify-end">
                <button className="btn ghost" onClick={onClose}>Close</button>
                <button className="btn" disabled={busy} onClick={submit}>
                  {busy ? 'Saving to OpenEMR…' : (isRes ? 'Reschedule' : 'Book appointment')}
                </button>
              </div>
              {isRes && <p className="text-[11px] text-stone-400">The original slot stays on the calendar as a cancelled entry — nothing is deleted.</p>}
            </div>
          </div>
        </div>
      );
    };

    // Detail + actions for one appointment (calendar block or chart row).
    const AppointmentDetail = ({ appt: apptProp, providers, onClose, onChanged, onOpenChart, onReschedule, onDocument }) => {
      const canWrite = useCanWrite();
      const [cancelOpen, setCancelOpen] = useState(false);
      const [reason, setReason] = useState('');
      const [busy, setBusy] = useState(''); const [err, setErr] = useState('');
      // The calendar list omits notes/location (7.0.4 list quirk) — hydrate.
      const [hydrated, setHydrated] = useState(null);
      useEffect(() => {
        setHydrated(null);
        api.appointmentDetail(apptProp.eid)
          .then(r => setHydrated(r.appointment))
          .catch(() => {});
      }, [apptProp.eid]);
      const appt = hydrated ? { ...apptProp, ...hydrated, clientId: hydrated.clientId || apptProp.clientId } : apptProp;
      const provider = (providers || []).filter(p => p.id === appt.providerId).map(p => p.name)[0] || `Provider ${appt.providerId}`;
      const active = appt.state !== 'cancelled';
      const run = (label, fn) => { setBusy(label); setErr('');
        fn().then(r => onChanged(r)).catch(e => { setErr(e.message); setBusy(''); }); };
      return (
        <div className="fixed inset-0 bg-black/40 z-40 flex items-start justify-center p-4 overflow-y-auto" onClick={onClose}>
          <div className="card w-full max-w-md mt-10" onClick={e => e.stopPropagation()}>
            <div className="card-h"><h2>{appt.title}</h2><StateChip state={appt.state} /></div>
            <div className="p-4 text-sm grid gap-1.5">
              <div><b>{appt.patientName || 'Patient'}</b>{appt.clientId ? '' : ' (not an app client)'}</div>
              <div>{fmtDayLabel(appt.date)} · {fmt12h(appt.startTime)}–{fmt12h(appt.endTime)} ({appt.durationMinutes} min)</div>
              <div className="text-stone-500">{provider} · {LOCATION_LABELS[appt.location] || 'Home visit'}</div>
              {appt.encounterUuid && <div className="text-emerald-700 text-xs">Encounter documented: {String(appt.encounterUuid).slice(0, 8)}…</div>}
              {appt.notes && <div className="text-xs text-stone-500 whitespace-pre-wrap border-t border-stone-100 pt-1.5 mt-1">{appt.notes}</div>}
              {err && <p className="text-red-600 text-xs">{err}</p>}
              {active && !cancelOpen && (
                <div className="flex flex-wrap gap-2 mt-2">
                  {canWrite && !appt.encounterUuid && appt.clientId && onDocument &&
                    <button className="btn gold !py-1.5" onClick={() => onDocument(appt)}><i className="ti ti-stethoscope" />Document visit</button>}
                  {canWrite && onReschedule && <button className="btn ghost !py-1.5" onClick={() => onReschedule(appt)}><i className="ti ti-calendar-time" />Reschedule</button>}
                  {canWrite && <button className="btn ghost !py-1.5" onClick={() => setCancelOpen(true)}><i className="ti ti-calendar-cancel" />Cancel…</button>}
                  {canWrite && ['needs_documentation', 'scheduled'].includes(appt.state) &&
                    <button className="btn ghost !py-1.5" disabled={busy === 'noshow'} onClick={() => run('noshow', () => api.markNoShow(appt.eid))}>
                      <i className="ti ti-user-x" />{busy === 'noshow' ? '…' : 'No-show'}</button>}
                  {appt.clientId && onOpenChart &&
                    <button className="btn ghost !py-1.5" onClick={() => onOpenChart(appt.clientId)}><i className="ti ti-folder-open" />Open chart</button>}
                </div>
              )}
              {cancelOpen && (
                <div className="mt-2 grid gap-2">
                  <Field label="Cancellation reason (required — kept on the calendar entry)">
                    <textarea className="inp" rows={2} value={reason} onChange={e => setReason(e.target.value)} />
                  </Field>
                  <div className="flex gap-2 justify-end">
                    <button className="btn ghost !py-1.5" onClick={() => setCancelOpen(false)}>Back</button>
                    <button className="btn !py-1.5" disabled={!reason.trim() || busy === 'cancel'}
                      onClick={() => run('cancel', () => api.cancelAppointment(appt.eid, reason.trim()))}>
                      {busy === 'cancel' ? 'Cancelling…' : 'Confirm cancellation'}
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    // Greedy lane assignment so overlapping blocks (e.g. an active row next to
    // a cancelled tombstone in the same slot) render side by side.
    const laneify = (appts) => {
      const sorted = [...appts].sort((a, b) => timeMins(a.startTime) - timeMins(b.startTime));
      const laneEnds = [];
      const out = sorted.map(a => {
        const start = timeMins(a.startTime); const end = timeMins(a.endTime || a.startTime) || start + 30;
        let lane = laneEnds.findIndex(e => e <= start);
        if (lane === -1) { lane = laneEnds.length; laneEnds.push(end); } else laneEnds[lane] = end;
        return { ...a, _lane: lane };
      });
      const lanes = Math.max(1, laneEnds.length);
      return out.map(a => ({ ...a, _lanes: lanes }));
    };

    const GRID_START = 7 * 60, GRID_END = 19 * 60, PX_PER_MIN = 0.8;

    const DayColumn = ({ ymd, appts, onPick }) => {
      const dayAppts = laneify(appts.filter(a => a.date === ymd));
      const hours = []; for (let h = 7; h < 19; h++) hours.push(h);
      return (
        <div className="flex-1 min-w-[130px] border-l border-stone-200 relative" style={{ height: (GRID_END - GRID_START) * PX_PER_MIN }}>
          {hours.map(h => (
            <div key={h} className="absolute w-full border-t border-stone-100 text-[9px] text-stone-300 pl-1"
              style={{ top: (h * 60 - GRID_START) * PX_PER_MIN }}>{((h + 11) % 12) + 1}{h >= 12 ? 'p' : 'a'}</div>
          ))}
          {dayAppts.map(a => {
            const top = Math.max(0, (timeMins(a.startTime) - GRID_START) * PX_PER_MIN);
            const height = Math.max(18, (Math.max(15, a.durationMinutes || 30)) * PX_PER_MIN);
            const cancelled = a.state === 'cancelled';
            const colors = cancelled ? 'bg-stone-100 border-stone-300 text-stone-400'
              : a.state === 'documented' ? 'bg-emerald-50 border-emerald-500 text-emerald-900'
              : a.state === 'no_show' ? 'bg-red-50 border-red-400 text-red-800'
              : a.state === 'needs_documentation' ? 'bg-amber-50 border-amber-500 text-amber-900'
              : 'bg-primary-50 border-primary text-primary-700';
            return (
              <div key={a.eid}
                className={`absolute rounded-md border-l-4 px-1.5 py-0.5 text-[10.5px] leading-tight cursor-pointer overflow-hidden ${colors}`}
                style={{ top, height, left: `${(a._lane / a._lanes) * 100}%`, width: `${100 / a._lanes}%` }}
                onClick={() => onPick(a)} title={`${a.title} — ${a.patientName || ''}`}>
                <div className={`font-bold truncate ${cancelled ? 'line-through' : ''}`}>{fmt12h(a.startTime)} {a.patientName || a.title}</div>
                <div className="truncate">{a.title}{a.location === 'telehealth' ? ' · 📹' : ''}</div>
              </div>
            );
          })}
        </div>
      );
    };

    const ScheduleView = ({ user, patients, onOpenChart, onDocument }) => {
      const canWrite = useCanWrite();
      const [providersData, setProvidersData] = useState(null);
      const [mode, setMode] = useState('week');
      const [anchor, setAnchor] = useState(todayYmd());
      const [providerFilter, setProviderFilter] = useState('');
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      const [picked, setPicked] = useState(null);
      const [modal, setModal] = useState(null); // {mode, appt?}

      useEffect(() => { api.providers().then(setProvidersData).catch(e => setErr({ message: e.message, code: e.data && e.data.code })); }, []);
      const from = mode === 'day' ? anchor : mondayOf(anchor);
      const to = mode === 'day' ? anchor : addDaysYmd(mondayOf(anchor), 6);
      const load = useCallback(() => {
        const params = { from, to };
        if (providerFilter) params.providerId = providerFilter;
        api.appointments(params).then(r => { setData(r); setErr(null); })
          .catch(e => { setData(null); setErr({ message: e.message, code: e.data && e.data.code }); });
      }, [from, to, providerFilter]);
      useEffect(load, [load]);

      const days = mode === 'day' ? [anchor] : [0, 1, 2, 3, 4, 5, 6].map(i => addDaysYmd(from, i));
      const appts = (data && data.appointments) || [];
      const changed = () => { setPicked(null); setModal(null); load(); };
      const isAdmin = providersData && providersData.isAdmin;

      if (err && err.code === 'PROVIDER_NOT_MAPPED') {
        return (
          <div className="p-6 lg:p-10 max-w-xl">
            <div className="card p-6 text-center">
              <i className="ti ti-calendar-question text-4xl text-accent" />
              <h2 className="serif text-xl text-primary font-semibold mt-2">Calendar not connected yet</h2>
              <p className="text-sm text-stone-500 mt-2">{err.message}</p>
            </div>
          </div>
        );
      }
      return (
        <div className="p-4 lg:p-7">
          <div className="flex flex-wrap items-center gap-2 mb-4">
            <div className="flex rounded-lg border border-stone-200 overflow-hidden">
              <button className={`px-3 py-1.5 text-xs font-semibold ${mode === 'day' ? 'bg-primary text-white' : 'bg-white text-primary'}`} onClick={() => setMode('day')}>Day</button>
              <button className={`px-3 py-1.5 text-xs font-semibold ${mode === 'week' ? 'bg-primary text-white' : 'bg-white text-primary'}`} onClick={() => setMode('week')}>Week</button>
            </div>
            <div className="flex items-center gap-1">
              <button className="btn ghost !px-2 !py-1.5" onClick={() => setAnchor(addDaysYmd(anchor, mode === 'day' ? -1 : -7))}><i className="ti ti-chevron-left" /></button>
              <button className="btn ghost !px-2.5 !py-1.5 text-xs" onClick={() => setAnchor(todayYmd())}>Today</button>
              <button className="btn ghost !px-2 !py-1.5" onClick={() => setAnchor(addDaysYmd(anchor, mode === 'day' ? 1 : 7))}><i className="ti ti-chevron-right" /></button>
            </div>
            <div className="serif text-lg text-primary font-semibold">
              {mode === 'day' ? fmtDayLabel(anchor) : `${fmtDayLabel(from)} – ${fmtDayLabel(to)}`}
            </div>
            <div className="ml-auto flex items-center gap-2">
              {isAdmin && (
                <select className="inp !w-auto text-xs" value={providerFilter} onChange={e => setProviderFilter(e.target.value)}>
                  <option value="">All providers</option>
                  {(providersData.providers || []).map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
              )}
              {!isAdmin && providersData && (
                <span className="chip bg-primary-50 text-primary">
                  {(providersData.providers || []).filter(p => p.id === providersData.myProviderId).map(p => p.name)[0] || 'My calendar'}
                </span>
              )}
              {canWrite && <button className="btn gold" onClick={() => setModal({ mode: 'create' })}><i className="ti ti-calendar-plus" />New appointment</button>}
            </div>
          </div>

          {providersData && providersData.degraded && (
            <p className="text-[11px] text-amber-700 mb-2"><i className="ti ti-alert-triangle mr-1" />{providersData.notice}</p>
          )}
          {err && <p className="text-red-600 text-sm mb-3">{err.message}</p>}
          {!err && data === null && <p className="text-sm text-stone-500">Loading calendar from OpenEMR…</p>}
          {data !== null && (
            <div className="card overflow-x-auto">
              <div className="flex border-b border-stone-200 bg-cream sticky top-0">
                <div className="w-0" />
                {days.map(d => (
                  <div key={d} className={`flex-1 min-w-[130px] text-center py-2 text-xs font-bold ${d === todayYmd() ? 'text-accent' : 'text-primary'}`}>{fmtDayLabel(d)}</div>
                ))}
              </div>
              <div className="flex">
                {days.map(d => <DayColumn key={d} ymd={d} appts={appts} onPick={setPicked} />)}
              </div>
              {appts.length === 0 && (
                <div className="text-center py-8 border-t border-stone-100">
