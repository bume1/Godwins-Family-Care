              onClick={() => onCancel(reason.trim()).then(r => { if (r) { setOpen(false); setReason(''); } })}>
              {busy ? 'Cancelling…' : 'Confirm Cancel'}
            </button>
          </div>
        </div>
      );
    };

    // A referral to someone on the team: no requisition, no fax. The colleague
    // it went to accepts it and completes it with a note; the server says
    // whether this viewer is that person (order.can.acceptOrComplete).
    const InternalReferralActions = ({ order, busy, onAccept, onComplete, onCancel }) => {
      const [completing, setCompleting] = useState(false);
      const [note, setNote] = useState('');
      const r = order.referral || {};
      const to = r.assignedTo || {};
      const mine = !!(order.can && order.can.acceptOrComplete);
      return (
        <div className="mt-1.5">
          <div className="text-[11.5px] text-stone-600">
            Referred to <b>{to.name || 'a colleague'}</b>{to.roleLabel ? ` (${to.roleLabel})` : ''} inside the team.
            {order.status === 'accepted' && r.acceptedAt && <span> Accepted {fmtTs(r.acceptedAt)}.</span>}
          </div>
          {order.status === 'completed' && (
            <div className="mt-1 p-2 rounded border border-emerald-200 bg-emerald-50/50 text-[12.5px]">
              <div className="text-[11px] text-emerald-800 font-semibold">Completed {fmtTs(r.completedAt)} by {(r.completedBy && r.completedBy.name) || to.name}</div>
              <div className="whitespace-pre-wrap">{r.completionNote}</div>
            </div>
          )}
          <div className="flex flex-wrap gap-1.5 mt-1.5">
            {mine && order.status === 'ordered' && (
              <button type="button" className="chip border bg-white text-primary border-stone-200" disabled={busy} onClick={() => onAccept()}>Accept</button>
            )}
            {mine && ['ordered', 'accepted'].includes(order.status) && !completing && (
              <button type="button" className="chip border bg-white text-primary border-stone-200" onClick={() => setCompleting(true)}>Mark Complete</button>
            )}
            <CancelOrderControl order={order} busy={busy} onCancel={onCancel} />
          </div>
          {completing && (
            <div className="grid gap-2 mt-2 p-2.5 rounded border border-stone-200 bg-stone-50">
              <Field label="What did you do? (the referring clinician reads this)">
                <textarea className="inp" rows={3} value={note} onChange={e => setNote(e.target.value)} />
              </Field>
              <div className="flex justify-end gap-2">
                <button type="button" className="btn ghost !py-1.5" onClick={() => setCompleting(false)}>Back</button>
                <button type="button" className="btn !py-1.5" disabled={busy || !note.trim()}
                  onClick={() => onComplete(note.trim()).then(res => { if (res) { setCompleting(false); setNote(''); } })}>
                  {busy ? 'Saving…' : 'Complete Referral'}
                </button>
              </div>
            </div>
          )}
        </div>
      );
    };

    const OrderActions = ({ order, channels, channelLabels, defaultChannel, faxChannels, interpretations, onSent, onScheduled, onResult, busy,
      destinationFields, editableStatuses, onDestination, onCancel, onAccept, onComplete }) => {
      const [mode, setMode] = useState('');
      const canEditDestination = useCanEditOrderDestination();
      // Recording a send, a scheduled date or a result advances the order. The
      // server answers per order (order.can.coordinate): an RN or a provider on
      // any order, social work on a referral. Before it has, fall back to the
      // capability. Offering the button to anyone else is offering a 403.
      const canAdvanceAny = useCan('orderStatusAdvance');
      const canAdvance = order.can ? !!order.can.coordinate : canAdvanceAny;
      // The fields for this order's type are the SERVER's list; a type it does
      // not list (a lab) has no destination to edit and gets no button.
      const destFields = (destinationFields && destinationFields[order.orderType]) || null;
      const destBucket = order.orderType === 'referral' ? (order.referral || {}) : (order.dme || {});
      const destStart = () => Object.fromEntries((destFields || []).map(f => [f.key, destBucket[f.key] || '']));
      const [dest, setDest] = useState(destStart);
      const [destReason, setDestReason] = useState('');
      const alreadySent = (order.sends || []).length > 0;
      const faxField = (destFields || []).find(f => f.fax);
      const faxChanging = !!faxField && faxOk(dest[faxField.key]) && String(dest[faxField.key]).replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '') !== String(destBucket[faxField.key] || '');
      // A referral placed before the agency was known may be saved without the fax
      // yet; every other order still needs a valid one.
      const agencyPending = !!(order.referral && order.referral.agencyPending && !order.referral.receivingFax);
      const destValid = !!destFields && destFields.every(f => f.fax ? (faxOk(dest[f.key]) || (agencyPending && !String(dest[f.key] || '').trim())) : (!f.required || String(dest[f.key] || '').trim()));
      const lastDest = (order.destinationHistory || []).slice(-1)[0] || null;
      const [send, setSend] = useState({
        // SERVED, not named here. The default channel and which channels carry a
        // fax number are both the server's answer — this form restating either
        // would let it offer an option the validator refuses, silently.
        channel: defaultChannel || '',
        recipientName: (order.referral && (order.referral.receivingPractice || order.referral.receivingProvider || order.referral.specialty)) || (order.dme && order.dme.supplierName) || '',
        recipientFax: (order.referral && order.referral.receivingFax) || (order.dme && order.dme.supplierFax) || '',
        note: ''
      });
      const [appt, setAppt] = useState('');
      const [res, setRes] = useState({ interpretation: 'normal', resultDate: todayYmd(), performedBy: '', summary: '', file: null });
      const isFax = (faxChannels || []).includes(send.channel);
      const sends = order.sends || [];
      // Every hook is above this line, so the early return keeps hook order.
      if (order.orderType === 'referral' && (order.referral || {}).destination === 'internal') {
        return <InternalReferralActions order={order} busy={busy} onAccept={onAccept} onComplete={onComplete} onCancel={onCancel} />;
      }
      return (
        <div className="mt-1.5">
          {order.status === 'cancelled' && order.cancelReason && (
            <div className="text-[11.5px] text-stone-600 mb-1">Cancelled {fmtTs(order.cancelledAt)}{order.cancelledBy && order.cancelledBy.name ? ` by ${order.cancelledBy.name}` : ''}: {order.cancelReason}</div>
          )}
          <div className="flex flex-wrap gap-1.5">
            {agencyPending && <span className="chip bg-amber-50 text-amber-800 border border-amber-200">Needs agency</span>}
            {agencyPending && <span className="chip border bg-stone-100 text-stone-400 border-stone-200 cursor-not-allowed" title="Add the receiving agency and fax first, then the requisition can be opened."><i className="ti ti-file-text" /> Open Requisition</span>}
            {!agencyPending && <a className="chip border bg-white text-primary border-stone-200" href={api.requisitionUrl(order.id)} target="_blank" rel="noopener noreferrer">
              <i className="ti ti-file-text" /> Open Requisition
            </a>}
            {canAdvance && !agencyPending && ['ordered', 'sent', 'scheduled'].includes(order.status) &&
              <button className="chip border bg-white text-primary border-stone-200" onClick={() => {
                // Re-read the destination each time it opens: it can have been
                // updated since this row first rendered, and a re-send must go
                // to the number the order carries NOW.
                if (mode !== 'send') setSend(s => ({
                  ...s,
                  recipientName: (order.referral && (order.referral.receivingPractice || order.referral.receivingProvider || order.referral.specialty)) || (order.dme && order.dme.supplierName) || s.recipientName,
                  recipientFax: (order.referral && order.referral.receivingFax) || (order.dme && order.dme.supplierFax) || s.recipientFax
                }));
                setMode(mode === 'send' ? '' : 'send');
              }}>
                {sends.length ? 'Record Resend' : 'Mark Faxed'}
              </button>}
            {canEditDestination && destFields && (editableStatuses || []).includes(order.status) &&
              <button className="chip border bg-white text-primary border-stone-200" onClick={() => { if (mode !== 'dest') { setDest(destStart()); setDestReason(''); } setMode(mode === 'dest' ? '' : 'dest'); }}>
                {agencyPending ? 'Add Agency & Fax' : 'Update Destination'}
              </button>}
            {agencyPending && !canEditDestination &&
              <span className="text-[11px] text-stone-500">Waiting for the office to confirm the agency.</span>}
            {canAdvance && order.orderType === 'referral' && ['sent'].includes(order.status) &&
              <button className="chip border bg-white text-primary border-stone-200" onClick={() => setMode(mode === 'appt' ? '' : 'appt')}>Mark Scheduled</button>}
            {canAdvance && !['cancelled', 'resulted', 'completed'].includes(order.status) &&
              <button className="chip border bg-white text-primary border-stone-200" onClick={() => setMode(mode === 'result' ? '' : 'result')}>
                {order.orderType === 'referral' ? 'Attach Consult Note' : 'Attach Result'}
              </button>}
            <CancelOrderControl order={order} busy={busy} onCancel={onCancel} />
          </div>

          {order.resendNeeded && (
            <div className="text-[11px] font-semibold text-amber-800 mt-1.5">
              The destination changed after this order was faxed. Open the requisition again and record another send to the new number.
            </div>
          )}
          {lastDest && (
            <div className="text-[11px] text-stone-500 mt-1">
              Destination updated {fmtTs(lastDest.at)} by {lastDest.by && lastDest.by.name}: {(lastDest.changes || []).map(c => c.label).join(', ')}
              {lastDest.reason ? ` — ${lastDest.reason}` : ''}
            </div>
          )}

          {mode === 'dest' && destFields && (
            <div className="grid gap-2 mt-2 p-2.5 rounded border border-stone-200 bg-stone-50">
              <p className="text-[11px] text-stone-600">
                Where this order goes. The clinical content of the order stays as the clinician wrote it. Open the requisition again afterward
                — it reads the new details.
              </p>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                {destFields.map(f => (
                  <Field key={f.key} label={f.label}>
                    <input className="inp" inputMode={f.fax || /phone/i.test(f.key) ? 'tel' : undefined} value={dest[f.key] || ''}
                      onChange={e => setDest({ ...dest, [f.key]: e.target.value })} />
                    {f.fax && dest[f.key] && !faxOk(dest[f.key]) && <p className="text-[11px] text-amber-700 mt-1">Ten digits. A wrong fax number is a wrong disclosure.</p>}
                  </Field>
                ))}
              </div>
              {alreadySent && faxChanging && (
                <Field label="Why is the fax number changing? (required — this order was already faxed)">
                  <input className="inp" value={destReason} onChange={e => setDestReason(e.target.value)} />
                </Field>
              )}
              <div className="flex justify-end">
                <button className="btn !py-1.5" disabled={busy || !destValid || (alreadySent && faxChanging && !destReason.trim())}
                  onClick={() => onDestination({ ...dest, ...(alreadySent && faxChanging ? { changeReason: destReason } : {}) }).then(() => setMode(''))}>
                  {busy ? 'Saving…' : 'Save Destination'}
                </button>
              </div>
            </div>
          )}

          {sends.map((sd, i) => (
            <div key={i} className="text-[11px] text-stone-500 mt-1">
              {i === 0 ? 'Sent' : 'Re-sent'} {fmtTs(sd.sentAt)} · {channelLabels && channelLabels[sd.channel] || sd.channel} → {sd.recipientName}
              {sd.recipientFax ? ` at ${sd.recipientFax.replace(/(\d{3})(\d{3})(\d{4})/, '($1) $2-$3')}` : ''} · by {sd.sentBy && sd.sentBy.name}
            </div>
          ))}

          {mode === 'send' && (
            <div className="grid gap-2 mt-2 p-2.5 rounded border border-stone-200 bg-stone-50">
              <p className="text-[11px] text-stone-600">
                Open the requisition, fax it from Doximity, then record it here. This does not send anything — it records that you did.
              </p>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <Field label="Channel">
                  <select className="inp" value={send.channel} onChange={e => setSend({ ...send, channel: e.target.value })}>
                    {(channels || []).map(c => <option key={c} value={c}>{(channelLabels && channelLabels[c]) || c}</option>)}
                  </select>
                </Field>
                <Field label="Sent to"><input className="inp" value={send.recipientName} onChange={e => setSend({ ...send, recipientName: e.target.value })} /></Field>
              </div>
              {isFax && (
                <Field label="Fax number it went to">
                  <input className="inp" inputMode="tel" value={send.recipientFax} onChange={e => setSend({ ...send, recipientFax: e.target.value })} />
                  {send.recipientFax && !faxOk(send.recipientFax) && <p className="text-[11px] text-amber-700 mt-1">Ten digits. This is the record of who the PHI went to.</p>}
                </Field>
              )}
              <Field label="Note (optional)"><input className="inp" value={send.note} onChange={e => setSend({ ...send, note: e.target.value })} /></Field>
              <div className="flex justify-end">
                <button className="btn !py-1.5" disabled={busy || !send.recipientName || (isFax && !faxOk(send.recipientFax))}
                  onClick={() => onSent(send).then(r => { if (r) setMode(''); })}>{busy ? 'Recording…' : 'Record Send'}</button>
              </div>
            </div>
          )}

          {mode === 'appt' && (
            <div className="grid gap-2 mt-2 p-2.5 rounded border border-stone-200 bg-stone-50">
              <Field label="Appointment date the specialist's office gave"><input className="inp" type="date" value={appt} onChange={e => setAppt(e.target.value)} /></Field>
              <div className="flex justify-end"><button className="btn !py-1.5" disabled={busy || !appt} onClick={() => onScheduled(appt).then(r => { if (r) setMode(''); })}>Save</button></div>
            </div>
          )}

          {mode === 'result' && (
            <div className="grid gap-2 mt-2 p-2.5 rounded border border-stone-200 bg-stone-50">
              <p className="text-[11px] text-stone-600">
                The PDF is the record; the interpretation is what decides who this reaches and how fast. It files into the
                patient's chart, never into Drive.
              </p>
              <Field label="Document (PDF, JPEG or PNG)">
                <input className="inp" type="file" accept="application/pdf,image/jpeg,image/png" onChange={e => setRes({ ...res, file: e.target.files[0] || null })} />
              </Field>
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">
                <Field label="Interpretation">
                  <select className="inp" value={res.interpretation} onChange={e => setRes({ ...res, interpretation: e.target.value })}>
                    {(interpretations || ['normal', 'abnormal', 'critical']).map(i => <option key={i} value={i}>{i}</option>)}
                  </select>
                </Field>
                <Field label="Result date"><input className="inp" type="date" value={res.resultDate} onChange={e => setRes({ ...res, resultDate: e.target.value })} /></Field>
                <Field label="Performing lab / facility"><input className="inp" value={res.performedBy} onChange={e => setRes({ ...res, performedBy: e.target.value })} /></Field>
              </div>
              <Field label="Short summary"><input className="inp" value={res.summary} onChange={e => setRes({ ...res, summary: e.target.value })} /></Field>
              {res.interpretation === 'critical' && <p className="text-[11px] text-amber-800">A critical result notifies the ordering clinician immediately. The notice carries no patient or clinical detail.</p>}
              <div className="flex justify-end">
                <button className="btn !py-1.5" disabled={busy || !res.file || !res.performedBy || !res.summary}
                  onClick={() => onResult(res).then(r => { if (r) setMode(''); })}>{busy ? 'Filing…' : 'File Result'}</button>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ══════════════════════════════════════════════════════════════════════
    // SESSION 4.10 — THE RESULTS INBOX
    //
    // `acknowledgeAbnormalResult` has existed as a capability since 4.8 with no
    // route and no screen behind it. This is where it finally gets both.
    //
    // WITH RESULTS ARRIVING BY FAX TO ONE PERSON'S PHONE, the realistic harm is
    // an ABNORMAL RESULT NOBODY WITH AUTHORITY EVER SAW. Critical pinned first,
    // then abnormal, then normal; oldest first within each, because the oldest
    // unanswered result is the one most likely to have been forgotten.
    // ══════════════════════════════════════════════════════════════════════
    // 2026-10-12 redesign (owner mockup 8): Critical first, then Needs review,
    // each a card of rows. The acknowledgement controls are unchanged and open
    // under the row they belong to. No result VALUE is shown: the app stores
    // the document and its interpretation, never the numbers.
    const RESULT_ROW_TONE = { critical: 'bg-red-50 text-red-600', abnormal: 'bg-amber-50 text-amber-700', normal: 'bg-[#F6EFE2] text-[#9A7430]' };
    const ResultsInbox = ({ onOpenChart }) => {
      const [d, setD] = useState(null);
      const [err, setErr] = useState('');
      const [busy, setBusy] = useState('');
      const [notes, setNotes] = useState({});
      const [openId, setOpenId] = useState(null);
      const load = useCallback(() => {
        api.resultsInbox().then(r => { setD(r); setErr(''); }).catch(e => setErr(e.message));
      }, []);
      useEffect(load, [load]);
      // Only a failed LOAD replaces the page. A refused acknowledgement used to
      // replace the whole inbox with its error text; now it shows above the list.
      if (err && !d) return <div className="p-4 lg:p-7"><div className="card p-4 text-red-600 text-sm">{err}</div></div>;
      if (!d) return <div className="p-4 lg:p-7"><div className="card p-6 text-stone-500 text-sm">Loading the inbox…</div></div>;
      const rows = d.results || [];
      const ack = (r) => {
        setBusy(r.id);
        return api.acknowledgeResult(r.id, notes[r.id] || '', notes[`p:${r.id}`] || '')
          .then(() => { setBusy(''); setOpenId(null); load(); })
          .catch(e => { setBusy(''); setErr(e.message); });
      };
      const groups = [
        ['Critical', rows.filter(r => r.interpretation === 'critical'), 'text-red-700'],
        ['Needs Review', rows.filter(r => r.interpretation !== 'critical'), 'text-primary']
      ];
      const label = (r) => (d.interpretationLabels && d.interpretationLabels[r.interpretation]) || r.interpretation;
      return (
        <div className="p-4 lg:p-7 max-w-4xl">
          {err && <div className="card p-3 text-red-600 text-sm mb-3">{err}</div>}
          {rows.length === 0 && (
            <div className="card px-6 py-10 text-center">
              <i className="ti ti-flask text-3xl text-stone-300" />
              <p className="text-sm text-stone-500 mt-2">Nothing is waiting on you.</p>
            </div>
          )}
          {groups.filter(([, list]) => list.length).map(([title, list, color]) => (
            <div key={title} className="mb-5">
              <h2 className={`serif text-[22px] font-semibold mb-2 ${color}`}>{title} ({list.length})</h2>
              <div className="card overflow-hidden">
                {list.map(r => (
                  <div key={r.id} className="border-b border-stone-100 last:border-0">
                    <button type="button" className="cw-row w-full text-left flex items-center gap-3 px-4 py-3.5"
                      onClick={() => setOpenId(openId === r.id ? null : r.id)} aria-expanded={openId === r.id}>
                      <div className={`w-11 h-11 rounded-xl flex items-center justify-center shrink-0 ${RESULT_ROW_TONE[r.interpretation] || RESULT_ROW_TONE.normal}`}>
                        <i className="ti ti-flask text-[20px]" />
                      </div>
                      <div className="min-w-0 flex-1">
                        <div className="text-[14px] font-semibold text-primary truncate">{r.summary || 'Result'}</div>
                        <div className="text-[12.5px] text-stone-600 truncate">{[r.clientName, r.orderReference].filter(Boolean).join(' · ') || 'No matching patient'}</div>
                        <div className="text-[12px] font-semibold capitalize" style={{ color: r.interpretation === 'critical' ? '#B5462E' : r.interpretation === 'abnormal' ? '#a16207' : '#5b6b73' }}>{label(r)}</div>
                      </div>
                      <div className="flex flex-col items-end gap-1 shrink-0">
                        <span className="text-[12px] text-stone-500">{r.resultDate ? fmtDate(r.resultDate) : fmtTs(r.receivedAt)}</span>
                        {r.escalated && <span className="chip bg-red-600 text-white">escalated</span>}
                        {r.unmatched && <span className="chip bg-white text-stone-600 border border-stone-200">no matching order</span>}
                      </div>
                      <i className={`ti ti-chevron-${openId === r.id ? 'up' : 'down'} text-stone-400`} />
                    </button>
                    {openId === r.id && (
                      <div className="px-4 pb-4 pt-1 bg-[#FCFAF6]">
                        <div className="text-[12px] text-stone-600">
                          {r.performedBy} · result dated {r.resultDate} · received {fmtTs(r.receivedAt)}
                          {r.routeTo && r.routeTo.name ? ` · routed to ${r.routeTo.name}${r.routeTo.via === 'authorizing_provider' ? ' (authorizing provider on the standing order)' : ''}` : ''}
                          {r.document && !r.document.emrFiled ? ' · NOT filed in the chart' : ''}
                        </div>
                        {r.canAcknowledge ? (
                          <div className="grid gap-2 mt-3">
                            {r.followUpRequired && (
                              <input className="inp" placeholder="What are you doing about it? (required)"
                                value={notes[r.id] || ''} onChange={e => setNotes({ ...notes, [r.id]: e.target.value })} />
                            )}
                            {/* Portal P1: the patient already sees this result; acknowledging it
                                sends them ONE notice. This line is shown to them beside it. */}
                            <input className="inp" maxLength={500} placeholder="Optional note for the patient, in plain words (shown on their portal)"
                              value={notes[`p:${r.id}`] || ''} onChange={e => setNotes({ ...notes, [`p:${r.id}`]: e.target.value })} />
                            <div className="flex justify-end gap-2">
                              {r.clientId && onOpenChart && (
                                <button className="btn ghost !py-1.5" onClick={() => onOpenChart(r.clientId, { tab: 'results' })}>Open Chart</button>
                              )}
                              <button className="btn !py-1.5" disabled={busy === r.id || (r.followUpRequired && !(notes[r.id] || '').trim())}
                                onClick={() => ack(r)}>{busy === r.id ? 'Recording…' : 'Acknowledge'}</button>
                            </div>
                          </div>
                        ) : (
                          <div className="flex items-center justify-between gap-2 mt-2">
                            <p className="text-[12px] text-stone-600">
                              Clinically acknowledging a {r.interpretation} result is a provider's. It stays here until one does.
                            </p>
                            {r.clientId && onOpenChart && (
                              <button className="btn ghost !py-1.5 shrink-0" onClick={() => onOpenChart(r.clientId, { tab: 'results' })}>Open Chart</button>
                            )}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          ))}
          <p className="text-[11.5px] text-stone-400">
            An unacknowledged critical result escalates to the office after {d.thresholds && d.thresholds.criticalHours} hours;
            an abnormal one after {d.thresholds && d.thresholds.abnormalBusinessDays} business days.
          </p>
          {(d.escalations || []).length > 0 && (
            <div className="card mt-5">
              <div className="card-h"><h2>Escalated (No Answer Yet)</h2><span className="chip bg-red-600 text-white">{d.escalations.length}</span></div>
              <div className="p-4 text-sm">
                {d.escalations.map(e => (
                  <div key={e.id} className="py-1.5 border-b border-stone-100 last:border-0 text-xs">
                    <b>{e.interpretation}</b>{e.orderReference ? ` · ${e.orderReference}` : ''} · received {fmtTs(e.receivedAt)} ·
                    past its {e.thresholdDescription} · routed to {(e.routeTo && e.routeTo.name) || 'nobody'}
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    };

    // ══════════════════════════════════════════════════════════════════════
    // SESSION 4.10 — OVERDUE ORDERS: THE LOST FAX
    //
    // The failure mode of a manual workflow, and the harm is not that a fax was
    // lost — it is that nobody noticed. An order sent and never answered looks
    // exactly like one working its way through a lab, so the recipient and the
    // number it went to are on the row: the point of this screen is that
    // somebody can pick up the phone.
    // ══════════════════════════════════════════════════════════════════════
    // ── Veterans for independent medical exams (owner, 2026-10-30) ─────────
    // The provider's list for a day: who the vendor is sending, who has signed
    // in on the clinic iPad (with the number to call), and Mark Seen / No Show.
    // An admin or manager sees every provider's list here too. Refreshes every
    // 30 seconds so an arrival shows without a reload.
    const VETERAN_STATUS_PILL = {
      expected: 'bg-stone-100 text-stone-600 border-stone-200',
      arrived: 'bg-emerald-50 text-emerald-800 border-emerald-200',
      seen: 'bg-sky-50 text-sky-800 border-sky-200',
      no_show: 'bg-amber-50 text-amber-800 border-amber-200'
    };
    const fmtYmd = (ymd) => { const [y, m, d] = String(ymd || '').split('-'); return y ? `${m}/${d}/${y}` : '—'; };
    const VeteranAddForm = ({ date, providers, office, onAdded, editing, onCancel }) => {
      const blank = { firstName: '', lastName: '', dob: '', examDate: date, examTime: '', durationMinutes: '', providerUserId: '' };
      const fromRow = (r) => ({
        firstName: r.firstName || '', lastName: r.lastName || '', dob: r.dob || '',
        examDate: r.examDate || date, examTime: r.examTime || '',
        durationMinutes: r.durationMinutes == null ? '' : String(r.durationMinutes),
        providerUserId: r.providerUserId || ''
      });
      // Belt-and-braces: the effect keyed on `editing.id` below fills the form
      // on mount either way — replacing this with `useState(blank)` changes
      // nothing observable, proven in a browser. It only avoids a one-frame
      // blank. THE EFFECT IS THE LOAD-BEARING ONE; do not remove it believing
      // this line covers it.
      const [f, setF] = useState(() => (editing ? fromRow(editing) : blank));
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState('');
      const [fe, setFe] = useState({});
      // Following the day picker would overwrite the date of the row being
      // edited the moment somebody moved the board to another day.
      useEffect(() => { if (!editing) setF(x => ({ ...x, examDate: date })); }, [date, editing]);
      useEffect(() => { setF(editing ? fromRow(editing) : blank); setErr(''); setFe({}); }, [editing && editing.id]);
      const set = (k) => (e) => setF(x => ({ ...x, [k]: e.target.value }));
      const submit = (e) => {
        e.preventDefault(); setBusy(true); setErr(''); setFe({});
        const req = editing
          ? authedFetch(`/api/veterans/roster/${editing.id}`, { method: 'PUT', body: JSON.stringify(f) })
          : authedFetch('/api/veterans/roster', { method: 'POST', body: JSON.stringify(f) });
        req
          // On ADD the date, the provider and the LENGTH are kept for the next
          // veteran — an exam day is a run of the same-shaped bookings — but
          // the start time is cleared, or the next one silently stacks on it.
          // On EDIT the form closes instead: there is no next one.
          .then(() => {
            if (editing) { onCancel && onCancel(); }
            else setF({ ...blank, examDate: f.examDate, providerUserId: f.providerUserId, durationMinutes: f.durationMinutes });
            onAdded();
          })
          .catch(e2 => { setErr(e2.message); setFe((e2.data && e2.data.fieldErrors) || {}); })
          .finally(() => setBusy(false));
      };
      const inp = 'w-full border border-stone-300 rounded-lg px-3 py-2 text-sm';
      return (
        <form onSubmit={submit} className="card p-4 mb-5">
          <h3 className="text-[15px] font-semibold text-primary mb-3">
            {editing ? `Edit ${editing.firstName} ${editing.lastName}` : 'Add Veteran'}
          </h3>
          {err && <div className="text-sm text-red-600 mb-2">{err}</div>}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
            <label className="text-[12px] text-stone-600">First name<input className={inp} value={f.firstName} onChange={set('firstName')} />{fe.firstName && <span className="text-red-600">{fe.firstName}</span>}</label>
            <label className="text-[12px] text-stone-600">Last name<input className={inp} value={f.lastName} onChange={set('lastName')} />{fe.lastName && <span className="text-red-600">{fe.lastName}</span>}</label>
            <label className="text-[12px] text-stone-600">Date of birth<input type="date" className={inp} value={f.dob} onChange={set('dob')} />{fe.dob && <span className="text-red-600">{fe.dob}</span>}</label>
            <label className="text-[12px] text-stone-600">Exam date<input type="date" className={inp} value={f.examDate} onChange={set('examDate')} />{fe.examDate && <span className="text-red-600">{fe.examDate}</span>}</label>
            <label className="text-[12px] text-stone-600">Start time <span className="text-stone-400">(optional)</span><input type="time" className={inp} value={f.examTime} onChange={set('examTime')} />{fe.examTime && <span className="text-red-600">{fe.examTime}</span>}</label>
            <label className="text-[12px] text-stone-600">Length <span className="text-stone-400">(minutes)</span><input type="number" min="1" step="5" className={inp} value={f.durationMinutes} onChange={set('durationMinutes')} placeholder="60" />{fe.durationMinutes && <span className="text-red-600">{fe.durationMinutes}</span>}</label>
            {office ? (
              <label className="text-[12px] text-stone-600">Provider
                <select className={inp} value={f.providerUserId} onChange={set('providerUserId')}>
                  <option value="">Choose…</option>
                  {providers.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>{fe.providerUserId && <span className="text-red-600">{fe.providerUserId}</span>}
              </label>
            ) : <div className="text-[12px] text-stone-500 self-end pb-2">{editing ? 'On your list.' : 'Added to your list.'}</div>}
          </div>
          {/* Clearing the time takes the exam off the calendar and withdraws
              the provider's invitation — said here, because from the form it
              looks like it only blanks a box. */}
          {editing && editing.examTime && !f.examTime && (
            <p className="text-[12px] text-amber-700 mt-2">
              <i className="ti ti-alert-triangle mr-1" />
              Clearing the time removes this exam from the clinical calendar and withdraws the provider's invitation.
            </p>
          )}
          <div className="flex items-center gap-2 mt-3">
            <button className="btn" disabled={busy}>{busy ? 'Saving…' : (editing ? 'Save Changes' : 'Add Veteran')}</button>
            {editing && <button type="button" className="btn ghost" onClick={onCancel} disabled={busy}>Cancel</button>}
          </div>
        </form>
      );
    };
    // The rows come back already ordered by exam date, so grouping is a walk,
    // not a sort. Grouping here rather than on the server keeps the day screen
    // and this one reading ONE response shape.
    const groupVeteransByDate = (rows) => {
      const out = [];
      (rows || []).forEach(r => {
        const last = out[out.length - 1];
        if (last && last.date === r.examDate) last.rows.push(r);
        else out.push({ date: r.examDate, rows: [r] });
      });
      return out;
    };

    const VeteransView = () => {
      const [date, setDate] = useState(() => GFC_TIME.zonedParts(new Date()).isoDate);
      // 'day' is the exam-day screen. 'upcoming' is the forward schedule.
      // Status actions live in 'day' ONLY: marking somebody Seen on a date
      // three weeks out is a mis-click, so the forward view navigates to the
      // day instead of carrying the buttons — the same move the shift board
      // makes from its calendar into its list.
      const [mode, setMode] = useState('day');
      const [d, setD] = useState(null);
      const [err, setErr] = useState('');
      const [showAdd, setShowAdd] = useState(false);
      // The roster row open for editing. The PUT route has shipped since the
      // roster did and nothing ever called it, so a veteran added without a
      // time could never be given one — remove and re-add was the only way.
      const [editing, setEditing] = useState(null);
      const load = useCallback(() => {
        const q = mode === 'upcoming'
          ? `from=${date}&to=${GFC_TIME.addDays(date, 28)}`
          : `date=${date}`;
        authedFetch(`/api/veterans/roster?${q}`).then(r => { setD(r); setErr(''); }).catch(e => setErr(e.message));
      }, [date, mode]);
      // The day screen is a live board on an exam day, so it polls. The
      // forward schedule is planning: it would only flicker.
      useEffect(() => {
        load();
        if (mode !== 'day') return undefined;
        const t = setInterval(load, 30000);
        return () => clearInterval(t);
      }, [load, mode]);
      const openDay = (ymd) => { setDate(ymd); setMode('day'); };
      const setStatus = (row, status) => authedFetch(`/api/veterans/roster/${row.id}/status`, { method: 'POST', body: JSON.stringify({ status }) })
        .then(load).catch(e => setErr(e.message));
      const remove = (row) => {
        if (!window.confirm(`Remove ${row.firstName} ${row.lastName} from the list?`)) return;
        authedFetch(`/api/veterans/roster/${row.id}`, { method: 'DELETE' }).then(load).catch(e => setErr(e.message));
      };
      const rows = (d && d.rows) || [];
      const arrived = rows.filter(r => r.status === 'arrived').length;
      return (
        <div className="p-4 lg:p-7 max-w-5xl">
          <div className="flex flex-wrap items-center gap-3 mb-4">
            <h2 className="serif text-[24px] font-semibold text-primary mr-auto">Veterans{d && !d.office ? ' · My List' : ''}</h2>
            <div className="inline-flex rounded-lg border border-stone-300 overflow-hidden">
              <button type="button" aria-pressed={mode === 'day'}
                className={`px-3 py-1.5 text-sm ${mode === 'day' ? 'bg-primary text-white' : 'bg-white text-stone-600'}`}
                onClick={() => setMode('day')}>Exam Day</button>
              <button type="button" aria-pressed={mode === 'upcoming'}
                className={`px-3 py-1.5 text-sm border-l border-stone-300 ${mode === 'upcoming' ? 'bg-primary text-white' : 'bg-white text-stone-600'}`}
                onClick={() => setMode('upcoming')}>Upcoming</button>
            </div>
            <input type="date" className="border border-stone-300 rounded-lg px-3 py-1.5 text-sm" value={date} onChange={e => setDate(e.target.value)} />
            {/* One form on screen: opening Add closes an edit in progress,
                or two headings claim the same inputs. */}
            <button className="btn ghost" onClick={() => { setEditing(null); setShowAdd(s => !s); }}>{showAdd ? 'Close' : 'Add Veteran'}</button>
            {/* The claim-file analyzer is its own page: an IME case is not a patient and never appears in this workspace. */}
            <a className="btn ghost" href="/ime">IME Claim Files</a>
          </div>
          {err && <div className="card p-4 text-red-600 text-sm mb-4">{err}</div>}
          {(showAdd || editing) && d && (
            <VeteranAddForm date={date} providers={d.providers || []} office={d.office}
              editing={editing} onCancel={() => setEditing(null)}
              onAdded={() => { load(); }} />
          )}
          {!d && !err && <div className="card p-6 text-stone-500 text-sm">Loading…</div>}
          {d && (
            <>
              {mode === 'upcoming' && (
                <>
                  <p className="text-[13px] text-stone-500 mb-2">
                    {rows.length === 0
                      ? `No exams booked between ${fmtYmd(d.from)} and ${fmtYmd(d.to)}.`
                      : `${rows.length} exam${rows.length === 1 ? '' : 's'} across ${groupVeteransByDate(rows).length} day${groupVeteransByDate(rows).length === 1 ? '' : 's'} · ${fmtYmd(d.from)} to ${fmtYmd(d.to)}`}
                    {d.capped ? ` · shortened to ${d.maxRangeDays} days` : ''}
                  </p>
                  {groupVeteransByDate(rows).map(g => (
                    <div key={g.date} className="card overflow-hidden mb-3">
                      <button type="button" onClick={() => openDay(g.date)}
                        className="w-full text-left px-4 py-2.5 bg-stone-50 border-b border-stone-100 hover:bg-stone-100">
                        <span className="text-[14px] font-semibold text-primary">{fmtYmd(g.date)}</span>
                        <span className="text-[12.5px] text-stone-500"> · {g.rows.length} booked{g.date === d.today ? ' · today' : ''}</span>
                        <span className="text-[12.5px] text-primary float-right">Open day →</span>
                      </button>
                      {/* Read-only on purpose: Seen and No Show belong on the
                          exam day, not three weeks out. Open day carries you
                          to where those buttons live. */}
                      {g.rows.map(r => (
                        <div key={r.id} className="flex flex-wrap items-center gap-3 px-4 py-2.5 border-b border-stone-100 last:border-0">
                          <div className="min-w-0 flex-1">
                            <span className="text-[14.5px] font-semibold text-primary">{r.firstName} {r.lastName}</span>
                            <span className={`pill ml-2 ${VETERAN_STATUS_PILL[r.status] || ''}`}>{r.statusLabel}</span>
                            <div className="text-[12.5px] text-stone-600">DOB {fmtYmd(r.dob)} · {r.siteLabel}{d.office && r.providerName ? ` · ${r.providerName}` : ''}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  ))}
                </>
              )}
              {mode === 'day' && <>
              <p className="text-[13px] text-stone-500 mb-2">{rows.length} on the list · {arrived} waiting now</p>
              <div className="card overflow-hidden">
                {rows.length === 0 && <p className="text-sm text-stone-500 px-5 py-6">No veterans on the list for this day.</p>}
                {rows.map(r => (
                  <div key={r.id} className={`flex flex-wrap items-start gap-3 px-4 py-3.5 border-b border-stone-100 last:border-0 ${r.status === 'arrived' ? 'bg-emerald-50/40' : ''}`}>
                    <div className="w-11 h-11 rounded-xl flex items-center justify-center shrink-0 bg-primary/10 text-primary"><i className="ti ti-medal text-[20px]" /></div>
                    <div className="min-w-0 flex-1">
                      <div className="flex flex-wrap items-center gap-2">
                        <span className="text-[15px] font-semibold text-primary">{r.firstName} {r.lastName}</span>
                        <span className={`pill ${VETERAN_STATUS_PILL[r.status] || ''}`}>{r.statusLabel}</span>
                      </div>
                      <div className="text-[12.5px] text-stone-600">
                        {/* The slot first: on an exam day it is what a person
                            reads down the list for. "No set time" rather than
                            a blank, which reads as a missing value. */}
                        <span className={fmtSlot(r.examTime, r.durationMinutes) ? 'font-semibold text-primary' : 'text-stone-400'}>
                          {fmtSlot(r.examTime, r.durationMinutes) || 'No set time'}
                        </span>
                        {' · '}DOB {fmtYmd(r.dob)}{d.office && r.providerName ? ` · ${r.providerName}` : ''}
                      </div>
                      {r.arrivedAt && (
                        <div className="text-[12.5px] text-stone-700 mt-0.5">
                          Signed in {fmtTs(r.arrivedAt)}
                          {r.arrivalPhone && <> · <a className="font-semibold text-primary underline" href={`tel:${String(r.arrivalPhone).replace(/\D/g, '')}`}>{r.arrivalPhone}</a></>}
                          {r.arrivalEmail && <> · {r.arrivalEmail}</>}
                        </div>
                      )}
                    </div>
                    <div className="flex flex-wrap gap-2">
                      <button className="btn ghost !py-1 !px-3 text-xs" onClick={() => { setShowAdd(false); setEditing(editing && editing.id === r.id ? null : r); }}>
                        {editing && editing.id === r.id ? 'Close' : 'Edit'}
                      </button>
                      {r.status !== 'seen' && <button className="btn !py-1 !px-3 text-xs" onClick={() => setStatus(r, 'seen')}>Mark Seen</button>}
                      {r.status === 'expected' && <button className="btn ghost !py-1 !px-3 text-xs" onClick={() => setStatus(r, 'no_show')}>No Show</button>}
                      {(r.status === 'seen' || r.status === 'no_show') && <button className="btn ghost !py-1 !px-3 text-xs" onClick={() => setStatus(r, 'expected')}>Undo</button>}
                      {!r.arrivedAt && <button className="btn ghost !py-1 !px-3 text-xs" onClick={() => remove(r)}>Remove</button>}
                    </div>
                  </div>
                ))}
              </div>
              </>}
              {/* A provider is told about their own record only. */}
              {!d.office && d.providers && d.providers[0] && !d.providers[0].hasPhone && (
                <p className="text-[12px] text-stone-500 mt-2">Your user record has no mobile number, so arrivals come by email only. Ask an admin to add it.</p>
              )}
            </>
          )}
        </div>
      );
    };

    const OverdueOrders = ({ onOpenChart }) => {
      const [d, setD] = useState(null);
      const [err, setErr] = useState('');
      useEffect(() => { api.overdueOrders().then(r => { setD(r); setErr(''); }).catch(e => setErr(e.message)); }, []);
      if (err) return <div className="p-4 lg:p-7"><div className="card p-4 text-red-600 text-sm">{err}</div></div>;
      if (!d) return <div className="p-4 lg:p-7"><div className="card p-6 text-stone-500 text-sm">Loading…</div></div>;
      const rows = d.orders || [];
      const waitingAgency = d.agencyPending || [];
      // Every row opens the patient's Orders, where the send and the
      // destination are recorded. It used to open nothing at all.
      const openBtn = (o) => (o.clientId && onOpenChart
        ? <button className="btn ghost !py-1 !px-2.5 text-[12px] whitespace-nowrap" onClick={() => onOpenChart(o.clientId, { tab: 'orders' })}>Open Orders</button>
        : null);
      return (
        <div className="p-4 lg:p-7 max-w-4xl">
          {waitingAgency.length > 0 && (
            <div className="mb-5">
              <h2 className="serif text-[21px] font-semibold text-primary mb-2">Waiting on an Agency ({waitingAgency.length})</h2>
              <div className="card overflow-hidden">
                {waitingAgency.map(o => (
                  <div key={o.id} className="flex items-start gap-3 px-4 py-3.5 border-b border-stone-100 last:border-0">
                    <div className="w-11 h-11 rounded-xl flex items-center justify-center shrink-0 bg-amber-50 text-amber-700"><i className="ti ti-send text-[20px]" /></div>
                    <div className="min-w-0 flex-1">
                      <div className="text-[14px] font-semibold text-primary">Referral{o.specialty ? ` · ${o.specialty}` : ''}</div>
                      <div className="text-[12.5px] text-stone-600">{o.clientName || o.clientId}{o.orderReference ? ` · ${o.orderReference}` : ''}</div>
                      <div className="text-[12px] text-stone-500 mt-0.5">
                        Placed {fmtTs(o.createdAt)}{o.orderingClinician && o.orderingClinician.name ? ` by ${o.orderingClinician.name}` : ''}. No agency or fax yet, so nothing can be sent. Use Add Agency &amp; Fax on the order.
                      </div>
                    </div>
                    {openBtn(o)}
                  </div>
                ))}
              </div>
            </div>
          )}
          <h2 className="serif text-[21px] font-semibold text-primary mb-2">Sent, Never Answered ({rows.length})</h2>
          <div className="card overflow-hidden">
            {rows.length === 0 && <p className="text-sm text-stone-500 px-5 py-6">Nothing is overdue.</p>}
            {rows.map(o => (
              <div key={o.id} className="flex items-start gap-3 px-4 py-3.5 border-b border-stone-100 last:border-0">
                <div className="w-11 h-11 rounded-xl flex items-center justify-center shrink-0 bg-red-50 text-red-600"><i className="ti ti-clock-exclamation text-[20px]" /></div>
                <div className="min-w-0 flex-1">
                  <div className="flex flex-wrap items-center gap-2">
                    <span className="text-[14px] font-semibold text-primary capitalize">{o.orderType}</span>
                    <span className="pill bg-amber-50 text-amber-800 border-amber-200">{o.ageDays} days · limit {o.thresholdDays}</span>
                  </div>
                  <div className="text-[12.5px] text-stone-600">{o.clientName || o.clientId}{o.orderReference ? ` · ${o.orderReference}` : ''}{(o.tests || []).length ? ` · ${o.tests.join(', ')}` : ''}</div>
                  <div className="text-[12px] text-stone-500 mt-0.5">
                    Sent {fmtTs(o.sentAt)} to <b>{o.recipientName || 'an unnamed recipient'}</b>
                    {o.recipientFax ? <span> at <b>{String(o.recipientFax).replace(/(\d{3})(\d{3})(\d{4})/, '($1) $2-$3')}</b></span> : null}
                    {o.orderingClinician && o.orderingClinician.name ? ` · ordered by ${o.orderingClinician.name}` : ''}
                  </div>
                </div>
                {openBtn(o)}
              </div>
            ))}
          </div>
          <p className="text-[11.5px] text-stone-400 mt-2">
            Limits: {Object.entries(d.thresholds || {}).map(([k, v]) => `${k} ${v}d`).join(' · ')}.
          </p>
        </div>
      );
    };

    // ── Phase 3: the clinician confirms FACTS, never a code (2026-11-04) ──
    // AI reads the note into facts (Phase 2); the clinician confirms, corrects
    // or adds them; rules derive the level. The code appears only after
    // confirmation, with a sentence saying how it was reached. No dollar
    // amount anywhere. The draft notice is always shown in full while the AI
    // output is on screen (Gemini spec standing requirement).
    const MDM_STATUS_LABELS = Object.freeze({
      stable: 'Stable chronic illness', worsening: 'Chronic illness, worsening (exacerbation, progression or side effects)',
      new: 'New problem', resolved: 'Resolved, or self-limited or minor', unclear: 'Unclear'
    });
    const MDM_MANAGEMENT_LABELS = Object.freeze({ observation: 'Observation', medication: 'Medication', referral: 'Referral', testing: 'Testing', procedure: 'Procedure', other: 'Other' });
    const MDM_DATA_LABELS = Object.freeze({
      lab: 'Lab result reviewed or ordered', imaging: 'Imaging reviewed or ordered', outside_record: 'Outside record reviewed',
      prior_note: 'Prior GFC note reviewed', independent_historian: 'Independent historian', discussion_with_clinician: 'Discussion with another clinician',
      test_interpretation: 'Independent interpretation of a test'
    });
    const MDM_RISK_LABELS = Object.freeze({
      prescription_management: 'Prescription drug management', decision_re_hospitalization: 'Decision about hospitalization',
      decision_re_surgery: 'Decision about surgery', drug_therapy_monitoring: 'Drug therapy needing intensive monitoring for toxicity',
      social_determinants: 'Care limited by social determinants of health', otc_management: 'Over-the-counter drug management', other: 'Other'
    });
    // quoteSource 'list' means the words came from the problem or medication
    // list, not this visit's note (owner decision, 2026-11-04): shown, always.
    const FactQuote = ({ item }) => item.quote
      ? <div className="text-[11px] text-stone-500 italic mt-0.5">“{item.quote}”{item.quoteSource === 'list' ? <b className="not-italic text-amber-800"> From the problem or medication list, not this visit's note.</b> : ''}</div>
      : <div className="text-[11px] text-stone-400 mt-0.5">Added by you</div>;
    const FactSelect = ({ value, labels, onChange }) => (
      <select className="inp !py-1 text-xs" value={value} onChange={e => onChange(e.target.value)}>
        {Object.entries(labels).map(([k, l]) => <option key={k} value={k}>{l}</option>)}
      </select>
    );
    const VisitFactsPanel = ({ patientId, euuid, derivation, onChanged }) => {
      const [run, setRun] = useState(null);       // the latest extraction for this visit
      const [facts, setFacts] = useState(null);   // what the clinician is confirming
      const [result, setResult] = useState(derivation || null);
      const [busy, setBusy] = useState('');
      const [err, setErr] = useState('');
      const [affirm, setAffirm] = useState(false);
      const adopt = (rv) => {
        setRun(rv);
        if (rv && rv.status === 'done' && rv.output) {
          const o = rv.output;
          setFacts({
            problemsAddressed: (o.problemsAddressed || []).map(x => ({ ...x })), dataReviewed: (o.dataReviewed || []).map(x => ({ ...x })),
            risk: (o.risk || []).map(x => ({ ...x })),
            time: { statementPresent: !!(o.time && o.time.statementPresent), totalMinutes: o.time && o.time.totalMinutes != null ? String(o.time.totalMinutes) : '', quote: o.time && o.time.quote }
          });
        }
      };
      const findLatest = () => api.aiReviews(patientId).then(r => {
        const mine = (r.reviews || []).filter(x => x.purpose === 'mdm_extraction' && x.encounterUuid === euuid);
        return mine.length ? api.aiReview(patientId, mine[0].id).then(x => adopt(x.review)) : null;
      }).catch(e => setErr(e.message));
      useEffect(() => { findLatest(); }, [patientId, euuid]);
      useEffect(() => {
        if (!run || run.status !== 'running') return undefined;
        const t = setInterval(() => { api.aiReview(patientId, run.id).then(x => { if (x.review.status !== 'running') adopt(x.review); }).catch(() => {}); }, 4000);
        return () => clearInterval(t);
      }, [run && run.id, run && run.status]);
      const start = () => {
        setBusy('read'); setErr('');
        api.extractMdm(patientId, euuid).then(r => setRun({ id: r.reviewId, status: r.status })).catch(e => setErr(e.message)).finally(() => setBusy(''));
      };
      const setItem = (key, i, patch) => setFacts(f => ({ ...f, [key]: f[key].map((x, j) => (j === i ? { ...x, ...patch } : x)) }));
      const dropItem = (key, i) => setFacts(f => ({ ...f, [key]: f[key].filter((_, j) => j !== i) }));
      const addItem = (key, blank) => setFacts(f => ({ ...f, [key]: [...f[key], blank] }));
      const payload = () => ({
        problemsAddressed: facts.problemsAddressed.filter(x => String(x.description || '').trim()).map(({ description, status, management, quote }) => ({ description, status, management, ...(quote ? { quote } : {}) })),
        dataReviewed: facts.dataReviewed.filter(x => String(x.detail || '').trim()).map(({ kind, detail, quote }) => ({ kind, detail, ...(quote ? { quote } : {}) })),
        risk: facts.risk.filter(x => String(x.detail || '').trim()).map(({ factor, detail, quote }) => ({ factor, detail, ...(quote ? { quote } : {}) })),
        time: facts.time.statementPresent && /^\d+$/.test(String(facts.time.totalMinutes)) ? { statementPresent: true, totalMinutes: Number(facts.time.totalMinutes) } : { statementPresent: false }
      });
      const confirm = (extra) => {
        setBusy('confirm'); setErr('');
        api.emDerive(patientId, euuid, { extractionId: run.id, facts: payload(), ...(extra || {}) })
          .then(r => { setResult(r.emDerivation); setAffirm(false); onChanged && onChanged(); })
          .catch(e => setErr(e.message)).finally(() => setBusy(''));
      };
      const timeCand = result && (result.candidates || []).find(c => c.basis === 'time');
      // Time supports a higher level than decision making, so time is the
      // default (owner, 2026-11-04). The clinician may take the MDM level.
      const mdmCand = result && (result.candidates || []).find(c => c.basis === 'mdm');
      const usedTime = !!(result && timeCand && mdmCand && result.finalBasis === 'time' && timeCand.code !== mdmCand.code);
      return (
        <div className="card mb-4">
          <div className="card-h"><h2><i className="ti ti-list-check mr-1 text-accent" />Visit Facts</h2></div>
          <div className="p-4 grid gap-3 text-sm">
            <p className="text-xs text-stone-600">Confirm the facts of your visit: the problems you addressed, the data you reviewed, the risk, and the time. The level is worked out from what you confirm.</p>
            {!run && <button className="btn w-fit" disabled={!!busy} onClick={start}><i className="ti ti-sparkles" />{busy === 'read' ? 'Starting…' : 'Read My Note'}</button>}
            {run && run.status === 'running' && <p className="text-xs text-stone-500">Reading your note…</p>}
            {run && run.status === 'failed' && <p className="text-xs text-red-600">The note could not be read{run.error ? `: ${run.error}` : ''}. <button className="underline" onClick={start}>Try again</button></p>}
            {facts && (
              <>
                <div className="border-2 border-amber-400 bg-amber-50 rounded-lg p-2.5 text-[12.5px] text-amber-900">
                  <b>Drafted by AI from your note.</b> Unverified and not saved to the chart. Confirm, correct or remove each fact, and add anything it missed.
                </div>
                <div className="grid gap-2">
                  <b className="text-primary text-[13px]">Problems addressed</b>
                  {facts.problemsAddressed.map((x, i) => (
                    <div key={`p${i}`} className="border border-stone-200 rounded-lg p-2 grid gap-1">
                      <input className="inp !py-1 text-xs" value={x.description || ''} onChange={e => setItem('problemsAddressed', i, { description: e.target.value })} placeholder="Problem" />
                      <div className="flex flex-wrap gap-2">
                        <FactSelect value={x.status} labels={MDM_STATUS_LABELS} onChange={v => setItem('problemsAddressed', i, { status: v })} />
                        <FactSelect value={x.management} labels={MDM_MANAGEMENT_LABELS} onChange={v => setItem('problemsAddressed', i, { management: v })} />
                        <button className="btn ghost !py-1 !px-2 text-xs" onClick={() => dropItem('problemsAddressed', i)}>Remove</button>
                      </div>
                      <FactQuote item={x} />
                    </div>
                  ))}
                  <button className="btn ghost w-fit !py-1 text-xs" onClick={() => addItem('problemsAddressed', { description: '', status: 'stable', management: 'observation' })}><i className="ti ti-plus" />Add Problem</button>
                </div>
                <div className="grid gap-2">
                  <b className="text-primary text-[13px]">Data reviewed</b>
                  {facts.dataReviewed.map((x, i) => (
                    <div key={`d${i}`} className="border border-stone-200 rounded-lg p-2 grid gap-1">
                      <div className="flex flex-wrap gap-2">
                        <FactSelect value={x.kind} labels={MDM_DATA_LABELS} onChange={v => setItem('dataReviewed', i, { kind: v })} />
                        <button className="btn ghost !py-1 !px-2 text-xs" onClick={() => dropItem('dataReviewed', i)}>Remove</button>
                      </div>
                      <input className="inp !py-1 text-xs" value={x.detail || ''} onChange={e => setItem('dataReviewed', i, { detail: e.target.value })} placeholder="What was reviewed" />
                      <FactQuote item={x} />
                    </div>
                  ))}
                  <button className="btn ghost w-fit !py-1 text-xs" onClick={() => addItem('dataReviewed', { kind: 'lab', detail: '' })}><i className="ti ti-plus" />Add Data</button>
                </div>
                <div className="grid gap-2">
                  <b className="text-primary text-[13px]">Risk</b>
                  {facts.risk.map((x, i) => (
                    <div key={`r${i}`} className="border border-stone-200 rounded-lg p-2 grid gap-1">
                      <div className="flex flex-wrap gap-2">
                        <FactSelect value={x.factor} labels={MDM_RISK_LABELS} onChange={v => setItem('risk', i, { factor: v })} />
                        <button className="btn ghost !py-1 !px-2 text-xs" onClick={() => dropItem('risk', i)}>Remove</button>
                      </div>
                      <input className="inp !py-1 text-xs" value={x.detail || ''} onChange={e => setItem('risk', i, { detail: e.target.value })} placeholder="What it was" />
                      <FactQuote item={x} />
                    </div>
                  ))}
                  <button className="btn ghost w-fit !py-1 text-xs" onClick={() => addItem('risk', { factor: 'prescription_management', detail: '' })}><i className="ti ti-plus" />Add Risk</button>
                </div>
                <div className="grid gap-1">
                  <b className="text-primary text-[13px]">Time</b>
                  <label className="flex items-center gap-2 text-xs">
                    <input type="checkbox" checked={facts.time.statementPresent} onChange={e => setFacts(f => ({ ...f, time: { ...f.time, statementPresent: e.target.checked } }))} />
                    <span>The note states a total time for this date</span>
                  </label>
                  {facts.time.statementPresent && <input className="inp w-32 !py-1 text-xs" inputMode="numeric" value={facts.time.totalMinutes} onChange={e => setFacts(f => ({ ...f, time: { ...f.time, totalMinutes: e.target.value.replace(/[^0-9]/g, '').slice(0, 4) } }))} placeholder="Minutes" />}
                  {facts.time.quote && <div className="text-[11px] text-stone-500 italic">“{facts.time.quote}”</div>}
                </div>
                <button className="btn gold w-fit" disabled={!!busy} onClick={() => confirm()}><i className="ti ti-check" />{busy === 'confirm' ? 'Confirming…' : 'Confirm Facts'}</button>
              </>
            )}
            {result && (
              <div className="border border-emerald-200 bg-emerald-50 rounded-lg p-2.5 grid gap-1.5">
                <div className="text-[13px] text-emerald-900"><b>{result.finalCode}</b>, confirmed {fmtTs(result.at)}{result.by ? ` by ${result.by.name}` : ''}.</div>
                <div className="text-[12px] text-emerald-900">{result.explanation}</div>
                {usedTime && (
                  <div className="grid gap-1.5 border-t border-emerald-200 pt-1.5">
                    <div className="text-[12px] text-stone-700">Your note states {result.time.minutes} minutes, which supports {timeCand.code} by time. Decision making alone supports {mdmCand.code}. The higher supported level is used, and a biller reviews it.</div>
                    <button className="btn w-fit" disabled={!!busy || !facts} onClick={() => confirm({ chooseMdm: true })}>Use {mdmCand.code} Instead</button>
                  </div>
                )}
              </div>
            )}
            {err && <p className="text-xs text-red-600">{err}</p>}
          </div>
        </div>
      );
    };

    // Billing's view of the derived level: what the clinician confirmed, both
    // candidates, and the coder's flag with the evidence that was absent. The
    // flag is resolved here, with a note, and stays on the record resolved.
    // ── Phase 4.1: ICD-10 suggestions from the note (2026-11-04) ──
    // Each is quoted from the note and resolved against OpenEMR's ICD-10
    // table. The clinician adds one to this visit's diagnoses herself, and it
    // is not saved until she saves the coding. The draft notice is always shown
    // in full while suggestions are on screen.
    const DxSuggestionsPanel = ({ patientId, euuid, diagnoses, setDiagnoses }) => {
      const [run, setRun] = useState(null);
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState('');
      const [decided, setDecided] = useState({});
      const load = (id) => api.aiReview(patientId, id).then(x => setRun(x.review)).catch(e => setErr(e.message));
      useEffect(() => {
        api.aiReviews(patientId).then(r => {
          const mine = (r.reviews || []).filter(x => x.purpose === 'dx_suggestion' && x.encounterUuid === euuid);
          if (mine.length) load(mine[0].id);
        }).catch(() => {});
      }, [patientId, euuid]);
      useEffect(() => {
        if (!run || run.status !== 'running') return undefined;
        const t = setInterval(() => load(run.id), 4000);
        return () => clearInterval(t);
      }, [run && run.id, run && run.status]);
      useEffect(() => {
        const m = {};
        for (const d of ((run && run.findingDecisions) || [])) m[d.index] = d.decision;
        setDecided(m);
      }, [run && run.id, run && run.findingDecisions && run.findingDecisions.length]);
      const start = () => { setBusy(true); setErr(''); api.suggestDiagnoses(patientId, euuid).then(r => setRun({ id: r.reviewId, status: r.status })).catch(e => setErr(e.message)).finally(() => setBusy(false)); };
      const decide = (i, decision) => api.decideAiFindings(run.id, [{ index: i, decision }]).then(() => setDecided(m => ({ ...m, [i]: decision }))).catch(e => setErr(e.message));
      const has = (code) => diagnoses.some(d => d.code === code);
      // The clinician picks the code, from what OpenEMR returned for the wording.
      const accept = (c, i) => {
        if (!has(c.code)) setDiagnoses([...diagnoses, { code: c.code, description: c.description || '', source: 'ai_suggestion', problemUuid: null, primary: diagnoses.length === 0 }]);
        api.decideAiFindings(run.id, [{ index: i, decision: 'accepted', code: c.code }]).then(() => setDecided(m => ({ ...m, [i]: 'accepted' }))).catch(e => setErr(e.message));
      };
      const list = (run && run.status === 'done' && run.output && run.output.diagnoses) || [];
      return (
        <div className="mt-2 grid gap-1.5">
          {!run && <button className="btn ghost w-fit !py-1 text-xs" disabled={busy} onClick={start}><i className="ti ti-sparkles" />{busy ? 'Starting…' : 'Suggest Diagnoses From My Note'}</button>}
          {run && run.status === 'running' && <p className="text-xs text-stone-500">Reading your note…</p>}
          {run && run.status === 'failed' && <p className="text-xs text-red-600">The note could not be read{run.error ? `: ${run.error}` : ''}. <button className="underline" onClick={start}>Try again</button></p>}
          {run && run.status === 'done' && (
            <>
              <div className="border-2 border-amber-400 bg-amber-50 rounded-lg p-2 text-[12px] text-amber-900">
                <b>Drafted by AI from your note.</b> Unverified and not saved to the chart. The AI names no code: the codes below are OpenEMR's, and one is added only if you pick it and save.
              </div>
              {!list.length && <p className="text-xs text-stone-500">No suggestion survived the checks against the note and OpenEMR's ICD-10 table.</p>}
              {list.map((s, i) => (
                <div key={i} className="border border-stone-200 rounded-lg p-2 text-xs grid gap-1">
                  <div><b>{s.wording}</b></div>
                  <FactQuote item={s} />
                  {decided[i] === 'accepted' ? <span className="text-emerald-700">Added</span>
                    : decided[i] === 'dismissed' ? <span className="text-stone-400">Dismissed</span>
                      : <>
                        <span className="text-[11px] text-stone-600">OpenEMR's ICD-10 table returned these. Pick the one that fits, or dismiss.</span>
                        {s.candidates.map(c => (
                          <div key={c.code} className="flex flex-wrap items-center gap-2">
                            <button className="btn !py-0.5 !px-2 text-xs" disabled={has(c.code)} onClick={() => accept(c, i)}>{has(c.code) ? 'On This Visit' : 'Add'}</button>
                            <span><b>{c.code}</b> {c.description}</span>
                            {c.moreSpecificListed && <span className="text-[11px] text-amber-800">Unspecified; a more specific code is listed here.</span>}
                          </div>
                        ))}
                        <button className="btn ghost w-fit !py-0.5 !px-2 text-xs" onClick={() => decide(i, 'dismissed')}>Dismiss</button>
                      </>}
                </div>
              ))}
            </>
          )}
          {err && <p className="text-xs text-red-600">{err}</p>}
        </div>
      );
    };

    // ── Phase 4.2: the clinician's reason for a modifier (2026-11-04) ──
    // 25, 59 and the X modifiers sit on a line only with the rendering
    // clinician's recorded reason. She records it here; the claim does not
    // release without it.
    const ModifierReasonsPanel = ({ patientId, euuid, items, onChanged }) => {
      const [text, setText] = useState({});
      const [busy, setBusy] = useState('');
      const [err, setErr] = useState('');
      const open = (items || []).filter(x => !x.justification);
      if (!open.length) return null;
      const save = (x) => {
        setBusy(x.key); setErr('');
        api.justifyModifier(patientId, euuid, { code: x.code, modifier: x.modifier, text: text[x.key] || '' })
          .then(() => { setText(t => ({ ...t, [x.key]: '' })); onChanged && onChanged(); }).catch(e => setErr(e.message)).finally(() => setBusy(''));
      };
      return (
        <div className="card mb-4 border-amber-300">
          <div className="card-h"><h2><i className="ti ti-pencil mr-1 text-accent" />Modifier Reasons</h2></div>
          <div className="p-4 grid gap-2 text-sm">
            {open.map(x => (
              <div key={x.key} className="grid gap-1">
                <span className="text-xs text-stone-700">Modifier <b>{x.modifier}</b> is on <b>{x.code}</b>. Say why it applies, in your words.</span>
                <textarea className="inp text-xs" rows={2} maxLength={1000} value={text[x.key] || ''} onChange={e => setText(t => ({ ...t, [x.key]: e.target.value }))} />
                <button className="btn w-fit !py-1 text-xs" disabled={busy === x.key || String(text[x.key] || '').trim().length < 10} onClick={() => save(x)}>Record Reason</button>
              </div>
            ))}
            {err && <p className="text-xs text-red-600">{err}</p>}
          </div>
        </div>
      );
    };

    // ── Phase 4.2: what billing MAY add, and the TCM dates (2026-11-04) ──
    // Offers are never applied by the app. A person adds the code or modifier
    // on the coding screen, or does not.
    // The encounter panel: coding, Rx, orders, sign & close, addenda.
    // ── Session 4.12 Scope F5 — act from inside the encounter ──────────────
    // Mid-visit a clinician needs the rest of the chart: what this patient is
    // allergic to before prescribing, what they are already taking, what the
    // problem list says, whether the result that was chased has landed, and
    // somewhere to put the document just handed over. Every one of those lived
    // on a different tab, and getting to it meant leaving the encounter —
    // which on a phone in someone's front room means losing your place in the
    // visit you are documenting.
    //
    // IT MOUNTS THE EXISTING TAB COMPONENTS. Not a summary of them, not a
    // second rendering: the same components, reading the same chart, writing
    // through the same routes. A second view of "what is this patient
    // allergic to" is how the two start disagreeing, which is the rule the
    // allergy strip already follows one layer down.
    const LOOKUPS = [
      { key: 'allergies', label: 'Allergies', icon: 'ti-alert-triangle' },
      { key: 'medications', label: 'Medications', icon: 'ti-pill' },
      { key: 'problems', label: 'Problems', icon: 'ti-list-details' },
      { key: 'results', label: 'Results', icon: 'ti-flask' },
      { key: 'documents', label: 'Documents', icon: 'ti-file-text' }
    ];
    // ── Session 4.12 Scope G — the risk assessment ─────────────────────────
    // A psychiatric encounter cannot be SIGNED without one. Documenting is
    // never blocked, which is why this is a card on the visit rather than a
    // dialog in the way.
    //
    // The levels, the domains and WHICH of them need a plan are all SERVED.
    // A page that carries its own list of risk levels drifts from the
    // validator that refuses one it no longer knows, and the plan rule
    // restated here would be a second answer to a clinical question.
    const RISK_CHIP = {
      none: 'bg-emerald-50 text-emerald-700', low: 'bg-emerald-50 text-emerald-700',
      moderate: 'bg-amber-50 text-amber-800', high: 'bg-red-50 text-red-700', imminent: 'bg-red-600 text-white'
    };
    // ── Screenings (social work, 2026-10-11) ───────────────────────────────
    // PHQ-2, PHQ-9, GAD-7 and a social-needs screen. The instruments, their
    // ranges and the needs list are SERVED; this records the total and, for a
    // PHQ-9, item 9. A protocol is optional: naming one records the screening
    // under that standing order. Module scope (react_input_focus).
    const ScreeningCard = ({ d, patient, euuid, locked, busy, onSave }) => {
      const canScreen = useCan('screeningInstrument');
      const [catalog, setCatalog] = useState([]);
      const [protocols, setProtocols] = useState([]);
      const [open, setOpen] = useState(false);
      const blank = { instrument: '', score: '', item9: '', needs: [], notes: '', standingOrderId: '', diagnosisCodes: [] };
      const [f, setF] = useState(blank);
      useEffect(() => {
        if (!canScreen) return;
        api.screeningCatalog().then(r => setCatalog((r && r.instruments) || [])).catch(() => {});
        api.myStandingOrders()
          .then(r => setProtocols(((r && r.standingOrders) || []).filter(o => (o.executableOrderTypes || []).includes('screening'))))
          .catch(() => setProtocols([]));
      }, [canScreen]);
      const inst = catalog.find(c => c.key === f.instrument) || null;
      const rows = d.screenings || [];
      const dx = (d.record && d.record.diagnoses) || [];
      const toggle = (k, v) => setF(p => ({ ...p, [k]: p[k].includes(v) ? p[k].filter(x => x !== v) : [...p[k], v] }));
      const save = () => onSave({
        instrument: f.instrument, notes: f.notes,
        ...(inst && inst.needs ? { needs: f.needs } : { score: f.score }),
        ...(inst && inst.asksItem9 ? { item9: f.item9 } : {}),
        ...(f.standingOrderId ? { standingOrderId: f.standingOrderId, diagnosisCodes: f.diagnosisCodes } : {})
      }).then(r => { if (r) { setF(blank); setOpen(false); } return r; });
      if (!rows.length && (!canScreen || locked)) return null;
      return (
        <div className="card mb-4">
          <div className="card-h">
            <h2><i className="ti ti-list-check mr-1 text-accent" />Screenings</h2>
            {rows.length > 0 && <span className="chip bg-primary-50 text-primary">{rows.length} recorded</span>}
          </div>
          <div className="p-4 text-sm grid gap-2">
            {rows.map(r => (
              <div key={r.id} className="text-xs">
                <b className={r.positive ? 'text-amber-800' : 'text-stone-700'}>{r.summary}</b>
                {r.needsRisk && <span className="chip bg-red-50 text-red-700 ml-2">Risk assessment required</span>}
                <div className="text-[11px] text-stone-500">{npiLabel(r.recordedBy)} · {fmtTs(r.at)}{r.standingOrder ? ` · under standing order "${r.standingOrder.title}" v${r.standingOrder.version}` : ''}</div>
                {r.notes && <div className="whitespace-pre-wrap text-[12.5px] mt-0.5">{r.notes}</div>}
              </div>
            ))}
            {!rows.length && <p className="text-xs text-stone-500">None recorded on this visit. A screening recorded here counts for the note's screening section and is copied into the note in OpenEMR.</p>}
            {canScreen && !locked && !open && <button className="btn ghost !py-1 !px-2.5 text-xs w-fit" onClick={() => setOpen(true)}>Record Screening</button>}
            {canScreen && !locked && open && (
              <div className="grid gap-3 border-t border-stone-100 pt-3">
                <div className="grid md:grid-cols-3 gap-2">
                  <Field label="Screening">
                    <select className="inp" value={f.instrument} onChange={e => setF({ ...blank, standingOrderId: f.standingOrderId, diagnosisCodes: f.diagnosisCodes, instrument: e.target.value })}>
                      <option value="">— choose —</option>
                      {catalog.map(c => <option key={c.key} value={c.key}>{c.label}</option>)}
                    </select>
                  </Field>
                  {inst && !inst.needs && (
                    <Field label={`Total score (${inst.min}–${inst.max})`}>
                      <input className="inp" type="number" min={inst.min} max={inst.max} value={f.score} onChange={e => setF(p => ({ ...p, score: e.target.value }))} />
                    </Field>
                  )}
                  {inst && inst.asksItem9 && (
                    <Field label="Item 9: thoughts of self-harm (0–3)">
                      <input className="inp" type="number" min="0" max="3" value={f.item9} onChange={e => setF(p => ({ ...p, item9: e.target.value }))} />
                    </Field>
                  )}
                </div>
                {inst && inst.needs && (
                  <div className="flex flex-wrap gap-3 text-xs">
                    {inst.needs.map(n => (
                      <label key={n.key} className="flex items-center gap-1">
                        <input type="checkbox" checked={f.needs.includes(n.key)} onChange={() => toggle('needs', n.key)} />{n.label}
                      </label>
                    ))}
                    <span className="text-stone-500 w-full">Leave all unticked if the client named no needs.</span>
                  </div>
                )}
                {inst && inst.asksItem9 && Number(f.item9) > 0 &&
                  <p className="text-xs font-semibold text-red-700">Item 9 above 0: complete the risk assessment on this visit before it can be signed.</p>}
                {protocols.length > 0 && (
                  <Field label="Standing order (optional)">
                    <select className="inp" value={f.standingOrderId} onChange={e => setF(p => ({ ...p, standingOrderId: e.target.value }))}>
                      <option value="">No protocol — my own licence</option>
                      {protocols.map(o => <option key={o.id} value={o.id}>{o.title} (v{o.version})</option>)}
                    </select>
                  </Field>
                )}
                {f.standingOrderId && (
                  <div className="text-xs">
                    <span className="lblu block mb-1">Indication (a diagnosis on this encounter the protocol lists)</span>
                    {dx.length ? dx.map(x => (
                      <label key={x.code} className="flex items-center gap-1">
                        <input type="checkbox" checked={f.diagnosisCodes.includes(x.code)} onChange={() => toggle('diagnosisCodes', x.code)} />{x.code} {x.description}
                      </label>
                    )) : <span className="text-stone-500">Add the indication (for example Z13.31) to this encounter's diagnoses first.</span>}
                  </div>
                )}
                <Field label="Notes (optional)"><textarea className="inp" rows={2} value={f.notes} onChange={e => setF(p => ({ ...p, notes: e.target.value }))} /></Field>
                <div className="flex gap-2">
                  <button className="btn" disabled={busy || !f.instrument} onClick={save}>{busy ? 'Saving…' : 'Save Screening'}</button>
                  <button className="btn ghost" onClick={() => { setF(blank); setOpen(false); }}>Cancel</button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };
    const RiskCard = ({ d, patient, euuid, locked, busy, onSave }) => {
      const latest = d.riskAssessment;
      const [open, setOpen] = useState(false);
      const [f, setF] = useState(() => ({
