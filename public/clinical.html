        <div className="flex items-center justify-between mb-2">
          <span className="text-[13px] font-semibold text-primary">{text}</span>
          {note && <span className="text-[10.5px] text-stone-500">{note}</span>}
        </div>
      );
      // One block of the note. A plain function, NOT a component, for the
      // react_input_focus reason above.
      const systemsGrid = () => (
        <div className={`grid md:grid-cols-2 gap-3 ${isCarried('hp.systemsExam') ? 'carried rounded-lg p-2' : ''}`}>
          {Object.keys(f.systemsExam).map(k => (
            <TextArea f={f} set={set} key={k} path={`systemsExam.${k}`} label={k === 'lungSounds' ? 'Lung sounds' : k.charAt(0).toUpperCase() + k.slice(1)} />
          ))}
          <div className="md:col-span-2">{carriedMark('hp.systemsExam')}</div>
        </div>
      );
      const hpBlock = (block, label) => {
        switch (block) {
          case 'chiefConcern': return (
            <div className="grid gap-3">
              <Prefilled fieldKey="chiefConcern" confirmed={confirmed} onConfirm={confirm}>
                <FormattedField label={label || 'Chief concern'} value={f.chiefConcern} onChange={v => set('chiefConcern', v)}
                  carried={isCarried('chiefConcern')} onConfirmCarried={() => sn.confirm('chiefConcern')} />
              </Prefilled>
              {(pf.conditions || []).length > 0 && (
                <Prefilled fieldKey="conditions" confirmed={confirmed} onConfirm={confirm}>
                  <span className="lblu block mb-1">Family-reported conditions (intake)</span>
                  <div className="flex flex-wrap gap-1.5">{pf.conditions.map((c, i) => <span key={i} className="chip bg-primary-50 text-primary">{c}</span>)}</div>
                </Prefilled>
              )}
            </div>
          );
          case 'subjective': return (
            <FormattedField label={label || 'Subjective / history'} minRows={3} value={f.subjective} onChange={v => set('subjective', v)}
              carried={isCarried('subjective')} onConfirmCarried={() => sn.confirm('subjective')} />
          );
          case 'vitals': return (
            <div>
              {blockTitle(label || 'Vitals', 'BP in both arms (§2C) — or mark an arm unable to take')}
              {bpArm('bpRight', 'right')}
              {bpArm('bpLeft', 'left')}
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 mt-2">
                <VitalInput f={f} set={set} k="hr" label="Heart rate" /><VitalInput f={f} set={set} k="temp" label="Temp (°F)" /><VitalInput f={f} set={set} k="rr" label="Resp rate" /><VitalInput f={f} set={set} k="spo2" label="SpO₂ (%)" />
                <VitalInput f={f} set={set} k="weight" label="Weight (lb)" /><VitalInput f={f} set={set} k="height" label="Height (in)" />
              </div>
            </div>
          );
          // The H&P systems grid on its own: how a follow-up draft that already
          // holds one keeps showing it.
          case 'systemsGrid': return (
            <div>
              {blockTitle(label || 'Systems exam')}
              {systemsGrid()}
            </div>
          );
          case 'exam': return (
            <div>
              {blockTitle(label || 'Systems exam')}
              {systemsGrid()}
              <div className="mt-3">
                <FormattedField label="Other exam findings" value={f.objective} onChange={v => set('objective', v)}
                  carried={isCarried('objective')} onConfirmCarried={() => sn.confirm('objective')} />
              </div>
            </div>
          );
          // Offered where THIS VISIT's type is psychiatric, and nowhere else —
          // the caller only passes it then. The systems exam still applies.
          case 'mse': return (
            <div>
              {blockTitle(label || 'Mental status exam', 'the systems exam still applies')}
              <div className={`grid md:grid-cols-2 gap-3 ${isCarried('hp.mentalStatusExam') ? 'carried rounded-lg p-2' : ''}`}>
                {Object.keys(f.mentalStatusExam).map(k => (
                  <TextArea f={f} set={set} key={k} path={`mentalStatusExam.${k}`} label={k.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase())} />
                ))}
                <div className="md:col-span-2">{carriedMark('hp.mentalStatusExam')}</div>
              </div>
            </div>
          );
          case 'assessment': return (
            <FormattedField label={label || 'Assessment'} minRows={3} value={f.assessment} onChange={v => set('assessment', v)}
              carried={isCarried('assessment')} onConfirmCarried={() => sn.confirm('assessment')} />
          );
          case 'plan': return (
            <FormattedField label={label || 'Plan'} minRows={3} value={f.plan} onChange={v => set('plan', v)}
              carried={isCarried('plan')} onConfirmCarried={() => sn.confirm('plan')} />
          );
          case 'skinWound': return (
            <div className="grid gap-3">
              {blockTitle('Skin & wound')}
              <TextArea f={f} set={set} path="skinWound.findings" label="Skin findings" />
              <Field label="Wound present?">
                <select className="inp" value={f.skinWound.woundPresent} onChange={e => set('skinWound.woundPresent', e.target.value)}>
                  <option value="no">No</option><option value="yes">Yes</option>
                </select>
              </Field>
              {f.skinWound.woundPresent === 'yes' && (
                <div className="grid md:grid-cols-2 gap-3">
                  <TextArea f={f} set={set} path="skinWound.woundLocation" label="Location" />
                  <TextArea f={f} set={set} path="skinWound.woundMeasurements" label="Measurements (L × W × D cm)" />
                </div>
              )}
              {carriedMark('hp.skinWound')}
            </div>
          );
          case 'pain': return (
            <div>
              {blockTitle('Pain assessment (PAINAD-style)', '0–2 each')}
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                {painFields.map(k => (
                  <Field key={k} label={k.replace(/([A-Z])/g, ' $1')}>
                    <select className="inp" value={f.painAssessment[k]} onChange={e => set(`painAssessment.${k}`, e.target.value)}>
                      <option value="">—</option><option>0</option><option>1</option><option>2</option>
                    </select>
                  </Field>
                ))}
                <Field label="Total score">
                  <input className="inp" readOnly value={painFields.reduce((s, k) => s + (parseInt(f.painAssessment[k], 10) || 0), 0)} />
                </Field>
                <div className="sm:col-span-2 md:col-span-3">{carriedMark('hp.painAssessment')}</div>
              </div>
            </div>
          );
          case 'hazards': return (
            <div>
              {blockTitle('Home-hazard inventory')}
              {(pf.homeSafetyFlags || []).length > 0 && (
                <Prefilled fieldKey="homeSafetyFlags" confirmed={confirmed} onConfirm={confirm}>
                  <span className="lblu block mb-1">Intake staff-safety flags</span>
                  <div className="flex flex-wrap gap-1.5">{pf.homeSafetyFlags.map((c, i) => <span key={i} className="chip bg-amber-50 text-amber-800">{c}</span>)}</div>
                </Prefilled>
              )}
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 mt-3">
                {hazardFields.map(([k, hl]) => (
                  <Field key={k} label={hl}>
                    <select className="inp" value={f.homeHazards[k]} onChange={e => set(`homeHazards.${k}`, e.target.value)}>
                      <option value="">—</option><option value="present_working">Present / working</option>
                      <option value="present_not_working">Present, not working</option><option value="absent">Absent</option>
                      <option value="na">N/A</option>
                    </select>
                  </Field>
                ))}
              </div>
              <div className="mt-3"><TextArea f={f} set={set} path="homeHazards.notes" label="Hazard notes" /></div>
              {carriedMark('hp.homeHazards')}
            </div>
          );
          case 'triage': return (
            <div>
              {blockTitle('RN triage')}
              {carriedMark('hp.triage')}
              <div className="grid md:grid-cols-2 gap-3">
                <Field label="Track assignment (RN triage)">
                  <select className="inp" value={f.triage.track} onChange={e => set('triage.track', e.target.value)}>
                    <option value="">— keep current ({patient.careTier || 'unset'})</option>
                    <option value="A1">A1 — Essential ADL</option><option value="A2">A2 — Comprehensive ADL &amp; IADL</option>
                    <option value="A3">A3 — IADL-Forward Support</option><option value="A4">A4 — Behavioral &amp; Cognitive</option>
                    <option value="B">B — Skilled Nursing</option>
                  </select>
                </Field>
                <TextArea f={f} set={set} path="triage.rationale" label="Triage rationale" />
              </div>
            </div>
          );
          default: return null;
        }
      };
      return (
        <div className={embedded ? '' : 'max-w-3xl mx-auto'}>
          {!embedded && !givenEid && !sn.euuid && !encounterUuid && <VisitAppointmentPicker patientId={patient.id} value={pickedEid} onChange={(eid) => { setPickedEid(eid); set('visitDate', eid ? '' : todayYmd()); }} />}
          {appointmentEid && !sn.euuid && (
            <div className="card p-3 mb-4 flex items-center gap-2 text-sm text-primary">
              <i className="ti ti-calendar-check text-accent" />
              Documenting from a scheduled appointment — the Encounter will be linked to it on the chart.
            </div>
          )}
          {!embedded && (
            <div className="mb-4">
              <h1 className="cw-title !text-[28px] lg:!text-[32px]">{sn.euuid ? 'Encounter Draft' : 'New Encounter'}</h1>
              <div className="text-[13px] text-stone-500">
                {[patient && patient.name, new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })].filter(Boolean).join(' · ')}
              </div>
            </div>
          )}
          {sn.euuid && (
            <div className="card p-3 mb-4 text-xs text-stone-600 flex flex-wrap items-center gap-2">
              <span className="chip bg-amber-50 text-amber-800">DRAFT · v{sn.meta.version}</span>
              {sn.meta.narrativeSyncError
                ? <span className="text-red-700">Saved in the app, but OpenEMR did not take the latest version ({sn.meta.narrativeSyncError}). Save draft again to retry.</span>
                : 'Saved to the app and OpenEMR. Anyone writing on this chart can keep editing it until it is signed.'}
            </div>
          )}
          {sn.conflict && (
            <NoteConflict conflict={sn.conflict}
              onUseTheirs={() => { sn.setConflict(null); sn.load().then(r => r && r.note && applyNote(r.note)); }}
              onKeepMine={() => { setBusy('draft'); sn.save(toNote(), { overwrite: sn.conflict }).then(r => setMsg({ ok: true, text: `${r.message}. Your version replaced theirs; both saves are in the note history.` })).catch(e => setMsg({ ok: false, text: e.message })).finally(() => setBusy(false)); }} />
          )}
          {!showCarry && (
            <button className="btn ghost !py-1.5 text-xs mb-3" onClick={() => setShowCarry(true)}>
              <i className="ti ti-copy" />Copy Previous Note
            </button>
          )}
          {showCarry && <CarryForwardPicker patientId={patient.id} excludeEuuid={sn.euuid} onPick={pickCarry} onClose={() => setShowCarry(false)} />}
          {/* FIRST, because it decides everything below it. */}
          <div className="card mb-4">
            <div className="card-h">
              <h2><i className="ti ti-clipboard-list mr-1 text-accent" />Visit</h2>
              {visitType && <span className="chip bg-primary-50 text-primary">{visitType.defaultMinutes} min</span>}
            </div>
            <div className="p-4 grid md:grid-cols-4 gap-3 text-sm">
              <Field label="Visit Type">
                <select className="inp" value={visit.appointmentType} onChange={e => chooseType(e.target.value)}>
                  <option value="">— choose —</option>
                  {(catalog ? catalog.services : []).map(svc => (
                    <optgroup key={svc.key} label={svc.label}>
                      {(catalog.appointmentTypes || []).filter(t => t.service === svc.key && t.canDocument !== false).map(t => (
                        <option key={t.key} value={t.key}>{t.label}</option>
                      ))}
                    </optgroup>
                  ))}
                </select>
              </Field>
              <Field label="Visit Mode">
                <select className="inp" value={visit.modality} onChange={e => setVisit(v => ({ ...v, modality: e.target.value, location: e.target.value === 'phone' ? '' : v.location }))}>
                  {(catalog ? catalog.modalities : [])
                    // Phone is only ever offered where the type allows it.
                    .filter(m => m.key !== 'phone' || (allowedModalities && allowedModalities.includes('phone')))
                    .map(m => (
                    <option key={m.key} value={m.key}
                      disabled={allowedModalities ? !allowedModalities.includes(m.key)
                        : (m.key === 'telehealth' && visitType && !visitType.telehealthAllowed)}>{m.label}</option>
                  ))}
                </select>
              </Field>
              <Field label="Encounter Date">
                {sn.euuid
                  ? <div className="inp bg-stone-50 text-stone-600">{f.visitDate ? fmtDate(f.visitDate) : 'Set when the note was saved'}</div>
                  : appointmentEid && !f.visitDate
                    ? <div className="inp bg-stone-50 text-stone-500">The appointment's date</div>
                    : <input className="inp" type="date" value={f.visitDate || ''} max={todayYmd()} onChange={e => set('visitDate', e.target.value)} />}
              </Field>
              <Field label="Visit Location">
                {isPhone
                  ? <div className="inp bg-stone-50 text-stone-500">Not needed for a phone call</div>
                  : <select className="inp" value={visit.location} onChange={e => setVisit(v => ({ ...v, location: e.target.value }))}>
                      <option value="">— choose —</option>
                      {(catalog ? catalog.locations : []).map(l => <option key={l.key} value={l.key}>{l.label}</option>)}
                    </select>}
              </Field>
            </div>
            <div className="px-4 pb-4 text-[11px] text-stone-500 grid gap-1">
              {!visit.appointmentType && <span>Choose a type and the note below will ask for what that visit needs.</span>}
              {catalog && catalog.usualLocation && visit.location === catalog.usualLocation &&
                <span>Location pre-filled from this patient's usual one. Change it if today is different.</span>}
              {visit.modality === 'telehealth' && visitType && visitType.telehealthPayerCaveat &&
                <span className="text-amber-700"><i className="ti ti-alert-triangle mr-1" />
                  Telehealth for this visit type depends on current CMS flexibilities. Confirm with the payer before billing.</span>}
              {visit.modality === 'telehealth' &&
                <span>Vitals and exam findings recorded on a video visit are marked as patient-reported.</span>}
              {isPhone && visitType && visitType.key === 'pc_phone_ccm' &&
                <span>A phone call is one open note. Include the minutes spent on the call — care management is billed on time across the month.</span>}
              {visitType && visitType.noteShape === 'sections' && visitType.key !== 'pc_phone_ccm' &&
                <span>This note is only the sections below: no vitals or physical exam. Record the minutes spent, and complete the risk assessment on the encounter where it is required.</span>}
            </div>
          </div>

          {/* THE NOTE — one continuous note, in the order this visit type lists
              its sections (owner report, 2026-09-28). See noteLayout. */}
          <div className="card mb-4">
            <div className="card-h"><h2>{visitType ? visitType.label : 'Visit'} · Note</h2>
              {!visit.appointmentType && <span className="text-[10.5px] text-stone-500">choose the visit type above to lay the note out for it</span>}
            </div>
            <div className="p-4 grid gap-4">
              <DictationHint />
              {noteLayout({
                sections: noteSections,
                // A phone call is ONE open note box (owner, 2026-10-02). A
                // follow-up visit type is the SOAP note (owner, 2026-10-12).
                fixedBlocks: sectionsOnly
                  ? []
                  : followupForm ? SOAP_BLOCKS
                    : ['chiefConcern', 'subjective', 'vitals', 'exam', ...(noteHasSection('mentalStatusExam') ? ['mse'] : []), 'assessment', 'plan'],
                extraBlocks: sectionsOnly ? []
                  : followupForm ? legacyHpParts.map(k => HP_BLOCK_FOR_PART[k])
                    : ['skinWound', 'pain', 'hazards', 'triage'],
                extraLabel: followupForm ? 'More of this note' : 'Home visit assessment',
                stored: f.sections, labelFor: sectionLabelFor, typeLabel: visitType && visitType.label
              }).map((item, i) => (item.kind === 'heading'
                ? <NoteHeading key={`h-${i}`} label={item.label} />
                : item.kind === 'pointer'
                  ? <CardPointer key={`p-${item.section.key}`} section={item.section} card={item.card} />
                : item.kind === 'section'
                  ? renderOwnSection(item.section, f.sections, setSection, sn.pending, sn.confirm)
                  : <div key={`b-${item.block}`}>{followupForm && SOAP_BLOCKS.includes(item.block)
                    ? soapBlock({ block: item.block, label: item.label, patientReported: item.patientReported, f,
                        setText: (k, v) => set(k, v), setV: (k, v) => set(`vitals.${k}`, v), carried: isCarried, onConfirm: sn.confirm })
                    : hpBlock(item.block, item.label)}</div>))}
            </div>
          </div>

          {msg && <p className={`text-sm mb-3 ${msg.ok ? 'text-emerald-700' : 'text-red-600'}`}>{msg.text}</p>}
          {/* The actions stay in reach on a phone: pinned above the bottom
              bar while the note scrolls (owner mockup 10). */}
          <div className="card p-3 mb-2 sticky bottom-[72px] lg:bottom-3 z-10">
            <div className="flex flex-wrap items-center gap-2">
              <button className="btn" disabled={!!busy} onClick={() => saveDraft().catch(() => {})}>
                <i className="ti ti-device-floppy" />{busy === 'draft' ? 'Saving…' : 'Save Draft'}
              </button>
              <button className="btn gold" disabled={!!busy || !onSign} onClick={startSign}>
                <i className="ti ti-writing-sign" />Sign &amp; Submit
              </button>
              {(draftAt || sn.euuid) && (
                <button className="btn ghost text-red-600" disabled={!!busy} onClick={discardDraft}>
                  {busy === 'discard' ? (sn.euuid ? 'Deleting…' : 'Discarding…') : (sn.euuid ? 'Delete Encounter' : 'Discard Draft')}
                </button>
              )}
              <Hint className="w-full">
                <b>Save Draft</b> saves to the app and OpenEMR together, stamped with your name and the time — it does <b>not</b> sign, and anyone working on this chart can keep editing it.
                <b> Sign &amp; Submit</b> saves, then opens the Sign card where you attest and sign; after that, changes are addenda.
              </Hint>
            </div>
          </div>
          <div className="px-1 mb-3">
            {draftAt && !sn.euuid && <p className="text-[11px] text-stone-400 mt-1">Your unsaved copy from {fmtTs(draftAt)}{restored ? ' · restored into this form' : ''}.</p>}
            <NoteHistory revisions={sn.meta.revisions} />
          </div>
        </div>
      );
    };

    // ── Medication reconciliation tab ──
    const MedRecTab = ({ patient, onSaved }) => {
      // Reconciliation is an RN's or a provider's (medRec). A social worker
      // reads the list; offering them Save is offering a 403.
      const canWrite = useCan('medRec');
      const [data, setData] = useState(null);
      const [decisions, setDecisions] = useState({});
      const [busy, setBusy] = useState(false); const [msg, setMsg] = useState(null);
      const load = useCallback(() => { api.medrec(patient.id).then(setData).catch(e => setMsg({ ok: false, text: e.message })); }, [patient.id]);
      useEffect(load, [load]);
      // A failed load used to leave "Loading…" up forever with the error unseen.
      if (!data) return msg && !msg.ok ? <p className="text-sm text-red-600 p-4">{msg.text}</p> : <p className="text-sm text-stone-500 p-4">Loading…</p>;
      const { matched, familyOnly, emrOnly } = data.view;
      const decide = (key, action, med, emrUuid) => setDecisions(d => ({ ...d, [key]: { action, med, emrUuid } }));
      const rows = [
        ...matched.map((m, i) => ({ key: `m${i}`, label: m.family.name || m.family.title, sub: `${m.family.dose || ''} ${m.family.frequency || ''}`.trim(), src: 'Both', med: m.family, emrUuid: m.emr.uuid || m.emr.id })),
        ...familyOnly.map((m, i) => ({ key: `f${i}`, label: m.name || m.title, sub: `${m.dose || ''} ${m.frequency || ''}`.trim(), src: 'Family-reported only', med: m })),
        ...emrOnly.map((m, i) => ({ key: `e${i}`, label: m.title || m.name, sub: m.comments || '', src: 'OpenEMR only', med: { name: m.title || m.name }, emrUuid: m.uuid || m.id }))
      ];
      const save = () => {
        const list = rows.map(r => decisions[r.key] ? { ...decisions[r.key] } : { action: 'keep', med: r.med, emrUuid: r.emrUuid });
        setBusy(true); setMsg(null);
        api.medrecSave(patient.id, list)
          // Decisions are keyed by row POSITION, and the rows change once saved.
          // Keeping them re-sent an earlier "add" on the next Resolve (a second
          // copy in OpenEMR) and applied it to whatever row moved into that slot.
          .then(r => { setDecisions({}); setMsg({ ok: !r.emrResults.some(x => !x.ok), text: `${r.message}. Sent to OpenEMR: ${r.emrResults.filter(x => x.ok).length} of ${r.emrResults.length}.${r.emrResults.filter(x => !x.ok).map(x => ` ${x.med}: ${x.error}`).join('')}` }); load(); onSaved && onSaved(); })
          .catch(e => setMsg({ ok: false, text: e.message }))
          .finally(() => setBusy(false));
      };
      return (
        <div className="max-w-3xl mx-auto">
          <div className="card">
            <div className="card-h"><h2>Medication Reconciliation</h2>
              {!data.emrOk && <span className="chip bg-amber-50 text-amber-800">EMR list unavailable</span>}
            </div>
            <div className="p-4">
              {rows.length === 0 && <p className="text-sm text-stone-400">No medications reported anywhere.</p>}
              {rows.map(r => {
                const d = decisions[r.key];
                return (
                  <div key={r.key} className="flex flex-wrap items-center justify-between gap-2 py-2.5 border-b border-stone-100 last:border-0">
                    <div>
                      <div className="font-semibold text-[13px]">{r.label}</div>
                      <div className="text-xs text-stone-500">{r.sub} <span className="chip bg-primary-50 text-primary ml-1">{r.src}</span></div>
                    </div>
                    {canWrite && <div className="flex gap-1.5">
                      {['keep', 'add', 'discontinue'].map(a => (
                        <button key={a}
                          className={`chip border ${d && d.action === a ? 'bg-primary text-white border-primary' : 'bg-white text-primary border-stone-200'}`}
                          onClick={() => decide(r.key, a, r.med, r.emrUuid)}>
                          {a}
                        </button>
                      ))}
                    </div>}
                  </div>
                );
              })}
              {msg && <p className={`text-sm mt-3 ${msg.ok ? 'text-emerald-700' : 'text-red-600'}`}>{msg.text}</p>}
              {canWrite && <div className="flex flex-wrap items-center gap-2 mt-4">
                <button className="btn" disabled={busy || rows.length === 0} onClick={save}>
                  {busy ? 'Saving…' : 'Save to OpenEMR'}
                </button>
                <Hint className="w-full">Unmarked rows default to "keep". Every kept or added medication not already in OpenEMR is written to OpenEMR's prescriptions, marked as a home medication (not a new GFC prescription). "Discontinue" end-dates the OpenEMR row and removes it from the app's list.</Hint>
              </div>}
              {!canWrite && <p className="text-[11px] text-stone-400 mt-2">Read-only view — reconciliation is resolved by an RN or a provider.</p>}
            </div>
          </div>
        </div>
      );
    };

    // ── Care plan (format of 2026-10-14) ──
    // Eight blocks: problems, goals, interventions, medication management,
    // outside the practice, the service schedule, safety and escalation, and
    // review. Every option list comes from the server (`vocabulary`), so this
    // page restates none. A goal's status is updated on its own, without a new
    // version, so the family is never asked to re-sign for a status change.
    const cpTempId = (prefix) => `${prefix}-${Math.random().toString(36).slice(2, 12).padEnd(6, '0')}`;
    const cpLabel = (list, value) => ((list || []).find(o => o.value === value) || {}).label || value || '—';
    const cpLines = (s) => String(s || '').split('\n').map(x => x.trim()).filter(Boolean);
    const CP_STATUS_TONE = {
      not_started: 'bg-stone-100 text-stone-600', in_progress: 'bg-sky-50 text-sky-800', met: 'bg-emerald-50 text-emerald-700',
      not_met: 'bg-red-50 text-red-700', deferred: 'bg-amber-50 text-amber-800'
    };

    // The author form starts from the current plan, so a new version is an
    // edit rather than a retype. A brand-new plan starts from what intake holds.
    const carePlanFormFrom = (existing) => {
      const s = (existing && existing.structured) || null;
      const sug = ((existing && existing.derived) || {}).suggested || {};
      const withId = (rows, prefix) => (rows || []).map(r => ({ ...r, id: r.id || cpTempId(prefix) }));
      const problemItems = withId(s ? s.problemItems : [], 'p');
      return {
        problemItems: problemItems.length ? problemItems : [{ id: cpTempId('p'), text: '', chartProblemId: null, prognosis: '', expectedOutcome: '' }],
        goalItems: s && s.goalItems.length ? withId(s.goalItems, 'g').map(g => ({ ...g, status: g.status || 'not_started' }))
          : [{ id: cpTempId('g'), problemId: null, statement: '', measure: '', baseline: '', target: '', targetDate: null, priority: 'medium', patientStated: false, status: 'not_started' }],
        interventions: withId(s ? s.interventions : [], 'i'),
        medicationManagement: s ? { ...s.medicationManagement } : { managedBy: null, adherenceConcerns: '', pharmacy: sug.pharmacy || '' },
        outsideCare: s && !s.legacyFormat ? { externalTeam: [...s.outsideCare.externalTeam], communityServices: [...s.outsideCare.communityServices] }
          : { externalTeam: (sug.externalTeam || []).map(r => ({ handles: '', lastContact: null, ...r })), communityServices: [] },
        escalation: {
          callGfcWhen: s ? s.escalation.callGfcWhen.join('\n') : '',
          call911When: s ? s.escalation.call911When.join('\n') : '',
          callOrder: s ? s.escalation.callOrder.join('\n') : '',
          afterHours: s ? s.escalation.afterHours : '',
          hospitalPreference: (s && s.escalation.hospitalPreference) || sug.hospitalPreference || ''
        },
        // A new plan starts with the served defaults (effective today, review
        // every 90 days); a new version starts from the plan it replaces.
        review: s ? { ...s.review } : { ...(((existing && existing.newPlanDefaults) || {}).review || { cadence: null, nextReviewDate: null }) },
        eachVisit: s ? (s.eachVisit || []).join('\n') : '',
        visitFrequency: (s && s.visitFrequency) || '', visitDays: (s && s.visitDays) || [], visitTimes: (s && s.visitTimes) || '',
        duration: (s && s.duration) || '', chargePlanNote: (s && s.chargePlanNote) || '',
        effectiveDate: (s && s.effectiveDate) || ((existing && existing.newPlanDefaults) || {}).effectiveDate || '', targetDate: (s && s.targetDate) || ''
      };
    };

    // One-click pathway template (owner, 2026-10-14): ADDS the pathway's
    // problem, goals, interventions, caregiver tasks and warning signs to the
    // form. Nothing is overwritten, a line already there is not added twice,
    // and everything stays editable until the author signs. Sections the
    // client's service line does not have are skipped (and the save drops
    // them anyway).
    const applyPathway = (f, p, on) => {
      const isBlank = (x) => !String(x || '').trim();
      const has = (list, text) => list.some(x => String(x).trim().toLowerCase() === String(text).trim().toLowerCase());
      const problems = f.problemItems.filter(x => !isBlank(x.text));
      let problem = problems.find(x => x.text.trim().toLowerCase() === p.problem.text.toLowerCase());
      if (!problem) {
        problem = { id: cpTempId('p'), text: p.problem.text, chartProblemId: null,
          prognosis: on('problemDetail') ? p.problem.prognosis : '', expectedOutcome: on('problemDetail') ? p.problem.expectedOutcome : '' };
        problems.push(problem);
      }
      const goals = f.goalItems.filter(g => !isBlank(g.statement));
      const newGoalIds = [];
      for (const g of p.goals) {
        if (goals.some(x => x.statement.trim().toLowerCase() === g.statement.toLowerCase())) continue;
        const id = cpTempId('g');
        newGoalIds.push(id);
        goals.push({ id, problemId: problem.id, statement: g.statement,
          measure: on('goalMeasures') ? (g.measure || '') : '', baseline: '', target: on('goalMeasures') ? (g.target || '') : '',
          targetDate: null, priority: g.priority || 'medium', patientStated: !!g.patientStated, status: 'not_started' });
      }
      const interventions = f.interventions.filter(x => !isBlank(x.description));
      if (on('interventions')) {
        for (const iv of p.interventions) {
          if (interventions.some(x => x.code === iv.code)) continue;
          interventions.push({ id: cpTempId('i'), code: iv.code, goalIds: newGoalIds.slice(), description: iv.label,
            responsible: iv.responsible, responsibleName: '', frequency: iv.frequency, type: iv.type });
        }
      }
      const addLines = (text, lines) => {
        const cur = String(text || '').split('\n').map(x => x.trim()).filter(Boolean);
        for (const l of lines || []) if (!has(cur, l)) cur.push(l);
        return cur.join('\n');
      };
      return {
        ...f,
        problemItems: problems.length ? problems : f.problemItems,
        goalItems: goals.length ? goals : f.goalItems,
        interventions,
        eachVisit: on('eachVisit') ? addLines(f.eachVisit, p.eachVisit) : f.eachVisit,
        escalation: { ...f.escalation, callGfcWhen: addLines(f.escalation.callGfcWhen, p.callGfcWhen), call911When: addLines(f.escalation.call911When, p.call911When) }
      };
    };

    const CpSection = ({ title, required, children }) => (
      <div className="border-t border-stone-100 pt-4">
        <div className="serif text-[18px] font-semibold text-primary mb-2">{title}{required && <span className="text-[11px] font-normal text-red-600 ml-2">required</span>}</div>
        {children}
      </div>
    );

    // EVERY status this goal has ever carried, not just the current one.
    // The goal row shows `statusAt`/`statusBy`/`statusNote` — the last change
    // and nothing before it — so a goal that was met in September and slipped
    // back in October reads as though it had only ever been one thing. The
    // route has returned the whole trail since the status feature shipped and
    // nothing asked for it.
    //
    // It is a READ (requireClinicalRead), so a case manager sees it too; the
    // Update Status control beside it stays a writer's.
    const GoalHistory = ({ clientId, goal, vocab }) => {
      const [open, setOpen] = useState(false);
      const [rows, setRows] = useState(null);   // null = loading, [] = none, false = failed
      useEffect(() => {
        if (!open) return;
        let dead = false;
        setRows(null);
        api.goalHistory(clientId, goal.id)
          .then(r => { if (!dead) setRows((r && r.history) || []); })
          .catch(() => { if (!dead) setRows(false); });
        return () => { dead = true; };
      }, [open, clientId, goal.id]);
      if (!open) return <button className="text-[12px] text-primary underline" onClick={() => setOpen(true)}>History</button>;
      return (
        <div className="mt-2 rounded-xl border border-stone-200 bg-stone-50 p-3">
          <div className="flex items-center justify-between mb-1">
            <span className="text-[12px] font-semibold text-primary">Status history</span>
            <button className="text-[12px] text-primary underline" onClick={() => setOpen(false)}>Hide</button>
          </div>
          {rows === null && <p className="text-[12px] text-stone-500">Reading…</p>}
          {/* A failed read and an empty trail are different facts. */}
          {rows === false && <p className="text-[12px] text-red-600">The history could not be read. That is not the same as this goal never having changed.</p>}
          {Array.isArray(rows) && rows.length === 0 && (
            <p className="text-[12px] text-stone-500">No status change has been recorded on this goal yet.</p>
          )}
          {Array.isArray(rows) && rows.length > 0 && (
            <ul className="space-y-1.5">
              {rows.map((h, i) => (
                <li key={i} className="text-[12.5px]">
                  <span className={`chip ${CP_STATUS_TONE[h.status] || ''}`}>{cpLabel(vocab.goalStatuses, h.status)}</span>
                  {h.previous && <span className="text-stone-500"> from {cpLabel(vocab.goalStatuses, h.previous)}</span>}
                  <span className="text-stone-500"> · {fmtDate(h.at)}{h.byName ? ` · ${h.byName}` : ''}</span>
                  {h.planVersion ? <span className="text-stone-400"> · plan v{h.planVersion}</span> : null}
                  {h.note && <div className="text-stone-600">“{h.note}”</div>}
                </li>
              ))}
            </ul>
          )}
        </div>
      );
    };

    // One goal's status, changed without writing a new version.
    const GoalStatusControl = ({ clientId, goal, vocab, onDone }) => {
      const [open, setOpen] = useState(false);
      const [status, setStatus] = useState(goal.status || 'not_started');
      const [note, setNote] = useState('');
      const [busy, setBusy] = useState(false); const [err, setErr] = useState(null);
      const save = () => {
        setBusy(true); setErr(null);
        api.goalStatus(clientId, goal.id, { status, note })
          .then(() => { setOpen(false); setNote(''); onDone && onDone(); })
          .catch(e => setErr(e.message)).finally(() => setBusy(false));
      };
      if (!open) return <button className="text-[12px] text-primary underline" onClick={() => setOpen(true)}>Update Status</button>;
      return (
        <div className="grid gap-2 mt-2 rounded-xl border border-stone-200 p-3 bg-stone-50">
          <select className="inp" value={status} onChange={e => setStatus(e.target.value)}>
            {(vocab.goalStatuses || []).map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
          </select>
          <input className="inp" placeholder="Note (optional), e.g. down to 179 lb" value={note} onChange={e => setNote(e.target.value)} />
          {err && <p className="text-sm text-red-600">{err}</p>}
          <div className="flex gap-2">
            <button className="btn" disabled={busy} onClick={save}>{busy ? 'Saving…' : 'Save Status'}</button>
            <button className="btn ghost" onClick={() => setOpen(false)}>Cancel</button>
          </div>
          <p className="text-[11px] text-stone-500">A status update does not create a new version and does not ask the client to sign again.</p>
        </div>
      );
    };

    // The current plan, read-only, with the status control on each goal.
    const CarePlanView = ({ clientId, existing, canWrite, onChanged }) => {
      const cp = existing.structured;
      const vocab = existing.vocabulary || {};
      const derived = existing.derived || {};
      const problemText = (id) => ((cp.problemItems || []).find(p => p.id === id) || {}).text;
      const goalText = (id) => ((cp.goalItems || []).find(g => g.id === id) || {}).statement;
      const esc = cp.escalation || {};
      const mm = cp.medicationManagement || {};
      const oc = cp.outsideCare || { externalTeam: [], communityServices: [] };
      // The sections this client's service line has (served). A section the
      // line does not have is shown only if an older plan carries something in it.
      const show = ((vocab.sections || {})[String((existing.client && existing.client.serviceLine) || 'PHC').toUpperCase()]) || {};
      const on = (key, hasData) => show[key] !== false || !!hasData;
      return (
        <div className="grid gap-4 text-[13.5px]">
          {cp.legacyFormat && <div className="rounded-xl bg-amber-50 border border-amber-200 p-3 text-[12.5px] text-amber-900">This plan was written before the full format. Write a new version to add goal measures, status, interventions and escalation.</div>}
          <CpSection title="Problems">
            {(cp.problemItems || []).length ? <ul className="space-y-2">{cp.problemItems.map((p, i) => (
              <li key={p.id || i}>
                <div className="font-medium">{p.text}</div>
                {p.prognosis && <div className="text-stone-600"><span className="text-stone-500">Prognosis: </span>{p.prognosis}</div>}
                {p.expectedOutcome && <div className="text-stone-600"><span className="text-stone-500">Expected outcome: </span>{p.expectedOutcome}</div>}
              </li>))}</ul> : <p className="text-stone-400">No problems written.</p>}
          </CpSection>
          <CpSection title="Goals">
            {(cp.goalItems || []).length ? <ul className="space-y-3">{cp.goalItems.map((g, i) => (
              <li key={g.id || i} className="rounded-xl border border-stone-100 p-3">
                <div className="flex flex-wrap items-center gap-2">
                  {g.priority && !cp.legacyFormat && <span className="chip bg-[#F6EFE2] text-primary">{cpLabel(vocab.priorities, g.priority)}</span>}
                  {g.patientStated && <span className="chip bg-[#F6EFE2] text-primary">Patient's own goal</span>}
                  {g.status && <span className={`chip ${CP_STATUS_TONE[g.status] || ''}`}>{cpLabel(vocab.goalStatuses, g.status)}</span>}
                </div>
                <div className="mt-1 font-medium">{g.statement}</div>
                {g.problemId && problemText(g.problemId) && <div className="text-[12px] text-stone-500">For: {problemText(g.problemId)}</div>}
                {(g.measure || g.baseline || g.target || g.targetDate) && (
                  <div className="text-[12.5px] text-stone-600 mt-1">
                    {[g.measure && `Measure: ${g.measure}`, g.baseline && `Baseline ${g.baseline}`, g.target && `Target ${g.target}`, g.targetDate && `by ${fmtDate(g.targetDate)}`].filter(Boolean).join(' · ')}
                  </div>)}
                {g.statusAt && <div className="text-[12px] text-stone-500 mt-1">Status set {fmtDate(g.statusAt)}{g.statusBy ? ` by ${g.statusBy}` : ''}{g.statusNote ? ` — "${g.statusNote}"` : ''}</div>}
                {g.id && !cp.legacyFormat && (
                  <div className="flex items-center gap-3 mt-1">
                    {canWrite && <GoalStatusControl clientId={clientId} goal={g} vocab={vocab} onDone={onChanged} />}
                    {/* A read, so a case manager gets it too. */}
                    <GoalHistory clientId={clientId} goal={g} vocab={vocab} />
                  </div>
                )}
              </li>))}</ul> : <p className="text-stone-400">No goals written.</p>}
          </CpSection>
          {!cp.legacyFormat && on('interventions', (cp.interventions || []).length) && <CpSection title="Interventions">
            {(cp.interventions || []).length ? <ul className="space-y-2">{cp.interventions.map((iv, i) => (
              <li key={iv.id || i}>
                <div>{iv.description}</div>
                <div className="text-[12px] text-stone-500">
                  {[cpLabel(vocab.responsible, iv.responsible) + (iv.responsibleName ? ` (${iv.responsibleName})` : ''), cpLabel(vocab.frequencies, iv.frequency), cpLabel(vocab.interventionTypes, iv.type)].join(' · ')}
                  {(iv.goalIds || []).length > 0 && ` · for: ${iv.goalIds.map(goalText).filter(Boolean).join('; ')}`}
                </div>
              </li>))}</ul> : <p className="text-stone-400">None written.</p>}
          </CpSection>}
          {!cp.legacyFormat && on('medicationManagement', mm.managedBy) && <CpSection title="Medication Management">
            <div className="grid sm:grid-cols-2 gap-2 text-[13px]">
              <div><span className="text-stone-500">Last reconciled: </span>{derived.medicationsReconciled ? `${fmtDate(derived.medicationsReconciled.at)}${derived.medicationsReconciled.byName ? ` by ${derived.medicationsReconciled.byName}` : ''}` : 'Not yet'}</div>
              <div><span className="text-stone-500">Managed by: </span>{cpLabel(vocab.medManagedBy, mm.managedBy)}</div>
              <div><span className="text-stone-500">Pharmacy: </span>{mm.pharmacy || '—'}</div>
              <div className="sm:col-span-2"><span className="text-stone-500">Adherence concerns: </span>{mm.adherenceConcerns || 'None noted'}</div>
            </div>
          </CpSection>}
          {!cp.legacyFormat && on('outsideCare', oc.externalTeam.length || oc.communityServices.length) && <CpSection title="Outside the Practice">
            {oc.externalTeam.length === 0 && oc.communityServices.length === 0 && <p className="text-stone-400">None listed.</p>}
            {oc.externalTeam.length > 0 && <ul className="space-y-1 mb-2">{oc.externalTeam.map((t, i) => (
              <li key={i}>{[t.name, t.role, t.organization].filter(Boolean).join(', ')}{t.phone ? ` · ${t.phone}` : ''}{t.handles ? ` — ${t.handles}` : ''}{t.lastContact ? ` · last contact ${fmtDate(t.lastContact)}` : ''}</li>))}</ul>}
            {oc.communityServices.length > 0 && <ul className="space-y-1">{oc.communityServices.map((c, i) => (
              <li key={i}>{c.name} · {cpLabel(vocab.serviceStatuses, c.status)}{c.notes ? ` — ${c.notes}` : ''}</li>))}</ul>}
          </CpSection>}
          <CpSection title={on('eachVisit', (cp.eachVisit || []).length) ? `Each Visit (${(cp.eachVisit || []).length})` : 'Visit Schedule'}>
            {on('eachVisit', (cp.eachVisit || []).length) && ((cp.eachVisit || []).length ? <ul className="space-y-1">{cp.eachVisit.map((t, i) => <li key={i} className="flex gap-2"><span className="text-stone-400">{i + 1}.</span><span>{t}</span></li>)}</ul>
              : <p className="text-stone-400">No tasks written.</p>)}
            <div className="mt-2 grid sm:grid-cols-2 gap-2 text-[13px]">
              <div><span className="text-stone-500">Frequency: </span>{cp.visitFrequency || cp.visitSchedule || '—'}</div>
              <div><span className="text-stone-500">Days: </span>{(cp.visitDays || []).join(', ') || '—'}</div>
              <div><span className="text-stone-500">Times: </span>{cp.visitTimes || '—'}</div>
              <div><span className="text-stone-500">Duration: </span>{cp.duration || '—'}</div>
              <div><span className="text-stone-500">Effective: </span>{cp.effectiveDate ? fmtDate(cp.effectiveDate) : '—'}</div>
            </div>
          </CpSection>
          {!cp.legacyFormat && <CpSection title="Safety and Escalation">
            <div className="grid gap-2 text-[13px]">
              <div><span className="text-stone-500">Call GFC when: </span>{(esc.callGfcWhen || []).join('; ') || '—'}</div>
              <div><span className="text-stone-500">Call 911 when: </span>{(esc.call911When || []).join('; ') || '—'}</div>
              <div><span className="text-stone-500">Who to call, in order: </span>{(esc.callOrder || []).join(' → ') || '—'}</div>
              <div><span className="text-stone-500">After hours: </span>{esc.afterHours || '—'}</div>
              <div><span className="text-stone-500">Hospital preference: </span>{esc.hospitalPreference || '—'}</div>
              <div><span className="text-stone-500">Code status (from intake): </span>{derived.codeStatus || 'Not recorded at intake'}</div>
            </div>
          </CpSection>}
          {!cp.legacyFormat && <CpSection title="Review">
            <div className="grid sm:grid-cols-3 gap-2 text-[13px]">
              <div><span className="text-stone-500">Cadence: </span>{cpLabel(vocab.reviewCadences, (cp.review || {}).cadence)}</div>
              <div><span className="text-stone-500">Next review: </span>{(cp.review || {}).nextReviewDate ? fmtDate(cp.review.nextReviewDate) : '—'}</div>
              <div><span className="text-stone-500">Last reviewed: </span>{cp.authoredAt ? `${fmtDate(cp.authoredAt)}${cp.authoredBy ? ` by ${cp.authoredBy}` : ''}` : '—'}</div>
            </div>
          </CpSection>}
        </div>
      );
    };

    // Writing a new version. Rows are edited in place; ids ride along so goal
    // status carries over to the next version.
    const CarePlanForm = ({ clientId, existing, chartProblems, padRef, onSave, busy, msg, onCancel }) => {
      const [f, setF] = useState(() => carePlanFormFrom(existing));
      const vocab = existing.vocabulary || {};
      const cat = existing.catalog || {};
      const line = String((existing.client && existing.client.serviceLine) || 'PHC').toUpperCase();
      const reqs = (vocab.requirements || {})[line] || [];
      // Which sections this service line has (served; owner, 2026-10-14). The
      // save drops anything outside them, so the form does not offer it.
      const show = (vocab.sections || {})[line] || {};
      const on = (key) => show[key] !== false;
      const required = new Set(reqs.map(r => r.key));
      const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      const setRow = (key, i, patch) => setF(prev => ({ ...prev, [key]: prev[key].map((r, j) => (j === i ? { ...r, ...patch } : r)) }));
      const dropRow = (key, i) => setF(prev => ({ ...prev, [key]: prev[key].filter((_, j) => j !== i) }));
      const setNested = (key, patch) => setF(prev => ({ ...prev, [key]: { ...prev[key], ...patch } }));
      const setOcRow = (list, i, patch) => setF(prev => ({ ...prev, outsideCare: { ...prev.outsideCare, [list]: prev.outsideCare[list].map((r, j) => (j === i ? { ...r, ...patch } : r)) } }));
      const dropOcRow = (list, i) => setF(prev => ({ ...prev, outsideCare: { ...prev.outsideCare, [list]: prev.outsideCare[list].filter((_, j) => j !== i) } }));
      const addOcRow = (list, row) => setF(prev => ({ ...prev, outsideCare: { ...prev.outsideCare, [list]: [...prev.outsideCare[list], row] } }));
      const opts = (list) => (list || []).map(o => <option key={o.value} value={o.value}>{o.label}</option>);
      const submit = () => onSave({
        problemItems: f.problemItems.filter(p => p.text.trim()),
        goalItems: f.goalItems.filter(g => g.statement.trim()),
        interventions: f.interventions.filter(i => i.description.trim()),
        medicationManagement: f.medicationManagement,
        outsideCare: f.outsideCare,
        escalation: { ...f.escalation, callGfcWhen: cpLines(f.escalation.callGfcWhen), call911When: cpLines(f.escalation.call911When), callOrder: cpLines(f.escalation.callOrder) },
        review: f.review,
        eachVisit: cpLines(f.eachVisit), visitFrequency: f.visitFrequency, visitDays: f.visitDays, visitTimes: f.visitTimes,
        duration: f.duration, chargePlanNote: f.chargePlanNote,
        effectiveDate: f.effectiveDate || null, targetDate: f.targetDate || null
      });
      const goalChoices = f.goalItems.filter(g => g.statement.trim());
      return (
        <div className="p-4 grid gap-2">
          {reqs.length > 0 && <div className="text-[12px] text-stone-500">To save, this {line === 'PHC' ? 'home care' : 'clinical'} plan needs {reqs.map(r => r.label).join('; ')}.</div>}
          {(cat.pathways || []).length > 0 && (
            <div className="rounded-xl border border-stone-200 bg-[#FBF8F2] p-3">
              <div className="lblu mb-1.5">Start from a pathway</div>
              <div className="flex flex-wrap gap-1.5">
                {cat.pathways.map(p => (
                  <button key={p.key} type="button" className="chip border bg-white text-primary border-stone-200" title={`Based on: ${p.source}`}
                    onClick={() => setF(prev => applyPathway(prev, p, on))}><i className="ti ti-plus" />{p.label}</button>
                ))}
              </div>
              <details className="mt-1.5">
                <summary className="text-[11px] text-stone-500 cursor-pointer">Evidence behind these suggestions</summary>
                <ul className="text-[11px] text-stone-500 mt-1 space-y-0.5">
                  {cat.pathways.map(p => <li key={p.key}><b>{p.label}:</b> {p.source}</li>)}
                  <li><b>Interventions:</b> grouped by the Omaha System intervention categories (public-domain home health terminology).</li>
                  <li>Targets and warning signs are starting points. Individualize them for this patient.</li>
                </ul>
              </details>
              <p className="text-[11px] text-stone-500 mt-1.5">Adds the usual problem, goals, {on('interventions') ? 'interventions, ' : ''}{on('eachVisit') ? 'caregiver tasks ' : ''}and warning signs. Edit or remove anything before signing.</p>
            </div>
          )}
          <datalist id="cp-prognosis">{(cat.prognosisOptions || []).map(o => <option key={o} value={o} />)}</datalist>
          <datalist id="cp-outcomes">{(cat.expectedOutcomeOptions || []).map(o => <option key={o} value={o} />)}</datalist>

          <CpSection title="Problems" required={required.has('problems')}>
            {f.problemItems.map((p, i) => (
              <div key={p.id} className="grid gap-2 mb-3 rounded-xl border border-stone-100 p-3">
                <div className="flex gap-2">
                  <input className="inp flex-1" placeholder="Problem, e.g. Heart failure" value={p.text} onChange={e => setRow('problemItems', i, { text: e.target.value })} />
                  {chartProblems.length > 0 && (
                    <select className="inp w-40" value="" onChange={e => {
                      const cpRow = chartProblems.find(r => r.id === e.target.value);
                      if (cpRow) setRow('problemItems', i, { text: cpRow.title, chartProblemId: cpRow.id });
                    }}>
                      <option value="">From chart…</option>
                      {chartProblems.map(r => <option key={r.id} value={r.id}>{r.title}</option>)}
                    </select>)}
                  <button className="text-stone-400" onClick={() => dropRow('problemItems', i)} aria-label="Remove problem"><i className="ti ti-x" /></button>
                </div>
                {on('problemDetail') && <input className="inp" list="cp-prognosis" placeholder={`Prognosis${required.has('problemDetail') ? '' : ' (optional)'} — pick or type`} value={p.prognosis} onChange={e => setRow('problemItems', i, { prognosis: e.target.value })} />}
                {on('problemDetail') && <input className="inp" list="cp-outcomes" placeholder={`Expected outcome${required.has('problemDetail') ? '' : ' (optional)'} — pick or type`} value={p.expectedOutcome} onChange={e => setRow('problemItems', i, { expectedOutcome: e.target.value })} />}
              </div>))}
            <button className="btn ghost" onClick={() => setF(prev => ({ ...prev, problemItems: [...prev.problemItems, { id: cpTempId('p'), text: '', chartProblemId: null, prognosis: '', expectedOutcome: '' }] }))}><i className="ti ti-plus" />Add Problem</button>
          </CpSection>

          <CpSection title="Goals" required={required.has('goals')}>
            {f.goalItems.map((g, i) => (
              <div key={g.id} className="grid gap-2 mb-3 rounded-xl border border-stone-100 p-3">
                <div className="flex gap-2">
                  <input className="inp flex-1" placeholder="Goal in plain language" value={g.statement} onChange={e => setRow('goalItems', i, { statement: e.target.value })} />
                  <button className="text-stone-400" onClick={() => dropRow('goalItems', i)} aria-label="Remove goal"><i className="ti ti-x" /></button>
                </div>
                <div className="grid md:grid-cols-3 gap-2">
                  <select className="inp" value={g.problemId || ''} onChange={e => setRow('goalItems', i, { problemId: e.target.value || null })}>
                    <option value="">For which problem?</option>
                    {f.problemItems.filter(p => p.text.trim()).map(p => <option key={p.id} value={p.id}>{p.text}</option>)}
                  </select>
                  <select className="inp" value={g.priority || 'medium'} onChange={e => setRow('goalItems', i, { priority: e.target.value })}>{opts(vocab.priorities)}</select>
                  <select className="inp" value={g.status || 'not_started'} onChange={e => setRow('goalItems', i, { status: e.target.value })}>{opts(vocab.goalStatuses)}</select>
                </div>
                <div className={`grid gap-2 ${on('goalMeasures') ? 'md:grid-cols-4' : 'md:grid-cols-2'}`}>
                  {on('goalMeasures') && <input className="inp" placeholder={`Measure${required.has('goalMeasures') ? '' : ' (optional)'}`} value={g.measure} onChange={e => setRow('goalItems', i, { measure: e.target.value })} />}
                  {on('goalMeasures') && <input className="inp" placeholder="Baseline" value={g.baseline} onChange={e => setRow('goalItems', i, { baseline: e.target.value })} />}
                  {on('goalMeasures') && <input className="inp" placeholder={`Target${required.has('goalMeasures') ? '' : ' (optional)'}`} value={g.target} onChange={e => setRow('goalItems', i, { target: e.target.value })} />}
                  <input className="inp" type="date" aria-label="Target date" value={g.targetDate || ''} onChange={e => setRow('goalItems', i, { targetDate: e.target.value || null })} />
                </div>
                <label className="flex items-center gap-2 text-[13px]"><input type="checkbox" checked={!!g.patientStated} onChange={e => setRow('goalItems', i, { patientStated: e.target.checked })} />The patient's own goal</label>
              </div>))}
            <button className="btn ghost" onClick={() => setF(prev => ({ ...prev, goalItems: [...prev.goalItems, { id: cpTempId('g'), problemId: null, statement: '', measure: '', baseline: '', target: '', targetDate: null, priority: 'medium', patientStated: false, status: 'not_started' }] }))}><i className="ti ti-plus" />Add Goal</button>
          </CpSection>

          {on('interventions') && <CpSection title="Interventions" required={required.has('interventions')}>
            {f.interventions.map((iv, i) => (
              <div key={iv.id} className="grid gap-2 mb-3 rounded-xl border border-stone-100 p-3">
                <div className="flex gap-2">
                  {/* A standard intervention is picked, so it carries a code
                      reporting and decision support can count. "Other" keeps
                      the clinician's own words. */}
                  <select className="inp flex-1" value={iv.code || 'custom'} onChange={e => {
                    const std = (cat.interventions || []).find(x => x.code === e.target.value);
                    setRow('interventions', i, std
                      ? { code: std.code, description: std.label, type: std.type, responsible: std.responsible, frequency: std.frequency }
                      : { code: 'custom', description: '' });
                  }}>
                    {(vocab.interventionTypes || []).map(t => (
                      <optgroup key={t.value} label={t.label}>
                        {(cat.interventions || []).filter(x => x.type === t.value).map(x => <option key={x.code} value={x.code}>{x.label}</option>)}
                      </optgroup>
                    ))}
                    <option value="custom">Other (type your own)</option>
                  </select>
                  <button className="text-stone-400" onClick={() => dropRow('interventions', i)} aria-label="Remove intervention"><i className="ti ti-x" /></button>
                </div>
                {(iv.code || 'custom') === 'custom' && (
                  <div className="grid md:grid-cols-[1fr_200px] gap-2">
                    <input className="inp" placeholder="What gets done" value={iv.description} onChange={e => setRow('interventions', i, { description: e.target.value })} />
                    <select className="inp" value={iv.type} onChange={e => setRow('interventions', i, { type: e.target.value })}>{opts(vocab.interventionTypes)}</select>
                  </div>
                )}
                <div className="grid md:grid-cols-3 gap-2">
                  <select className="inp" value={iv.responsible} onChange={e => setRow('interventions', i, { responsible: e.target.value })}>{opts(vocab.responsible)}</select>
                  <input className="inp" placeholder="Name (optional)" value={iv.responsibleName} onChange={e => setRow('interventions', i, { responsibleName: e.target.value })} />
                  <select className="inp" value={iv.frequency} onChange={e => setRow('interventions', i, { frequency: e.target.value })}>{opts(vocab.frequencies)}</select>
                </div>
                {goalChoices.length > 0 && <div className="flex flex-wrap gap-1.5">
                  {goalChoices.map(g => {
                    const on = (iv.goalIds || []).includes(g.id);
                    return <button key={g.id} type="button" className={`chip border ${on ? 'bg-primary text-white border-primary' : 'bg-white text-primary border-stone-200'}`}
                      onClick={() => setRow('interventions', i, { goalIds: on ? iv.goalIds.filter(x => x !== g.id) : [...(iv.goalIds || []), g.id] })}>{g.statement.slice(0, 40)}</button>;
                  })}
                </div>}
              </div>))}
            <button className="btn ghost" onClick={() => setF(prev => ({ ...prev, interventions: [...prev.interventions, (() => { const std = (cat.interventions || [])[0]; return std ? { id: cpTempId('i'), code: std.code, goalIds: [], description: std.label, responsible: std.responsible, responsibleName: '', frequency: std.frequency, type: std.type } : { id: cpTempId('i'), code: 'custom', goalIds: [], description: '', responsible: 'gfc_clinician', responsibleName: '', frequency: 'each_visit', type: 'clinical' }; })()] }))}><i className="ti ti-plus" />Add Intervention</button>
          </CpSection>}

          {on('medicationManagement') && <CpSection title="Medication Management" required={required.has('medicationManagement')}>
            <div className="grid md:grid-cols-2 gap-2">
              <select className="inp" value={f.medicationManagement.managedBy || ''} onChange={e => setNested('medicationManagement', { managedBy: e.target.value || null })}>
                <option value="">Who manages medications day to day?</option>{opts(vocab.medManagedBy)}
              </select>
              <input className="inp" placeholder="Pharmacy" value={f.medicationManagement.pharmacy} onChange={e => setNested('medicationManagement', { pharmacy: e.target.value })} />
            </div>
            <textarea className="inp mt-2" rows={2} placeholder="Adherence concerns" value={f.medicationManagement.adherenceConcerns} onChange={e => setNested('medicationManagement', { adherenceConcerns: e.target.value })} />
            <p className="text-[11px] text-stone-500 mt-1">The medication list and its last reconciliation come from the chart, not from here.</p>
          </CpSection>}

          <CpSection title="Outside the Practice">
            <div className="lblu mb-1">External care team</div>
            {f.outsideCare.externalTeam.map((t, i) => (
              <div key={i} className="grid md:grid-cols-6 gap-2 mb-2">
                <input className="inp" placeholder="Name" value={t.name} onChange={e => setOcRow('externalTeam', i, { name: e.target.value })} />
                <input className="inp" placeholder="Role" value={t.role} onChange={e => setOcRow('externalTeam', i, { role: e.target.value })} />
                <input className="inp" placeholder="Organization" value={t.organization} onChange={e => setOcRow('externalTeam', i, { organization: e.target.value })} />
                <input className="inp" placeholder="Phone" value={t.phone} onChange={e => setOcRow('externalTeam', i, { phone: e.target.value })} />
                <input className="inp" placeholder="What they handle" value={t.handles} onChange={e => setOcRow('externalTeam', i, { handles: e.target.value })} />
                <div className="flex gap-1"><input className="inp flex-1" type="date" value={t.lastContact || ''} onChange={e => setOcRow('externalTeam', i, { lastContact: e.target.value || null })} />
                  <button className="text-stone-400" onClick={() => dropOcRow('externalTeam', i)} aria-label="Remove"><i className="ti ti-x" /></button></div>
              </div>))}
            <button className="btn ghost mb-3" onClick={() => addOcRow('externalTeam', { name: '', role: '', organization: '', phone: '', handles: '', lastContact: null })}><i className="ti ti-plus" />Add Provider</button>
            <div className="lblu mb-1">Community services</div>
            {f.outsideCare.communityServices.map((c, i) => (
              <div key={i} className="grid md:grid-cols-3 gap-2 mb-2">
                <input className="inp" placeholder="Service, e.g. Meals on Wheels" value={c.name} onChange={e => setOcRow('communityServices', i, { name: e.target.value })} />
                <select className="inp" value={c.status} onChange={e => setOcRow('communityServices', i, { status: e.target.value })}>{opts(vocab.serviceStatuses)}</select>
                <div className="flex gap-1"><input className="inp flex-1" placeholder="Notes" value={c.notes} onChange={e => setOcRow('communityServices', i, { notes: e.target.value })} />
                  <button className="text-stone-400" onClick={() => dropOcRow('communityServices', i)} aria-label="Remove"><i className="ti ti-x" /></button></div>
              </div>))}
            <button className="btn ghost" onClick={() => addOcRow('communityServices', { name: '', status: 'active', notes: '' })}><i className="ti ti-plus" />Add Service</button>
          </CpSection>

          <CpSection title={on('eachVisit') ? 'Service Schedule' : 'Visit Schedule'} required={required.has('eachVisit') || required.has('visitFrequency')}>
            {on('eachVisit') && <Field label="Each visit (one task per line)"><textarea className="inp" rows={3} value={f.eachVisit} onChange={e => setF({ ...f, eachVisit: e.target.value })} /></Field>}
            <div className="grid md:grid-cols-2 gap-3 mt-2">
              <Field label="Visit frequency"><input className="inp" placeholder="e.g. 2 visits / week" value={f.visitFrequency} onChange={e => setF({ ...f, visitFrequency: e.target.value })} /></Field>
              <Field label="Times"><input className="inp" placeholder="e.g. mornings 9–11a" value={f.visitTimes} onChange={e => setF({ ...f, visitTimes: e.target.value })} /></Field>
            </div>
            <Field label="Days">
              <div className="flex flex-wrap gap-1.5">
                {days.map(d => (
                  <button key={d} type="button"
                    className={`chip border ${f.visitDays.includes(d) ? 'bg-primary text-white border-primary' : 'bg-white text-primary border-stone-200'}`}
                    onClick={() => setF({ ...f, visitDays: f.visitDays.includes(d) ? f.visitDays.filter(x => x !== d) : [...f.visitDays, d] })}>{d}</button>
                ))}
              </div>
            </Field>
            <div className="grid md:grid-cols-2 gap-3">
              <Field label="Duration"><input className="inp" placeholder="e.g. 4 hours" value={f.duration} onChange={e => setF({ ...f, duration: e.target.value })} /></Field>
              <Field label="Effective date"><input className="inp" type="date" value={f.effectiveDate} onChange={e => setF({ ...f, effectiveDate: e.target.value })} /></Field>
            </div>
          </CpSection>

          <CpSection title="Safety and Escalation" required={required.has('escalation')}>
            <div className="grid md:grid-cols-2 gap-3">
              <Field label="Call GFC when (one per line)"><textarea className="inp" rows={3} placeholder="Weight up 3 lb overnight" value={f.escalation.callGfcWhen} onChange={e => setNested('escalation', { callGfcWhen: e.target.value })} /></Field>
              <Field label="Call 911 when (one per line)"><textarea className="inp" rows={3} placeholder="Chest pain" value={f.escalation.call911When} onChange={e => setNested('escalation', { call911When: e.target.value })} /></Field>
            </div>
            <div className="grid md:grid-cols-3 gap-3 mt-2">
              <Field label="Who to call, in order (one per line)"><textarea className="inp" rows={2} value={f.escalation.callOrder} onChange={e => setNested('escalation', { callOrder: e.target.value })} /></Field>
              <Field label="After hours"><input className="inp" value={f.escalation.afterHours} onChange={e => setNested('escalation', { afterHours: e.target.value })} /></Field>
              <Field label="Hospital preference"><input className="inp" value={f.escalation.hospitalPreference} onChange={e => setNested('escalation', { hospitalPreference: e.target.value })} /></Field>
            </div>
            <p className="text-[11px] text-stone-500 mt-1">Code status: {((existing.derived || {}).codeStatus) || 'not recorded at intake'} (from the intake record).</p>
          </CpSection>

          <CpSection title="Review" required={required.has('review')}>
            <div className="grid md:grid-cols-2 gap-3">
              <select className="inp" value={f.review.cadence || ''} onChange={e => {
                // Picking a cadence fills the next review date from today; it
                // can still be changed by hand.
                const days = (cat.reviewCadenceDays || {})[e.target.value];
                const next = days ? (() => { const d = new Date(); d.setDate(d.getDate() + days); return GFC_TIME.zonedParts(d).isoDate; })() : f.review.nextReviewDate;
                setNested('review', { cadence: e.target.value || null, nextReviewDate: next });
              }}>
                <option value="">Review cadence</option>{opts(vocab.reviewCadences)}
              </select>
              <input className="inp" type="date" value={f.review.nextReviewDate || ''} onChange={e => setNested('review', { nextReviewDate: e.target.value || null })} />
            </div>
          </CpSection>

          <CpSection title="Charge-plan note (staff only)">
            <textarea className="inp" rows={2} value={f.chargePlanNote} onChange={e => setF({ ...f, chargePlanNote: e.target.value })} />
          </CpSection>

          <div className="border-t border-stone-100 pt-4">
            <span className="lblu block mb-1">Author signature (drawn)</span>
            <SignaturePad padRef={padRef} />
          </div>
          {msg && <p className={`text-sm ${msg.ok ? 'text-emerald-700' : 'text-red-600'}`}>{msg.text}</p>}
          <div className="flex flex-wrap items-center gap-2">
            <button className="btn" disabled={busy} onClick={submit}><i className="ti ti-writing-sign" />{busy ? 'Saving…' : 'Sign & Save'}</button>
            {onCancel && <button className="btn ghost" onClick={onCancel}>Cancel</button>}
            <Hint className="w-full">Saving writes the versioned plan to the client record (portal + co-sign unlock) and, for a clinical patient linked to OpenEMR, files the authored PDF there. The final signed PDF carries every signature once the client co-signs in their portal. Goal status can be updated later without a new version.</Hint>
          </div>
        </div>
      );
    };

    const CarePlanTab = ({ patient, onSaved }) => {
      // Authoring a plan is any licensed role; the second signature is a
      // provider's or an LCSW's (served).
      const canWrite = useCan('carePlanAuthor');
      const [existing, setExisting] = useState(null);
      const [loadErr, setLoadErr] = useState(null);
      const [chartProblems, setChartProblems] = useState([]);
      const padRef = useRef(null);
      const [busy, setBusy] = useState(false); const [msg, setMsg] = useState(null);
      const [warnings, setWarnings] = useState([]);
      const [authorOpen, setAuthorOpen] = useState(false);
      const reload = () => api.carePlan(patient.id).then(r => { setExisting(r); setLoadErr(null); }).catch(e => setLoadErr(e.message));
      useEffect(() => { setExisting(null); reload(); }, [patient.id]);
      // The chart's problem list, so a plan problem can point at it rather
      // than be retyped. Clinical-line clients only; a home care client has
      // no chart.
      useEffect(() => {
        let live = true;
        const line = String(patient.serviceLine || '').toUpperCase();
        if (line !== 'IHPC' && line !== 'BOTH') { setChartProblems([]); return; }
        api.chart(patient.id).then(c => {
          const rows = c && c.emr && c.emr.problems && c.emr.problems.ok ? c.emr.problems.rows : [];
          if (live) setChartProblems(rows.filter(r => r.id && r.title && !/resolved|inactive|remission/i.test(String(r.status || ''))));
        }).catch(() => {});
        return () => { live = false; };
      }, [patient.id]);
      const cp = existing && existing.carePlan;
      // The server answers whether THIS viewer can complete this plan, for
      // this client's service line (an RN can complete a home care plan a
      // coordinator wrote, never a clinical patient's).
      const canCoSignPlan = !!(existing && existing.canCoSign);
      const coSigned = cp && existing.coSign && existing.coSign[`v${cp.version}`];
      // An IHPC plan (or one an LMSW authored) waits on a PROVIDER signature, and
      // the chip used to say "awaiting client co-signature" for it too.
      const providerPending = !!(cp && cp.providerCoSignStatus === 'pending');
      const providerPadRef = useRef(null);
      const [pBusy, setPBusy] = useState(false); const [pMsg, setPMsg] = useState(null);
      const providerSign = () => {
        if (!providerPadRef.current || providerPadRef.current.isEmpty()) { setPMsg({ ok: false, text: 'Draw your signature first.' }); return; }
        setPBusy(true); setPMsg(null);
        api.providerCoSignCarePlan(patient.id, providerPadRef.current.toDataURL())
          .then(r => { setPMsg({ ok: true, text: r.message || 'Signed.' }); return reload(); })
          .catch(e => setPMsg({ ok: false, text: e.message }))
          .finally(() => setPBusy(false));
      };
      const save = (body) => {
        if (!padRef.current || padRef.current.isEmpty()) { setMsg({ ok: false, text: 'Draw your author signature before saving.' }); return; }
        setBusy(true); setMsg(null); setWarnings([]);
        api.saveCarePlan(patient.id, { ...body, rnSignatureImageB64: padRef.current.toDataURL() }).then(r => {
          setMsg({ ok: true, text: r.message + (r.emrDocumented ? ' · authored PDF filed to OpenEMR' : '') });
          setWarnings(r.warnings || []);
          setAuthorOpen(false);
          reload();
          onSaved && onSaved();
        }).catch(e => setMsg({ ok: false, text: e.message })).finally(() => setBusy(false));
      };
      if (loadErr) return <div className="card p-5 text-sm text-red-600">{loadErr}</div>;
      if (!existing) return <div className="card p-5 text-sm text-stone-500">Loading care plan…</div>;
      return (
        <div className="max-w-4xl mx-auto">
          {cp && (
            <div className="card mb-4">
              <div className="card-h">
                <div>
                  <h2>Care Plan</h2>
                  <div className="text-[12px] text-stone-500">{[`Version ${cp.version}`, cp.authoredAt && fmtDate(cp.authoredAt), cp.authoredBy].filter(Boolean).join(' · ')}</div>
                </div>
                <span className={`chip ${coSigned && !providerPending ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-800'}`}>
                  {providerPending ? 'Awaiting clinician co-signature' : coSigned ? `Co-signed ${fmtDate(coSigned.at)}` : 'Awaiting client co-signature'}
                </span>
              </div>
              <div className="p-4 lg:p-5 grid gap-4">
                <CarePlanView clientId={patient.id} existing={existing} canWrite={canWrite} onChanged={reload} />
                {existing.docs && existing.docs[`v${cp.version}`] && existing.docs[`v${cp.version}`].signed && (
                  <div className="text-[13px]"><span className="text-stone-500">Signed PDF: </span>
                    {existing.docs[`v${cp.version}`].signed.driveUrl
                      ? <a className="text-primary underline" href={existing.docs[`v${cp.version}`].signed.driveUrl} target="_blank" rel="noreferrer">on Drive</a>
                      : 'stored'}
                    {existing.docs[`v${cp.version}`].signed.emrDocumented && ' · filed to OpenEMR'}
                  </div>
                )}
                {providerPending && !canCoSignPlan && (
                  <div className="text-[12.5px] text-amber-900">{cp.providerCoSignReason || 'Waiting for a clinician to co-sign beside the author.'} The plan is not active until then.</div>
                )}
                {providerPending && canCoSignPlan && (
                  <div className="grid gap-2 rounded-xl border border-amber-200 bg-amber-50 p-3">
                    <div className="text-[12.5px] text-amber-900">This plan needs your co-signature beside the author's before it is active. The author's signature is kept.</div>
                    <SignaturePad padRef={providerPadRef} />
                    {pMsg && <p className={`text-sm ${pMsg.ok ? 'text-emerald-700' : 'text-red-600'}`}>{pMsg.text}</p>}
                    <button className="btn w-fit" disabled={pBusy} onClick={providerSign}><i className="ti ti-writing-sign" />{pBusy ? 'Signing…' : 'Co-sign Plan'}</button>
                  </div>
                )}
                {(existing.history || []).length > 1 && (
                  <div className="text-[12px] text-stone-500">Earlier versions: {existing.history.map(h => `v${h.version} (${fmtDate(h.authoredAt)})`).join(' · ')}</div>
                )}
              </div>
            </div>
          )}
          {!canWrite && !cp && <div className="card p-5 text-center"><i className="ti ti-clipboard-heart text-3xl text-accent" /><p className="text-sm text-stone-500 mt-1">No care plan authored yet.</p></div>}
          {msg && msg.ok && !authorOpen && <p className="text-sm text-emerald-700 mb-3">{msg.text}</p>}
          {warnings.length > 0 && !authorOpen && (
            <div className="rounded-xl border border-amber-200 bg-amber-50 p-3 mb-3 text-[12.5px] text-amber-900">
              <div className="font-semibold mb-1">Check caregiver scope</div>
              <ul className="list-disc ml-5 space-y-1">{warnings.map((w, i) => <li key={i}><b>{w.where}:</b> {w.text} — {w.warning}</li>)}</ul>
            </div>
          )}
          {canWrite && cp && !authorOpen && (
            <button className="btn ghost" onClick={() => setAuthorOpen(true)}><i className="ti ti-pencil" />Write Version {cp.version + 1}</button>
          )}
          {canWrite && (!cp || authorOpen) && <div className="card">
            <div className="card-h"><h2>{cp ? `New Version (v${cp.version + 1})` : 'Write Care Plan'}</h2></div>
            <CarePlanForm clientId={patient.id} existing={existing} chartProblems={chartProblems} padRef={padRef}
              onSave={save} busy={busy} msg={msg} onCancel={cp ? () => setAuthorOpen(false) : null} />
          </div>}
        </div>
      );
    };

    // A home care client has no chart in this workspace, so their care plan
    // opens on its own page: /clinical?carePlan=<clientId>. Linked from the
    // enrollment screen.
    const StandaloneCarePlan = ({ clientId }) => {
      const [client, setClient] = useState(null);
      useEffect(() => { api.carePlan(clientId).then(r => setClient(r.client || { id: clientId })).catch(() => setClient({ id: clientId })); }, [clientId]);
      return (
        <div className="min-h-screen bg-[#FBF8F2] p-4 lg:p-8">
          <div className="max-w-4xl mx-auto mb-4 flex items-center justify-between">
            <div>
              <div className="text-[12px] text-stone-500">Care plan</div>
              <h1 className="serif text-[26px] font-semibold text-primary">{(client && client.name) || 'Client'}</h1>
            </div>
            <a className="btn ghost" href="/admin/enrollment"><i className="ti ti-arrow-left" />Enrollment</a>
          </div>
          {client && <CarePlanTab patient={client} />}
        </div>
      );
    };

    // The clinical enrollment sequence (checklist + ACTIVATE) used to live
    // here as its own tab. Moved to /admin/enrollment (owner-directed,
    // 2026-09-23): it is a second admin workflow gate, same shape as
    // "Approve enrollment", and both wrote client.enrollmentStatus
    // independently with no relationship to each other — a clinician working
    // a chart has no reason to see it, and an admin working enrollment
    // shouldn't have to leave that screen to find it. See DetailView's
    // "Clinical enrollment sequence" section in admin-enrollment.html.

    // ── Session 4.2 — Clinical scheduling (OpenEMR-tied) ──
    // OpenEMR is the appointment ledger; every view below renders its LIVE
    // rows. Cancelled slots stay visible (tombstone swap — never a hard
    // delete); double-booking is rejected server-side against OpenEMR.

    const DURATIONS = [15, 30, 45, 60, 90, 120];

    // Create / reschedule form. On 409 APPOINTMENT_CONFLICT the server's
    // specific message (which slot, with whom) is shown verbatim.
    const AppointmentModal = ({ mode, appt, patients, providersData, defaultDate, defaultProviderId, onClose, onSaved }) => {
      const isRes = mode === 'reschedule';
      const linkable = (patients || []).filter(p => p.openEmrPatientId);
      const [f, setF] = useState({
