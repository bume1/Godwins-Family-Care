<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Godwins Family Care — Clinical Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.1.0/dist/tabler-icons.min.css">
  <!-- EVERY time this app shows is Eastern, on both sides (owner rule,
       2026-09-16). Loaded before the page's own scripts so nothing can format a
       date before the default is in place. `installDefaultTimeZone()` fills in
       the zone where a caller passed none; the shift and visit sites also call
       GFC_TIME's helpers explicitly, because code that says what it means
       outlives a shim. See public/gfc-time.js. -->
  <script src="/gfc-time.js"></script>
  <script>window.GFC_TIME && window.GFC_TIME.installDefaultTimeZone();</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <!-- Session 9 messaging: the same thread component every portal mounts. -->
  <script src="/components/gfc-messaging.js"></script>
  <!-- The shared schedule component: a clinician's availability uses the same
       form caregivers use (owner, 2026-11-08). -->
  <script src="/components/caregiver-schedule.js"></script>
  <!-- Note formatting (2026-09-27): the six shapes a note field may carry. The
       server and the signed-note PDF read the same file, so what a clinician
       formats here is what every copy shows. -->
  <script src="/note-format.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#033D50', 50: '#e8f0f4', 100: '#c5d9e3', 500: '#033D50', 600: '#02334a', 700: '#022A38' },
            accent: '#C9A44A',
            cream: '#FAF7F2', creamdeep: '#efe9db',
            // The 2026-10-12 redesign: Tailwind's generic stone greys (150+
            // uses) are remapped to the brand's warm edges and ink, so every
            // screen picks up the portal's palette without a JSX edit.
            stone: { 50: '#FCFAF6', 100: '#F1ECE2', 200: '#E8E0D2', 300: '#D9CFBE', 400: '#8E9BA1',
              500: '#5b6b73', 600: '#4a5a62', 700: '#34444c', 800: '#1a2a32', 900: '#11202a' }
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['"DM Sans"', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="icon" type="image/png" href="/brand/logo-mark-transparent.png">
  <style>
    /* 2026-10-12 redesign (owner mockups): the patient portal's v2 look on the
       clinician side. Tokens are the portal's (portal.html .gfc.v2), restated
       here as :root variables because this page is not inside .gfc. Dense on
       purpose: a clinician reads more per screen than a patient, so the
       portal's 18px reader size is NOT carried over. */
    :root { --navy:#033D50; --navy2:#0a5066; --navyd:#022A38; --goldd:#C9A44A; --gold:#F5CD85; --gold-ink:#9A7430;
      --cream:#FAF7F2; --wash:#F6EFE2; --edge:#ECE4D6; --edge2:#E1D7C5; --ink:#1a2a32; --mut:#5b6b73; --danger:#B5462E;
      --shadow:0 1px 2px rgba(3,61,80,.04),0 6px 18px -12px rgba(3,61,80,.18); }
    * { font-family: 'DM Sans', system-ui, sans-serif; }
    body { background: var(--cream); color: var(--ink); }
    .serif { font-family: 'Cormorant Garamond', Georgia, serif; }
    .card { background: #fff; border: 1px solid var(--edge); border-radius: 16px; box-shadow: var(--shadow); }
    .card-h { display:flex; align-items:center; justify-content:space-between; gap:8px; padding: 14px 18px; border-bottom: 1px solid var(--edge); }
    .card-h h2 { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: var(--navy); font-weight: 600; line-height:1.15; }
    .lblu { font-size: 10.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--gold-ink); font-weight: 700; }
    .inp { width:100%; border:1px solid var(--edge2); border-radius:10px; padding:8px 11px; font-size:13.5px; background:#fff; color:var(--ink); }
    .inp:focus { outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(3,61,80,.10); }
    .btn { display:inline-flex; align-items:center; gap:6px; border-radius:10px; padding:8px 15px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid var(--navy); background:var(--navy); color:#fff; transition:background .15s, box-shadow .15s; }
    .btn:hover:not(:disabled) { background:var(--navy2); }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .btn.gold { background:#A9853A; border-color:#A9853A; color:#fff; box-shadow:0 6px 14px -8px rgba(154,116,48,.8); }
    .btn.gold:hover:not(:disabled) { background:var(--gold-ink); }
    .btn.ghost { background:#fff; color:var(--navy); border-color:var(--edge2); }
    .btn.ghost:hover:not(:disabled) { background:var(--wash); }
    .chip { display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:2px 10px; font-size:11px; font-weight:600; }
    .prefill { background:#FDF6E7; border:1px dashed #C9A44A; }
    .prefill-badge { font-size:9.5px; color:#9a6a1e; font-weight:700; letter-spacing:.4px; }
    .tabbtn { padding:10px 14px; font-size:13.5px; font-weight:600; color:var(--mut); border-bottom:2.5px solid transparent; cursor:pointer; white-space:nowrap; }
    .tabbtn:hover { color:var(--navy); }
    .tabbtn.on { color:#8a6a2c; border-color:var(--goldd); }
    /* Tiny text is the main thing that made the old screens read as clunky.
       A floor here lifts every 10–11px label at once without touching JSX. */
    .text-\[10px\], .text-\[10\.5px\] { font-size:11px !important; }
    .text-\[11px\] { font-size:11.5px !important; }

    /* ── Shell: navy sidebar, cream page, phone bottom bar ── */
    .cw-side { background:linear-gradient(180deg,var(--navy) 0%,var(--navyd) 100%); color:#fff; }
    .cw-side .brand img { height:44px; }
    .cw-nav button { display:flex; align-items:center; gap:12px; width:100%; background:none; border:none; border-radius:12px; padding:10px 14px; font-size:14px; font-weight:500; color:rgba(255,255,255,.88); cursor:pointer; text-align:left; margin-bottom:2px; }
    .cw-nav button i { font-size:20px; color:rgba(255,255,255,.75); }
    .cw-nav button:hover { background:rgba(255,255,255,.07); }
    .cw-nav button.on { background:linear-gradient(90deg,#A9853A,#C2A060); color:#fff; font-weight:600; box-shadow:0 6px 16px -10px rgba(0,0,0,.6); }
    .cw-nav button.on i { color:#fff; }
    .cw-nav .grp { font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:rgba(245,205,133,.7); font-weight:700; padding:14px 14px 6px; }
    .cw-badge { margin-left:auto; min-width:22px; height:22px; border-radius:11px; background:var(--danger); color:#fff; font-size:11.5px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; padding:0 6px; }
    .cw-top { background:rgba(250,247,242,.94); backdrop-filter:blur(6px); border-bottom:1px solid var(--edge); }
    .cw-search { background:#fff; border:1px solid var(--edge); border-radius:12px; }
    .cw-title { font-family:'Cormorant Garamond',serif; color:var(--navy); font-weight:600; font-size:30px; line-height:1.1; }
    @media (min-width:1024px){ .cw-title { font-size:38px; } }
    .cw-avatar { border-radius:999px; background:var(--wash); color:var(--navy); border:1px solid var(--edge2); display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0; }
    .cw-tabs { display:flex; gap:4px; border-bottom:1px solid var(--edge); overflow-x:auto; }
    .cw-bottom { background:#fff; border-top:1px solid var(--edge); box-shadow:0 -6px 18px -14px rgba(3,61,80,.35); }
    .cw-bottom button { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 2px 10px; font-size:10.5px; font-weight:600; color:var(--mut); background:none; border:none; position:relative; }
    .cw-bottom button i { font-size:21px; }
    .cw-bottom button.on { color:#8a6a2c; }
    .cw-bottom button .dot { position:absolute; top:5px; left:calc(50% + 6px); min-width:16px; height:16px; border-radius:8px; background:var(--danger); color:#fff; font-size:9.5px; display:flex; align-items:center; justify-content:center; padding:0 4px; }
    /* status pill with a dot, the mockups' Scheduled / En Route / Arrived */
    .pill { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:3px 10px; font-size:11.5px; font-weight:600; border:1px solid transparent; white-space:nowrap; }
    .pill::before { content:''; width:7px; height:7px; border-radius:50%; background:currentColor; }
    .cw-row { transition:background .12s; }
    .cw-row:hover { background:#FCFAF6; }
    .cw-row.on { background:var(--wash); box-shadow:inset 3px 0 0 var(--goldd); }
    .cw-table th { font-size:12px; font-weight:600; color:var(--mut); text-align:left; padding:10px 14px; border-bottom:1px solid var(--edge); white-space:nowrap; }
    .cw-table td { padding:11px 14px; border-bottom:1px solid #F1ECE2; font-size:13.5px; vertical-align:middle; }
    .cw-table tr:last-child td { border-bottom:0; }
    .care-chip { display:inline-flex; align-items:center; justify-content:center; min-width:30px; height:24px; border-radius:7px; font-size:11.5px; font-weight:700; padding:0 7px; }
    ::-webkit-scrollbar { width:8px; height:8px; } ::-webkit-scrollbar-thumb { background:#d8d0bd; border-radius:8px; }
    /* Formatted note fields. Tailwind's reset strips list markers and heading
       sizes, so the six shapes get their own, in the editor and when read. */
    .fmt { font-size:13px; line-height:1.5; color:#1f2937; }
    .fmt ul { list-style:disc; padding-left:1.25rem; margin:2px 0; }
    .fmt ol { list-style:decimal; padding-left:1.4rem; margin:2px 0; }
    .fmt h3 { font-size:14px; font-weight:700; color:#033D50; margin:4px 0 2px; }
    .fmt strong { font-weight:700; } .fmt em { font-style:italic; } .fmt u { text-decoration:underline; }
    .fmt-editor { min-height:3.2em; outline:none; white-space:pre-wrap; }
    .fmt-editor:empty::before { content:attr(data-placeholder); color:#a8a29e; }
    .fmt-tool { border:1px solid #e5ddcb; background:#fff; border-radius:6px; min-width:28px; height:26px; padding:0 6px; font-size:12px; color:#033D50; }
    .fmt-tool:hover { background:#FAF7F2; }
    .carried { background:#FDF6E7; border:1px dashed #C9A44A; }
    .sigblock { border:2px solid #033D50; border-radius:10px; padding:10px 12px; background:#fff; }
  </style>
  <script src="/session-guard.js"></script>
  <script src="/staff-nav.js"></script>
  <script src="/mfa-step.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="/components/claim-shared.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useContext , useMemo } = React;
    const API_URL = window.location.origin;

    // Session 4.3 — case-manager scoped read. The API enforces the split
    // (requireClinicalRead / requireClinicalWrite); this context only decides
    // which controls to RENDER. Mirrors patientReadRepository.canClinicalWrite.
    const canWriteFor = (u) => !!u && (u.role === 'admin' || (!!u.hasClinicalAccess && u.role !== 'caseManager'));
    // Session 4.8 — the capability matrix comes from GET /api/clinical/status,
    // which reads the SAME module the routes enforce with. This page never
    // decides a capability itself: a control drawn here is one the server will
    // accept, and every one is re-checked at the route regardless.
    const AccessContext = React.createContext({ canWrite: true, role: null, capabilities: {}, clinicalRole: null, canSubmitBilling: false });
    const useCanWrite = () => useContext(AccessContext).canWrite;
    // A care coordinator documents and schedules without a licence: the note
    // editor and the calendar read this, every other write reads canWrite.
    const useCanDocument = () => { const c = useContext(AccessContext); return c.canDocument !== undefined ? !!c.canDocument : !!c.canWrite; };
    // Billing (an admin or a manager, owner 2026-09-29): the only viewer who
    // ever sees a place of service, edits codes after signing, or submits.
    // Answered by the server; false until it has answered.
    const useCanBill = () => !!useContext(AccessContext).canSubmitBilling;
    // Where an order goes (admin, manager, case manager, licensed clinician).
    // Answered by the server, like every other control here.
    const useCanEditOrderDestination = () => !!useContext(AccessContext).canEditOrderDestination;
    const useCan = (capability) => {
      const ctx = useContext(AccessContext);
      // Until the status call lands there is no matrix; fall back to the
      // read/write split rather than drawing controls we cannot vouch for.
      if (!ctx.capabilities || !Object.keys(ctx.capabilities).length) return ctx.canWrite;
      return !!ctx.capabilities[capability];
    };
    const useClinicalRole = () => useContext(AccessContext).clinicalRole;

    // Help text (owner, 2026-10-12): the "how this works" notes under key
    // buttons show in full only to a super admin. Everyone else gets a small
    // "?" bubble beside the buttons that shows the same words on hover, focus
    // or tap. One component, so the words live in one place either way.
    // The tooltip is position:fixed and clamped to the window, so a bubble at
    // the edge of a card or a phone screen never opens off-screen.
    const HINT_WIDTH = 280;
    const Hint = ({ children, className = '' }) => {
      const isSuperAdmin = useContext(AccessContext).role === 'admin';
      const [pos, setPos] = useState(null);
      const ref = useRef(null);
      if (isSuperAdmin) return <p className={`text-[11px] text-stone-400 ${className}`}>{children}</p>;
      const show = () => {
        const r = ref.current && ref.current.getBoundingClientRect();
        if (!r) return;
        const w = Math.min(HINT_WIDTH, window.innerWidth - 16);
        const left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, window.innerWidth - w - 8));
        const below = r.bottom + 160 < window.innerHeight;
        setPos({ left, width: w, top: below ? r.bottom + 6 : undefined, bottom: below ? undefined : window.innerHeight - r.top + 6 });
      };
      const hide = () => setPos(null);
      return (
        <span ref={ref} role="button" tabIndex={0} aria-label="More information"
          className="inline-flex items-center justify-center shrink-0 w-[18px] h-[18px] rounded-full border border-stone-300 text-stone-500 text-[11px] font-semibold leading-none cursor-help align-middle hover:bg-stone-100 focus:outline-none focus:ring-2 focus:ring-stone-300"
          onMouseEnter={show} onMouseLeave={hide} onFocus={show} onBlur={hide}
          onClick={(e) => { e.preventDefault(); e.stopPropagation(); pos ? hide() : show(); }}>
          ?
          {pos && (
            <span role="tooltip" className="fixed z-[100] rounded-lg bg-stone-800 text-white text-[12px] font-normal leading-snug text-left p-2.5 shadow-lg pointer-events-none"
              style={{ left: pos.left, width: pos.width, top: pos.top, bottom: pos.bottom }}>
              {children}
            </span>
          )}
        </span>
      );
    };

    const getToken = () => localStorage.getItem('admin_token') || localStorage.getItem('unified_token');
    const handleResponse = async (response) => {
      if (!response.ok) {
        let data = null;
        try { data = await response.json(); } catch {}
        // The server answers an expired or invalid JWT with 403, not 401, so
        // keying only on 401 left a stale session rendering the raw string
        // "Invalid token" in red across the page with no hint to sign in again.
        // Key on the auth CODES instead: a permission 403 (CLINICAL_READ_ONLY
        // and friends) belongs to a correctly signed-in user and must not log
        // them out.
        const authCode = data && data.code;
        const isAuthFailure = response.status === 401
          || ['AUTH_MISSING', 'AUTH_EXPIRED', 'AUTH_INVALID', 'AUTH_INACTIVE', 'AUTH_IDLE', 'AUTH_REVOKED', 'AUTH_MFA_REQUIRED'].includes(authCode);
        if (isAuthFailure) {
          localStorage.removeItem('admin_token'); localStorage.removeItem('admin_user');
          throw Object.assign(
            new Error((data && data.error) || 'Your session has expired. Please sign in again.'),
            { code: 'AUTH', authCode: authCode || null, status: response.status });
        }
        const err = new Error((data && data.error) || `HTTP error ${response.status}`);
        err.status = response.status; err.data = data;
        throw err;
      }
      return response.json();
    };
    const authedFetch = (path, opts = {}) => {
      const headers = Object.assign({ 'Authorization': `Bearer ${getToken()}` },
        opts.body && !(opts.body instanceof FormData) ? { 'Content-Type': 'application/json' } : {}, opts.headers || {});
      return fetch(`${API_URL}${path}`, Object.assign({}, opts, { headers })).then(handleResponse);
    };
    // A multipart upload. `authedFetch` sets Content-Type for a JSON body and
    // deliberately does not for FormData — the browser has to write the
    // multipart boundary itself — so this exists to make that impossible to get
    // wrong at a call site rather than to add anything else.
    const authedUpload = (path, formData) => fetch(`${API_URL}${path}`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${getToken()}` },
      body: formData
    }).then(handleResponse);
    const api = {
      login: (email, password) => fetch(`${API_URL}/api/auth/login`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      }).then(handleResponse),
      status: () => authedFetch('/api/clinical/status'),
      patients: (q) => authedFetch(`/api/clinical/patients${q ? `?q=${encodeURIComponent(q)}` : ''}`),
      link: (id, body) => authedFetch(`/api/clinical/patients/${id}/link`, { method: 'POST', body: JSON.stringify(body || {}) }),
      chart: (id) => authedFetch(`/api/clinical/patients/${id}/chart`),
      visit: (id, body) => authedFetch(`/api/clinical/patients/${id}/visit`, { method: 'POST', body: JSON.stringify(body) }),
      // Drafts are per-clinician: you resume your own half-written note, never
      // somebody else's. The server keys them that way too.
      getDraft: (id) => authedFetch(`/api/clinical/patients/${id}/visit/draft`),
      saveDraft: (id, draft) => authedFetch(`/api/clinical/patients/${id}/visit/draft`, { method: 'PUT', body: JSON.stringify({ draft }) }),
      discardDraft: (id) => authedFetch(`/api/clinical/patients/${id}/visit/draft`, { method: 'DELETE' }),
      // Home-visit standing facts (4.12 F4). On the PATIENT, never an encounter.
      saveHomeVisit: (id, homeVisit) => authedFetch(`/api/clinical/patients/${id}/home-visit`, {
        method: 'PUT', body: JSON.stringify({ homeVisit })
      }),
      // Session 4.12 — the day, the visit stamps, and the packet read in the car.
      myDay: (date) => authedFetch(`/api/clinical/my-day?date=${encodeURIComponent(date)}`),
      stampVisit: (eid, body) => authedFetch(`/api/clinical/visits/${eid}/timing`, {
        method: 'POST', body: JSON.stringify(body)
      }),
      // T1 — the clinician's own door into the video room. Starting it stamps
      // the visit as started, so there is ONE button rather than a join link
      // plus a Start visit somebody has to remember to press.
      videoRoom: (eid) => authedFetch(`/api/clinical/visits/${eid}/video`),
      startVideoVisit: (eid) => authedFetch(`/api/clinical/visits/${eid}/video/start`, { method: 'POST' }),
      telehealthCheck: (id, euuid, body) => authedFetch(`/api/clinical/patients/${id}/encounters/${encodeURIComponent(euuid)}/telehealth-checks`, {
        method: 'POST', body: JSON.stringify(body)
      }),
      nearby: (clientId, radiusMiles) => authedFetch(`/api/clinical/nearby?clientId=${encodeURIComponent(clientId)}&radiusMiles=${radiusMiles}`),
      workQueues: () => authedFetch('/api/clinical/work-queues'),
      // Patient to-dos (seen by the assignee and the author only) and the
      // on-screen daily digest. Owner, 2026-10-13.
      tasks: (qs) => authedFetch(`/api/clinical/tasks${qs ? `?${qs}` : ''}`),
      createTask: (body) => authedFetch('/api/clinical/tasks', { method: 'POST', body: JSON.stringify(body) }),
      updateTask: (id, body) => authedFetch(`/api/clinical/tasks/${encodeURIComponent(id)}`, { method: 'PUT', body: JSON.stringify(body) }),
      digest: () => authedFetch('/api/clinical/digest'),
      analytics: () => authedFetch('/api/clinical/analytics'),
      // Reading a filed document into proposals, from the chart. The SAME three
      // routes the enrollment screen uses, gated on requireClinicalWrite.
      extractionStatus: (id) => authedFetch(`/api/clinical/patients/${id}/extraction`),
      extractDocument: (id, docId) => authedFetch(`/api/clinical/patients/${id}/documents/${encodeURIComponent(docId)}/extract`, { method: 'POST' }),
      reviewExtraction: (id, exId, decisions) => authedFetch(`/api/clinical/patients/${id}/extraction/${encodeURIComponent(exId)}/review`, {
        method: 'POST', body: JSON.stringify({ decisions })
      }),
      // The comprehensive chart review (Session G1). Starting one answers 202
      // and the screen polls `aiReview` until it is done or failed.
      aiReviews: (id) => authedFetch(`/api/clinical/patients/${id}/ai/reviews`),
      extractRecords: (id, documentIds) => authedFetch(`/api/clinical/patients/${id}/ai/extract-records`, {
        method: 'POST', body: JSON.stringify({ documentIds })
      }),
      aiReview: (id, reviewId) => authedFetch(`/api/clinical/patients/${id}/ai/reviews/${encodeURIComponent(reviewId)}`),
      startAiReview: (id, body) => authedFetch(`/api/clinical/patients/${id}/ai/review`, {
        method: 'POST', body: JSON.stringify(body || {})
      }),
      decideAiFindings: (reviewId, decisions) => authedFetch(`/api/clinical/ai/reviews/${encodeURIComponent(reviewId)}/decisions`, {
        method: 'POST', body: JSON.stringify({ decisions })
      }),
      patientOrders: (id) => authedFetch(`/api/clinical/patients/${id}/orders`),
      patientResults: (id) => authedFetch(`/api/clinical/patients/${id}/results`),
      timeline: (id, kinds) => authedFetch(`/api/clinical/patients/${id}/timeline${kinds && kinds.length ? `?kinds=${encodeURIComponent(kinds.join(','))}` : ''}`),
      messageNote: (id, key) => authedFetch(`/api/clinical/patients/${id}/message-notes/${encodeURIComponent(key)}`),
      callNote: (id, callId) => authedFetch(`/api/clinical/patients/${id}/calls/${encodeURIComponent(callId)}/note`),
      documentCall: (callId) => authedFetch(`/api/clinical/calls/${encodeURIComponent(callId)}/document`, { method: 'POST', body: '{}' }),
      dismissCall: (callId, reason) => authedFetch(`/api/clinical/calls/${encodeURIComponent(callId)}/dismiss`, { method: 'POST', body: JSON.stringify({ reason }) }),
      preVisit: (id, eid) => authedFetch(`/api/clinical/patients/${id}/pre-visit${eid ? `?eid=${encodeURIComponent(eid)}` : ''}`),
      // PROPOSES an order. It never applies one — accepting rebooks through the
      // existing appointment routes so the patient is told.
      optimizeDay: (visits) => authedFetch('/api/clinical/my-day/optimize', {

    const fmtDate = (iso) => iso

    const fmtDueTime = (hm) => {

    const toYmd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const todayYmd = () => toYmd(new Date());

    const mondayOf = (ymd) => { const d = new Date(`${ymd}T12:00:00`); return addDaysYmd(ymd, -((d.getDay() + 6) % 7)); };

    // ── Drawn signature pad (same mechanism as the 3.4 ROI / portal co-sign) ──
    const SignaturePad = ({ padRef }) => {
      const canvasRef = useRef(null);
      const state = useRef({ drawing: false, empty: true });
      useEffect(() => {
        const canvas = canvasRef.current; if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const ratio = window.devicePixelRatio || 1;
        const w = canvas.offsetWidth || 400;
        canvas.width = w * ratio; canvas.height = 130 * ratio;
        ctx.scale(ratio, ratio);
        ctx.strokeStyle = '#033D50'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        state.current = { drawing: false, empty: true };
        const pos = (e) => { const r = canvas.getBoundingClientRect(); const s = e.touches ? e.touches[0] : e; return { x: s.clientX - r.left, y: s.clientY - r.top }; };
        const down = (e) => { state.current.drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
        const move = (e) => { if (!state.current.drawing) return; e.preventDefault && e.preventDefault(); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); state.current.empty = false; };
        const up = () => { state.current.drawing = false; };
        canvas.addEventListener('mousedown', down); canvas.addEventListener('mousemove', move);
        canvas.addEventListener('mouseup', up); canvas.addEventListener('mouseleave', up);
        canvas.addEventListener('touchstart', down, { passive: false });
        canvas.addEventListener('touchmove', move, { passive: false });
        canvas.addEventListener('touchend', up);
        padRef.current = {
          isEmpty: () => state.current.empty,
          toDataURL: () => canvas.toDataURL('image/png'),
          clear: () => { ctx.clearRect(0, 0, canvas.width, canvas.height); state.current.empty = true; }
        };
        return () => {
          canvas.removeEventListener('mousedown', down); canvas.removeEventListener('mousemove', move);
          canvas.removeEventListener('mouseup', up); canvas.removeEventListener('mouseleave', up);
          canvas.removeEventListener('touchstart', down); canvas.removeEventListener('touchmove', move);
          canvas.removeEventListener('touchend', up);
        };
      }, []);
      return (
        <div>
          <canvas ref={canvasRef} style={{ width: '100%', height: 130, background: '#FAF7F2', border: '1px solid #e5ddcb', borderRadius: 8, touchAction: 'none' }} />
          <button type="button" className="text-xs text-primary underline mt-1" onClick={() => padRef.current && padRef.current.clear()}>Clear Signature</button>
        </div>
      );
    };

    // ── Standing orders: the authoring surface (2026-11-06) ──────────────
    // Session 4.8 built the mechanism that lets an RN or LMSW act under a
    // provider's standing authority. Four of its five routes had no caller, so
    // NOBODY COULD WRITE A PROTOCOL — the feature has never been usable. This
    // is the create, the detail, the revision and the activate/retire.
    //
    // Every option is SERVED. `buildStandingOrder` silently drops an order
    // type or executor role outside its own lists, so an option invented here
    // would read as accepted and authorise nothing.
    const PROTO_PILL = {
      active: 'bg-emerald-50 text-emerald-800',
      draft: 'bg-stone-100 text-stone-700',
      expired: 'bg-amber-50 text-amber-800',
      retired: 'bg-stone-100 text-stone-500'
    };
    // Comma or newline separated, trimmed, blanks dropped. The server caps the
    // count and the length of each; this only has to not send empties.
    const protoList = (text) => String(text || '').split(/[\n,]/).map(t => t.trim()).filter(Boolean);

    const ProtocolForm = ({ meta, existing, onCancel, onSaved }) => {
      const padRef = useRef(null);
      const blank = {
        title: '', permittedOrderTypes: [], permittedTests: '', permittedExecutorRoles: [],
        indications: '', patientScope: 'panel', effectiveAt: '', expiresAt: '',
        requiresCoSign: false, coSignWithinDays: '', notes: ''
      };
      // A revision starts from the version it supersedes — retyping a protocol
      // to change its expiry is how a test quietly goes missing from the list.
      const fromExisting = (o) => ({
        title: o.title || '',
        permittedOrderTypes: [...(o.permittedOrderTypes || [])],
        permittedTests: (o.permittedTests || []).join('\n'),
        permittedExecutorRoles: [...(o.permittedExecutorRoles || [])],
        indications: (o.indications || []).join(', '),
        patientScope: o.patientScope || 'panel',
        effectiveAt: '', expiresAt: '',
        requiresCoSign: !!o.requiresCoSign,
        coSignWithinDays: o.coSignWithinDays == null ? '' : String(o.coSignWithinDays),
        notes: o.notes || ''
      });
      const [f, setF] = useState(() => (existing ? fromExisting(existing) : blank));
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState('');
      const toggle = (key, val) => setF(x => ({
        ...x, [key]: x[key].includes(val) ? x[key].filter(v => v !== val) : [...x[key], val]
      }));

      const submit = async (activate) => {
        setErr('');
        // Activating needs the signature, and the server refuses without it
        // (STANDING_ORDER_UNSIGNED). Say so here rather than let the save fail.
        const sig = padRef.current && !padRef.current.isEmpty() ? padRef.current.toDataURL() : null;
        if (activate && !sig) { setErr('Sign the protocol to activate it. Save it as a draft if you are not ready to sign.'); return; }
        const body = {
          title: f.title,
          permittedOrderTypes: f.permittedOrderTypes,
          permittedTests: protoList(f.permittedTests),
          permittedExecutorRoles: f.permittedExecutorRoles,
          indications: protoList(f.indications),
          patientScope: f.patientScope,
          ...(f.effectiveAt ? { effectiveAt: f.effectiveAt } : {}),
          expiresAt: f.expiresAt,
          requiresCoSign: f.requiresCoSign,
          ...(f.coSignWithinDays ? { coSignWithinDays: f.coSignWithinDays } : {}),
          notes: f.notes,
          // A signature is kept on a draft too: it is the document's signature,
          // and withholding it would mean re-signing to activate later.
          ...(sig ? { signatureImage: sig } : {}),
          status: activate ? 'active' : 'draft'
        };
        setBusy(true);
        const r = existing ? await api.reviseStandingOrder(existing.id, body) : await api.createStandingOrder(body);
        setBusy(false);
        // The server's own sentence names the field and why: "permittedTests
        // must list the tests this protocol authorises" is actionable where
        // "could not save" is not.
        if (!r || r.error) { setErr((r && r.error) || 'Could not save the protocol.'); return; }
        onSaved(r.standingOrder, existing ? `Revised to v${r.standingOrder.version}.` : 'Protocol created.');
      };

      return (
        <div className="grid gap-3">
          <div className="flex items-center justify-between">
            <h2 className="cw-title">{existing ? `Revise "${existing.title}"` : 'New standing order'}</h2>
            <button type="button" className="btn ghost" onClick={onCancel}>Cancel</button>
          </div>
          {existing && (
            <div className="card !bg-amber-50 border-amber-200 px-4 py-3 text-[13px] text-amber-900">
              <b>This creates version {(existing.version || 1) + 1} and retires v{existing.version}.</b> The version you are
              replacing is kept exactly as it is, because orders already executed under it reference it.
            </div>
          )}
          <Field label="Title"><input className="inp" value={f.title} maxLength={160}
            onChange={e => setF({ ...f, title: e.target.value })} placeholder="e.g. Annual diabetic monitoring panel" /></Field>

          <Field label="Order types this protocol authorises">
            <div className="flex flex-wrap gap-2">
              {(meta.orderTypes || []).map(t => (
                <button key={t} type="button" onClick={() => toggle('permittedOrderTypes', t)}
                  className={`chip ${f.permittedOrderTypes.includes(t) ? 'bg-primary text-white' : 'bg-stone-100 text-stone-700'}`}>{t}</button>
              ))}
            </div>
          </Field>

          <Field label="Who may act on it">
            <div className="flex flex-wrap gap-2">
              {(meta.executorRoles || []).map(r => (
                <button key={r} type="button" onClick={() => toggle('permittedExecutorRoles', r)}
                  className={`chip ${f.permittedExecutorRoles.includes(r) ? 'bg-primary text-white' : 'bg-stone-100 text-stone-700'}`}>
                  {(meta.roleLabels || {})[r] || r}
                </button>
              ))}
            </div>
            <p className="text-[11.5px] text-stone-500 mt-1">
              A provider needs no protocol, so a provider is not an option. Each role is additionally held to its own
              licence ceiling at execution, so naming a role here cannot widen what their licence allows.
            </p>
          </Field>

          <Field label="Tests this protocol permits">
            <textarea className="inp" rows={4} value={f.permittedTests}
              onChange={e => setF({ ...f, permittedTests: e.target.value })}
              placeholder={'One per line, e.g.\nHbA1c\nLipid panel\nUrine microalbumin'} />
            <p className="text-[11.5px] text-stone-500 mt-1">
              Nothing outside this list can be ordered under the protocol — a test typed in at execution is refused.
              A protocol with no list authorises nothing.
            </p>
          </Field>

          <Field label="ICD-10 indications">
            <input className="inp" value={f.indications} onChange={e => setF({ ...f, indications: e.target.value })}
              placeholder="e.g. E11.9, I10" />
            <p className="text-[11.5px] text-stone-500 mt-1">An order executed under this protocol must link to one of these.</p>
          </Field>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <Field label="Patients">
              <select className="inp" value={f.patientScope} onChange={e => setF({ ...f, patientScope: e.target.value })}>
                {(meta.patientScopes || []).map(sc => (
                  <option key={sc} value={sc}>{sc === 'panel' ? 'The whole panel' : 'Named patients only'}</option>
                ))}
              </select>
            </Field>
            <Field label="Effective from"><input className="inp" type="date" value={f.effectiveAt}
              onChange={e => setF({ ...f, effectiveAt: e.target.value })} /></Field>
            <Field label="Expires"><input className="inp" type="date" value={f.expiresAt}
              onChange={e => setF({ ...f, expiresAt: e.target.value })} /></Field>
          </div>
          <p className="text-[11.5px] text-stone-500 -mt-1">
            An expiry is required. A protocol with no end date is a permission flag wearing a document's clothes;
            annual review is the norm. Leave "effective from" blank to start today.
          </p>

          <Field label="Co-signature">
            <label className="flex items-center gap-2 text-[13px]">
              <input type="checkbox" checked={f.requiresCoSign} onChange={e => setF({ ...f, requiresCoSign: e.target.checked })} />
              An order executed under this protocol needs a provider co-signature
            </label>
            {f.requiresCoSign && (
              <input className="inp mt-2" type="number" min="1" max="90" value={f.coSignWithinDays}
                onChange={e => setF({ ...f, coSignWithinDays: e.target.value })} placeholder="Within how many days" />
            )}
          </Field>

          <Field label="Notes"><textarea className="inp" rows={2} value={f.notes}
            onChange={e => setF({ ...f, notes: e.target.value })} /></Field>

          <Field label="Your signature">
            <SignaturePad padRef={padRef} />
            <p className="text-[11.5px] text-stone-500 mt-1">
              Signing is what makes this a signed clinical document. Unsigned it stays a draft and nobody can act on it.
            </p>
          </Field>

          {err && <div className="card border-red-200 bg-red-50 text-red-700 text-sm px-4 py-3">{err}</div>}
          <div className="flex flex-wrap gap-2">
            <button className="btn ghost" disabled={busy} onClick={() => submit(false)}>{busy ? 'Saving…' : 'Save as Draft'}</button>
            <button className="btn gold" disabled={busy} onClick={() => submit(true)}>{busy ? 'Saving…' : 'Sign and Activate'}</button>
          </div>
        </div>
      );
    };

    const ProtocolDetail = ({ id, meta, canAuthor, onBack, onChanged, onRevise }) => {
      const [d, setD] = useState(null);
      const [err, setErr] = useState('');
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState('');
      const load = useCallback(() => {
        api.standingOrder(id).then(r => { if (r && r.error) setErr(r.error); else { setD(r); setErr(''); } })
          .catch(e => setErr(e.message));
      }, [id]);
      useEffect(() => { load(); }, [load]);
      if (err) return (<div className="grid gap-3"><button className="btn ghost w-fit" onClick={onBack}>Back</button>
        <div className="card border-red-200 bg-red-50 text-red-700 text-sm px-4 py-3">{err}</div></div>);
      if (!d) return <p className="text-sm text-stone-500 px-1">Loading…</p>;
      const o = d.standingOrder || {};
      const setStatus = async (status) => {
        setMsg(''); setBusy(true);
        const r = await api.standingOrderStatus(o.id, status);
        setBusy(false);
        if (!r || r.error) { setMsg((r && r.error) || 'Could not change the status.'); return; }
        load(); onChanged();
      };
      return (
        <div className="grid gap-3">
          <div className="flex items-center justify-between gap-2 flex-wrap">
            <button className="btn ghost" onClick={onBack}><i className="ti ti-chevron-left" />Protocols</button>
            {canAuthor && (
              <div className="flex gap-2">
                {/* Retire, never delete: orders executed under it reference it. */}
                {o.effectiveStatus === 'active' && <button className="btn ghost" disabled={busy} onClick={() => setStatus('retired')}>Retire</button>}
                {o.effectiveStatus === 'draft' && <button className="btn gold" disabled={busy} onClick={() => setStatus('active')}>Activate</button>}
                <button className="btn" disabled={busy} onClick={() => onRevise(o)}>Revise</button>
              </div>
            )}
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <h2 className="cw-title">{o.title}</h2>
            <span className={`chip ${PROTO_PILL[o.effectiveStatus] || ''}`}>{o.effectiveStatus}</span>
            <span className="chip bg-stone-100 text-stone-600">v{o.version}</span>
          </div>
          {o.effectiveStatus === 'expired' && (
            <div className="card !bg-amber-50 border-amber-200 px-4 py-3 text-[13px] text-amber-900">
              <b>This protocol has expired.</b> Nobody can act on it. Revise it to issue a new version with a new expiry —
              activating this one is refused.
            </div>
          )}
          <div className="card px-4 py-3 grid gap-1.5 text-[13px]">
            <div><b>Authorised by</b> {(o.authorizingProvider || {}).name || '—'}{(o.authorizingProvider || {}).npi ? ` (NPI ${o.authorizingProvider.npi})` : ''}</div>
            <div><b>Order types</b> {(o.permittedOrderTypes || []).join(', ') || '—'}</div>
            <div><b>Who may act</b> {(o.permittedExecutorRoles || []).map(r => (meta.roleLabels || {})[r] || r).join(', ') || 'nobody'}</div>
            <div><b>Tests</b> {(o.permittedTests || []).join(', ') || '—'}</div>
            <div><b>Indications</b> {(o.indications || []).join(', ') || '—'}</div>
            <div><b>Patients</b> {o.patientScope === 'named' ? `${(o.namedClientIds || []).length} named` : 'the whole panel'}</div>
            <div><b>Effective</b> {fmtDate(o.effectiveAt)} <b className="ml-2">Expires</b> {fmtDate(o.expiresAt)}</div>
            <div><b>Co-signature</b> {o.requiresCoSign ? `required${o.coSignWithinDays ? ` within ${o.coSignWithinDays} days` : ''}` : 'not required'}</div>
            <div><b>Signed</b> {o.signedAt ? fmtTs(o.signedAt) : 'not signed — this is a draft and nobody can act on it'}</div>
            {o.notes && <div><b>Notes</b> {o.notes}</div>}
            <div><b>Executed</b> {d.executionCount} time{d.executionCount === 1 ? '' : 's'}</div>
          </div>
          {(d.versions || []).length > 1 && (
            <div className="card px-4 py-3">
              <p className="text-[11px] font-semibold uppercase tracking-wide text-stone-500 mb-1">Version history</p>
              {/* Every version is kept: an order executed under v2 references v2
                  forever, even after v3 drops a test from the list. */}
              {d.versions.map(v => (
                <div key={v.id} className="text-[12.5px] text-stone-600">
                  v{v.version} · {v.status}{v.signedAt ? ` · signed ${fmtDate(v.signedAt)}` : ''}{v.id === o.id ? ' · you are reading this one' : ''}
                </div>
              ))}
            </div>
          )}
          {msg && <div className="card border-red-200 bg-red-50 text-red-700 text-sm px-4 py-3">{msg}</div>}
        </div>
      );
    };

    const ProtocolsView = () => {
      const access = useContext(AccessContext);
      const [data, setData] = useState(null);
      const [err, setErr] = useState('');
      const [mode, setMode] = useState({ kind: 'list' });
      const [flash, setFlash] = useState('');
      const load = useCallback(() => {
        api.allStandingOrders().then(r => { if (r && r.error) setErr(r.error); else { setData(r); setErr(''); } })
          .catch(e => setErr(e.message));
      }, []);
      useEffect(() => { load(); }, [load]);

      if (err) return <div className="px-4 py-5"><div className="card border-red-200 bg-red-50 text-red-700 text-sm px-4 py-3">{err}</div></div>;
      if (!data) return <div className="px-4 py-5"><p className="text-sm text-stone-500">Loading…</p></div>;
      // Served, never derived from the role here: the page must not decide a
      // credential question the route re-checks.
      const canAuthor = !!data.canAuthor;
      const meta = data;
      const rows = data.standingOrders || [];

      if (mode.kind === 'new' || mode.kind === 'revise') {
        return (
          <div className="px-4 py-5 max-w-3xl">
            <ProtocolForm meta={meta} existing={mode.kind === 'revise' ? mode.order : null}
              onCancel={() => setMode({ kind: 'list' })}
              onSaved={(o, note) => { setFlash(note); load(); setMode({ kind: 'detail', id: o.id }); }} />
          </div>
        );
      }
      if (mode.kind === 'detail') {
        return (
          <div className="px-4 py-5 max-w-3xl">
            {flash && <div className="card !bg-emerald-50 border-emerald-200 px-4 py-2.5 text-[13px] text-emerald-900 mb-3">{flash}</div>}
            <ProtocolDetail id={mode.id} meta={meta} canAuthor={canAuthor}
              onBack={() => { setFlash(''); setMode({ kind: 'list' }); }}
              onChanged={load}
              onRevise={(o) => { setFlash(''); setMode({ kind: 'revise', order: o }); }} />
          </div>
        );
      }
      return (
        <div className="px-4 py-5 max-w-3xl">
          <div className="flex items-center justify-between gap-2 mb-1 flex-wrap">
            <h1 className="cw-title">Standing orders</h1>
            {canAuthor && <button className="btn gold" onClick={() => { setFlash(''); setMode({ kind: 'new' }); }}><i className="ti ti-plus" />New Protocol</button>}
          </div>
          <p className="text-[13px] text-stone-600 mb-3">
            A signed protocol lets an RN, LCSW or LMSW place an order under a provider's authority, within the tests and
            diagnoses it names.
          </p>
          {/* Not a hidden button: a reader is told who may write one, in the
              server's own words, rather than wondering where the control is. */}
          {!canAuthor && <div className="card px-4 py-3 text-[13px] text-stone-600 mb-3">{data.authorRefusal}</div>}
          {flash && <div className="card !bg-emerald-50 border-emerald-200 px-4 py-2.5 text-[13px] text-emerald-900 mb-3">{flash}</div>}
          {rows.length === 0 && (
            <div className="card px-4 py-4 text-[13px] text-stone-600">
              No standing orders have been written yet.{canAuthor ? ' Write one and an RN or LMSW can act under it.' : ''}
            </div>
          )}
          {rows.map(o => (
            <button key={o.id} type="button" className="card w-full text-left px-4 py-3 mb-2 cw-row"
              onClick={() => { setFlash(''); setMode({ kind: 'detail', id: o.id }); }}>
              <div className="flex items-center gap-2 flex-wrap">
                <b className="text-[14px] text-primary">{o.title}</b>
                <span className={`chip ${PROTO_PILL[o.effectiveStatus] || ''}`}>{o.effectiveStatus}</span>
                <span className="chip bg-stone-100 text-stone-600">v{o.version}</span>
              </div>
              <div className="text-[12.5px] text-stone-600 mt-0.5">
                {(o.permittedOrderTypes || []).join(', ') || 'no order types'} · {(o.permittedExecutorRoles || []).join(', ') || 'nobody'} ·
                expires {fmtDate(o.expiresAt)}
              </div>
            </button>
          ))}
        </div>
      );
    };

    // ── Pre-filled field wrapper: visibly marked until clinician-confirmed ──
    const Prefilled = ({ fieldKey, confirmed, onConfirm, children }) => {
      const isConfirmed = confirmed.includes(fieldKey);
      return (
        <div className={`rounded-lg p-2 ${isConfirmed ? '' : 'prefill'}`}>
          {children}
          {!isConfirmed && (
            <button type="button" className="prefill-badge mt-1 flex items-center gap-1" onClick={() => onConfirm(fieldKey)}>
              <i className="ti ti-alert-circle" /> FROM INTAKE — TAP TO CONFIRM
            </button>
          )}
          {isConfirmed && <span className="text-[9.5px] text-emerald-700 font-bold flex items-center gap-1 mt-1"><i className="ti ti-circle-check" /> CONFIRMED</span>}
        </div>
      );
    };

    const Field = ({ label, children, className }) => (
      <label className={`block ${className || ''}`}>
        <span className="lblu block mb-1">{label}</span>
        {children}
      </label>
    );

    const Login = ({ onLogin }) => {
      const [email, setEmail] = useState(''); const [password, setPassword] = useState('');
      const [err, setErr] = useState(''); const [busy, setBusy] = useState(false);
      // This form had never gone through the MFA step (unlike login.html and
      // admin-hub.html), so a clinical/admin/case-manager account — every one
      // of which MFA has been required for since Session 5.3 — stored the
      // literal token "undefined" and a partial {email, name} user object,
      // then bounced back to this same screen the moment the first
      // authenticated call answered 401. That bounce is what read as a
      // second, duplicate login prompt. window.GFC_MFA.complete() is the one
      // place that already knows how to run the challenge; a response
      // carrying a real token passes straight through it unchanged.
      const submit = (e) => {
        e.preventDefault(); setBusy(true); setErr('');
        api.login(email, password).then(r => window.GFC_MFA.complete(r)).then(r => {
          if (!r || r.error || !r.token) throw new Error((r && r.error) || 'Sign-in failed');
          localStorage.setItem('admin_token', r.token);
          localStorage.setItem('admin_user', JSON.stringify(r.user));
          onLogin(r.user);
        }).catch(e => { setErr(e.message); setBusy(false); });
      };
      return (
        <div className="min-h-screen flex items-center justify-center p-6">
          <form onSubmit={submit} className="card p-8 w-full max-w-sm">
            <img src="/brand/logo-mark-transparent.png" alt="" className="h-12 mb-3" />
            <h1 className="serif text-2xl text-primary font-semibold mb-1">Clinical Workspace</h1>
            <p className="text-xs text-stone-500 mb-5">Authorized clinical staff only. All access is logged.</p>
            <Field label="Email"><input className="inp" type="email" value={email} onChange={e => setEmail(e.target.value)} required /></Field>
            <div className="h-3" />
            <Field label="Password"><input className="inp" type="password" value={password} onChange={e => setPassword(e.target.value)} required /></Field>
            {err && <p className="text-red-600 text-xs mt-3">{err}</p>}
            <button className="btn w-full justify-center mt-5" disabled={busy}>{busy ? 'Signing in…' : 'Sign In'}</button>
          </form>
        </div>
      );
    };

    // ── The chart's documents ──
    //
    // Fed by chart.chartDocuments, not by the FHIR read: OpenEMR returns nothing
    // for documents on this instance, so a panel wired to that read shows an
    // empty chart for a patient whose record is full. Rows carry where they can
    // be read from, and an EMR row that cannot be opened here SAYS SO rather
    // than being dropped — a missing row reads as "no such document".
    // Scanning into the chart (2026-09-22, owner-directed). Until now the
    // clinical area had NO file input at all — a document handed over at a home
    // visit, or faxed by a doctor's office, had nowhere to go from here.
    //
    // It files into the CLIENT's document store, the same one the enrollment
    // screen and the client's portal read, so a scan taken at the bedside ticks
    // the office's checklist and the client sees it. A second clinical-only
    // store would mean the office chasing a document a clinician already holds.
    const ChartScanIn = ({ clientId, onFiled }) => {
      const [kinds, setKinds] = useState(null);
      const [kind, setKind] = useState('');
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState(null);
      useEffect(() => {
        let live = true;
        api.documentKinds(clientId)
          .then(r => {
            if (!live) return;
            const list = (r && r.catalog) || [];
            setKinds(list);
            // The page names no document kind of its own — the catalog is
            // served, so the picker cannot drift from the validator that
            // refuses one it does not know.
            if (list.length) setKind(list[0].kind);
          })
          .catch(e => { if (live) setMsg({ ok: false, text: e.message }); });
        return () => { live = false; };
      }, [clientId]);

      const pick = (file) => {
        if (!file || !kind) return;
        setBusy(true); setMsg(null);
        const reader = new FileReader();
        reader.onload = () => {
          api.fileClientDocument(clientId, { kind, fileName: file.name, fileDataB64: String(reader.result) })
            .then(r => { setMsg({ ok: true, text: r.message }); onFiled && onFiled(); })
            .catch(e => setMsg({ ok: false, text: e.message }))
            .finally(() => setBusy(false));
        };
        reader.onerror = () => { setMsg({ ok: false, text: 'That file could not be read.' }); setBusy(false); };
        reader.readAsDataURL(file);
      };

      return (
        <div className="border-t border-stone-100 mt-3 pt-3">
          <div className="text-[13px] font-semibold text-primary mb-2">Scan a document into this file</div>
          <div className="flex flex-wrap items-center gap-2">
            <select className="inp max-w-[260px]" value={kind} disabled={busy || !kinds} onChange={e => setKind(e.target.value)}>
              {(kinds || []).map(k => <option key={k.kind} value={k.kind}>{k.label}</option>)}
            </select>
            <label className={`btn ghost ${busy || !kind ? 'opacity-50' : 'cursor-pointer'}`}>
              <i className="ti ti-scan" />{busy ? 'Filing…' : 'Choose file'}
              <input type="file" className="hidden" accept=".pdf,.jpg,.jpeg,.png" disabled={busy || !kind}
                onChange={e => { pick((e.target.files || [])[0]); e.target.value = ''; }} />
            </label>
            <Hint className="w-full">
              Any clinical staff member can attach a document. A care coordinator or the admin approves it,
              and it reaches OpenEMR once approved. The patient sees it only if someone shares it. PDF, JPG or PNG.
            </Hint>
          </div>
          {!kinds && !msg && <p className="text-[11px] text-stone-400 mt-2">Reading the document list…</p>}
          {msg && <p className={`text-xs mt-1 ${msg.ok ? 'text-emerald-700' : 'text-red-600'}`}>{msg.text}</p>}
        </div>
      );
    };

    // ── Reading a document into proposals, from the CHART (2026-09-23) ─────
    // The same three routes the enrollment screen uses, registered a second
    // time under requireClinicalWrite. A clinician filing a referral or a face
    // sheet at a visit reads it where they are, instead of going to the
    // enrollment screen for it — and what comes back goes through exactly the
    // review a staff-triggered read goes through.
    //
    // NOTHING ABOUT WHAT AN EXTRACTION IS LIVES HERE. The allow-list, the
    // identity-conflict guard, the stale-field refusal and the staff-verified
    // provenance are all server-side and shared; this renders the answer.
    const ChartExtractionRow = ({ row, decision, onDecide }) => {
      const [edited, setEdited] = useState(row.value);
      useEffect(() => { setEdited(row.value); }, [row.value]);
      const isEdit = decision && decision.decision === 'edit';
      return (
        <div className="border-b border-stone-100 py-2 last:border-0">
          <div className="flex items-start justify-between gap-2 flex-wrap">
            <div className="min-w-0">
              <div className="lblu">{row.label}</div>
              <div className="text-[13px] text-stone-800 break-words">
                {isEdit
                  ? <input className="inp !py-1 text-[13px]" value={edited}
                    onChange={e => { setEdited(e.target.value); onDecide(row.path, { decision: 'edit', value: e.target.value }); }} />
                  : row.value}
              </div>
              <div className="text-[11px] text-stone-500">
                {[row.snapshot ? `on file: ${row.snapshot}` : 'nothing on file',
                  row.confidence != null ? `${Math.round(row.confidence * 100)}% confident` : null
                ].filter(Boolean).join(' · ')}
              </div>
            </div>
            <div className="flex gap-1.5 shrink-0">
              {[['accept', 'Keep'], ['edit', 'Edit'], ['discard', 'Discard']].map(([d, label]) => (
                <button key={d}
                  className={`chip border ${decision && decision.decision === d ? 'bg-primary text-white border-primary' : 'bg-white text-stone-600 border-stone-200'}`}
                  onClick={() => onDecide(row.path, d === 'edit' ? { decision: 'edit', value: edited } : { decision: d })}>
                  {label}
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    };

    const ChartExtractionReview = ({ clientId, extraction, onDone, onCancel }) => {
      const [decisions, setDecisions] = useState({});
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState('');
      const decide = (path, d) => setDecisions(prev => ({ ...prev, [path]: d }));
      const rows = (extraction.rows || []).filter(r => !r.verifyOnly);
      // A review with anything undecided is NOT complete — an enrollment must
      // not finish on a half-read scan. The server enforces it; saying so here
      // stops somebody hitting a refusal they could have seen coming.
      const undecided = rows.filter(r => !decisions[r.path]).length;
      const save = () => {
        setBusy(true); setErr('');
        api.reviewExtraction(clientId, extraction.id, decisions)
          .then(() => onDone())
          .catch(e => setErr(e.message))
          .finally(() => setBusy(false));
      };
      return (
        <div className="border border-accent rounded-lg p-3 bg-cream mt-2">
          <div className="flex items-center justify-between gap-2">
            <div className="font-semibold text-[13px] text-primary">Read from {extraction.fileName || 'the document'}</div>
            <button className="text-[11.5px] text-stone-500 underline" onClick={onCancel}>Close</button>
          </div>
          <p className="text-[11.5px] text-stone-600 mt-1">
            Nothing here has been saved. Check each value — what you keep is recorded as checked by you.
          </p>
          {extraction.source === 'ocr' && (
            <div className="text-[11.5px] text-amber-900 bg-amber-50 border border-amber-200 rounded p-2 mt-2">
              <b>Read from a picture.</b> This document had no text in it, so the words were recognised from the
              image{extraction.ocrConfidence ? ` (about ${Math.round(extraction.ocrConfidence)}% legible)` : ''}.
              Check every character before you keep it.
            </div>
          )}
          {extraction.reader === 'template' && extraction.source !== 'ocr' && (
            <p className="text-[11.5px] text-stone-500 mt-1">Read from the document's own text by matching its printed labels.</p>
          )}
          {extraction.readNotice && (
            <div className="text-[11.5px] text-amber-900 bg-amber-50 border border-amber-200 rounded p-2 mt-2">
              <b>Not all of this document was read.</b> {extraction.readNotice}
            </div>
          )}
          {(extraction.identityConflicts || []).length > 0 && (
            <div className="text-[12px] text-red-800 bg-red-50 border border-red-200 rounded p-2 mt-2">
              <b>This document may not be about this patient.</b>
              {extraction.identityConflicts.map((c, i) => (
                <div key={i}>{c.label}: document says <b>{c.onDocument}</b>, record says <b>{c.onFile || '—'}</b></div>
              ))}
            </div>
          )}
          <div className="mt-2">
            {rows.map(r => (
              <ChartExtractionRow key={r.path} row={r} decision={decisions[r.path]} onDecide={decide} />
            ))}
            {!rows.length && <p className="text-[12px] text-stone-500">Nothing in this document matched a field we record.</p>}
          </div>
          {err && <p className="text-[11.5px] text-red-600 mt-1">{err}</p>}
          {rows.length > 0 && (
            <div className="flex items-center gap-2 mt-2">
              <button className="btn gold !py-1 !px-3 text-xs" disabled={busy || undecided > 0} onClick={save}>
                {busy ? 'Saving…' : 'Save Selections'}
              </button>
              {undecided > 0 && <span className="text-[11.5px] text-stone-500">{undecided} still to decide</span>}
            </div>
          )}
        </div>
      );
    };

    const ChartReadButton = ({ clientId, doc, status, onRead }) => {
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState('');
      const access = useContext(AccessContext);
      // Only an UPLOAD can be read, and only a kind the server declares. Both
      // facts are SERVED — a page that decides either drifts from the module
      // that refuses one.
      if (!access.canWrite || !status || !doc.uploadId) return null;
      if (!doc.kind || !(status.extractableKinds || []).includes(doc.kind)) return null;
      if (!status.available) {
        return <span className="chip bg-stone-100 text-stone-500" title={(status.blockers || []).join('\n')}>Reading not switched on</span>;
      }
      const run = () => {
        setBusy(true); setErr('');
        api.extractDocument(clientId, doc.uploadId)
          .then(r => onRead({ ...r.extraction, fileName: doc.title }))
          .catch(e => setErr(e.message))
          .finally(() => setBusy(false));
      };
      return (
        <span className="flex items-center gap-1.5">
          <button className="chip border border-accent text-primary bg-white" disabled={busy} onClick={run}>
            {busy ? 'Reading…' : 'Read'}
          </button>
          {err && <span className="text-[11px] text-red-600">{err}</span>}
        </span>
      );
    };

    // ── F3: reading outside records into proposals, from the chart ────────
    //
    // NOTHING HERE WRITES ANYTHING. Each proposal is added through the
    // EXISTING route for that kind — the medication reconciliation, the
    // allergy write, the problem write — with the clinician's own session and
    // that route's own capability check. There is no second door into a
    // patient's record, and which "Add" buttons this viewer gets is answered
    // by the SERVER (`can.*`) rather than worked out here.
    const AiRecordsExtract = ({ clientId, docs, onRefresh }) => {
      const [picked, setPicked] = useState([]);
      const [run, setRun] = useState(null);     // the ai_reviews row
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);
      const [done, setDone] = useState({});     // key -> 'added' | 'dismissed'
      const [status, setStatus] = useState(null);

      const uploads = (docs || []).filter(d => d.uploadId);

      useEffect(() => {
        if (!clientId) return;
        let live = true;
        api.aiReviews(clientId).then(r => { if (live) setStatus(r); }).catch(() => {});
        return () => { live = false; };
      }, [clientId]);

      // Poll while it reads, the same way the review card does.
      useEffect(() => {
        if (!run || run.status !== 'running' || !clientId) return;
        let live = true;
        const t = setInterval(() => {
          api.aiReview(clientId, run.id)
            .then(r => { if (live && r && r.review) setRun({ ...r.review, can: r.can }); })
            .catch(() => {});
        }, 4000);
        return () => { live = false; clearInterval(t); };
      }, [run && run.id, run && run.status, clientId]);

      if (!status || !status.available || !status.canRun || !uploads.length) return null;

      const start = () => {
        setBusy(true); setErr(null); setDone({});
        api.extractRecords(clientId, picked)
          .then(r => api.aiReview(clientId, r.reviewId))
          .then(r => setRun({ ...r.review, can: r.can }))
          .catch(e => setErr(e.message))
          .finally(() => setBusy(false));
      };

      const out = (run && run.output) || null;
      const mark = (key, how) => setDone(prev => ({ ...prev, [key]: how }));

      const add = (key, path, body) => {
        setErr(null);
        authedFetch(`/api/clinical/patients/${clientId}/${path}`, { method: 'POST', body: JSON.stringify(body) })
          .then(() => { mark(key, 'added'); onRefresh && onRefresh(); })
          .catch(e => setErr(e.message));
      };

      const Cite = ({ c }) => !c ? null : (
        <div className="text-[11px] text-stone-500 mt-0.5">
          {c.sourceId}{c.page ? ` p${c.page}` : ''}{c.quote ? ` — “${c.quote}”` : ''}
        </div>
      );

      const Row = ({ k, label, detail, inChart, citation, canAdd, onAdd }) => {
        const state = done[k];
        return (
          <div className="border border-stone-200 rounded p-2">
            <div className="flex items-start justify-between gap-2">
              <div>
                <div className="text-[13px] text-stone-800">{label}</div>
                {detail && <div className="text-[12px] text-stone-600">{detail}</div>}
                <Cite c={citation} />
              </div>
              <div className="flex items-center gap-1.5 shrink-0">
                <span className={`chip ${inChart ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-800'}`}>
                  {inChart ? 'In chart' : 'New'}
                </span>
                {state
                  ? <span className="chip bg-stone-100 text-stone-600">{state === 'added' ? 'Added' : 'Dismissed'}</span>
                  : <>
                      {/* A button the server would refuse is not shown. */}
                      {canAdd && !inChart && <button className="chip border border-accent text-primary bg-white" onClick={onAdd}>Add</button>}
                      <button className="chip border border-stone-200 bg-white text-stone-600" onClick={() => mark(k, 'dismissed')}>Dismiss</button>
                    </>}
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="border-t border-stone-100 mt-3 pt-3">
          <div className="text-[13px] font-semibold text-primary"><i className="ti ti-sparkles mr-1" />Read outside records with AI</div>
          <div className="text-[12px] text-stone-500">
            Pick the records that came from somewhere else. Nothing is saved until you add it.
          </div>

          {!run && (
            <>
              <div className="mt-2 max-h-40 overflow-auto space-y-1">
                {uploads.map(d => (
                  <label key={d.uploadId} className="flex items-center gap-2 text-[12px] text-stone-700">
                    <input type="checkbox" checked={picked.includes(String(d.uploadId))}
                      onChange={e => setPicked(prev => e.target.checked
                        ? [...prev, String(d.uploadId)]
                        : prev.filter(x => x !== String(d.uploadId)))} />
                    <span className="truncate">{d.description || 'Document'}</span>
                  </label>
                ))}
              </div>
              <button className="btn gold !py-1.5 mt-2" disabled={busy || !picked.length} onClick={start}>
                {busy ? 'Starting…' : `Read ${picked.length || ''} record${picked.length === 1 ? '' : 's'}`}
              </button>
            </>
          )}

          {err && <div className="text-[12px] text-red-800 bg-red-50 border border-red-200 rounded p-2 mt-2">{err}</div>}

          {run && run.status === 'running' && (
            <div className="text-[13px] text-stone-700 mt-2"><i className="ti ti-loader-2 animate-spin mr-1" />Reading…</div>
          )}
          {run && run.status === 'failed' && (
            <div className="text-[12px] text-red-800 bg-red-50 border border-red-200 rounded p-2 mt-2">
              {run.error || 'That read did not finish.'}
            </div>
          )}

          {out && (
            <div className="mt-2 space-y-3">
              <div className="text-[12px] text-amber-900 bg-amber-50 border border-amber-300 rounded p-2">
                AI draft from Gemini. Check every item against its quote before adding it. Nothing here is in the chart yet.
              </div>

              {!!(out.medications || []).length && (
                <div>
                  <div className="text-[12px] font-semibold text-stone-700">Medications</div>
                  <div className="mt-1 space-y-1">
                    {out.medications.map((m, i) => (
                      <Row key={`m${i}`} k={`m${i}`} label={m.name}
                        detail={[m.dose, m.route, m.frequency, m.status].filter(Boolean).join(' · ')}
                        inChart={m.matchesChart} citation={m.citation}
                        canAdd={!!(run.can && run.can.medRec)}
                        onAdd={() => add(`m${i}`, 'medrec', {
                          decisions: [{ action: 'add', name: m.name, dose: m.dose || '', route: m.route || '', frequency: m.frequency || '' }]
                        })} />
                    ))}
                  </div>
                </div>
              )}

              {!!(out.allergies || []).length && (
                <div>
                  <div className="text-[12px] font-semibold text-stone-700">Allergies</div>
                  <div className="mt-1 space-y-1">
                    {out.allergies.map((a, i) => (
                      <Row key={`a${i}`} k={`a${i}`} label={a.substance} detail={a.reaction}
                        inChart={a.matchesChart} citation={a.citation}
                        canAdd={!!(run.can && run.can.allergy)}
                        onAdd={() => add(`a${i}`, 'allergies', { allergen: a.substance, reaction: a.reaction || '' })} />
                    ))}
                  </div>
                </div>
              )}

              {!!(out.problems || []).length && (
                <div>
                  <div className="text-[12px] font-semibold text-stone-700">Problems</div>
                  <div className="mt-1 space-y-1">
                    {out.problems.map((pr, i) => (
                      <Row key={`p${i}`} k={`p${i}`} label={pr.description}
                        inChart={pr.matchesChart} citation={pr.citation}
                        canAdd={!!(run.can && run.can.problem)}
                        /* NO CODE IS SENT. §10.4 — coding is the clinician's
                           decision and a model-proposed code reads exactly as
                           plausibly as a right one. */
                        onAdd={() => add(`p${i}`, 'problems', { title: pr.description })} />
                    ))}
                  </div>
                </div>
              )}

              {!!(out.events || []).length && (
                <div>
                  <div className="text-[12px] font-semibold text-stone-700">Events</div>
                  <div className="mt-1 space-y-1">
                    {out.events.map((e, i) => (
                      <div key={i} className="border border-stone-200 rounded p-2">
                        <div className="text-[13px] text-stone-800">{e.date || '—'} · {e.type.replace('_', ' ')}</div>
                        <div className="text-[12px] text-stone-600">{e.description}</div>
                        <Cite c={e.citation} />
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {!!(out.unreadable || []).length && (
                <div>
                  <div className="text-[12px] font-semibold text-stone-700">Not read</div>
                  <ul className="text-[12px] text-stone-600 list-disc pl-4 mt-1 space-y-0.5">
                    {out.unreadable.map((u, i) => <li key={i}>{u}</li>)}
                  </ul>
                </div>
              )}

              {run.droppedUncited > 0 && (
                <div className="text-[11px] text-stone-500">
                  {run.droppedUncited} item{run.droppedUncited === 1 ? '' : 's'} were left out because they did not quote a source.
                </div>
              )}

              <button className="btn !py-1.5" onClick={() => { setRun(null); setPicked([]); }}>Done</button>
            </div>
          )}
        </div>
      );
    };

    const ChartDocuments = ({ docs, clientId, onRefresh }) => {
      const [busy, setBusy] = useState('');
      const [err, setErr] = useState('');
      // The share route admits a licensed clinician or a manager, and a care
      // coordinator is stored as a manager, so they get the toggle too.
      const licensed = useCanWrite();
      const documents = useCanDocument();
      const canWrite = licensed || documents;
      // Approving a document another staff member attached (owner,
      // 2026-10-16): a care coordinator or the admin. The server says who.
      const canApproveDocs = !!useContext(AccessContext).canApproveDocuments;
      const review = async (d, decision) => {
        let reason = '';
        if (decision === 'rejected') {
          reason = window.prompt('Why is this document being rejected?') || '';
          if (!reason.trim()) return;
        }
        setBusy(d.id); setErr('');
        try {
          await api.reviewDocument(clientId, d.uploadId, decision, reason);
          onRefresh && onRefresh();
        } catch (e) { setErr(e.message || 'That could not be saved.'); }
        finally { setBusy(''); }
      };
      // Whether the patient sees a document the office filed (owner,
      // 2026-09-29). Off until someone shares it; the server decides who may.
      const setShared = async (d, shared) => {
        setBusy(d.id); setErr('');
        try {
          const res = await fetch(`${API_URL}/api/gfc/admin/enrollment/${clientId}/documents/${encodeURIComponent(d.uploadId)}/share`, {
            method: 'PUT',
            headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ shared })
          });
          if (!res.ok) {
            let msg = 'That could not be changed.';
            try { const j = await res.json(); msg = j.error || msg; } catch (e) { /* non-JSON body */ }
            setErr(msg); return;
          }
          onRefresh && onRefresh();
        } catch (e) { setErr('That could not be changed.'); }
        finally { setBusy(''); }
      };
      // Which kinds can be read, and whether reading is on at all. ASKED OF THE
      // SERVER: a page that lists the readable kinds itself drifts from the
      // module that refuses one.
      const [readStatus, setReadStatus] = useState(null);
      const [reviewing, setReviewing] = useState(null);
      useEffect(() => {
        if (!clientId) return;
        let live = true;
        api.extractionStatus(clientId).then(r => { if (live) setReadStatus(r); }).catch(() => {});
        return () => { live = false; };
      }, [clientId]);

      const open = async (d) => {
        if (!d.openable || !clientId) return;
        setBusy(d.id); setErr('');
        try {
          const res = await fetch(`${API_URL}/api/clinical/patients/${clientId}/documents/${encodeURIComponent(d.id)}/file`, {
            headers: { 'Authorization': `Bearer ${getToken()}` }
          });
          if (!res.ok) {
            let msg = 'That document could not be opened.';
            try { const j = await res.json(); msg = j.error || msg; } catch (e) { /* non-JSON body */ }
            setErr(msg); return;
          }
          const ct = res.headers.get('content-type') || '';
          // A record release hands back its filed Drive reference rather than
          // re-rendering, so what a clinician reads is what the provider got.
          if (ct.includes('application/json')) {
            const j = await res.json();
            if (j.url) window.open(j.url, '_blank');
            else setErr('No stored copy of that document.');
            return;
          }
          const url = URL.createObjectURL(await res.blob());
          window.open(url, '_blank');
          setTimeout(() => URL.revokeObjectURL(url), 60000);
        } catch (e) { setErr('That document could not be opened.'); }
        finally { setBusy(''); }
      };

      // Grouped by what the document IS, which is how a clinician looks for one.
      // Every category buildChartDocumentIndex can emit must be named here, or
      // its rows silently drop out of the list.
      const order = ['Plan of care', 'Consent', 'Record release', 'From the client', 'Filed by staff', 'In the EMR'];
      const groups = order
        .map(g => ({ name: g, rows: docs.filter(d => d.category === g) }))
        .filter(g => g.rows.length);

      return (
        <div className="card mb-4">
          <div className="card-h">
            <h2><i className="ti ti-files mr-1 text-accent" />Documents</h2>
            <span className="chip bg-stone-100 text-stone-600">{docs.length}</span>
          </div>
          <div className="p-4 text-sm">
            {err && <p className="text-red-600 text-xs mb-2">{err}</p>}
            {docs.length === 0 && <p className="text-stone-400 text-xs">No documents on file for this patient.</p>}
            {groups.map(g => (
              <div key={g.name} className="mb-3 last:mb-0">
                <div className="text-[11px] uppercase tracking-wide text-stone-400 font-medium mb-1">{g.name}</div>
                {g.rows.map(d => (
                  <div key={d.id} className="flex items-start justify-between gap-3 border-b border-stone-100 py-1.5 last:border-0">
                    <div className="min-w-0">
                      {d.openable ? (
                        <button className="text-left text-accent hover:underline disabled:opacity-50"
                          disabled={busy === d.id} onClick={() => open(d)}>
                          {busy === d.id ? 'Opening…' : d.title}
                        </button>
                      ) : <span className="text-stone-700">{d.title}</span>}
                      <div className="text-xs text-stone-400">
                        {[d.date && fmtDate(d.date), d.note].filter(Boolean).join(' · ')}
                      </div>
                    </div>
                    <div className="shrink-0 flex items-center gap-1.5">
                      {d.filedBy === 'staff' && (canWrite
                        ? <button className={`chip border ${d.sharedWithPatient ? 'border-emerald-300 bg-emerald-50 text-emerald-700' : 'border-stone-300 bg-white text-stone-600'}`}
                            disabled={busy === d.id} onClick={() => setShared(d, !d.sharedWithPatient)}
                            title={d.sharedWithPatient ? 'The patient can see this. Click to hide it.' : 'The patient cannot see this. Click to share it with them.'}>
                            {d.sharedWithPatient ? 'Shared with Patient' : 'Hidden from Patient'}
                          </button>
                        : <span className="chip bg-stone-100 text-stone-600">{d.sharedWithPatient ? 'Shared with Patient' : 'Hidden from Patient'}</span>)}
                      {/* Owner, 2026-10-16: a care coordinator or the admin approves what other staff attach. */}
                      {d.awaitingApproval && <span className="chip bg-amber-50 text-amber-800">Awaiting Approval</span>}
                      {d.awaitingApproval && canApproveDocs && (
                        <>
                          <button className="chip border border-emerald-300 bg-emerald-50 text-emerald-700" disabled={busy === d.id}
                            onClick={() => review(d, 'accepted')}>Approve</button>
                          <button className="chip border border-red-200 bg-white text-red-700" disabled={busy === d.id}
                            onClick={() => review(d, 'rejected')}>Reject</button>
                        </>
                      )}
                      {d.inChart && <span className="chip bg-emerald-50 text-emerald-700">In EMR</span>}
                      {d.emrWaiting && <span className="chip bg-amber-50 text-amber-800" title="Filing into OpenEMR with your sign-in now. Refresh to see it.">Filing to EMR</span>}
                      {!d.openable && <span className="chip bg-amber-50 text-amber-800">Open in OpenEMR</span>}
                      <ChartReadButton clientId={clientId} doc={d} status={readStatus}
                        onRead={(ex) => setReviewing(ex)} />
                    </div>
                  </div>
                ))}
