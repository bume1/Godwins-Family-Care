                <p className="text-[10.5px] text-stone-400 mt-2">Record only — e-prescribing is out of scope; transmission continues as today.</p>
              </div>
            </div>
            <VisitDocumentsCard clientId={patient.id} euuid={euuid} />
            <div className="card">
              <div className="card-h"><h2>Orders</h2>{!locked && (canOrderDirect || canOrderStanding || canRefer) && <button className="btn ghost !py-1 !px-2.5 text-xs" onClick={() => setShowOrder(v => !v)}>{showOrder ? 'Close' : '+ Record Order'}</button>}</div>
              <div className="p-4 text-sm">
                {d.orders.length === 0 && <p className="text-xs text-stone-400">None recorded on this encounter.</p>}
                {d.orders.map(o => {
                  // A referral's lifecycle is not a lab's, so the transitions
                  // come from the map the SERVER chose for this order's type.
                  const toWho = o.referral && (o.referral.destination === 'internal'
                    ? ((o.referral.assignedTo && o.referral.assignedTo.name) || '')
                    : o.referral.receivingPractice);
                  const headline = o.orderType === 'referral'
                    ? `Referral · ${(o.referral && o.referral.specialty) || ''}${toWho ? ` → ${toWho}` : ''}`
                    : o.orderType === 'dme'
                      ? `DME · ${(o.dme && o.dme.itemDescription) || ''}${o.dme && o.dme.quantity ? ` ×${o.dme.quantity}` : ''}`
                      : `${o.orderType} · ${o.priority} — ${(o.tests || []).join(', ')}`;
                  return (
                  <div key={o.id} className="py-1.5 border-b border-stone-100 last:border-0">
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <div className="font-semibold text-[13px]">{headline}{o.afterSigning && <span className="chip bg-amber-50 text-amber-800 ml-2">Added After Signing</span>}</div>
                      <span className={`chip ${['resulted', 'completed'].includes(o.status) ? 'bg-emerald-50 text-emerald-700' : o.status === 'cancelled' ? 'bg-stone-100 text-stone-500' : 'bg-primary-50 text-primary'}`}>{ORDER_LABEL[o.status] || o.status}</span>
                    </div>
                    <div className="text-xs text-stone-500">
                      dx {o.diagnosisCodes.join(', ')} · {npiLabel(o.orderingClinician)} · {fmtTs(o.createdAt)}
                      {o.orderReference && <span> · <b className="text-stone-700">{o.orderReference}</b></span>}
                    </div>
                    {o.orderType === 'dme' && o.dme && o.dme.requiresWOPD &&
                      <div className="text-[11px] font-semibold text-amber-800 mt-0.5">Written order prior to delivery — the supplier may not deliver before they hold it.</div>}
                    {o.orderType === 'referral' && o.referral && o.referral.priorAuthRequired &&
                      <div className="text-[11px] text-amber-800 mt-0.5">Prior authorization required{o.referral.priorAuthNumber ? ` — ${o.referral.priorAuthNumber}` : ' — not yet obtained'}.</div>}
                    {o.referral && o.referral.appointmentDate &&
                      <div className="text-[11px] text-stone-600 mt-0.5">Appointment {o.referral.appointmentDate}.</div>}
                    {o.medicareEnrollmentAcknowledgment &&
                      <div className="text-[11px] text-amber-800 mt-0.5">Placed with an acknowledged 42 CFR 424.507 warning — {o.medicareEnrollmentAcknowledgment.reason}</div>}
                    <OrderActions order={o} channels={d.sendChannels} channelLabels={d.sendChannelLabels}
                      defaultChannel={d.defaultSendChannel} faxChannels={d.faxSendChannels}
                      interpretations={d.resultInterpretations} busy={busy === `o${o.id}`}
                      destinationFields={d.destinationFields} editableStatuses={d.destinationEditableStatuses}
                      onDestination={(body) => run(`o${o.id}`, () => api.updateOrderDestination(o.id, body))}
                      onCancel={(reason) => run(`o${o.id}`, () => api.orderStatus(o.id, 'cancelled', reason))}
                      onAccept={() => run(`o${o.id}`, () => api.acceptReferral(o.id))}
                      onComplete={(note) => run(`o${o.id}`, () => api.completeReferral(o.id, note))}
                      onSent={(body) => run(`o${o.id}`, () => api.markOrderSent(o.id, body))}
                      onScheduled={(date) => run(`o${o.id}`, () => api.markReferralScheduled(o.id, date))}
                      onResult={(r) => {
                        const fd = new FormData();
                        fd.append('file', r.file);
                        ['interpretation', 'resultDate', 'performedBy', 'summary'].forEach(k => fd.append(k, r[k]));
                        return run(`o${o.id}`, () => api.attachResult(o.id, fd));
                      }} />
                  </div>
                  );
                })}
                {showOrder && !locked && (canOrderDirect || canOrderStanding || canRefer) &&
                  <OrderForm clientId={patient.id} diagnoses={d.record.diagnoses || []} types={d.orderTypes} priorities={d.orderPriorities} busy={busy === 'order'}
                    dxNotice={diagnoses.some(x => !(d.record.diagnoses || []).some(y => y.code === x.code)) ? 'Save the coding first. Diagnoses added since the last save can\'t be linked to an order yet.' : ''}
                    docTypes={d.documentOrderTypes}
                    standingOrders={standingOrders} requireStandingOrder={!canOrderDirect} enrollmentWarning={orderEnrollmentWarning}
                    onSave={(f) => run('order', () => api.addOrder(patient.id, euuid, f).catch(e => {
                      // Keep the 424.507 refusal so the form can ask for the acknowledgment.
                      if (e && e.data && e.data.needsReason) setOrderEnrollmentWarning(e.data);
                      throw e;
                    })).then(onOk(() => { setShowOrder(false); setOrderEnrollmentWarning(null); }))} />}
                {!locked && !canOrderDirect && canOrderStanding && <Hint className="mt-2">You place orders under a signed standing order. Pick the protocol, then the test it permits. A referral needs no protocol.</Hint>}
                {!locked && !canOrderDirect && !canOrderStanding && canRefer && <Hint className="mt-2">You can refer this patient{canReferExternal ? '' : ' to someone on the team'}. Tests and equipment are ordered by a provider.</Hint>}
                <Hint className="mt-2">The app generates; a person transmits. Open the requisition, fax it from Doximity, then record the send here — that is what moves an order to sent. Attaching the result is what moves it to resulted. Both still work after the encounter is signed.</Hint>
              </div>
            </div>
          </div>}
          </div>

          <div hidden={step !== 'sign'}>
          {!locked && ns.status === 'draft' && na.canEdit && na.canSign === false && (
            <div className="card mb-4">
              <div className="card-h"><h2>Sign &amp; Submit</h2></div>
              <div className="p-4 text-sm text-stone-700">You prepare this note as a <b>care coordinator</b>. Save the draft and the clinician on the visit reviews it, edits anything they need and signs. Your name stays on the note as the person who prepared it.</div>
            </div>
          )}

          {!locked && ns.status === 'draft' && !na.canEdit && (
            <div className="card mb-4">
              <div className="card-h"><h2>Sign &amp; Submit</h2></div>
              <div className="p-4 text-sm text-amber-800">Signing a note requires a clinical licence (RN, LCSW, LMSW or provider).</div>
            </div>
          )}

          {/* Phase 3: the clinician confirms the facts of her visit; the level is
              derived from them. Shown just above Sign, because they decide the
              level she attests to (owner, 2026-11-04). Not for an author signer
              (RN, LMSW), and gone once billing has submitted. */}
          {canWrite && !na.signsAsAuthor && (!d.record.renderingProvider || d.record.renderingProvider.id === (d.me || {}).id) && (
            <ModifierReasonsPanel patientId={patient.id} euuid={euuid} items={d.modifierJustifications} onChanged={load} />
          )}
          {canWrite && !na.signsAsAuthor && !['billed', 'no_charge'].includes(d.billingStatus) && (
            <VisitFactsPanel patientId={patient.id} euuid={euuid} derivation={d.emDerivation} onChanged={load} />
          )}

          {/* Sign & submit. A provider's signature (an LCSW's, for the
              behavioral-health set) is the billable one; an RN's or LMSW's is
              the AUTHOR's and waits for a clinician addendum. The server
              decides which, and the readiness shown is the one for THIS viewer. */}
          {!locked && ns.status === 'draft' && na.canEdit && na.canSign !== false && (
            <div className="card mb-4">
              <div className="card-h"><h2>Sign &amp; Submit</h2>
                {noteDirty
                  ? <span className="chip bg-amber-50 text-amber-800">Unsaved note</span>
                  : <span className={`chip ${d.signReadiness.ok ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-800'}`}>{d.signReadiness.ok ? 'Ready to sign' : `${d.signReadiness.missing.length} blocker${d.signReadiness.missing.length > 1 ? 's' : ''}`}</span>}
              </div>
              <div className="p-4 grid gap-3 text-sm">
                {na.signsAsAuthor && <p className="text-xs text-stone-600">You sign as the note's <b>author</b>. It locks, and it is not billable until a provider — or an LCSW, for a behavioral-health note — adds the clinician addendum. Diagnoses are theirs to confirm.</p>}
                {!na.signsAsAuthor && <p className="text-xs text-stone-600">Signing locks the note for clinicians and sends it to <b>billing</b>, who add the service codes and submit. You need the note and at least one ICD-10 diagnosis.</p>}
                {noteDirty && <UnsavedNoteLine onSave={saveNoteFirst} />}
                {!noteDirty && !d.signReadiness.ok && <p className="text-xs text-amber-700">{d.signReadiness.message}{dirty ? ' Save your coding changes first.' : ''}</p>}
                {!noteDirty && d.signReadiness.ok && dirty && <p className="text-xs text-amber-700"><i className="ti ti-alert-triangle mr-1" />Save your coding changes first. Signing reads the saved diagnoses.</p>}
                {!String((d.record && d.record.patientSummary) || '').trim() && !String(facing.patientSummary || '').trim() &&
                  <p className="text-xs text-amber-700"><i className="ti ti-alert-triangle mr-1" />"What we did today, in plain words" is empty. You can still sign, but the patient's visit summary will have no plain-language account of this visit.</p>}
                <label className="flex items-start gap-2 text-xs">
                  <input type="checkbox" className="mt-0.5" checked={attest} onChange={e => setAttest(e.target.checked)} />
                  <span>I attest that this documentation is accurate and complete, that I personally performed or directly supervised the services recorded{na.signsAsAuthor ? '' : ', and that the diagnoses are supported by the note'}. Signing as <b>{npiLabel(d.me)}</b>.</span>
                </label>
                {!d.me.npi && <p className="text-[11px] text-amber-700"><i className="ti ti-alert-triangle mr-1" />Your NPI is not on file — an admin can add it in your user profile. Signing is allowed for test use and will be flagged.</p>}
                <TotalTimeField value={totalMins} onChange={setTotalMins} recorded={d.totalTime} />
                <PortalHoldControl hold={portalHold} setHold={setPortalHold} />
                <button className="btn gold w-fit" disabled={!attest || !d.signReadiness.ok || dirty || noteDirty || busy === 'sign' || (portalHold.on && !portalHold.reason)} onClick={() => run('sign', () => api.sign(patient.id, euuid, portalHoldPayload(portalHold), totalMins))}>
                  <i className="ti ti-writing-sign" />{busy === 'sign' ? 'Signing…' : 'Sign & Submit'}
                </button>
                <p className="text-[10.5px] text-stone-400">Locks the note with your name, NPI and the time, bold at the bottom of the note — in OpenEMR and in the formatted copy filed to the patient's Documents. The signed note and visit summary then publish to the patient's portal.</p>
              </div>
            </div>
          )}

          {/* The clinician addendum — the billable signature on an author's note. */}
          {awaitingAddendum && (
            <div className="card mb-4 border-amber-300">
              <div className="card-h"><h2>Clinician Addendum</h2><span className="chip bg-amber-50 text-amber-800">NOT BILLABLE YET</span></div>
              <div className="p-4 grid gap-3 text-sm">
                {!na.canAddClinicianAddendum && (
                  <p className="text-xs text-stone-600">Signed by {npiLabel(d.attestation && d.attestation.signedBy)} as the note's author. A provider — or an LCSW, for a behavioral-health note — adds the clinician addendum that makes it billable.</p>
                )}
                {na.canAddClinicianAddendum && <>
                  <p className="text-xs text-stone-600">Review the author's note, confirm the diagnoses on the Coding step, and add your addendum. <b>Your addendum is the billable signature</b> — you become the rendering clinician on the claim, and the note goes to billing.</p>
                  {noteDirty && <UnsavedNoteLine onSave={saveNoteFirst} />}
                  {!noteDirty && d.addendumReadiness && !d.addendumReadiness.ok && <p className="text-xs text-amber-700">{d.addendumReadiness.message}{dirty ? ' Save your coding changes first.' : ''}</p>}
                  {!noteDirty && (!d.addendumReadiness || d.addendumReadiness.ok) && dirty && <p className="text-xs text-amber-700"><i className="ti ti-alert-triangle mr-1" />Save your coding changes first. Signing reads the saved diagnoses.</p>}
                  <FormattedField label="Your addendum" minRows={3} value={clinAddendum} onChange={setClinAddendum}
                    placeholder="e.g. Patient seen with the RN; I agree with the assessment and plan above, with these additions…" />
                  <TotalTimeField value={totalMins} onChange={setTotalMins} recorded={d.totalTime} />
                  <label className="flex items-start gap-2 text-xs">
                    <input type="checkbox" className="mt-0.5" checked={clinAttest} onChange={e => setClinAttest(e.target.checked)} />
                    <span>I attest that I reviewed this note, that the services recorded were performed as documented under my supervision or by me, and that the diagnoses are supported. Signing as <b>{npiLabel(d.me)}</b>.</span>
                  </label>
                  <button className="btn gold w-fit" disabled={!clinAttest || NF.isBlank(clinAddendum) || dirty || noteDirty || (d.addendumReadiness && !d.addendumReadiness.ok) || busy === 'clinAddendum'}
                    onClick={() => run('clinAddendum', () => api.clinicianAddendum(patient.id, euuid, clinAddendum, totalMins)).then(onOk(() => { setClinAddendum(''); setClinAttest(false); setTotalMins(''); }))}>
                    <i className="ti ti-writing-sign" />{busy === 'clinAddendum' ? 'Signing…' : 'Add Clinician Addendum'}
                  </button>
                </>}
              </div>
            </div>
          )}

          {/* BILLING lives on its own page (owner, 2026-11-04). The encounter
              says where the claim stands and links there; it carries no billing
              controls of its own, so there is one place a claim is worked. */}
          {closed && ba.canBill && !awaitingAddendum && (
            <div className="card mb-4 border-primary-100">
              <div className="card-h"><h2><i className="ti ti-receipt mr-1 text-accent" />Billing</h2>
                <span className={`chip ${d.billingStatus === 'awaiting_billing' ? 'bg-amber-50 text-amber-800' : 'bg-emerald-50 text-emerald-700'}`}>
                  {d.billingStatus === 'awaiting_billing' ? 'AWAITING BILLING' : d.billingStatus === 'no_charge' ? 'NO CHARGE' : 'SUBMITTED'}
                </span>
              </div>
              <div className="p-4 flex flex-wrap items-center gap-3 text-sm">
                <span className="text-xs text-stone-600">Codes, place of service, the claim scrub and Submit are on the billing page.</span>
                <a className="btn gold !py-1.5" href={billingClaimHref(patient.id, euuid)}><i className="ti ti-receipt" />Open in Billing</a>
              </div>
            </div>
          )}

          {/* A co-signature: any licensed clinician on the care team, attesting
              they took part in or reviewed the note. It never changes who bills. */}
          {closed && na.canCoSign && (
            <div className="card mb-4">
              <div className="card-h"><h2>Co-Sign</h2></div>
              <div className="p-4 grid gap-2 text-sm">
                <label className="flex items-start gap-2 text-xs">
                  <input type="checkbox" className="mt-0.5" checked={coSignAttest} onChange={e => setCoSignAttest(e.target.checked)} />
                  <span>I reviewed this note and took part in the care it documents. My co-signature does not change who billed it. Signing as <b>{npiLabel(d.me)}</b>.</span>
                </label>
                <button className="btn w-fit" disabled={!coSignAttest || busy === 'coSign'} onClick={() => run('coSign', () => api.coSignNote(patient.id, euuid)).then(onOk(() => setCoSignAttest(false)))}>
                  <i className="ti ti-signature" />{busy === 'coSign' ? 'Signing…' : 'Co-Sign'}
                </button>
              </div>
            </div>
          )}

          {closed && !awaitingAddendum && (
            <PortalPublishCard key={`hold:${!!(d.attestation && d.attestation.portalHold)}`} record={d.record} attestation={d.attestation} canWrite={canWrite} busy={busy}
              onPublish={(hold) => run('portal', () => api.publishToPortal(patient.id, euuid, hold))} />
          )}

          {closed && (
            <div className="card mb-4">
              <div className="card-h"><h2>Attestation &amp; Addenda</h2></div>
              <div className="p-4 grid gap-3 text-sm">
                <div className="text-xs text-stone-600 whitespace-pre-wrap border border-stone-100 rounded-lg p-2.5 bg-cream">{d.attestation.attestationText}</div>
                <SignatureBlock signature={ns.signature} />
                {d.addenda.length === 0 && <p className="text-xs text-stone-400">No addenda.</p>}
                {d.addenda.map(a => (
                  <div key={a.id} className="border-l-4 border-accent pl-3 py-1">
                    <div className="text-xs text-stone-500">{a.kind === 'clinician_addendum' ? <b className="text-primary">Clinician addendum (billing signature)</b> : 'Addendum'} · {fmtTs(a.at)} · <b>{npiLabel(a.by)}</b></div>
                    <FormattedView markup={a.text} />
                  </div>
                ))}
                {canWrite && <FormattedField label="Add an addendum (signed as you, timestamped now)" value={addendum} onChange={setAddendum} />}
                {canWrite && <button className="btn w-fit" disabled={NF.isBlank(addendum) || busy === 'addendum'} onClick={() => run('addendum', () => api.addAddendum(patient.id, euuid, addendum)).then(onOk(() => setAddendum('')))}>
                  {busy === 'addendum' ? 'Recording…' : 'Sign Addendum'}
                </button>}
              </div>
            </div>
          )}
          </div>
          {msg && <p className={`text-sm mb-3 ${msg.ok ? 'text-emerald-700' : 'text-red-600'}`}>{msg.text}</p>}
        </div>
      );
    };

    // Chart tab: this patient's encounters with coded / signed state.
    const EncountersTab = ({ patient, chart, initialEuuid, initialStep, onOpened, onChartChanged, onNewVisit, above }) => {
      const canWrite = useCanDocument();
      const [data, setData] = useState(null);
      const [err, setErr] = useState('');
      const [open, setOpen] = useState(initialEuuid || null);
      // Deleted encounters are hidden unless asked for; this is where who
      // deleted one, when and why is read back.
      const [showDeleted, setShowDeleted] = useState(false);
      const load = useCallback(() => { api.encounters(patient.id, showDeleted).then(r => { setData(r); setErr(''); }).catch(e => setErr(e.message)); }, [patient.id, showDeleted]);
      useEffect(load, [load]);
      useEffect(() => { if (initialEuuid) { setOpen(initialEuuid); onOpened && onOpened(); } }, [initialEuuid]);
      if (open) return <EncounterPanel key={open} initialStep={initialStep} patient={patient} euuid={open} chart={chart} onChartChanged={onChartChanged} onBack={() => { setOpen(null); load(); onChartChanged && onChartChanged(); }} onChanged={() => { load(); onChartChanged && onChartChanged(); }} />;
      if (err) return <p className="text-red-600 text-sm p-4">{err}</p>;
      if (!data) return <p className="text-sm text-stone-500 p-4">Loading encounters from OpenEMR…</p>;
      return (
        <div className="max-w-3xl mx-auto">
          {above}
          {!data.linked && <div className="card p-5 text-center"><i className="ti ti-stethoscope-off text-3xl text-accent" /><p className="text-sm text-stone-500 mt-1">Link this patient to OpenEMR to document visits.</p></div>}
          {data.linked && (
            <div className="card">
              <div className="card-h"><h2>Notes</h2>
                {canWrite && onNewVisit && <button className="btn gold !py-1.5" onClick={onNewVisit}><i className="ti ti-stethoscope" />New Visit</button>}
              </div>
              <div className="p-4">
                {data.emrError && <p className="text-xs text-amber-700 mb-2">OpenEMR encounter list unavailable ({data.emrError}) — showing what the app has recorded.</p>}
                {data.deletedCount > 0 && (
                  <label className="flex items-center gap-2 text-xs text-stone-500 mb-2">
                    <input type="checkbox" checked={showDeleted} onChange={e => setShowDeleted(e.target.checked)} />
                    Show deleted encounters ({data.deletedCount})
                  </label>
                )}
                {data.encounters.length === 0 && <p className="text-sm text-stone-400">No visit notes yet. New Visit starts one.</p>}
                {data.encounters.map(e => (
                  <div key={e.id} className="flex flex-wrap items-center justify-between gap-2 py-2.5 border-b border-stone-100 last:border-0 cursor-pointer" onClick={() => setOpen(e.id)}>
                    <div>
                      <div className="font-semibold text-[13px]">{e.start ? fmtDate(e.start) : '—'} — {e.reason || e.type}</div>
                      <div className="text-xs text-stone-500">
                        {e.deleted && <div className="text-stone-500">Deleted by {e.deleted.byName} on {fmtTs(e.deleted.at)} — {e.deleted.reason}</div>}
                        {[e.renderingProvider ? npiLabel(e.renderingProvider) : e.provider, `${e.diagnosisCount} dx · ${e.serviceCount} svc · ${e.prescriptionCount} Rx · ${e.orderCount} orders`, e.signedAt && `signed ${fmtTs(e.signedAt)} by ${e.signedBy}`].filter(Boolean).join(' · ')}
                      </div>
                    </div>
                    <div className="flex flex-wrap items-center gap-1.5">
                      {e.structuredNoteError && <span className="chip bg-red-50 text-red-700" title={e.structuredNoteError}>EMR sync failed</span>}
                      {e.noteStatus === 'draft' && <span className="chip bg-amber-50 text-amber-800">DRAFT — editable</span>}
                      {e.noteStatus === 'voided' && <span className="chip bg-stone-100 text-stone-500" title={e.deleted ? `Deleted by ${e.deleted.byName} — ${e.deleted.reason}` : ''}>DELETED</span>}
                      {e.awaitingAddendum && <span className="chip bg-amber-50 text-amber-800">AWAITING CLINICIAN ADDENDUM</span>}
                      {e.signedAt && !e.awaitingAddendum && e.noteStatus !== 'voided' && !e.portalPublished && (
                        <span className="chip bg-amber-50 text-amber-800" title={e.portalPublishError ? `Last publish failed: ${e.portalPublishError}` : 'Open the visit and press Publish to portal on its Sign step'}>NOT ON PORTAL</span>
                      )}
                      {e.appointmentEid
                        ? <span className="chip bg-primary-50 text-primary" title="Attached to an appointment"><i className="ti ti-calendar-check" /></span>
                        : <span className="chip bg-stone-100 text-stone-500" title="Not attached to an appointment">unscheduled</span>}
                      <EncStateChip state={e.state} />
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    };

    // Admin: billing identity (spec §2.5) + practice service-code favorites.
    // ── Messages across every patient (2026-10-12 redesign) ──
    // The sidebar's Messages. Same shared component as the chart's Messages
    // tab, mounted WITHOUT a client scope, so it carries its own client
    // picker — which the server scopes by the same rule as the write gate.
    const StaffMessagesView = () => {
      const el = 'gfc-messaging-clinical-all';
      React.useEffect(() => {
        const lib = window.GFCMessaging;
        const token = getToken();
        if (!lib || !token) return undefined;
        lib.mount(el, {
          userId: (JSON.parse(localStorage.getItem('admin_user') || 'null') || {}).id,
          role: 'clinical',
          authToken: token
        });
        return () => lib.unmount(el);
      }, []);
      if (!window.GFCMessaging) {
        return <p className="text-sm text-stone-500">Messages did not load. Refresh the page.</p>;
      }
      return <div className="card p-3 lg:p-4"><div id={el} /></div>;
    };

    // ── Patients (2026-10-12 redesign) ──
    // The patient list that used to sit in the left column, as its own page.
    // Columns are only what the list route already serves: no last/next visit,
    // because answering those needs an OpenEMR read per patient, and a blank
    // column is better than an invented one.
    const CARE_CHIPS = {
      IHPC: [['PC', 'Primary care', 'bg-rose-50 text-rose-700']],
      BOTH: [['PC', 'Primary care', 'bg-rose-50 text-rose-700'], ['HC', 'Home care', 'bg-sky-50 text-sky-700']]
    };
    const ENROLL_LABEL = { intake_pending: 'Intake pending', intake_complete: 'Intake complete', enrolled: 'Enrolled' };
    const ageFromDob = (dob) => {
      if (!/^\d{4}-\d{2}-\d{2}/.test(String(dob || ''))) return null;
      const t = GFC_TIME.zonedParts(new Date()).isoDate;
      const [ty, tm, td] = t.split('-').map(Number);
      const [y, m, d] = String(dob).slice(0, 10).split('-').map(Number);
      return ty - y - ((tm < m || (tm === m && td < d)) ? 1 : 0);
    };
    const patientStatus = (p) => p.activatedAt
      ? { label: 'Active', cls: 'bg-emerald-50 text-emerald-700 border-emerald-200' }
      : { label: ENROLL_LABEL[p.enrollmentStatus] || 'Enrolling', cls: 'bg-amber-50 text-amber-700 border-amber-200' };
    const readRecent = () => {
      try { const v = JSON.parse(window.localStorage.getItem('gfc.clinical.recent') || '[]'); return Array.isArray(v) ? v : []; }
      catch { return []; }
    };
    const PatientsView = ({ patients, err, q, setQ, onClearSearch, onRetry, onOpen, isAdmin }) => {
      const [tab, setTab] = useState('all');
      const recent = readRecent();
      const rows = tab === 'recent'
        ? recent.map(id => (patients || []).find(p => p.id === id)).filter(Boolean)
        : (patients || []);
      return (
        <div className="px-4 lg:px-8 py-5 lg:py-7">
          <div className="flex flex-wrap items-end justify-between gap-3 mb-4">
            <h1 className="cw-title">Patients</h1>
            <div className="flex items-center gap-2 flex-wrap">
              {q && (
                <button className="btn ghost" onClick={() => { setQ(''); onClearSearch(); }} title="Show every patient">
                  <i className="ti ti-x" />Clear “{q}”
                </button>
              )}
              {isAdmin && (
                <a className="btn gold" href="/admin" title="New patients are added in the admin hub"><i className="ti ti-plus" />Add Patient</a>
              )}
            </div>
          </div>
          <div className="cw-tabs mb-4">
            {[['all', 'All Patients'], ['recent', 'Recent']].map(([k, label]) => (
              <div key={k} className={`tabbtn ${tab === k ? 'on' : ''}`} onClick={() => setTab(k)}>{label}</div>
            ))}
          </div>
          <div className="card overflow-hidden">
            {patients === null && err && (
              <div className="px-5 py-4">
                <p className="text-sm text-red-600 mb-2">{err}</p>
                <button className="btn ghost !py-1 !px-2.5 text-xs" onClick={onRetry}>Retry</button>
              </div>
            )}
            {patients === null && !err && <p className="text-sm text-stone-500 px-5 py-6">Loading…</p>}
            {patients && rows.length === 0 && (
              <p className="text-sm text-stone-500 px-5 py-8 text-center">
                {tab === 'recent' ? 'Patients you open show here.' : q ? 'No patients match that search.' : 'No IHPC clients yet.'}
              </p>
            )}
            {rows.length > 0 && (
              <>
                <table className="cw-table w-full hidden md:table">
                  <thead><tr>
                    <th>Name</th><th>DOB / Age</th><th>Care type</th><th>Track</th><th>Chart</th><th>Status</th><th />
                  </tr></thead>
                  <tbody>
                    {rows.map(p => {
                      const st = patientStatus(p);
                      const age = ageFromDob(p.dob);
                      return (
                        <tr key={p.id} className="cw-row cursor-pointer" onClick={() => onOpen(p)}>
                          <td>
                            <div className="flex items-center gap-3">
                              <div className="cw-avatar w-9 h-9 text-[12.5px]">{initials(p.name)}</div>
                              <div className="min-w-0">
                                <div className="font-semibold text-primary truncate">{p.name}</div>
                                {p.preferredName && <div className="text-[11.5px] text-stone-500">“{p.preferredName}”</div>}
                              </div>
                            </div>
                          </td>
                          <td className="text-stone-600 whitespace-nowrap">{p.dob ? `${fmtDate(p.dob)}${age != null ? ` (${age})` : ''}` : '—'}</td>
                          <td>
                            <div className="flex gap-1.5">
                              {(CARE_CHIPS[String(p.serviceLine || '').toUpperCase()] || []).map(([c, title, cls]) => (
                                <span key={c} className={`care-chip ${cls}`} title={title}>{c}</span>
                              ))}
                            </div>
                          </td>
                          <td className="text-stone-600">{p.careTierLabel || p.careTier || '—'}</td>
                          <td className="text-[12.5px]">
                            {p.openEmrPatientId
                              ? <span className="text-emerald-700"><i className="ti ti-link mr-1" />{p.mrn ? `MRN ${p.mrn}` : 'Linked'}</span>
                              : <span className="text-stone-400">Not linked</span>}
                          </td>
                          <td><span className={`pill ${st.cls}`}>{st.label}</span></td>
                          <td className="text-right"><i className="ti ti-chevron-right text-stone-400" /></td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                <div className="md:hidden">
                  {rows.map(p => {
                    const st = patientStatus(p);
                    const age = ageFromDob(p.dob);
                    return (
                      <button key={p.id} type="button" className="cw-row w-full text-left flex items-center gap-3 px-4 py-3 border-b border-stone-100 last:border-0"
                        onClick={() => onOpen(p)}>
                        <div className="cw-avatar w-10 h-10 text-[13px]">{initials(p.name)}</div>
                        <div className="min-w-0 flex-1">
                          <div className="font-semibold text-primary truncate">{p.name}</div>
                          <div className="text-[12px] text-stone-500">
                            {[p.dob ? `${fmtDate(p.dob)}${age != null ? ` (${age})` : ''}` : null,
                              (CARE_CHIPS[String(p.serviceLine || '').toUpperCase()] || []).map(c => c[0]).join(' + ') || null].filter(Boolean).join(' • ')}
                          </div>
                        </div>
                        <span className={`pill ${st.cls}`}>{st.label}</span>
                      </button>
                    );
                  })}
                </div>
              </>
            )}
          </div>
        </div>
      );
    };

    // ── Settings (2026-10-12 redesign) ──
    // Where the OpenEMR connection, the enrollment link and sign-out went when
    // the top bar was simplified. Nothing here is new; it is the old top bar's
    // right-hand group, given room.
    // Server setup an admin fixes: an OAuth client older than the routes the
    // app calls, and the billing provider NPI. Shown on Settings, to an admin.
    const SetupChecks = ({ emrStatus, access }) => (
      <>
      {/* 4.4 deploy diagnostics: the appointment-scoped OAuth client swap
          (P0 deploy step) and the billing NPI (spec §2.5). */}
      {emrStatus && emrStatus.connected && emrStatus.appointmentScopes === false && (
        <div className="bg-amber-50 border-b border-amber-200 px-4 lg:px-8 py-2.5 text-[12.5px] text-amber-900">
          <b>Appointment OAuth client swap not deployed.</b> The token OpenEMR issued to this server carries no appointment scopes, so scheduling will 401. Swap <code className="font-mono">OPENEMR_CLIENT_ID</code>/<code className="font-mono">OPENEMR_CLIENT_SECRET</code> to the appointment-scoped client (enabled 2026-08-29), then stop and run the app.
        </div>
      )}
      {/* 4.5 deploy diagnostics: the 8.4 / Phase 6B OAuth client swap.
          A token carries only the scopes the DEPLOYED client was
          registered with, and OpenEMR reports the shortfall as a narrower
          token rather than an error — so the indicator above reads a
          healthy green while every new route 401s "Unauthorized". Name the
          shortfall here or nobody finds out until a write fails. */}
      {emrStatus && emrStatus.connected && (emrStatus.billingRouteScopes === false || emrStatus.nativeWriteScopes === false) && (
        <div className="bg-amber-50 border-b border-amber-200 px-4 lg:px-8 py-2.5 text-[12.5px] text-amber-900">
          <b>OpenEMR client is out of date for 8.4.</b> The token this server holds carries{' '}
          <b>{emrStatus.grantedScopeCount} of {emrStatus.requestedScopeCount}</b> scopes, so{' '}
          {[emrStatus.billingRouteScopes === false && 'charges, orders and code search',
            emrStatus.nativeWriteScopes === false && 'prescription writes']
            .filter(Boolean).join(' and ')}{' '}
          will fail with 401. Swap <code className="font-mono">OPENEMR_CLIENT_ID</code>/<code className="font-mono">OPENEMR_CLIENT_SECRET</code>{' '}
          to the v4 client (54 scopes), then stop and run the app.
          {(emrStatus.missingScopes || []).length > 0 && (
            <> Missing: <code className="font-mono">{emrStatus.missingScopes.join(', ')}</code>.</>
          )}
        </div>
      )}
      {emrStatus && emrStatus.billingNpiConfigured === false && access.canSubmitBilling && (
        <div className="bg-amber-50 border-b border-amber-200 px-4 lg:px-8 py-2.5 text-[12.5px] text-amber-900">
          <b>Billing provider NPI not configured.</b> Signed visits cannot be submitted to billing until an admin sets it on the Billing page, under Settings (or seeds <code className="font-mono">GFC_BILLING_NPI_USED</code> in the env).
        </div>
      )}
      </>
    );

    const SettingsView = ({ user, emrStatus, connectEmr, signOut, canWrite, access }) => (
      <div className="px-4 lg:px-8 py-5 lg:py-7 max-w-3xl">
        <h1 className="cw-title mb-5">Settings</h1>
        {access.role === 'admin' && <div className="rounded-xl overflow-hidden mb-4"><SetupChecks emrStatus={emrStatus} access={access} /></div>}
        <div className="card mb-4">
          <div className="card-h"><h2>Your Account</h2></div>
          <div className="p-5 flex items-center gap-4">
            <div className="cw-avatar w-14 h-14 text-[17px]">{initials(user.name)}</div>
            <div className="min-w-0 flex-1">
              <div className="font-semibold text-primary text-[15px]">{user.name}</div>
              <div className="text-[13px] text-stone-500">{access.clinicalRoleLabel || user.role}{!canWrite && !access.canDocument ? ' · Read-only' : ''}</div>
            </div>
            {/* Password, two-step sign-in, the devices this account is signed
                in on, and this clinician's own OpenEMR sign-in all live on
                /account — one page for every role (owner, "Fix all"). */}
            <a className="btn ghost" href="/my#account"><i className="ti ti-shield-lock" />Account &amp; Security</a>
            {/* My GFC, her staff portal: onboarding, documents, policies and
                the Drive folders shared with her role (owner, 2026-11-08). */}
            <a className="btn ghost" href="/my"><i className="ti ti-id-badge-2" />My GFC</a>
            <button className="btn ghost" onClick={signOut}><i className="ti ti-logout" />Sign Out</button>
          </div>
        </div>
        <div className="card mb-4">
          <div className="card-h"><h2>OpenEMR</h2></div>
          <div className="p-5 text-[13.5px] text-stone-700 space-y-3">
            <div className="flex items-center gap-2">
              <span className={`w-2.5 h-2.5 rounded-full ${emrStatus === null ? 'bg-stone-300' : emrStatus.connected ? 'bg-emerald-500' : (emrStatus.reachable ? 'bg-amber-500' : 'bg-red-500')}`} />
              {emrStatus === null ? 'Checking OpenEMR…'
                : !emrStatus.configured ? 'OpenEMR not configured'
                : !emrStatus.reachable ? 'OpenEMR unreachable'
                : emrStatus.connected ? `Signed in to OpenEMR as ${(emrStatus.emrUser && (emrStatus.emrUser.username || emrStatus.emrUser.name)) || 'you'}`
                : 'Not signed in to OpenEMR'}
            </div>
            {emrStatus && emrStatus.configured && emrStatus.reachable && !emrStatus.connected && (
              <button className="btn" onClick={connectEmr}><i className="ti ti-login" />Sign In to OpenEMR</button>
            )}
            {emrStatus && emrStatus.serverStartedAt && (
              <p className="text-[12px] text-stone-500" title="When this server process started — older than your last deploy means it was never restarted.">
                Server up since {fmtTs(emrStatus.serverStartedAt)}
              </p>
            )}
          </div>
        </div>
        {(user.role === 'admin' || user.role === 'caseManager') && (
          <div className="card">
            <div className="card-h"><h2>Staff Tools</h2></div>
            <div className="p-5">
              <a className="btn ghost" href="/admin/enrollment"><i className="ti ti-clipboard-list" />Enrollment</a>
            </div>
          </div>
        )}
      </div>
    );

    // ── Phone "More" (2026-10-12 redesign) ──
    // Every view that is not on the bottom bar, so nothing is out of reach on
    // a phone.
    // A sidebar item only billing uses is drawn only for billing.
    const navShown = (v, access) => !v.billingOnly || !!(access && access.canSubmitBilling);
    // The Inbox item counts what is waiting in all its tabs.
    const navBadge = (badges, key) => key === 'inbox' ? (badges.inbox || 0) + (badges.results || 0) : (badges[key] || 0);
    const MoreView = ({ onPick, badges, access }) => (
      <div className="px-4 py-5">
        <h1 className="cw-title mb-4">More</h1>
        <div className="card overflow-hidden">
          {NAV_VIEWS.filter(v => !v.phone && navShown(v, access)).map(v => (
            <button key={v.key} type="button" className="cw-row w-full text-left flex items-center gap-3 px-4 py-3.5 border-b border-stone-100 last:border-0"
              onClick={() => onPick(v)}>
              <i className={`ti ${v.icon} text-[20px] text-primary`} />
              <span className="font-semibold text-primary flex-1">{v.tab}</span>
              {navBadge(badges, v.key) > 0 && <span className="cw-badge">{navBadge(badges, v.key)}</span>}
              <i className="ti ti-chevron-right text-stone-400" />
            </button>
          ))}
        </div>
      </div>
    );

    // ── App shell ──
    // ── Messages (Session 9) ──
    // At MODULE scope on purpose. A component defined inside another is a new
    // component identity on every parent render, so React unmounts and
    // remounts it and the caret jumps out of any field inside — the failure
    // test/react_input_focus.test.js exists to catch.
    // a filter on what is already permitted, never the permission itself.
    const MessagesTab = ({ patient }) => {
      // Patient / Care Team (owner mockup 12). Which conversations are which
      // is the server's mark on each thread (`withPatient`), not a list here.
      const [audience, setAudience] = useState('patient');
      const el = `gfc-messaging-clinical`;
      React.useEffect(() => {
        const lib = window.GFCMessaging;
        const token = getToken();
        if (!lib || !token || !patient) return undefined;
        lib.mount(el, {
          userId: (JSON.parse(localStorage.getItem('admin_user') || 'null') || {}).id,
          role: 'clinical',
          scopeClientId: patient.id,
          audience,
          authToken: token
        });
        return () => lib.unmount(el);
      }, [patient && patient.id, audience]);

      if (!window.GFCMessaging) {
        return <p className="text-sm text-stone-500">Messages did not load. Refresh the page.</p>;
      }
      return (
        <div className="max-w-3xl">
          <div className="flex bg-white border border-stone-200 rounded-xl p-1 mb-3 max-w-sm">
            {[['patient', 'Patient'], ['team', 'Care Team']].map(([k, label]) => (
              <button key={k} onClick={() => setAudience(k)}
                className={`flex-1 py-2 rounded-lg text-[13.5px] font-semibold ${audience === k ? 'bg-[#F6EFE2] text-[#8a6a2c]' : 'text-stone-500'}`}>{label}</button>
            ))}
          </div>
          <div id={el} />
        </div>
      );
    };

    const App = () => {
      const [user, setUser] = useState(() => {
        try { return JSON.parse(localStorage.getItem('admin_user') || 'null'); } catch { return null; }
      });
      const [patients, setPatients] = useState(null);
      const [q, setQ] = useState('');
      const [sel, setSel] = useState(null);
      const [chart, setChart] = useState(null);
      const [tab, setTabRaw] = useState('summary');
      const [ordersFilter, setOrdersFilter] = useState('all');
      // Chart tabs merged on 2026-11-04 keep their old names as aliases, so a
      // link, an inbox row or a digest line naming one still lands.
      const setTab = (t) => {
        const alias = CHART_TAB_ALIASES[t];
        if (alias) { if (alias.ordersFilter) setOrdersFilter(alias.ordersFilter); setTabRaw(alias.tab); return; }
        if (t === 'orders') setOrdersFilter('all');
        setTabRaw(t);
      };
      const [encStep, setEncStep] = useState(null); // the step an opened encounter starts on
      const [emrStatus, setEmrStatus] = useState(null);
      // Session 5.2: the OAuth round trip lands back here with ?emr=connected|error.
      const [emrReturn] = useState(() => new URLSearchParams(window.location.search).get('emr'));
      const [emrReturnReason] = useState(() => new URLSearchParams(window.location.search).get('reason'));
      useEffect(() => {
        if (emrReturn) window.history.replaceState({}, '', window.location.pathname);
      }, [emrReturn]);
      const connectEmr = async () => {
        try {
          const r = await authedFetch('/api/emr/connect');
          if (r && r.url) window.location.href = r.url;
        } catch (e) { alert(`Could not start the OpenEMR sign-in: ${e.message}`); }
      };
      const [linking, setLinking] = useState(false);
      const [linkCandidates, setLinkCandidates] = useState([]);
      const [err, setErr] = useState('');
      // 2026-10-12 redesign: the patient list is its own page (Patients), so
      // the old collapsible left column and its phone overlay are gone. The
      // counts on the Inbox and Results items come from the same reads those
      // screens make; a failed read shows no badge, never a guessed number.
      const [badges, setBadges] = useState({});
      const [sectionMenu, setSectionMenu] = useState(false);
      const loadBadges = useCallback(() => {
        if (!getToken()) return;
        Promise.allSettled([api.inbox(), api.resultsInbox()]).then(([ib, rs]) => {
          setBadges({
            inbox: ib.status === 'fulfilled' && ib.value && ib.value.counts ? ib.value.counts.actionable : 0,
            results: rs.status === 'fulfilled' && rs.value && Array.isArray(rs.value.results) ? rs.value.results.length : 0
          });
        });
      }, []);
      // Session 4.12 I1 — MY DAY is the default route after sign-in. The
      // workspace used to open on a patient list, which is not how a house-call
      // day starts.
      // `/clinical#inbox` is where the referral email points (appLinks), so the
      // fragment is read ONCE, at mount. Anything else lands on My Day.
      // THE FRAGMENT PICKS THE VIEW, and it is read against NAV_VIEWS rather
      // than a list of its own: `#inbox` was the only one that worked, so the
      // to-do emails' `#queues` would have landed on My Day. An UNKNOWN
      // fragment still falls back to My Day — a link must never render a tab
      // that does not exist. Read once, at mount: a later hash change is the
      // person navigating, and yanking the tab out from under them is worse.
      const [view, setViewRaw] = useState(() => {
        const h = String(window.location.hash || '').replace(/^#/, '');
        if (LEGACY_VIEWS[h] && LEGACY_VIEWS[h].href) { window.location.replace(LEGACY_VIEWS[h].href); return 'myday'; }
        if (LEGACY_VIEWS[h]) return LEGACY_VIEWS[h].view;
        return NAV_VIEWS.some(v => v.key === h) ? h : 'myday';
      }); // 'myday' (4.12) | 'charts' | 'schedule' (4.2) | 'inbox' (4.9, with Results and Overdue) | …
      const [inboxTab, setInboxTab] = useState(() => {
        const h = String(window.location.hash || '').replace(/^#/, '');
        return (LEGACY_VIEWS[h] && LEGACY_VIEWS[h].inboxTab) || 'work';
      });
      // Every move between views comes through here, so a digest line or an
      // old link naming Results, Overdue or the Coding queue still lands.
      const setView = useCallback((v) => {
        const legacy = LEGACY_VIEWS[v];
        if (legacy && legacy.href) { window.location.assign(legacy.href); return; }
        if (legacy) { setInboxTab(legacy.inboxTab); setViewRaw(legacy.view); return; }
        if (v === 'inbox') setInboxTab('work');
        setViewRaw(v);
      }, []);
      const [hpApptEid, setHpApptEid] = useState(null); // H&P opened from an appointment
      const [encTarget, setEncTarget] = useState(null); // encounter to open on the Encounters tab (4.4)

      const loadPatients = useCallback(() => {
        if (!getToken()) return;
        api.patients(q).then(r => { setPatients(r.patients); setErr(''); })
          .catch(e => {
            if (e.code === 'AUTH') setUser(null);
            else setErr(e.message);
          });
      }, [q]);
      useEffect(() => { if (user) { loadPatients(); api.status().then(setEmrStatus).catch(() => {}); } }, [user, loadPatients]);
      useEffect(() => { if (user) loadBadges(); }, [user, view, loadBadges]);

      // Clear every stored credential key the portals share, so signing out of
      // the workspace really signs out (not just this tab's view).
      const signOut = () => {
        ['admin_token', 'admin_user', 'unified_token', 'unified_user', 'portal_token', 'portal_user']
          .forEach(k => localStorage.removeItem(k));
        window.location.href = '/login';
      };

      // The chart answer for the patient actually selected: switching patients
      // quickly could otherwise land the previous patient's chart (banner,
      // allergies) under the new name.
      const selIdRef = useRef(null);
      const openPatient = (p, opts) => {
        selIdRef.current = p.id;
        setSel(p); setChart(null); setTab((opts && opts.tab) || 'summary'); setEncStep((opts && opts.step) || null);
        // "Recent" on the Patients page: a per-browser convenience, so it is
        // localStorage, read and written defensively.
        try {
          const prior = JSON.parse(window.localStorage.getItem('gfc.clinical.recent') || '[]');
          const next = [p.id, ...(Array.isArray(prior) ? prior : []).filter(x => x !== p.id)].slice(0, 12);
          window.localStorage.setItem('gfc.clinical.recent', JSON.stringify(next));
        } catch { /* a convenience that cannot be saved is not an error */ }
        setLinkCandidates([]);  // candidates belong to the patient that produced them
        setView('charts'); setHpApptEid((opts && opts.appointmentEid) || null);
        setEncTarget((opts && opts.encounterUuid) || null);
        api.chart(p.id).then(c => { if (selIdRef.current === p.id) setChart(c); }).catch(e => { if (selIdRef.current === p.id) setErr(e.message); });
      };
      // Calendar → chart navigation (4.2): open the chart, or jump straight
      // into documentation (H&P for a first visit, Appointments tab otherwise).
      // The sidebar list is filtered by its search box, so with a search typed in,
      // every "Open chart" / "Open encounter" button elsewhere did nothing for a
      // patient outside the filter. Fall back to the unfiltered list, then to
      // the id alone (the chart read supplies the rest).
      const openChartById = (clientId, opts) => {
        const p = (patients || []).find(x => x.id === clientId);
        if (p) { openPatient(p, opts); return; }
        api.patients('').then(r => {
          const q = ((r && r.patients) || []).find(x => x.id === clientId);
          openPatient(q || { id: clientId }, opts);
        }).catch(() => openPatient({ id: clientId }, opts));
      };
      // The banner's Start visit / Resume draft. A saved draft lives on its
      // encounter: resume THAT, rather than starting a blank H&P whose save
      // becomes a second OpenEMR encounter.
      // New Visit is the ONE way a visit note starts (owner, 2026-11-04): the
      // visit screen, which asks for the appointment and the visit type.
      const startVisit = () => {
        const vd = chart && chart.visitDraft;
        if (vd && vd.encounterUuid) { setEncTarget(vd.encounterUuid); setTab('visits'); return; }
        setHpApptEid(null); setTab('visit');
      };
      const openEncounter = (euuid, step) => { setEncTarget(euuid); setEncStep(step || null); setTab('visits'); };
      const documentFromSchedule = (appt) => {
        const p = (patients || []).find(x => x.id === appt.clientId);
        if (!p) return;
        openPatient(p, { tab: 'visit', appointmentEid: appt.eid });
      };
      const refreshChart = () => sel && api.chart(sel.id).then(c => { if (selIdRef.current === sel.id) setChart(c); }).catch(() => {});
      const link = (body) => {
        setLinking(true); setErr('');
        api.link(sel.id, body || {})
          .then(() => { setLinkCandidates([]); refreshChart(); loadPatients(); })
          .catch(e => {
            // The duplicate guard answers 409 with the matching charts rather
            // than creating a second one; show them instead of a bare error.
            const candidates = e.data && e.data.code === 'EMR_PATIENT_EXISTS' ? e.data.candidates : null;
            if (candidates && candidates.length) setLinkCandidates(candidates);
            setErr(e.message);
          })
          .finally(() => setLinking(false));
      };

      if (!user || !getToken()) return <Login onLogin={setUser} />;

      // 4.3 read/write split: the server's answer wins once it arrives; until
      // then mirror the rule from the stored user so the UI does not flash.
      const canWrite = emrStatus && emrStatus.access ? !!emrStatus.access.canWrite : canWriteFor(user);
      const access = {
        canWrite, role: user.role,
        canDocument: emrStatus && emrStatus.access && emrStatus.access.canDocument !== undefined ? !!emrStatus.access.canDocument : canWrite,
        isCoordinator: !!(emrStatus && emrStatus.access && emrStatus.access.isCoordinator),
        capabilities: (emrStatus && emrStatus.access && emrStatus.access.capabilities) || {},
        clinicalRole: (emrStatus && emrStatus.access && emrStatus.access.clinicalRole) || null,
        clinicalRoleLabel: (emrStatus && emrStatus.access && emrStatus.access.clinicalRoleLabel) || null,
        canSubmitBilling: !!(emrStatus && emrStatus.access && emrStatus.access.canSubmitBilling),
        canEditOrderDestination: !!(emrStatus && emrStatus.access && emrStatus.access.canEditOrderDestination),
        canManageTasks: !!(emrStatus && emrStatus.access && emrStatus.access.canManageTasks),
        canCoSignCarePlan: !!(emrStatus && emrStatus.access && emrStatus.access.canCoSignCarePlan),
        credentialCeiling: (emrStatus && emrStatus.access && emrStatus.access.credentialCeiling) || []
      };
      // A home care client's care plan, on its own page (no chart).
      const standaloneCarePlanId = new URLSearchParams(window.location.search).get('carePlan');
      if (standaloneCarePlanId) return <AccessContext.Provider value={access}><StandaloneCarePlan clientId={standaloneCarePlanId} /></AccessContext.Provider>;
      // Session 4.12 Scope D — every one of these is a PLACE in the record.
      // No workflow is a tab: the H&P opens as a visit from the banner's Start
      // visit action, and med reconciliation is a section under MEDICATIONS
      // rather than a sibling of it. Enrollment left for Admin in PR #116.
      //
      // Appointments is kept as a place alongside the brief's twelve because it
      // is the per-patient calendar — removing a working surface is not what a
      // reorganisation is for.
      // Owner, 2026-11-04: Encounters and Appointments are one place (Visits),
      // and Orders, Imaging and Referrals are one list with filters.
      const tabs = [
        ['summary', 'Overview', 'ti-layout-grid'],
        ['timeline', 'Timeline', 'ti-timeline'],
        ['visits', 'Visits', 'ti-stethoscope'],
        ['problems', 'Problems', 'ti-list-details'],
        ['medications', 'Medications', 'ti-pill'],
        ['allergies', 'Allergies', 'ti-alert-triangle'],
        ['orders', 'Orders', 'ti-clipboard-list'],
        ['results', 'Results', 'ti-flask'],
        ['documents', 'Documents', 'ti-file-text'],
        ['careplan', 'Care Plan', 'ti-heart-handshake'],
        ['extras', 'Rest of Record', 'ti-folders'],
        ['messages', 'Messages', 'ti-message-circle']
      ];
      // One click handler for the sidebar, the phone bottom bar and More.
      // Patients always lands on the list: a chart is reached FROM it.
      const goView = (v) => { if (v.href) { window.location.assign(v.href); return; } setView(v.key); if (v.key === 'charts') setSel(null); };
      const navButton = (v) => (
        <button key={v.key} className={view === v.key ? 'on' : ''} title={VIEW_TITLES[v.key]}
          onClick={() => { if (v.href) { window.location.assign(v.href); return; } setView(v.key); if (v.key === 'charts') setSel(null); }}>
          <i className={`ti ${v.icon}`} />
          <span>{v.tab}</span>
          {navBadge(badges, v.key) > 0 && <span className="cw-badge">{navBadge(badges, v.key)}</span>}
        </button>
      );
      const runSearch = () => { setSel(null); setView('charts'); loadPatients(); };
      const ownHeader = ['myday', 'charts', 'settings', 'more'];
      return (
        <AccessContext.Provider value={access}>
        {/* 2026-10-12 redesign (owner mockups): a navy sidebar on a laptop, a
            top bar and a bottom bar on a phone. One NAV_VIEWS list drives all
            three, so they cannot disagree about what exists. The content
            column is `minmax(0,1fr)` so a wide table scrolls inside its card
            instead of pushing the page sideways. */}
        <div className="min-h-screen lg:grid lg:grid-cols-[248px_minmax(0,1fr)]">
          <aside className="cw-side hidden lg:flex flex-col sticky top-0 h-screen overflow-y-auto px-3 py-5">
            <div className="brand flex flex-col items-center text-center px-2 mb-6">
              <img src="/brand/logo-full-white-trimmed.png" alt="Godwins Family Care" className="!h-auto w-[150px]" />
              <div className="text-[9.5px] tracking-[2px] uppercase text-accent font-bold mt-2">Clinical Workspace</div>
            </div>
            <nav className="cw-nav">
              {NAV_VIEWS.filter(v => v.group === 'main' && navShown(v, access)).map(navButton)}
              <div className="grp">Work</div>
              {NAV_VIEWS.filter(v => v.group === 'work' && navShown(v, access)).map(navButton)}
            </nav>
            <div className="mt-auto pt-4">
              <nav className="cw-nav">{NAV_VIEWS.filter(v => v.group === 'foot').map(navButton)}</nav>
              <div className="flex items-center gap-3 px-3 pt-4 mt-3 border-t border-white/10">
                <div className="w-10 h-10 rounded-full bg-accent text-primary flex items-center justify-center font-bold text-[13px] shrink-0">{initials(user.name)}</div>
                <div className="min-w-0">
                  <div className="text-[13.5px] font-semibold truncate">{user.name}</div>
                  <div className="text-[11.5px] text-white/60 truncate">{access.clinicalRoleLabel || user.role}{!canWrite && !access.canDocument ? ' · Read-only' : ''}</div>
                </div>
              </div>
            </div>
          </aside>

          <main className="min-w-0 pb-24 lg:pb-0">
            <div className="cw-top sticky top-0 z-30 px-4 lg:px-8 py-2.5 flex items-center gap-3">
              <img src="/brand/logo-full-color-transparent.png" alt="Godwins Family Care" className="h-9 shrink-0 lg:hidden" />
              <div className="cw-search flex-1 min-w-0 max-w-xl mx-auto flex items-center gap-2 px-3">
                <i className="ti ti-search text-stone-400" />
                <input className="flex-1 bg-transparent py-2 text-[13.5px] outline-none min-w-0" placeholder="Search patients by name…"
                  value={q} onChange={e => setQ(e.target.value)} onKeyDown={e => e.key === 'Enter' && runSearch()} aria-label="Search patients" />
              </div>
              {!canWrite && !access.canDocument && <span className="chip bg-amber-50 text-amber-800 hidden sm:inline-flex" title="Case-manager scoped read: every write route answers 403.">Read-only</span>}
              {access.isCoordinator && <span className="chip bg-teal-50 text-teal-800 hidden sm:inline-flex" title="Prepares notes and books visits. A licensed clinician signs.">Care Coordinator</span>}
              <button className="relative shrink-0 w-10 h-10 rounded-xl flex items-center justify-center text-primary hover:bg-white" title="Inbox"
                onClick={() => setView('inbox')} aria-label="Inbox">
                <i className="ti ti-bell text-[21px]" />
                {(badges.inbox > 0 || badges.results > 0) && <span className="absolute top-2 right-2 w-2.5 h-2.5 rounded-full bg-[#B5462E] border-2 border-cream" />}
              </button>
              <button className="shrink-0 w-10 h-10 rounded-full bg-accent text-primary flex items-center justify-center font-bold text-[13px]" title="Settings"
                onClick={() => setView('settings')} aria-label="Settings">{initials(user.name)}</button>
            </div>

            {/* Setup diagnostics: names the exact blocker so an admin can fix it
                without opening dev tools. Never renders secret VALUES. */}
            {emrStatus && !emrStatus.connected && (
              <div className="bg-amber-50 border-b border-amber-200 px-4 lg:px-8 py-2.5 text-[12.5px] text-amber-900">
                {!emrStatus.configured ? (
                  (emrStatus.missing || []).length ? (
                    <span>
                      <b>OpenEMR is not configured.</b> Missing environment {emrStatus.missing.length === 1 ? 'variable' : 'variables'}:{' '}
                      <code className="font-mono">{emrStatus.missing.join(', ')}</code>. Add {emrStatus.missing.length === 1 ? 'it' : 'them'} to the app's secrets, then STOP and RUN the app (a page reload is not enough — secrets load at server start).
                    </span>
                  ) : (
                    // No `missing` list means the SERVER is running code older than
                    // this page (files on disk updated, process not restarted) —
                    // env vars are only read at process start either way.
                    <span>
                      <b>OpenEMR is not configured, and the server is running an older build than this page.</b>{' '}
                      Stop and Run the app (not just a page reload) so it picks up both the current code and the secrets. If it still shows this afterwards, the OpenEMR secrets are not set on the running server.
                    </span>
                  )
                ) : emrStatus.reachable ? (
                  // Session 5.2: every clinician signs in to OpenEMR as
                  // THEMSELVES. Until they do, this server holds no token for
                  // them and every chart call is refused (EMR_NOT_CONNECTED).
                  <span className="flex flex-wrap items-center gap-3">
                    <span>
                      <b>{emrStatus.disconnectReason ? 'Your OpenEMR sign-in has lapsed.' : 'Sign in to OpenEMR to open charts.'}</b>{' '}
                      Charts, notes and orders are written under your own OpenEMR account
                      {emrStatus.emrUser && emrStatus.emrUser.username ? ` (last signed in as ${emrStatus.emrUser.username})` : ''}. You will be sent to OpenEMR's login page and back.
                    </span>
                    <button type="button" onClick={connectEmr} className="btn !py-1 !px-3 text-[12px]">Sign In to OpenEMR</button>
                  </span>
                ) : (
                  <span><b>OpenEMR is configured but unreachable.</b> {emrStatus.error || 'The EMR did not respond.'}</span>
                )}
              </div>
            )}
            {emrReturn && (
              <div className={`border-b px-4 lg:px-8 py-2.5 text-[12.5px] ${emrReturn === 'connected' ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-red-50 border-red-200 text-red-900'}`}>
                {emrReturn === 'connected' ? <span><b>OpenEMR account connected.</b> Your clinical writes are now attributed to you in OpenEMR.</span>
                  : <span><b>OpenEMR sign-in did not complete</b> ({emrReturnReason || 'unknown'}). Try again; if it repeats, tell an admin the code shown here.</span>}
              </div>
            )}
            {/* Setup checks (an outdated OAuth client, no billing NPI) are an
                admin's to fix, so they live on Settings, not over every
                clinician's screen (owner, 2026-11-04). */}
            {err && view !== 'charts' && <p className="text-red-600 text-sm px-4 lg:px-8 pt-3">{err}</p>}
            {!ownHeader.includes(view) && (
              <div className="px-4 lg:px-7 pt-5 lg:pt-7 -mb-2">
                <h1 className="cw-title">{VIEW_TITLES[view]}</h1>
              </div>
            )}
            {view === 'myday' && (
              <MyDayView user={user} onOpenChart={(clientId, opts) => openChartById(clientId, opts)}
                onAddVisit={() => setView('schedule')} onGo={(v) => setView(v)} />
            )}
            {view === 'queues' && (
              <TasksShell onOpenChart={(clientId, opts) => openChartById(clientId, opts)}>
                <WorkQueuesView
                  onOpenChart={(clientId, opts) => openChartById(clientId, opts)}
                  onOpenEncounter={(clientId, euuid) => openChartById(clientId, { tab: 'encounters', encounterUuid: euuid })} />
              </TasksShell>
            )}
            {view === 'protocols' && <ProtocolsView />}
            {view === 'analytics' && <AnalyticsView />}
            {view === 'inbox' && (
              <>
                <div className="px-4 lg:px-7 pt-4">
                  <div className="cw-tabs">
                    {INBOX_TABS.map(([k, label]) => (
                      <div key={k} className={`tabbtn ${inboxTab === k ? 'on' : ''}`} onClick={() => setInboxTab(k)}>
                        {label}{k === 'work' && badges.inbox > 0 ? ` (${badges.inbox})` : k === 'results' && badges.results > 0 ? ` (${badges.results})` : ''}
                      </div>
                    ))}
                  </div>
                </div>
                {inboxTab === 'work' && (
                  <InboxView
                    onOpenEncounter={(clientId, euuid) => openChartById(clientId, { tab: 'encounters', encounterUuid: euuid })}
                    onOpenChart={(clientId, opts) => openChartById(clientId, opts)} />
                )}
                {inboxTab === 'results' && <ResultsInbox onOpenChart={(clientId, opts) => openChartById(clientId, opts)} />}
                {inboxTab === 'overdue' && <OverdueOrders onOpenChart={(clientId, opts) => openChartById(clientId, opts)} />}
              </>
            )}
            {view === 'veterans' && <VeteransView />}
            {view === 'messages' && <div className="p-4 lg:p-7"><StaffMessagesView /></div>}
            {view === 'settings' && (
              <SettingsView user={user} emrStatus={emrStatus} connectEmr={connectEmr} signOut={signOut} canWrite={canWrite} access={access} />
            )}
            {view === 'more' && <MoreView badges={badges} onPick={goView} access={access} />}
            {view === 'schedule' && (
              <ScheduleView user={user} patients={patients || []}
                onOpenChart={(clientId) => openChartById(clientId)}
                onDocument={documentFromSchedule} />
            )}
            {view === 'schedule' && user && user.hasClinicalAccess && <MyAvailability />}
            {view === 'charts' && !sel && (
              <PatientsView patients={patients} err={err} q={q} setQ={setQ} onRetry={loadPatients}
                onClearSearch={() => api.patients('').then(r => setPatients(r.patients)).catch(e => setErr(e.message))}
                onOpen={(p) => openPatient(p)} isAdmin={user.role === 'admin'} />
            )}
            {view === 'charts' && sel && (
              <div>
                <div className="px-4 lg:px-8 pt-4 text-[12.5px] text-stone-500">
                  <button className="hover:text-primary" onClick={() => setSel(null)}>Patients</button>
                  <i className="ti ti-chevron-right mx-1 text-[11px]" />
                  <span className="text-stone-700">{sel.name || (chart && chart.banner && chart.banner.name) || 'Patient'}</span>
                </div>
                {err && <p className="text-red-600 text-sm px-4 lg:px-8 pt-2">{err}</p>}
                {/* Session 4.12 — the banner, above the tab bar and therefore
                    present on EVERY tab. It replaced a header that showed DOB,
                    Track and a truncated OpenEMR uuid and no age, MRN, MBI or
                    allergies: the five things read first at a front door. */}
                <PatientBanner
                  banner={chart ? chart.banner : null}
                  patient={sel}
                  homeVisitFields={(emrStatus && emrStatus.homeVisitFields) || []}
                  visitDraft={chart ? chart.visitDraft : null}
                  onStartVisit={access.canDocument ? startVisit : null}
                  onHomeVisitSaved={refreshChart}
                  onMessage={() => setTab('messages')} />
                <div className="bg-white border-b border-stone-200 px-4 lg:px-8 hidden lg:block">
                  {/* WRAPS rather than scrolling: fifteen sections do not fit a
                      laptop row, and a scrolled strip hid the open tab. */}
                  <div className="flex flex-wrap -mb-px">
                    {tabs.map(([k, label]) => (
                      <div key={k} className={`tabbtn ${tab === k ? 'on' : ''}`} onClick={() => setTab(k)}>{label}</div>
                    ))}
                  </div>
                </div>
                {/* On a phone the strip becomes a tap-through list of the SAME
                    tabs (owner mockup 9): a row of fifteen tabs does not fit a
                    phone, and a sideways-scrolling strip hides most of them. */}
                <div className="lg:hidden bg-white border-b border-stone-200 px-4 py-2">
                  <button className="w-full flex items-center justify-between py-1.5 text-primary font-semibold text-[14px]"
                    onClick={() => setSectionMenu(m => !m)} aria-expanded={sectionMenu}>
                    <span><i className={`ti ${(tabs.find(t => t[0] === tab) || [])[2] || 'ti-writing'} mr-2`} />{(tabs.find(t => t[0] === tab) || [])[1] || 'Visit'}</span>
                    <span className="text-[12px] text-stone-500 flex items-center gap-1">Sections<i className={`ti ti-chevron-${sectionMenu ? 'up' : 'down'}`} /></span>
                  </button>
                  {sectionMenu && (
                    <div className="mt-2 card overflow-hidden">
                      {tabs.map(([k, label, icon]) => (
                        <button key={k} type="button" onClick={() => { setTab(k); setSectionMenu(false); }}
                          className={`cw-row w-full text-left flex items-center gap-3 px-4 py-3 border-b border-stone-100 last:border-0 ${tab === k ? 'on' : ''}`}>
                          <i className={`ti ${icon} text-[18px] text-primary`} />
                          <span className="flex-1 text-[14px] font-semibold text-primary">{label}</span>
                          <i className="ti ti-chevron-right text-stone-400" />
                        </button>
                      ))}
                    </div>
                  )}
                </div>
                {/* The H&P is NOT a tab (Scope D1) — it opens as a visit from
                    the banner. So when one is open nothing on the tab bar is
                    highlighted, and a clinician needs to be told where they are
                    and how to get back. */}
                {tab === 'visit' && (
                  <div className="bg-accent/20 border-b border-accent px-4 lg:px-8 py-2 flex items-center justify-between gap-2 flex-wrap">
                    <span className="text-[12.5px] text-primary font-semibold">
                      <i className="ti ti-writing mr-1" />Documenting a visit
                    </span>
                    <button className="btn ghost !py-1 !px-2.5 text-[11.5px]" onClick={() => setTab('summary')}>
                      <i className="ti ti-arrow-left" />Back to Chart
                    </button>
                  </div>
                )}
                <div className="p-4 lg:p-7">
                  {tab === 'summary' && <SummaryTab chart={chart} patient={sel} onLink={link} linking={linking}
                    linkCandidates={linkCandidates} onDismissCandidates={() => { setLinkCandidates([]); setErr(''); }}
                    isAdmin={access.role === 'admin'} onChartChanged={() => { loadPatients(); refreshChart(); }}
                    onGoTab={setTab} />}
                  {tab === 'visits' && <EncountersTab patient={sel} chart={chart} initialEuuid={encTarget} initialStep={encStep}
                    onOpened={() => setEncTarget(null)} onChartChanged={() => { loadPatients(); refreshChart(); }}
                    onNewVisit={access.canDocument ? startVisit : null}
                    above={<ApptsTab patient={sel} patients={patients || []} chart={chart} onDocumentHp={(eid) => { setHpApptEid(eid); setTab('visit'); }}
                      onEncounterCreated={(euuid) => openEncounter(euuid)} />} />}
                  {tab === 'visit' && (chart ? <HpTab patient={sel} chart={chart} appointmentEid={hpApptEid} onDone={() => { setHpApptEid(null); refreshChart(); loadPatients(); }} onGoToEncounter={(euuid) => openEncounter(euuid)} onSign={(euuid) => openEncounter(euuid, 'sign')} /> : <p className="text-sm text-stone-500">Loading…</p>)}
                  {tab === 'timeline' && <TimelineTab patient={sel} />}
                  {tab === 'problems' && <ProblemsTab chart={chart} />}
                  {tab === 'medications' && <MedicationsTab chart={chart} patient={sel} onChartChanged={() => { loadPatients(); refreshChart(); }} />}
                  {tab === 'allergies' && <AllergiesTab chart={chart} />}
                  {tab === 'orders' && <OrdersPlace patient={sel} filter={ordersFilter} setFilter={setOrdersFilter} />}
                  {tab === 'results' && <ResultsTab patient={sel} />}
                  {tab === 'documents' && <DocumentsTab chart={chart} patient={sel} onChartChanged={() => { loadPatients(); refreshChart(); }} />}
                  {tab === 'careplan' && <CarePlanTab patient={sel} onSaved={loadPatients} />}
                  {tab === 'extras' && <RecordExtrasTab patient={sel} />}
                  {tab === 'messages' && <MessagesTab patient={sel} />}
                </div>
              </div>
            )}
            <footer className="px-4 lg:px-8 py-4 text-[11px] text-stone-400">
              Authorized users only. This system contains protected health information; all access is logged.
            </footer>
          </main>

          {/* Phone bottom bar: the four most used views and More. */}
          <nav className="cw-bottom lg:hidden fixed bottom-0 inset-x-0 z-40 flex">
            {NAV_VIEWS.filter(v => v.phone).map(v => (
              <button key={v.key} className={view === v.key ? 'on' : ''} onClick={() => goView(v)}>
                <i className={`ti ${v.icon}`} />
                <span>{v.tab}</span>
                {navBadge(badges, v.key) > 0 && <span className="dot">{navBadge(badges, v.key)}</span>}
              </button>
            ))}
            <button className={!NAV_VIEWS.some(v => v.phone && v.key === view) ? 'on' : ''} onClick={() => setView('more')}>
              <i className="ti ti-menu-2" /><span>More</span>
            </button>
          </nav>
        </div>
        </AccessContext.Provider>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
