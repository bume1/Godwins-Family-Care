                <div className="min-w-0">
                  {(r.kind === 'message_note' || r.kind === 'call')
                    ? <button type="button" className="text-[13px] font-semibold text-primary underline text-left" onClick={() => openNote(r.id, r.kind)}>{r.title}</button>
                    : <div className="text-[13px] font-semibold text-stone-800">{r.title}</div>}
                  {r.detail && <div className="text-[11.5px] text-stone-500">{r.detail}</div>}
                </div>
              </div>
            ))}
            {noteView && (
              <div className="fixed inset-0 z-50 bg-black/30 flex items-center justify-center p-4" onClick={() => setNoteView(null)}>
                <div className="card w-full max-w-2xl max-h-[85vh] flex flex-col" onClick={e => e.stopPropagation()}>
                  <div className="card-h"><h2><i className="ti ti-notes mr-1 text-accent" />{noteView.title || 'Message note'}</h2>
                    <button className="btn ghost !py-1 !px-2.5 text-[12px] ml-auto" onClick={() => setNoteView(null)}>Close</button></div>
                  <div className="p-4 overflow-auto">
                    {noteView.loading && <p className="text-sm text-stone-500">Loading…</p>}
                    {noteView.error && <p className="text-sm text-red-600">{noteView.error}</p>}
                    {noteView.text && <pre className="whitespace-pre-wrap text-[13px] font-sans text-stone-800">{noteView.text}</pre>}
                  </div>
                </div>
              </div>
            )}
            {/* "Nothing here" and "four things could not be placed" are
                different facts, and only one of them is a data gap. */}
            {data && data.undated > 0 && (
              <p className="text-[11.5px] text-amber-700 mt-2">
                {data.undated} {data.undated === 1 ? 'item has' : 'items have'} no usable date and could not be placed on the thread.
              </p>
            )}
          </div>
        </div>
      );
    };

    // ── Patient to-dos and the daily digest (owner, 2026-10-13) ────────────
    // A to-do is about one patient and is seen only by the person it is
    // assigned to and the person who wrote it — the server decides that, and
    // decides which bucket (overdue, today, upcoming) each one is in, so this
    // page does no date math of its own.
    const TODO_BUCKETS = [
      ['overdue', 'Overdue'], ['today', 'Today'], ['upcoming', 'Next 7 Days'],
      ['later', 'Later'], ['no_date', 'No Date']
    ];
    const PRIORITY_CHIP = {
      urgent: 'bg-red-50 text-red-700', soon: 'bg-amber-50 text-amber-800', routine: 'bg-stone-100 text-stone-600'
    };
    const TodoForm = ({ meta, clientId, patientName, initial, onSaved, onCancel }) => {
      const [patients, setPatients] = useState(null);
      const [f, setF] = useState(() => ({
        clientId: clientId || (initial && initial.clientId) || '',
        title: (initial && initial.title) || '',
        detail: (initial && initial.detail) || '',
        dueDate: (initial && initial.dueDate) || '',
        dueTime: (initial && initial.dueTime) || '',
        priority: (initial && initial.priority) || 'routine',
        category: (initial && initial.category) || 'other',
        assigneeId: (initial && initial.assigneeId) || ''
      }));
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState('');
      useEffect(() => {
        if (clientId || initial) return;
        let live = true;
        api.patients().then(r => { if (live) setPatients(r.patients || []); })
          .catch(e => { if (live) setErr(e.message); });
        return () => { live = false; };
      }, [clientId, initial]);
      const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
      const save = async (e) => {
        e.preventDefault();
        setBusy(true); setErr('');
        try {
          // A time with no date is refused by the server, so the form does not
          // send one: clearing the date clears the time here too.
          const body = { title: f.title, detail: f.detail, dueDate: f.dueDate || null,
            dueTime: f.dueDate ? (f.dueTime || null) : null, priority: f.priority, category: f.category };
          if (f.assigneeId) body.assigneeId = f.assigneeId;
          const r = initial
            ? await api.updateTask(initial.id, { action: 'edit', ...body })
            : await api.createTask({ clientId: f.clientId, ...body });
          onSaved && onSaved(r.task);
        } catch (x) { setErr(x.message); } finally { setBusy(false); }
      };
      const team = (meta && meta.team) || [];
      return (
        <form onSubmit={save} className="card p-4 mb-4 space-y-3">
          <div className="text-[14px] font-semibold text-primary">{initial ? 'Edit To-Do' : 'New To-Do'}</div>
          {clientId || initial
            ? <div className="text-[13px] text-stone-600">Patient: <b>{patientName || (initial && initial.patientName) || '—'}</b></div>
            : (
              <Field label="Patient">
                <select className="inp" value={f.clientId} onChange={set('clientId')} required>
                  <option value="">{patients ? 'Choose a patient' : 'Loading patients…'}</option>
                  {(patients || []).map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
              </Field>
            )}
          <Field label="What needs doing">
            <input className="inp" value={f.title} onChange={set('title')} maxLength={200} required
              placeholder="e.g. Call daughter about PT schedule" />
          </Field>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
            <Field label="Due date"><input className="inp" type="date" value={f.dueDate} onChange={set('dueDate')} /></Field>
            <Field label="Due time">
              <input className="inp" type="time" value={f.dueTime} onChange={set('dueTime')} disabled={!f.dueDate} />
              <div className="text-[11px] text-stone-500 mt-1">{f.dueDate ? 'Blank sends the reminder at 9:00 AM' : 'Pick a date first'}</div>
            </Field>
            <Field label="Priority">
              <select className="inp" value={f.priority} onChange={set('priority')}>
                {((meta && meta.priorities) || ['routine', 'soon', 'urgent']).map(p => <option key={p} value={p}>{p.charAt(0).toUpperCase() + p.slice(1)}</option>)}
              </select>
            </Field>
            <Field label="Type">
              <select className="inp" value={f.category} onChange={set('category')}>
                {((meta && meta.categories) || []).map(c => <option key={c.value} value={c.value}>{c.label}</option>)}
              </select>
            </Field>
          </div>
          <Field label="Assign to">
            <select className="inp" value={f.assigneeId} onChange={set('assigneeId')}>
              <option value="">{initial ? 'Keep current' : 'Me'}</option>
              {team.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
            </select>
          </Field>
          <Field label="Details (optional)">
            <textarea className="inp" rows={2} value={f.detail} onChange={set('detail')} maxLength={2000} />
          </Field>
          <p className="text-[11.5px] text-stone-500">Only you and the person it is assigned to can see this to-do.</p>
          {err && <div className="text-[13px] text-red-600">{err}</div>}
          <div className="flex gap-2">
            <button className="btn gold" type="submit" disabled={busy}>{busy ? 'Saving…' : 'Save'}</button>
            <button className="btn ghost" type="button" onClick={onCancel}>Cancel</button>
          </div>
        </form>
      );
    };

    const TodoRow = ({ t, meta, onChanged, onOpenChart, showPatient }) => {
      const [mode, setMode] = useState(null); // null | 'edit' | 'cancel'
      const [reason, setReason] = useState('');
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState('');
      const act = async (action, extra) => {
        setBusy(true); setErr('');
        try { const r = await api.updateTask(t.id, { action, ...(extra || {}) }); setMode(null); onChanged && onChanged(r.task); }
        catch (x) { setErr(x.message); } finally { setBusy(false); }
      };
      if (mode === 'edit') {
        return <div className="px-3 pt-3"><TodoForm meta={meta} initial={t} onSaved={(task) => { setMode(null); onChanged && onChanged(task); }} onCancel={() => setMode(null)} /></div>;
      }
      const cat = ((meta && meta.categories) || []).find(c => c.value === t.category);
      const who = t.mine
        ? (t.assignedByMe ? null : `From ${t.createdByName || 'a colleague'}`)
        : `Assigned to ${t.assigneeName || 'a colleague'}`;
      return (
        <div className="px-4 py-3 border-b border-stone-100 last:border-0">
          <div className="flex items-start gap-3">
            {t.status === 'open' && t.mine
              ? <button className="mt-0.5 w-5 h-5 rounded border-2 border-stone-300 shrink-0 hover:border-[#A9853A]" title="Mark done" aria-label="Mark done"
                  disabled={busy} onClick={() => act('done')} />
              : <i className={`ti ${t.status === 'done' ? 'ti-circle-check text-emerald-600' : t.status === 'cancelled' ? 'ti-circle-x text-stone-400' : 'ti-point text-stone-400'} text-[20px] shrink-0`} />}
            <div className="min-w-0 flex-1">
              <div className={`text-[14px] font-semibold ${t.status === 'open' ? 'text-primary' : 'text-stone-400 line-through'}`}>{t.title}</div>
              <div className="text-[12.5px] text-stone-500 flex flex-wrap gap-x-2">
                {showPatient && <button type="button" className="underline decoration-dotted" onClick={() => onOpenChart && onOpenChart(t.clientId)}>{t.patientName || 'Patient'}</button>}
                {t.dueDate && <span className={t.bucket === 'overdue' ? 'text-red-600 font-semibold' : ''}>Due {fmtDate(t.dueDate)}{t.dueTime ? ` at ${fmtDueTime(t.dueTime)}` : ''}</span>}
                {cat && <span>{cat.label}</span>}
                {who && <span>{who}</span>}
              </div>
              {t.detail && <div className="text-[12.5px] text-stone-600 mt-1 whitespace-pre-wrap">{t.detail}</div>}
              {t.status === 'done' && t.completionNote && <div className="text-[12px] text-emerald-700 mt-1">{t.completionNote}</div>}
              {t.status === 'cancelled' && t.cancelReason && <div className="text-[12px] text-stone-500 mt-1">Cancelled: {t.cancelReason}</div>}
            </div>
            {t.priority !== 'routine' && <span className={`chip ${PRIORITY_CHIP[t.priority] || ''}`}>{t.priority === 'urgent' ? 'Urgent' : 'Soon'}</span>}
          </div>
          <div className="flex gap-2 mt-2 ml-8 flex-wrap">
            {t.status === 'open' && <button className="btn ghost !py-0.5 !px-2 text-[11.5px]" disabled={busy} onClick={() => setMode('edit')}>Edit</button>}
            {t.status === 'open' && <button className="btn ghost !py-0.5 !px-2 text-[11.5px]" disabled={busy} onClick={() => setMode(mode === 'cancel' ? null : 'cancel')}>Cancel To-Do</button>}
            {t.status !== 'open' && <button className="btn ghost !py-0.5 !px-2 text-[11.5px]" disabled={busy} onClick={() => act('reopen')}>Reopen</button>}
          </div>
          {mode === 'cancel' && (
            <div className="ml-8 mt-2 flex gap-2 items-center">
              <input className="inp !py-1" placeholder="Why is this no longer needed?" value={reason} onChange={e => setReason(e.target.value)} />
              <button className="btn !py-1 !px-2.5 text-[12px]" disabled={busy || !reason.trim()} onClick={() => act('cancel', { reason })}>Confirm</button>
            </div>
          )}
          {err && <div className="ml-8 mt-1 text-[12.5px] text-red-600">{err}</div>}
        </div>
      );
    };

    // The to-do list. With `clientId` it is one patient's (the chart card);
    // without, it is everything the viewer can see, grouped by when it is due.
    const TodoList = ({ clientId, patientName, onOpenChart, compact }) => {
      const [data, setData] = useState(null);
      const [err, setErr] = useState('');
      const [scope, setScope] = useState('mine');
      const [showClosed, setShowClosed] = useState(false);
      const [adding, setAdding] = useState(false);
      const load = useCallback(() => {
        const q = new URLSearchParams();
        q.set('scope', clientId ? 'all' : scope);
        if (clientId) q.set('clientId', clientId);
        if (showClosed) q.set('includeClosed', 'true');
        return api.tasks(q.toString()).then(r => { setData(r); setErr(''); }).catch(e => setErr(e.message));
      }, [clientId, scope, showClosed]);
      useEffect(() => { load(); }, [load]);
      const tasks = (data && data.tasks) || [];
      const open = tasks.filter(t => t.status === 'open');
      const closed = tasks.filter(t => t.status !== 'open');
      const rows = (list) => list.map(t => <TodoRow key={t.id} t={t} meta={data} onChanged={load} onOpenChart={onOpenChart} showPatient={!clientId} />);
      return (
        <div>
          <div className="flex items-center gap-2 mb-3 flex-wrap">
            {!clientId && [['mine', 'Assigned to Me'], ['assigned_by_me', 'I Assigned'], ['all', 'All Mine']].map(([k, label]) => (
              <button key={k} onClick={() => setScope(k)}
                className={`px-4 py-1.5 rounded-full text-[13px] font-semibold border whitespace-nowrap ${scope === k ? 'bg-[#A9853A] border-[#A9853A] text-white' : 'bg-white border-stone-200 text-primary'}`}>{label}</button>
            ))}
            <label className="text-[12.5px] text-stone-500 flex items-center gap-1 ml-auto">
              <input type="checkbox" checked={showClosed} onChange={e => setShowClosed(e.target.checked)} /> Show done
            </label>
            {!adding && <button className="btn gold !py-1.5" onClick={() => setAdding(true)}><i className="ti ti-plus" />Add To-Do</button>}
          </div>
          {adding && <TodoForm meta={data} clientId={clientId} patientName={patientName}
            onSaved={() => { setAdding(false); load(); }} onCancel={() => setAdding(false)} />}
          {err && <div className="card p-4 text-sm text-red-600 mb-3">{err}</div>}
          {!data && !err && <div className="card p-6 text-sm text-stone-500">Loading…</div>}
          {data && open.length === 0 && (
            <div className="card px-5 py-6 text-sm text-stone-500 mb-3">
              {clientId ? 'No open to-dos for this patient that you can see.' : scope === 'assigned_by_me' ? 'You have not assigned any open to-dos to anyone.' : 'Nothing on your list. Add a to-do to keep track of follow-ups.'}
            </div>
          )}
          {data && compact && open.length > 0 && <div className="card overflow-hidden mb-3">{rows(open)}</div>}
          {data && !compact && TODO_BUCKETS.map(([b, label]) => {
            const list = open.filter(t => t.bucket === b);
            if (!list.length) return null;
            return (
              <div key={b} className="mb-4">
                <h2 className={`serif text-[19px] font-semibold mb-2 ${b === 'overdue' ? 'text-red-700' : 'text-primary'}`}>{label} ({list.length})</h2>
                <div className="card overflow-hidden">{rows(list)}</div>
              </div>
            );
          })}
          {data && showClosed && closed.length > 0 && (
            <div className="mb-4">
              <h2 className="serif text-[19px] font-semibold text-stone-500 mb-2">Done or Cancelled ({closed.length})</h2>
              <div className="card overflow-hidden">{rows(closed)}</div>
            </div>
          )}
        </div>
      );
    };

    // The Tasks page: the viewer's own to-dos first, then the practice-wide
    // work queues the app builds by itself (unchanged).
    const TasksShell = ({ onOpenChart, children }) => {
      const [tab, setTab] = useState('todos');
      return (
        <div className="p-4 lg:p-7 max-w-4xl">
          <div className="flex gap-1 mb-5 border-b border-stone-200">
            {[['todos', 'My To-Dos'], ['queues', 'Work Queues']].map(([k, label]) => (
              <button key={k} onClick={() => setTab(k)}
                className={`px-4 py-2 text-[14px] font-semibold -mb-px border-b-2 ${tab === k ? 'border-[#A9853A] text-primary' : 'border-transparent text-stone-500'}`}>{label}</button>
            ))}
          </div>
          {tab === 'todos'
            ? <TodoList onOpenChart={onOpenChart} />
            : <div className="-m-4 lg:-m-7">{children}</div>}
        </div>
      );
    };

    // The daily digest on My Day: what needs the viewer now, against what is
    // coming in the next week. Built on the server in one place.
    const DIGEST_ICON = { todo: 'ti-checkbox', inbox: 'ti-mail', result: 'ti-flask', order: 'ti-clock-exclamation', visit: 'ti-calendar-event', referral: 'ti-send' };
    const DigestCard = ({ onGo, onOpenChart }) => {
      const [d, setD] = useState(null);
      const [err, setErr] = useState('');
      useEffect(() => {
        let live = true;
        api.digest().then(r => { if (live) setD(r); }).catch(e => { if (live) setErr(e.message); });
        return () => { live = false; };
      }, []);
      if (err) return <div className="card px-4 py-3 mb-4 text-[13px] text-red-600">Today's digest could not be loaded: {err}</div>;
      if (!d) return null;
      const go = (line) => {
        const o = line.open || {};
        if (o.view === 'chart') return onOpenChart(line.clientId, { tab: o.tab });
        if (line.kind === 'inbox' && line.encounterUuid) return onOpenChart(line.clientId, { tab: 'encounters', encounterUuid: line.encounterUuid });
        return onGo(o.view);
      };
      const Col = ({ title, lines, empty, tone }) => (
        <div className="min-w-0">
          <div className={`text-[12px] font-bold uppercase tracking-wide mb-2 ${tone}`}>{title} ({lines.length})</div>
          {lines.length === 0 && <p className="text-[13px] text-stone-500">{empty}</p>}
          {lines.slice(0, 8).map(l => (
            <button key={l.id} type="button" onClick={() => go(l)}
              className="w-full text-left flex items-start gap-2 py-1.5 border-b border-stone-100 last:border-0 hover:bg-cream rounded">
              <i className={`ti ${DIGEST_ICON[l.kind] || 'ti-point'} text-[16px] mt-0.5 ${l.overdue ? 'text-red-600' : 'text-[#9A7430]'}`} />
              <span className="min-w-0 flex-1">
                <span className="block text-[13px] font-semibold text-primary truncate">{l.title}</span>
                <span className="block text-[12px] text-stone-500 truncate">
                  {[l.patientName, l.when && (l.overdue && l.kind === 'todo' ? `was due ${fmtDate(l.when)}` : fmtDate(l.when)), l.time && fmt12h(l.time), l.from && `from ${l.from}`].filter(Boolean).join(' · ')}
                </span>
              </span>
            </button>
          ))}
          {lines.length > 8 && <p className="text-[12px] text-stone-500 mt-1">and {lines.length - 8} more</p>}
        </div>
      );
      return (
        <div className="card mb-4">
          <div className="card-h flex items-center justify-between gap-2">
            <h2><i className="ti ti-list-check mr-1 text-accent" />Today's Digest</h2>
            <span className="text-[12.5px] text-stone-500">
              <b className={d.counts.overdue ? 'text-red-700' : ''}>{d.counts.pending}</b> pending · <b>{d.counts.upcoming}</b> upcoming
            </span>
          </div>
          <div className="p-4 grid grid-cols-1 md:grid-cols-2 gap-5">
            <Col title="Pending Now" lines={d.pending} tone="text-red-700" empty="Nothing is waiting on you right now." />
            <Col title={`Coming Up (next ${d.upcomingDays} days)`} lines={d.upcoming} tone="text-primary" empty="Nothing scheduled in the next week." />
          </div>
          {d.calendar && !d.calendar.ok && d.calendar.code !== 'NO_OWN_CALENDAR' && (
            <p className="px-4 pb-3 text-[12px] text-amber-700">Visits are missing from Coming Up: {d.calendar.error}</p>
          )}
          <div className="px-4 pb-3"><button className="btn ghost !py-1 !px-2.5 text-[12px]" onClick={() => onGo('queues')}>Open Tasks</button></div>
        </div>
      );
    };

    // ── Session 4.12 Scope I — WORK QUEUES and ANALYTICS ──────────────────
    // I2: the cross-patient destinations are work queues, not chart tabs.
    // I3: a destination with nothing in it renders an empty state SAYING SO —
    // it is never hidden, because a missing menu item is indistinguishable
    // from a broken one.
    // 2026-10-12 redesign: the four queues as one list with filter chips,
    // the same shape as the Inbox. Each row opens the place where its work is
    // done: an encounter on its note, a result on Results, a referral on
    // Referrals, an overdue order on Orders.
    const TASK_QUEUES = [
      ['unsignedEncounters', 'Unsigned', 'ti-signature', 'Every documented encounter is signed.'],
      ['unacknowledgedResults', 'Results', 'ti-flask', 'No results are waiting to be acknowledged.'],
      ['openReferrals', 'Referrals', 'ti-send', 'No referrals are outstanding.'],
      ['overdueOrders', 'Overdue', 'ti-clock-exclamation', 'Nothing is overdue.']
    ];
    const WorkQueuesView = ({ onOpenChart, onOpenEncounter }) => {
      const [data, setData] = useState(null);
      const [err, setErr] = useState('');
      const [only, setOnly] = useState('all');
      useEffect(() => {
        let live = true;
        api.workQueues().then(r => { if (live) { setData(r); setErr(''); } })
          .catch(e => { if (live) setErr(e.message); });
        return () => { live = false; };
      }, []);
      if (err) return <div className="p-4 lg:p-7"><div className="card p-4 text-sm text-red-600">{err}</div></div>;
      if (!data) return <div className="p-4 lg:p-7"><div className="card p-6 text-sm text-stone-500">Loading…</div></div>;
      const q = data.queues || {};
      const rowFor = (key, r) => {
        const name = r.patientName || 'Unnamed patient';
        if (key === 'unsignedEncounters') return { title: name, sub: [r.date && fmtDate(r.date), r.codingStatus].filter(Boolean).join(' · '), open: () => onOpenEncounter(r.clientId, r.encounterUuid), cta: 'Open Encounter', id: r.encounterUuid };
        if (key === 'unacknowledgedResults') return { title: r.label || 'Result', sub: [name, r.interpretation, r.receivedAt && fmtDate(r.receivedAt)].filter(Boolean).join(' · '), open: () => onOpenChart(r.clientId, { tab: 'results' }), cta: 'Open Results', id: r.id };
        if (key === 'openReferrals') return { title: r.specialty || 'Referral', sub: [name, r.status, r.orderReference, r.createdAt && fmtDate(r.createdAt)].filter(Boolean).join(' · '), open: () => onOpenChart(r.clientId, { tab: 'referrals' }), cta: 'Open Referrals', id: r.id };
        return { title: r.orderType ? r.orderType.charAt(0).toUpperCase() + r.orderType.slice(1) : 'Order', sub: [name, r.ageDays != null ? `${r.ageDays} days since sent` : null, r.recipientName, r.recipientFax].filter(Boolean).join(' · '), open: () => onOpenChart(r.clientId, { tab: 'orders' }), cta: 'Open Orders', id: r.id };
      };
      const shown = TASK_QUEUES.filter(([k]) => only === 'all' || only === k);
      const total = TASK_QUEUES.reduce((n, [k]) => n + ((q[k] || []).length), 0);
      return (
        <div className="p-4 lg:p-7 max-w-4xl">
          <div className="flex gap-2 mb-4 overflow-x-auto">
            {[['all', 'All', total], ...TASK_QUEUES.map(([k, label]) => [k, label, (q[k] || []).length])].map(([k, label, n]) => (
              <button key={k} onClick={() => setOnly(k)}
                className={`px-4 py-1.5 rounded-full text-[13px] font-semibold border whitespace-nowrap ${only === k ? 'bg-[#A9853A] border-[#A9853A] text-white' : 'bg-white border-stone-200 text-primary'}`}>
                {label}{n > 0 && <span className="ml-1.5 opacity-80">{n}</span>}
              </button>
            ))}
          </div>
          {shown.map(([k, label, icon, empty]) => {
            const rows = q[k] || [];
            return (
              <div key={k} className="mb-5">
                <h2 className="serif text-[21px] font-semibold text-primary mb-2">{label} ({rows.length})</h2>
                <div className="card overflow-hidden">
                  {rows.length === 0 && <p className="text-sm text-stone-500 px-5 py-6">{empty}</p>}
                  {rows.map(r => {
                    const x = rowFor(k, r);
                    return (
                      <div key={x.id} className="flex items-center gap-3 px-4 py-3.5 border-b border-stone-100 last:border-0">
                        <div className="w-11 h-11 rounded-xl flex items-center justify-center shrink-0 bg-[#F6EFE2] text-[#9A7430]"><i className={`ti ${icon} text-[20px]`} /></div>
                        <button type="button" className="min-w-0 flex-1 text-left" onClick={x.open}>
                          <div className="text-[14px] font-semibold text-primary truncate">{x.title}</div>
                          <div className="text-[12.5px] text-stone-500 truncate">{x.sub}</div>
                        </button>
                        <button className="btn ghost !py-1 !px-2.5 text-[12px] whitespace-nowrap hidden sm:inline-flex" onClick={x.open}>{x.cta}</button>
                        <i className="ti ti-chevron-right text-stone-300 sm:hidden" />
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
          {data.overdueThresholds && (
            <p className="text-[11.5px] text-stone-400">
              Overdue after {Object.entries(data.overdueThresholds).map(([k, v]) => `${k} ${v}d`).join(' · ')}.
            </p>
          )}
        </div>
      );
    };

    const Metric = ({ label, value, sub, unavailable, reason, icon }) => (
      <div className="card p-4 flex gap-3 items-start">
        <div className="w-11 h-11 rounded-xl flex items-center justify-center shrink-0 bg-[#F6EFE2] text-[#9A7430]"><i className={`ti ${icon || 'ti-chart-dots'} text-[20px]`} /></div>
        <div className="min-w-0">
          <div className="text-[12.5px] text-stone-500">{label}</div>
          {unavailable
            ? <div className="text-[12.5px] text-amber-700 mt-1">Not available: {String(reason || '').replace(/_/g, ' ')}</div>
            : <div className="serif text-[30px] leading-tight text-primary font-semibold">{value == null ? '—' : value}</div>}
          {!unavailable && sub && <div className="text-[12px] text-stone-500">{sub}</div>}
        </div>
      </div>
    );

    const AnalyticsView = () => {
      const [data, setData] = useState(null);
      const [err, setErr] = useState('');
      useEffect(() => {
        let live = true;
        api.analytics().then(r => { if (live) { setData(r); setErr(''); } })
          .catch(e => { if (live) setErr(e.message); });
        return () => { live = false; };
      }, []);
      if (err) return <div className="p-4 lg:p-7"><div className="card p-4 text-sm text-red-600">{err}</div></div>;
      if (!data) return <div className="p-4 lg:p-7 text-sm text-stone-500">Loading…</div>;
      const m = data.metrics;
      const weeks = m.visitsPerWeek || [];
      const peak = Math.max(1, ...weeks.map(w => w.total));
      return (
        <div className="p-4 lg:p-7 max-w-5xl">
          <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4 mb-5">
            <Metric icon="ti-clock" label="Average Visit Length"
              value={m.averageVisitMinutes.value == null ? null : `${m.averageVisitMinutes.value} min`}
              sub={`from ${m.averageVisitMinutes.sampleSize} finished ${m.averageVisitMinutes.sampleSize === 1 ? 'visit' : 'visits'}`} />
            <Metric icon="ti-signature" label="Unsigned Notes" value={m.unsignedNotesAgeing.count}
              sub={m.unsignedNotesAgeing.oldestDays != null ? `oldest ${m.unsignedNotesAgeing.oldestDays} days` : null} />
            <Metric icon="ti-clipboard-list" label="Open Orders" value={m.openOrdersAgeing.count}
              sub={m.openOrdersAgeing.oldestDays != null ? `oldest ${m.openOrdersAgeing.oldestDays} days` : null} />
            {/* Two metrics this app cannot observe yet. Reported as unavailable
                with the reason rather than as a zero somebody would read as
                "nobody drove anywhere" or "no screenings are done". */}
            <Metric icon="ti-car" label="Miles Driven" unavailable={m.milesDriven.unavailable} reason={m.milesDriven.reason} />
            <Metric icon="ti-checklist" label="Screening Completion"
              unavailable={m.screeningCompletionRate.unavailable} reason={m.screeningCompletionRate.reason} />
          </div>
          <div className="card">
            <div className="card-h"><h2><i className="ti ti-chart-bar mr-1 text-accent" />Visits per Week</h2></div>
            <div className="p-4">
              {weeks.length === 0 && <p className="text-[12.5px] text-stone-500">No documented visits in the last eight weeks.</p>}
              {weeks.map(w => (
                <div key={w.week} className="flex items-center gap-2 py-1">
                  <span className="text-[11.5px] text-stone-500 w-[84px] shrink-0">{w.week}</span>
                  <div className="flex-1 bg-stone-100 rounded-full h-3.5 overflow-hidden">
                    <div className="bg-accent h-3.5 rounded-full" style={{ width: `${Math.round((w.total / peak) * 100)}%` }} />
                  </div>
                  <span className="text-[11.5px] text-stone-700 w-6 text-right">{w.total}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // ── Session 4.12 Scope B — the day, plotted (B2/B3) ───────────────────
    // NO MAP TILES, DELIBERATELY. A tile provider would receive the coordinates
    // of every patient's home on every render — a disclosure of where people
    // live to a third party with no BAA — and for the question this screen
    // answers ("in what order should I see these people") a street map adds
    // nothing a relative plot does not. The brief's own sketch is dots joined
    // by lines. Everything here is drawn from coordinates the app already
    // holds, and nothing leaves the boundary.
    const DayMap = ({ plot }) => {
      // SERVED, not computed here. The module that places a stop reaches into
      // the scheduling module for the one coordinate reader, and that chain
      // does not load in a page — so the page renders the server's answer and
      // decides no geometry of its own.
      if (!plot || !plot.points || !plot.points.length) {
        return (
          <div className="p-4 text-[12.5px] text-amber-700">
            None of today's visits has address coordinates, so there is nothing to plot.
            An admin sets them under Scheduling → Locations.
          </div>
        );
      }
      return (
        <div className="p-4">
          <svg viewBox="0 0 100 100" className="w-full max-w-md mx-auto block" style={{ aspectRatio: '1 / 1' }}
            role="img" aria-label="Today's stops, plotted by relative position">
            {plot.points.slice(0, -1).map((p, i) => {
              const n = plot.points[i + 1];
              return <line key={`l${p.eid}`} x1={p.x} y1={p.y} x2={n.x} y2={n.y}
                stroke="#C9A44A" strokeWidth="0.8" strokeDasharray="2 1.5" />;
            })}
            {plot.points.map(p => (
              <g key={p.eid}>
                <circle cx={p.x} cy={p.y} r="3.2" fill="#033D50" />
                <text x={p.x} y={p.y + 1.1} textAnchor="middle" fill="#fff"
                  style={{ fontSize: '3px', fontWeight: 700 }}>{p.order}</text>
                <text x={p.x} y={p.y - 4.6} textAnchor="middle" fill="#2b2b28"
                  style={{ fontSize: '3.2px' }}>{p.label}</text>
              </g>
            ))}
          </svg>
          <p className="text-[11px] text-stone-400 text-center mt-2">
            Relative positions only — north is up. Not a street map, and no coordinates leave this app.
          </p>
          {plot.unplaceable > 0 && (
            <p className="text-[11.5px] text-amber-700 text-center mt-1">
              {plot.unplaceable} {plot.unplaceable === 1 ? 'stop has' : 'stops have'} no coordinates and could not be plotted.
            </p>
          )}
        </div>
      );
    };

    // B5 — who else lives near this address and is due to be seen. A house call
    // is mostly driving, so a trip that fills two slots instead of one is the
    // biggest lever there is on a day.
    const NearbyDue = ({ clientId, onOpenChart }) => {
      const [data, setData] = useState(null);
      const [err, setErr] = useState('');
      const [radius, setRadius] = useState(10);
      useEffect(() => {
        if (!clientId) return;
        let live = true;
        api.nearby(clientId, radius).then(r => { if (live) { setData(r); setErr(''); } })
          .catch(e => { if (live) setErr(e.message); });
        return () => { live = false; };
      }, [clientId, radius]);
      if (err) return <p className="text-[12px] text-red-600">{err}</p>;
      if (!data) return <p className="text-[12px] text-stone-500">Looking…</p>;
      if (data.notice) return <p className="text-[12px] text-amber-700">{data.notice}</p>;
      return (
        <div>
          <div className="flex items-center gap-2 mb-2">
            <span className="lblu">Within</span>
            <select className="inp !w-auto !py-0.5 text-[11.5px]" value={radius} onChange={e => setRadius(Number(e.target.value))}>
              {[5, 10, 15, 25].map(r => <option key={r} value={r}>{r} miles</option>)}
            </select>
            <span className="text-[11px] text-stone-400">straight line</span>
          </div>
          {data.nearby.length === 0
            ? <p className="text-[12px] text-stone-500">
              Nobody else within {data.radiusMiles} miles is due to be seen.
            </p>
            : data.nearby.map(n => (
              <div key={n.clientId} className="flex items-center justify-between gap-2 py-1.5 border-b border-stone-100 last:border-0">
                <div className="min-w-0">
                  <div className="text-[13px] font-semibold truncate">{n.name}</div>
                  <div className="text-[11.5px] text-stone-500">
                    {[`${n.miles} mi`,
                      n.reason === 'never_seen' ? 'never seen' : `last seen ${n.lastVisitAt} (${n.daysSinceLastVisit}d)`,
                      n.address].filter(Boolean).join(' · ')}
                  </div>
                </div>
                <button className="btn ghost !py-0.5 !px-2 text-[11px] shrink-0" onClick={() => onOpenChart(n.clientId)}>Open</button>
              </div>
            ))}
          <Hint className="mt-2">
            "Due" means no visit on file, or none in the last {data.dueAfterDays} days.
          </Hint>
        </div>
      );
    };

    // ── Session 4.12 — MY DAY (Scope A) ────────────────────────────────────
    // The default landing screen. A house-call clinician does not start the day
    // by looking up a patient; they start it by looking at the day. Every row
    // carries what you read in the car: who, when, where, how to get in, and
    // who will be there.
    const VISIT_STATE_STYLE = {
      scheduled: 'bg-emerald-50 text-emerald-700 border-emerald-200',
      en_route: 'bg-sky-50 text-sky-700 border-sky-200',
      arrived: 'bg-amber-50 text-amber-700 border-amber-200',
      in_progress: 'bg-indigo-50 text-indigo-700 border-indigo-200',
      signed: 'bg-primary/10 text-primary border-primary/20',
      cancelled: 'bg-stone-100 text-stone-500 border-stone-200',
      no_show: 'bg-red-50 text-red-700 border-red-200'
    };
    const VISIT_STATE_LABEL = {
      scheduled: 'Scheduled', en_route: 'En Route', arrived: 'Arrived', in_progress: 'In Progress',
      signed: 'Signed', cancelled: 'Cancelled', no_show: 'No-show'
    };
    const VisitStatePill = ({ state }) => (
      <span className={`pill ${VISIT_STATE_STYLE[state] || 'bg-stone-100 text-stone-600 border-stone-200'}`}>
        {VISIT_STATE_LABEL[state] || String(state || '').replace(/_/g, ' ')}
      </span>
    );

    // NAVIGATE hands off to the device's own map app rather than drawing a map
    // in a browser tab: the clinician is about to drive, and the phone's map has
    // their traffic, their voice guidance and their car.
    const navigateHref = (address) =>
      `https://maps.google.com/?q=${encodeURIComponent(String(address || ''))}`;

    const DayDistance = ({ distance }) => {
      const d = distance || {};
      if (d.reason === 'first_stop') return <span className="text-[11.5px] text-stone-400">First stop</span>;
      if (d.reason === 'no_coordinates') {
        return <span className="text-[11.5px] text-amber-700">No address coordinates — distance cannot be shown</span>;
      }
      if (typeof d.miles !== 'number') return null;
      // LABELLED as straight-line, deliberately. A 3-mile straight line across a
      // river is a 20-minute drive, and a clinician planning a day around a
      // number called "drive time" that is really a crow's flight will be late.
      return <span className="text-[11.5px] text-stone-500">{d.miles} mi in a straight line from the last stop</span>;
    };

    // 2026-10-12 redesign: the row on the schedule list is now compact (time,
    // patient, status), and the visit's ACTIONS live here, in the Visit Details
    // pane for the visit the clinician picked. Every gate below is unchanged.
    const DayVisitRow = ({ v, onOpenChart, onPacket, onStamp, onStartVideo, busy, canWrite }) => (
      <div>
        {v.timing && (v.timing.arrivedAt || v.timing.startedAt) && (
          <div className="text-[11px] text-stone-500 mt-1">
            {v.timing.arrivedAt && <>Arrived {fmtTs(v.timing.arrivedAt)}. </>}
            {v.timing.startedAt && <>Started {fmtTs(v.timing.startedAt)}. </>}
            {v.timing.endedAt && <>Ended {fmtTs(v.timing.endedAt)}. </>}
            {v.timing.totalMinutes != null && <b>{v.timing.totalMinutes} min total.</b>}
          </div>
        )}
        <div className="flex gap-2 mt-2 flex-wrap">
          {/* T1 B1 — ONE button: it opens the room AND stamps the visit as
              started. A video visit has no arrival to record, so a join
              link beside a Start visit button people had to remember is how
              every telehealth note ended up with no time statement. */}
          {canWrite && v.video && ['scheduled', 'en_route', 'arrived'].includes(v.state) && (
            <button className="btn gold !py-1.5 !px-3 text-[12px]" disabled={busy === v.eid}
              onClick={() => onStartVideo(v)}><i className="ti ti-video" />Start Video Visit</button>
          )}
          {v.video && v.state === 'in_progress' && (
            <button className="btn ghost !py-1.5 !px-3 text-[12px]" disabled={busy === v.eid}
              onClick={() => onStartVideo(v)}><i className="ti ti-video" />Rejoin Video</button>
          )}
          {!v.video && v.address && (
            <a className="btn ghost !py-1.5 !px-3 text-[12px]" href={navigateHref(v.address)}
              target="_blank" rel="noopener noreferrer"><i className="ti ti-navigation" />Navigate</a>
          )}
          {/* Nobody drives to or arrives at a video visit, so those two
              stamps are not offered on one. Ending it still is: the end is
              what makes the time statement. */}
          {canWrite && !v.video && v.state === 'scheduled' && (
            <button className="btn ghost !py-1.5 !px-3 text-[12px]" disabled={busy === v.eid}
              onClick={() => onStamp(v, 'en_route')}><i className="ti ti-car" />En Route</button>
          )}
          {canWrite && !v.video && ['scheduled', 'en_route'].includes(v.state) && (
            <button className="btn gold !py-1.5 !px-3 text-[12px]" disabled={busy === v.eid}
              onClick={() => onStamp(v, 'arrive')}><i className="ti ti-door-enter" />Arrive</button>
          )}
          {canWrite && !v.video && v.state === 'arrived' && (
            <button className="btn !py-1.5 !px-3 text-[12px]" disabled={busy === v.eid}
              onClick={() => onStamp(v, 'start')}><i className="ti ti-player-play" />Start Visit</button>
          )}
          {/* THE ONLY WAY `billableMinutes` is ever non-null (myDay.js) — the
              clinician's own start and end, with no fallback to the diary.
              Without this button `endedAt` could never be set at all, so
              every visit's time statement stayed "no time recorded" forever
              (owner report, 2026-10-11). */}
          {canWrite && v.state === 'in_progress' && (
            <button className="btn gold !py-1.5 !px-3 text-[12px]" disabled={busy === v.eid}
              onClick={() => onStamp(v, 'end')}><i className="ti ti-player-stop" />End Visit</button>
          )}
        </div>
      </div>
    );

    // One line on the day's schedule. Picking it fills the Visit Details pane.
    // A slot reads as "9:30 AM" or "9:30 AM – 10:30 AM", and an exam with no
    // slot reads as "No set time" rather than being shown a made-up one.
    // ONE formatter for the Veterans board and My Day: two would drift, and a
    // 24-hour time on one screen and a 12-hour on the other is how somebody
    // turns up an hour out.
    const fmtSlot = (examTime, durationMinutes) => {
      if (!/^\d{2}:\d{2}$/.test(String(examTime || ''))) return null;
      const h12 = (mins) => {
        const h = Math.floor((mins % 1440) / 60), m = mins % 60;
        return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`;
      };
      const start = Number(examTime.slice(0, 2)) * 60 + Number(examTime.slice(3));
      const len = Number(durationMinutes);
      return Number.isFinite(len) && len > 0 ? `${h12(start)} – ${h12(start + len)}` : h12(start);
    };

    // Track E — the day's IME exams, beside the clinical visits and labelled.
    // READ ONLY, on purpose: a veteran's status is marked on the Veterans board
    // and nowhere else, so this screen cannot become a second writer of it.
    // An exam has a date and a site and no time of day, so these are grouped by
    // site rather than slotted into the timed list, which would invent a time.
    // Track E — one IME exam on the clinician's day. Rendered IN TIME ORDER
    // among the clinical visits (the server's `agenda`), because a provider
    // with a 9am home visit and an 11am exam reads one day, not two lists.
    // READ ONLY, on purpose: a veteran's status is marked on the Veterans
    // board and nowhere else, so this screen cannot become a second writer.
    const ImeExamRow = ({ e }) => {
      const chip = { expected: 'bg-stone-100 text-stone-600', arrived: 'bg-emerald-100 text-emerald-800',
        seen: 'bg-sky-100 text-sky-800', no_show: 'bg-amber-100 text-amber-800' };
      const slot = fmtSlot(e.examTime, e.durationMinutes);
      return (
        <div className="flex items-start gap-3 px-4 lg:px-5 py-3 border-b border-stone-100 last:border-0 bg-cream/40">
          <div className="w-11 shrink-0 text-[12px] text-stone-500 leading-tight pt-0.5">
            {slot ? slot.split(' – ')[0] : <span className="text-stone-400">—</span>}
          </div>
          <div className="min-w-0 flex-1">
            <div className="flex flex-wrap items-center gap-2">
              <span className="text-[13.5px] font-semibold text-primary truncate">{e.lastName}, {e.firstName}</span>
              <span className="rounded px-1.5 py-0.5 text-[10.5px] font-bold uppercase tracking-wide bg-primary/10 text-primary">IME</span>
              <span className={`shrink-0 rounded px-1.5 py-0.5 text-[11px] ${chip[e.status] || chip.expected}`}>{e.statusLabel}</span>
            </div>
            <div className="text-[12px] text-stone-500">
              {e.siteLabel}{slot ? ` · ${slot}` : ' · No set time'}{e.providerName ? ` · ${e.providerName}` : ''}
            </div>
          </div>
        </div>
      );
    };

    // Who else is in the room (owner, 2026-11-05). A family meeting is the
    // clinician plus a case manager, a social worker, the coordinator.
    //
    // The ELIGIBLE LIST IS SERVED, never named here: a screen that keeps its
    // own idea of who may attend drifts from the gate that refuses them. The
    // clinician is already on the visit and is not in this list.
    const VisitAttendees = ({ appt, canWrite, onChanged }) => {
      const [all, setAll] = useState(null);
      const [picked, setPicked] = useState(() => (appt.attendees || []).map(a => a.id));
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState('');
      const [open, setOpen] = useState(false);
      useEffect(() => {
        if (!open || all) return;
        api.attendeeCandidates().then(r => setAll(r.candidates || [])).catch(e => setErr(e.message));
      }, [open, all]);
      const toggle = (id) => setPicked(p => (p.includes(id) ? p.filter(x => x !== id) : [...p, id]));
      const save = () => {
        setBusy(true); setErr('');
        api.setAttendees(appt.eid, picked)
          .then(r => { setOpen(false); onChanged && onChanged(r); })
          .catch(e => setErr(e.message))
          .finally(() => setBusy(false));
      };
      const names = (appt.attendees || []).map(a => a.name).filter(Boolean);
      return (
        <div className="border-t border-stone-100 pt-1.5 mt-1">
          <div className="flex items-center justify-between gap-2">
            <span className="text-xs text-stone-500">
              {names.length
                ? <>Also attending: <b className="text-stone-700">{names.join(', ')}</b></>
                : 'No one else on this visit'}
            </span>
            {canWrite && (
              <button className="btn ghost !py-0.5 !px-2 text-[11.5px]" onClick={() => setOpen(o => !o)}>
                {open ? 'Close' : 'Add Team Member'}
              </button>
            )}
          </div>
          {open && (
            <div className="mt-2 grid gap-1.5">
              {!all && !err && <p className="text-xs text-stone-500">Loading the team…</p>}
              {(all || []).map(c => (
                <label key={c.id} className="flex items-center gap-2 text-[12.5px]">
                  <input type="checkbox" checked={picked.includes(c.id)} onChange={() => toggle(c.id)} />
                  <span>{c.name}{c.role ? <span className="text-stone-400"> · {c.role}</span> : null}</span>
                  {/* Said plainly rather than letting the invite fail quietly. */}
                  {!c.hasEmail && <span className="text-amber-700 text-[11px]">no email on file — cannot be invited</span>}
                </label>
              ))}
              {all && all.length === 0 && <p className="text-xs text-stone-500">No other clinical team members on file.</p>}
              {err && <p className="text-red-600 text-xs">{err}</p>}
              <p className="text-[11px] text-stone-400">
                Everyone added gets a calendar invite with the time and the kind of visit. It carries no patient details.
              </p>
              <button className="btn !py-1 !px-3 text-xs w-fit" disabled={busy || !all} onClick={save}>
                {busy ? 'Saving…' : 'Save & Invite'}
              </button>
            </div>
          )}
        </div>
      );
    };

    const DayScheduleRow = ({ v, on, onSelect }) => (
      <button type="button" onClick={() => onSelect(v)}
        className={`cw-row w-full text-left flex items-center gap-3 px-4 lg:px-5 py-3.5 border-b border-stone-100 last:border-0 ${on ? 'on' : ''} ${v.state === 'cancelled' ? 'opacity-50' : ''}`}>
        <div className="w-[64px] shrink-0">
          <div className="text-[13.5px] font-semibold text-stone-700">{v.time || '—'}</div>
          {v.endTime && <div className="text-[11px] text-stone-400">to {v.endTime}</div>}
        </div>
        <div className="cw-avatar w-11 h-11 text-[14px] hidden sm:flex">{initials(v.patientName)}</div>
        <div className="min-w-0 flex-1">
          <div className="serif text-[18px] leading-tight font-semibold text-primary truncate">{v.patientName || 'Unnamed patient'}</div>
          <div className="text-[12.5px] text-stone-600 truncate">{[v.visitType, v.serviceLine].filter(Boolean).join(' • ')}</div>
          <div className="text-[12px] text-stone-500 truncate">
            {v.video ? <><i className="ti ti-video mr-1" />Video visit</> : (v.address || '')}
          </div>
          {v.insurance && v.insurance.status && v.insurance.status !== 'verified' && <InsuranceCheck v={v.insurance} />}
        </div>
        <VisitStatePill state={v.state} />
        <i className="ti ti-chevron-right text-stone-400" />
      </button>
    );

    const PreVisitPacket = ({ clientId, eid, onClose, onOpenChart }) => {
      const [p, setP] = useState(null);
      const [err, setErr] = useState('');
      useEffect(() => {
        let live = true;
        api.preVisit(clientId, eid).then(r => { if (live) setP(r); })
          .catch(e => { if (live) setErr(e.message); });
        return () => { live = false; };
      }, [clientId, eid]);
      if (err) return <div className="card p-4"><p className="text-red-600 text-sm">{err}</p>
        <button className="btn ghost !py-1 !px-2.5 text-xs mt-2" onClick={onClose}>Close</button></div>;
      if (!p) return <div className="card p-4 text-sm text-stone-500">Loading the packet…</div>;
      const k = p.packet || {};
      const b = k.banner || {};
      const Row = ({ label, children }) => (
        <div className="flex gap-2 py-1 border-b border-stone-100 last:border-0">
          <div className="lblu w-[130px] shrink-0 pt-0.5">{label}</div>
          <div className="text-[12.5px] text-stone-700 min-w-0">{children}</div>
        </div>
      );
      return (
        <div className="card">
          <div className="card-h">
            <h2>{k.patientName} — today's visit</h2>
            <button className="btn ghost !py-1 !px-2.5 text-xs" onClick={onClose}>Close</button>
          </div>
          <div className="p-4 space-y-3">
            <AllergyStrip allergies={b.allergies} />
            <div>
              <Row label="Reason">{k.reason || '—'}</Row>
              <Row label="Insurance">
                {(b.insurance && b.insurance.primary) || '—'}
                {b.insurance && b.insurance.verification ? <><br /><InsuranceCheck v={b.insurance.verification} /></> : null}
              </Row>
              <Row label="Last visit">{k.lastVisitAt || '—'}</Row>
              <Row label="Last vitals">
                {k.lastVitals ? [k.lastVitals.label || k.lastVitals.name, k.lastVitals.value].filter(Boolean).join(' ') : '—'}
                {k.lastVitals && k.lastVitals.draft && <DraftVitalsChip />}
              </Row>
              <Row label="Active problems">
                {k.activeProblems && k.activeProblems.length
                  ? k.activeProblems.map(x => x.description || x.title || x.code).filter(Boolean).join(' • ')
                  : '—'}
              </Row>
              <Row label="Recent results">
                {k.recentResults && k.recentResults.length
                  ? k.recentResults.map(r => `${r.label}${r.interpretation ? ` (${r.interpretation})` : ''}`).join(' • ')
                  : '—'}
              </Row>
            </div>
            {k.openItems && k.openItems.length > 0 && (
              <div className="bg-amber-50 border border-amber-200 rounded-lg p-3">
                <div className="lblu mb-1">Open items</div>
                {k.openItems.map((it, i) => (
                  <div key={i} className="text-[12.5px] text-amber-900 flex gap-1.5">
                    <i className="ti ti-alert-triangle mt-[2px]" /><span>{it.text}</span>
                  </div>
                ))}
              </div>
            )}
            {k.homeVisit && k.homeVisit.length > 0 && (
              <div className="bg-cream border border-creamdeep rounded-lg p-3 space-y-1">
                {k.homeVisit.map(h => (
                  <div key={h.key} className="text-[12.5px] text-stone-700">
                    <span className="lblu mr-1.5">{h.label}</span>{h.value}
                  </div>
                ))}
              </div>
            )}
            {p.emrNotice && <p className="text-[11.5px] text-amber-700">{p.emrNotice}</p>}
            <button className="btn gold w-full justify-center" onClick={() => onOpenChart(k.clientId)}>
              <i className="ti ti-user" />Open Chart
            </button>
            {/* B5 — a house call is mostly driving, so filling a trip is the
                biggest lever there is on a day. Surfaced here because this is
                where a clinician is already deciding what the trip is for. */}
            <div className="border-t border-stone-100 pt-3">
              <div className="lblu mb-1.5">Also due nearby</div>
              <NearbyDue clientId={k.clientId} onOpenChart={onOpenChart} />
            </div>
          </div>
        </div>
      );
    };

    const MyDayView = ({ user, onOpenChart, onAddVisit, onGo }) => {
      const access = useContext(AccessContext);
      const [date, setDate] = useState(() => GFC_TIME.zonedParts(new Date()).isoDate);
      const [day, setDay] = useState(null);
      const [err, setErr] = useState('');
      const [busy, setBusy] = useState(null);
      const [packet, setPacket] = useState(null);
      const [proposal, setProposal] = useState(null);
      // B1 list | B2 map, plus the "due nearby" finder, as the three tabs the
      // 2026-10-12 mockup shows over the day.
      const [mode, setMode] = useState('list');
      // The visit shown in the Visit Details pane. Kept as an eid so a reload
      // of the day keeps the same visit open.
      const [selEid, setSelEid] = useState(null);
      const load = useCallback(() => {
        setErr('');
        api.myDay(date).then(setDay).catch(e => { setErr(e.message); setDay(null); });
      }, [date]);
      useEffect(() => { load(); }, [load]);
      // On a wide screen (1280px+, where the two panes sit side by side) the
      // first visit opens in the details pane, as in the mockup. Narrower, nothing is picked, or the list would be hidden
      // behind the details before the clinician has seen the day.
      useEffect(() => {
        if (!day || !day.visits || !day.visits.length) return;
        if (selEid && day.visits.some(v => v.eid === selEid)) return;
        let wide = false;
        try { wide = window.matchMedia('(min-width: 1280px)').matches; } catch { wide = false; }
        setSelEid(wide ? day.visits[0].eid : null);
      }, [day]);

      // The two lists the agenda points into, by id. The page never sorts or
      // merges them itself: one ordering, computed on the server.
      const exams = (day && day.ime && day.ime.exams) || [];
      const agenda = (day && day.agenda) || [];
      const examById = useMemo(() => new Map(exams.map(e => [String(e.id), e])), [day]);
      const visitById = useMemo(() => new Map((day && day.visits ? day.visits : []).map(v => [String(v.eid), v])), [day]);

      // ONE Start Visit (owner, 2026-11-04): it records the start time AND
      // opens the note for this appointment — the visit's own note if it has
      // one, otherwise a new one tied to it.
      const stamp = (v, event) => {
        setBusy(v.eid); setErr('');
        api.stampVisit(v.eid, { event, clientId: v.clientId })
          .then(() => {
            load();
            if (event === 'start' && onOpenChart) {
              onOpenChart(v.clientId, v.encounterUuid ? { tab: 'visits', encounterUuid: v.encounterUuid } : { tab: 'visit', appointmentEid: v.eid });
            }
          })
          .catch(e => setErr(e.message))
          .finally(() => setBusy(null));
      };
      // T1 B1/B3 — open the room and stamp the start in one action. The window
      // is opened from the CLICK, not from the response: a `window.open` after
      // an await is outside the user-gesture stack and mobile Safari blocks it,
      // which is the trap the portal's PDF downloads already paid for.
      const startVideo = (v) => {
        setBusy(v.eid); setErr('');
        const tab = window.open('', '_blank');
        api.startVideoVisit(v.eid)
          .then(r => {
            if (tab) tab.location = r.video.meetingUri;
            else window.location = r.video.meetingUri;
            // The stamp can fail while the room opens fine, and a clinician in
            // a visit needs to know their time was not recorded.
            if (r.timingNote) setErr(r.timingNote);
            load();
          })
          .catch(e => { if (tab) tab.close(); setErr(e.message); })
          .finally(() => setBusy(null));
      };
      const optimize = () => {
        api.optimizeDay((day && day.visits) || [])
          .then(setProposal).catch(e => setErr(e.message));
      };

      const greeting = (() => {
        const h = Number(GFC_TIME.zonedParts(new Date()).hour);
        return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
      })();
      // A bare calendar date carries no zone, so it is read at MIDDAY UTC and
      // rendered in UTC. Reading it in Eastern would make "2026-09-23" the
      // evening of the 22nd and print the wrong weekday — the same trap the
      // bulk-shift generator paid for on 2026-09-20.
      const longDate = new Date(`${date}T12:00:00Z`).toLocaleDateString('en-US',
        { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
      // The ‹ Today › stepper moves by whole calendar days, also at midday UTC.
      const stepDay = (n) => {
        const d = new Date(`${date}T12:00:00Z`);
        d.setUTCDate(d.getUTCDate() + n);
        setDate(d.toISOString().slice(0, 10));
      };
      const today = GFC_TIME.zonedParts(new Date()).isoDate;

      if (packet) {
        return (
          <div className="p-4 lg:p-8 max-w-2xl mx-auto">
            <PreVisitPacket clientId={packet.clientId} eid={packet.eid}
              onClose={() => setPacket(null)} onOpenChart={onOpenChart} />
          </div>
        );
      }
      const visits = (day && day.visits) || [];
      const selected = visits.find(v => v.eid === selEid) || null;
      return (
        <div className="px-4 lg:px-8 py-5 lg:py-7">
          <div className="flex flex-wrap items-end justify-between gap-3 mb-5">
            <div className="min-w-0">
              <div className="text-[13px] text-stone-500">{greeting}, {String(user && user.name || '').split(' ')[0] || 'there'}</div>
              <div className="flex items-baseline gap-3 flex-wrap">
                <h1 className="cw-title">My Day</h1>
                <span className="text-[15px] text-stone-600">{longDate}</span>
              </div>
            </div>
            <div className="flex items-center gap-2 flex-wrap">
              <div className="inline-flex items-center bg-white border border-stone-200 rounded-xl shadow-sm">
                <button className="px-2.5 py-2 text-primary" onClick={() => stepDay(-1)} aria-label="Previous day"><i className="ti ti-chevron-left" /></button>
                <button className={`px-3 py-2 text-[13px] font-semibold border-x border-stone-200 ${date === today ? 'text-stone-400' : 'text-primary'}`}
                  onClick={() => setDate(today)}>Today</button>
                <button className="px-2.5 py-2 text-primary" onClick={() => stepDay(1)} aria-label="Next day"><i className="ti ti-chevron-right" /></button>
              </div>
              <input className="inp !w-auto !py-1.5" type="date" value={date} onChange={e => e.target.value && setDate(e.target.value)} aria-label="Pick a date" />
              {access.canDocument && onAddVisit && (
                <button className="btn gold" onClick={onAddVisit}><i className="ti ti-plus" />Add Visit</button>
              )}
            </div>
          </div>

          {err && <div className="card border-red-200 bg-red-50 text-red-700 text-sm px-4 py-3 mb-4">{err}</div>}
          {date === today && access.canManageTasks && onGo && <DigestCard onGo={onGo} onOpenChart={onOpenChart} />}
          {day && day.calendar && !day.calendar.ok && (
            <div className="card !bg-amber-50 border-amber-200 px-4 py-3 mb-4 text-[13px] text-amber-900">
              <b>The calendar could not be read.</b> {day.calendar.error} This is not an empty day — it is a day we could not load.
            </div>
          )}
          {/* An unsigned note from an earlier day is the practice's biggest
              silent risk: nothing chases it, and the longer it sits the less
              anybody remembers of the visit. Pinned at the top, in red. */}
          {day && day.unsigned && day.unsigned.length > 0 && (
            <div className="card !bg-red-50 border-red-200 px-4 py-3 mb-4">
              <div className="text-[13px] font-bold text-red-800 mb-1">
                <i className="ti ti-alert-triangle-filled mr-1" />
                {day.unsigned.length} unsigned {day.unsigned.length === 1 ? 'note' : 'notes'} from earlier days
              </div>
              {day.unsigned.map(u => (
                <div key={u.eid} className="text-[13px] text-red-900 flex items-center justify-between gap-2 py-0.5">
                  <span>{u.date} · {u.patientName} · {u.visitType} <span className="text-red-600">({u.daysOld}d)</span></span>
                  <button className="btn ghost !py-0.5 !px-2 text-[11.5px]" onClick={() => onOpenChart(u.clientId)}>Open</button>
                </div>
              ))}
            </div>
          )}

          <div className="grid gap-5 xl:grid-cols-[minmax(0,1.35fr)_minmax(0,1fr)] items-start">
            <div className={`card overflow-hidden ${selected ? 'hidden xl:block' : ''}`}>
              {/* B1 + B2 — the same day, two ways of reading it. Both render
                  the SAME visits from the SAME fetch, so the list and the map
                  cannot disagree about what exists. */}
              <div className="flex items-center justify-between gap-2 px-3 lg:px-4 border-b border-stone-100">
                <div className="flex overflow-x-auto -mb-px">
                  {[['list', 'Schedule'], ['nearby', 'Due Nearby'], ['map', 'Map']].map(([k, label]) => (
                    <div key={k} className={`tabbtn ${mode === k ? 'on' : ''}`} onClick={() => setMode(k)}>{label}</div>
                  ))}
                </div>
                <div className="flex items-center gap-1.5 shrink-0">
                  <button className="btn ghost !py-1 !px-2 text-[12px]" onClick={load} title="Refresh"><i className="ti ti-refresh" /></button>
                  {access.canDocument && visits.length > 1 && (
                    <button className="btn ghost !py-1 !px-2.5 text-[12px]" onClick={optimize} title="Optimize route">
                      <i className="ti ti-route" /><span className="hidden sm:inline">Optimize</span>
                    </button>
                  )}
                </div>
              </div>
              {mode === 'map' && day && <DayMap plot={day.plot} />}
              {mode === 'nearby' && (
                <div className="p-4">
                  {selected
                    ? <>
                      <p className="text-[12.5px] text-stone-500 mb-2">Patients due to be seen near <b>{selected.patientName}</b>.</p>
                      <NearbyDue clientId={selected.clientId} onOpenChart={onOpenChart} />
                    </>
                    : <p className="text-[13px] text-stone-500">Pick a visit on the schedule to see who else is due nearby.</p>}
                </div>
              )}
              {mode === 'list' && (
                <div>
                  {!day && !err && <p className="text-sm text-stone-500 px-5 py-6">Loading your day…</p>}
                  {day && visits.length === 0 && exams.length === 0 && (
                    <div className="px-5 py-10 text-center">
                      <i className="ti ti-calendar-off text-3xl text-stone-300" />
                      {/* "Nothing today" would be false on a day carrying IME
                          exams, so the sentence narrows to the clinical half. */}
                      <p className="text-sm text-stone-500 mt-2">No visits scheduled for this day.</p>
                    </div>
                  )}
                  {day && visits.length === 0 && exams.length > 0 && (
                    /* "Nothing today" would be false on a day carrying exams,
                       so the sentence narrows to the clinical half. */
                    <p className="text-[13px] text-stone-500 px-4 lg:px-5 pt-4 pb-1">No clinical visits scheduled for this day.</p>
                  )}
                  {/* The SERVER decides the reading order over both lines
                      (myDay.buildAgenda) and hands back pointers; the rows
                      themselves still live in `visits` and `ime.exams`, so
                      there is one copy of each and the page sorts nothing. */}
                  {agenda.map(a => (a.kind === 'ime'
                    ? <ImeExamRow key={`ime:${a.id}`} e={examById.get(String(a.id))} />
                    : <DayScheduleRow key={`v:${a.id}`} v={visitById.get(String(a.id))}
                        on={a.id === selEid} onSelect={(vv) => setSelEid(vv.eid)} />))}
                  {exams.length > 0 && (
                    <div className="px-4 lg:px-5 py-2.5 border-t border-stone-100 flex items-center justify-between gap-2">
                      <span className="text-[12px] text-stone-500">Mark a veteran seen on the Veterans board.</span>
                      <button className="btn ghost !py-0.5 !px-2 text-[11.5px]" onClick={() => onGo && onGo('veterans')}>Open Board</button>
                    </div>
                  )}
                </div>
              )}
              {day && (
                <div className="bg-cream border-t border-stone-100 px-4 lg:px-5 py-3 text-[12.5px] text-stone-600 flex gap-4 flex-wrap">
                  <span><b>{day.totals.visits}</b> {day.totals.visits === 1 ? 'visit' : 'visits'}</span>
                  <span>
                    {day.totals.miles != null
                      ? <><b>{day.totals.miles}</b> mi straight-line{day.totals.milesPartial ? ` (${day.totals.unplaceableStops} stop${day.totals.unplaceableStops === 1 ? '' : 's'} without coordinates)` : ''}</>
                      : <span className="text-amber-700">Distances unavailable — no address coordinates</span>}
                  </span>
                  <span><b>{day.totals.openTasks}</b> open {day.totals.openTasks === 1 ? 'task' : 'tasks'}</span>
                  {day.ime && day.ime.totals.exams > 0 && (
                    <span><b>{day.ime.totals.exams}</b> IME {day.ime.totals.exams === 1 ? 'exam' : 'exams'}</span>
                  )}
                </div>
              )}
            </div>

            <div className={selected ? '' : 'hidden xl:block'}>
              {selected
                ? <VisitDetails key={selected.eid} v={selected} busy={busy} canWrite={access.canDocument}
                    onBack={() => setSelEid(null)}
                    onOpenChart={onOpenChart}
                    onPacket={(vv) => setPacket({ clientId: vv.clientId, eid: vv.eid })}
                    onStamp={stamp} onStartVideo={startVideo} />
                : (
                  <div className="card px-6 py-12 text-center">
                    <i className="ti ti-hand-click text-3xl text-stone-300" />
                    <p className="text-sm text-stone-500 mt-2">{visits.length ? 'Pick a visit to see its details.' : 'Visit details show here once a visit is booked.'}</p>
                  </div>
                )}
            </div>
          </div>

          {proposal && (
            <div className="card mt-5">
              <div className="card-h">
                <h2>Proposed Order</h2>
                <button className="btn ghost !py-1 !px-2.5 text-xs" onClick={() => setProposal(null)}>Discard</button>
              </div>
              <div className="p-4">
                {!proposal.proposal && <p className="text-sm text-stone-500">Nothing to reorder.</p>}
                {proposal.proposal && (
                  <>
                    <p className="text-[12px] text-stone-500 mb-2">{proposal.proposal.caveat}</p>
                    {proposal.proposal.unchanged
                      ? <p className="text-[13px] text-stone-700">The day is already in proximity order.</p>
                      : proposal.proposal.order.map((o, i) => (
                        <div key={o.eid} className="text-[13px] py-1 border-b border-stone-100 last:border-0">
                          <b>{i + 1}.</b> {o.patientName} <span className="text-stone-500">({o.fromTime} → {o.toTime})</span>
                        </div>
                      ))}
                    {/* NEVER auto-applied. Accepting rebooks through the
                        appointment routes so the patient is told. */}
                    <p className="text-[11.5px] text-amber-700 mt-3">
                      Nothing has changed yet. Accepting this rebooks each visit through the normal reschedule
                      route, which emails the patient. Accepting is not built in this pass — the order above is a
                      proposal to work from.
                    </p>
                  </>
                )}
              </div>
            </div>
          )}
        </div>
      );
    };

    // ── Visit Details (2026-10-12 redesign) ───────────────────────────────
    // The right-hand pane of My Day. Everything on it comes from the SAME
    // pre-visit read the full packet uses; no count is shown that the packet
    // did not carry (there is no medication count on the packet, so none is
    // shown). The action buttons are DayVisitRow, unchanged in what they gate.
    // One line of the Visit Details "Key information" list. Module scope, like
    // every component here (test/react_input_focus.test.js).
    // Each line opens the chart section it counts (owner mockup 6).
    const KeyLine = ({ icon, children, tone, onClick }) => (
      <button type="button" onClick={onClick} disabled={!onClick}
        className={`w-full flex items-center gap-3 py-2 text-left text-[13.5px] border-b border-stone-100 last:border-0 ${onClick ? 'hover:bg-[#FCFAF6]' : ''} ${tone === 'red' ? 'text-red-700' : 'text-primary'}`}>
        <i className={`ti ${icon} text-[17px] ${tone === 'red' ? 'text-red-600' : 'text-stone-500'} w-5 text-center`} />
        <span className="flex-1">{children}</span>
        {onClick && <i className="ti ti-chevron-right text-stone-300" />}
      </button>
    );
    const VisitDetails = ({ v, busy, canWrite, onBack, onOpenChart, onPacket, onStamp, onStartVideo }) => {
      const [p, setP] = useState(null);
      const [err, setErr] = useState('');
      const [tab, setTab] = useState('pre');
      useEffect(() => {
        let live = true;
        setP(null); setErr('');
        api.preVisit(v.clientId, v.eid).then(r => { if (live) setP(r); })
          .catch(e => { if (live) setErr(e.message); });
        return () => { live = false; };
      }, [v.clientId, v.eid]);
      const k = (p && p.packet) || {};
      const b = k.banner || {};
      const items = k.openItems || [];
      const count = (kind) => items.filter(i => i.kind === kind).length;
      const goTab = (t) => () => onOpenChart(v.clientId, { tab: t });
      const allergyRows = (b.allergies && b.allergies.rows) || [];
      const allergyText = !b.allergies ? null
        : b.allergies.state === 'none_known' ? 'No known allergies'
        : allergyRows.length ? `Allergies (${allergyRows.length})`
        : 'Allergies not confirmed';
      return (
        <div className="card overflow-hidden">
          <div className="card-h">
            <div className="flex items-center gap-2">
              <button className="xl:hidden btn ghost !py-1 !px-2" onClick={onBack} aria-label="Back to the schedule"><i className="ti ti-arrow-left" /></button>
              <h2>Visit Details</h2>
            </div>
            <span className="text-[12px] text-stone-500">{v.time}{v.endTime ? ` – ${v.endTime}` : ''}</span>
          </div>
          <div className="flex border-b border-stone-100 px-2">
            {[['pre', 'Pre-Visit'], ['chart', 'Chart'], ['dir', v.video ? 'Video' : 'Directions']].map(([key, label]) => (
              <div key={key} className={`tabbtn flex-1 text-center ${tab === key ? 'on' : ''}`} onClick={() => setTab(key)}>{label}</div>
            ))}
          </div>
          <div className="p-4 lg:p-5">
            <div className="flex items-start gap-3 mb-4">
              <div className="cw-avatar w-14 h-14 text-[17px]">{initials(v.patientName)}</div>
              <div className="min-w-0 flex-1">
                <div className="serif text-[22px] leading-tight font-semibold text-primary">{v.patientName || 'Unnamed patient'}</div>
                <div className="text-[12.5px] text-stone-500">
                  {[b.dob ? `DOB ${fmtDate(b.dob)}${b.age != null ? ` (${b.age})` : ''}` : null, b.mrn ? `MRN ${b.mrn}` : null].filter(Boolean).join(' • ') || ' '}
                </div>
              </div>
              <VisitStatePill state={v.state} />
            </div>
            {err && <p className="text-red-600 text-sm mb-3">{err}</p>}
            {!p && !err && <p className="text-sm text-stone-500 mb-3">Loading the visit…</p>}

            {p && tab === 'pre' && (
              <div>
                <div className="lblu mb-1">Reason for visit</div>
                <p className="text-[14px] text-stone-700 mb-4">{k.reason || v.visitType || '—'}</p>
                <div className="lblu mb-1">Key information</div>
                <div className="mb-3">
                  <KeyLine icon="ti-list-details" onClick={goTab('problems')}>Problems ({(k.activeProblems || []).length})</KeyLine>
                  {allergyText && <KeyLine icon="ti-alert-triangle" onClick={goTab('allergies')}>{allergyText}</KeyLine>}
                  {count('order') > 0 && <KeyLine icon="ti-clipboard-list" onClick={goTab('orders')}>Open Orders ({count('order')})</KeyLine>}
                  {count('referral') > 0 && <KeyLine icon="ti-send" onClick={goTab('referrals')}>Open Referrals ({count('referral')})</KeyLine>}
                  {count('result') > 0 && <KeyLine icon="ti-alert-circle" tone="red" onClick={goTab('results')}>Unacknowledged Results ({count('result')})</KeyLine>}
                  {count('goal') > 0 && <KeyLine icon="ti-heart-handshake" onClick={goTab('careplan')}>Care Plan Goals ({count('goal')})</KeyLine>}
                </div>
                <AllergyStrip allergies={b.allergies} />
                {p.emrNotice && <p className="text-[12px] text-amber-700 mt-2">{p.emrNotice}</p>}
              </div>
            )}
            {p && tab === 'chart' && (
              <div className="space-y-3 text-[13.5px] text-stone-700">
                <div><div className="lblu mb-0.5">Last visit</div>{k.lastVisitAt || '—'}</div>
                <div>
                  <div className="lblu mb-0.5">Last vitals</div>
                  {k.lastVitals ? [k.lastVitals.label || k.lastVitals.name, k.lastVitals.value].filter(Boolean).join(' ') : '—'}
                  {k.lastVitals && k.lastVitals.draft && <DraftVitalsChip />}
                </div>
                <div>
                  <div className="lblu mb-0.5">Active problems</div>
                  {(k.activeProblems || []).length
                    ? <ul className="space-y-0.5">{k.activeProblems.map((x, i) => (
                      <li key={i} className="flex gap-2"><span className="text-red-400">•</span>{x.description || x.title || x.code}</li>))}</ul>
                    : '—'}
                </div>
                <div>
                  <div className="lblu mb-0.5">Recent results</div>
                  {(k.recentResults || []).length
                    ? k.recentResults.map(r => `${r.label}${r.interpretation ? ` (${r.interpretation})` : ''}`).join(' • ')
                    : '—'}
                </div>
              </div>
            )}
            {p && tab === 'dir' && (
              <div className="space-y-3 text-[13.5px] text-stone-700">
                {v.video
                  ? <p><i className="ti ti-video mr-1" />Video visit. Start or rejoin the room below.</p>
                  : <>
                    <div><div className="lblu mb-0.5">Address</div>{v.address || 'No address on file.'}</div>
                    <DayDistance distance={v.distance} />
                  </>}
                {/* A2 — access notes and who will be there. From the PATIENT
                    record, so they are here for whoever covers. */}
                {(k.homeVisit || []).length > 0 && (
                  <div className="bg-cream border border-stone-200 rounded-xl p-3 space-y-1">
                    {k.homeVisit.map(h => (
                      <div key={h.key} className="text-[13px] text-stone-700"><span className="lblu mr-1.5">{h.label}</span>{h.value}</div>
                    ))}
                  </div>
                )}
              </div>
            )}

            <div className="mt-4 pt-3 border-t border-stone-100">
              <DayVisitRow v={v} busy={busy} canWrite={canWrite} onOpenChart={onOpenChart}
                onPacket={onPacket} onStamp={onStamp} onStartVideo={onStartVideo} />
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-4">
              <button className="btn gold justify-center" onClick={() => onOpenChart(v.clientId)}><i className="ti ti-folder-open" />Open Chart</button>
              <button className="btn ghost justify-center" onClick={() => onPacket(v)}><i className="ti ti-file-description" />Pre-Visit Packet</button>
            </div>
          </div>
        </div>
      );
    };

    // ── The AI review card (Session G1, E7) ───────────────────────────────
    //
    // EVERY CREDENTIAL QUESTION IS THE SERVER'S. The card renders `canRun` and
    // `canDecide` as the server sent them and decides nothing itself — the
    // rule the clinical inbox set, and the reason a screen never offers a
    // button the API then refuses.
    //
    // THE BANNER IS FIXED AND NOT DISMISSIBLE. Everything in here is an AI
    // draft and the reader has to be told so wherever they are looking.
    const AI_PRIORITY_ORDER = ['urgent', 'attention', 'info'];
    const AI_PRIORITY_STYLE = {
      urgent: 'border-red-300 bg-red-50 text-red-900',
      attention: 'border-amber-300 bg-amber-50 text-amber-900',
      info: 'border-stone-200 bg-white text-stone-800'
    };
    const AI_CATEGORY_LABEL = {
      care_gap: 'Care gap', medication_issue: 'Medication', allergy_conflict: 'Allergy conflict',
      missing_follow_up: 'Missing follow-up', unaddressed_abnormal_result: 'Abnormal result',
      documentation_gap: 'Documentation', safety_concern: 'Safety', discrepancy: 'Discrepancy', other: 'Other'
    };

    const AiReviewCard = ({ clientId, chart, onOpenSource }) => {
      const [state, setState] = useState(null);      // the list payload
      const [open, setOpen] = useState(null);        // the review being read
      const [starting, setStarting] = useState(false);
      const [showPlan, setShowPlan] = useState(false);
      const [focus, setFocus] = useState('');
      const [excluded, setExcluded] = useState([]);
