        clientId: isRes ? (appt.clientId || '') : (linkable.length === 1 ? linkable[0].id : ''),
        providerId: isRes ? appt.providerId : (defaultProviderId || (providersData && providersData.myProviderId) || ''),
        date: isRes ? appt.date : (defaultDate || todayYmd()),
        startTime: isRes ? appt.startTime : '09:00',
        durationMinutes: isRes ? (appt.durationMinutes || 30) : 30,
        title: isRes ? appt.title : 'Clinical visit',
        location: (isRes && appt.location) || 'home',
        notes: (isRes && appt.notes) || ''
      });
      const [busy, setBusy] = useState(false); const [err, setErr] = useState('');
      // Outside the clinician's availability (owner, 2026-11-08): warned, never
      // blocked. The server asks for a reason; the form shows a box for it.
      const [outside, setOutside] = useState(null); const [outsideReason, setOutsideReason] = useState('');
      // SERVED, not decided here. The server answers this from the same
      // function the booking route enforces with, so the picker cannot offer
      // (or withhold) a calendar the route disagrees about. It was
      // `providersData.isAdmin` and left a care coordinator a disabled
      // "Provider —" box they could never save.
      const canPickProvider = !!(providersData && providersData.canPickProvider);
      const submit = () => {
        setErr('');
        if (!isRes && !f.clientId) { setErr('Pick a patient.'); return; }
        setBusy(true);
        const body = { providerId: f.providerId, date: f.date, startTime: f.startTime,
          durationMinutes: Number(f.durationMinutes), title: f.title, location: f.location, notes: f.notes,
          outsideAvailabilityReason: outside ? outsideReason : undefined };
        (isRes ? api.rescheduleAppointment(appt.eid, body) : api.createAppointment(f.clientId, body))
          // The server's warnings (a superseded row it could not remove, for one)
          // were dropped, leaving an unexplained duplicate on the calendar.
          .then(r => { if (r && r.warnings && r.warnings.length) window.alert(r.warnings.join('\n\n')); onSaved(r); })
          .catch(e => {
            if (e.data && e.data.code === 'APPOINTMENT_OUTSIDE_AVAILABILITY') { setOutside(e.message); setBusy(false); return; }
            setErr(e.message); setBusy(false);
          });
      };
      return (
        <div className="fixed inset-0 bg-black/40 z-40 flex items-start justify-center p-4 overflow-y-auto" onClick={onClose}>
          <div className="card w-full max-w-lg mt-10" onClick={e => e.stopPropagation()}>
            <div className="card-h"><h2>{isRes ? `Reschedule — ${appt.patientName || 'appointment'}` : 'New Appointment'}</h2>
              <button className="text-stone-400" onClick={onClose}><i className="ti ti-x" /></button>
            </div>
            <div className="p-4 grid gap-3">
              {!isRes && (
                <Field label="Patient (IHPC, linked to OpenEMR)">
                  <select className="inp" value={f.clientId} onChange={e => setF({ ...f, clientId: e.target.value })}>
                    <option value="">— select —</option>
                    {linkable.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                  </select>
                  {linkable.length === 0 && <p className="text-xs text-amber-700 mt-1">No linked patients yet — link a patient to OpenEMR from their chart first.</p>}
                </Field>
              )}
              <Field label="Provider">
                {canPickProvider ? (
                  <select className="inp" value={f.providerId} onChange={e => setF({ ...f, providerId: e.target.value })}>
                    <option value="">— select —</option>
                    {(providersData.providers || []).map(p => <option key={p.id} value={p.id}>{p.name} (id {p.id})</option>)}
                  </select>
                ) : (
                  <input className="inp" disabled value={(providersData && (providersData.providers || []).filter(p => p.id === f.providerId).map(p => p.name)[0]) || `Provider ${f.providerId || '—'}`} />
                )}
              </Field>
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                <Field label="Date"><input className="inp" type="date" value={f.date} onChange={e => setF({ ...f, date: e.target.value })} /></Field>
                <Field label="Start"><input className="inp" type="time" value={f.startTime} onChange={e => setF({ ...f, startTime: e.target.value })} /></Field>
                <Field label="Duration">
                  <select className="inp" value={f.durationMinutes} onChange={e => setF({ ...f, durationMinutes: e.target.value })}>
                    {DURATIONS.map(d => <option key={d} value={d}>{d} min</option>)}
                  </select>
                </Field>
              </div>
              <div className="grid md:grid-cols-2 gap-3">
                <Field label="Visit type / title"><input className="inp" value={f.title} onChange={e => setF({ ...f, title: e.target.value })} placeholder="e.g. Initial H&P, Follow-up" /></Field>
                <Field label="Location">
                  <select className="inp" value={f.location} onChange={e => setF({ ...f, location: e.target.value })}>
                    <option value="home">Home visit</option><option value="telehealth">Telehealth</option><option value="office">Office</option>
                  </select>
                </Field>
              </div>
              <Field label="Notes"><textarea className="inp" rows={2} value={f.notes} onChange={e => setF({ ...f, notes: e.target.value })} /></Field>
              {outside && (
                <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 text-sm text-amber-900">
                  <b>{outside}</b>
                  <textarea className="inp mt-2" rows={2} placeholder="Why book outside their availability?" value={outsideReason} onChange={e => setOutsideReason(e.target.value)} />
                </div>
              )}
              {err && <p className="text-red-600 text-sm">{err}</p>}
              <div className="flex flex-wrap items-center gap-2 justify-end">
                {isRes && <Hint className="w-full order-last">The original slot stays on the calendar as a cancelled entry — nothing is deleted.</Hint>}
                <button className="btn ghost" onClick={onClose}>Close</button>
                <button className="btn" disabled={busy || (outside && !outsideReason.trim())} onClick={submit}>
                  {busy ? 'Saving to OpenEMR…' : outside ? 'Book Anyway' : (isRes ? 'Reschedule' : 'Book Visit')}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // Detail + actions for one appointment (calendar block or chart row).
    const AppointmentDetail = ({ appt: apptProp, providers, onClose, onChanged, onOpenChart, onReschedule, onDocument }) => {
      const canWrite = useCanDocument();
      const [cancelOpen, setCancelOpen] = useState(false);
      const [reason, setReason] = useState('');
      const [busy, setBusy] = useState(''); const [err, setErr] = useState('');
      // The calendar list omits notes/location (7.0.4 list quirk) — hydrate.
      const [hydrated, setHydrated] = useState(null);
      useEffect(() => {
        setHydrated(null);
        api.appointmentDetail(apptProp.eid)
          .then(r => setHydrated(r.appointment))
          .catch(() => {});
      }, [apptProp.eid]);
      const appt = hydrated ? { ...apptProp, ...hydrated, clientId: hydrated.clientId || apptProp.clientId } : apptProp;
      const provider = (providers || []).filter(p => p.id === appt.providerId).map(p => p.name)[0] || `Provider ${appt.providerId}`;
      const active = appt.state !== 'cancelled';
      const run = (label, fn) => { setBusy(label); setErr('');
        fn().then(r => { if (r && r.warnings && r.warnings.length) window.alert(r.warnings.join('\n\n')); onChanged(r); }).catch(e => { setErr(e.message); setBusy(''); }); };
      return (
        <div className="fixed inset-0 bg-black/40 z-40 flex items-start justify-center p-4 overflow-y-auto" onClick={onClose}>
          <div className="card w-full max-w-md mt-10" onClick={e => e.stopPropagation()}>
            <div className="card-h"><h2>{appt.title}</h2><StateChip state={appt.state} /></div>
            <div className="p-4 text-sm grid gap-1.5">
              <div><b>{appt.patientName || 'Patient'}</b>{appt.clientId ? '' : ' (not an app client)'}</div>
              <div>{fmtDayLabel(appt.date)} · {fmt12h(appt.startTime)}–{fmt12h(appt.endTime)} ({appt.durationMinutes} min)</div>
              <div className="text-stone-500">{provider} · {LOCATION_LABELS[appt.location] || 'Home visit'}</div>
              {appt.encounterUuid && <div className="text-emerald-700 text-xs">Encounter documented: {String(appt.encounterUuid).slice(0, 8)}…</div>}
              {appt.notes && <div className="text-xs text-stone-500 whitespace-pre-wrap border-t border-stone-100 pt-1.5 mt-1">{appt.notes}</div>}
              {active && <VisitAttendees appt={appt} canWrite={canWrite} onChanged={() => onChanged && onChanged()} />}
              {err && <p className="text-red-600 text-xs">{err}</p>}
              {active && !cancelOpen && (
                <div className="flex flex-wrap gap-2 mt-2">
                  {canWrite && !appt.encounterUuid && appt.clientId && onDocument &&
                    <button className="btn gold !py-1.5" onClick={() => onDocument(appt)}><i className="ti ti-stethoscope" />Document Visit</button>}
                  {canWrite && onReschedule && <button className="btn ghost !py-1.5" onClick={() => onReschedule(appt)}><i className="ti ti-calendar-time" />Reschedule</button>}
                  {canWrite && <button className="btn ghost !py-1.5" onClick={() => setCancelOpen(true)}><i className="ti ti-calendar-cancel" />Cancel…</button>}
                  {canWrite && ['needs_documentation', 'scheduled'].includes(appt.state) &&
                    <button className="btn ghost !py-1.5" disabled={busy === 'noshow'} onClick={() => run('noshow', () => api.markNoShow(appt.eid))}>
                      <i className="ti ti-user-x" />{busy === 'noshow' ? '…' : 'No-show'}</button>}
                  {appt.clientId && onOpenChart &&
                    <button className="btn ghost !py-1.5" onClick={() => onOpenChart(appt.clientId)}><i className="ti ti-folder-open" />Open Chart</button>}
                </div>
              )}
              {cancelOpen && (
                <div className="mt-2 grid gap-2">
                  <Field label="Cancellation reason (required — kept on the calendar entry)">
                    <textarea className="inp" rows={2} value={reason} onChange={e => setReason(e.target.value)} />
                  </Field>
                  <div className="flex gap-2 justify-end">
                    <button className="btn ghost !py-1.5" onClick={() => setCancelOpen(false)}>Back</button>
                    <button className="btn !py-1.5" disabled={!reason.trim() || busy === 'cancel'}
                      onClick={() => run('cancel', () => api.cancelAppointment(appt.eid, reason.trim()))}>
                      {busy === 'cancel' ? 'Cancelling…' : 'Cancel Visit'}
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    // Greedy lane assignment so overlapping blocks (e.g. an active row next to
    // a cancelled tombstone in the same slot) render side by side.
    const laneify = (appts) => {
      const sorted = [...appts].sort((a, b) => timeMins(a.startTime) - timeMins(b.startTime));
      const laneEnds = [];
      const out = sorted.map(a => {
        const start = timeMins(a.startTime); const end = timeMins(a.endTime || a.startTime) || start + 30;
        let lane = laneEnds.findIndex(e => e <= start);
        if (lane === -1) { lane = laneEnds.length; laneEnds.push(end); } else laneEnds[lane] = end;
        return { ...a, _lane: lane };
      });
      const lanes = Math.max(1, laneEnds.length);
      return out.map(a => ({ ...a, _lanes: lanes }));
    };

    const GRID_START = 7 * 60, GRID_END = 19 * 60, PX_PER_MIN = 0.8;

    const DayColumn = ({ ymd, appts, onPick, googleEvents }) => {
      const dayAppts = laneify(appts.filter(a => a.date === ymd));
      const hours = []; for (let h = 7; h < 19; h++) hours.push(h);
      // Owner, 2026-11-05: what somebody put on the clinical calendar by hand
      // belongs on this screen too. Drawn in a plain grey band, NOT as an
      // appointment: it has no OpenEMR row, so nothing can be documented,
      // rescheduled or cancelled from it. An all-day block has no hour and is
      // pinned to the top rather than given one.
      const gEvents = (googleEvents || []).filter(e => e.date === ymd);
      return (
        <div className="flex-1 min-w-[130px] border-l border-stone-200 relative" style={{ height: (GRID_END - GRID_START) * PX_PER_MIN }}>
          {hours.map(h => (
            <div key={h} className="absolute w-full border-t border-stone-100 text-[9px] text-stone-300 pl-1"
              style={{ top: (h * 60 - GRID_START) * PX_PER_MIN }}>{((h + 11) % 12) + 1}{h >= 12 ? 'p' : 'a'}</div>
          ))}
          {gEvents.map(e => {
            const top = e.allDay ? 0 : Math.max(0, (timeMins(e.startTime) - GRID_START) * PX_PER_MIN);
            const mins = (e.allDay || !e.endTime) ? 30 : Math.max(15, timeMins(e.endTime) - timeMins(e.startTime));
            return (
              <div key={`g:${e.eventId}`} title={`${e.title}${e.organizer ? ` · ${e.organizer}` : ''} — added in Google Calendar, read-only here`}
                className="absolute left-0.5 right-0.5 rounded-md border border-dashed border-stone-300 bg-stone-50 px-1 py-0.5 overflow-hidden"
                style={{ top, height: Math.max(18, mins * PX_PER_MIN) }}>
                <div className="text-[10px] font-semibold text-stone-600 truncate">{e.title}</div>
                <div className="text-[9px] text-stone-400 truncate">
                  {e.allDay ? 'All day' : fmt12h(e.startTime)} · In Google
                </div>
              </div>
            );
          })}
          {dayAppts.map(a => {
            const top = Math.max(0, (timeMins(a.startTime) - GRID_START) * PX_PER_MIN);
            const height = Math.max(18, (Math.max(15, a.durationMinutes || 30)) * PX_PER_MIN);
            const cancelled = a.state === 'cancelled';
            const colors = cancelled ? 'bg-stone-100 border-stone-300 text-stone-400'
              : a.state === 'documented' ? 'bg-emerald-50 border-emerald-500 text-emerald-900'
              : a.state === 'no_show' ? 'bg-red-50 border-red-400 text-red-800'
              : a.state === 'needs_documentation' ? 'bg-amber-50 border-amber-500 text-amber-900'
              : 'bg-primary-50 border-primary text-primary-700';
            return (
              <div key={a.eid}
                className={`absolute rounded-md border-l-4 px-1.5 py-0.5 text-[10.5px] leading-tight cursor-pointer overflow-hidden ${colors}`}
                style={{ top, height, left: `${(a._lane / a._lanes) * 100}%`, width: `${100 / a._lanes}%` }}
                onClick={() => onPick(a)} title={`${a.title} — ${a.patientName || ''}`}>
                <div className={`font-bold truncate ${cancelled ? 'line-through' : ''}`}>{fmt12h(a.startTime)} {a.patientName || a.title}</div>
                <div className="truncate">{a.title}{a.location === 'telehealth' ? ' · 📹' : ''}</div>
              </div>
            );
          })}
        </div>
      );
    };

    // A clinician's availability (owner, 2026-11-08): the caregiver availability
    // form, mounted from the shared component, saving to the same records.
    // Booking a visit outside it warns and asks for a reason.
    const MyAvailability = () => {
      const [open, setOpen] = useState(false);
      useEffect(() => {
        const lib = window.GFCCaregiverSchedule;
        if (!open || !lib) return undefined;
        lib.mount('clinical-my-availability', { authToken: getToken(), onlyTabs: ['availability'] });
        return () => lib.unmount('clinical-my-availability');
      }, [open]);
      return (
        <div className="card mt-4">
          <div className="card-h"><h2>My Availability</h2>
            <button className="btn ghost sm" onClick={() => setOpen(!open)}>{open ? 'Close' : 'Update Availability'}</button>
          </div>
          <div className="px-4 pb-4 text-sm text-stone-600">When you can see patients. Booking a visit outside it asks for a reason.</div>
          {open && <div className="px-4 pb-4"><div id="clinical-my-availability" /></div>}
        </div>
      );
    };

    const ScheduleView = ({ user, patients, onOpenChart, onDocument }) => {
      const canWrite = useCanDocument();
      const [providersData, setProvidersData] = useState(null);
      // A week of seven columns does not fit a phone; a phone opens on the day.
      const [mode, setMode] = useState(() => {
        try { return window.matchMedia('(min-width: 768px)').matches ? 'week' : 'day'; } catch { return 'week'; }
      });
      const [anchor, setAnchor] = useState(todayYmd());
      const [providerFilter, setProviderFilter] = useState('');
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      const [picked, setPicked] = useState(null);
      const [modal, setModal] = useState(null); // {mode, appt?}

      useEffect(() => { api.providers().then(setProvidersData).catch(e => setErr({ message: e.message, code: e.data && e.data.code })); }, []);
      const from = mode === 'day' ? anchor : mondayOf(anchor);
      const to = mode === 'day' ? anchor : addDaysYmd(mondayOf(anchor), 6);
      const load = useCallback(() => {
        const params = { from, to };
        if (providerFilter) params.providerId = providerFilter;
        api.appointments(params).then(r => { setData(r); setErr(null); })
          .catch(e => { setData(null); setErr({ message: e.message, code: e.data && e.data.code }); });
      }, [from, to, providerFilter]);
      useEffect(load, [load]);

      const days = mode === 'day' ? [anchor] : [0, 1, 2, 3, 4, 5, 6].map(i => addDaysYmd(from, i));
      const appts = (data && data.appointments) || [];
      const gEvents = (data && data.googleEvents) || [];
      const gCal = (data && data.googleCalendar) || null;
      const changed = () => { setPicked(null); setModal(null); load(); };
      const allCalendars = !!(providersData && providersData.canPickProvider);

      if (err && err.code === 'PROVIDER_NOT_MAPPED') {
        return (
          <div className="p-6 lg:p-10 max-w-xl mx-auto">
            <div className="card p-6 text-center">
              <i className="ti ti-calendar-question text-4xl text-accent" />
              <h2 className="serif text-xl text-primary font-semibold mt-2">Calendar not connected yet</h2>
              <p className="text-sm text-stone-500 mt-2">{err.message}</p>
            </div>
          </div>
        );
      }
      return (
        <div className="p-4 lg:p-7">
          <div className="flex flex-wrap items-center gap-2 mb-4">
            <div className="flex bg-white border border-stone-200 rounded-xl p-1">
              {[['day', 'Day'], ['week', 'Week']].map(([k, l]) => (
                <button key={k} className={`px-4 py-1.5 rounded-lg text-[13px] font-semibold ${mode === k ? 'bg-[#F6EFE2] text-[#8a6a2c]' : 'text-stone-500'}`} onClick={() => setMode(k)}>{l}</button>
              ))}
            </div>
            <div className="inline-flex items-center bg-white border border-stone-200 rounded-xl shadow-sm">
              <button className="px-2.5 py-2 text-primary" aria-label="Previous" onClick={() => setAnchor(addDaysYmd(anchor, mode === 'day' ? -1 : -7))}><i className="ti ti-chevron-left" /></button>
              <button className="px-3 py-2 text-[13px] font-semibold text-primary border-x border-stone-200" onClick={() => setAnchor(todayYmd())}>Today</button>
              <button className="px-2.5 py-2 text-primary" aria-label="Next" onClick={() => setAnchor(addDaysYmd(anchor, mode === 'day' ? 1 : 7))}><i className="ti ti-chevron-right" /></button>
            </div>
            <div className="serif text-[22px] text-primary font-semibold">
              {mode === 'day' ? fmtDayLabel(anchor) : `${fmtDayLabel(from)} – ${fmtDayLabel(to)}`}
            </div>
            <div className="ml-auto flex items-center gap-2">
              {allCalendars && (
                <select className="inp !w-auto text-xs" value={providerFilter} onChange={e => setProviderFilter(e.target.value)}>
                  <option value="">All providers</option>
                  {(providersData.providers || []).map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
              )}
              {!allCalendars && providersData && (
                <span className="chip bg-primary-50 text-primary">
                  {(providersData.providers || []).filter(p => p.id === providersData.myProviderId).map(p => p.name)[0] || 'My calendar'}
                </span>
              )}
              {canWrite && <button className="btn gold" onClick={() => setModal({ mode: 'create' })}><i className="ti ti-calendar-plus" />New Appointment</button>}
            </div>
          </div>

          {providersData && providersData.degraded && (
            <p className="text-[12px] text-amber-700 mb-2"><i className="ti ti-alert-triangle mr-1" />{providersData.notice}</p>
          )}
          {err && <p className="text-red-600 text-sm mb-3">{err.message}</p>}
          {/* ⚠️ An unreachable Google calendar and a clear one look identical
              on screen and are opposite facts, so the failure is said. */}
          {gCal && gCal.ok === false && (
            <p className="text-[12px] text-amber-700 mb-2">
              <i className="ti ti-alert-triangle mr-1" />
              The Google clinical calendar could not be read, so anything added there is missing from this view. ({gCal.reason})
            </p>
          )}
          {!err && data === null && <p className="text-sm text-stone-500">Loading calendar from OpenEMR…</p>}
          {data !== null && (
            <div className="card overflow-x-auto">
              <div className="flex border-b border-stone-200 bg-[#FCFAF6] sticky top-0">
                <div className="w-0" />
                {days.map(d => (
                  <div key={d} className="flex-1 min-w-[130px] text-center py-2.5">
                    <span className={`inline-block px-3 py-1 rounded-full text-[12.5px] font-semibold ${d === todayYmd() ? 'bg-[#A9853A] text-white' : 'text-primary'}`}>{fmtDayLabel(d)}</span>
                  </div>
                ))}
              </div>
              <div className="flex">
                {days.map(d => <DayColumn key={d} ymd={d} appts={appts} onPick={setPicked} googleEvents={gEvents} />)}
              </div>
              {appts.length === 0 && gEvents.length === 0 && (
                <div className="text-center py-8 border-t border-stone-100">
                  <i className="ti ti-calendar-smile text-3xl text-accent" />
                  <p className="text-sm text-stone-500 mt-1">No appointments {mode === 'day' ? 'this day' : 'this week'}{providerFilter ? ' for this provider' : ''}.</p>
                  <p className="text-xs text-stone-400">Book one with New Appointment. It goes straight onto the OpenEMR calendar.</p>
                </div>
              )}
              {appts.length === 0 && gEvents.length > 0 && (
                /* "No appointments" would be false with events on the day. */
                <p className="text-center text-xs text-stone-400 py-3 border-t border-stone-100">
                  No OpenEMR appointments {mode === 'day' ? 'this day' : 'this week'} — the entries above were added in Google Calendar.
                </p>
              )}
            </div>
          )}

          {picked && (
            <AppointmentDetail appt={picked} providers={providersData && providersData.providers}
              onClose={() => setPicked(null)} onChanged={changed}
              onOpenChart={onOpenChart}
              onReschedule={(a) => { setPicked(null); setModal({ mode: 'reschedule', appt: a }); }}
              onDocument={(a) => { setPicked(null); onDocument(a); }} />
          )}
          {modal && (
            <AppointmentModal mode={modal.mode} appt={modal.appt} patients={patients}
              providersData={providersData} defaultDate={anchor}
              defaultProviderId={providerFilter || (providersData && providersData.myProviderId)}
              onClose={() => setModal(null)} onSaved={changed} />
          )}
        </div>
      );
    };

    // Chart tab: this patient's upcoming + past appointments with
    // documented / no-show / not-yet-documented state (Scope B).
    const ApptsTab = ({ patient, patients, chart, onDocumentHp, onEncounterCreated, onNewVisit }) => {
      const canWrite = useCanDocument();
      const [data, setData] = useState(null);
      const [err, setErr] = useState('');
      const [providersData, setProvidersData] = useState(null);
      const [picked, setPicked] = useState(null);
      const [modal, setModal] = useState(null);
      // Attaching a note written for an unscheduled visit to an appointment
      // booked afterwards — instead of "Document", which would make a second
      // encounter for the same visit.
      const [attaching, setAttaching] = useState(null);
      const [attachable, setAttachable] = useState(null);
      const [attachErr, setAttachErr] = useState('');
      const load = useCallback(() => {
        api.patientAppointments(patient.id).then(r => { setData(r); setErr(''); }).catch(e => setErr(e.message));
      }, [patient.id]);
      const startAttach = (a) => {
        setAttaching(a); setAttachable(null); setAttachErr('');
        api.encounters(patient.id)
          .then(r => setAttachable((r.encounters || []).filter(e => !e.appointmentEid && e.noteStatus === 'draft')))
          .catch(e => setAttachErr(e.message));
      };
      const attach = (e) => {
        setAttachErr('');
        api.attachNote(patient.id, e.id, attaching.eid)
          .then(() => { setAttaching(null); load(); onEncounterCreated && onEncounterCreated(e.id); })
          .catch(x => setAttachErr(x.message));
      };
      useEffect(load, [load]);
      useEffect(() => { api.providers().then(setProvidersData).catch(() => {}); }, []);
      if (err) return <p className="text-red-600 text-sm p-4">{err}</p>;
      if (!data) return <p className="text-sm text-stone-500 p-4">Loading appointments from OpenEMR…</p>;
      const today = todayYmd();
      const upcoming = data.appointments.filter(a => a.date >= today && a.state === 'scheduled');
      const past = data.appointments.filter(a => !(a.date >= today && a.state === 'scheduled')).reverse();
      const changed = () => { setPicked(null); setModal(null); load(); };
      // Every visit is documented on the one visit screen; the visit type
      // chosen there decides H&P or follow-up (owner, 2026-11-04).
      const documentFrom = (a) => onDocumentHp(a.eid);
      const Row = ({ a }) => (
        <div className="flex flex-wrap items-center justify-between gap-2 py-2.5 border-b border-stone-100 last:border-0">
          <div className="cursor-pointer" onClick={() => setPicked(a)}>
            <div className={`font-semibold text-[13px] ${a.state === 'cancelled' ? 'line-through text-stone-400' : ''}`}>
              {fmtDayLabel(a.date)} · {fmt12h(a.startTime)}–{fmt12h(a.endTime)} — {a.title}
            </div>
            <div className="text-xs text-stone-500">{LOCATION_LABELS[a.location] || 'Home visit'}{a.notes ? ` · ${a.notes.slice(0, 60)}` : ''}</div>
          </div>
          <div className="flex items-center gap-1.5">
            <StateChip state={a.state} />
            {canWrite && !a.encounterUuid && a.state === 'needs_documentation' &&
              <button className="btn ghost !py-1 !px-2.5 text-xs" onClick={() => startAttach(a)}><i className="ti ti-link" />Attach Note</button>}
            {canWrite && !a.encounterUuid && a.state !== 'cancelled' && a.state !== 'no_show' &&
              <button className="btn gold !py-1 !px-2.5 text-xs" onClick={() => documentFrom(a)}>Document</button>}
          </div>
        </div>
      );
      return (
        <div className="max-w-3xl mx-auto">
          {!data.linked && (
            <div className="card p-5 text-center">
              <i className="ti ti-calendar-off text-3xl text-accent" />
              <p className="text-sm text-stone-500 mt-1">Link this patient to OpenEMR to schedule clinical visits.</p>
            </div>
          )}
          {data.linked && (
            <div>
              <div className="card mb-4">
                <div className="card-h"><h2>Upcoming</h2>
                  {canWrite && <button className="btn gold !py-1.5" onClick={() => setModal({ mode: 'create' })}><i className="ti ti-calendar-plus" />New Appointment</button>}
                </div>
                <div className="p-4">
                  {upcoming.length === 0 && <p className="text-sm text-stone-400">Nothing scheduled. Book the next visit — it goes straight onto the OpenEMR calendar.</p>}
                  {upcoming.map(a => <Row key={a.eid} a={a} />)}
                </div>
              </div>
              <div className="card">
                <div className="card-h"><h2>Past Appointments</h2></div>
                <div className="p-4">
                  {past.length === 0 && <p className="text-sm text-stone-400">No appointment history yet.</p>}
                  {past.map(a => <Row key={a.eid} a={a} />)}
                </div>
              </div>
            </div>
          )}
          {picked && (
            <AppointmentDetail appt={{ ...picked, clientId: patient.id }} providers={providersData && providersData.providers}
              onClose={() => setPicked(null)} onChanged={changed}
              onReschedule={(a) => { setPicked(null); setModal({ mode: 'reschedule', appt: a }); }}
              onDocument={(a) => { setPicked(null); documentFrom(a); }} />
          )}
          {modal && (
            <AppointmentModal mode={modal.mode} appt={modal.appt}
              patients={(patients || []).filter(p => p.id === patient.id)}
              providersData={providersData} defaultDate={todayYmd()}
              defaultProviderId={providersData && providersData.myProviderId}
              onClose={() => setModal(null)} onSaved={changed} />
          )}
          {attaching && (
            <div className="fixed inset-0 bg-black/40 z-40 flex items-start justify-center p-4 overflow-y-auto" onClick={() => setAttaching(null)}>
              <div className="card w-full max-w-lg mt-10" onClick={e => e.stopPropagation()}>
                <div className="card-h"><h2>Attach an Existing Note</h2><button className="text-stone-400" onClick={() => setAttaching(null)}><i className="ti ti-x" /></button></div>
                <div className="p-4 grid gap-2 text-sm">
                  <p className="text-xs text-stone-500">To the appointment on <b>{fmtDayLabel(attaching.date)} {fmt12h(attaching.startTime)}</b>. Pick the note written for this visit. Only unsigned notes not already attached are listed.</p>
                  {attachErr && <p className="text-xs text-red-600">{attachErr}</p>}
                  {!attachable && !attachErr && <p className="text-xs text-stone-500">Loading this patient's notes…</p>}
                  {attachable && attachable.length === 0 && <p className="text-xs text-stone-500">No unsigned, unattached note on this chart. A signed note cannot be attached.</p>}
                  {(attachable || []).map(e => (
                    <button key={e.id} className="text-left border border-stone-200 rounded-lg px-3 py-2 hover:bg-cream text-xs" onClick={() => attach(e)}>
                      <b>{fmtDate(e.start)}</b> — {e.reason || e.type || 'Visit'}{e.visitLabel ? ` · ${e.visitLabel}` : ''}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ── Session 4.4 — Clinical completeness P0 ──
    // Coding · orders · prescriptions · sign-and-close · note→billing route.
    // OpenEMR 7.0.4 has no write API for any of these (preflight 2026-09-04),
    // so the app keeps the records and mirrors them into a GFC structured note
    // on the encounter (spec §2.4 interim). Guardrail for the coding assist:
    // the system proposes, the clinician disposes — nothing lands on a record
    // without a click, nothing auto-submits.

    const ENC_STATE_META = {
      not_coded: { label: 'Not coded', chip: 'bg-amber-50 text-amber-800' },
      coded: { label: 'Coded', chip: 'bg-primary-50 text-primary' },
      signed: { label: 'Signed & closed', chip: 'bg-emerald-50 text-emerald-700' }
    };
    // ── The encounter, one step per screen (4.12 F3 on a phone; every width
    // since 2026-11-04) ──
    // On one scroll the encounter was fifteen cards deep on a laptop.
    //
    // THE STEPS ARE THE CARDS THAT ALREADY EXIST. Nothing new is modelled: a
    // second idea of "what an encounter consists of" would be a second thing
    // to keep in step with the record.
    //
    // STEPPING IS DISPLAY ONLY, AND NO STEP GATES ANOTHER. A clinician in a
    // home who has to record an order before finishing coding must be able
    // to. The only gate is the signature's own readiness, which the SERVER
    // answers and which was already there. The panel is the SAME mounted
    // component on every step, so nothing typed on one is lost by moving.
    const ENCOUNTER_STEPS = [
      { key: 'visit', label: 'Visit', icon: 'ti-clipboard-text' },
      { key: 'coding', label: 'Coding', icon: 'ti-code' },
      { key: 'actions', label: 'Orders & Rx', icon: 'ti-flask' },
      { key: 'sign', label: 'Sign', icon: 'ti-writing-sign' }
    ];
    // Which screen a blocker is fixed on. The LIST of blockers is the
    // server's and is never re-derived here; this only decides where to put
    // each one. An unrecognised blocker lands on Sign, where the server's full
    // message is printed in words — a blocker that maps to no step would
    // simply disappear, which is the worst of the three possible answers.
    const STEP_FOR_BLOCKER = { note: 'visit', diagnosis: 'coding', service: 'coding', service_dx_link: 'coding' };
    const stepForBlocker = (m) => STEP_FOR_BLOCKER[m] || 'sign';

    const EncounterStepRail = ({ step, onStep, blockers, closed }) => {
      const byStep = {};
      for (const m of blockers || []) { const k = stepForBlocker(m); byStep[k] = (byStep[k] || 0) + 1; }
      const i = Math.max(0, ENCOUNTER_STEPS.findIndex(s => s.key === step));
      return (
        <div className="mb-3">
          <div className="flex gap-1.5">
            {ENCOUNTER_STEPS.map(s => {
              const on = s.key === step;
              const n = byStep[s.key] || 0;
              return (
                <button key={s.key} data-step={s.key} onClick={() => onStep(s.key)}
                  className={`flex-1 rounded-lg border px-1 py-1.5 text-[11px] leading-tight ${on ? 'bg-primary text-white border-primary' : 'bg-white border-stone-200 text-stone-600'}`}>
                  <i className={`ti ${s.icon} block text-sm`} />
                  {s.label}
                  {/* Counted from the SERVER's blocker list. A tick the server
                      would refuse is worse than no tick at all. */}
                  {!closed && n > 0 && <span className={`block text-[10px] ${on ? 'text-white' : 'text-amber-700'}`}>{n} to do</span>}
                  {!closed && n === 0 && <span className={`block text-[10px] ${on ? 'text-white/70' : 'text-emerald-700'}`}>done</span>}
                </button>
              );
            })}
          </div>
          <div className="flex justify-between mt-2">
            <button className="btn ghost !py-1 !px-2.5 text-xs" disabled={i === 0} onClick={() => onStep(ENCOUNTER_STEPS[i - 1].key)}>
              <i className="ti ti-chevron-left" />Back
            </button>
            <button className="btn ghost !py-1 !px-2.5 text-xs" disabled={i === ENCOUNTER_STEPS.length - 1} onClick={() => onStep(ENCOUNTER_STEPS[i + 1].key)}>
              Next<i className="ti ti-chevron-right" />
            </button>
          </div>
        </div>
      );
    };

    const EncStateChip = ({ state }) => {
      const m = ENC_STATE_META[state] || ENC_STATE_META.not_coded;
      return <span className={`chip ${m.chip}`}>{m.label}</span>;
    };
    // Encounter diagnoses editor (+ T1 carry-forward candidates as proposals).
    const DxEditor = ({ diagnoses, setDiagnoses, candidates, clientId, readOnly, addToProblemList, setAddToProblemList }) => {
      // The problem list is an RN's or a provider's to write, and an LCSW's for
      // a mental health (F) diagnosis (owner, 2026-10-12). Server-enforced per
      // code; this only decides where the box is drawn.
      const canWriteAllProblems = useCan('problemListWrite');
      const canWriteBhDx = useCan('behavioralDiagnosis');
      const canWriteProblemFor = (code) => canWriteAllProblems || (canWriteBhDx && /^F\d{2}/.test(String(code || '').toUpperCase()));
      const has = (code) => diagnoses.some(d => d.code === code);
      const add = (r) => { if (!has(r.code)) setDiagnoses([...diagnoses, { code: r.code, description: r.description || '', source: r.source === 'typed' ? 'manual' : r.source, problemUuid: r.problemUuid || null, primary: diagnoses.length === 0 }]); };
      const remove = (code) => setDiagnoses(diagnoses.filter(d => d.code !== code).map((d, i, a) => ({ ...d, primary: a.some(x => x.primary) ? d.primary : i === 0 })));
      const setPrimary = (code) => setDiagnoses(diagnoses.map(d => ({ ...d, primary: d.code === code })));
      const pending = (candidates || []).filter(c => c.code && !has(c.code));
      // A problem already coded on THIS note is coded, whatever the problem-list
      // read says; only a problem nobody has coded anywhere is worth flagging.
      const onNote = new Set(diagnoses.map(d => d.problemUuid).filter(Boolean));
      const uncoded = (candidates || []).filter(c => !c.code && !(c.problemUuid && onNote.has(c.problemUuid)));
      const uncodedNames = uncoded.slice(0, 4).map(u => u.description).join(', ') + (uncoded.length > 4 ? ` and ${uncoded.length - 4} more` : '');
      return (
        <div className="grid gap-2">
          {diagnoses.length === 0 && <p className="text-xs text-stone-400">No diagnoses on this encounter yet.</p>}
          {diagnoses.map(d => (
            <div key={d.code} className="flex flex-wrap items-center justify-between gap-2 py-1.5 border-b border-stone-100">
              <div className="text-[13px]"><b className="font-mono">{d.code}</b> {d.description || <span className="text-stone-400">(description from OpenEMR on read-back)</span>}
                <span className="ml-1"><SourceChip source={d.source} /></span>
                {d.primary && <span className="chip bg-accent text-primary ml-1">PRIMARY</span>}
              </div>
              {!readOnly && (
                <div className="flex items-center gap-2 text-xs">
                  {!d.primary && <button type="button" className="text-primary underline" onClick={() => setPrimary(d.code)}>Make Primary</button>}
                  {/* A code picked from OpenEMR's own search arrives as 'openemr', and it
                      is just as absent from the problem list as one typed in. */}
                  {(d.source === 'manual' || d.source === 'openemr') && setAddToProblemList && canWriteProblemFor(d.code) && (
                    <label className="flex items-center gap-1 text-stone-500">
                      <input type="checkbox" checked={(addToProblemList || []).includes(d.code)}
                        onChange={e => setAddToProblemList(e.target.checked ? [...(addToProblemList || []), d.code] : (addToProblemList || []).filter(c => c !== d.code))} />
                      add to problem list
                    </label>
                  )}
                  <button type="button" className="text-red-600" onClick={() => remove(d.code)}><i className="ti ti-x" /></button>
                </div>
              )}
            </div>
          ))}
          {!readOnly && pending.length > 0 && (
            <div className="prefill rounded-lg p-2">
              <div className="prefill-badge mb-1"><i className="ti ti-bulb" /> FROM THE OPENEMR PROBLEM LIST — proposed, tap to include</div>
              <div className="flex flex-wrap gap-1.5">
                {pending.map(c => (
                  <button key={c.code} type="button" className="chip border bg-white text-primary border-stone-200" onClick={() => add(c)}>
                    + {c.code} {c.description}
                  </button>
                ))}
              </div>
            </div>
          )}
          {!readOnly && uncoded.length > 0 && (
            <p className="text-[11px] text-amber-700"><i className="ti ti-alert-triangle mr-1" />
              {uncoded.length} problem{uncoded.length > 1 ? 's' : ''} on the OpenEMR list ha{uncoded.length > 1 ? 've' : 's'} no ICD-10 code ({uncodedNames}) — code {uncoded.length > 1 ? 'them' : 'it'} below to bill against {uncoded.length > 1 ? 'them' : 'it'}.
            </p>
          )}
          {!readOnly && <CodePicker set="ICD10" clientId={clientId} exclude={diagnoses.map(d => d.code)} onPick={add} />}
        </div>
      );
    };

    // Follow-up visit (Scope A): short SOAP + vitals + T1 diagnoses + quick
    // service pick → Encounter + narrative note + GFC structured note.
    // Module scope, same reason as VitalInput above: nested inside the modal
    // it was a new component every keystroke, so the field took one character
    // and then lost the caret.
    const FollowUpVital = ({ k, label, f, setV }) => (
      <Field label={label}><input className="inp" value={(f.vitals || {})[k] || ''} onChange={e => setV(k, e.target.value)} /></Field>
    );
    const RxForm = ({ routes, onSave, busy, schedules, scheduleLabels, prescriber, kinds, kindLabels }) => {
      // ── Session 4.10 ── THE SCHEDULE HAS NO DEFAULT. The clinician chooses,
      // because the whole control is that a person declared it — a pre-selected
      // "not a controlled substance" is a declaration nobody made.
      const [f, setF] = useState({ kind: 'new', drug: '', dose: '', route: 'oral', frequency: '', quantity: '', refills: '0', date: todayYmd(), instructions: '', schedule: '', pdmp: { checked: false, checkedOn: todayYmd() } });
      const p = prescriber || {};
      const controlled = f.schedule && f.schedule !== 'non_controlled';
      // A Georgia NP or PA may not prescribe Schedule II. The SERVER refuses it;
      // this says so before the click, so the answer is "route it to the
      // collaborating physician" rather than a 403 with nothing to do about it.
      const scheduleTwoBlocked = f.schedule === 'CII' && p.scheduleIIProhibited;
      const deaMissing = controlled && !p.deaOnFile;
      const deaUncovered = controlled && p.deaOnFile && (p.deaSchedules || []).length > 0 && !(p.deaSchedules || []).includes(f.schedule);
      return (
        <div className="grid gap-2 border-t border-stone-100 pt-3">
          {!p.prescriberCredential && (
            <p className="text-[11px] text-amber-800">
              Your prescriber credential (MD, DO, NP or PA) is not on file, so a prescription cannot be recorded.
              Georgia's scope rules differ by credential, so nothing is inferred — an admin sets it on your user record.
            </p>
          )}
          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2">
            <Field label="Type"><select className="inp" value={f.kind} onChange={e => setF({ ...f, kind: e.target.value })}>{(kinds || ['new', 'refill']).map(k => <option key={k} value={k}>{(kindLabels && kindLabels[k]) || k}</option>)}</select></Field>
            <Field label="Drug" className="sm:col-span-2"><input className="inp" value={f.drug} onChange={e => setF({ ...f, drug: e.target.value })} /></Field>
            <Field label="Dose"><input className="inp" placeholder="500 mg" value={f.dose} onChange={e => setF({ ...f, dose: e.target.value })} /></Field>
            <Field label="Route"><select className="inp" value={f.route} onChange={e => setF({ ...f, route: e.target.value })}>{(routes || ['oral']).map(r => <option key={r} value={r}>{r}</option>)}</select></Field>
            <Field label="Frequency"><input className="inp" placeholder="BID" value={f.frequency} onChange={e => setF({ ...f, frequency: e.target.value })} /></Field>
            <Field label="Quantity"><input className="inp" inputMode="numeric" value={f.quantity} onChange={e => setF({ ...f, quantity: e.target.value.replace(/\D/g, '') })} /></Field>
            <Field label="Refills"><input className="inp" inputMode="numeric" value={f.refills} onChange={e => setF({ ...f, refills: e.target.value.replace(/\D/g, '') })} /></Field>
            <Field label="Date"><input className="inp" type="date" value={f.date} onChange={e => setF({ ...f, date: e.target.value })} /></Field>
            <Field label="Instructions" className="sm:col-span-2 md:col-span-3"><input className="inp" value={f.instructions} onChange={e => setF({ ...f, instructions: e.target.value })} /></Field>
            <Field label="Schedule">
              <select className="inp" value={f.schedule} onChange={e => setF({ ...f, schedule: e.target.value })}>
                <option value="">Choose…</option>
                {(schedules || []).map(sc => <option key={sc} value={sc}>{(scheduleLabels && scheduleLabels[sc]) || sc}</option>)}
              </select>
            </Field>
          </div>
          {scheduleTwoBlocked && (
            <p className="text-[11px] text-red-700">
              A Georgia {p.prescriberCredential} may not prescribe a Schedule I or II substance. Route this to the
              collaborating physician, who can record it under their own credential.
            </p>
          )}
          {deaMissing && <p className="text-[11px] text-amber-800">A controlled prescription needs a DEA registration on file. An admin records it on your user record.</p>}
          {deaUncovered && <p className="text-[11px] text-amber-800">Your DEA registration covers {(p.deaSchedules || []).join(', ')} — it does not cover {f.schedule}.</p>}
          {controlled && !scheduleTwoBlocked && (
            <div className="grid gap-2 p-2.5 rounded border border-stone-200 bg-stone-50">
              <label className="flex items-start gap-2 text-xs">
                <input type="checkbox" className="mt-0.5" checked={!!f.pdmp.checked} onChange={e => setF({ ...f, pdmp: { ...f.pdmp, checked: e.target.checked } })} />
                <span>I checked the Georgia PDMP before writing this prescription.</span>
              </label>
              {f.pdmp.checked && <Field label="Date checked"><input className="inp" type="date" value={f.pdmp.checkedOn} onChange={e => setF({ ...f, pdmp: { ...f.pdmp, checkedOn: e.target.value } })} /></Field>}
            </div>
          )}
          <div className="flex justify-end">
            <button className="btn !py-1.5"
              disabled={busy || !f.drug || !f.dose || !f.frequency || !f.quantity || !f.schedule || !p.prescriberCredential ||
                scheduleTwoBlocked || deaMissing || deaUncovered || (controlled && !f.pdmp.checked)}
              onClick={() => onSave(f)}>{busy ? 'Recording…' : 'Record Prescription'}</button>
          </div>
          <p className="text-[10.5px] text-stone-400">
            The schedule is yours to declare. The server checks it against the drug name as a backstop and refuses a
            declaration that contradicts a term it is confident about — it is not a formulary and never will be.
          </p>
        </div>
      );
    };

    // ── Session 4.10: a referral and a DME order carry a PAYLOAD, not tests ──
    // Two separate sub-forms rather than one form that grows conditional
    // branches: the SWO's six elements and a referral's clinical question have
    // nothing in common, and a shared form would read as if they did.
    //
    // The fax fields are ten digits. The SERVER is the control — a mistyped fax
    // number is a misdirected PHI disclosure, so it validates there — but the
    // form says so before the click rather than after a 400.
    const faxOk = (v) => /^\d{10}$/.test(String(v || '').replace(/\D/g, ''));

    // ── Refer to (owner, 2026-10-12) ──────────────────────────────────────
    // One list: our own clinical team first, then every outside provider GFC
    // has referred to, then "New provider". WHO may be offered is the server's
    // answer (referral-targets): a colleague must be an active licensed team
    // member, and whether this viewer may refer out at all is its call too.
    const faxDigits = (v) => String(v || '').replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '');
    const fmtFax = (v) => { const d = faxDigits(v); return d.length === 10 ? `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}` : String(v || ''); };
    const BLANK_EXTERNAL = { receivingPractice: '', receivingProvider: '', receivingFax: '', receivingPhone: '', agencyPending: false };

    // Editing a SAVED provider is its own step. Every referral after this goes
    // where it says, so a new fax needs a reason, and the referrals already
    // placed keep the fax they were sent to.
    const ProviderEditor = ({ provider, onSaved, onClose }) => {
      const [p, setP] = useState({ name: provider.name || '', practice: provider.practice || '', specialty: provider.specialty || '', fax: provider.fax || '', phone: provider.phone || '' });
      const [reason, setReason] = useState('');
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState('');
      const faxChanging = faxOk(p.fax) && faxDigits(p.fax) !== String(provider.fax || '');
      const save = async () => {
        setBusy(true); setErr('');
        try {
          const changed = Object.fromEntries(Object.entries(p).filter(([k, v]) => String(v || '') !== String(provider[k] || '')));
          const r = await api.updateReferralProvider(provider.id, { ...changed, ...(faxChanging ? { changeReason: reason } : {}) });
          onSaved(r.provider);
        } catch (e) { setErr(e.message || 'That did not save.'); }
        finally { setBusy(false); }
      };
      return (
        <div className="grid gap-2 p-2.5 rounded border border-stone-200 bg-stone-50">
          <p className="text-[11px] text-stone-600">This changes the saved provider for every referral from now on. Referrals already placed keep the details they were sent with.</p>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <Field label="Provider"><input className="inp" value={p.name} onChange={e => setP({ ...p, name: e.target.value })} /></Field>
            <Field label="Practice"><input className="inp" value={p.practice} onChange={e => setP({ ...p, practice: e.target.value })} /></Field>
            <Field label="Specialty"><input className="inp" value={p.specialty} onChange={e => setP({ ...p, specialty: e.target.value })} /></Field>
            <Field label="Fax">
              <input className="inp" inputMode="tel" value={p.fax} onChange={e => setP({ ...p, fax: e.target.value })} />
              {p.fax && !faxOk(p.fax) && <p className="text-[11px] text-amber-700 mt-1">Ten digits.</p>}
            </Field>
            <Field label="Phone"><input className="inp" inputMode="tel" value={p.phone} onChange={e => setP({ ...p, phone: e.target.value })} /></Field>
          </div>
          {faxChanging && (
            <Field label="Why is the fax changing? (required)">
              <input className="inp" value={reason} onChange={e => setReason(e.target.value)} placeholder="e.g. The practice confirmed a new referral fax" />
            </Field>
          )}
          {err && <p className="text-[11.5px] text-red-600">{err}</p>}
          <div className="flex justify-end gap-2">
            <button type="button" className="btn ghost !py-1.5" onClick={onClose}>Cancel</button>
            <button type="button" className="btn !py-1.5" disabled={busy || !faxOk(p.fax) || (!p.name.trim() && !p.practice.trim()) || (faxChanging && !reason.trim())} onClick={save}>
              {busy ? 'Saving…' : 'Save Provider'}
            </button>
          </div>
        </div>
      );
    };

    const ReferralFields = ({ f, setF, targets, targetsErr, onProviderSaved }) => {
      const [editing, setEditing] = useState(false);
      const team = (targets && targets.canReferInternal && targets.internal) || [];
      const saved = (targets && targets.canReferExternal && targets.external) || [];
      const canExternal = !!(targets && targets.canReferExternal);
      const chosenTeam = f.destination === 'internal' ? team.find(t => String(t.userId) === String(f.assigneeId)) : null;
      const chosenSaved = f.destination === 'external' && f.referralProviderId ? saved.find(e => e.id === f.referralProviderId) : null;
      const isNew = f.referTo === 'new';
      // A typed fax already on the list: offer the saved one rather than a twin.
      const faxTwin = isNew && faxOk(f.receivingFax) ? saved.find(e => e.fax === faxDigits(f.receivingFax)) : null;
      const pickTarget = (value) => {
        if (value.startsWith('team:')) {
          const t = team.find(x => `team:${x.userId}` === value);
          setF({ ...f, ...BLANK_EXTERNAL, referTo: value, destination: 'internal', assigneeId: t ? t.userId : '', referralProviderId: '', saveProvider: false, confirmDistinct: false, priorAuthRequired: false, specialty: t ? t.discipline : '' });
        } else if (value.startsWith('saved:')) {
          const e = saved.find(x => `saved:${x.id}` === value);
          setF({ ...f, referTo: value, destination: 'external', assigneeId: '', referralProviderId: e ? e.id : '', saveProvider: false, confirmDistinct: false,
            specialty: (e && e.specialty) || f.specialty || '', receivingPractice: (e && e.practice) || '', receivingProvider: (e && e.name) || '',
            receivingFax: (e && e.fax) || '', receivingPhone: (e && e.phone) || '', agencyPending: false });
        } else if (value === 'new') {
          setF({ ...f, ...BLANK_EXTERNAL, referTo: 'new', destination: 'external', assigneeId: '', referralProviderId: '', saveProvider: true, confirmDistinct: false, specialty: '' });
        } else {
          setF({ ...f, referTo: '', destination: '', assigneeId: '', referralProviderId: '' });
        }
        setEditing(false);
      };
      return (
        <React.Fragment>
          <Field label="Refer to">
            <select className="inp" value={f.referTo || ''} onChange={e => pickTarget(e.target.value)} disabled={!targets}>
              <option value="">{targets ? 'Choose who this referral is for…' : 'Loading…'}</option>
              {team.length > 0 && (
                <optgroup label="Our care team">
                  {team.map(t => <option key={t.userId} value={`team:${t.userId}`}>{[t.name, t.credential, t.discipline].filter(Boolean).join(' · ')}{t.onCareTeam ? ' (on care team)' : ''}</option>)}
                </optgroup>
              )}
              {saved.length > 0 && (
                <optgroup label="Referred before">
                  {saved.map(e => <option key={e.id} value={`saved:${e.id}`}>{e.label}{e.specialty ? ` · ${e.specialty}` : ''}</option>)}
                </optgroup>
              )}
              {canExternal && <option value="new">+ New Provider</option>}
            </select>
            {targetsErr && <p className="text-[11px] text-red-600 mt-1">{targetsErr}</p>}
            {targets && !canExternal && <p className="text-[11px] text-stone-500 mt-1">You refer within the team. A provider or an LCSW refers to outside practices.</p>}
          </Field>

          {chosenTeam && (
            <React.Fragment>
              <p className="text-[11.5px] text-stone-600 -mt-1">
                Lands in {chosenTeam.name}'s clinical inbox. Nothing is faxed.{' '}
                {chosenTeam.onCareTeam ? 'Already on this patient’s care team.' : 'They will be added to this patient’s care team.'}
              </p>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <Field label="For"><input className="inp" value={f.specialty || ''} onChange={e => setF({ ...f, specialty: e.target.value })} /></Field>
                <Field label="Urgency"><select className="inp" value={f.urgency || 'routine'} onChange={e => setF({ ...f, urgency: e.target.value })}>{['routine', 'urgent', 'stat'].map(u => <option key={u} value={u}>{u}</option>)}</select></Field>
              </div>
              <Field label="Reason for referral"><input className="inp" value={f.reason || ''} onChange={e => setF({ ...f, reason: e.target.value })} /></Field>
              <Field label="What do you need from them?">
                <textarea className="inp" rows={3} value={f.clinicalSummary || ''} onChange={e => setF({ ...f, clinicalSummary: e.target.value })} />
              </Field>
            </React.Fragment>
          )}

          {f.destination === 'external' && (
            <React.Fragment>
              {chosenSaved && !editing && (
                <div className="flex flex-wrap items-center gap-2 text-[11.5px] text-stone-600 -mt-1">
                  <span>Saved fax {chosenSaved.faxFormatted}. A change typed below applies to this referral only.</span>
                  {targets.canEditProviders && <button type="button" className="chip border bg-white text-primary border-stone-200" onClick={() => setEditing(true)}>Edit Saved Provider</button>}
                </div>
              )}
              {chosenSaved && editing && (
                <ProviderEditor provider={chosenSaved} onClose={() => setEditing(false)}
                  onSaved={(p) => { setEditing(false); onProviderSaved(p); setF({ ...f, specialty: p.specialty || f.specialty, receivingPractice: p.practice || '', receivingProvider: p.name || '', receivingFax: p.fax || '', receivingPhone: p.phone || '' }); }} />
              )}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <Field label="Specialty"><input className="inp" value={f.specialty || ''} onChange={e => setF({ ...f, specialty: e.target.value })} /></Field>
                <Field label="Urgency"><select className="inp" value={f.urgency || 'routine'} onChange={e => setF({ ...f, urgency: e.target.value })}>{['routine', 'urgent', 'stat'].map(u => <option key={u} value={u}>{u}</option>)}</select></Field>
                <Field label="Receiving practice"><input className="inp" value={f.receivingPractice || ''} onChange={e => setF({ ...f, receivingPractice: e.target.value })} /></Field>
                <Field label="Receiving provider"><input className="inp" value={f.receivingProvider || ''} onChange={e => setF({ ...f, receivingProvider: e.target.value })} /></Field>
                <Field label="Receiving fax (this is what gets faxed)">
                  <input className="inp" inputMode="tel" value={f.receivingFax || ''} onChange={e => setF({ ...f, receivingFax: e.target.value })} />
                  {f.receivingFax && !faxOk(f.receivingFax) && <p className="text-[11px] text-amber-700 mt-1">Ten digits. A mistyped fax number sends this patient's record to a stranger.</p>}
                  {!f.receivingFax && f.agencyPending && <p className="text-[11px] text-stone-500 mt-1">Left blank on purpose. Nothing can be faxed until the office adds it.</p>}
                </Field>
                <Field label="Receiving phone"><input className="inp" value={f.receivingPhone || ''} onChange={e => setF({ ...f, receivingPhone: e.target.value })} /></Field>
              </div>
              {faxTwin && (
                <div className="flex flex-wrap items-center gap-2 text-[11.5px] text-amber-800">
                  <span>That fax is already saved as {faxTwin.label}.</span>
                  <button type="button" className="chip border bg-white text-primary border-stone-200" onClick={() => pickTarget(`saved:${faxTwin.id}`)}>Use Saved Provider</button>
                </div>
              )}
              {isNew && (
                <label className="flex items-start gap-2 text-xs">
                  <input type="checkbox" className="mt-0.5" checked={!!f.saveProvider} onChange={e => setF({ ...f, saveProvider: e.target.checked })} />
                  <span>Save to the provider list, so the next referral to them is one pick.</span>
                </label>
              )}
              {isNew && f.saveProvider && faxTwin && (
                <label className="flex items-start gap-2 text-xs">
                  <input type="checkbox" className="mt-0.5" checked={!!f.confirmDistinct} onChange={e => setF({ ...f, confirmDistinct: e.target.checked })} />
                  <span>Save as a separate provider anyway (for example, a second doctor at the same practice).</span>
                </label>
              )}
              {isNew && (
                <label className="flex items-start gap-2 text-xs mt-1">
                  <input type="checkbox" className="mt-0.5" checked={!!f.agencyPending} onChange={e => setF({ ...f, agencyPending: e.target.checked })} />
                  <span><b>Agency not confirmed yet.</b> Place the order now and leave the fax blank. It shows as "Needs agency" until the office or social work adds the agency and fax with Update Destination. Nothing can be faxed before then.</span>
                </label>
              )}
              <Field label="Reason for referral"><input className="inp" value={f.reason || ''} onChange={e => setF({ ...f, reason: e.target.value })} /></Field>
              <Field label="Clinical summary — the question you want answered">
                <textarea className="inp" rows={3} value={f.clinicalSummary || ''} onChange={e => setF({ ...f, clinicalSummary: e.target.value })} />
              </Field>
              <label className="flex items-start gap-2 text-xs">
                <input type="checkbox" className="mt-0.5" checked={!!f.priorAuthRequired} onChange={e => setF({ ...f, priorAuthRequired: e.target.checked })} />
                <span>Prior authorization is required. <span className="text-stone-500">Medicare Advantage plans frequently require one; this is how it stops being forgotten.</span></span>
              </label>
              {f.priorAuthRequired && <Field label="Authorization number (if you already have it)"><input className="inp" value={f.priorAuthNumber || ''} onChange={e => setF({ ...f, priorAuthNumber: e.target.value })} /></Field>}
            </React.Fragment>
          )}
        </React.Fragment>
      );
    };

    const DmeFields = ({ f, setF }) => (
      <React.Fragment>
        <Hint>
          CMS Standard Written Order. The beneficiary, the order date, the treating practitioner and the signature come
          from the record and your user account; the four fields below are yours. The requisition is refused if any of the
          six elements is missing.
        </Hint>
        <Field label="Item — narrative, HCPCS, or brand and model"><input className="inp" value={f.itemDescription || ''} onChange={e => setF({ ...f, itemDescription: e.target.value })} /></Field>
        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2">
          <Field label="HCPCS (optional)"><input className="inp" value={f.hcpcsCode || ''} onChange={e => setF({ ...f, hcpcsCode: e.target.value.toUpperCase() })} /></Field>
          <Field label="Quantity"><input className="inp" inputMode="numeric" value={f.quantity || ''} onChange={e => setF({ ...f, quantity: e.target.value.replace(/\D/g, '') })} /></Field>
          <Field label="Length of need"><input className="inp" placeholder="99 months" value={f.lengthOfNeed || ''} onChange={e => setF({ ...f, lengthOfNeed: e.target.value })} /></Field>
          <Field label="Order date"><input className="inp" type="date" value={f.orderDate || todayYmd()} onChange={e => setF({ ...f, orderDate: e.target.value })} /></Field>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <Field label="Supplier"><input className="inp" value={f.supplierName || ''} onChange={e => setF({ ...f, supplierName: e.target.value })} /></Field>
          <Field label="Supplier fax">
            <input className="inp" inputMode="tel" value={f.supplierFax || ''} onChange={e => setF({ ...f, supplierFax: e.target.value })} />
            {f.supplierFax && !faxOk(f.supplierFax) && <p className="text-[11px] text-amber-700 mt-1">Ten digits.</p>}
          </Field>
        </div>
        <label className="flex items-start gap-2 text-xs">
          <input type="checkbox" className="mt-0.5" checked={!!f.requiresF2F} onChange={e => setF({ ...f, requiresF2F: e.target.checked })} />
          <span>This item requires a face-to-face encounter.</span>
        </label>
        {f.requiresF2F && (
          <Field label="Face-to-face encounter date — must be within the six months before the order date">
            <input className="inp" type="date" value={f.faceToFaceDate || ''} onChange={e => setF({ ...f, faceToFaceDate: e.target.value })} />
          </Field>
        )}
        <label className="flex items-start gap-2 text-xs">
          <input type="checkbox" className="mt-0.5" checked={!!f.requiresWOPD} onChange={e => setF({ ...f, requiresWOPD: e.target.checked })} />
          <span>Written order prior to delivery. <span className="text-stone-500">The supplier may not deliver before they hold it — power mobility devices are the statutory case.</span></span>
        </label>
        <Hint>
          Which items need a face-to-face encounter or a written order prior to delivery is CMS's{' '}
          <a className="underline" target="_blank" rel="noopener noreferrer"
            href="https://www.cms.gov/medicare/regulations-guidance/dmepos-face-to-face-written-order-prior-delivery-power-mobility-devices-list">Required List</a>,
          which changes. It is not embedded in this app — you set the flags.
        </Hint>
      </React.Fragment>
    );

    // Session 4.8: the same form places a direct order (a provider's own
    // authority) and an order under a protocol. `requireStandingOrder` is set
    // for a credential that has no direct authority — the protocol picker then
    // has no blank option, and the TESTS come from the protocol's list rather
    // than a free-text box, because a test typed in is refused server-side.
    // One key per form, made when it opens and sent with every save from it,
    // so a double click or a retry returns the order already placed rather
    // than recording a second one.
    const newSubmitKey = () => {
      try { if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID(); } catch (e) { /* fall through */ }
      return `k${Date.now().toString(36)}${Math.random().toString(36).slice(2, 10)}`;
    };
    const OrderForm = ({ clientId, diagnoses, types, priorities, onSave, busy, standingOrders, requireStandingOrder, docTypes, enrollmentWarning, initialType, diagnosesLocked, dxNotice }) => {
      // A REFERRAL is decided by where it goes (owner, 2026-10-12): any licensed
      // role refers within the team, a provider or an LCSW refers out. Someone
      // with no direct ordering authority still refers, with no protocol.
      const canReferInternal = useCan('referInternal');
      const canReferOut = useCan('referExternal');
      const canOrderOwn = useCan('orderDirect');
      const canReferExternal = canReferOut || canOrderOwn;
      const canRefer = canReferInternal || canReferExternal;
      const startType = initialType && (initialType === 'referral' ? canRefer : !requireStandingOrder && (types || []).includes(initialType))
        ? initialType : (requireStandingOrder && canRefer ? 'referral' : 'lab');
      const [f, setF] = useState({ orderType: startType, tests: '', priority: 'routine', diagnosisCodes: diagnoses.map(d => d.code), notes: '', standingOrderId: '' });
      const submitKeyRef = useRef(newSubmitKey());
      // The linked diagnoses follow the list they are picked from: a code that
      // left the list is dropped, and an empty pick takes them all again.
      const dxKey = diagnoses.map(d => d.code).join('|');
      useEffect(() => {
        setF(p => {
          const keep = p.diagnosisCodes.filter(c => diagnoses.some(d => d.code === c));
          return { ...p, diagnosisCodes: keep.length ? keep : diagnoses.map(d => d.code) };
        });
      }, [dxKey]);
      const [targets, setTargets] = useState(null);
      const [targetsErr, setTargetsErr] = useState('');
      const loadTargets = useCallback(() => {
        if (!clientId) return;
        api.referralTargets(clientId).then(r => { setTargets(r); setTargetsErr(''); }).catch(e => setTargetsErr(e.message || 'The referral list did not load.'));
      }, [clientId]);
      useEffect(() => { if (f.orderType === 'referral' && !targets) loadTargets(); }, [f.orderType, targets, loadTargets]);
      // 42 CFR 424.507: the server refuses a Medicare lab/imaging/DME order from
      // an ordering clinician not enrolled in approved status UNTIL it is
      // acknowledged with a reason. This form had no way to send one, so every
      // such order was simply refused. Shown once the server has said so.
      const [ack, setAck] = useState({ acknowledged: false, reason: '' });
      // 4.10: which types carry a payload rather than a list of tests. SERVED,
      // never listed here — a form that names its own options drifts from the
      // validator that refuses one it did not offer.
      const isDoc = (docTypes || []).includes(f.orderType);
      const toggleDx = (c) => setF(p => ({ ...p, diagnosisCodes: p.diagnosisCodes.includes(c) ? p.diagnosisCodes.filter(x => x !== c) : [...p.diagnosisCodes, c] }));
      // A screening is recorded on the Screenings card, not placed as an
      // order (nothing is sent anywhere), so it is left out here.
      const orderTypesOf = (o) => (o.executableOrderTypes || []).filter(t => t !== 'screening');
      const protocols = (standingOrders || []).filter(o => o.executableByMe && orderTypesOf(o).length > 0);
      const picked = protocols.find(o => o.id === f.standingOrderId) || null;
      const pickedTests = picked ? (picked.permittedTests || []) : [];
      const toggleTest = (t) => setF(p => {
        const cur = p.tests.split('\n').map(x => x.trim()).filter(Boolean);
        return { ...p, tests: (cur.includes(t) ? cur.filter(x => x !== t) : cur.concat([t])).join('\n') };
      });
      // Under a protocol the choice narrows to the types BOTH the protocol and
      // the caller's licence allow — the server computed that intersection, so
      // the form does not re-derive it. With no protocol, someone without direct
      // authority is offered the referral alone.
      const typeOptions = picked ? orderTypesOf(picked) : requireStandingOrder ? (canRefer ? ['referral'] : []) : (types || []);
      const referralReady = f.orderType !== 'referral' || (f.destination === 'internal'
        ? !!(f.assigneeId && f.reason && f.clinicalSummary)
        : f.destination === 'external'
          ? !!(f.specialty && f.reason && f.clinicalSummary && (f.agencyPending && !String(f.receivingFax || '').trim() ? true : faxOk(f.receivingFax)))
          : false);
      return (
        <div className="grid gap-2 border-t border-stone-100 pt-3">
          {(protocols.length > 0 || (requireStandingOrder && !canRefer)) && (
            <Field label={requireStandingOrder && !canRefer ? 'Standing order (required)' : 'Standing order (optional)'}>
              <select className="inp" value={f.standingOrderId}
                onChange={e => {
                  // A protocol that does not permit 'lab' left the form sending
                  // 'lab' under an option list that did not contain it.
                  const next = protocols.find(o => o.id === e.target.value);
                  const first = next && orderTypesOf(next)[0];
                  setF({ ...f, standingOrderId: e.target.value, tests: '', orderType: first || (requireStandingOrder && canRefer ? 'referral' : 'lab') });
                }}>
                {!requireStandingOrder && <option value="">No protocol — my own authority</option>}
                {requireStandingOrder && <option value="">{canRefer ? 'No protocol — a referral' : 'Select a protocol…'}</option>}
                {protocols.map(o => <option key={o.id} value={o.id}>{o.title} (v{o.version})</option>)}
              </select>
              {requireStandingOrder && protocols.length === 0 && !canRefer &&
                <p className="text-[11px] text-amber-700 mt-1">No active standing order authorises your credential for this work. A provider authors and signs one.</p>}
              {picked && <p className="text-[11px] text-stone-500 mt-1">Ordering clinician of record: {picked.authorizingProvider && picked.authorizingProvider.name}. Expires {String(picked.expiresAt || '').slice(0, 10)}.</p>}
            </Field>
          )}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <Field label="Order type"><select className="inp" value={f.orderType} onChange={e => setF({ ...f, orderType: e.target.value })}>{typeOptions.map(t => <option key={t} value={t}>{t}</option>)}</select></Field>
            <Field label="Priority"><select className="inp" value={f.priority} onChange={e => setF({ ...f, priority: e.target.value })}>{(priorities || []).map(t => <option key={t} value={t}>{t}</option>)}</select></Field>
          </div>
          {isDoc
            ? (f.orderType === 'referral'
              ? <ReferralFields f={f} setF={setF} targets={targets} targetsErr={targetsErr} onProviderSaved={loadTargets} />
              : <DmeFields f={f} setF={setF} />)
            : picked
            ? (
              <Field label="Tests / studies this protocol permits">
                <div className="flex flex-wrap gap-1.5">
                  {pickedTests.map(t => (
                    <button key={t} type="button"
                      className={`chip border ${f.tests.split('\n').map(x => x.trim()).includes(t) ? 'bg-primary text-white border-primary' : 'bg-white text-primary border-stone-200'}`}
                      onClick={() => toggleTest(t)}>{t}</button>
                  ))}
                </div>
              </Field>
            )
            : <Field label="Tests / studies (one per line)"><textarea className="inp" rows={2} value={f.tests} onChange={e => setF({ ...f, tests: e.target.value })} /></Field>}
          <div className="flex flex-wrap items-center gap-1.5 text-[11px] text-stone-500">Linked dx:
            {diagnoses.length === 0 && <span className="text-amber-700">{diagnosesLocked ? 'this visit was signed with no diagnoses, so no order can be added to it' : 'add a diagnosis to the visit and save the coding first'}</span>}
            {diagnoses.map(d => (
              <button key={d.code} type="button" className={`chip border ${f.diagnosisCodes.includes(d.code) ? 'bg-primary text-white border-primary' : 'bg-white text-primary border-stone-200'}`} onClick={() => toggleDx(d.code)}>{d.code}</button>
            ))}
          </div>
          {dxNotice && <p className="text-[11px] text-amber-700">{dxNotice}</p>}
          <Field label="Notes"><input className="inp" value={f.notes} onChange={e => setF({ ...f, notes: e.target.value })} /></Field>
          {enrollmentWarning && (
            <div className="rounded border border-amber-300 bg-amber-50 p-2.5 grid gap-2">
              <p className="text-[12px] text-amber-900">{enrollmentWarning.error}</p>
              <label className="flex items-center gap-2 text-[12px]">
                <input type="checkbox" checked={ack.acknowledged} onChange={e => setAck({ ...ack, acknowledged: e.target.checked })} />
                I understand and want to place this order anyway
              </label>
              <Field label="Reason (recorded on the order)"><input className="inp" value={ack.reason} onChange={e => setAck({ ...ack, reason: e.target.value })} /></Field>
            </div>
          )}
          <div className="flex justify-end">
            <button className="btn !py-1.5"
              disabled={busy || !f.diagnosisCodes.length || (requireStandingOrder && !f.standingOrderId && f.orderType !== 'referral') ||
                (enrollmentWarning && (!ack.acknowledged || !ack.reason.trim())) ||
                (isDoc
                  ? (f.orderType === 'referral'
                    ? !referralReady
                    : (!f.itemDescription || !f.quantity || !f.supplierName || !f.lengthOfNeed || !faxOk(f.supplierFax) || (f.requiresF2F && !f.faceToFaceDate)))
                  : !f.tests.trim())}
              onClick={() => {
                const base = isDoc ? f : { ...f, tests: f.tests.split('\n').map(s => s.trim()).filter(Boolean) };
                const body = { ...base, idempotencyKey: submitKeyRef.current };
                onSave(enrollmentWarning ? { ...body, enrollmentAcknowledgment: { acknowledged: ack.acknowledged, reason: ack.reason.trim() } } : body);
              }}>
              {busy ? 'Recording…' : f.orderType === 'referral' ? (f.destination === 'internal' ? 'Send Referral' : 'Record Referral') : f.orderType === 'dme' ? 'Record Written Order' : 'Record Order'}
            </button>
          </div>
        </div>
      );
    };

    // ── Session 4.10: the hand-off to Doximity, and the evidence it leaves ──
    //
    // THE APP GENERATES. A PERSON TRANSMITS. This row is the whole workflow:
    // open the requisition (it lands in the phone's PDF viewer, one tap from the
    // share sheet), fax it from Doximity, then come back and say it went — which
    // is what "Mark as faxed" records, with the number and the channel.
    // ── Cancel Order (owner, 2026-10-12) ───────────────────────────────────
    // A cancel needs a reason, and the server says per order whether this
    // viewer may cancel it (order.can.cancel), so the button only shows where
    // the route will accept it.
    const CancelOrderControl = ({ order, busy, onCancel }) => {
      const [open, setOpen] = useState(false);
      const [reason, setReason] = useState('');
      if (!(order.can && order.can.cancel) || !onCancel) return null;
      if (!open) {
        return (
          <button type="button" className="chip border bg-white text-red-700 border-red-200" onClick={() => setOpen(true)}>
            <i className="ti ti-x" /> Cancel Order
          </button>
        );
      }
      return (
        <div className="w-full grid gap-2 mt-2 p-2.5 rounded border border-red-200 bg-red-50/40">
          <Field label="Why is this order being cancelled? (required)">
            <input className="inp" value={reason} onChange={e => setReason(e.target.value)} placeholder="e.g. Done at the hospital last week" />
          </Field>
          <div className="flex justify-end gap-2">
            <button type="button" className="btn ghost !py-1.5" onClick={() => { setOpen(false); setReason(''); }}>Keep Order</button>
            <button type="button" className="btn !py-1.5 !bg-red-700" disabled={busy || !reason.trim()}
