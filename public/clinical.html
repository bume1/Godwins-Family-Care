<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Godwins Family Care — Clinical Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.1.0/dist/tabler-icons.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#033D50', 50: '#e8f0f4', 100: '#c5d9e3', 500: '#033D50', 600: '#02334a', 700: '#022A38' },
            accent: '#C9A44A',
            cream: '#FAF7F2', creamdeep: '#efe9db'
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['"DM Sans"', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="icon" type="image/png" href="/brand/logo-mark-transparent.png">
  <style>
    * { font-family: 'DM Sans', system-ui, sans-serif; }
    body { background: #efe9db; color: #2b2b28; }
    .serif { font-family: 'Cormorant Garamond', Georgia, serif; }
    .card { background: #fff; border: 1px solid #e5ddcb; border-radius: 12px; }
    .card-h { display:flex; align-items:center; justify-content:space-between; padding: 12px 16px; border-bottom: 1px solid #eee9dc; }
    .card-h h2 { font-family: 'Cormorant Garamond', serif; font-size: 17px; color: #033D50; font-weight: 600; }
    .lblu { font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: #7a746a; font-weight: 600; }
    .inp { width:100%; border:1px solid #e5ddcb; border-radius:8px; padding:8px 10px; font-size:13px; background:#fff; }
    .inp:focus { outline:2px solid #C9A44A55; border-color:#C9A44A; }
    .btn { display:inline-flex; align-items:center; gap:6px; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid #033D50; background:#033D50; color:#fff; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .btn.gold { background:#C9A44A; border-color:#C9A44A; color:#033D50; }
    .btn.ghost { background:#fff; color:#033D50; }
    .chip { border-radius:999px; padding:2px 9px; font-size:10.5px; font-weight:700; }
    .prefill { background:#FDF6E7; border:1px dashed #C9A44A; }
    .prefill-badge { font-size:9.5px; color:#9a6a1e; font-weight:700; letter-spacing:.4px; }
    .tabbtn { padding:9px 14px; font-size:13px; font-weight:600; color:#7a746a; border-bottom:2.5px solid transparent; cursor:pointer; white-space:nowrap; }
    .tabbtn.on { color:#033D50; border-color:#C9A44A; }
    ::-webkit-scrollbar { width:8px; height:8px; } ::-webkit-scrollbar-thumb { background:#d8d0bd; border-radius:8px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const API_URL = window.location.origin;

    const getToken = () => localStorage.getItem('admin_token') || localStorage.getItem('unified_token');
    const handleResponse = async (response) => {
      if (!response.ok) {
        let data = null;
        try { data = await response.json(); } catch {}
        if (response.status === 401) {
          localStorage.removeItem('admin_token'); localStorage.removeItem('admin_user');
          throw Object.assign(new Error((data && data.error) || 'Session expired'), { code: 'AUTH', status: 401 });
        }
        const err = new Error((data && data.error) || `HTTP error ${response.status}`);
        err.status = response.status; err.data = data;
        throw err;
      }
      return response.json();
    };
    const authedFetch = (path, opts = {}) => {
      const headers = Object.assign({ 'Authorization': `Bearer ${getToken()}` },
        opts.body && !(opts.body instanceof FormData) ? { 'Content-Type': 'application/json' } : {}, opts.headers || {});
      return fetch(`${API_URL}${path}`, Object.assign({}, opts, { headers })).then(handleResponse);
    };
    const api = {
      login: (email, password) => fetch(`${API_URL}/api/auth/login`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      }).then(handleResponse),
      status: () => authedFetch('/api/clinical/status'),
      patients: (q) => authedFetch(`/api/clinical/patients${q ? `?q=${encodeURIComponent(q)}` : ''}`),
      link: (id, body) => authedFetch(`/api/clinical/patients/${id}/link`, { method: 'POST', body: JSON.stringify(body || {}) }),
      chart: (id) => authedFetch(`/api/clinical/patients/${id}/chart`),
      visit: (id, body) => authedFetch(`/api/clinical/patients/${id}/visit`, { method: 'POST', body: JSON.stringify(body) }),
      medrec: (id) => authedFetch(`/api/clinical/patients/${id}/medrec`),
      medrecSave: (id, decisions) => authedFetch(`/api/clinical/patients/${id}/medrec`, { method: 'POST', body: JSON.stringify({ decisions }) }),
      addProblem: (id, body) => authedFetch(`/api/clinical/patients/${id}/problems`, { method: 'POST', body: JSON.stringify(body) }),
      carePlan: (id) => authedFetch(`/api/clinical/patients/${id}/care-plan`),
      saveCarePlan: (id, body) => authedFetch(`/api/clinical/patients/${id}/care-plan`, { method: 'POST', body: JSON.stringify(body) }),
      checklist: (id) => authedFetch(`/api/clinical/patients/${id}/checklist`),
      markStep: (id, step, done) => authedFetch(`/api/clinical/patients/${id}/checklist/${step}`, { method: 'POST', body: JSON.stringify({ done }) }),
      activate: (id) => authedFetch(`/api/clinical/patients/${id}/activate`, { method: 'POST' }),
      // Session 4.2 — scheduling (OpenEMR is the appointment ledger)
      providers: () => authedFetch('/api/clinical/providers'),
      appointments: (params) => authedFetch(`/api/clinical/appointments?${new URLSearchParams(params).toString()}`),
      appointmentDetail: (eid) => authedFetch(`/api/clinical/appointments/${eid}`),
      patientAppointments: (id) => authedFetch(`/api/clinical/patients/${id}/appointments`),
      createAppointment: (id, body) => authedFetch(`/api/clinical/patients/${id}/appointments`, { method: 'POST', body: JSON.stringify(body) }),
      rescheduleAppointment: (eid, body) => authedFetch(`/api/clinical/appointments/${eid}/reschedule`, { method: 'POST', body: JSON.stringify(body) }),
      cancelAppointment: (eid, reason) => authedFetch(`/api/clinical/appointments/${eid}/cancel`, { method: 'POST', body: JSON.stringify({ reason }) }),
      markNoShow: (eid) => authedFetch(`/api/clinical/appointments/${eid}/no-show`, { method: 'POST' }),
      followUp: (id, body) => authedFetch(`/api/clinical/patients/${id}/encounters`, { method: 'POST', body: JSON.stringify(body) })
    };

    const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
    const fmtTs = (iso) => iso ? new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—';
    const initials = (n) => String(n || '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || 'GF';

    // ── Scheduling date/time helpers (wall-clock strings, matching OpenEMR) ──
    const toYmd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const todayYmd = () => toYmd(new Date());
    const addDaysYmd = (ymd, n) => { const d = new Date(`${ymd}T12:00:00`); d.setDate(d.getDate() + n); return toYmd(d); };
    const mondayOf = (ymd) => { const d = new Date(`${ymd}T12:00:00`); return addDaysYmd(ymd, -((d.getDay() + 6) % 7)); };
    const fmtDayLabel = (ymd) => new Date(`${ymd}T12:00:00`).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    const fmt12h = (hhmm) => {
      const [h, m] = String(hhmm || '').split(':').map(n => parseInt(n, 10));
      if (isNaN(h)) return hhmm || '—';
      const ap = h >= 12 ? 'p' : 'a';
      return `${((h + 11) % 12) + 1}:${String(m || 0).padStart(2, '0')}${ap}`;
    };
    const timeMins = (hhmm) => { const [h, m] = String(hhmm || '0:0').split(':').map(n => parseInt(n, 10) || 0); return h * 60 + m; };

    const APPT_STATE_META = {
      scheduled: { label: 'Scheduled', chip: 'bg-primary-50 text-primary' },
      needs_documentation: { label: 'Not yet documented', chip: 'bg-amber-50 text-amber-800' },
      documented: { label: 'Documented', chip: 'bg-emerald-50 text-emerald-700' },
      no_show: { label: 'No-show', chip: 'bg-red-50 text-red-700' },
      cancelled: { label: 'Cancelled', chip: 'bg-stone-100 text-stone-500' }
    };
    const StateChip = ({ state }) => {
      const m = APPT_STATE_META[state] || APPT_STATE_META.scheduled;
      return <span className={`chip ${m.chip}`}>{m.label}</span>;
    };
    const LOCATION_LABELS = { home: 'Home visit', telehealth: 'Telehealth', office: 'Office' };

    // ── Drawn signature pad (same mechanism as the 3.4 ROI / portal co-sign) ──
    const SignaturePad = ({ padRef }) => {
      const canvasRef = useRef(null);
      const state = useRef({ drawing: false, empty: true });
      useEffect(() => {
        const canvas = canvasRef.current; if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const ratio = window.devicePixelRatio || 1;
        const w = canvas.offsetWidth || 400;
        canvas.width = w * ratio; canvas.height = 130 * ratio;
        ctx.scale(ratio, ratio);
        ctx.strokeStyle = '#033D50'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        state.current = { drawing: false, empty: true };
        const pos = (e) => { const r = canvas.getBoundingClientRect(); const s = e.touches ? e.touches[0] : e; return { x: s.clientX - r.left, y: s.clientY - r.top }; };
        const down = (e) => { state.current.drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
        const move = (e) => { if (!state.current.drawing) return; e.preventDefault && e.preventDefault(); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); state.current.empty = false; };
        const up = () => { state.current.drawing = false; };
        canvas.addEventListener('mousedown', down); canvas.addEventListener('mousemove', move);
        canvas.addEventListener('mouseup', up); canvas.addEventListener('mouseleave', up);
        canvas.addEventListener('touchstart', down, { passive: false });
        canvas.addEventListener('touchmove', move, { passive: false });
        canvas.addEventListener('touchend', up);
        padRef.current = {
          isEmpty: () => state.current.empty,
          toDataURL: () => canvas.toDataURL('image/png'),
          clear: () => { ctx.clearRect(0, 0, canvas.width, canvas.height); state.current.empty = true; }
        };
        return () => {
          canvas.removeEventListener('mousedown', down); canvas.removeEventListener('mousemove', move);
          canvas.removeEventListener('mouseup', up); canvas.removeEventListener('mouseleave', up);
          canvas.removeEventListener('touchstart', down); canvas.removeEventListener('touchmove', move);
          canvas.removeEventListener('touchend', up);
        };
      }, []);
      return (
        <div>
          <canvas ref={canvasRef} style={{ width: '100%', height: 130, background: '#FAF7F2', border: '1px solid #e5ddcb', borderRadius: 8, touchAction: 'none' }} />
          <button type="button" className="text-xs text-primary underline mt-1" onClick={() => padRef.current && padRef.current.clear()}>Clear signature</button>
        </div>
      );
    };

    // ── Pre-filled field wrapper: visibly marked until clinician-confirmed ──
    const Prefilled = ({ fieldKey, confirmed, onConfirm, children }) => {
      const isConfirmed = confirmed.includes(fieldKey);
      return (
        <div className={`rounded-lg p-2 ${isConfirmed ? '' : 'prefill'}`}>
          {children}
          {!isConfirmed && (
            <button type="button" className="prefill-badge mt-1 flex items-center gap-1" onClick={() => onConfirm(fieldKey)}>
              <i className="ti ti-alert-circle" /> FROM INTAKE — TAP TO CONFIRM
            </button>
          )}
          {isConfirmed && <span className="text-[9.5px] text-emerald-700 font-bold flex items-center gap-1 mt-1"><i className="ti ti-circle-check" /> CONFIRMED</span>}
        </div>
      );
    };

    const Field = ({ label, children, className }) => (
      <label className={`block ${className || ''}`}>
        <span className="lblu block mb-1">{label}</span>
        {children}
      </label>
    );

    const Login = ({ onLogin }) => {
      const [email, setEmail] = useState(''); const [password, setPassword] = useState('');
      const [err, setErr] = useState(''); const [busy, setBusy] = useState(false);
      const submit = (e) => {
        e.preventDefault(); setBusy(true); setErr('');
        api.login(email, password).then(r => {
          localStorage.setItem('admin_token', r.token);
          localStorage.setItem('admin_user', JSON.stringify(r.user));
          onLogin(r.user);
        }).catch(e => { setErr(e.message); setBusy(false); });
      };
      return (
        <div className="min-h-screen flex items-center justify-center p-6">
          <form onSubmit={submit} className="card p-8 w-full max-w-sm">
            <img src="/brand/logo-mark-transparent.png" alt="" className="h-12 mb-3" />
            <h1 className="serif text-2xl text-primary font-semibold mb-1">Clinical Workspace</h1>
            <p className="text-xs text-stone-500 mb-5">Authorized clinical staff only. All access is logged.</p>
            <Field label="Email"><input className="inp" type="email" value={email} onChange={e => setEmail(e.target.value)} required /></Field>
            <div className="h-3" />
            <Field label="Password"><input className="inp" type="password" value={password} onChange={e => setPassword(e.target.value)} required /></Field>
            {err && <p className="text-red-600 text-xs mt-3">{err}</p>}
            <button className="btn w-full justify-center mt-5" disabled={busy}>{busy ? 'Signing in…' : 'Sign in'}</button>
          </form>
        </div>
      );
    };

    // ── Chart summary tab ──
    const SummaryTab = ({ chart, patient, onLink, linking }) => {
      const d = chart && chart.demographics;
      if (!chart) return <p className="text-sm text-stone-500 p-4">Loading chart…</p>;
      const Sec = ({ title, data, render, icon }) => (
        <div className="card mb-4">
          <div className="card-h"><h2><i className={`ti ${icon} mr-1 text-accent`} />{title}</h2>
            {data && !data.ok && <span className="chip bg-red-50 text-red-700">EMR read failed</span>}
          </div>
          <div className="p-4 text-sm">
            {!chart.linked && <p className="text-stone-400 text-xs">Link this patient to OpenEMR to read live data.</p>}
            {chart.linked && data && data.ok && data.rows.length === 0 && <p className="text-stone-400 text-xs">Nothing on file in OpenEMR.</p>}
            {chart.linked && data && data.ok && data.rows.map((r, i) => render(r, i))}
            {chart.linked && data && !data.ok && <p className="text-red-600 text-xs">{data.error}</p>}
          </div>
        </div>
      );
      const emr = chart.emr || {};
      const row = (main, sub, right) => (
        <div className="flex items-start justify-between py-1.5 border-b border-stone-100 last:border-0">
          <div><div className="font-semibold text-[13px]">{main}</div>{sub && <div className="text-xs text-stone-500">{sub}</div>}</div>
          {right && <span className="chip bg-primary-50 text-primary">{right}</span>}
        </div>
      );
      return (
        <div>
          {!chart.linked && (
            <div className="card p-4 mb-4 flex flex-wrap items-center justify-between gap-3">
              <div>
                <div className="font-semibold text-sm text-primary">Not linked to OpenEMR yet</div>
                <div className="text-xs text-stone-500">Create the OpenEMR patient record from the app demographics, or link an existing chart.</div>
              </div>
              <button className="btn gold" disabled={linking} onClick={() => onLink()}>{linking ? 'Linking…' : 'Create & link OpenEMR patient'}</button>
            </div>
          )}
          <div className="grid md:grid-cols-2 gap-0 md:gap-4">
            <div>
              <Sec title="Problem list" icon="ti-list-details" data={emr.problems}
                render={(r, i) => <div key={i}>{row(r.title, [r.code, r.onset && `since ${fmtDate(r.onset)}`].filter(Boolean).join(' · '), r.status)}</div>} />
              <Sec title="Medications" icon="ti-pill" data={emr.medications}
                render={(r, i) => <div key={i}>{row(r.title, r.instructions || (r.authoredOn && fmtDate(r.authoredOn)), r.status)}</div>} />
              <Sec title="Allergies" icon="ti-alert-triangle" data={emr.allergies}
                render={(r, i) => <div key={i}>{row(r.title, r.criticality && `criticality: ${r.criticality}`, r.status)}</div>} />
            </div>
            <div>
              <Sec title="Encounters" icon="ti-stethoscope" data={emr.encounters}
                render={(r, i) => <div key={i}>{row(r.type, [r.provider, r.start && fmtTs(r.start)].filter(Boolean).join(' · '), r.status)}</div>} />
              <Sec title="Vitals (recent)" icon="ti-heart-rate-monitor" data={emr.vitals}
                render={(r, i) => <div key={i}>{row(r.name, r.at && fmtTs(r.at), r.value)}</div>} />
              <Sec title="Documents" icon="ti-files" data={emr.documents}
                render={(r, i) => <div key={i}>{row(r.description, [r.contentType, r.date && fmtDate(r.date)].filter(Boolean).join(' · '))}</div>} />
            </div>
          </div>
        </div>
      );
    };

    // ── H&P documentation tab (intake spec §2C) ──
    // appointmentEid (4.2): set when the visit is opened from a calendar
    // appointment — the resulting Encounter links back to it.
    const HpTab = ({ patient, chart, appointmentEid, onDone }) => {
      const pf = (chart && chart.intakePrefill) || {};
      const [confirmed, setConfirmed] = useState([]);
      const confirm = (k) => setConfirmed(c => c.includes(k) ? c : [...c, k]);
      const [f, setF] = useState({
        chiefConcern: pf.chiefConcern || '',
        subjective: '', assessment: '', plan: '',
        vitals: { bpRightSys: '', bpRightDia: '', bpLeftSys: '', bpLeftDia: '', hr: '', temp: '', rr: '', spo2: '', weight: '', height: '' },
        systemsExam: { general: '', cardiovascular: '', respiratory: '', lungSounds: '', neuro: '', gi: '', gu: '', musculoskeletal: '' },
        skinWound: { findings: '', woundPresent: 'no', woundLocation: '', woundMeasurements: '' },
        painAssessment: { breathing: '', negativeVocalization: '', facialExpression: '', bodyLanguage: '', consolability: '', totalScore: '' },
        homeHazards: { smokeDetectors: '', coDetectors: '', grabBars: '', nonSkidSurfaces: '', runningWater: '', secondaryExit: '', notes: '' },
        triage: { track: '', rationale: '' }
      });
      const set = (path, v) => setF(prev => {
        const [a, b] = path.split('.');
        if (!b) return { ...prev, [a]: v };
        return { ...prev, [a]: { ...prev[a], [b]: v } };
      });
      const [busy, setBusy] = useState(false); const [msg, setMsg] = useState(null);
      const submit = () => {
        setBusy(true); setMsg(null);
        api.visit(patient.id, { ...f, confirmedFields: confirmed, appointmentEid: appointmentEid || undefined })
          .then(r => { setMsg({ ok: true, text: `${r.message} (${fmtTs(r.at)})` }); onDone && onDone(); })
          .catch(e => setMsg({ ok: false, text: e.message }))
          .finally(() => setBusy(false));
      };
      const V = ({ k, label, w }) => (
        <Field label={label} className={w || ''}>
          <input className="inp" value={f.vitals[k]} onChange={e => set(`vitals.${k}`, e.target.value)} />
        </Field>
      );
      const T = ({ path, label, rows }) => (
        <Field label={label}>
          <textarea className="inp" rows={rows || 2} value={path.split('.').reduce((o, k) => o[k], f)} onChange={e => set(path, e.target.value)} />
        </Field>
      );
      const painFields = ['breathing', 'negativeVocalization', 'facialExpression', 'bodyLanguage', 'consolability'];
      const hazardFields = [['smokeDetectors', 'Smoke detectors'], ['coDetectors', 'CO detectors'], ['grabBars', 'Grab bars'], ['nonSkidSurfaces', 'Non-skid surfaces'], ['runningWater', 'Running water'], ['secondaryExit', 'Secondary exit']];
      return (
        <div className="max-w-3xl">
          {appointmentEid && (
            <div className="card p-3 mb-4 flex items-center gap-2 text-sm text-primary">
              <i className="ti ti-calendar-check text-accent" />
              Documenting from a scheduled appointment — the Encounter will be linked to it on the chart.
            </div>
          )}
          <div className="card mb-4">
            <div className="card-h"><h2>Initial Visit · History &amp; Physical</h2></div>
            <div className="p-4 grid gap-4">
              <Prefilled fieldKey="chiefConcern" confirmed={confirmed} onConfirm={confirm}>
                <T path="chiefConcern" label="Chief concern" />
              </Prefilled>
              {(pf.conditions || []).length > 0 && (
                <Prefilled fieldKey="conditions" confirmed={confirmed} onConfirm={confirm}>
                  <span className="lblu block mb-1">Family-reported conditions (intake)</span>
                  <div className="flex flex-wrap gap-1.5">{pf.conditions.map((c, i) => <span key={i} className="chip bg-primary-50 text-primary">{c}</span>)}</div>
                </Prefilled>
              )}
              <T path="subjective" label="Subjective / history" rows={3} />
            </div>
          </div>

          <div className="card mb-4">
            <div className="card-h"><h2>Vitals</h2><span className="text-[10.5px] text-stone-500">BP required in both arms (§2C)</span></div>
            <div className="p-4 grid grid-cols-2 md:grid-cols-4 gap-3">
              <V k="bpRightSys" label="BP right — sys" /><V k="bpRightDia" label="BP right — dia" />
              <V k="bpLeftSys" label="BP left — sys" /><V k="bpLeftDia" label="BP left — dia" />
              <V k="hr" label="Heart rate" /><V k="temp" label="Temp (°F)" /><V k="rr" label="Resp rate" /><V k="spo2" label="SpO₂ (%)" />
              <V k="weight" label="Weight (lb)" /><V k="height" label="Height (in)" />
            </div>
          </div>

          <div className="card mb-4">
            <div className="card-h"><h2>Systems exam</h2></div>
            <div className="p-4 grid md:grid-cols-2 gap-3">
              {Object.keys(f.systemsExam).map(k => (
                <T key={k} path={`systemsExam.${k}`} label={k === 'lungSounds' ? 'Lung sounds' : k.charAt(0).toUpperCase() + k.slice(1)} />
              ))}
            </div>
          </div>

          <div className="card mb-4">
            <div className="card-h"><h2>Skin &amp; wound</h2></div>
            <div className="p-4 grid gap-3">
              <T path="skinWound.findings" label="Skin findings" />
              <Field label="Wound present?">
                <select className="inp" value={f.skinWound.woundPresent} onChange={e => set('skinWound.woundPresent', e.target.value)}>
                  <option value="no">No</option><option value="yes">Yes</option>
                </select>
              </Field>
              {f.skinWound.woundPresent === 'yes' && (
                <div className="grid md:grid-cols-2 gap-3">
                  <T path="skinWound.woundLocation" label="Location" />
                  <T path="skinWound.woundMeasurements" label="Measurements (L × W × D cm)" />
                </div>
              )}
            </div>
          </div>

          <div className="card mb-4">
            <div className="card-h"><h2>Pain assessment (PAINAD-style)</h2><span className="text-[10.5px] text-stone-500">0–2 each</span></div>
            <div className="p-4 grid grid-cols-2 md:grid-cols-3 gap-3">
              {painFields.map(k => (
                <Field key={k} label={k.replace(/([A-Z])/g, ' $1')}>
                  <select className="inp" value={f.painAssessment[k]} onChange={e => set(`painAssessment.${k}`, e.target.value)}>
                    <option value="">—</option><option>0</option><option>1</option><option>2</option>
                  </select>
                </Field>
              ))}
              <Field label="Total score">
                <input className="inp" readOnly value={painFields.reduce((s, k) => s + (parseInt(f.painAssessment[k], 10) || 0), 0)} />
              </Field>
            </div>
          </div>

          <div className="card mb-4">
            <div className="card-h"><h2>Home-hazard inventory</h2></div>
            <div className="p-4">
              {(pf.homeSafetyFlags || []).length > 0 && (
                <Prefilled fieldKey="homeSafetyFlags" confirmed={confirmed} onConfirm={confirm}>
                  <span className="lblu block mb-1">Intake staff-safety flags</span>
                  <div className="flex flex-wrap gap-1.5">{pf.homeSafetyFlags.map((c, i) => <span key={i} className="chip bg-amber-50 text-amber-800">{c}</span>)}</div>
                </Prefilled>
              )}
              <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mt-3">
                {hazardFields.map(([k, label]) => (
                  <Field key={k} label={label}>
                    <select className="inp" value={f.homeHazards[k]} onChange={e => set(`homeHazards.${k}`, e.target.value)}>
                      <option value="">—</option><option value="present_working">Present / working</option>
                      <option value="present_not_working">Present, not working</option><option value="absent">Absent</option>
                      <option value="na">N/A</option>
                    </select>
                  </Field>
                ))}
              </div>
              <div className="mt-3"><T path="homeHazards.notes" label="Hazard notes" /></div>
            </div>
          </div>

          <div className="card mb-4">
            <div className="card-h"><h2>Assessment, plan &amp; RN triage</h2></div>
            <div className="p-4 grid gap-3">
              <T path="assessment" label="Assessment" rows={3} />
              <T path="plan" label="Plan" rows={3} />
              <div className="grid md:grid-cols-2 gap-3">
                <Field label="Track assignment (RN triage)">
                  <select className="inp" value={f.triage.track} onChange={e => set('triage.track', e.target.value)}>
                    <option value="">— keep current ({patient.careTier || 'unset'})</option>
                    <option value="A1">A1 — Essential ADL</option><option value="A2">A2 — Comprehensive ADL &amp; IADL</option>
                    <option value="A3">A3 — IADL-Forward Support</option><option value="A4">A4 — Behavioral &amp; Cognitive</option>
                    <option value="B">B — Skilled Nursing</option>
                  </select>
                </Field>
                <T path="triage.rationale" label="Triage rationale" />
              </div>
            </div>
          </div>

          {msg && <p className={`text-sm mb-3 ${msg.ok ? 'text-emerald-700' : 'text-red-600'}`}>{msg.text}</p>}
          <button className="btn" disabled={busy} onClick={submit}>
            <i className="ti ti-writing-sign" />{busy ? 'Writing to OpenEMR…' : 'Sign & write to chart (Encounter + vitals + note)'}
          </button>
        </div>
      );
    };

    // ── Medication reconciliation tab ──
    const MedRecTab = ({ patient }) => {
      const [data, setData] = useState(null);
      const [decisions, setDecisions] = useState({});
      const [busy, setBusy] = useState(false); const [msg, setMsg] = useState(null);
      const load = useCallback(() => { api.medrec(patient.id).then(setData).catch(e => setMsg({ ok: false, text: e.message })); }, [patient.id]);
      useEffect(load, [load]);
      if (!data) return <p className="text-sm text-stone-500 p-4">Loading…</p>;
      const { matched, familyOnly, emrOnly } = data.view;
      const decide = (key, action, med, emrUuid) => setDecisions(d => ({ ...d, [key]: { action, med, emrUuid } }));
      const rows = [
        ...matched.map((m, i) => ({ key: `m${i}`, label: m.family.name || m.family.title, sub: `${m.family.dose || ''} ${m.family.frequency || ''}`.trim(), src: 'Both', med: m.family, emrUuid: m.emr.uuid || m.emr.id })),
        ...familyOnly.map((m, i) => ({ key: `f${i}`, label: m.name || m.title, sub: `${m.dose || ''} ${m.frequency || ''}`.trim(), src: 'Family-reported only', med: m })),
        ...emrOnly.map((m, i) => ({ key: `e${i}`, label: m.title || m.name, sub: m.comments || '', src: 'OpenEMR only', med: { name: m.title || m.name }, emrUuid: m.uuid || m.id }))
      ];
      const save = () => {
        const list = rows.map(r => decisions[r.key] ? { ...decisions[r.key] } : { action: 'keep', med: r.med, emrUuid: r.emrUuid });
        setBusy(true); setMsg(null);
        api.medrecSave(patient.id, list)
          .then(r => { setMsg({ ok: true, text: `${r.message}. EMR writes: ${r.emrResults.filter(x => x.ok).length}/${r.emrResults.length}` }); load(); })
          .catch(e => setMsg({ ok: false, text: e.message }))
          .finally(() => setBusy(false));
      };
      return (
        <div className="max-w-3xl">
          <div className="card">
            <div className="card-h"><h2>Medication reconciliation</h2>
              {!data.emrOk && <span className="chip bg-amber-50 text-amber-800">EMR list unavailable</span>}
            </div>
            <div className="p-4">
              {rows.length === 0 && <p className="text-sm text-stone-400">No medications reported anywhere.</p>}
              {rows.map(r => {
                const d = decisions[r.key];
                return (
                  <div key={r.key} className="flex flex-wrap items-center justify-between gap-2 py-2.5 border-b border-stone-100 last:border-0">
                    <div>
                      <div className="font-semibold text-[13px]">{r.label}</div>
                      <div className="text-xs text-stone-500">{r.sub} <span className="chip bg-primary-50 text-primary ml-1">{r.src}</span></div>
                    </div>
                    <div className="flex gap-1.5">
                      {['keep', 'add', 'discontinue'].map(a => (
                        <button key={a}
                          className={`chip border ${d && d.action === a ? 'bg-primary text-white border-primary' : 'bg-white text-primary border-stone-200'}`}
                          onClick={() => decide(r.key, a, r.med, r.emrUuid)}>
                          {a}
                        </button>
                      ))}
                    </div>
                  </div>
                );
              })}
              {msg && <p className={`text-sm mt-3 ${msg.ok ? 'text-emerald-700' : 'text-red-600'}`}>{msg.text}</p>}
              <button className="btn mt-4" disabled={busy || rows.length === 0} onClick={save}>
                {busy ? 'Saving…' : 'Resolve — write to OpenEMR & update app rows'}
              </button>
              <p className="text-[11px] text-stone-400 mt-2">Unmarked rows default to "keep". "Add" writes to OpenEMR; "discontinue" end-dates the OpenEMR row and removes it from the app's structured list.</p>
            </div>
          </div>
        </div>
      );
    };

    // ── Care-plan authoring tab (Scope C) ──
    const CarePlanTab = ({ patient, onSaved }) => {
      const [existing, setExisting] = useState(null);
      const padRef = useRef(null);
      const [f, setF] = useState({ problems: '', goals: '', eachVisit: '', visitFrequency: '', visitDays: [], visitTimes: '', duration: '', chargePlanNote: '', effectiveDate: '', targetDate: '' });
      const [busy, setBusy] = useState(false); const [msg, setMsg] = useState(null);
      useEffect(() => { api.carePlan(patient.id).then(setExisting).catch(() => {}); }, [patient.id]);
      const cp = existing && existing.carePlan;
      const coSigned = cp && existing.coSign && existing.coSign[`v${cp.version}`];
      const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      const lines = (s) => s.split('\n').map(x => x.trim()).filter(Boolean);
      const save = () => {
        if (!padRef.current || padRef.current.isEmpty()) { setMsg({ ok: false, text: 'Draw your author signature before saving.' }); return; }
        setBusy(true); setMsg(null);
        api.saveCarePlan(patient.id, {
          problems: lines(f.problems), goals: lines(f.goals), eachVisit: lines(f.eachVisit),
          visitFrequency: f.visitFrequency, visitDays: f.visitDays, visitTimes: f.visitTimes,
          duration: f.duration, chargePlanNote: f.chargePlanNote,
          effectiveDate: f.effectiveDate || null, targetDate: f.targetDate || null,
          rnSignatureImageB64: padRef.current.toDataURL()
        }).then(r => {
          setMsg({ ok: true, text: r.message + (r.emrDocumented ? ' · authored PDF filed to OpenEMR' : '') });
          api.carePlan(patient.id).then(setExisting).catch(() => {});
          onSaved && onSaved();
        }).catch(e => setMsg({ ok: false, text: e.message })).finally(() => setBusy(false));
      };
      return (
        <div className="max-w-3xl">
          {cp && (
            <div className="card mb-4">
              <div className="card-h"><h2>Current plan — v{cp.version}</h2>
                <span className={`chip ${coSigned ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-800'}`}>
                  {coSigned ? `Co-signed ${fmtTs(coSigned.at)}` : 'Awaiting client co-signature'}
                </span>
              </div>
              <div className="p-4 text-sm grid gap-1">
                <div><b>Authored:</b> {fmtTs(cp.authoredAt)} by {cp.authoredBy}</div>
                <div><b>Goals:</b> {(cp.goals || []).join(' · ')}</div>
                <div><b>Schedule:</b> {cp.visitSchedule || '—'} {cp.duration && `· ${cp.duration}`}</div>
                {existing.docs && existing.docs[`v${cp.version}`] && existing.docs[`v${cp.version}`].signed && (
                  <div><b>Signed PDF:</b>{' '}
                    {existing.docs[`v${cp.version}`].signed.driveUrl
                      ? <a className="text-primary underline" href={existing.docs[`v${cp.version}`].signed.driveUrl} target="_blank" rel="noreferrer">on Drive</a>
                      : 'stored'}
                    {existing.docs[`v${cp.version}`].signed.emrDocumented && ' · filed to OpenEMR'}
                  </div>
                )}
                {(existing.history || []).length > 1 && (
                  <div className="text-xs text-stone-500 mt-1">History: {existing.history.map(h => `v${h.version} (${fmtDate(h.authoredAt)})`).join(' · ')}</div>
                )}
              </div>
            </div>
          )}
          <div className="card">
            <div className="card-h"><h2>{cp ? `Author new version (v${cp.version + 1})` : 'Author care plan (v1)'}</h2></div>
            <div className="p-4 grid gap-4">
              <Field label="Problems addressed (one per line)"><textarea className="inp" rows={3} value={f.problems} onChange={e => setF({ ...f, problems: e.target.value })} /></Field>
              <Field label="Goals & objectives (one per line)"><textarea className="inp" rows={3} value={f.goals} onChange={e => setF({ ...f, goals: e.target.value })} /></Field>
              <Field label="Task list — each visit (one per line)"><textarea className="inp" rows={3} value={f.eachVisit} onChange={e => setF({ ...f, eachVisit: e.target.value })} /></Field>
              <div className="grid md:grid-cols-2 gap-3">
                <Field label="Visit frequency"><input className="inp" placeholder="e.g. 2 visits / week" value={f.visitFrequency} onChange={e => setF({ ...f, visitFrequency: e.target.value })} /></Field>
                <Field label="Times"><input className="inp" placeholder="e.g. mornings 9–11a" value={f.visitTimes} onChange={e => setF({ ...f, visitTimes: e.target.value })} /></Field>
              </div>
              <Field label="Days">
                <div className="flex flex-wrap gap-1.5">
                  {days.map(d => (
                    <button key={d} type="button"
                      className={`chip border ${f.visitDays.includes(d) ? 'bg-primary text-white border-primary' : 'bg-white text-primary border-stone-200'}`}
                      onClick={() => setF({ ...f, visitDays: f.visitDays.includes(d) ? f.visitDays.filter(x => x !== d) : [...f.visitDays, d] })}>
                      {d}
                    </button>
                  ))}
                </div>
              </Field>
              <div className="grid md:grid-cols-3 gap-3">
                <Field label="Duration"><input className="inp" placeholder="e.g. 90 days, reassess" value={f.duration} onChange={e => setF({ ...f, duration: e.target.value })} /></Field>
                <Field label="Effective date"><input className="inp" type="date" value={f.effectiveDate} onChange={e => setF({ ...f, effectiveDate: e.target.value })} /></Field>
                <Field label="Target date"><input className="inp" type="date" value={f.targetDate} onChange={e => setF({ ...f, targetDate: e.target.value })} /></Field>
              </div>
              <Field label="Charge-plan note"><textarea className="inp" rows={2} value={f.chargePlanNote} onChange={e => setF({ ...f, chargePlanNote: e.target.value })} /></Field>
              <div>
                <span className="lblu block mb-1">RN / clinician author signature (drawn)</span>
                <SignaturePad padRef={padRef} />
              </div>
              {msg && <p className={`text-sm ${msg.ok ? 'text-emerald-700' : 'text-red-600'}`}>{msg.text}</p>}
              <button className="btn" disabled={busy} onClick={save}>
                <i className="ti ti-writing-sign" />{busy ? 'Saving…' : (cp ? `Sign & save v${cp.version + 1}` : 'Sign & save v1 — unlocks the client portal plan')}
              </button>
              <p className="text-[11px] text-stone-400">Saving writes the versioned plan to the client record (portal + co-sign unlock) and files the authored PDF to OpenEMR. The final signed PDF — with both signatures — is emitted when the client co-signs in their portal.</p>
            </div>
          </div>
        </div>
      );
    };

    // ── Enrollment checklist tab (Scope E) ──
    const ChecklistTab = ({ patient, onActivated }) => {
      const [data, setData] = useState(null);
      const [busy, setBusy] = useState(''); const [msg, setMsg] = useState(null);
      const load = useCallback(() => { api.checklist(patient.id).then(setData).catch(e => setMsg({ ok: false, text: e.message })); }, [patient.id]);
      useEffect(load, [load]);
      if (!data) return <p className="text-sm text-stone-500 p-4">Loading…</p>;
      const mark = (key, done) => {
        setBusy(key);
        api.markStep(patient.id, key, done).then(load).catch(e => setMsg({ ok: false, text: e.message })).finally(() => setBusy(''));
      };
      const activate = () => {
        setBusy('activate'); setMsg(null);
        api.activate(patient.id)
          .then(r => { setMsg({ ok: true, text: r.message }); load(); onActivated && onActivated(); })
          .catch(e => setMsg({ ok: false, text: e.data && e.data.missing ? `${e.message}: ${e.data.missing.join(' · ')}` : e.message }))
          .finally(() => setBusy(''));
      };
      return (
        <div className="max-w-2xl">
          <div className="card">
            <div className="card-h"><h2>Clinical enrollment sequence</h2>
              {data.activated
                ? <span className="chip bg-emerald-50 text-emerald-700">ACTIVATED {fmtDate(data.activatedAt)}</span>
                : <span className="chip bg-amber-50 text-amber-800">{data.steps.filter(s => s.done).length}/{data.steps.length} complete</span>}
            </div>
            <div className="p-4">
              {data.steps.map(s => (
                <div key={s.key} className="flex items-start justify-between gap-3 py-3 border-b border-stone-100 last:border-0">
                  <div className="flex items-start gap-2.5">
                    <i className={`ti mt-0.5 text-lg ${s.done ? 'ti-circle-check text-emerald-600' : 'ti-circle text-stone-300'}`} />
                    <div>
                      <div className="font-semibold text-[13.5px]">{s.label}</div>
                      <div className="text-xs text-stone-500">
                        {s.done ? [s.by, s.at && fmtTs(s.at)].filter(Boolean).join(' · ') || 'Done' : (s.by || 'Pending')}
                      </div>
                    </div>
                  </div>
                  {s.kind === 'manual' && !data.activated && (
                    <button className="btn ghost !py-1 !px-2.5 text-xs" disabled={busy === s.key}
                      onClick={() => mark(s.key, !s.done)}>
                      {s.done ? 'Un-mark' : 'Mark done'}
                    </button>
                  )}
                </div>
              ))}
              {msg && <p className={`text-sm mt-3 ${msg.ok ? 'text-emerald-700' : 'text-red-600'}`}>{msg.text}</p>}
              {!data.activated && (
                <button className="btn gold mt-4" disabled={!data.allDone || busy === 'activate'} onClick={activate}>
                  <i className="ti ti-rosette-discount-check" />{busy === 'activate' ? 'Activating…' : 'ACTIVATE IHPC enrollment'}
                </button>
              )}
              <p className="text-[11px] text-stone-400 mt-2">Payer verification is a manual mark until B1 (Availity eligibility) lands. Records/ROI, initial visit, care plan, and consents derive from the record and cannot be hand-set.</p>
            </div>
          </div>
        </div>
      );
    };

    // ── Session 4.2 — Clinical scheduling (OpenEMR-tied) ──
    // OpenEMR is the appointment ledger; every view below renders its LIVE
    // rows. Cancelled slots stay visible (tombstone swap — never a hard
    // delete); double-booking is rejected server-side against OpenEMR.

    const DURATIONS = [15, 30, 45, 60, 90, 120];

    // Create / reschedule form. On 409 APPOINTMENT_CONFLICT the server's
    // specific message (which slot, with whom) is shown verbatim.
    const AppointmentModal = ({ mode, appt, patients, providersData, defaultDate, defaultProviderId, onClose, onSaved }) => {
      const isRes = mode === 'reschedule';
      const linkable = (patients || []).filter(p => p.openEmrPatientId);
      const [f, setF] = useState({
        clientId: isRes ? (appt.clientId || '') : (linkable.length === 1 ? linkable[0].id : ''),
        providerId: isRes ? appt.providerId : (defaultProviderId || (providersData && providersData.myProviderId) || ''),
        date: isRes ? appt.date : (defaultDate || todayYmd()),
        startTime: isRes ? appt.startTime : '09:00',
        durationMinutes: isRes ? (appt.durationMinutes || 30) : 30,
        title: isRes ? appt.title : 'Clinical visit',
        location: (isRes && appt.location) || 'home',
        notes: (isRes && appt.notes) || ''
      });
      const [busy, setBusy] = useState(false); const [err, setErr] = useState('');
      const canPickProvider = providersData && providersData.isAdmin;
      const submit = () => {
        setErr('');
        if (!isRes && !f.clientId) { setErr('Pick a patient.'); return; }
        setBusy(true);
        const body = { providerId: f.providerId, date: f.date, startTime: f.startTime,
          durationMinutes: Number(f.durationMinutes), title: f.title, location: f.location, notes: f.notes };
        (isRes ? api.rescheduleAppointment(appt.eid, body) : api.createAppointment(f.clientId, body))
          .then(r => onSaved(r))
          .catch(e => { setErr(e.message); setBusy(false); });
      };
      return (
        <div className="fixed inset-0 bg-black/40 z-40 flex items-start justify-center p-4 overflow-y-auto" onClick={onClose}>
          <div className="card w-full max-w-lg mt-10" onClick={e => e.stopPropagation()}>
            <div className="card-h"><h2>{isRes ? `Reschedule — ${appt.patientName || 'appointment'}` : 'New appointment'}</h2>
              <button className="text-stone-400" onClick={onClose}><i className="ti ti-x" /></button>
            </div>
            <div className="p-4 grid gap-3">
              {!isRes && (
                <Field label="Patient (IHPC, linked to OpenEMR)">
                  <select className="inp" value={f.clientId} onChange={e => setF({ ...f, clientId: e.target.value })}>
                    <option value="">— select —</option>
                    {linkable.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                  </select>
                  {linkable.length === 0 && <p className="text-xs text-amber-700 mt-1">No linked patients yet — link a patient to OpenEMR from their chart first.</p>}
                </Field>
              )}
              <Field label="Provider">
                {canPickProvider ? (
                  <select className="inp" value={f.providerId} onChange={e => setF({ ...f, providerId: e.target.value })}>
                    <option value="">— select —</option>
                    {(providersData.providers || []).map(p => <option key={p.id} value={p.id}>{p.name} (id {p.id})</option>)}
                  </select>
                ) : (
                  <input className="inp" disabled value={(providersData && (providersData.providers || []).filter(p => p.id === f.providerId).map(p => p.name)[0]) || `Provider ${f.providerId || '—'}`} />
                )}
              </Field>
              <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                <Field label="Date"><input className="inp" type="date" value={f.date} onChange={e => setF({ ...f, date: e.target.value })} /></Field>
                <Field label="Start"><input className="inp" type="time" value={f.startTime} onChange={e => setF({ ...f, startTime: e.target.value })} /></Field>
                <Field label="Duration">
                  <select className="inp" value={f.durationMinutes} onChange={e => setF({ ...f, durationMinutes: e.target.value })}>
                    {DURATIONS.map(d => <option key={d} value={d}>{d} min</option>)}
                  </select>
                </Field>
              </div>
              <div className="grid md:grid-cols-2 gap-3">
                <Field label="Visit type / title"><input className="inp" value={f.title} onChange={e => setF({ ...f, title: e.target.value })} placeholder="e.g. Initial H&P, Follow-up" /></Field>
                <Field label="Location">
                  <select className="inp" value={f.location} onChange={e => setF({ ...f, location: e.target.value })}>
                    <option value="home">Home visit</option><option value="telehealth">Telehealth</option><option value="office">Office</option>
                  </select>
                </Field>
              </div>
              <Field label="Notes"><textarea className="inp" rows={2} value={f.notes} onChange={e => setF({ ...f, notes: e.target.value })} /></Field>
              {err && <p className="text-red-600 text-sm">{err}</p>}
              <div className="flex gap-2 justify-end">
                <button className="btn ghost" onClick={onClose}>Close</button>
                <button className="btn" disabled={busy} onClick={submit}>
                  {busy ? 'Saving to OpenEMR…' : (isRes ? 'Reschedule' : 'Book appointment')}
                </button>
              </div>
              {isRes && <p className="text-[11px] text-stone-400">The original slot stays on the calendar as a cancelled entry — nothing is deleted.</p>}
            </div>
          </div>
        </div>
      );
    };

    // Detail + actions for one appointment (calendar block or chart row).
    const AppointmentDetail = ({ appt: apptProp, providers, onClose, onChanged, onOpenChart, onReschedule, onDocument }) => {
      const [cancelOpen, setCancelOpen] = useState(false);
      const [reason, setReason] = useState('');
      const [busy, setBusy] = useState(''); const [err, setErr] = useState('');
      // The calendar list omits notes/location (7.0.4 list quirk) — hydrate.
      const [hydrated, setHydrated] = useState(null);
      useEffect(() => {
        setHydrated(null);
        api.appointmentDetail(apptProp.eid)
          .then(r => setHydrated(r.appointment))
          .catch(() => {});
      }, [apptProp.eid]);
      const appt = hydrated ? { ...apptProp, ...hydrated, clientId: hydrated.clientId || apptProp.clientId } : apptProp;
      const provider = (providers || []).filter(p => p.id === appt.providerId).map(p => p.name)[0] || `Provider ${appt.providerId}`;
      const active = appt.state !== 'cancelled';
      const run = (label, fn) => { setBusy(label); setErr('');
        fn().then(r => onChanged(r)).catch(e => { setErr(e.message); setBusy(''); }); };
      return (
        <div className="fixed inset-0 bg-black/40 z-40 flex items-start justify-center p-4 overflow-y-auto" onClick={onClose}>
          <div className="card w-full max-w-md mt-10" onClick={e => e.stopPropagation()}>
            <div className="card-h"><h2>{appt.title}</h2><StateChip state={appt.state} /></div>
            <div className="p-4 text-sm grid gap-1.5">
              <div><b>{appt.patientName || 'Patient'}</b>{appt.clientId ? '' : ' (not an app client)'}</div>
              <div>{fmtDayLabel(appt.date)} · {fmt12h(appt.startTime)}–{fmt12h(appt.endTime)} ({appt.durationMinutes} min)</div>
              <div className="text-stone-500">{provider} · {LOCATION_LABELS[appt.location] || 'Home visit'}</div>
              {appt.encounterUuid && <div className="text-emerald-700 text-xs">Encounter documented: {String(appt.encounterUuid).slice(0, 8)}…</div>}
              {appt.notes && <div className="text-xs text-stone-500 whitespace-pre-wrap border-t border-stone-100 pt-1.5 mt-1">{appt.notes}</div>}
              {err && <p className="text-red-600 text-xs">{err}</p>}
              {active && !cancelOpen && (
                <div className="flex flex-wrap gap-2 mt-2">
                  {!appt.encounterUuid && appt.clientId && onDocument &&
                    <button className="btn gold !py-1.5" onClick={() => onDocument(appt)}><i className="ti ti-stethoscope" />Document visit</button>}
                  {onReschedule && <button className="btn ghost !py-1.5" onClick={() => onReschedule(appt)}><i className="ti ti-calendar-time" />Reschedule</button>}
                  <button className="btn ghost !py-1.5" onClick={() => setCancelOpen(true)}><i className="ti ti-calendar-cancel" />Cancel…</button>
                  {['needs_documentation', 'scheduled'].includes(appt.state) &&
                    <button className="btn ghost !py-1.5" disabled={busy === 'noshow'} onClick={() => run('noshow', () => api.markNoShow(appt.eid))}>
                      <i className="ti ti-user-x" />{busy === 'noshow' ? '…' : 'No-show'}</button>}
                  {appt.clientId && onOpenChart &&
                    <button className="btn ghost !py-1.5" onClick={() => onOpenChart(appt.clientId)}><i className="ti ti-folder-open" />Open chart</button>}
                </div>
              )}
              {cancelOpen && (
                <div className="mt-2 grid gap-2">
                  <Field label="Cancellation reason (required — kept on the calendar entry)">
                    <textarea className="inp" rows={2} value={reason} onChange={e => setReason(e.target.value)} />
                  </Field>
                  <div className="flex gap-2 justify-end">
                    <button className="btn ghost !py-1.5" onClick={() => setCancelOpen(false)}>Back</button>
                    <button className="btn !py-1.5" disabled={!reason.trim() || busy === 'cancel'}
                      onClick={() => run('cancel', () => api.cancelAppointment(appt.eid, reason.trim()))}>
                      {busy === 'cancel' ? 'Cancelling…' : 'Confirm cancellation'}
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    // Greedy lane assignment so overlapping blocks (e.g. an active row next to
    // a cancelled tombstone in the same slot) render side by side.
    const laneify = (appts) => {
      const sorted = [...appts].sort((a, b) => timeMins(a.startTime) - timeMins(b.startTime));
      const laneEnds = [];
      const out = sorted.map(a => {
        const start = timeMins(a.startTime); const end = timeMins(a.endTime || a.startTime) || start + 30;
        let lane = laneEnds.findIndex(e => e <= start);
        if (lane === -1) { lane = laneEnds.length; laneEnds.push(end); } else laneEnds[lane] = end;
        return { ...a, _lane: lane };
      });
      const lanes = Math.max(1, laneEnds.length);
      return out.map(a => ({ ...a, _lanes: lanes }));
    };

    const GRID_START = 7 * 60, GRID_END = 19 * 60, PX_PER_MIN = 0.8;

    const DayColumn = ({ ymd, appts, onPick }) => {
      const dayAppts = laneify(appts.filter(a => a.date === ymd));
      const hours = []; for (let h = 7; h < 19; h++) hours.push(h);
      return (
        <div className="flex-1 min-w-[130px] border-l border-stone-200 relative" style={{ height: (GRID_END - GRID_START) * PX_PER_MIN }}>
          {hours.map(h => (
            <div key={h} className="absolute w-full border-t border-stone-100 text-[9px] text-stone-300 pl-1"
              style={{ top: (h * 60 - GRID_START) * PX_PER_MIN }}>{((h + 11) % 12) + 1}{h >= 12 ? 'p' : 'a'}</div>
          ))}
          {dayAppts.map(a => {
            const top = Math.max(0, (timeMins(a.startTime) - GRID_START) * PX_PER_MIN);
            const height = Math.max(18, (Math.max(15, a.durationMinutes || 30)) * PX_PER_MIN);
            const cancelled = a.state === 'cancelled';
            const colors = cancelled ? 'bg-stone-100 border-stone-300 text-stone-400'
              : a.state === 'documented' ? 'bg-emerald-50 border-emerald-500 text-emerald-900'
              : a.state === 'no_show' ? 'bg-red-50 border-red-400 text-red-800'
              : a.state === 'needs_documentation' ? 'bg-amber-50 border-amber-500 text-amber-900'
              : 'bg-primary-50 border-primary text-primary-700';
            return (
              <div key={a.eid}
                className={`absolute rounded-md border-l-4 px-1.5 py-0.5 text-[10.5px] leading-tight cursor-pointer overflow-hidden ${colors}`}
                style={{ top, height, left: `${(a._lane / a._lanes) * 100}%`, width: `${100 / a._lanes}%` }}
                onClick={() => onPick(a)} title={`${a.title} — ${a.patientName || ''}`}>
                <div className={`font-bold truncate ${cancelled ? 'line-through' : ''}`}>{fmt12h(a.startTime)} {a.patientName || a.title}</div>
                <div className="truncate">{a.title}{a.location === 'telehealth' ? ' · 📹' : ''}</div>
              </div>
            );
          })}
        </div>
      );
    };

    const ScheduleView = ({ user, patients, onOpenChart, onDocument }) => {
      const [providersData, setProvidersData] = useState(null);
      const [mode, setMode] = useState('week');
      const [anchor, setAnchor] = useState(todayYmd());
      const [providerFilter, setProviderFilter] = useState('');
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      const [picked, setPicked] = useState(null);
      const [modal, setModal] = useState(null); // {mode, appt?}

      useEffect(() => { api.providers().then(setProvidersData).catch(e => setErr({ message: e.message, code: e.data && e.data.code })); }, []);
      const from = mode === 'day' ? anchor : mondayOf(anchor);
      const to = mode === 'day' ? anchor : addDaysYmd(mondayOf(anchor), 6);
      const load = useCallback(() => {
        const params = { from, to };
        if (providerFilter) params.providerId = providerFilter;
        api.appointments(params).then(r => { setData(r); setErr(null); })
          .catch(e => { setData(null); setErr({ message: e.message, code: e.data && e.data.code }); });
      }, [from, to, providerFilter]);
      useEffect(load, [load]);

      const days = mode === 'day' ? [anchor] : [0, 1, 2, 3, 4, 5, 6].map(i => addDaysYmd(from, i));
      const appts = (data && data.appointments) || [];
      const changed = () => { setPicked(null); setModal(null); load(); };
      const isAdmin = providersData && providersData.isAdmin;

      if (err && err.code === 'PROVIDER_NOT_MAPPED') {
        return (
          <div className="p-6 lg:p-10 max-w-xl">
            <div className="card p-6 text-center">
              <i className="ti ti-calendar-question text-4xl text-accent" />
              <h2 className="serif text-xl text-primary font-semibold mt-2">Calendar not connected yet</h2>
              <p className="text-sm text-stone-500 mt-2">{err.message}</p>
            </div>
          </div>
        );
      }
      return (
        <div className="p-4 lg:p-7">
          <div className="flex flex-wrap items-center gap-2 mb-4">
            <div className="flex rounded-lg border border-stone-200 overflow-hidden">
              <button className={`px-3 py-1.5 text-xs font-semibold ${mode === 'day' ? 'bg-primary text-white' : 'bg-white text-primary'}`} onClick={() => setMode('day')}>Day</button>
              <button className={`px-3 py-1.5 text-xs font-semibold ${mode === 'week' ? 'bg-primary text-white' : 'bg-white text-primary'}`} onClick={() => setMode('week')}>Week</button>
            </div>
            <div className="flex items-center gap-1">
              <button className="btn ghost !px-2 !py-1.5" onClick={() => setAnchor(addDaysYmd(anchor, mode === 'day' ? -1 : -7))}><i className="ti ti-chevron-left" /></button>
              <button className="btn ghost !px-2.5 !py-1.5 text-xs" onClick={() => setAnchor(todayYmd())}>Today</button>
              <button className="btn ghost !px-2 !py-1.5" onClick={() => setAnchor(addDaysYmd(anchor, mode === 'day' ? 1 : 7))}><i className="ti ti-chevron-right" /></button>
            </div>
            <div className="serif text-lg text-primary font-semibold">
              {mode === 'day' ? fmtDayLabel(anchor) : `${fmtDayLabel(from)} – ${fmtDayLabel(to)}`}
            </div>
            <div className="ml-auto flex items-center gap-2">
              {isAdmin && (
                <select className="inp !w-auto text-xs" value={providerFilter} onChange={e => setProviderFilter(e.target.value)}>
                  <option value="">All providers</option>
                  {(providersData.providers || []).map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
              )}
              {!isAdmin && providersData && (
                <span className="chip bg-primary-50 text-primary">
                  {(providersData.providers || []).filter(p => p.id === providersData.myProviderId).map(p => p.name)[0] || 'My calendar'}
                </span>
              )}
              <button className="btn gold" onClick={() => setModal({ mode: 'create' })}><i className="ti ti-calendar-plus" />New appointment</button>
            </div>
          </div>

          {providersData && providersData.degraded && (
            <p className="text-[11px] text-amber-700 mb-2"><i className="ti ti-alert-triangle mr-1" />{providersData.notice}</p>
          )}
          {err && <p className="text-red-600 text-sm mb-3">{err.message}</p>}
          {!err && data === null && <p className="text-sm text-stone-500">Loading calendar from OpenEMR…</p>}
          {data !== null && (
            <div className="card overflow-x-auto">
              <div className="flex border-b border-stone-200 bg-cream sticky top-0">
                <div className="w-0" />
                {days.map(d => (
                  <div key={d} className={`flex-1 min-w-[130px] text-center py-2 text-xs font-bold ${d === todayYmd() ? 'text-accent' : 'text-primary'}`}>{fmtDayLabel(d)}</div>
                ))}
              </div>
              <div className="flex">
                {days.map(d => <DayColumn key={d} ymd={d} appts={appts} onPick={setPicked} />)}
              </div>
              {appts.length === 0 && (
                <div className="text-center py-8 border-t border-stone-100">
                  <i className="ti ti-calendar-smile text-3xl text-accent" />
                  <p className="text-sm text-stone-500 mt-1">No appointments {mode === 'day' ? 'this day' : 'this week'}{providerFilter ? ' for this provider' : ''}.</p>
                  <p className="text-xs text-stone-400">Book one with “New appointment” — it goes straight onto the OpenEMR calendar.</p>
                </div>
              )}
            </div>
          )}

          {picked && (
            <AppointmentDetail appt={picked} providers={providersData && providersData.providers}
              onClose={() => setPicked(null)} onChanged={changed}
              onOpenChart={onOpenChart}
              onReschedule={(a) => { setPicked(null); setModal({ mode: 'reschedule', appt: a }); }}
              onDocument={(a) => { setPicked(null); onDocument(a); }} />
          )}
          {modal && (
            <AppointmentModal mode={modal.mode} appt={modal.appt} patients={patients}
              providersData={providersData} defaultDate={anchor}
              defaultProviderId={providerFilter || (providersData && providersData.myProviderId)}
              onClose={() => setModal(null)} onSaved={changed} />
          )}
        </div>
      );
    };

    // Follow-up visit documented from an appointment → Encounter + note in
    // OpenEMR, linked back to the appointment.
    const FollowUpModal = ({ patient, appt, onClose, onSaved }) => {
      const [f, setF] = useState({ reason: appt ? appt.title : '', subjective: '', objective: '', assessment: '', plan: '' });
      const [busy, setBusy] = useState(false); const [err, setErr] = useState('');
      const submit = () => {
        setBusy(true); setErr('');
        api.followUp(patient.id, { ...f, appointmentEid: appt ? appt.eid : undefined })
          .then(r => onSaved(r)).catch(e => { setErr(e.message); setBusy(false); });
      };
      return (
        <div className="fixed inset-0 bg-black/40 z-40 flex items-start justify-center p-4 overflow-y-auto" onClick={onClose}>
          <div className="card w-full max-w-lg mt-10" onClick={e => e.stopPropagation()}>
            <div className="card-h"><h2>Document follow-up visit</h2><button className="text-stone-400" onClick={onClose}><i className="ti ti-x" /></button></div>
            <div className="p-4 grid gap-3">
              {appt && <p className="text-xs text-stone-500">From appointment: {fmtDayLabel(appt.date)} {fmt12h(appt.startTime)} — the Encounter links back to it.</p>}
              <Field label="Visit reason"><input className="inp" value={f.reason} onChange={e => setF({ ...f, reason: e.target.value })} /></Field>
              <Field label="Subjective"><textarea className="inp" rows={2} value={f.subjective} onChange={e => setF({ ...f, subjective: e.target.value })} /></Field>
              <Field label="Objective"><textarea className="inp" rows={2} value={f.objective} onChange={e => setF({ ...f, objective: e.target.value })} /></Field>
              <Field label="Assessment"><textarea className="inp" rows={2} value={f.assessment} onChange={e => setF({ ...f, assessment: e.target.value })} /></Field>
              <Field label="Plan"><textarea className="inp" rows={2} value={f.plan} onChange={e => setF({ ...f, plan: e.target.value })} /></Field>
              {err && <p className="text-red-600 text-sm">{err}</p>}
              <div className="flex gap-2 justify-end">
                <button className="btn ghost" onClick={onClose}>Close</button>
                <button className="btn" disabled={busy || !f.reason.trim()} onClick={submit}>{busy ? 'Writing to OpenEMR…' : 'Sign & write encounter'}</button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // Chart tab: this patient's upcoming + past appointments with
    // documented / no-show / not-yet-documented state (Scope B).
    const ApptsTab = ({ patient, patients, onDocumentHp }) => {
      const [data, setData] = useState(null);
      const [err, setErr] = useState('');
      const [providersData, setProvidersData] = useState(null);
      const [picked, setPicked] = useState(null);
      const [modal, setModal] = useState(null);
      const [followUp, setFollowUp] = useState(null); // appt | 'plain'
      const load = useCallback(() => {
        api.patientAppointments(patient.id).then(r => { setData(r); setErr(''); }).catch(e => setErr(e.message));
      }, [patient.id]);
      useEffect(load, [load]);
      useEffect(() => { api.providers().then(setProvidersData).catch(() => {}); }, []);
      if (err) return <p className="text-red-600 text-sm p-4">{err}</p>;
      if (!data) return <p className="text-sm text-stone-500 p-4">Loading appointments from OpenEMR…</p>;
      const today = todayYmd();
      const upcoming = data.appointments.filter(a => a.date >= today && a.state === 'scheduled');
      const past = data.appointments.filter(a => !(a.date >= today && a.state === 'scheduled')).reverse();
      const changed = () => { setPicked(null); setModal(null); setFollowUp(null); load(); };
      const documentFrom = (a) => {
        if (!patient.initialVisitAt) onDocumentHp(a.eid);
        else setFollowUp(a);
      };
      const Row = ({ a }) => (
        <div className="flex flex-wrap items-center justify-between gap-2 py-2.5 border-b border-stone-100 last:border-0">
          <div className="cursor-pointer" onClick={() => setPicked(a)}>
            <div className={`font-semibold text-[13px] ${a.state === 'cancelled' ? 'line-through text-stone-400' : ''}`}>
              {fmtDayLabel(a.date)} · {fmt12h(a.startTime)}–{fmt12h(a.endTime)} — {a.title}
            </div>
            <div className="text-xs text-stone-500">{LOCATION_LABELS[a.location] || 'Home visit'}{a.notes ? ` · ${a.notes.slice(0, 60)}` : ''}</div>
          </div>
          <div className="flex items-center gap-1.5">
            <StateChip state={a.state} />
            {!a.encounterUuid && a.state !== 'cancelled' && a.state !== 'no_show' &&
              <button className="btn gold !py-1 !px-2.5 text-xs" onClick={() => documentFrom(a)}>Document</button>}
          </div>
        </div>
      );
      return (
        <div className="max-w-3xl">
          {!data.linked && (
            <div className="card p-5 text-center">
              <i className="ti ti-calendar-off text-3xl text-accent" />
              <p className="text-sm text-stone-500 mt-1">Link this patient to OpenEMR to schedule clinical visits.</p>
            </div>
          )}
          {data.linked && (
            <div>
              <div className="card mb-4">
                <div className="card-h"><h2>Upcoming</h2>
                  <button className="btn gold !py-1.5" onClick={() => setModal({ mode: 'create' })}><i className="ti ti-calendar-plus" />New appointment</button>
                </div>
                <div className="p-4">
                  {upcoming.length === 0 && <p className="text-sm text-stone-400">Nothing scheduled. Book the next visit — it goes straight onto the OpenEMR calendar.</p>}
                  {upcoming.map(a => <Row key={a.eid} a={a} />)}
                </div>
              </div>
              <div className="card">
                <div className="card-h"><h2>Past &amp; other</h2>
                  <button className="btn ghost !py-1.5 text-xs" onClick={() => setFollowUp('plain')}>Document unscheduled visit</button>
                </div>
                <div className="p-4">
                  {past.length === 0 && <p className="text-sm text-stone-400">No appointment history yet.</p>}
                  {past.map(a => <Row key={a.eid} a={a} />)}
                </div>
              </div>
            </div>
          )}
          {picked && (
            <AppointmentDetail appt={{ ...picked, clientId: patient.id }} providers={providersData && providersData.providers}
              onClose={() => setPicked(null)} onChanged={changed}
              onReschedule={(a) => { setPicked(null); setModal({ mode: 'reschedule', appt: a }); }}
              onDocument={(a) => { setPicked(null); documentFrom(a); }} />
          )}
          {modal && (
            <AppointmentModal mode={modal.mode} appt={modal.appt}
              patients={(patients || []).filter(p => p.id === patient.id)}
              providersData={providersData} defaultDate={todayYmd()}
              defaultProviderId={providersData && providersData.myProviderId}
              onClose={() => setModal(null)} onSaved={changed} />
          )}
          {followUp && (
            <FollowUpModal patient={patient} appt={followUp === 'plain' ? null : followUp}
              onClose={() => setFollowUp(null)} onSaved={changed} />
          )}
        </div>
      );
    };

    // ── App shell ──
    const App = () => {
      const [user, setUser] = useState(() => {
        try { return JSON.parse(localStorage.getItem('admin_user') || 'null'); } catch { return null; }
      });
      const [patients, setPatients] = useState(null);
      const [q, setQ] = useState('');
      const [sel, setSel] = useState(null);
      const [chart, setChart] = useState(null);
      const [tab, setTab] = useState('summary');
      const [emrStatus, setEmrStatus] = useState(null);
      const [linking, setLinking] = useState(false);
      const [err, setErr] = useState('');
      const [listOpen, setListOpen] = useState(true);
      const [view, setView] = useState('charts'); // 'charts' | 'schedule' (4.2)
      const [hpApptEid, setHpApptEid] = useState(null); // H&P opened from an appointment

      const loadPatients = useCallback(() => {
        if (!getToken()) return;
        api.patients(q).then(r => { setPatients(r.patients); setErr(''); })
          .catch(e => {
            if (e.code === 'AUTH') setUser(null);
            else setErr(e.message);
          });
      }, [q]);
      useEffect(() => { if (user) { loadPatients(); api.status().then(setEmrStatus).catch(() => {}); } }, [user, loadPatients]);

      const openPatient = (p, opts) => {
        setSel(p); setChart(null); setTab((opts && opts.tab) || 'summary'); setListOpen(false);
        setView('charts'); setHpApptEid((opts && opts.appointmentEid) || null);
        api.chart(p.id).then(setChart).catch(e => setErr(e.message));
      };
      // Calendar → chart navigation (4.2): open the chart, or jump straight
      // into documentation (H&P for a first visit, Appointments tab otherwise).
      const openChartById = (clientId, opts) => {
        const p = (patients || []).find(x => x.id === clientId);
        if (p) openPatient(p, opts);
      };
      const documentFromSchedule = (appt) => {
        const p = (patients || []).find(x => x.id === appt.clientId);
        if (!p) return;
        openPatient(p, p.initialVisitAt ? { tab: 'appts' } : { tab: 'visit', appointmentEid: appt.eid });
      };
      const refreshChart = () => sel && api.chart(sel.id).then(setChart).catch(() => {});
      const link = () => {
        setLinking(true);
        api.link(sel.id, {}).then(() => { refreshChart(); loadPatients(); })
          .catch(e => setErr(e.message)).finally(() => setLinking(false));
      };

      if (!user || !getToken()) return <Login onLogin={setUser} />;

      const tabs = [
        ['summary', 'Chart'], ['appts', 'Appointments'], ['visit', 'Initial Visit (H&P)'],
        ['medrec', 'Med Rec'], ['careplan', 'Care Plan'], ['checklist', 'Enrollment']
      ];
      return (
        <div className="min-h-screen lg:grid lg:grid-cols-[290px_1fr]">
          {/* Patient list */}
          <aside className={`bg-white border-r border-stone-200 ${listOpen ? '' : 'hidden'} lg:block`}>
            <div className="bg-primary text-white px-5 py-4">
              <img src="/brand/logo-mark-transparent.png" alt="" className="h-10 mb-1.5" />
              <div className="text-[9px] tracking-[2px] uppercase text-accent font-bold">Clinical Workspace</div>
            </div>
            <div className="p-3">
              <input className="inp" placeholder="Search patients…" value={q}
                onChange={e => setQ(e.target.value)} onKeyDown={e => e.key === 'Enter' && loadPatients()} />
            </div>
            <div className="px-5 pb-1 lblu">IHPC panel{patients ? ` · ${patients.length}` : ''}</div>
            <div className="overflow-y-auto" style={{ maxHeight: 'calc(100vh - 190px)' }}>
              {patients === null && <p className="text-xs text-stone-400 px-5 py-3">Loading…</p>}
              {patients && patients.length === 0 && <p className="text-xs text-stone-400 px-5 py-3">No IHPC clients yet.</p>}
              {(patients || []).map(p => (
                <div key={p.id}
                  className={`flex items-center gap-3 px-5 py-2.5 border-b border-stone-100 cursor-pointer ${sel && sel.id === p.id ? 'bg-cream border-l-4 border-l-accent' : ''}`}
                  onClick={() => openPatient(p)}>
                  <div className="w-9 h-9 rounded-full bg-creamdeep text-primary flex items-center justify-center font-bold text-[13px] border border-stone-200">{initials(p.name)}</div>
                  <div className="min-w-0">
                    <div className="font-semibold text-[13.5px] truncate">{p.name}</div>
                    <div className="text-[11.5px] text-stone-500">
                      {[p.careTier, p.serviceLine, p.activatedAt ? 'Active' : (p.openEmrPatientId ? 'Linked' : 'Not linked')].filter(Boolean).join(' · ')}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </aside>

          {/* Chart */}
          <main className={`${listOpen ? 'hidden' : ''} lg:block`}>
            <div className="bg-white border-b border-stone-200 px-4 lg:px-7 py-3 flex items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <button className="lg:hidden btn ghost !px-2.5 !py-1.5" onClick={() => setListOpen(true)}><i className="ti ti-users" /></button>
                <div className="serif text-lg text-primary font-semibold">{view === 'schedule' ? 'Schedule' : 'Patient Chart'}</div>
                <div className="flex rounded-lg border border-stone-200 overflow-hidden ml-1">
                  <button className={`px-3 py-1.5 text-xs font-semibold ${view === 'charts' ? 'bg-primary text-white' : 'bg-white text-primary'}`}
                    onClick={() => setView('charts')}><i className="ti ti-folder-open mr-1" />Charts</button>
                  <button className={`px-3 py-1.5 text-xs font-semibold ${view === 'schedule' ? 'bg-primary text-white' : 'bg-white text-primary'}`}
                    onClick={() => { setView('schedule'); setListOpen(false); }}><i className="ti ti-calendar-week mr-1" />Schedule</button>
                </div>
              </div>
              <div className="flex items-center gap-2 text-[11.5px] text-stone-500 bg-cream border border-stone-200 px-3 py-1.5 rounded-full">
                <span className={`w-2 h-2 rounded-full ${emrStatus && emrStatus.connected ? 'bg-emerald-500' : 'bg-red-500'}`} />
                {emrStatus === null ? 'OpenEMR…' : emrStatus.connected ? 'OpenEMR connected' : (emrStatus.configured ? 'OpenEMR unreachable' : 'OpenEMR not configured')}
              </div>
            </div>
            {err && <p className="text-red-600 text-sm px-7 pt-3">{err}</p>}
            {view === 'schedule' && (
              <ScheduleView user={user} patients={patients || []}
                onOpenChart={(clientId) => openChartById(clientId)}
                onDocument={documentFromSchedule} />
            )}
            {view === 'charts' && !sel && <div className="p-10 text-stone-400 text-sm">Select a patient to open their chart, or switch to Schedule for the calendar.</div>}
            {view === 'charts' && sel && (
              <div>
                <div className="bg-white border-b border-stone-200 px-4 lg:px-7 pt-4">
                  <div className="flex items-center gap-4 pb-3">
                    <div className="w-12 h-12 rounded-full bg-accent text-primary flex items-center justify-center font-bold border border-stone-200">{initials(sel.name)}</div>
                    <div>
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className="serif text-xl text-primary font-semibold">{sel.name}</span>
                        <span className="chip bg-primary text-white">{sel.serviceLine}</span>
                        {sel.activatedAt && <span className="chip bg-emerald-50 text-emerald-700">ACTIVATED</span>}
                      </div>
                      <div className="text-xs text-stone-500 flex gap-3 flex-wrap mt-0.5">
                        <span>DOB <b>{chart && chart.demographics.dob ? chart.demographics.dob : '—'}</b></span>
                        <span>Track <b>{(chart && chart.demographics.careTierLabel) || sel.careTierLabel || sel.careTier || '—'}</b></span>
                        <span>OpenEMR <b>{(chart && chart.demographics.openEmrPatientId) ? `${chart.demographics.openEmrPatientId.slice(0, 8)}…` : 'not linked'}</b></span>
                        {chart && chart.demographics.payerType && <span>Payer <b>{chart.demographics.payerType}</b></span>}
                      </div>
                    </div>
                  </div>
                  <div className="flex overflow-x-auto -mb-px">
                    {tabs.map(([k, label]) => (
                      <div key={k} className={`tabbtn ${tab === k ? 'on' : ''}`} onClick={() => setTab(k)}>{label}</div>
                    ))}
                  </div>
                </div>
                <div className="p-4 lg:p-7">
                  {tab === 'summary' && <SummaryTab chart={chart} patient={sel} onLink={link} linking={linking} />}
                  {tab === 'appts' && <ApptsTab patient={sel} patients={patients || []} onDocumentHp={(eid) => { setHpApptEid(eid); setTab('visit'); }} />}
                  {tab === 'visit' && (chart ? <HpTab patient={sel} chart={chart} appointmentEid={hpApptEid} onDone={() => { setHpApptEid(null); refreshChart(); loadPatients(); }} /> : <p className="text-sm text-stone-500">Loading…</p>)}
                  {tab === 'medrec' && <MedRecTab patient={sel} />}
                  {tab === 'careplan' && <CarePlanTab patient={sel} onSaved={loadPatients} />}
                  {tab === 'checklist' && <ChecklistTab patient={sel} onActivated={loadPatients} />}
                </div>
              </div>
            )}
            <footer className="px-7 py-4 text-[10.5px] text-stone-400">
              Authorized users only. This system contains protected health information; all access is logged.
            </footer>
          </main>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
