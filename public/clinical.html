                {reviewing && g.rows.some(d => d.uploadId === reviewing.docId) && (
                  <ChartExtractionReview clientId={clientId} extraction={reviewing}
                    onDone={() => { setReviewing(null); onRefresh && onRefresh(); }}
                    onCancel={() => setReviewing(null)} />
                )}
              </div>
            ))}
          </div>
          {clientId && <AiRecordsExtract clientId={clientId} docs={docs} onRefresh={onRefresh} />}
          {clientId && <ChartScanIn clientId={clientId} onFiled={onRefresh} />}
        </div>
      );
    };

    // ── Chart summary tab ──
    // Place of service, READ-ONLY. Both halves of it — the facility (WHERE)
    // and the encounter type (WHAT) — are set by an admin on the enrollment
    // record, moved there on the owner's instruction 2026-09-23. The owner's
    // 4.5 rule is that a clinician never chooses a POS, and an encounter type
    // that decides one is the same decision; so the chart states what the
    // claim will say and names the screen where it is fixed. It reads the SAME
    // route the enrollment card writes through, so the two cannot drift.
    const PlaceOfServiceCard = ({ patient }) => {
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      useEffect(() => {
        let live = true;
        setData(null); setErr(null);
        api.placeOfService(patient.id)
          .then(d => { if (live) setData(d); })
          .catch(e => { if (live) setErr(e.message); });
        return () => { live = false; };
      }, [patient.id]);
      if (err) return (
        <div className="card mb-4"><div className="card-h"><h2><i className="ti ti-building-hospital mr-1 text-accent" />Place of Service</h2></div>
          <div className="p-4 text-xs text-red-600">{err}</div></div>
      );
      if (!data) return (
        <div className="card mb-4"><div className="card-h"><h2><i className="ti ti-building-hospital mr-1 text-accent" />Place of Service</h2></div>
          <div className="p-4 text-[11px] text-stone-400">Reading…</div></div>
      );
      const assigned = !!data.facilityId;
      const agree = data.agreement || { ok: true };
      const posMissing = assigned && !data.posCode;
      const ok = assigned && !posMissing && data.serviceLocation !== false && agree.ok;
      return (
        <div className="card mb-4">
          <div className="card-h">
            <h2><i className="ti ti-building-hospital mr-1 text-accent" />Place of Service</h2>
            {ok
              ? <span className="chip bg-emerald-50 text-emerald-700">POS {data.posCode}</span>
              : <span className="chip bg-amber-50 text-amber-800">Blocks billing</span>}
          </div>
          <div className="p-4 text-sm grid gap-2">
            {data.degraded && (
              <p className="text-xs text-amber-700"><i className="ti ti-alert-triangle mr-1" />
                {data.reason}. What is shown below is what is on file; it could not be checked against OpenEMR just now.
              </p>
            )}
            <div className="text-xs text-stone-600">
              {assigned
                ? <>Seen at <b>{data.facilityName || `facility ${data.facilityId}`}</b>{data.posCode ? <> · place of service <b>{data.posCode}</b></> : null}.</>
                : <b className="text-amber-800">This patient is not assigned to an OpenEMR facility, so their visits cannot be submitted to billing.</b>}
            </div>
            <div className="text-xs text-stone-600">
              {data.usualLocation
                ? <>Usually seen at <b>{data.usualLocationLabel}</b>. Each visit says where it actually happened, and that is what bills.</>
                : <>No usual location set, so every booking has to say where the visit happens.</>}
            </div>
            {posMissing && !data.degraded && (
              <p className="text-xs text-amber-700"><i className="ti ti-alert-triangle mr-1" />
                "{data.facilityName || `facility ${data.facilityId}`}" has no place-of-service code on its record in OpenEMR.
              </p>
            )}
            {data.serviceLocation === false && (
              <p className="text-xs text-amber-700"><i className="ti ti-alert-triangle mr-1" />
                "{data.facilityName}" is not marked as a Service Location in OpenEMR, so no encounter can be assigned there.
              </p>
            )}
            {!agree.ok && <p className="text-xs text-red-600"><i className="ti ti-alert-triangle mr-1" />{agree.error}</p>}
            <Hint>
              An admin sets both of these on the enrollment record (Enrollment → this client → Place of service).
              It decides the place of service on the claim, so it is not a clinician's pick.
            </Hint>
          </div>
        </div>
      );
    };

    // B1 — eligibility is recorded on the ENROLLMENT record now (owner,
    // 2026-10-19: "run the eligibility through this area, not the clinician
    // EHR area"). The chart keeps the read-only status line (InsuranceCheck)
    // and points billing at the enrollment record.
    const InsurancePointer = ({ patient }) => (
      <div className="card mb-4">
        <div className="card-h"><h2><i className="ti ti-shield-check mr-1 text-accent" />Insurance</h2></div>
        <div className="p-4 text-sm">
          Insurance eligibility is checked and recorded on the enrollment record.{' '}
          <a className="text-accent underline" href={`/admin/enrollment?client=${encodeURIComponent(patient.id)}`}>Open Enrollment</a>
        </div>
      </div>
    );

    // The clinical inbox — what is waiting on a clinician. Every row says WHO
    // it is waiting on, because a count that does not is a number nobody can
    // act on. Whether YOU can act on a row is decided by the server against
    // the same matrix the routes enforce, never re-derived here.
    const INBOX_ICONS = {
      encounter_co_sign: 'ti-writing-sign',
      order_co_sign: 'ti-flask',
      care_plan_co_sign: 'ti-clipboard-heart',
      visit_log_review: 'ti-notes',
      encounter_unsigned: 'ti-file-pencil',
      encounter_awaiting_billing: 'ti-receipt',
      internal_referral: 'ti-arrow-forward-up',
      phone_call: 'ti-phone'
    };
    // 2026-10-12 redesign (owner mockup 7): the same items, filed under
    // All · Co-sign · Orders · Other. The grouping is by KIND only; who may act
    // stays the server's `actionable`, never decided here.
    const INBOX_GROUPS = [
      ['all', 'All', null],
      ['cosign', 'Co-Sign', ['encounter_co_sign', 'care_plan_co_sign']],
      ['orders', 'Orders', ['order_co_sign', 'internal_referral']],
      ['other', 'Other', 'rest']
    ];
    const inboxGroupOf = (kind) => {
      for (const [k, , kinds] of INBOX_GROUPS) if (Array.isArray(kinds) && kinds.includes(kind)) return k;
      return 'other';
    };
    const InboxView = ({ onOpenEncounter, onOpenChart }) => {
      const [data, setData] = useState(null);
      const [err, setErr] = useState('');
      const [mineOnly, setMineOnly] = useState(true);
      const [group, setGroup] = useState('all');
      const [rowErr, setRowErr] = useState({});
      // A referral from the team: completing it needs a note, typed in place.
      const [completing, setCompleting] = useState(null);
      const [doneNote, setDoneNote] = useState('');
      const [rowBusy, setRowBusy] = useState('');
      const load = () => api.inbox().then(r => { setData(r); setErr(''); }).catch(e => setErr(e.message));
      useEffect(() => { load(); }, []);
      if (err) return <div className="p-4 lg:p-7"><div className="card p-4 text-sm text-red-600">{err}</div></div>;
      if (!data) return <div className="p-4 lg:p-7"><div className="card p-6 text-stone-500 text-sm">Loading your inbox…</div></div>;
      const pool = mineOnly ? data.items.filter(i => i.actionable) : data.items;
      const shown = group === 'all' ? pool : pool.filter(i => inboxGroupOf(i.kind) === group);
      const countOf = (g) => g === 'all' ? pool.length : pool.filter(i => inboxGroupOf(i.kind) === g).length;
      const c = data.counts;
      const coSignOrder = (i) => {
        if (!window.confirm('Co-sign this order executed under your standing order?')) return;
        api.coSignOrder(i.id).then(load).catch(e => setRowErr({ [i.id]: e.message }));
      };
      // Every row opens the place where its work is done: an encounter on its
      // note, a care plan on the Care Plan tab, anything else on the chart.
      // A call (2026-10-19) opens as a Phone Call note already filled in, on
      // the chart's Visit tab, where it is saved and signed like any note.
      const documentCall = (i) => {
        setRowBusy(i.id); setRowErr({});
        api.documentCall(i.id).then(r => onOpenChart(r.clientId, { tab: 'visit' }))
          .catch(e => setRowErr({ [i.id]: e.message })).finally(() => setRowBusy(''));
      };
      const dismissCall = (i) => {
        const reason = window.prompt('Why does this call not need a note? (for example: a scheduling call)');
        if (!reason || !reason.trim()) return;
        setRowBusy(i.id); setRowErr({});
        api.dismissCall(i.id, reason.trim()).then(load)
          .catch(e => setRowErr({ [i.id]: e.message })).finally(() => setRowBusy(''));
      };
      const open = (i) => {
        if (i.kind === 'phone_call') return i.actionable ? documentCall(i) : onOpenChart(i.clientId, { tab: 'timeline' });
        if (i.encounterUuid) return onOpenEncounter(i.clientId, i.encounterUuid);
        return onOpenChart(i.clientId, i.kind === 'care_plan_co_sign' ? { tab: 'careplan' } : i.kind === 'internal_referral' ? { tab: 'referrals' } : undefined);
      };
      const referralStep = (i, fn) => {
        setRowBusy(i.id); setRowErr({});
        return fn().then(() => { setCompleting(null); setDoneNote(''); load(); })
          .catch(e => setRowErr({ [i.id]: e.message }))
          .finally(() => setRowBusy(''));
      };
      return (
        <div className="p-4 lg:p-7">
          <div className="flex flex-wrap items-center gap-2 mb-3">
            {c.overdue > 0 && <span className="pill bg-red-50 text-red-700 border-red-200">{c.overdue} overdue</span>}
            <span className="pill bg-amber-50 text-amber-800 border-amber-200">{c.actionable} waiting on you</span>
            <span className="text-[12.5px] text-stone-500">{c.total} in total</span>
            <div className="flex rounded-xl border border-stone-200 overflow-hidden ml-auto bg-white">
              <button className={`px-3 py-1.5 text-[12.5px] font-semibold ${mineOnly ? 'bg-primary text-white' : 'text-primary'}`}
                onClick={() => setMineOnly(true)}>Waiting on Me</button>
              <button className={`px-3 py-1.5 text-[12.5px] font-semibold ${!mineOnly ? 'bg-primary text-white' : 'text-primary'}`}
                onClick={() => setMineOnly(false)}>Everything</button>
            </div>
            <button className="btn ghost !py-1.5" onClick={load} title="Refresh"><i className="ti ti-refresh" /></button>
          </div>
          <div className="flex gap-2 mb-4 overflow-x-auto">
            {INBOX_GROUPS.map(([k, label]) => (
              <button key={k} onClick={() => setGroup(k)}
                className={`px-4 py-1.5 rounded-full text-[13px] font-semibold border whitespace-nowrap ${group === k ? 'bg-[#A9853A] border-[#A9853A] text-white' : 'bg-white border-stone-200 text-primary'}`}>
                {label}{countOf(k) > 0 && <span className="ml-1.5 opacity-80">{countOf(k)}</span>}
              </button>
            ))}
          </div>
          {!shown.length && (
            <div className="card px-6 py-10 text-center">
              <i className="ti ti-inbox text-3xl text-stone-300" />
              <p className="text-sm text-stone-500 mt-2">
                {group !== 'all' ? 'Nothing here right now.'
                  : mineOnly
                    ? (c.total ? `Nothing is waiting on you. ${c.total} item${c.total > 1 ? 's are' : ' is'} waiting on someone else — switch to Everything to see them.`
                               : 'Nothing is waiting on you.')
                    : 'Nothing is waiting on anyone.'}
              </p>
            </div>
          )}
          {shown.length > 0 && (
            <div className="card overflow-hidden">
              {shown.map(i => (
                <div key={`${i.kind}:${i.id}`} className={`flex flex-wrap sm:flex-nowrap items-center gap-3 px-4 py-3.5 border-b border-stone-100 last:border-0 ${i.overdue ? 'bg-red-50/40' : ''}`}>
                  <div className={`w-11 h-11 rounded-xl flex items-center justify-center shrink-0 ${i.overdue ? 'bg-red-50 text-red-600' : 'bg-[#F6EFE2] text-[#9A7430]'}`}>
                    <i className={`ti ${INBOX_ICONS[i.kind] || 'ti-inbox'} text-[20px]`} />
                  </div>
                  <button type="button" className="min-w-0 flex-1 text-left" onClick={() => open(i)}>
                    <div className="text-[14px] font-semibold text-primary">
                      {i.label}
                      {i.overdue && <span className="chip bg-red-50 text-red-700 ml-2">Overdue</span>}
                    </div>
                    <div className="text-[12.5px] text-stone-600">{i.patientName || 'Unknown patient'}</div>
                    <div className="text-[11.5px] text-stone-400">
                      {i.at ? fmtTs(i.at) : 'no date'}{i.dueAt ? ` · due ${fmtTs(i.dueAt)}` : ''}
                    </div>
                    {i.detail && <div className="text-[11.5px] text-stone-500 mt-0.5">{i.detail}</div>}
                  </button>
                  <div className="flex sm:flex-col items-center sm:items-end gap-1.5 shrink-0 w-full sm:w-auto pl-14 sm:pl-0">
                    <span className={`chip whitespace-nowrap ${i.actionable ? 'bg-amber-50 text-amber-800' : 'bg-stone-100 text-stone-500'}`}>
                      {i.actionable ? 'Waiting on you' : `Waiting on ${i.waitingOn}`}
                    </span>
                    <div className="flex gap-1.5 ml-auto sm:ml-0">
                      {i.kind === 'order_co_sign' && i.actionable && (
                        <button className="btn !py-1 !px-2.5 text-[12px] whitespace-nowrap" onClick={() => coSignOrder(i)}><i className="ti ti-writing-sign" />Co-Sign</button>
                      )}
                      {i.kind === 'internal_referral' && i.actionable && i.status === 'ordered' && (
                        <button className="btn !py-1 !px-2.5 text-[12px] whitespace-nowrap" disabled={rowBusy === i.id}
                          onClick={() => referralStep(i, () => api.acceptReferral(i.id))}>Accept</button>
                      )}
                      {i.kind === 'internal_referral' && i.actionable && completing !== i.id && (
                        <button className="btn ghost !py-1 !px-2.5 text-[12px] whitespace-nowrap"
                          onClick={() => { setCompleting(i.id); setDoneNote(''); }}>Mark Complete</button>
                      )}
                      {i.kind === 'phone_call' && i.actionable && (
                        <button className="btn !py-1 !px-2.5 text-[12px] whitespace-nowrap" disabled={rowBusy === i.id} onClick={() => documentCall(i)}>
                          <i className="ti ti-file-pencil" />{i.status === 'started' ? 'Resume Note' : 'Document Call'}</button>
                      )}
                      {i.kind === 'phone_call' && i.actionable && i.status === 'waiting' && (
                        <button className="btn ghost !py-1 !px-2.5 text-[12px] whitespace-nowrap" disabled={rowBusy === i.id} onClick={() => dismissCall(i)}>Dismiss</button>
                      )}
                      {!(i.kind === 'phone_call' && i.actionable) && (
                        <button className="btn ghost !py-1 !px-2.5 text-[12px] whitespace-nowrap" onClick={() => open(i)}>
                          {i.encounterUuid ? 'Open Encounter' : i.kind === 'care_plan_co_sign' ? 'Open Care Plan' : 'Open Chart'}
                        </button>
                      )}
                    </div>
                  </div>
                  {completing === i.id && (
                    <div className="w-full grid gap-2 pl-14">
                      <textarea className="inp" rows={2} placeholder="What did you do? The referring clinician reads this." value={doneNote} onChange={e => setDoneNote(e.target.value)} />
                      <div className="flex justify-end gap-2">
                        <button className="btn ghost !py-1 !px-2.5 text-[12px]" onClick={() => setCompleting(null)}>Back</button>
                        <button className="btn !py-1 !px-2.5 text-[12px]" disabled={rowBusy === i.id || !doneNote.trim()}
                          onClick={() => referralStep(i, () => api.completeReferral(i.id, doneNote.trim()))}>Complete Referral</button>
                      </div>
                    </div>
                  )}
                  {rowErr[i.id] && <div className="w-full text-[11.5px] text-red-600">{rowErr[i.id]}</div>}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    };

    // ── Session 4.12 — the persistent patient banner (Scope C) ─────────────
    // Never a tab. It sits above every chart tab and every encounter step, so
    // name, age, DOB, MRN, MBI and allergies are on screen at a front door
    // instead of buried a click away. Every value is SERVED — the page decides
    // no clinical fact of its own, so the strip cannot drift from the record.
    //
    // The allergy strip has three states and they are three different
    // sentences. An empty strip must never be what says "none on file", and a
    // strip reading "No known allergies" when the list simply failed to load is
    // worse still: it tells a clinician something untrue at the moment it
    // matters most. See clinicalRepository.buildAllergyStrip.
    const AllergyStrip = ({ allergies }) => {
      const a = allergies || { state: 'unavailable', rows: [], reason: 'No allergy information was returned.' };
      if (a.state === 'listed') {
        return (
          <div className="bg-red-50 border border-red-200 text-red-800 rounded-lg px-3 py-1.5 text-[12.5px] font-semibold flex items-start gap-2">
            <i className="ti ti-alert-triangle-filled mt-[1px] shrink-0" />
            <span className="min-w-0">
              {a.rows.join(' · ').toUpperCase()}
              {a.source === 'intake' && <span className="font-normal normal-case"> — reported at intake, not reconciled</span>}
            </span>
          </div>
        );
      }
      if (a.state === 'none_known') {
        return (
          <div className="bg-stone-50 border border-stone-200 text-stone-600 rounded-lg px-3 py-1.5 text-[12.5px] font-semibold flex items-center gap-2">
            <i className="ti ti-circle-check" />No known allergies
          </div>
        );
      }
      return (
        <div className="bg-amber-50 border border-amber-300 text-amber-900 rounded-lg px-3 py-1.5 text-[12.5px] flex items-start gap-2">
          <i className="ti ti-alert-circle mt-[1px] shrink-0" />
          <span className="min-w-0"><b>Allergies unknown.</b> {a.reason}</span>
        </div>
      );
    };

    // B1 D4 — whether the primary coverage has been checked. Verified shows the
    // payer and the date; unverified says so; a MISMATCH shows both values and
    // never collapses to one. The age is shown, never enforced. The words come
    // from the server (insuranceEligibility.verificationState); this only
    // colours them.
    const InsuranceCheck = ({ v }) => {
      if (!v || !v.status) return null;
      const tone = v.status === 'verified' ? 'bg-emerald-50 text-emerald-800'
        : v.status === 'mismatch' || v.status === 'inactive' ? 'bg-red-50 text-red-800' : 'bg-amber-50 text-amber-800';
      return (
        <span className={`inline-block mt-1 rounded px-1.5 py-0.5 text-[11.5px] ${tone}`}>
          {v.status === 'mismatch' && v.recorded && v.found
            ? <><b>Coverage mismatch.</b> Intake: {v.recorded.planType} ({v.recorded.payer}). Check found: {v.found.planType} ({v.found.payer}).</>
            : v.label}
        </span>
      );
    };

    const BannerFact = ({ label, value, children }) => (
      <div className="min-w-0">
        <div className="lblu">{label}</div>
        <div className="text-[12.5px] text-stone-700 break-words">{children || value || '—'}</div>
      </div>
    );

    // The home-visit standing facts (Scope F4). Read from the PATIENT record —
    // never from an encounter — so they survive to the next visit and to the
    // covering clinician who has never been to the house.
    const HomeVisitFacts = ({ homeVisit, fields }) => {
      const hv = homeVisit || {};
      const rows = (fields || []).filter(([k]) => hv[k]);
      if (!rows.length) return null;
      return (
        <div className="bg-cream border border-creamdeep rounded-lg p-3 grid grid-cols-1 sm:grid-cols-2 gap-3">
          {rows.map(([k, label]) => (
            <div key={k} className="min-w-0">
              <div className="lblu">{label}</div>
              <div className="text-[12.5px] text-stone-700 break-words">{hv[k]}</div>
            </div>
          ))}
        </div>
      );
    };

    const HomeVisitEditor = ({ patient, homeVisit, fields, onSaved }) => {
      const [open, setOpen] = useState(false);
      const [f, setF] = useState(homeVisit || {});
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState(null);
      useEffect(() => { setF(homeVisit || {}); }, [homeVisit]);
      const save = () => {
        setBusy(true); setMsg(null);
        api.saveHomeVisit(patient.id, f)
          .then(r => { setMsg({ ok: true, text: r.message }); setOpen(false); onSaved && onSaved(r.homeVisit); })
          .catch(e => setMsg({ ok: false, text: e.message }))
          .finally(() => setBusy(false));
      };
      if (!open) {
        return (
          <div>
            <button className="btn ghost !py-1 !px-2.5 text-[11.5px]" onClick={() => setOpen(true)}>
              <i className="ti ti-home-edit" />{(fields || []).some(([k]) => (homeVisit || {})[k]) ? 'Edit Home Notes' : 'Add Home Notes'}
            </button>
            {msg && <p className={`text-[11.5px] mt-1 ${msg.ok ? 'text-emerald-700' : 'text-red-600'}`}>{msg.text}</p>}
          </div>
        );
      }
      return (
        <div className="border border-creamdeep rounded-lg p-3 bg-white">
          <p className="text-[11.5px] text-stone-500 mb-2">
            These stay on the patient, so they are here at the next visit and for whoever covers. Record what changed
            <i> today</i> in the visit note instead.
          </p>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {(fields || []).map(([k, label]) => (
              <Field key={k} label={label}>
                <textarea className="inp" rows="2" value={f[k] || ''} onChange={e => setF({ ...f, [k]: e.target.value })} />
              </Field>
            ))}
          </div>
          <div className="flex gap-2 mt-3">
            <button className="btn gold !py-1.5 !px-3 text-xs" disabled={busy} onClick={save}>{busy ? 'Saving…' : 'Save'}</button>
            <button className="btn ghost !py-1.5 !px-3 text-xs" disabled={busy} onClick={() => { setF(homeVisit || {}); setOpen(false); }}>Cancel</button>
          </div>
          {msg && !msg.ok && <p className="text-[11.5px] mt-1 text-red-600">{msg.text}</p>}
        </div>
      );
    };

    // Portal P1: republish problems, allergies and medications to the patient's
    // portal outside a visit. The portal never reads OpenEMR; this is how a
    // list changed between visits reaches it. Module scope (input-focus rule).
    const RefreshPortalChart = ({ clientId }) => {
      const [state, setState] = useState({ busy: false, msg: null, ok: true });
      const go = () => {
        setState({ busy: true, msg: null, ok: true });
        api.refreshPortalChart(clientId)
          .then(r => setState({ busy: false, msg: r.message, ok: true }))
          .catch(e => setState({ busy: false, msg: e.message, ok: false }));
      };
      return (
        <div className="mt-1.5 flex flex-wrap items-center gap-2">
          <button className="text-[11.5px] text-primary font-semibold flex items-center gap-1" disabled={state.busy} onClick={go}>
            <i className="ti ti-world-upload" />{state.busy ? 'Refreshing…' : 'Refresh Portal'}
          </button>
          {state.msg && <span className={`text-[11px] ${state.ok ? 'text-emerald-700' : 'text-red-600'}`}>{state.msg}</span>}
        </div>
      );
    };

    // The Client Information Face Sheet, opened with the token and handed to
    // the browser as a blob (never a link carrying the session). A pop-up opened
    // after an await is blocked on some phones, so a download is the fallback.
    const FaceSheetItem = ({ clientId, onDone }) => {
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState('');
      const open = async () => {
        setBusy(true); setErr('');
        try {
          const res = await fetch(`${API_URL}/api/clinical/patients/${encodeURIComponent(clientId)}/face-sheet.pdf`,
            { headers: { Authorization: `Bearer ${getToken()}` } });
          if (!res.ok) {
            let msg = 'The face sheet could not be opened.';
            try { const j = await res.json(); msg = j.error || msg; } catch (e) { /* non-JSON body */ }
            setErr(msg); return;
          }
          const url = URL.createObjectURL(await res.blob());
          if (!window.open(url, '_blank')) {
            const a = document.createElement('a'); a.href = url; a.download = 'face-sheet.pdf';
            document.body.appendChild(a); a.click(); a.remove();
          }
          setTimeout(() => URL.revokeObjectURL(url), 60000);
          onDone && onDone();
        } catch (e) { setErr('The face sheet could not be opened.'); }
        finally { setBusy(false); }
      };
      return (
        <div>
          <button className="w-full text-left px-3 py-2 rounded-lg text-[13px] text-primary font-semibold hover:bg-cream flex items-center gap-2"
            onClick={open} disabled={busy}>
            <i className="ti ti-id" />{busy ? 'Opening…' : 'Face Sheet'}
          </button>
          {err && <p className="px-3 pb-1 text-[11.5px] text-red-600">{err}</p>}
        </div>
      );
    };

    const PatientBanner = ({ banner, patient, homeVisitFields, visitDraft, onStartVisit, onHomeVisitSaved, onMessage }) => {
      const [open, setOpen] = useState(false);
      const [menu, setMenu] = useState(false);
      const access = useContext(AccessContext);
      const canBill = !!access.canSubmitBilling;
      const b = banner || {};
      const name = b.name || (patient && patient.name) || '—';
      // The identity line, and it never collapses — not on a phone, not on any
      // tab. It is the line that stops a note being written in the wrong chart.
      const idBits = [
        b.dob ? `DOB ${fmtDate(b.dob)}${b.age != null ? ` (${b.age})` : ''}` : (b.age != null ? `Age ${b.age}` : null),
        b.sex || null,
        b.mrn ? `MRN ${b.mrn}` : null,
        b.mbi ? `MBI ${b.mbi}` : null
      ].filter(Boolean);
      const draftOpen = !!(visitDraft && visitDraft.open);
      const line = String(b.serviceLine || (patient && patient.serviceLine) || '').toUpperCase();
      return (
        <div className="bg-white border-b border-stone-200 px-4 lg:px-8 pt-4 pb-3">
          <div className="flex items-start gap-4 flex-wrap">
            <div className="cw-avatar w-14 h-14 lg:w-[72px] lg:h-[72px] text-[18px] lg:text-[22px] !bg-accent !border-0">{initials(name)}</div>
            <div className="min-w-0 flex-1">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="serif text-[26px] lg:text-[32px] text-primary font-semibold leading-tight">{name}</span>
                {b.preferredName && <span className="text-[13px] text-stone-500">("{b.preferredName}")</span>}
                {b.activatedAt
                  ? <span className="pill bg-emerald-50 text-emerald-700 border-emerald-200">Active</span>
                  : <span className="pill bg-amber-50 text-amber-700 border-amber-200">Enrolling</span>}
                {(CARE_CHIPS[line] || []).map(([c, title, cls]) => (
                  <span key={c} className={`care-chip ${cls}`} title={title}>{title}</span>
                ))}
                {b.codeStatus && <span className="chip bg-red-100 text-red-800">{b.codeStatus}</span>}
              </div>
              <div className="text-[13.5px] text-stone-600 mt-0.5 break-words">{idBits.length ? idBits.join(' • ') : 'No identifiers on file'}</div>
            </div>
            <div className="flex items-center gap-2 shrink-0 relative">
              {onMessage && (
                <button className="btn !py-2 !px-3.5 text-[13px]" onClick={onMessage}><i className="ti ti-message-circle" />Message</button>
              )}
              {onStartVisit && access.canDocument && (
                <button className={`btn ${draftOpen ? 'gold' : 'ghost'} !py-2 !px-3.5 text-[13px]`} onClick={onStartVisit}>
                  <i className={`ti ${draftOpen ? 'ti-writing' : 'ti-plus'}`} />{draftOpen ? 'Resume Draft' : 'New Visit'}
                </button>
              )}
              <button className="btn ghost !py-2 !px-3 text-[13px]" onClick={() => setMenu(m => !m)} aria-expanded={menu}>
                More<i className={`ti ti-chevron-${menu ? 'up' : 'down'}`} />
              </button>
              {menu && (
                <div className="absolute right-0 top-full mt-2 z-20 w-64 card p-2">
                  <button className="w-full text-left px-3 py-2 rounded-lg text-[13px] text-primary font-semibold hover:bg-cream flex items-center gap-2"
                    onClick={() => { setOpen(true); setMenu(false); }}>
                    <i className="ti ti-address-book" />Contact Details
                  </button>
                  {/* Staff-only since 2026-10-19 (owner): every chart viewer can
                      print it, so it is a read, not behind canWrite. */}
                  {patient && patient.id && <FaceSheetItem clientId={patient.id} onDone={() => setMenu(false)} />}
                  {patient && patient.id && access.canWrite && (
                    <div className="px-3 pb-1"><RefreshPortalChart key={patient.id} clientId={patient.id} /></div>
                  )}
                </div>
              )}
            </div>
          </div>
          <div className="mt-3"><AllergyStrip allergies={b.allergies} /></div>
          {open && (
            <div className="mt-3 space-y-3 bg-cream border border-stone-200 rounded-xl p-4">
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                <BannerFact label="Home address">
                  {b.address && (b.address.line1 || b.address.city)
                    ? <span>{[b.address.line1, b.address.line2].filter(Boolean).join(', ')}<br />{[b.address.city, b.address.state, b.address.zip].filter(Boolean).join(' ')}</span>
                    : (b.addressLine || '—')}
                </BannerFact>
                <BannerFact label="Phone" value={b.phone} />
                <BannerFact label={`Responsible party${b.responsibleParty && b.responsibleParty.relationship ? ` · ${b.responsibleParty.relationship}` : ''}`}>
                  {b.responsibleParty && b.responsibleParty.name
                    ? <span>{b.responsibleParty.name}{b.responsibleParty.phone ? <><br />{b.responsibleParty.phone}</> : null}{b.responsibleParty.authority ? <><br /><span className="text-stone-500">{b.responsibleParty.authority}</span></> : null}</span>
                    : '—'}
                </BannerFact>
                <BannerFact label="Existing PCP">
                  {b.pcp && b.pcp.name
                    ? <span>{b.pcp.name}{b.pcp.practice ? <><br />{b.pcp.practice}</> : null}{b.pcp.phone ? <><br />{b.pcp.phone}</> : null}</span>
                    : '—'}
                </BannerFact>
                <BannerFact label="Insurance">
                  <span>
                    {(b.insurance && b.insurance.primary) || '—'}
                    {b.insurance && b.insurance.secondary ? <><br /><span className="text-stone-500">2nd: {b.insurance.secondary}</span></> : null}
                    {b.insurance && b.insurance.medicareAdvantage ? <><br /><span className="chip bg-amber-100 text-amber-800">MEDICARE ADVANTAGE</span></> : null}
                    {b.insurance && b.insurance.qmb ? <><br /><span className="chip bg-amber-100 text-amber-800">QMB</span></> : null}
                    {b.insurance && b.insurance.verification ? <><br /><InsuranceCheck v={b.insurance.verification} /></> : null}
                  </span>
                </BannerFact>
                {canBill && <BannerFact label="Facility &amp; POS">
                  {b.facility && b.facility.name ? (
                    <span>{b.facility.name}<br />POS {b.facility.posCode || <span className="text-amber-700">not set</span>}</span>
                  ) : b.facility && b.facility.id ? (
                    // Assigned, but this read couldn't confirm it — a stale
                    // facility id, or OpenEMR's facility list couldn't be
                    // read for this reader. That is a DIFFERENT fact from
                    // "nobody ever assigned a facility," and saying "Not
                    // assigned" here would be telling the reader something
                    // false rather than something unconfirmed.
                    <span className="text-amber-700">Assigned (facility {b.facility.id}) — {b.facility.warning || 'could not be confirmed against OpenEMR right now'}</span>
                  ) : (
                    <span className="text-amber-700">Not assigned — visits cannot be submitted to billing</span>
                  )}
                </BannerFact>}
                <BannerFact label="Last visit" value={b.lastVisitAt} />
                <BannerFact label="Track" value={b.careTierLabel} />
              </div>
              <HomeVisitFacts homeVisit={b.homeVisit} fields={homeVisitFields} />
              {access.canDocument && (
                <HomeVisitEditor patient={patient} homeVisit={b.homeVisit} fields={homeVisitFields} onSaved={onHomeVisitSaved} />
              )}
              <button className="text-[12px] text-primary font-semibold flex items-center gap-1" onClick={() => setOpen(false)}>
                <i className="ti ti-chevron-up" />Hide Details
              </button>
            </div>
          )}
        </div>
      );
    };

    // ── Session 4.12 Scope D — CHART NAVIGATION: PLACES, NOT ACTIONS ───────
    // Every tab is somewhere in the record. No workflow is a tab: the H&P opens
    // as a visit from the banner, and med reconciliation is a step inside the
    // encounter and a section under MEDICATIONS rather than a sibling of it.
    //
    // ChartSection and chartRow live at MODULE scope so every place can render
    // the same way. A component declared inside another is a new function
    // identity on every render, which remounts it and loses the caret — the
    // trap test/react_input_focus.test.js exists to catch.
    const ChartSection = ({ title, data, render, icon, linked, children }) => (
      <div className="card mb-4">
        <div className="card-h"><h2><i className={`ti ${icon} mr-1 text-accent`} />{title}</h2>
          {/* A pending org-level read grant is a setup step, not a fault —
              badge it differently so a real failure still stands out. */}
          {data && !data.ok && data.permissionPending && <span className="chip bg-amber-50 text-amber-800">Not enabled yet</span>}
          {data && !data.ok && !data.permissionPending && <span className="chip bg-red-50 text-red-700">EMR read failed</span>}
        </div>
        <div className="p-4 text-sm">
          {children}
          {!linked && <p className="text-stone-400 text-xs">Link this patient to OpenEMR to read live data.</p>}
          {linked && data && data.ok && data.rows.length === 0 && <p className="text-stone-400 text-xs">Nothing on file in OpenEMR.</p>}
          {linked && data && data.ok && data.rows.map((r, i) => render(r, i))}
          {linked && data && !data.ok && data.permissionPending && (
            <p className="text-amber-800 text-xs">
              OpenEMR has not granted this app org-level read access to {title.toLowerCase()} yet.
              An administrator enables it under Administration → Access → the <code className="font-mono">gfc-app-api</code> group.
              Nothing is wrong with this patient's record.
            </p>
          )}
          {linked && data && !data.ok && !data.permissionPending && <p className="text-red-600 text-xs">{data.error}</p>}
        </div>
      </div>
    );

    // Readings on a saved note that has not been signed. OpenEMR's vitals form
    // gets them once, at signing — the server flags them; this only labels them.
    const DraftVitalsChip = () => (
      <span className="chip bg-amber-50 text-amber-800 ml-1" title="From a saved note that is not signed yet. OpenEMR's vitals form gets these when the note is signed.">
        Draft — not yet in OpenEMR
      </span>
    );

    const chartRow = (main, sub, right, key) => (
      <div key={key} className="flex items-start justify-between py-2 border-b border-stone-100 last:border-0 gap-2">
        <div className="min-w-0"><div className="font-semibold text-[13.5px] text-primary">{main}</div>{sub && <div className="text-[12px] text-stone-500">{sub}</div>}</div>
        {right && <span className="chip bg-primary-50 text-primary shrink-0">{right}</span>}
      </div>
    );

    // An empty place says so in a sentence. A blank panel and a place with
    // nothing in it are indistinguishable, and only one of them is correct —
    // the rule the clinical inbox set and Scope I3 restates for navigation.
    const EmptyPlace = ({ children }) => (
      <div className="card px-6 py-10 text-center">
        <i className="ti ti-folder-open text-3xl text-stone-300" />
        <p className="text-sm text-stone-500 mt-2">{children}</p>
      </div>
    );

    const ProblemsTab = ({ chart }) => {
      const emr = (chart && chart.emr) || {};
      return <ChartSection title="Problem List" icon="ti-list-details" data={emr.problems} linked={chart && chart.linked}
        render={(r, i) => chartRow(r.title, [r.code, r.onset && `since ${fmtDate(r.onset)}`].filter(Boolean).join(' · '), r.status, i)} />;
    };

    const AllergiesTab = ({ chart }) => {
      const emr = (chart && chart.emr) || {};
      return (
        <div>
          {/* The same strip the banner carries, and deliberately the same
              component: two renderings of "what is this patient allergic to"
              is how the two start disagreeing. */}
          <div className="mb-4"><AllergyStrip allergies={chart && chart.banner && chart.banner.allergies} /></div>
          <ChartSection title="Allergies" icon="ti-alert-triangle" data={emr.allergies} linked={chart && chart.linked}
            render={(r, i) => chartRow(r.title, r.criticality && `criticality: ${r.criticality}`, r.status, i)} />
        </div>
      );
    };

    // D4: med reconciliation is a SECTION under MEDICATIONS, not a tab beside
    // it. Reconciling is something you do to the medication list; it is not a
    // different place in the record.
    // The list above and the reconciliation below read the same OpenEMR list,
    // but the list comes from the chart, which loads once. Resolving writes to
    // OpenEMR, so the chart is reloaded after it, or the list above keeps
    // saying "Nothing on file" while the rows below read "Both".
    const MedicationsTab = ({ chart, patient, onChartChanged }) => {
      const emr = (chart && chart.emr) || {};
      return (
        <div>
          <ChartSection title="Medications" icon="ti-pill" data={emr.medications} linked={chart && chart.linked}
            render={(r, i) => chartRow(r.title, r.instructions || (r.authoredOn && fmtDate(r.authoredOn)), r.status, i)} />
          <MedRecTab patient={patient} onSaved={onChartChanged} />
        </div>
      );
    };

    // ── Session 4.12 Scope J — the rest of the record ──────────────────────
    // Nine resources the app had never asked OpenEMR for. EVERY SECTION SAYS
    // WHY IT IS EMPTY, which is the whole value of the screen: a 403 (the org
    // ACL, an admin fixes it), a 404 (8.4 does not serve this at all) and a
    // genuine zero rows have three different fixes and looked identical as a
    // blank panel. An empty result is not a diagnosis.
    //
    // The sections, their labels and the failure wording are all SERVED. The
    // page restates none of them, so a resource added or a message reworded
    // server-side reaches the screen without a second edit here.
    const RecordExtrasTab = ({ patient }) => {
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      useEffect(() => {
        let live = true;
        setData(null); setErr(null);
        api.recordExtras(patient.id)
          .then(d => { if (live) setData(d); })
          .catch(e => { if (live) setErr(e.message); });
        return () => { live = false; };
      }, [patient.id]);
      if (err) return <p className="text-sm text-red-600">{err}</p>;
      if (!data) return <p className="text-sm text-stone-500">Reading the rest of the record from OpenEMR…</p>;
      return (
        <div>
          {data.unproven && (
            <p className="text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-lg p-2.5 mb-4">
              <i className="ti ti-alert-triangle mr-1" />{data.unprovenNote}
            </p>
          )}
          {data.sections.map(sec => (
            <div className="card mb-4" key={sec.key}>
              <div className="card-h">
                <h2>{sec.label}</h2>
                {sec.failure
                  ? <span className="chip bg-amber-50 text-amber-800">could not be read</span>
                  : <span className="chip bg-stone-100 text-stone-600">{sec.rows.length}</span>}
              </div>
              <div className="p-4 text-sm">
                {/* The server's own sentence, naming the layer. A page that
                    wrote its own would be a second answer to why this failed. */}
                {sec.failure && <p className="text-xs text-amber-700">{sec.failure.message}</p>}
                {!sec.failure && sec.rows.length === 0 && (
                  <p className="text-xs text-stone-500">OpenEMR answered, and has nothing recorded here for this patient.</p>
                )}
                {!sec.failure && sec.rows.map((r, i) => (
                  <div key={r.id || i} className="py-1.5 border-b border-stone-100 last:border-0">
                    <div className="text-[13px] font-semibold">{fhirRowTitle(r)}</div>
                    <div className="text-xs text-stone-500">{fhirRowDetail(r)}</div>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      );
    };
    // Nine resource shapes, one renderer. FHIR puts a human-readable label in
    // a different place in almost every one of them, so the fallbacks are
    // walked in order and `text.div` is the last resort — which is where the
    // allergen turned out to live in 4.1, after every allergy in the chart
    // displayed as "Unknown" for months.
    const codeableText = (c) => c && (c.text || ((c.coding || [])[0] || {}).display || ((c.coding || [])[0] || {}).code);
    const fhirRowTitle = (r) => codeableText(r.vaccineCode) || codeableText(r.code) || codeableText(r.type)
      || r.description || r.name || (r.payor && codeableText(r.payor[0]))
      || (r.type && r.type.text) || (r.relationship && codeableText(r.relationship[0]))
      || (r.description && r.description.text)
      || String(r.resourceType || 'Record') + (r.id ? ` ${r.id}` : '');
    const fhirRowDetail = (r) => [
      r.status, r.occurrenceDateTime && fmtDate(r.occurrenceDateTime),
      r.performedDateTime && fmtDate(r.performedDateTime),
      r.period && r.period.start && `from ${fmtDate(r.period.start)}`,
      r.authored && fmtDate(r.authored),
      r.createdDateTime && fmtDate(r.createdDateTime),
      r.lotNumber && `lot ${r.lotNumber}`
    ].filter(Boolean).join(' · ') || '—';

    const DocumentsTab = ({ chart, patient, onChartChanged }) => (
      <ChartDocuments docs={(chart && chart.chartDocuments) || []} clientId={patient && patient.id} onRefresh={onChartChanged} />
    );

    // ---- Orders, Referrals, Imaging and Results, wired to what 4.10 built ---
    // Not placeholders. 4.10 shipped the orders, the requisitions, the referral
    // lifecycle and the results path with per-patient reads and no per-patient
    // PLACE to read them in.
    const useChartOrders = (clientId) => {
      const [data, setData] = useState(null);
      const [err, setErr] = useState('');
      const load = useCallback(() => {
        if (!clientId) return;
        api.patientOrders(clientId).then(r => { setData(r); setErr(''); }).catch(e => setErr(e.message));
      }, [clientId]);
      useEffect(() => { load(); }, [load]);
      return { data, err, reload: load };
    };

    // Result records carry `summary`, `performedBy` and `document.fileName`;
    // `label`/`documentName` never existed, so every result read "Result".
    const resultTitle = (r, fallback) => (r && (r.summary || (r.document && r.document.fileName) || r.performedBy)) || fallback;
    const orderTitle = (o) => o.orderType === 'referral' ? ((o.referral && o.referral.specialty) || o.specialty || 'Referral')
      : o.orderType === 'dme' ? ((o.dme && o.dme.itemDescription) || o.itemDescription || 'DME')
        : ((o.tests && o.tests.join(', ')) || o.orderType);
    const TYPE_LABEL = { lab: 'Lab', imaging: 'Imaging', procedure: 'Procedure', referral: 'Referral', dme: 'DME' };

    const OrderList = ({ rows, empty, err, onOpen }) => {
      if (err) return <div className="card p-4 text-sm text-red-600">{err}</div>;
      if (!rows) return <div className="card p-4 text-sm text-stone-500">Loading…</div>;
      if (!rows.length) return <EmptyPlace>{empty}</EmptyPlace>;
      return (
        <div className="card">
          <div className="p-4">
            {rows.map(o => (
              <button key={o.id} type="button" onClick={() => onOpen && onOpen(o.id)}
                className="block w-full text-left py-2 border-b border-stone-100 last:border-0 hover:bg-stone-50">
                <div className="flex items-center justify-between gap-2 flex-wrap">
                  <span className="font-semibold text-[13px]">
                    <span className="text-stone-400 font-normal">{TYPE_LABEL[o.orderType] || o.orderType} · </span>{orderTitle(o)}
                  </span>
                  <span className="flex items-center gap-1.5">
                    {o.afterSigning && <span className="chip bg-amber-50 text-amber-800">Added After Signing</span>}
                    {o.orderType === 'referral' && o.referral && o.referral.agencyPending && !o.referral.receivingFax && <span className="chip bg-amber-50 text-amber-800">NEEDS AGENCY</span>}
                    <span className="chip bg-primary-50 text-primary">{String(o.status || '').toUpperCase()}</span>
                  </span>
                </div>
                <div className="text-[11.5px] text-stone-500">
                  {[o.orderReference, o.priority, o.createdAt && fmtDate(o.createdAt)].filter(Boolean).join(' · ')}
                  {((o.orderNotes || []).length > 0 || (o.orderFiles || []).length > 0) &&
                    ` · ${(o.orderNotes || []).length} note${(o.orderNotes || []).length === 1 ? '' : 's'}, ${(o.orderFiles || []).length} file${(o.orderFiles || []).length === 1 ? '' : 's'}`}
                </div>
                {Array.isArray(o.sends) && o.sends.length > 0 && (
                  <div className="text-[11.5px] text-stone-500">
                    Last sent {fmtTs(o.sends[o.sends.length - 1].sentAt)} to {o.sends[o.sends.length - 1].recipientName || 'recipient not recorded'}
                  </div>
                )}
                {o.orderType === 'referral' && o.referral && o.referral.destination === 'internal' && (
                  <div className="text-[11.5px] text-stone-500">
                    Referred to {(o.referral.assignedTo && o.referral.assignedTo.name) || 'a colleague'} inside the team
                  </div>
                )}
              </button>
            ))}
          </div>
        </div>
      );
    };

    // One order, opened. The working record while an order is being finalized:
    // the details, where it goes, who sent what, and notes and files that only
    // ever get added to.
    const OrderDetail = ({ order, data, onBack, onChanged }) => {
      const canAnnotate = useCanEditOrderDestination();
      // What came back for THIS order: the result or consult note filed
      // against it. Read from the same results list the Results tab reads.
      const [results, setResults] = useState(null);
      useEffect(() => {
        if (!order || !order.clientId) return;
        let live = true;
        api.patientResults(order.clientId).then(r => { if (live) setResults((r.results || []).filter(x => String(x.orderId) === String(order.id))); })
          .catch(() => { if (live) setResults([]); });
        return () => { live = false; };
      }, [order && order.id, order && order.status]);
      const [busy, setBusy] = useState('');
      const [msg, setMsg] = useState('');
      const [err, setErr] = useState('');
      const [note, setNote] = useState('');
      const [fileLabel, setFileLabel] = useState('');
      const fileRef = useRef(null);
      const run = async (key, fn, ok) => {
        setBusy(key); setErr(''); setMsg('');
        try { const r = await fn(); if (r && r.message) setMsg(r.message); if (ok) ok(); onChanged(); return r; }
        catch (e) { setErr(e.message || 'That did not go through.'); return null; }
        finally { setBusy(''); }
      };
      const bucket = order.orderType === 'referral' ? (order.referral || {}) : order.orderType === 'dme' ? (order.dme || {}) : {};
      const facts = Object.entries(bucket)
        .filter(([, v]) => v !== null && v !== '' && v !== undefined && typeof v !== 'object')
        .map(([k, v]) => [k.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase()), typeof v === 'boolean' ? (v ? 'Yes' : 'No') : String(v)]);
      const dx = (order.diagnosisCodes || []).map(d => (typeof d === 'string' ? d : (d && (d.code || d.icd10)) || '')).filter(Boolean);
      return (
        <div className="space-y-3">
          <button type="button" className="text-[12.5px] text-primary font-semibold" onClick={onBack}><i className="ti ti-arrow-left" /> All Orders</button>
          <div className="card p-4">
            <div className="flex items-center justify-between gap-2 flex-wrap">
              <div className="font-semibold text-[15px]">{TYPE_LABEL[order.orderType] || order.orderType} · {orderTitle(order)}</div>
              <span className="chip bg-primary-50 text-primary">{String(order.status || '').toUpperCase()}</span>
            </div>
            <div className="text-[11.5px] text-stone-500 mt-0.5">
              {[order.orderReference, order.priority, order.createdAt && `Placed ${fmtDate(order.createdAt)}`, order.orderingClinician && order.orderingClinician.name && `by ${order.orderingClinician.name}`].filter(Boolean).join(' · ')}
            </div>
            {dx.length > 0 && <div className="text-[12px] text-stone-600 mt-1">Diagnoses: {dx.join(', ')}</div>}
            {facts.length > 0 && (
              <dl className="mt-2 grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-1 text-[12.5px]">
                {facts.map(([k, v]) => <div key={k}><dt className="inline text-stone-500">{k}: </dt><dd className="inline">{v}</dd></div>)}
              </dl>
            )}
            <div className="mt-2">
              <OrderActions order={order} channels={data.sendChannels} channelLabels={data.sendChannelLabels}
                defaultChannel={data.defaultSendChannel} faxChannels={data.faxSendChannels}
                interpretations={data.resultInterpretations} busy={busy === 'act'}
                destinationFields={data.destinationFields} editableStatuses={data.destinationEditableStatuses}
                onDestination={(body) => run('act', () => api.updateOrderDestination(order.id, body))}
                onCancel={(reason) => run('act', () => api.orderStatus(order.id, 'cancelled', reason))}
                onAccept={() => run('act', () => api.acceptReferral(order.id))}
                onComplete={(note) => run('act', () => api.completeReferral(order.id, note))}
                onSent={(body) => run('act', () => api.markOrderSent(order.id, body))}
                onScheduled={(date) => run('act', () => api.markReferralScheduled(order.id, date))}
                onResult={(r) => {
                  const fd = new FormData();
                  fd.append('file', r.file);
                  ['interpretation', 'resultDate', 'performedBy', 'summary'].forEach(k => fd.append(k, r[k]));
                  return run('act', () => api.attachResult(order.id, fd));
                }} />
            </div>
          </div>

          {order.orderType !== 'referral' || (order.referral || {}).destination !== 'internal' ? (
            <div className="card p-4">
              <div className="font-semibold text-[13px] mb-1">{order.orderType === 'referral' ? 'Consult Notes' : 'Results'}</div>
              {results === null && <div className="text-[12px] text-stone-500">Loading…</div>}
              {results && results.length === 0 && <div className="text-[12px] text-stone-500">Nothing has come back yet.</div>}
              {(results || []).map(r => (
                <div key={r.id} className="py-1.5 border-b border-stone-100 last:border-0">
                  <div className="text-[13px]">{resultTitle(r, 'Result')}{r.interpretation ? <span className="text-stone-500"> · {r.interpretation}</span> : ''}</div>
                  <div className="text-[11px] text-stone-500">
                    {[r.performedBy, r.resultDate && `dated ${r.resultDate}`, r.acknowledgedAt ? `reviewed ${fmtDate(r.acknowledgedAt)}` : 'not yet reviewed'].filter(Boolean).join(' · ')}
                  </div>
                  {r.followUpNote && <div className="text-[12px] text-stone-700 mt-0.5">Follow-up: {r.followUpNote}</div>}
                </div>
              ))}
            </div>
          ) : null}
          {(order.sends || []).length > 0 && (
            <div className="card p-4">
              <div className="font-semibold text-[13px] mb-1">Sent</div>
              {order.sends.map((sd, i) => (
                <div key={i} className="text-[12px] text-stone-600">{fmtTs(sd.sentAt)} · {sd.channelLabel || sd.channel} · {sd.recipientName || 'recipient not recorded'}{sd.recipientFax ? ` · ${fmtFax(sd.recipientFax)}` : ''}{sd.sentBy && sd.sentBy.name ? ` · ${sd.sentBy.name}` : ''}</div>
              ))}
            </div>
          )}
          {(order.destinationHistory || []).length > 0 && (
            <div className="card p-4">
              <div className="font-semibold text-[13px] mb-1">Destination changes</div>
              {order.destinationHistory.map((h, i) => (
                <div key={i} className="text-[12px] text-stone-600">
                  {fmtTs(h.at)} · {(h.changes || []).map(c => `${c.label || c.field}: ${c.from || '(blank)'} → ${c.to || '(blank)'}`).join('; ')}
                  {h.by && h.by.name ? ` · ${h.by.name}` : ''}{h.reason ? ` · ${h.reason}` : ''}
                </div>
              ))}
            </div>
          )}

          <div className="card p-4">
            <div className="font-semibold text-[13px] mb-1">Notes</div>
            {(order.orderNotes || []).length === 0 && <div className="text-[12px] text-stone-500">No notes yet.</div>}
            {(order.orderNotes || []).map(n => (
              <div key={n.id} className="py-1.5 border-b border-stone-100 last:border-0">
                <div className="text-[13px] whitespace-pre-wrap">{n.text}</div>
                <div className="text-[11px] text-stone-500">{n.by && n.by.name} · {fmtTs(n.at)}</div>
              </div>
            ))}
            {canAnnotate && (
              <div className="mt-2">
                <textarea className="w-full border border-stone-200 rounded p-2 text-[13px]" rows={2} maxLength={data.noteMax || 2000}
                  placeholder="e.g. Spoke with the agency intake nurse, start of care Thursday" value={note} onChange={e => setNote(e.target.value)} />
                <button type="button" className="btn btn-primary mt-1" disabled={!note.trim() || busy === 'note'}
                  onClick={() => run('note', () => api.addOrderNote(order.id, note), () => setNote(''))}>Add Note</button>
              </div>
            )}
          </div>

          <div className="card p-4">
            <div className="font-semibold text-[13px] mb-1">Files</div>
            {(order.orderFiles || []).length === 0 && <div className="text-[12px] text-stone-500">No files attached yet.</div>}
            {(order.orderFiles || []).map(f => (
              <div key={f.id} className="py-1.5 border-b border-stone-100 last:border-0 text-[13px]">
                <a className="text-primary font-semibold" href={api.orderFileUrl(order.id, f.id)} target="_blank" rel="noopener noreferrer">{f.label || f.fileName}</a>
                <div className="text-[11px] text-stone-500">{f.label ? `${f.fileName} · ` : ''}{f.by && f.by.name} · {fmtTs(f.at)}{f.emrFiled ? ' · in the chart' : ''}</div>
              </div>
            ))}
            {canAnnotate && (
              <div className="mt-2 flex flex-wrap items-center gap-2">
                <input className="border border-stone-200 rounded p-1.5 text-[13px]" placeholder="What is this file? (optional)" maxLength={120}
                  value={fileLabel} onChange={e => setFileLabel(e.target.value)} />
                <input ref={fileRef} type="file" accept="application/pdf,image/jpeg,image/png" className="text-[12px]" />
                <button type="button" className="btn btn-primary" disabled={busy === 'file'}
                  onClick={() => {
                    const f = fileRef.current && fileRef.current.files && fileRef.current.files[0];
                    if (!f) { setErr('Choose a file to attach.'); return; }
                    const fd = new FormData();
                    fd.append('file', f); fd.append('label', fileLabel);
                    run('file', () => api.addOrderFile(order.id, fd), () => { setFileLabel(''); if (fileRef.current) fileRef.current.value = ''; });
                  }}>Attach File</button>
                <Hint className="w-full">PDF, JPG or PNG, up to 10 MB. It is filed to the patient's chart too.</Hint>
              </div>
            )}
          </div>
          {msg && <div className="text-[12.5px] text-green-700">{msg}</div>}
          {err && <div className="text-[12.5px] text-red-600">{err}</div>}
        </div>
      );
    };

    // ── New Order from the chart (owner, 2026-11-09) ─────────────────────
    // "We need to be able to create orders like a standard practice": the
    // Orders tab places an order without opening a visit first. An order still
    // belongs to a visit, so this picks one: an open draft, or the most recent
    // signed visit, where the order uses only the diagnoses it was signed with
    // and is recorded on the note as an addendum. The SERVER lists the visits
    // and says whether this viewer may place anything (placement), so the
    // page never offers a button the route refuses. Module scope
    // (react_input_focus).
    const NewOrderPanel = ({ patient, placement, presetType, onPlaced }) => {
      const canOrderStandingCap = useCan('orderStanding');
      const ceiling = useContext(AccessContext).credentialCeiling || [];
      const canOrderStanding = canOrderStandingCap && ceiling.some(t => t !== 'screening');
      const [open, setOpen] = useState(false);
      const [euuid, setEuuid] = useState('');
      const [formKey, setFormKey] = useState(0);
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState(null);
      const [enrollmentWarning, setEnrollmentWarning] = useState(null);
      const [standingOrders, setStandingOrders] = useState([]);
      useEffect(() => {
        if (!open || !canOrderStanding) return;
        api.myStandingOrders().then(r => setStandingOrders((r && r.standingOrders) || [])).catch(() => setStandingOrders([]));
      }, [open, canOrderStanding]);
      if (!placement || !placement.canPlace) return null;
      const targets = placement.targets || [];
      const chosen = targets.find(t => t.encounterUuid === (euuid || placement.defaultEncounterUuid)) || null;
      const label = presetType === 'referral' ? 'New Referral' : 'New Order';
      const save = (f) => {
        if (!chosen) return Promise.resolve(null);
        setBusy(true); setMsg(null);
        return api.addOrder(patient.id, chosen.encounterUuid, { ...f, ...(chosen.afterSigning ? { afterSigning: true } : {}) })
          .then(r => {
            setEnrollmentWarning(null);
            setMsg({ ok: true, text: r.duplicate ? 'Already recorded. This is the order you placed a moment ago.' : r.message, warnings: r.warnings || [] });
            setOpen(false); setFormKey(k => k + 1);
            if (onPlaced) onPlaced();
            return r;
          })
          .catch(e => {
            if (e && e.data && e.data.needsReason) setEnrollmentWarning(e.data);
            setMsg({ ok: false, text: (e && e.message) || 'The order did not save.' });
            return null;
          })
          .finally(() => setBusy(false));
      };
      return (
        <div className="card mb-4">
          <div className="card-h">
            <h2>{label}</h2>
            <button className="btn ghost !py-1 !px-2.5 text-xs" onClick={() => { setOpen(v => !v); setMsg(null); }}>{open ? 'Close' : `+ ${label}`}</button>
          </div>
          {(open || msg) && (
            <div className="p-4 text-sm grid gap-2">
              {msg && (
                <div className={`rounded border p-2.5 text-[12.5px] ${msg.ok ? 'border-emerald-200 bg-emerald-50 text-emerald-800' : 'border-red-200 bg-red-50 text-red-700'}`}>
                  {msg.text}
                  {(msg.warnings || []).map((w, i) => <div key={i} className="text-amber-800 mt-1">{w}</div>)}
                </div>
              )}
              {open && !targets.length && (
                <p className="text-[12.5px] text-stone-600">
                  {placement.emptyReason === 'NOT_LINKED'
                    ? 'Link this patient to OpenEMR first. An order is filed on a visit in their chart.'
                    : 'No visit on this chart yet. An order belongs to a visit: use Start Visit at the top of the chart, then place it here.'}
                </p>
              )}
              {open && targets.length > 0 && (
                <>
                  <Field label="Add To Visit">
                    <select className="inp" value={chosen ? chosen.encounterUuid : ''} onChange={e => { setEuuid(e.target.value); setEnrollmentWarning(null); }}>
                      {targets.map(t => (
                        <option key={t.encounterUuid} value={t.encounterUuid}>
                          {[t.date ? fmtDate(t.date) : 'Undated', t.visitLabel || t.reason || 'Visit', t.signed ? 'Signed' : 'Draft'].join(' · ')}
                        </option>
                      ))}
                    </select>
                  </Field>
                  {chosen && chosen.afterSigning && (
                    <p className="text-[12px] text-amber-800">This visit is signed. The order is added to the note as an addendum and can use only the diagnoses the visit was signed with.</p>
                  )}
                  {chosen && (
                    <OrderForm key={`${chosen.encounterUuid}|${formKey}`} clientId={patient.id}
                      diagnoses={chosen.diagnoses || []} diagnosesLocked={!!chosen.afterSigning}
                      types={placement.orderTypes} priorities={placement.orderPriorities} docTypes={placement.documentOrderTypes}
                      standingOrders={standingOrders} requireStandingOrder={!!placement.requireStandingOrder}
                      enrollmentWarning={enrollmentWarning} initialType={presetType} busy={busy} onSave={save} />
                  )}
                </>
              )}
            </div>
          )}
        </div>
      );
    };

    // The list and the opened order for one tab. The opened order is read from
    // the freshly loaded list, so a note or file added a moment ago shows at once.
    const OrderBrowser = ({ patient, keep, empty, presetType }) => {
      const { data, err, reload } = useChartOrders(patient && patient.id);
      const [openId, setOpenId] = useState(null);
      const rows = data ? (data.orders || []).filter(keep) : null;
      const open = data && openId ? (data.orders || []).find(o => o.id === openId) : null;
      if (open) return <OrderDetail order={open} data={data} onBack={() => setOpenId(null)} onChanged={reload} />;
      return (
        <div>
          <NewOrderPanel patient={patient} placement={data && data.placement} presetType={presetType} onPlaced={reload} />
          <OrderList rows={rows} err={err} empty={empty} onOpen={setOpenId} />
        </div>
      );
    };

    // Every order the patient has, whatever kind. Referrals and DME used to be
    // filtered out of this tab, so a home health order placed here could only
    // be found on another one.
    const OrdersTab = ({ patient }) => (
      <OrderBrowser patient={patient} keep={() => true}
        empty="No orders on this chart yet." />
    );

    // ONE Orders place on the chart (owner, 2026-11-04). Imaging and Referrals
    // were their own tabs, each the same order list with one filter.
    const ORDER_FILTERS = [['all', 'All'], ['lab', 'Labs'], ['imaging', 'Imaging'], ['referral', 'Referrals'], ['dme', 'Equipment']];
    const OrdersPlace = ({ patient, filter, setFilter }) => (
      <div>
        <div className="flex gap-2 mb-4 overflow-x-auto">
          {ORDER_FILTERS.map(([k, l]) => (
            <button key={k} type="button" onClick={() => setFilter(k)}
              className={`px-4 py-1.5 rounded-full text-[13px] font-semibold border whitespace-nowrap ${filter === k ? 'bg-[#A9853A] border-[#A9853A] text-white' : 'bg-white border-stone-200 text-primary'}`}>{l}</button>
          ))}
        </div>
        {filter === 'imaging' ? <ImagingTab patient={patient} />
          : filter === 'referral' ? <ReferralsTab patient={patient} />
          : filter === 'all' ? <OrdersTab patient={patient} />
          : <OrderBrowser key={filter} patient={patient} keep={o => o.orderType === filter} presetType={filter}
              empty={`No ${filter === 'dme' ? 'equipment' : 'lab'} orders on this chart yet.`} />}
      </div>
    );

    const ReferralsTab = ({ patient }) => (
      <OrderBrowser patient={patient} keep={o => o.orderType === 'referral'} presetType="referral"
        empty="No referrals on this chart yet." />
    );

    // D3: IMAGING lists imaging orders AND the result documents attached to
    // them, so a study and its report are read in one place rather than two.
    const ImagingTab = ({ patient }) => {
      const { data, err, reload } = useChartOrders(patient && patient.id);
      const [results, setResults] = useState(null);
      useEffect(() => {
        if (!patient || !patient.id) return;
        let live = true;
        api.patientResults(patient.id).then(r => { if (live) setResults(r.results || []); }).catch(() => { if (live) setResults([]); });
        return () => { live = false; };
      }, [patient && patient.id]);
      const rows = data ? (data.orders || []).filter(o => o.orderType === 'imaging') : null;
      if (err) return <div className="card p-4 text-sm text-red-600">{err}</div>;
      if (!rows) return <div className="card p-4 text-sm text-stone-500">Loading…</div>;
      const placeNew = <NewOrderPanel patient={patient} placement={data && data.placement} presetType="imaging" onPlaced={reload} />;
      if (!rows.length) return <div>{placeNew}<EmptyPlace>No imaging on this chart yet.</EmptyPlace></div>;
      return (
        <div>{placeNew}
        <div className="card"><div className="p-4">
          {rows.map(o => {
            const attached = (results || []).filter(r => String(r.orderId) === String(o.id));
            return (
              <div key={o.id} className="py-2 border-b border-stone-100 last:border-0">
                <div className="flex items-center justify-between gap-2 flex-wrap">
                  <span className="font-semibold text-[13px]">{(o.tests && o.tests.join(', ')) || 'Imaging'}</span>
                  <span className="chip bg-primary-50 text-primary">{String(o.status || '').toUpperCase()}</span>
                </div>
                <div className="text-[11.5px] text-stone-500">{[o.orderReference, o.createdAt && fmtDate(o.createdAt)].filter(Boolean).join(' · ')}</div>
                {attached.length === 0
                  ? <div className="text-[11.5px] text-stone-400 mt-0.5">No report attached yet.</div>
                  : attached.map(r => (
                    <div key={r.id} className="text-[11.5px] text-stone-700 mt-0.5">
                      <i className="ti ti-report-medical mr-1" />{resultTitle(r, 'Report')}
                      {r.interpretation ? ` — ${r.interpretation}` : ''}
                    </div>
                  ))}
              </div>
            );
          })}
        </div></div>
        </div>
      );
    };

    // 2026-10-12 redesign (owner mockup 4). A table, but WITHOUT a value,
    // range or trend column: the app stores the result document and its review
    // state, never the numbers, so those columns would always be blank. The
    // Flag is the interpretation recorded on filing, never one the page infers.
    const RESULT_FLAG = {
      critical: ['Critical', 'bg-red-50 text-red-700 border-red-200'],
      abnormal: ['Abnormal', 'bg-amber-50 text-amber-700 border-amber-200'],
      normal: ['Normal', 'bg-emerald-50 text-emerald-700 border-emerald-200']
    };
    const resultKind = (r) => {
      const t = String((r.order && r.order.orderType) || r.orderType || '').toLowerCase();
      return t === 'lab' ? 'lab' : t === 'imaging' ? 'imaging' : 'other';
    };
    const ResultFlag = ({ r }) => {
      const f = RESULT_FLAG[String(r.interpretation || '')];
      return f ? <span className={`pill ${f[1]}`}>{f[0]}</span> : <span className="text-[12px] text-stone-400">Not set</span>;
    };
    const ResultStatus = ({ r }) => r.acknowledgedAt
      ? <span className="pill bg-emerald-50 text-emerald-700 border-emerald-200">Reviewed</span>
      : <span className="pill bg-red-50 text-red-700 border-red-200">Unreviewed</span>;
    const ResultsTab = ({ patient }) => {
      const [rows, setRows] = useState(null);
      const [err, setErr] = useState('');
      const [kind, setKind] = useState('all');
      const [status, setStatus] = useState('all');
      useEffect(() => {
        if (!patient || !patient.id) return;
        let live = true;
        api.patientResults(patient.id).then(r => { if (live) setRows(r.results || []); })
          .catch(e => { if (live) setErr(e.message); });
        return () => { live = false; };
      }, [patient && patient.id]);
      if (err) return <div className="card p-4 text-sm text-red-600">{err}</div>;
      if (!rows) return <div className="card p-4 text-sm text-stone-500">Loading…</div>;
      if (!rows.length) return <EmptyPlace>No results on this chart yet.</EmptyPlace>;
      // A filter is offered only when something sits under it.
      const kinds = [['all', 'All Results'], ['lab', 'Labs'], ['imaging', 'Imaging'], ['other', 'Other']]
        .filter(([k]) => k === 'all' || rows.some(r => resultKind(r) === k));
      const shown = rows
        .filter(r => kind === 'all' || resultKind(r) === kind)
        .filter(r => status === 'all' || (status === 'reviewed' ? !!r.acknowledgedAt : !r.acknowledgedAt));
      return (
        <div>
          <div className="flex flex-wrap items-end justify-between gap-3 mb-3">
            <h2 className="serif text-[28px] font-semibold text-primary leading-tight">Results</h2>
            <label className="text-[12px] text-stone-500">Status
              <select className="inp !w-auto !py-1.5 ml-2" value={status} onChange={e => setStatus(e.target.value)}>
                <option value="all">All</option><option value="unreviewed">Unreviewed</option><option value="reviewed">Reviewed</option>
              </select>
            </label>
          </div>
          {kinds.length > 2 && (
            <div className="cw-tabs mb-3">
              {kinds.map(([k, label]) => (
                <div key={k} className={`tabbtn ${kind === k ? 'on' : ''}`} onClick={() => setKind(k)}>{label}</div>
              ))}
            </div>
          )}
          <div className="card overflow-hidden">
            {shown.length === 0 && <p className="text-sm text-stone-500 px-5 py-6">Nothing matches these filters.</p>}
            {shown.length > 0 && (
              <>
                <table className="cw-table w-full hidden md:table">
                  <thead><tr><th>Date</th><th>Test</th><th>Flag</th><th>Status</th><th>Reviewed by</th></tr></thead>
                  <tbody>
                    {shown.map(r => (
                      <tr key={r.id}>
                        <td className="whitespace-nowrap text-stone-600">{r.receivedAt ? fmtDate(r.receivedAt) : '—'}</td>
                        <td>
                          <div className="font-semibold text-primary">{resultTitle(r, 'Result')}</div>
                          {r.order && r.order.reference && <div className="text-[11.5px] text-stone-500">{r.order.reference}</div>}
                        </td>
                        <td><ResultFlag r={r} /></td>
                        <td><ResultStatus r={r} /></td>
                        <td className="text-[12.5px] text-stone-600">
                          {r.acknowledgedAt
                            ? <>{(r.acknowledgedBy && r.acknowledgedBy.name) || 'A clinician'}<br /><span className="text-stone-400">{fmtDate(r.acknowledgedAt)}</span></>
                            : '—'}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                <div className="md:hidden">
                  {shown.map(r => (
                    <div key={r.id} className="px-4 py-3 border-b border-stone-100 last:border-0">
                      <div className="flex items-center justify-between gap-2">
                        <span className="font-semibold text-primary text-[14px]">{resultTitle(r, 'Result')}</span>
                        <ResultFlag r={r} />
                      </div>
                      <div className="flex items-center justify-between gap-2 mt-1">
                        <span className="text-[12px] text-stone-500">{r.receivedAt ? fmtDate(r.receivedAt) : 'Undated'}</span>
                        <ResultStatus r={r} />
                      </div>
                    </div>
                  ))}
                </div>
              </>
            )}
          </div>
          <p className="text-[11.5px] text-stone-400 mt-2">Result values are on the attached report. Acknowledge results from the Results inbox.</p>
        </div>
      );
    };

    // ---- D5 TIMELINE -------------------------------------------------------
    const TIMELINE_LABELS = {
      visit: 'Visits', message: 'Messages', message_note: 'Message Notes', call: 'Call Notes', medication: 'Medications', order: 'Orders',
      result: 'Results', referral: 'Referrals', document: 'Documents', hospitalization: 'Hospitalizations'
    };

    const TimelineTab = ({ patient }) => {
      const [data, setData] = useState(null);
      const [err, setErr] = useState('');
      const [filter, setFilter] = useState([]);
      useEffect(() => {
        if (!patient || !patient.id) return;
        let live = true;
        api.timeline(patient.id, filter).then(r => { if (live) { setData(r); setErr(''); } })
          .catch(e => { if (live) setErr(e.message); });
        return () => { live = false; };
      }, [patient && patient.id, filter.join(',')]);
      const toggle = (k) => setFilter(f => f.includes(k) ? f.filter(x => x !== k) : [...f, k]);
      // A message note's words open on request (2026-10-19), never on the list.
      const [noteView, setNoteView] = useState(null);
      const openNote = (key, kind) => {
        setNoteView({ loading: true });
        (kind === 'call' ? api.callNote(patient.id, key) : api.messageNote(patient.id, key))
          .then(r => setNoteView(r)).catch(e => setNoteView({ error: e.message }));
      };
      if (err) return <div className="card p-4 text-sm text-red-600">{err}</div>;
      return (
        <div className="card">
          <div className="card-h"><h2><i className="ti ti-timeline mr-1 text-accent" />Timeline</h2></div>
          {/* Same weight as My Day's calendar-read banner, and for the same
              reason: an empty thread and a thread we could not load look
              identical unless something says which one this is. This used to
              be a small amber line easy to miss below a page of visit rows —
              found live 2026-09-23 when a clinician read "no visits" off a
              thread that had actually failed to load, not gone empty. */}
          {data && data.emrNotice && (
            <div className="bg-amber-50 border-b border-amber-200 px-4 py-2 text-[12px] text-amber-900">
              <b>Visits could not be read from OpenEMR.</b> {data.emrNotice} This is not an empty chart — it is a chart we could not load.
            </div>
          )}
          <div className="px-4 pt-3 flex gap-1.5 flex-wrap">
            {(data ? data.kinds : Object.keys(TIMELINE_LABELS)).map(k => (
              <button key={k}
                className={`chip border ${filter.includes(k) ? 'bg-primary text-white border-primary' : 'bg-white text-stone-600 border-stone-200'}`}
                onClick={() => toggle(k)}>{TIMELINE_LABELS[k] || k}</button>
            ))}
            {filter.length > 0 && (
              <button className="chip bg-stone-100 text-stone-600" onClick={() => setFilter([])}>Clear</button>
            )}
          </div>
          <div className="p-4">
            {!data && <p className="text-sm text-stone-500">Loading…</p>}
            {data && data.rows.length === 0 && !data.emrNotice && (
              <p className="text-sm text-stone-500">
                {filter.length ? 'Nothing of that kind on this chart.' : 'Nothing on this chart yet.'}
              </p>
            )}
            {data && data.rows.map((r, i) => (
              <div key={`${r.kind}-${r.id || i}`} className="flex gap-3 py-2 border-b border-stone-100 last:border-0">
                <div className="w-[84px] shrink-0 text-[12px] text-stone-500 pt-0.5">{r.date}</div>
                <div className="w-5 shrink-0 text-accent pt-0.5"><i className={`ti ti-${r.icon}`} /></div>
