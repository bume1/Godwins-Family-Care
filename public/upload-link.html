<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Send a Document — Godwins Family Care</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#033D50', accent: '#C9A44A' },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['"DM Sans"', '"Inter"', 'system-ui', 'sans-serif'],
          },
        }
      }
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/brand/logo-mark-transparent.png">
  <link rel="stylesheet" href="/css/gfc-tokens.css">
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    // No login on this page, by design (owner, 2026-09-23) — the whole point
    // is that a family member can send a document without a portal password.
    // It reads its token out of the URL and talks to /api/gfc/upload/:token,
    // which is the only unauthenticated door in the app and reads nothing
    // back beyond a first name, a last initial and which documents are
    // still owed. See uploadLinks.js for what makes that safe.
    const MAX_FILE_BYTES = 10 * 1024 * 1024;

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error || new Error('Could not read that file.'));
        reader.readAsDataURL(file);
      });
    }

    function DocumentRow({ token, doc, onSent }) {
      const [busy, setBusy] = React.useState(false);
      const [error, setError] = React.useState('');
      const [justSent, setJustSent] = React.useState(false);
      const inputRef = React.useRef(null);

      async function handleFile(e) {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        setError('');
        if (file.size > MAX_FILE_BYTES) {
          setError('That file is larger than 10 MB. Try a smaller photo or a scan.');
          return;
        }
        setBusy(true);
        try {
          const fileDataB64 = await fileToDataUrl(file);
          const res = await fetch(`/api/gfc/upload/${token}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ kind: doc.kind, fileName: file.name, fileDataB64 })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'That upload did not go through. Please try again.');
          setJustSent(true);
          onSent(doc.kind);
        } catch (err) {
          setError(err.message || 'That upload did not go through. Please try again.');
        } finally {
          setBusy(false);
        }
      }

      const have = doc.have || justSent;

      return (
        <div className={`rounded-xl border p-4 flex items-start gap-3 ${have ? 'bg-green-50 border-green-200' : 'bg-white border-gray-200'}`}>
          <div className={`w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5 ${have ? 'bg-green-100' : 'bg-gray-100'}`}>
            {have ? (
              <svg className="w-5 h-5 text-green-600" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
              </svg>
            ) : (
              <svg className="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
              </svg>
            )}
          </div>
          <div className="flex-1 min-w-0">
            <div className="flex items-center gap-2 flex-wrap">
              <p className="text-gray-900 font-medium text-sm">{doc.label}</p>
              {doc.required && !have && <span className="text-[10px] uppercase tracking-wide font-semibold text-accent bg-amber-50 border border-amber-200 rounded px-1.5 py-0.5">Needed</span>}
            </div>
            {doc.hint && <p className="text-gray-500 text-xs mt-0.5">{doc.hint}</p>}
            {error && <p className="text-red-600 text-xs mt-1.5">{error}</p>}
            {have && !error && <p className="text-green-700 text-xs mt-1.5">{justSent ? 'Sent — thank you.' : 'Already on file.'}</p>}

            <div className="mt-2.5">
              <input
                ref={inputRef} type="file" accept="image/*,.pdf" capture="environment"
                className="hidden" onChange={handleFile}
              />
              <button
                type="button" disabled={busy}
                onClick={() => inputRef.current && inputRef.current.click()}
                className={`text-xs font-semibold rounded-lg px-3 py-2 transition-colors ${
                  busy ? 'bg-gray-100 text-gray-400' : have
                    ? 'bg-white border border-gray-200 text-gray-600 hover:bg-gray-50'
                    : 'bg-primary text-white hover:opacity-90'
                }`}
              >
                {busy ? 'Sending…' : have ? 'Send another' : 'Take a photo or choose a file'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function UploadLinkPage() {
      const [state, setState] = React.useState('loading'); // loading | ready | revoked | notfound | error
      const [data, setData] = React.useState(null);
      const [errorMsg, setErrorMsg] = React.useState('');

      const token = React.useMemo(() => {
        const match = window.location.pathname.match(/\/upload\/([^/]+)$/);
        return match ? match[1] : null;
      }, []);

      const load = React.useCallback(() => {
        if (!token) { setState('error'); setErrorMsg('This link is missing its code.'); return; }
        fetch(`/api/gfc/upload/${token}`)
          .then(async (res) => {
            const body = await res.json().catch(() => ({}));
            if (res.status === 410) { setState('revoked'); return; }
            if (res.status === 404) { setState('notfound'); return; }
            if (!res.ok) { setState('error'); setErrorMsg(body.error || 'Something went wrong loading this link.'); return; }
            setData(body); setState('ready');
          })
          .catch(() => { setState('error'); setErrorMsg('Unable to reach the server. Please try again.'); });
      }, [token]);

      React.useEffect(load, [load]);

      const markHave = (kind) => {
        setData((d) => d ? { ...d, checklist: d.checklist.map(c => c.kind === kind ? { ...c, have: true } : c) } : d);
      };

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-primary shadow-md">
            <div className="max-w-2xl mx-auto px-6 py-4 flex items-center justify-between">
              <div>
                <h1 className="text-white text-xl font-bold tracking-tight">Godwins Family Care</h1>
                <p className="text-blue-200 text-xs mt-0.5">Send a document — no account needed</p>
              </div>
              <span className="text-blue-200 text-sm hidden sm:block">(888) 365-8378</span>
            </div>
          </header>

          <main className="flex-1 flex items-start sm:items-center justify-center px-4 py-10">
            <div className="w-full max-w-md">

              {state === 'loading' && (
                <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-8 text-center">
                  <div className="w-10 h-10 border-4 border-primary border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                  <p className="text-gray-500 text-sm">Loading…</p>
                </div>
              )}

              {state === 'ready' && data && (
                <div className="space-y-4">
                  <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <h2 className="text-gray-900 font-semibold text-lg">
                      {data.firstName ? `Documents for ${data.firstName}${data.lastInitial ? ' ' + data.lastInitial + '.' : ''}` : 'Send a document'}
                    </h2>
                    <p className="text-gray-500 text-sm mt-1.5">
                      Take a photo or choose a file for anything below. It goes straight to their file at {data.orgName || 'Godwins Family Care'} — no account or password needed.
                    </p>
                  </div>

                  <div className="space-y-2.5">
                    {data.checklist.map((doc) => (
                      <DocumentRow key={doc.kind} token={token} doc={doc} onSent={markHave} />
                    ))}
                  </div>

                  <p className="text-center text-xs text-gray-400 px-4">
                    Sending something not on this list, or need help? Call the office at (404) 913-4582.
                  </p>
                </div>
              )}

              {state === 'revoked' && (
                <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-8 text-center">
                  <div className="w-12 h-12 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg className="w-6 h-6 text-amber-600" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                  </div>
                  <h2 className="text-gray-900 font-semibold text-lg mb-2">This link was turned off</h2>
                  <p className="text-gray-500 text-sm mb-6">Ask your care team for a new one.</p>
                  <a href="tel:8883658378" className="inline-block bg-primary text-white px-6 py-2.5 rounded-lg text-sm font-medium hover:opacity-90 transition-opacity">Call (888) 365-8378</a>
                </div>
              )}

              {(state === 'notfound' || state === 'error') && (
                <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-8 text-center">
                  <div className="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg className="w-6 h-6 text-red-600" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                  </div>
                  <h2 className="text-gray-900 font-semibold text-lg mb-2">This link isn't valid</h2>
                  <p className="text-gray-500 text-sm mb-6">{state === 'error' ? errorMsg : 'Double check the link, or ask your care team to send a new one.'}</p>
                  <a href="tel:8883658378" className="inline-block bg-primary text-white px-6 py-2.5 rounded-lg text-sm font-medium hover:opacity-90 transition-opacity">Call (888) 365-8378</a>
                </div>
              )}

            </div>
          </main>

          <footer className="text-center py-4 text-xs text-gray-400">
            &copy; {new Date().getFullYear()} Godwins Family Care LLC. All rights reserved.
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<UploadLinkPage />);
  </script>
</body>
</html>
