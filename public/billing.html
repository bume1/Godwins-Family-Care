<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Godwins Family Care — Billing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.1.0/dist/tabler-icons.min.css">
  <script src="/gfc-time.js"></script>
  <script>window.GFC_TIME && window.GFC_TIME.installDefaultTimeZone();</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <script src="/note-format.js"></script>
  <script>
    // The clinical workspace's palette, so a claim reads the same here as the
    // visit it came from.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#033D50', 50: '#e8f0f4', 100: '#c5d9e3', 500: '#033D50', 600: '#02334a', 700: '#022A38' },
            accent: '#C9A44A',
            cream: '#FAF7F2', creamdeep: '#efe9db',
            stone: { 50: '#FCFAF6', 100: '#F1ECE2', 200: '#E8E0D2', 300: '#D9CFBE', 400: '#8E9BA1',
              500: '#5b6b73', 600: '#4a5a62', 700: '#34444c', 800: '#1a2a32', 900: '#11202a' }
          },
          fontFamily: { serif: ['"Cormorant Garamond"', 'Georgia', 'serif'], sans: ['"DM Sans"', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="icon" type="image/png" href="/brand/logo-mark-transparent.png">
  <style>
    /* The Billing module (owner, 2026-10-15; the claims workspace 2026-11-04).
       Its own page, because billing covers both medical visits and home care
       and the person working claims needs none of the clinical chart. The
       classes below are the clinical workspace's, so the shared claim view
       (/components/claim-shared.jsx) looks the same on both pages. */
    :root { --navy:#033D50; --navy2:#0a5066; --navyd:#022A38; --goldd:#C9A44A; --gold:#F5CD85; --gold-ink:#9A7430;
      --cream:#FAF7F2; --wash:#F6EFE2; --edge:#ECE4D6; --edge2:#E1D7C5; --ink:#1a2a32; --mut:#5b6b73; --danger:#B5462E;
      --shadow:0 1px 2px rgba(3,61,80,.04),0 6px 18px -12px rgba(3,61,80,.18); }
    * { font-family: 'DM Sans', system-ui, sans-serif; }
    body { background: var(--cream); color: var(--ink); }
    .card { background:#fff; border:1px solid var(--edge); border-radius:16px; box-shadow:var(--shadow); }
    .card-h { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:14px 18px; border-bottom:1px solid var(--edge); }
    .card-h h2 { font-family:'Cormorant Garamond',serif; font-size:20px; color:var(--navy); font-weight:600; line-height:1.15; }
    .lblu { font-size:10.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--gold-ink); font-weight:700; }
    .inp { width:100%; border:1px solid var(--edge2); border-radius:10px; padding:8px 11px; font-size:13.5px; background:#fff; color:var(--ink); }
    .inp:focus { outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(3,61,80,.10); }
    .btn { display:inline-flex; align-items:center; gap:6px; border-radius:10px; padding:8px 15px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid var(--navy); background:var(--navy); color:#fff; text-decoration:none; }
    .btn:hover:not(:disabled) { background:var(--navy2); }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .btn.gold { background:#A9853A; border-color:#A9853A; color:#fff; }
    .btn.gold:hover:not(:disabled) { background:var(--gold-ink); }
    .btn.ghost { background:#fff; color:var(--navy); border-color:var(--edge2); }
    .btn.ghost:hover:not(:disabled) { background:var(--wash); }
    .chip { display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:2px 10px; font-size:11px; font-weight:600; white-space:nowrap; }
    .tabbtn { padding:10px 14px; font-size:14px; font-weight:600; color:rgba(255,255,255,.75); border-bottom:2.5px solid transparent; cursor:pointer; white-space:nowrap; background:none; border-top:0; border-left:0; border-right:0; }
    .tabbtn:hover { color:#fff; }
    .tabbtn.on { color:var(--gold); border-color:var(--gold); }
    .cw-row { transition:background .12s; }
    .cw-row:hover { background:#FCFAF6; }
    .cw-row.on { background:var(--wash); box-shadow:inset 3px 0 0 var(--goldd); }
    .fmt { font-size:13px; line-height:1.5; color:#1f2937; }
    .fmt ul { list-style:disc; padding-left:1.25rem; margin:2px 0; }
    .fmt ol { list-style:decimal; padding-left:1.4rem; margin:2px 0; }
    .fmt h3 { font-size:14px; font-weight:700; color:#033D50; margin:4px 0 2px; }
    .fmt strong { font-weight:700; } .fmt em { font-style:italic; } .fmt u { text-decoration:underline; }
    .sigblock { border:2px solid #033D50; border-radius:10px; padding:10px 12px; background:#fff; }
  </style>
  <script src="/session-guard.js"></script>
  <script src="/staff-nav.js"></script>
</head>
<body>
  <div id="root"></div>
<script type="text/babel" src="/components/claim-shared.jsx"></script>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;
const API = window.location.origin;
const getToken = () =>
  localStorage.getItem('admin_token') || localStorage.getItem('unified_token') || localStorage.getItem('portal_token');

const call = async (path, opts = {}) => {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${getToken()}`, ...(opts.headers || {}) }
  });
  let data = null;
  try { data = await res.json(); } catch (e) { /* empty */ }
  if (!res.ok) {
    const err = new Error((data && data.error) || `Request failed (${res.status})`);
    err.code = data && data.code; err.status = res.status; err.data = data;
    throw err;
  }
  return data;
};
const post = (path, body) => call(path, { method: 'POST', body: JSON.stringify(body || {}) });
const enc = encodeURIComponent;
const visit = (id, euuid) => `/api/clinical/patients/${enc(id)}/encounters/${enc(euuid)}`;
// Every route this page calls. They are the clinical workspace's own billing
// routes (requireBilling); this page adds no server rule of its own.
const api = {
  connection: () => call('/api/clinical/billing/connection'),
  emrConnect: () => call('/api/emr/connect?return=billing'),
  syncFacilities: () => post('/api/clinical/facilities/sync'),
  queue: (state) => call(`/api/clinical/encounters/queue?state=${enc(state)}`),
  encounterDetail: (id, euuid) => call(visit(id, euuid)),
  saveCoding: (id, euuid, body) => call(`${visit(id, euuid)}/coding`, { method: 'PUT', body: JSON.stringify(body) }),
  refreshPos: (id, euuid) => post(`${visit(id, euuid)}/pos/refresh`),
  // Both have existed with nothing calling them. `billing_facility` is WHO
  // bills a visit, which since the 2026-09-09 split is a different question
  // from where care happened — and nothing showed the current value, let
  // alone let billing change it for one visit.
  facilities: () => call('/api/clinical/facilities'),
  setBillingFacility: (id, euuid, facilityId) =>
    call(`${visit(id, euuid)}/billing-facility`, { method: 'PUT', body: JSON.stringify({ facilityId }) }),
  billingSubmit: (id, euuid, body) => post(`${visit(id, euuid)}/billing-submit`, body),
  claimScrub: (id, euuid) => call(`${visit(id, euuid)}/claim-scrub`),
  claimRelease: (id, euuid, body) => post(`${visit(id, euuid)}/claim-release`, body),
  charges: (id, euuid) => call(`${visit(id, euuid)}/charges`),
  voidCharge: (id, euuid, chargeId, reason) => call(`${visit(id, euuid)}/charges/${enc(chargeId)}`, { method: 'DELETE', body: JSON.stringify({ reason }) }),
  repostCharges: (id, euuid) => post(`${visit(id, euuid)}/charges/repost`),
  resolveEmFlag: (id, euuid, resolution) => post(`${visit(id, euuid)}/em-derivation/flag/resolve`, { resolution }),
  saveTcmDates: (id, euuid, body) => call(`${visit(id, euuid)}/tcm-dates`, { method: 'PUT', body: JSON.stringify(body) }),
  serviceFamilies: () => call('/api/clinical/service-selection/families'),
  selectService: (body) => post('/api/clinical/service-selection', body),
  codeSearch: (params) => call(`/api/clinical/codes/search?${new URLSearchParams(params).toString()}`),
  settings: () => call('/api/clinical/settings'),
  saveSettings: (body) => call('/api/clinical/settings', { method: 'PUT', body: JSON.stringify(body) }),
  emDistribution: (month) => call(`/api/clinical/reports/em-distribution${month ? `?month=${enc(month)}` : ''}`)
};
// The signed note, the code search and the service-line editor are the
// clinical workspace's own, shared (/components/claim-shared.jsx).
const { fmtTs, npiLabel, FormattedView, SignedNoteView, SvcEditor } = window.GFC_CLAIM_SHARED;
window.GFC_CLAIM_SHARED.configure({ codeSearch: api.codeSearch });

const usd = (c) => `$${(Number(c || 0) / 100).toFixed(2)}`;
const fmtDate = (iso) => {
  if (!iso) return '';
  try { return window.GFC_TIME ? window.GFC_TIME.fmtDate(iso) : new Date(iso).toLocaleDateString(); }
  catch (e) { return String(iso).slice(0, 10); }
};
const Field = ({ label, children, className }) => (
  <label className={`block ${className || ''}`}>
    <span className="lblu block mb-1">{label}</span>
    {children}
  </label>
);

// ── Billing's tools, moved here from the clinical workspace (2026-11-04) ──
// The E/M level and its review flag, the code helper, the claim scrub with
// its Release, the TCM dates and the E/M distribution. Their routes are
// requireBilling, and none of them is drawn on a clinician's screen.
const BillingLevelPanel = ({ patientId, euuid, derivation, onChanged }) => {
  const [note, setNote] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  if (!derivation) return <p className="text-xs text-stone-500">The clinician has not confirmed the visit facts, so no E/M level has been derived.</p>;
  const f = derivation.flag;
  const resolve = () => { setBusy(true); setErr(''); api.resolveEmFlag(patientId, euuid, note).then(() => { setNote(''); onChanged && onChanged(); }).catch(e => setErr(e.message)).finally(() => setBusy(false)); };
  return (
    <div className="grid gap-1.5 border border-stone-200 rounded-lg p-3 text-xs">
      <b className="text-primary text-[13px]"><i className="ti ti-stairs mr-1" />Derived E/M level: {derivation.finalCode}</b>
      <div className="text-stone-600">{derivation.explanation}</div>
      <div className="text-stone-600">Candidates: {(derivation.candidates || []).map(c => `${c.code} by ${c.basis === 'time' ? `time (${c.minutes} min)` : `MDM (${c.mdm})`}`).join(' · ')}. Default {derivation.defaultCode}{derivation.override ? `; the clinician chose ${derivation.finalCode} by time and affirmed it` : ''}.</div>
      {f && (
        <div className={`rounded px-2 py-1.5 border-l-2 ${f.resolvedAt ? 'border-stone-300 bg-stone-50' : 'border-amber-400 bg-amber-50'}`}>
          <b className={f.resolvedAt ? 'text-stone-700' : 'text-amber-900'}>Level review {f.resolvedAt ? `resolved ${fmtTs(f.resolvedAt)}${f.resolvedBy ? ` by ${f.resolvedBy.name}` : ''}` : 'open'}</b>
          {(f.absent || []).map((a, i) => <div key={i} className="text-stone-700">{a}</div>)}
          {(f.elements || []).map(e => (
            <div key={e.element} className="mt-1"><b className="text-stone-700">{e.element === 'problems' ? 'Problems' : e.element === 'data' ? 'Data' : 'Risk'}: {e.level}</b>
              {(e.facts || []).map((x, i) => <div key={i} className="text-stone-600">{x.description || x.detail}{x.quote ? <i> — “{x.quote}”</i> : <i> — added by the clinician</i>}</div>)}
            </div>
          ))}
          {f.resolvedAt && <div className="text-stone-600 mt-1">{f.resolution}</div>}
          {!f.resolvedAt && (
            <div className="grid gap-1.5 mt-1.5">
              <input className="inp" value={note} maxLength={1000} onChange={e => setNote(e.target.value)} placeholder="How it was resolved" />
              <button className="btn w-fit" disabled={busy || note.trim().length < 3} onClick={resolve}>Resolve Flag</button>
            </div>
          )}
        </div>
      )}
      {err && <p className="text-red-600">{err}</p>}
    </div>
  );
};


const OffersList = ({ offers }) => (!offers || !offers.length) ? null : (
  <div className="grid gap-1">
    <b className="text-[12px] text-stone-700">May apply, never added automatically</b>
    {offers.map((o, i) => <div key={i} className="text-xs border-l-2 border-sky-400 bg-sky-50 rounded px-2 py-1 text-sky-900">{o.message}</div>)}
  </div>
);
const TcmDatesForm = ({ patientId, euuid, tcm, onSaved }) => {
  const [f, setF] = useState({ dischargeDate: (tcm && tcm.dischargeDate) || '', contactDate: (tcm && tcm.contactDate) || '', faceToFaceDate: (tcm && tcm.faceToFaceDate) || '', complexity: (tcm && tcm.complexity) || '' });
  const [busy, setBusy] = useState(false); const [err, setErr] = useState('');
  const save = () => { setBusy(true); setErr(''); api.saveTcmDates(patientId, euuid, f).then(() => onSaved && onSaved()).catch(e => setErr(e.message)).finally(() => setBusy(false)); };
  return (
    <div className="grid gap-1 text-xs border border-stone-200 rounded-lg p-2">
      <b className="text-stone-700">Transitional care dates</b>
      {[['dischargeDate', 'Discharge'], ['contactDate', 'Interactive contact'], ['faceToFaceDate', 'Face-to-face (blank: this visit\'s date)']].map(([k, l]) => (
        <label key={k} className="flex items-center gap-2"><span className="w-56">{l}</span><input type="date" className="inp !py-1 text-xs" value={f[k]} onChange={e => setF({ ...f, [k]: e.target.value })} /></label>
      ))}
      <label className="flex items-center gap-2"><span className="w-56">Medical decision making</span>
        <select className="inp !py-1 text-xs" value={f.complexity} onChange={e => setF({ ...f, complexity: e.target.value })}>
          <option value="">From the derived level</option><option value="moderate">Moderate</option><option value="high">High</option>
        </select></label>
      <button className="btn w-fit !py-1 text-xs" disabled={busy} onClick={save}>Save Dates</button>
      {err && <p className="text-red-600">{err}</p>}
    </div>
  );
};

// ── Phase 3b: the code helper, billing's tool (2026-11-04) ──
// For the codes that are not level-based. The families and their inputs
// come from the server (serviceRules/), so this page names no code and no
// threshold. The answer is a suggestion with its reason; nothing is saved.
const CodeHelperPanel = ({ patientId, dos }) => {
  const [fams, setFams] = useState(null);
  const [family, setFamily] = useState('');
  const [input, setInput] = useState({});
  const [out, setOut] = useState(null);
  const [err, setErr] = useState('');
  useEffect(() => { api.serviceFamilies().then(r => setFams(r.families)).catch(e => setErr(e.message)); }, []);
  if (!fams) return err ? <p className="text-xs text-red-600">{err}</p> : null;
  const fam = fams.find(f => f.family === family);
  const shown = (fld) => !fld.when || Object.entries(fld.when).every(([k, vals]) => vals.includes(input[k] != null ? input[k] : ((fam.fields.find(x => x.key === k) || {}).options || [[]])[0][0]));
  const valueOf = (fld) => (input[fld.key] != null ? input[fld.key] : (fld.type === 'select' ? fld.options[0][0] : fld.type === 'boolean' ? false : ''));
  const run = () => {
    setErr(''); setOut(null);
    const body = {};
    for (const fld of fam.fields.filter(shown)) {
      const v = valueOf(fld);
      body[fld.key] = fld.type === 'number' ? (String(v).trim() === '' ? null : Number(v)) : v;
    }
    api.selectService({ family, input: { ...body, dos }, clientId: patientId, dos }).then(setOut).catch(e => setErr(e.message));
  };
  return (
    <div className="grid gap-1.5 border border-stone-200 rounded-lg p-3 text-xs">
      <b className="text-primary text-[13px]"><i className="ti ti-calculator mr-1" />Code helper</b>
      <select className="inp !py-1 text-xs w-fit" value={family} onChange={e => { setFamily(e.target.value); setInput({}); setOut(null); }}>
        <option value="">Choose a service family…</option>
        {fams.map(f => <option key={f.family} value={f.family}>{f.label}</option>)}
      </select>
      {fam && fam.fields.filter(shown).map(fld => (
        <label key={fld.key} className="flex items-center gap-2">
          {fld.type === 'boolean'
            ? <><input type="checkbox" checked={!!valueOf(fld)} onChange={e => setInput(i => ({ ...i, [fld.key]: e.target.checked }))} /><span>{fld.label}</span></>
            : <><span className="w-56">{fld.label}</span>
                {fld.type === 'select'
                  ? <select className="inp !py-1 text-xs" value={valueOf(fld)} onChange={e => setInput(i => ({ ...i, [fld.key]: e.target.value }))}>{fld.options.map(([k, l]) => <option key={k} value={k}>{l}</option>)}</select>
                  : <input className="inp !py-1 text-xs w-36" type={fld.type === 'date' ? 'date' : 'text'} inputMode={fld.type === 'number' ? 'numeric' : undefined} value={valueOf(fld)} onChange={e => setInput(i => ({ ...i, [fld.key]: fld.type === 'number' ? e.target.value.replace(/[^0-9]/g, '').slice(0, 4) : e.target.value }))} />}
              </>}
        </label>
      ))}
      {fam && <button className="btn w-fit !py-1 text-xs" onClick={run}>Work It Out</button>}
      {out && (
        <div className="grid gap-1">
          <div><b>{out.codes.length ? out.codes.map(c => (c.units > 1 ? `${c.code} × ${c.units}` : c.code)).join(', ') : 'No code'}</b>: {out.explanation}</div>
          {out.reviewFlag && <div className="border-l-2 border-amber-400 bg-amber-50 rounded px-2 py-1 text-amber-900">Level review: {(out.reviewFlag.absent || []).join(' ')}</div>}
          {(out.notes || []).map((n, i) => <div key={i} className="text-stone-600">{n}</div>)}
        </div>
      )}
      {err && <p className="text-red-600">{err}</p>}
    </div>
  );
};

// ── The claim scrub, billing's review surface (2026-11-04) ──
// On this page it is the claim's TO-DO LIST, first on the screen, and each
// finding links to the section that fixes it.
// EVERY finding, in full: blockers first, then warnings, each naming the
// field it concerns and what is wrong. Nothing is collapsed behind a count;
// the person on this screen is here to work the list. Before submission it
// checks the visit's own lines; after, the lines OpenEMR holds now, prices
// included, and that is the check Release runs again.
const ClaimScrubPanel = ({ patientId, euuid, refreshKey, onReleased, onGoTo }) => {
  const [s, setS] = useState(null);
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState('');
  const [reviewed, setReviewed] = useState(false);
  const [msg, setMsg] = useState('');
  const load = () => { setBusy('scan'); setErr(''); return api.claimScrub(patientId, euuid).then(r => { setS(r); setReviewed(false); }).catch(e => setErr(e.message)).finally(() => setBusy('')); };
  useEffect(() => { setS(null); setMsg(''); load(); }, [patientId, euuid, refreshKey]);
  const release = () => {
    setBusy('release'); setErr(''); setMsg('');
    api.claimRelease(patientId, euuid, { warningsReviewed: reviewed })
      .then(r => { setMsg(r.message); onReleased && onReleased(r); return load(); })
      .catch(e => { setErr(e.message); return load(); })
      .finally(() => setBusy(''));
  };
  if (!s) return <div className="text-xs text-stone-500">{err ? <span className="text-red-600">{err}</span> : 'Running the claim scrub…'}</div>;
  const blocks = s.findings.filter(f => f.severity === 'block');
  const warns = s.findings.filter(f => f.severity === 'warn');
  return (
    <div className="grid gap-2 border border-stone-200 rounded-lg p-3">
      <div className="flex flex-wrap items-center gap-2">
        <b className="text-primary text-[13px]"><i className="ti ti-checklist mr-1" />Claim scrub</b>
        <span className={`chip ${blocks.length ? 'bg-red-50 text-red-700' : 'bg-emerald-50 text-emerald-700'}`}>{blocks.length} blocking</span>
        <span className={`chip ${warns.length ? 'bg-amber-50 text-amber-800' : 'bg-stone-50 text-stone-600'}`}>{warns.length} warning{warns.length === 1 ? '' : 's'}</span>
        <button className="btn ghost !py-1 !px-2.5 text-xs ml-auto" disabled={!!busy} onClick={load}><i className="ti ti-refresh" />{busy === 'scan' ? 'Checking…' : 'Check Again'}</button>
      </div>
      <p className="text-[11px] text-stone-500">{s.phase === 'final'
        ? 'Checked against the charge lines OpenEMR holds now, prices included.'
        : 'Checked against the codes on this visit. Prices are checked once the lines post, at Release.'}</p>
      {s.chargeReadError && <p className="text-xs text-red-600">OpenEMR's charge lines could not be read ({s.chargeReadError}). The final charge set is unchecked.</p>}
      {s.findings.length === 0 && <p className="text-xs text-emerald-700">No findings.</p>}
      {s.needsTcmDates && <TcmDatesForm patientId={patientId} euuid={euuid} tcm={s.tcm} onSaved={load} />}
      {blocks.map((f, i) => (
        <div key={`b${i}`} className="text-xs border-l-2 border-red-400 bg-red-50 rounded px-2 py-1.5">
          <b className="text-red-800">{f.fieldLabel}</b><span className="text-red-800"> — {f.message}</span>
      <FixLink field={f.field} patientId={patientId} onGoTo={onGoTo} />
        </div>
      ))}
      {warns.map((f, i) => (
        <div key={`w${i}`} className="text-xs border-l-2 border-amber-400 bg-amber-50 rounded px-2 py-1.5">
          <b className="text-amber-900">{f.fieldLabel}</b><span className="text-amber-900"> — {f.message}</span>
      <FixLink field={f.field} patientId={patientId} onGoTo={onGoTo} />
        </div>
      ))}
      <OffersList offers={s.offers} />
      {s.holdState === 'held' && (
        <div className="grid gap-2 mt-1">
          {warns.length > 0 && (
            <label className="flex items-start gap-2 text-xs">
              <input type="checkbox" className="mt-0.5" checked={reviewed} onChange={e => setReviewed(e.target.checked)} />
              <span>I reviewed every warning above.</span>
            </label>
          )}
          <button className="btn gold w-fit" disabled={!!busy || blocks.length > 0 || (warns.length > 0 && !reviewed)} onClick={release}>
            <i className="ti ti-lock-open" />{busy === 'release' ? 'Releasing…' : 'Release Claim'}
          </button>
          <p className="text-[10.5px] text-stone-400">Release re-reads the lines in OpenEMR and refuses if anything blocking is open. Nothing transmits from this app; the release records that you reviewed the claim and let it go.</p>
        </div>
      )}
      {s.holdState === 'released' && s.release && <p className="text-xs text-emerald-700">Released {fmtTs(s.release.at)}{s.release.by ? ` by ${s.release.by.name}` : ''}.</p>}
      {msg && <p className="text-xs text-emerald-700">{msg}</p>}
      {err && <p className="text-xs text-red-600">{err}</p>}
    </div>
  );
};


// 3.6: E/M level distribution per clinician, this month against last, with

const EmDistributionCard = () => {

// ── Where a claim-scrub finding is fixed ──
// The finding's `field` names what it is about; this only decides which
// section of the claim (or which other screen) fixes it. An unknown field
// gets no link: a link to the wrong place is worse than none.
const SECTION_FOR_FIELD = [
  [/^lines/, 'codes'], [/^diagnoses/, 'codes'], [/^encounter\.(posCode|facility)/, 'pos'],
  [/^emDerivation/, 'level'], [/^(billingFacility|catalog|ncci)/, 'connection'], [/^totalMinutes|^psychotherapyMinutes/, 'note']
];
const FixLink = ({ field, patientId, onGoTo }) => {
  const f = String(field || '');
  if (/^patient\.insurance/.test(f)) {
    return <a className="ml-2 underline text-primary" href={`/admin/enrollment?client=${encodeURIComponent(patientId)}`}>Open the enrollment record</a>;
  }
  const hit = SECTION_FOR_FIELD.find(([re]) => re.test(f));
  if (!hit || !onGoTo) return null;
  const label = { codes: 'Go to codes', pos: 'Go to place of service', level: 'Go to E/M level', connection: 'Go to OpenEMR connection', note: 'Go to the note' }[hit[1]];
  return <button type="button" className="ml-2 underline text-primary" onClick={() => onGoTo(hit[1])}>{label}</button>;
};

// ── Is billing connected to OpenEMR? ──
// The chain a claim travels, link by link (billingConnection.js decides each
// one). Open while anything is wrong; one line once everything is right.
const CONNECTION_ICON = { ok: 'ti-circle-check text-emerald-600', blocked: 'ti-circle-x text-red-600', unknown: 'ti-help-circle text-amber-600', outside: 'ti-arrow-right-circle text-sky-700' };
const ConnectionCard = ({ refreshKey }) => {
  const [c, setC] = useState(null);
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState('');
  const [open, setOpen] = useState(null);
  const load = () => { setErr(''); return api.connection().then(setC).catch(e => setErr(e.message)); };
  useEffect(() => { load(); }, [refreshKey]);
  const signIn = () => {
    setBusy('signin');
    api.emrConnect().then(r => { if (r && r.url) window.location.href = r.url; }).catch(e => { setErr(e.message); setBusy(''); });
  };
  const sync = () => { setBusy('sync'); setErr(''); api.syncFacilities().then(load).catch(e => setErr(e.message)).finally(() => setBusy('')); };
  if (err && !c) return <div className="card p-4 mb-4 text-sm text-red-600">The OpenEMR connection could not be checked: {err}</div>;
  if (!c) return <div className="card p-4 mb-4 text-sm text-stone-500">Checking the connection to OpenEMR…</div>;
  const isOpen = open == null ? !c.ready : open;
  const needsSignIn = c.checks.some(x => x.key === 'emr_signin' && x.state !== 'ok');
  const needsSync = c.checks.some(x => x.key === 'billing_facility' && x.state !== 'ok');
  return (
    <div id="sec-connection" className="card mb-4">
      <button type="button" className="card-h w-full text-left" onClick={() => setOpen(!isOpen)} aria-expanded={isOpen}>
        <h2><i className="ti ti-plug-connected mr-1 text-accent" />OpenEMR Connection</h2>
        <span className="flex items-center gap-2">
          {c.ready
            ? <span className="chip bg-emerald-50 text-emerald-700">Ready to post claims</span>
            : <span className="chip bg-red-50 text-red-700">{c.blocked + c.unknown} to fix</span>}
          <i className={`ti ti-chevron-${isOpen ? 'up' : 'down'} text-stone-400`} />
        </span>
      </button>
      {isOpen && (
        <div className="p-4 grid gap-2.5 text-[13px]">
          {c.checks.map(x => (
            <div key={x.key} className="flex items-start gap-2.5">
              <i className={`ti ${CONNECTION_ICON[x.state] || CONNECTION_ICON.unknown} text-[18px] mt-0.5`} />
              <div className="min-w-0">
                <b className="text-primary">{x.label}</b>
                <div className="text-stone-600">{x.detail}</div>
                {x.fix && x.state !== 'ok' && <div className="text-[12px] text-stone-500 mt-0.5">{x.fix}</div>}
              </div>
            </div>
          ))}
          {err && <p className="text-xs text-red-600">{err}</p>}
          <div className="flex flex-wrap gap-2 mt-1">
            {needsSignIn && <button className="btn gold" disabled={busy === 'signin'} onClick={signIn}><i className="ti ti-login" />{busy === 'signin' ? 'Opening OpenEMR…' : 'Sign In to OpenEMR'}</button>}
            {needsSync && <button className="btn" disabled={busy === 'sync'} onClick={sync}><i className="ti ti-refresh" />{busy === 'sync' ? 'Syncing…' : 'Sync Facilities'}</button>}
            <button className="btn ghost" onClick={load}><i className="ti ti-refresh" />Check Again</button>
          </div>
          <p className="text-[11.5px] text-stone-500">
            {c.facilitiesSyncedAt ? `Facilities last read from OpenEMR ${fmtTs(c.facilitiesSyncedAt)}. ` : ''}
            Submit posts the charge lines to OpenEMR. Release records that you checked them. OpenEMR's Billing Manager then generates the claim and sends it to the clearinghouse.
          </p>
        </div>
      )}
    </div>
  );
};

// ── The charge lines OpenEMR holds for a submitted visit ──
// Read back from OpenEMR, never the app's copy: this is what Billing Manager
// will put on the claim. Void (with a reason) and re-post live here.
const ChargeLines = ({ patientId, euuid, refreshKey, onChanged }) => {
  const [r, setR] = useState(null);
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState('');
  const [msg, setMsg] = useState(null);
  const load = () => { setErr(''); return api.charges(patientId, euuid).then(setR).catch(e => setErr(e.message)); };
  useEffect(() => { setR(null); load(); }, [patientId, euuid, refreshKey]);
  const act = (key, fn) => {
    setBusy(key); setMsg(null);
    return fn().then(x => { setMsg({ ok: true, text: x.message || 'Done.' }); onChanged && onChanged(); return load(); })
      .catch(e => setMsg({ ok: false, text: e.message })).finally(() => setBusy(''));
  };
  const voidLine = (c) => {
    const reason = window.prompt(`Why void ${c.code}? OpenEMR keeps the line, marked inactive.`);
    if (reason && reason.trim()) act(`void:${c.id}`, () => api.voidCharge(patientId, euuid, c.id, reason.trim()));
  };
  const lines = r ? (r.charges || []).filter(c => ['CPT4', 'HCPCS'].includes(String(c.code_type || '').toUpperCase())) : [];
  return (
    <div className="grid gap-2 text-[13px]">
      {err && <p className="text-xs text-red-600">OpenEMR's charge lines could not be read: {err}</p>}
      {!r && !err && <p className="text-xs text-stone-500">Reading the charge lines from OpenEMR…</p>}
      {r && lines.length === 0 && <p className="text-xs text-amber-700">OpenEMR holds no active charge lines for this visit.</p>}
      {lines.map(c => (
        <div key={c.id} className="flex flex-wrap items-center justify-between gap-2 border-b border-stone-100 pb-1.5">
          <div><b className="font-mono">{c.code}</b>{c.modifier ? <span className="font-mono">-{c.modifier}</span> : null} <span className="text-stone-500">× {c.units || 1}</span>
            <span className="ml-2">{c.fee != null ? `$${Number(c.fee).toFixed(2)}` : ''}</span>
            {c.justify ? <span className="ml-2 text-[11.5px] text-stone-500">dx {String(c.justify).replace(/ICD10\|/g, '').replace(/:$/, '').split(':').join(', ')}</span> : null}
          </div>
          <button className="btn ghost !py-1 !px-2.5 text-xs" disabled={!!busy} onClick={() => voidLine(c)}>{busy === `void:${c.id}` ? 'Voiding…' : 'Void'}</button>
        </div>
      ))}
      {r && !r.chargesPosted && (
        <div className="flex flex-wrap items-center gap-2">
          <span className="text-xs text-amber-800">Posting did not finish for every line.</span>
          <button className="btn !py-1 text-xs" disabled={!!busy} onClick={() => act('repost', () => api.repostCharges(patientId, euuid))}><i className="ti ti-send" />{busy === 'repost' ? 'Posting…' : 'Post Missing Lines'}</button>
        </div>
      )}
      {msg && <p className={`text-xs ${msg.ok ? 'text-emerald-700' : 'text-red-600'}`}>{msg.text}</p>}
    </div>
  );
};

// ── One claim ──
// Everything billing does to a signed visit, in the order it is done: the
// scrub's to-do list, the codes, the level, the place of service, submit,
// then the lines OpenEMR holds. The signed note is below to read.
const Section = ({ id, title, right, children }) => (
  <div id={`sec-${id}`} className="card mb-4">
    <div className="card-h"><h2>{title}</h2>{right}</div>
    <div className="p-4">{children}</div>
  </div>
);
// WHO BILLS THIS VISIT, and the one place it can be changed per visit.
//
// `form_encounter.billing_facility` is the business entity on the claim. The
// 2026-09-09 split separated it from `facility_id` (where care happened),
// which for a home-visit practice are almost never the same record.
// `PUT .../billing-facility` has been able to override it for a single visit
// since Session 4.5 and nothing ever called it, so the only way to correct a
// visit billed to the wrong entity was in OpenEMR by hand.
//
// The facility list is READ FROM OPENEMR, never named here. A list that
// cannot be read is said to be unreadable rather than shown empty: an empty
// picker and "OpenEMR has no facilities" are different facts, and only one
// of them is this page's to claim.
const BillingFacilityRow = ({ clientId, euuid, encounter, canEdit, onChanged }) => {
  const [rows, setRows] = React.useState(null);   // null = loading, false = unreadable
  const [open, setOpen] = React.useState(false);
  const [pick, setPick] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const [err, setErr] = React.useState('');
  const [msg, setMsg] = React.useState('');
  React.useEffect(() => {
    let dead = false;
    api.facilities()
      .then(r => { if (!dead) setRows((r && r.facilities) || []); })
      .catch(() => { if (!dead) setRows(false); });
    return () => { dead = true; };
  }, []);
  const current = encounter.billingFacilityId || null;
  const named = Array.isArray(rows) ? rows.find(f => String(f.id) === String(current)) : null;
  const save = async () => {
    setBusy(true); setErr(''); setMsg('');
    try {
      const r = await api.setBillingFacility(clientId, euuid, pick);
      setMsg(r.message || 'Saved.'); setOpen(false); onChanged && onChanged();
    } catch (e) { setErr(e.message); } finally { setBusy(false); }
  };
  return (
    <div className="mt-2 pt-2 border-t border-stone-100 text-[13px]">
      <div className="flex flex-wrap items-center gap-3">
        <span>
          Billing facility{' '}
          <b>{current
            ? (named ? `${named.name} (${current})` : current)
            : <span className="text-amber-700">not set on this visit</span>}</b>
        </span>
        {canEdit && !open && <button className="btn ghost !py-1 !px-2.5 text-xs" onClick={() => { setPick(current || ''); setOpen(true); }}>Change</button>}
      </div>
      {err && <p className="text-[11.5px] text-red-700 mt-1">{err}</p>}
      {msg && <p className="text-[11.5px] text-[#0f6e56] mt-1">{msg}</p>}
      {rows === false && <p className="text-[11.5px] text-amber-700 mt-1">OpenEMR's facility list could not be read, so this cannot be changed here. That is not the same as there being no facilities.</p>}
      {open && Array.isArray(rows) && (
        <div className="flex flex-wrap items-center gap-2 mt-2">
          <select className="inp !py-1 text-xs w-auto" value={pick} onChange={e => setPick(e.target.value)}>
            <option value="">Choose a facility…</option>
            {/* Only a facility OpenEMR marks as a billing location can be the
                business entity on a claim; the rest are shown as not billing
                rather than hidden, so a wrong flag in OpenEMR is visible here
                instead of looking like a missing record. */}
            {rows.map(f => (
              <option key={f.id} value={f.id}>
                {f.name} ({f.id}){f.billingLocation ? '' : ' — not a billing location in OpenEMR'}
              </option>
            ))}
          </select>
          <button className="btn !py-1 !px-2.5 text-xs" disabled={busy || !pick} onClick={save}>{busy ? 'Saving…' : 'Set Billing Facility'}</button>
          <button className="btn ghost !py-1 !px-2.5 text-xs" onClick={() => setOpen(false)}>Cancel</button>
        </div>
      )}
      <p className="text-[11.5px] text-stone-500 mt-1">
        Who bills this visit, which is not where care happened. It is written to the encounter, never to a charge.
      </p>
    </div>
  );
};

const ClaimDetail = ({ claim, names, isAdmin, onBack, onChanged }) => {
  const { clientId, encounterUuid: euuid } = claim;
  const [d, setD] = useState(null);
  const [err, setErr] = useState('');
  const [services, setServices] = useState([]);
  const [busy, setBusy] = useState('');
  const [msg, setMsg] = useState(null);
  const [attest, setAttest] = useState(false);
  const [noChargeOpen, setNoChargeOpen] = useState(false);
  const [noChargeReason, setNoChargeReason] = useState('');
  const [insBlock, setInsBlock] = useState(null);
  const [insOverrideReason, setInsOverrideReason] = useState('');
  const [tick, setTick] = useState(0);
  const load = useCallback(() => {
    setErr('');
    return api.encounterDetail(clientId, euuid).then(r => { setD(r); setServices(r.record.services || []); }).catch(e => setErr(e.message));
  }, [clientId, euuid]);
  useEffect(() => { setD(null); setMsg(null); setAttest(false); setNoChargeOpen(false); setInsBlock(null); load(); }, [load]);
  const run = (key, fn) => {
    setBusy(key); setMsg(null);
    return fn().then(r => {
      setMsg({ ok: true, text: `${r.message || 'Saved.'}${r.warnings && r.warnings.length ? ` — ${r.warnings.join(' · ')}` : ''}` });
      setTick(t => t + 1); onChanged && onChanged(); load(); return r;
    }).catch(e => { setMsg({ ok: false, text: e.message }); throw e; }).finally(() => setBusy(''));
  };
  const goTo = (section) => { const el = document.getElementById(`sec-${section}`); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  if (err) return <div className="card p-4"><p className="text-sm text-red-600">{err}</p><button className="btn ghost mt-2" onClick={onBack}>Back</button></div>;
  if (!d) return <div className="card p-6 text-sm text-stone-500">Loading the visit from OpenEMR…</div>;
  const ba = d.billingActions || {};
  const ns = d.noteState || {};
  const rec = d.record || {};
  const awaitingAddendum = rec.coSignStatus === 'pending';
  const dirty = JSON.stringify(services) !== JSON.stringify(rec.services || []);
  const status = d.billingStatus;
  const patientName = claim.patientName || names.get(clientId) || 'Patient';
  const saveCodes = () => run('codes', () => api.saveCoding(clientId, euuid, {
    diagnoses: rec.diagnoses || [], services, addToProblemList: [],
    patientSummary: rec.patientSummary || '', followUpInstructions: rec.followUpInstructions || ''
  }));
  const submit = (body) => {
    setInsBlock(null);
    return run('bill', () => api.billingSubmit(clientId, euuid, body).catch(e => { if (e.data && e.data.overridable) setInsBlock(e.data); throw e; }))
      .then(() => { setAttest(false); setInsOverrideReason(''); }).catch(() => {});
  };
  return (
    <div className="min-w-0">
      <button className="text-xs text-primary underline mb-2 xl:hidden" onClick={onBack}><i className="ti ti-arrow-left" /> All claims</button>
      <div className="card mb-4">
        <div className="card-h">
          <h2>{patientName} · {d.encounter.reason || rec.reason || 'Visit'}</h2>
          <span className={`chip ${status === 'awaiting_billing' ? 'bg-amber-50 text-amber-800' : status === 'no_charge' ? 'bg-stone-100 text-stone-600' : status === 'billed' ? 'bg-emerald-50 text-emerald-700' : 'bg-stone-100 text-stone-600'}`}>
            {status === 'awaiting_billing' ? 'AWAITING BILLING' : status === 'billed' ? 'SUBMITTED' : status === 'no_charge' ? 'NO CHARGE' : awaitingAddendum ? 'AWAITING CLINICIAN ADDENDUM' : 'NOT SIGNED'}
          </span>
        </div>
        <div className="p-4 flex flex-wrap gap-x-5 gap-y-1 text-xs text-stone-600">
          <span>Date of service <b>{d.encounter.date || rec.date || '—'}</b></span>
          <span>OpenEMR encounter <b>#{d.encounter.eid || '—'}</b></span>
          <span>Rendering clinician <b>{npiLabel(rec.renderingProvider)}</b></span>
          <span>Billing provider NPI <b>{d.billingNpiUsed || <span className="text-red-600">not set (Settings)</span>}</b></span>
          {d.attestation && d.attestation.signedAt && <span>Signed <b>{fmtTs(d.attestation.signedAt)}</b></span>}
          <a className="underline text-primary" href={`/api/clinical/patients/${encodeURIComponent(clientId)}/encounters/${encodeURIComponent(euuid)}/note.pdf?token=${encodeURIComponent(getToken() || '')}`} target="_blank" rel="noopener noreferrer">Note PDF</a>
        </div>
      </div>

      {msg && <div className={`card p-3 mb-4 text-sm ${msg.ok ? 'text-emerald-700' : 'text-red-600'}`}>{msg.text}</div>}
      {awaitingAddendum && <div className="card p-4 mb-4 text-sm text-amber-800">Signed by the note's author and waiting for a clinician addendum. It is not billable until a provider (or an LCSW, for behavioral health) adds it.</div>}

      {(status === 'awaiting_billing' || status === 'billed') && (
        <Section id="scrub" title="Before This Claim Goes">
          <ClaimScrubPanel patientId={clientId} euuid={euuid} refreshKey={`${status}|${rec.updatedAt || ''}|${tick}`} onGoTo={goTo}
            onReleased={() => { setTick(t => t + 1); onChanged && onChanged(); load(); }} />
        </Section>
      )}

      <Section id="codes" title="Codes" right={dirty ? <span className="chip bg-amber-50 text-amber-800">Unsaved</span> : null}>
        <div className="grid gap-4">
          <div>
            <span className="lblu block mb-1">Diagnoses (ICD-10-CM), as the clinician signed them</span>
            {(rec.diagnoses || []).length === 0 && <p className="text-xs text-stone-400">No diagnoses on this visit.</p>}
            {(rec.diagnoses || []).map(dx => (
              <div key={dx.code} className="text-[13px] py-1 border-b border-stone-100"><b className="font-mono">{dx.code}</b> {dx.description}{dx.primary && <span className="chip bg-accent text-primary ml-1">PRIMARY</span>}</div>
            ))}
            <p className="text-[11.5px] text-stone-500 mt-1">A change to a diagnosis is the clinician's, as an addendum on the visit.</p>
          </div>
          <div>
            <span className="lblu block mb-1">Services (CPT / HCPCS), each linked to a diagnosis</span>
            <SvcEditor services={services} setServices={setServices} diagnoses={rec.diagnoses || []} readOnly={!ba.canEditCoding}
              practiceFavorites={(d.favorites && d.favorites.practiceServices) || []} favorites={(d.favorites && d.favorites.services) || []} />
            {!ba.canEditCoding && <p className="text-[11.5px] text-stone-500 mt-1">{status === 'billed' ? 'Submitted, so the codes are locked here. Correct a posted line below, or in OpenEMR\'s Billing Manager.' : 'Codes are finished here once the clinician has signed.'}</p>}
          </div>
          {ba.canEditCoding && (
            <div className="flex items-center gap-3">
              <button className="btn" disabled={!dirty || busy === 'codes'} onClick={() => saveCodes().catch(() => {})}><i className="ti ti-device-floppy" />{busy === 'codes' ? 'Saving…' : 'Save Codes'}</button>
              {dirty && <span className="text-xs text-amber-700">Save before you submit.</span>}
            </div>
          )}
          {(d.modifierJustifications || []).length > 0 && (
            <div className="grid gap-1 text-xs">
              <b className="text-stone-700">Modifier reasons from the clinician</b>
              {d.modifierJustifications.map(x => (
                <div key={x.key} className={x.justification ? 'text-stone-600' : 'text-amber-800'}>{x.modifier} on {x.code}: {x.justification ? `${x.justification.text} (${(x.justification.by || {}).name || 'clinician'})` : 'no reason recorded yet. The rendering clinician records it on the visit\'s Sign step.'}</div>
              ))}
            </div>
          )}
          {status === 'awaiting_billing' && (
            <details className="border border-stone-200 rounded-lg">
              <summary className="cursor-pointer px-3 py-2 text-xs font-semibold text-primary">Code helper, for codes that are not level-based</summary>
              <div className="p-2"><CodeHelperPanel patientId={clientId} dos={rec.date} /></div>
            </details>
          )}
        </div>
      </Section>

      <Section id="level" title="E/M Level">
        <BillingLevelPanel patientId={clientId} euuid={euuid} derivation={d.emDerivation} onChanged={() => { load(); setTick(t => t + 1); }} />
      </Section>

      <Section id="pos" title="Place of Service">
        <div className="flex flex-wrap items-center gap-3 text-[13px]">
          <span>Place of service <b>{d.encounter.posCode || <span className="text-amber-700">not set</span>}</b>{d.encounter.facility ? <> · {d.encounter.facility}</> : null}</span>
          {ba.canRefreshPos && <button className="btn ghost !py-1 !px-2.5 text-xs" disabled={busy === 'pos'} onClick={() => run('pos', () => api.refreshPos(clientId, euuid)).catch(() => {})}><i className="ti ti-refresh" />{busy === 'pos' ? 'Setting…' : 'Refresh POS'}</button>}
        </div>
        {d.posMissingReason && !d.encounter.posCode && <p className="text-[11.5px] text-amber-700 mt-1">{d.posMissingReason}</p>}
        <p className="text-[11.5px] text-stone-500 mt-1">A missing place of service is set from the patient's facility when you submit.</p>
        <BillingFacilityRow clientId={clientId} euuid={euuid} encounter={d.encounter} canEdit={ba.canSubmit} onChanged={load} />
      </Section>

      {ba.canSubmit && (
        <Section id="submit" title="Submit to Billing">
          <div className="grid gap-3 text-sm">
            {d.billingReadiness && !d.billingReadiness.ok && <p className="text-xs text-amber-700">{d.billingReadiness.message}</p>}
            <p className="text-xs text-stone-600">Submit runs the claim scrub, then posts the charge lines to OpenEMR's Fee Sheet with <b>{npiLabel(rec.renderingProvider)}</b> as the rendering clinician. The claim then waits in the Hold Queue for you to release it.</p>
            <label className="flex items-start gap-2 text-xs">
              <input type="checkbox" className="mt-0.5" checked={attest} onChange={e => setAttest(e.target.checked)} />
              <span>The service codes and modifiers on this visit are supported by the signed note.</span>
            </label>
            <div className="flex flex-wrap gap-2">
              <button className="btn gold w-fit" disabled={!attest || dirty || busy === 'bill'} onClick={() => submit({ attest: true })}>
                <i className="ti ti-send" />{busy === 'bill' ? 'Submitting…' : 'Submit to Billing'}
              </button>
              {!noChargeOpen && <button className="btn ghost w-fit" onClick={() => setNoChargeOpen(true)}>No Charge…</button>}
            </div>
            {dirty && <p className="text-xs text-amber-700">Save your code changes first.</p>}
            {insBlock && (isAdmin ? (
              <div className="grid gap-2 border border-amber-200 bg-amber-50 rounded-lg p-2.5">
                <label className="text-xs text-amber-900">Override the insurance check? Say why. The reason is saved on this claim.</label>
                <input className="inp" value={insOverrideReason} maxLength={500} onChange={e => setInsOverrideReason(e.target.value)} placeholder="e.g. Verified by phone with the plan on 10/13" />
                <button className="btn w-fit" disabled={!insOverrideReason.trim() || !attest || busy === 'bill'} onClick={() => submit({ attest: true, insuranceOverride: { reason: insOverrideReason } })}>Override and Submit</button>
              </div>
            ) : <p className="text-xs text-amber-800">Record the eligibility check on the patient's <a className="underline" href={`/admin/enrollment?client=${encodeURIComponent(clientId)}`}>enrollment record</a>, or ask an admin to override it with a reason.</p>)}
            {noChargeOpen && (
              <div className="grid gap-2 border border-stone-200 rounded-lg p-2.5">
                <label className="text-xs text-stone-600">Why is this visit not being billed?</label>
                <input className="inp" value={noChargeReason} maxLength={500} onChange={e => setNoChargeReason(e.target.value)} placeholder="e.g. Courtesy phone follow-up" />
                <div className="flex gap-2">
                  <button className="btn w-fit" disabled={noChargeReason.trim().length < 3 || busy === 'nocharge'}
                    onClick={() => run('nocharge', () => api.billingSubmit(clientId, euuid, { noCharge: true, reason: noChargeReason })).then(() => { setNoChargeOpen(false); setNoChargeReason(''); }).catch(() => {})}>
                    Close with No Charge
                  </button>
                  <button className="btn ghost w-fit" onClick={() => setNoChargeOpen(false)}>Cancel</button>
                </div>
              </div>
            )}
          </div>
        </Section>
      )}

      {status === 'billed' && (
        <Section id="charges" title="Charge Lines in OpenEMR">
          <p className="text-xs text-stone-600 mb-2">Submitted {rec.billingSubmittedAt ? fmtTs(rec.billingSubmittedAt) : ''}{rec.billingSubmittedBy ? ` by ${rec.billingSubmittedBy.name}` : ''}. These are the lines OpenEMR holds now, read back from it.</p>
          <ChargeLines patientId={clientId} euuid={euuid} refreshKey={tick} onChanged={() => setTick(t => t + 1)} />
        </Section>
      )}
      {status === 'no_charge' && <div className="card p-4 mb-4 text-sm text-stone-600">Closed with no charge. Reason: {rec.noChargeReason}</div>}

      <Section id="note" title="Signed Note" right={d.totalTime ? <span className="text-xs text-stone-500">{d.totalTime.minutes} minutes total</span> : null}>
        {ns.note ? <SignedNoteView note={ns.note} noteSections={d.noteSections} signature={ns.signature} revisions={ns.revisions} />
          : <p className="text-sm text-stone-500">The note could not be read.</p>}
        {(d.addenda || []).length > 0 && (
          <div className="mt-3 grid gap-2">
            {d.addenda.map(a => (
              <div key={a.id} className="border-l-4 border-accent pl-3 py-1">
                <div className="text-xs text-stone-500">{a.kind === 'clinician_addendum' ? <b className="text-primary">Clinician addendum</b> : 'Addendum'} · {a.signedBy && a.signedBy.name} · {fmtTs(a.signedAt)}</div>
                <FormattedView markup={a.text} />
              </div>
            ))}
          </div>
        )}
      </Section>
    </div>
  );
};

// The claims workspace: the list beside the open claim on a wide screen, one
// or the other on a narrow one.
const ClaimsView = ({ names, initialClaim, isAdmin }) => {
  const [filter, setFilter] = useState('awaiting_billing');
  const [claim, setClaim] = useState(initialClaim || null);
  const [refreshKey, setRefreshKey] = useState(0);
  const open = (e) => {
    setClaim({ clientId: e.clientId, encounterUuid: e.encounterUuid, patientName: e.patientName });
    try { history.replaceState(null, '', `/billing?client=${encodeURIComponent(e.clientId)}&encounter=${encodeURIComponent(e.encounterUuid)}#claims`); } catch (x) { /* no history */ }
  };
  const back = () => { setClaim(null); try { history.replaceState(null, '', '/billing#claims'); } catch (x) { /* no history */ } };
  return (
    <>
      <ConnectionCard refreshKey={refreshKey} />
      <div className="xl:grid xl:grid-cols-[400px_minmax(0,1fr)] xl:gap-5">
        <div className={claim ? 'hidden xl:block' : ''}>
          <ClaimList filter={filter} setFilter={setFilter} selected={claim && claim.encounterUuid} onOpen={open} refreshKey={refreshKey} />
        </div>
        <div className={claim ? '' : 'hidden xl:block'}>
          {claim
            ? <ClaimDetail key={claim.encounterUuid} claim={claim} names={names} isAdmin={isAdmin} onBack={back} onChanged={() => setRefreshKey(k => k + 1)} />
            : <div className="card p-8 text-center text-sm text-stone-500 hidden xl:block"><i className="ti ti-receipt text-3xl text-accent block mb-2" />Choose a claim from the list.</div>}
        </div>
      </div>
    </>
  );
};

// ── Settings: the billing provider and the practice's service favorites ──
// Moved here from the clinical workspace's Coding queue (owner, 2026-11-04).
const BillingSettings = () => {
  const [s, setS] = useState(null);
  const [f, setF] = useState(null);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  useEffect(() => {
    api.settings().then(r => {
      setS(r);
      setF({ billingNpiUsed: r.billingNpiUsed || '', billingProviderName: r.billingProviderName || '', favorites: (r.serviceCodeFavorites || []).map(x => `${x.code} | ${x.label || ''}`).join('\n') });
    }).catch(e => setMsg({ ok: false, text: e.message }));
  }, []);
  if (!s || !f) return msg ? <div className="card p-4 text-sm text-red-600">{msg.text}</div> : <div className="card p-4 text-sm text-stone-500">Loading settings…</div>;
  const save = () => {
    setBusy(true); setMsg(null);
    api.saveSettings({
      billingNpiUsed: f.billingNpiUsed, billingProviderName: f.billingProviderName,
      serviceCodeFavorites: f.favorites.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const [code, ...rest] = l.split('|'); return { code: code.trim(), label: rest.join('|').trim() }; })
    }).then(r => setMsg({ ok: true, text: r.message })).catch(e => setMsg({ ok: false, text: e.message })).finally(() => setBusy(false));
  };
  const npiSet = s.billingNpiSource === 'record' || s.billingNpiSource === 'env_seed';
  return (
    <div className="card mb-4">
      <div className="card-h"><h2>Billing Settings</h2>
        {npiSet ? <span className="chip bg-emerald-50 text-emerald-700">NPI set</span> : <span className="chip bg-red-50 text-red-700">NPI not set</span>}
      </div>
      <div className="p-4 grid gap-3 text-sm">
        {!s.isAdmin && <p className="text-xs text-stone-500">An admin changes these.</p>}
        <div className="grid md:grid-cols-2 gap-3">
          <Field label={`Billing provider NPI (${s.billingNpiSource === 'record' ? 'set here' : s.billingNpiSource === 'env_seed' ? 'seeded from env' : 'NOT SET — submitting is blocked'})`}>
            <input className="inp font-mono" maxLength={10} disabled={!s.isAdmin} value={f.billingNpiUsed} onChange={e => setF({ ...f, billingNpiUsed: e.target.value.replace(/\D/g, '') })} />
          </Field>
          <Field label="Billing provider name"><input className="inp" disabled={!s.isAdmin} value={f.billingProviderName} onChange={e => setF({ ...f, billingProviderName: e.target.value })} /></Field>
        </div>
        <Field label="Practice service-code favorites — one per line: CODE | label (codes must exist in OpenEMR's fee schedule)">
          <textarea className="inp font-mono text-xs" rows={6} disabled={!s.isAdmin} value={f.favorites} onChange={e => setF({ ...f, favorites: e.target.value })} />
        </Field>
        {msg && <p className={`text-xs ${msg.ok ? 'text-emerald-700' : 'text-red-600'}`}>{msg.text}</p>}
        {s.isAdmin && <button className="btn w-fit" disabled={busy} onClick={save}>{busy ? 'Saving…' : 'Save Settings'}</button>}
        <p className="text-[11.5px] text-stone-500">The billing provider is the NPI every visit bills under, never written into the code. The rendering provider is always the signing clinician. OpenEMR's own billing-facility record (NPI, EIN, taxonomy) is what prints on the claim; the connection check on Claims reads it.</p>
      </div>
    </div>
  );
};

// ---- Statements and invoices -----------------------------------------------
const STATEMENT_CHIP = { draft: 'bg-stone-100 text-stone-600', open: 'bg-amber-50 text-amber-800', paid: 'bg-emerald-50 text-emerald-700', void: 'bg-red-50 text-red-700' };
// The invoice PDF, opened with the sign-in token in the header (never the URL).
const openInvoicePdf = async (inv) => {
  const w = window.open('', '_blank');
  try {
    const res = await fetch(`${API}/api/gfc/admin/billing/invoices/${enc(inv.id)}/pdf`, { headers: { Authorization: `Bearer ${getToken()}` } });
    if (!res.ok) { let j = {}; try { j = await res.json(); } catch (e) { /* not json */ } throw new Error(j.error || `Could not open the invoice (${res.status})`); }
    const url = URL.createObjectURL(await res.blob());
    if (w) w.location.href = url; else window.location.href = url;
  } catch (e) { if (w) w.close(); throw e; }
};
const statementLabel = (i) => i.kind === 'copay' ? 'Copay'
  : i.format === 'carrier' ? `Carrier invoice · ${(i.billTo && i.billTo.name) || ''}${i.serviceDate ? ` · ${i.serviceDate}` : ''}`
  : i.format === 'family' ? `Home care invoice${i.period ? ` ${i.period.from} to ${i.period.to}` : ''}`
  : `Home care${i.period ? ` ${i.period.from} to ${i.period.to}` : ''}`;
const Statements = ({ data, reload }) => {
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState('');
  const [show, setShow] = useState('outstanding');
  const act = (inv, action, body) => {
    setBusy(inv.id); setErr('');
    post(`/api/gfc/admin/billing/invoices/${enc(inv.id)}/${action}`, body).then(reload).catch(e => setErr(e.message)).finally(() => setBusy(''));
  };
  const rows = data.invoices.filter(i => show === 'all' ? true : show === 'outstanding' ? (i.status === 'draft' || i.status === 'open') : i.status === show);
  return (
    <div className="card">
      <div className="card-h"><h2>Statements and Invoices</h2></div>
      <div className="p-4">
        <p className="text-[13px] text-stone-500 mb-3">Copays, home care invoices and LTC carrier invoices. A draft is checked here, then sent. A carrier invoice is sent to the carrier as its PDF; the patient never sees it.</p>
        {!data.stripe.configured && <div className="rounded-lg border border-amber-200 bg-amber-50 text-amber-900 text-[13px] p-3 mb-3">Online payment is not set up yet. Statements still work; patients are told to call to pay.</div>}
        {err && <div className="rounded-lg border border-red-200 bg-red-50 text-red-800 text-[13px] p-3 mb-3">{err}</div>}
        <div className="flex gap-2 mb-3 overflow-x-auto">
          {[['outstanding', 'Outstanding'], ['draft', 'Drafts'], ['open', 'Sent'], ['paid', 'Paid'], ['void', 'Void'], ['all', 'All']].map(([k, l]) => (
            <button key={k} onClick={() => setShow(k)}
              className={`px-3.5 py-1.5 rounded-full text-[13px] font-semibold border whitespace-nowrap ${show === k ? 'bg-[#A9853A] border-[#A9853A] text-white' : 'bg-white border-stone-200 text-primary'}`}>{l}</button>
          ))}
        </div>
        {rows.length === 0 && <p className="text-sm text-stone-500 py-6 text-center">No statements here.</p>}
        {rows.map(i => (
          <div className="flex flex-wrap justify-between gap-3 py-3 border-b border-stone-100 last:border-0" key={i.id}>
            <div className="text-[13.5px]">
              <b className="text-primary">{i.clientName || 'Client'}</b> · {i.displayNumber || i.number}
              <div className="text-[12.5px] text-stone-500">{statementLabel(i)} · created {fmtDate(i.createdAt)}</div>
              {i.status === 'void' && <div className="text-[12.5px] text-stone-500">Voided: {i.voidReason}</div>}
              {i.status === 'paid' && <div className="text-[12.5px] text-stone-500">Paid {fmtDate(i.paidAt)} by {((i.payments || []).slice(-1)[0] || {}).method}</div>}
            </div>
            <div className="text-right">
              <div><b className="text-primary">{usd(i.totalCents)}</b> <span className={`chip ${STATEMENT_CHIP[i.status] || ''}`}>{i.status === 'open' ? 'SENT' : String(i.status).toUpperCase()}</span></div>
              <div className="flex flex-wrap gap-2 justify-end mt-2">
                {i.format && <button className="btn ghost !py-1.5" onClick={() => openInvoicePdf(i).catch(e => setErr(e.message))}>View PDF</button>}
                {i.status === 'draft' && <button className="btn !py-1.5" disabled={busy === i.id} onClick={() => act(i, 'send')}>{i.format === 'carrier' ? 'Mark Sent' : 'Send to Patient'}</button>}
                {i.status === 'open' && <button className="btn !py-1.5" disabled={busy === i.id} onClick={() => {
                  const m = window.prompt('Paid how? Type check, cash or other.');
                  if (m && m.trim()) act(i, 'record-payment', { method: m.trim().toLowerCase(), reference: window.prompt('Check number or note (optional)') || '' });
                }}>Record Payment</button>}
                {(i.status === 'draft' || i.status === 'open') && <button className="btn ghost !py-1.5" disabled={busy === i.id} onClick={() => {
                  const r = window.prompt(i.format === 'carrier' ? 'Why void this invoice?' : 'Why void this statement? The patient sees it as cancelled.');
                  if (r && r.trim()) act(i, 'void', { reason: r.trim() });
                }}>Void</button>}
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
};

// ---- Generate Invoices: approved hours in, drafts out ----------------------
// The hours are the app's completed shifts (the payroll export's rows) or a
// file in that export's format. LTC carriers get one invoice per client per
// service date; families one per period. The server decides every number.
const GenerateInvoices = ({ data, reload }) => {
  const [source, setSource] = useState('app');
  const [range, setRange] = useState(() => (data.lastPeriod ? { ...data.lastPeriod } : { from: '', to: '' }));
  const [file, setFile] = useState(null);   // { name, text }
  const [preview, setPreview] = useState(null);
  const [rowErrors, setRowErrors] = useState(null);
  const [err, setErr] = useState('');
  const [msg, setMsg] = useState('');
  const [busy, setBusy] = useState('');
  const body = () => ({ source, from: range.from, to: range.to, ...(source === 'import' && file ? { csv: file.text, fileName: file.name } : {}) });
  const reset = () => { setPreview(null); setRowErrors(null); setErr(''); setMsg(''); };
  const run = (key, fn) => { setBusy(key); setErr(''); setMsg(''); setRowErrors(null);
    return fn().catch(e => { setErr(e.message); if (e.data && e.data.rowErrors) setRowErrors(e.data.rowErrors); return null; }).finally(() => setBusy('')); };
  const ready = range.from && range.to && (source === 'app' || file);
  return (
    <div className="card">
      <div className="card-h"><h2>Generate Invoices</h2></div>
      <div className="p-4 grid gap-4 text-[13.5px]">
        <p className="text-stone-500">Private home care only. Hours are billed as worked, with the client's daily minimum as its own line. LTC carriers get one invoice per client per date of service; families get one for the period.</p>
        <div className="flex flex-wrap gap-2">
          {[['app', 'Hours in the app'], ['import', 'Import an hours file']].map(([k, l]) => (
            <button key={k} onClick={() => { setSource(k); reset(); }}
              className={`px-3.5 py-1.5 rounded-full text-[13px] font-semibold border ${source === k ? 'bg-[#A9853A] border-[#A9853A] text-white' : 'bg-white border-stone-200 text-primary'}`}>{l}</button>
          ))}
        </div>
        {source === 'import' && (
          <Field label="Hours file">
            <p className="text-[12.5px] text-stone-500 mb-1.5">The payroll export from the Scheduling page, as downloaded or edited. Every row is checked; one bad row stops the import and is named.</p>
            <input type="file" accept=".csv,text/csv" onChange={e => {
              reset();
              const f = e.target.files && e.target.files[0];
              if (!f) { setFile(null); return; }
              f.text().then(text => setFile({ name: f.name, text })).catch(() => setErr('That file could not be read.'));
            }} />
          </Field>
        )}
        <Field label="Dates of service">
          <div className="flex flex-wrap items-center gap-2">
            <input className="inp !w-44" type="date" value={range.from} onChange={e => { setRange({ ...range, from: e.target.value }); reset(); }} />
            <span>to</span>
            <input className="inp !w-44" type="date" value={range.to} onChange={e => { setRange({ ...range, to: e.target.value }); reset(); }} />
            <button className="btn ghost" disabled={!ready || busy === 'preview'} onClick={() => run('preview', () => post('/api/gfc/admin/billing-invoices/preview', body())).then(r => r && setPreview(r))}>Preview</button>
          </div>
          {data.lastPeriod && <p className="text-[12.5px] text-stone-500 mt-1">Starts on the last finished two-week period, Monday through the second Sunday.</p>}
        </Field>
        {err && <div className="rounded-lg border border-red-200 bg-red-50 text-red-800 p-3">{err}
          {rowErrors && <ul className="list-disc pl-5 mt-2 text-[12.5px]">{rowErrors.map((r, k) => <li key={k}>Row {r.line}: {r.message}</li>)}</ul>}
        </div>}
        {msg && <div className="rounded-lg border border-emerald-200 bg-emerald-50 text-emerald-800 p-3">{msg}</div>}
        {preview && (
          <div className="border border-stone-200 rounded-lg p-3">
            {preview.invoices.length === 0 && <p className="text-stone-500">Nothing new to invoice in those dates.</p>}
            {preview.invoices.map(i => (
              <div key={i.displayNumber} className="py-2 border-b border-stone-100">
                <div className="flex justify-between gap-3"><span><b className="text-primary">{i.clientName}</b> · {i.displayNumber} · {i.format === 'carrier' ? `to ${i.billTo}` : `to ${i.billTo} (family)`}</span><b>{i.total}</b></div>
                {i.lines.map((l, k) => <div key={k} className={`flex justify-between text-[12.5px] ${l.minimum ? 'text-amber-800' : 'text-stone-500'}`}><span>{l.description}</span><span>{Number(l.hours).toFixed(2)} hrs · {l.amount}</span></div>)}
              </div>
            ))}
            {preview.skipped.length > 0 && (
              <div className="rounded-lg border border-amber-200 bg-amber-50 text-amber-900 p-3 mt-3 text-[12.5px]">
                <b>Not invoiced:</b>
                <ul className="list-disc pl-5">{preview.skipped.map((s, k) => <li key={k}>{s.clientName}: {s.reason}</li>)}</ul>
              </div>
            )}
            {preview.alreadyInvoiced > 0 && <p className="text-[12.5px] text-stone-500 mt-2">{preview.alreadyInvoiced} shift{preview.alreadyInvoiced === 1 ? ' is' : 's are'} already on an invoice and left off.</p>}
            {preview.invoices.length > 0 && (
              <div className="flex flex-wrap items-center justify-between gap-3 mt-3">
                <b>{preview.invoices.length} invoice{preview.invoices.length === 1 ? '' : 's'} · {usd(preview.totalCents)}</b>
                <button className="btn" disabled={busy === 'create'} onClick={() => run('create', () => post('/api/gfc/admin/billing-invoices', body())).then(r => {
                  if (r) { setPreview(null); setMsg(`${r.created.length} draft invoice${r.created.length === 1 ? '' : 's'} made. Check each under Statements, then send.`); reload(); }
                })}>Create Draft Invoices</button>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
};

// ---- One client: copay and Bill To ------------------------------------------
const EMPTY_BILL_TO = { type: 'family', payerId: '', insuredName: '', policyNumber: '', claimNumber: '', name: '', attn: '', addressLines: '', claimsEmail: '' };
const ClientBilling = ({ data, reload }) => {
  const [clientId, setClientId] = useState('');
  const [d, setD] = useState(null);
  const [copay, setCopay] = useState('');
  const [bt, setBt] = useState(EMPTY_BILL_TO);
  const [err, setErr] = useState('');
  const [msg, setMsg] = useState('');
  const [busy, setBusy] = useState('');
  useEffect(() => {
    setD(null); setErr(''); setMsg('');
    if (!clientId) return;
    call(`/api/gfc/admin/billing/${enc(clientId)}`)
      .then(r => {
        setD(r);
        setCopay(r.copayCents ? (r.copayCents / 100).toFixed(2) : '');

        setBt(b ? { ...EMPTY_BILL_TO, ...b, addressLines: (b.addressLines || []).join('\n'), claimsEmail: b.email || '' } : EMPTY_BILL_TO);
      })

  const run = (key, fn) => { setBusy(key); setErr(''); setMsg(''); return fn().catch(e => { setErr(e.message); return null; }).finally(() => setBusy('')); };
  const carriers = (data.payers || []).filter(p => !p.retired);

        <Field label="Client">
          <select className="inp max-w-sm" value={clientId} onChange={e => setClientId(e.target.value)}>
            <option value="">-- Choose a client --</option>
            {data.clients.map(c => <option key={c.id} value={c.id}>{c.name}{c.billToType ? '' : ' (no Bill To)'}</option>)}
          </select>
        </Field>
        {err && <div className="rounded-lg border border-red-200 bg-red-50 text-red-800 p-3">{err}</div>}
        {msg && <div className="rounded-lg border border-emerald-200 bg-emerald-50 text-emerald-800 p-3">{msg}</div>}
        {clientId && !d && !err && <p className="text-stone-500">Loading…</p>}
        {d && (
          <>
            <div>
              <span className="lblu block mb-1">Who home care is billed to</span>
              <p className="text-[12.5px] text-stone-500 mb-1.5">{d.rate ? `Agreed rate ${usd(Math.round(d.rate.hourlyRate * 100))}/hour, ${d.rate.dailyMinimumHours}-hour daily minimum.` : 'No agreed rate on file. Set it on the client\'s enrollment record first.'}</p>
              <div className="flex gap-2 mb-2">
                {[['carrier', 'LTC carrier'], ['family', 'Client or family']].map(([k, l]) => (
                  <button key={k} onClick={() => setBt({ ...bt, type: k })}
                    className={`px-3.5 py-1.5 rounded-full text-[13px] font-semibold border ${bt.type === k ? 'bg-[#A9853A] border-[#A9853A] text-white' : 'bg-white border-stone-200 text-primary'}`}>{l}</button>
                ))}
              </div>
              {bt.type === 'carrier' ? (
                <div className="grid gap-2 max-w-lg">
                  {carriers.length === 0 && <p className="text-amber-800 text-[12.5px]">No carriers on the payers list yet. Add one under Settings.</p>}
                  {d.ltcOnFile && <p className="text-[12.5px] text-stone-500">At enrollment the client listed {d.ltcOnFile.carrier || 'an LTC policy'}{d.ltcOnFile.policyNumber ? `, policy ${d.ltcOnFile.policyNumber}` : ''}{d.ltcOnFile.policyHolder ? `, held by ${d.ltcOnFile.policyHolder}` : ''}.</p>}
                  <select className="inp" value={bt.payerId} onChange={e => setBt({ ...bt, payerId: e.target.value })}>
                    <option value="">-- Choose the carrier --</option>
                    {carriers.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                  </select>
                  <input className="inp" placeholder="Insured's name" value={bt.insuredName} onChange={e => setBt({ ...bt, insuredName: e.target.value })} />
                  <input className="inp" placeholder="Policy #" value={bt.policyNumber} onChange={e => setBt({ ...bt, policyNumber: e.target.value })} />
                  <input className="inp" placeholder="Claim # (if the carrier gave one)" value={bt.claimNumber} onChange={e => setBt({ ...bt, claimNumber: e.target.value })} />
                </div>
              ) : (
                <div className="grid gap-2 max-w-lg">
                  <input className="inp" placeholder="Name billed" value={bt.name} onChange={e => setBt({ ...bt, name: e.target.value })} />
                  <input className="inp" placeholder="Attn (optional)" value={bt.attn} onChange={e => setBt({ ...bt, attn: e.target.value })} />
                  <textarea className="inp" rows={3} placeholder="Mailing address, one line each" value={bt.addressLines} onChange={e => setBt({ ...bt, addressLines: e.target.value })} />
                  <input className="inp" placeholder="Email (optional)" value={bt.claimsEmail} onChange={e => setBt({ ...bt, claimsEmail: e.target.value })} />
                </div>
              )}
              <button className="btn mt-2" disabled={busy === 'billto'} onClick={() => run('billto', () => call(`/api/gfc/admin/billing/${enc(clientId)}/bill-to`, { method: 'PUT', body: JSON.stringify(bt) })).then(r => { if (r) { setMsg('Bill To saved.'); reload(); } })}>Save Bill To</button>
            </div>
            <div>
              <span className="lblu block mb-1">Fixed copay per visit</span>
              <p className="text-[12.5px] text-stone-500 mb-1.5">Only for plans with a set copay. Leave blank for none: for Medicare the patient's share comes from the insurance payment, not from here.</p>
              <div className="flex flex-wrap items-center gap-2">
                <span>$</span><input className="inp !w-32" inputMode="decimal" value={copay} onChange={e => setCopay(e.target.value)} placeholder="none" />
                <button className="btn" disabled={busy === 'copay'} onClick={() => run('copay', () => call(`/api/gfc/admin/billing/${enc(clientId)}/copay`, { method: 'PUT', body: JSON.stringify({ copay: copay.trim() || null }) })).then(r => r && setMsg('Copay saved.'))}>Save Copay</button>
              </div>
            </div>
          </>
        )}
      </div>
    </div>
  );
};

// ---- The office's LTC carriers ----------------------------------------------
const EMPTY_PAYER = { name: '', attn: '', addressLines: '', claimsEmail: '', phone: '' };

  const [form, setForm] = useState(EMPTY_PAYER);

    setBusy(true); setErr('');
    const req = editing ? call(`/api/gfc/admin/billing-payers/${enc(editing)}`, { method: 'PUT', body: JSON.stringify(form) }) : post('/api/gfc/admin/billing-payers', form);
    req.then(() => { setForm(EMPTY_PAYER); setEditing(null); reload(); }).catch(e => setErr(e.message)).finally(() => setBusy(false));

  return (
    <div className="card mt-4">
      <div className="card-h"><h2>LTC Carriers</h2></div>

            <div><b className="text-primary">{p.name}</b>{p.attn ? ` · Attn: ${p.attn}` : ''}<div className="text-[12.5px] text-stone-500">{(p.addressLines || []).join(', ')}{p.claimsEmail ? ` · ${p.claimsEmail}` : ''}</div></div>
            <div className="flex gap-2">
              <button className="btn ghost !py-1.5" onClick={() => { setEditing(p.id); setForm({ ...EMPTY_PAYER, ...p, addressLines: (p.addressLines || []).join('\n') }); }}>Edit</button>
              <button className="btn ghost !py-1.5" onClick={() => { if (window.confirm(`Retire ${p.name}? Invoices already made keep their copy.`)) call(`/api/gfc/admin/billing-payers/${enc(p.id)}`, { method: 'PUT', body: JSON.stringify({ retired: true }) }).then(reload).catch(e => setErr(e.message)); }}>Retire</button>

        <div className="grid gap-2 max-w-lg">
          <span className="lblu">{editing ? 'Edit carrier' : 'Add a carrier'}</span>

          <input className="inp" placeholder="Attn (e.g. Claims Department)" value={form.attn} onChange={e => setForm({ ...form, attn: e.target.value })} />
          <textarea className="inp" rows={3} placeholder="Mailing address, one line each" value={form.addressLines} onChange={e => setForm({ ...form, addressLines: e.target.value })} />
          <input className="inp" placeholder="Claims email" value={form.claimsEmail} onChange={e => setForm({ ...form, claimsEmail: e.target.value })} />

          <div className="flex gap-2">
            <button className="btn" disabled={busy || !form.name.trim()} onClick={save}>{editing ? 'Save Carrier' : 'Add Carrier'}</button>
